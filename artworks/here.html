<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Here</title>
    <style>
        body { margin:0; overflow:hidden; background:#0a0a0a; display:flex; align-items:center; justify-content:center; height:100vh; }
        canvas { display:block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        const S = Math.min(innerWidth, innerHeight);
        const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(S, S);
        renderer.setClearColor(0x0a0a0a, 1);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);
        camera.position.z = 5;

        const R = 2;

        // Plasma RGB sphere
        const earthMat = new THREE.ShaderMaterial({
            uniforms: { lightness:{value:1.0}, time:{value:0.0} },
            vertexShader: `
                varying vec3 vN, vPos;
                void main(){
                    vN = normalize(normalMatrix * normal);
                    vPos = position;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
                }`,
            fragmentShader: `
                uniform float lightness, time;
                varying vec3 vN, vPos;
                float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
                float noise(vec2 p){
                    vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
                    return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
                }
                float fbm(vec2 p){
                    float v=0.0, a=0.5;
                    for(int i=0;i<5;i++){ v+=a*noise(p); p=p*2.03+vec2(0.12,-0.15); a*=0.5; }
                    return v;
                }
                void main(){
                    vec3 ld = normalize(vec3(-1,1,1));
                    float diff = max(dot(vN,ld),0.0);
                    float lit = 0.2 + diff*0.8;
                    float t = time*0.008;
                    vec3 p = vPos*2.0;
                    float n1 = fbm(p.xy+p.z+vec2(t, t*0.7));
                    float n2 = fbm(p.yz+p.x+vec2(t*0.6, -t*0.8));
                    float n3 = fbm(p.xz+p.y+vec2(-t*0.5, t*0.9));
                    float r = 0.5+0.5*sin(n1*6.28+t*2.0);
                    float g = 0.5+0.5*sin(n2*6.28+t*1.5+2.094);
                    float b = 0.5+0.5*sin(n3*6.28+t*1.8+4.189);
                    gl_FragColor = vec4(vec3(r,g,b)*lightness*lit, 1.0);
                }`
        });
        const earthMesh = new THREE.Mesh(new THREE.SphereGeometry(R,128,128), earthMat);
        scene.add(earthMesh);

        // Red smoke layers
        function createSmoke(radius, opacity, speed, scale, colorMix){
            return new THREE.Mesh(new THREE.SphereGeometry(radius,80,80), new THREE.ShaderMaterial({
                uniforms:{ time:{value:0}, intensity:{value:0}, smokeScale:{value:scale},
                    baseOpacity:{value:opacity}, colorMix:{value:colorMix}, speed:{value:speed} },
                vertexShader: `
                    varying vec3 vN; varying vec2 vUv;
                    void main(){ vN=normalize(normalMatrix*normal); vUv=uv;
                        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
                fragmentShader: `
                    uniform float time,intensity,smokeScale,baseOpacity,colorMix,speed;
                    varying vec3 vN; varying vec2 vUv;
                    float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
                    float noise(vec2 p){
                        vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
                        return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
                    }
                    float fbm(vec2 p){
                        float v=0.0,a=0.5;
                        for(int i=0;i<6;i++){v+=a*noise(p);p=p*2.03+vec2(0.13,-0.17);a*=0.48;}
                        return v;
                    }
                    float warp(vec2 p){
                        float t=time*speed;
                        vec2 q=vec2(fbm(p+vec2(t*0.3,t*0.1)),fbm(p+vec2(5.2+t*0.2,1.3-t*0.15)));
                        vec2 r=vec2(fbm(p+4.0*q+vec2(1.7+t*0.1,9.2-t*0.2)),fbm(p+4.0*q+vec2(8.3-t*0.15,2.8+t*0.1)));
                        return fbm(p+4.0*r);
                    }
                    void main(){
                        float diff=max(dot(vN,normalize(vec3(-1,1,1))),0.0);
                        float smoke=warp(vUv*smokeScale);
                        float wisps=smoothstep(0.3,0.7,smoke);
                        float dense=smoothstep(0.45,0.85,smoke);
                        vec3 col=mix(vec3(0.2,0,0),vec3(0.6,0.03,0),smoke);
                        col=mix(col,vec3(0.9,0.1,0.02),dense*0.7);
                        col=mix(col,vec3(1.0,0.25,0.05),pow(dense,3.0)*colorMix);
                        col*=0.4+diff*0.6;
                        col+=vec3(0.3,0.02,0)*dense*0.3;
                        float alpha=wisps*baseOpacity*intensity;
                        float rim=1.0-pow(abs(dot(vN,vec3(0,0,1))),0.8);
                        alpha*=0.5+rim*0.5;
                        gl_FragColor=vec4(col,alpha);
                    }`,
                transparent:true, depthWrite:false, side:THREE.DoubleSide
            }));
        }

        const smokeLayers = [
            createSmoke(R*1.02, 0.6,  0.008, 6.0, 0.3),
            createSmoke(R*1.05, 0.45, 0.006, 5.0, 0.5),
            createSmoke(R*1.09, 0.35, 0.010, 7.0, 0.7),
            createSmoke(R*1.14, 0.25, 0.012, 4.5, 0.9),
            createSmoke(R*1.20, 0.15, 0.015, 8.0, 1.0),
        ];
        smokeLayers.forEach(l => scene.add(l));

        // Atmosphere
        const atmoMat = new THREE.ShaderMaterial({
            uniforms:{ intensity:{value:0} },
            vertexShader:`varying vec3 vN;void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
            fragmentShader:`uniform float intensity;varying vec3 vN;void main(){
                float rim=pow(1.0-abs(dot(vN,vec3(0,0,1))),2.5);
                gl_FragColor=vec4(mix(vec3(0.39,0.59,1.0),vec3(0.8,0.05,0.0),intensity),rim*0.25);}`,
            transparent:true, side:THREE.BackSide
        });
        scene.add(new THREE.Mesh(new THREE.SphereGeometry(R*1.28,32,32), atmoMat));

        // Pulsing glow
        const glowMat = new THREE.ShaderMaterial({
            uniforms:{ intensity:{value:0}, time:{value:0} },
            vertexShader:`varying vec3 vN;void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
            fragmentShader:`uniform float intensity,time;varying vec3 vN;void main(){
                float rim=pow(1.0-abs(dot(vN,vec3(0,0,1))),3.0);
                float pulse=0.7+0.3*sin(time*0.025);
                gl_FragColor=vec4(0.6,0,0,rim*0.2*intensity*pulse);}`,
            transparent:true, side:THREE.BackSide
        });
        scene.add(new THREE.Mesh(new THREE.SphereGeometry(R*1.4,32,32), glowMat));

        // Blood particles
        const bloodParticles = [];
        const bGeo = new THREE.BufferGeometry();
        const bMat = new THREE.ShaderMaterial({
            uniforms:{ intensity:{value:0} },
            vertexShader:`attribute float bloodType;varying float vBT;uniform float intensity;
                void main(){vBT=bloodType;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
                gl_PointSize=(3.0+bloodType*3.0)*intensity;}`,
            fragmentShader:`varying float vBT;void main(){
                float d=length(gl_PointCoord-vec2(0.5));if(d>0.5)discard;
                vec3 c; float a;
                if(vBT<0.6){c=vec3(0.5,0,0);a=0.9;}else if(vBT<0.85){c=vec3(1,0.1,0.1);a=1.0;}else{c=vec3(0.2,0,0);a=0.8;}
                gl_FragColor=vec4(c,a*(1.0-d*2.0));}`,
            transparent:true, depthWrite:false
        });
        const maxP = 800;
        const bPos = new Float32Array(maxP*3), bTypes = new Float32Array(maxP);
        for(let i=0; i<maxP; i++){
            const t=Math.random()*Math.PI, p=Math.random()*Math.PI*2, r=2+(Math.random()-.5)*0.1;
            bPos[i*3]=r*Math.sin(t)*Math.cos(p);
            bPos[i*3+1]=r*Math.cos(t);
            bPos[i*3+2]=r*Math.sin(t)*Math.sin(p);
            bTypes[i]=Math.random();
            bloodParticles.push({theta:t,phi:p,radius:r,vTheta:(Math.random()-.5)*0.02,vPhi:(Math.random()-.5)*0.02});
        }
        bGeo.setAttribute('position', new THREE.BufferAttribute(bPos,3));
        bGeo.setAttribute('bloodType', new THREE.BufferAttribute(bTypes,1));
        const bloodPoints = new THREE.Points(bGeo, bMat);
        scene.add(bloodPoints);

        // Connections
        const maxC = 5000;
        const connPos = new Float32Array(maxC*6);
        const connGeo = new THREE.BufferGeometry();
        connGeo.setAttribute('position', new THREE.BufferAttribute(connPos,3));
        const connMat = new THREE.LineBasicMaterial({color:0x660000,transparent:true,opacity:0.6});
        const connLines = new THREE.LineSegments(connGeo, connMat);
        scene.add(connLines);

        // Lights
        scene.add(new THREE.AmbientLight(0x404040, 0.5));
        const pl = new THREE.PointLight(0xffffff,1,100);
        pl.position.set(-5,5,5);
        scene.add(pl);

        let intensity = 0, time = 0;

        function animate(){
            requestAnimationFrame(animate);
            time++;
            if(intensity < 1) intensity += 0.001;

            earthMesh.rotation.y = time * 0.003;
            bloodPoints.rotation.y = time * 0.003;

            earthMat.uniforms.lightness.value = 1 - intensity*0.7;
            earthMat.uniforms.time.value = time;
            atmoMat.uniforms.intensity.value = intensity;
            glowMat.uniforms.intensity.value = intensity;
            glowMat.uniforms.time.value = time;
            bMat.uniforms.intensity.value = intensity;

            // Smoke
            smokeLayers.forEach((l,i) => {
                l.material.uniforms.time.value = time;
                l.material.uniforms.intensity.value = intensity;
                l.rotation.y = time*0.001*(1+i*0.3)*(i%2===0?1:-1);
                l.rotation.x = Math.sin(time*0.0003+i)*0.05;
            });

            // Blood particles
            const pos = bGeo.attributes.position.array;
            const ac = Math.floor(maxP * intensity);
            for(let i=0; i<ac; i++){
                const p = bloodParticles[i];
                const n = Math.sin(p.theta*5+time*0.01)*Math.cos(p.phi*5+time*0.01);
                p.vTheta += n*0.0005; p.vPhi += n*0.0005;
                p.theta += p.vTheta; p.phi += p.vPhi;
                p.vTheta *= 0.98; p.vPhi *= 0.98;
                if(p.theta<0) p.theta=0; if(p.theta>Math.PI) p.theta=Math.PI;
                pos[i*3] = p.radius*Math.sin(p.theta)*Math.cos(p.phi);
                pos[i*3+1] = p.radius*Math.cos(p.theta);
                pos[i*3+2] = p.radius*Math.sin(p.theta)*Math.sin(p.phi);
            }
            bGeo.attributes.position.needsUpdate = true;

            // Connections
            const cp = connGeo.attributes.position.array;
            let ci = 0;
            const thresh = 1.2*(0.5+intensity*0.5);
            for(let i=0; i<ac && ci<maxC*6; i++){
                for(let j=i+1; j<ac && ci<maxC*6; j++){
                    const dx=pos[i*3]-pos[j*3], dy=pos[i*3+1]-pos[j*3+1], dz=pos[i*3+2]-pos[j*3+2];
                    if(Math.sqrt(dx*dx+dy*dy+dz*dz) < thresh){
                        cp[ci++]=pos[i*3]; cp[ci++]=pos[i*3+1]; cp[ci++]=pos[i*3+2];
                        cp[ci++]=pos[j*3]; cp[ci++]=pos[j*3+1]; cp[ci++]=pos[j*3+2];
                    }
                }
            }
            for(let i=ci; i<maxC*6; i++) cp[i]=0;
            connGeo.attributes.position.needsUpdate = true;
            connGeo.setDrawRange(0, ci/3);
            connMat.opacity = 0.6*intensity;

            renderer.render(scene, camera);
        }
        animate();

        addEventListener('resize', () => {
            const S2 = Math.min(innerWidth, innerHeight);
            camera.updateProjectionMatrix();
            renderer.setSize(S2, S2);
        });
    </script>
</body>
</html>
