<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ink and Blood</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="p"></canvas>
<script>
const c=document.getElementById('p'),x=c.getContext('2d',{alpha:0}),W=794,H=1123,LC=25;let s=1,t=0,wf=.018,wa=1,tf=.018,ta=1,rt=0,cv=0,tp=0,tr=0,nv=1,blh=0,drips=[];
const ts=[{f:'"Courier New",monospace',s:28,l:0}];let ct=0,nt=0;
const ms=[{l:.08,r:.92}];let cms=0,nms=0;
const gp=['triangles','circles','squares','hexagons','diamonds','waves','zigzag','crosses'];let cp='triangles',pr=0;
const pc=[{p:'#1a1a1a',s:'#0a0a0a'},{p:'#151515',s:'#050505'},{p:'#1c1c1c',s:'#0c0c0c'},{p:'#111111',s:'#010101'},{p:'#181818',s:'#080808'}];let cs=0;
const ls=[{c:'rgba(157,180,201,.45)',w:.8},{c:'rgba(201,157,180,.4)',w:1},{c:'rgba(180,201,157,.5)',w:.6},{c:'rgba(201,180,157,.45)',w:.9},{c:'rgba(157,201,180,.4)',w:.7}];let cl=0,nl=1;
const pv=[["All is chaos in the universe","The stars wander without clear law","Man seeks an austere meaning","In the tumult of the ether"," ","The wind scatters the thoughts","Like leaves in the tempest","Order is but a conquest","Over the entwined disorder"," ","Yet in this great torment","Fugitive beauty is born","The contemplative harmony","Of the dormant initial chaos"],["Chaos reigns supreme above","Celestial bodies drift astray","Humanity grasps for purpose","Within the swirling void"," ","Thoughts disperse like autumn","Caught in nature's fury","Structure emerges from nothing","Against entropy's pull"," ","Still within disorder","Grace finds its moment","Peace within the storm","From chaos springs creation"],["Everything falls apart endlessly","Stars forget their ancient paths","We search for solid ground","In an ocean of confusion"," ","Ideas scatter and dissolve","Like dust in violent winds","Meaning is carved from noise","Through sheer force of will"," ","But in this maelstrom","Something beautiful appears","A fleeting sense of balance","Born from pure disorder"],["The void speaks in riddles","Questions without answers","Truth dissolves on contact","With the light of scrutiny"," ","We build castles from sand","Knowing tides will come","Yet we build them anyway","Defiant against time"," ","In every ending lives","The seed of beginning","Destruction and creation","Dancing their eternal waltz"],["Patterns emerge unbidden","From the formless dark","Consciousness reaching out","To touch the infinite"," ","Entropy's cold embrace","Holds all we know","Yet life persists burning","A candle in the wind"," ","What meaning can exist","In temporary forms","Perhaps the meaning is","The asking itself"]];
let p=pv[0];
const go=['F','D-','F+','D','C-','C','C+','B-','B','B+','A-','A','A+'],co=['Off topic.','What is this?','Unclear.','Confusing.','Try again.','Needs work.','Getting there.','Good effort.','Nice work.','Good work!','Very good.','Excellent.','Well done!','Outstanding!'];
const gf=['"Brush Script MT",cursive','"Comic Sans MS",cursive','"Lucida Handwriting",cursive','"Bradley Hand",cursive','"Segoe Script",cursive','cursive'];
let gr='F',cmt='Off topic.',gz=42,gst='bold',gfo=gf[0],cz=20,cst='normal',cfo=gf[0],rs={r:201,g:48,b:48};
function resize(){c.width=innerWidth;c.height=innerHeight;s=Math.min(c.width/W,c.height/H)*.9}
window.addEventListener('resize',resize);resize();
function dp(xx,yy,pt,sz,r,col){x.save();x.translate(xx,yy);x.rotate(r);const{p:pr}=col;x.fillStyle=pr;x.strokeStyle=pr;x.lineWidth=1;switch(pt){case'triangles':x.beginPath();x.moveTo(0,-sz);x.lineTo(sz*.866,sz*.5);x.lineTo(-sz*.866,sz*.5);x.closePath();x.fill();break;case'circles':x.beginPath();x.arc(0,0,sz,0,Math.PI*2);x.fill();break;case'squares':x.fillRect(-sz,-sz,sz*2,sz*2);break;case'hexagons':x.beginPath();for(let i=0;i<6;i++){const a=Math.PI/3*i,hx=Math.cos(a)*sz,hy=Math.sin(a)*sz;i===0?x.moveTo(hx,hy):x.lineTo(hx,hy)}x.closePath();x.fill();break;case'diamonds':x.beginPath();x.moveTo(0,-sz*1.2);x.lineTo(sz,0);x.lineTo(0,sz*1.2);x.lineTo(-sz,0);x.closePath();x.fill();break;case'waves':x.beginPath();for(let i=-sz;i<=sz;i+=2){const w=Math.sin(i*.1)*sz*.5;i===-sz?x.moveTo(i,w):x.lineTo(i,w)}x.stroke();break;case'zigzag':x.beginPath();x.moveTo(-sz,-sz);x.lineTo(0,sz);x.lineTo(sz,-sz);x.stroke();break;case'crosses':x.beginPath();x.moveTo(-sz,0);x.lineTo(sz,0);x.moveTo(0,-sz);x.lineTo(0,sz);x.stroke()}x.restore()}
function dn(){x.fillStyle=`rgba(${rs.r},${rs.g},${rs.b},.85)`;x.font=`${gst} ${gz}px ${gfo}`;const gw=x.measureText(gr).width,nx=W*.85-gw/2;for(let j=0;j<gr.length;j++){const cx=nx+x.measureText(gr.substring(0,j)).width,cw=Math.sin(cx*wf+t*.012)*4,a=Math.cos(cx*wf+t*.012)*4*wf;x.save();x.translate(cx,80+cw);x.rotate(a);x.fillText(gr[j],0,0);x.restore()}x.font=`${cst} ${cz}px ${cfo}`;x.fillStyle=`rgba(${rs.r},${rs.g},${rs.b},.75)`;const cww=x.measureText(cmt).width,cxx=W*.85-cww/2;for(let j=0;j<cmt.length;j++){const xxx=cxx+x.measureText(cmt.substring(0,j)).width,w=Math.sin(xxx*wf+t*.012)*6,a=Math.cos(xxx*wf+t*.012)*6*wf;x.save();x.translate(xxx,115+w);x.rotate(a);x.fillText(cmt[j],0,0);x.restore()}}
function dm(){const lx=.08,rx=.92;x.strokeStyle='rgba(220,100,100,.35)';x.lineWidth=1;x.globalAlpha=.5;x.beginPath();x.moveTo(W*lx,0);x.lineTo(W*lx,H);x.stroke();x.beginPath();x.moveTo(W*rx,0);x.lineTo(W*rx,H);x.stroke();x.globalAlpha=1}
function draw(){const w=c.width,h=c.height;pr+=.005;x.fillStyle='#0a0a0a';x.fillRect(0,0,w,h);const col=pc[cs],sz=35,sp=70;for(let y=-sp;y<h+sp;y+=sp)for(let xxx=-sp;xxx<w+sp;xxx+=sp){const o=Math.sin(xxx*.005+y*.005+t*.005)*10,r=pr+(xxx+y)*.002,scc=.8+Math.sin(t*.01+xxx*.01)*.2;dp(xxx+o,y,cp,sz*scc,r,col)}x.save();x.translate(w/2,h/2);x.scale(s,s);x.translate(-W/2,-H/2);x.fillStyle='#f0f2f5';x.fillRect(0,0,W,H);const bw=80;const tg=x.createLinearGradient(0,0,0,bw);tg.addColorStop(0,'rgba(100,120,140,.25)');tg.addColorStop(1,'rgba(100,120,140,0)');x.fillStyle=tg;x.fillRect(0,0,W,bw);const bg=x.createLinearGradient(0,H-bw,0,H);bg.addColorStop(0,'rgba(100,120,140,0)');bg.addColorStop(1,'rgba(100,120,140,.25)');x.fillStyle=bg;x.fillRect(0,H-bw,W,bw);const lg=x.createLinearGradient(0,0,bw,0);lg.addColorStop(0,'rgba(100,120,140,.25)');lg.addColorStop(1,'rgba(100,120,140,0)');x.fillStyle=lg;x.fillRect(0,0,bw,H);const rg=x.createLinearGradient(W-bw,0,W,0);rg.addColorStop(0,'rgba(100,120,140,0)');rg.addColorStop(1,'rgba(100,120,140,.25)');x.fillStyle=rg;x.fillRect(W-bw,0,bw,H);if(blh<H*.7)blh+=.3;const blg=x.createLinearGradient(0,0,0,blh);blg.addColorStop(0,'rgba(180,20,20,.4)');blg.addColorStop(.3,'rgba(150,10,10,.3)');blg.addColorStop(1,'rgba(120,0,0,0)');x.fillStyle=blg;x.fillRect(0,0,W,blh);if(drips.length<20&&Math.random()<.1)drips.push({x:Math.random()*W,y:0,h:0});drips.forEach(d=>{if(d.h<blh)d.h+=.5;const dg=x.createLinearGradient(d.x,d.y,d.x,d.y+d.h);dg.addColorStop(0,'rgba(160,0,0,.2)');dg.addColorStop(1,'rgba(120,0,0,0)');x.fillStyle=dg;x.fillRect(d.x-2,d.y,4,d.h)});dm();dn();x.beginPath();x.rect(0,0,W,H);x.clip();const cL=ls[cl],nL=ls[nl],t1=tr?tp:0,lw=cL.w+(nL.w-cL.w)*t1;x.globalAlpha=0;for(let i=0;i<14;i++){let y=180+i*60;const cS=ts[ct],fs=cS.s,lss=cS.l,ff=cS.f,a=(6+Math.pow(y/H,1.8)*16)*wa;x.fillStyle='rgba(44,36,22,.82)';x.font=`bold ${fs}px ${ff}`;let txt='';if(tr){const old=pv[cv][i]||' ',nw=pv[nv][i]||' ';const ol=old.trim().length,nl=nw.trim().length;if(ol===0&&nl>0){const crr=~~(tp*nw.length);txt=nw.substring(0,crr)}else if(nl===0&&ol>0){const crr=~~(tp*old.length);txt=old.substring(crr)}else if(ol>0&&nl>0){const ml=Math.max(old.length,nw.length);const crr=~~(tp*ml);txt=nw.substring(0,crr)+old.substring(crr)}else{txt=' '}}else{txt=p[i]||' '}if(txt.trim()){x.globalAlpha=1;const tw=x.measureText(txt).width+(txt.length-1)*lss;let cx=(W-tw)/2;for(let j=0;j<txt.length;j++){const cwww=Math.sin(cx*wf+t*.012)*a,an=Math.cos(cx*wf+t*.012)*a*wf;x.save();x.translate(cx,y+cwww-4);x.rotate(an);x.fillText(txt[j],0,0);x.restore();cx+=x.measureText(txt[j]).width+lss}x.globalAlpha=1}}t++;rt++;wf+=(tf-wf)*.01;wa+=(ta-wa)*.01;if(rt>=600&&!tr){tr=1;tp=0;nv=(cv+1)%pv.length;nl=(cl+1)%ls.length;const gi=~~(Math.random()*go.length);gr=go[gi];cmt=co[gi];cp=gp[~~(Math.random()*gp.length)];cs=(cs+1)%pc.length;gz=32+~~(Math.random()*24);gst=Math.random()>.5?'bold':'normal';gfo=gf[~~(Math.random()*gf.length)];cz=18+~~(Math.random()*10);cst=Math.random()>.7?'italic':'normal';cfo=gf[~~(Math.random()*gf.length)];rs={r:180+~~(Math.random()*40),g:30+~~(Math.random()*40),b:30+~~(Math.random()*40)};tf=.012+Math.random()*.012;ta=.7+Math.random()*.6;rt=0}if(tr){tp+=.005;if(tp>=1){tr=0;cv=nv;p=pv[cv];cl=nl;tp=0}}x.restore();requestAnimationFrame(draw)}
draw();
</script>
</body>
</html>
