<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Train</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #0a0a12; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
  canvas { border-radius: 8px; width: min(100vw, 100vh); height: min(100vw, 100vh); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
c.width=800;c.height=800;
const W=c.width,H=c.height,vpX=W/2,vpY=H*0.38;
let time=0,trainZ=800;
const MIN_Z=-550,tunnelZ=800,rockEdgeY=H*0.60;
const raindrops=[];
for(let i=0;i<250;i++)raindrops.push({x:Math.random()*W,y:Math.random()*H,speed:4+Math.random()*6,len:10+Math.random()*20,w:0.5+Math.random()*1.2});
let shakeX=0,shakeY=0,shakeIntensity=0,lightningTimer=0,lightningFlash=0,lightningBolts=[],trainRumble=0;
const letterboxH=45;
function P(x,y,z){const s=600/(z+600);return{x:vpX+shakeX+(x-vpX)*s,y:vpY+shakeY+(y-vpY)*s,s};}
function SR(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280;};}

function updateCinematics(){
  const d=Math.abs(trainZ);
  if(trainZ<200&&trainZ>-200)shakeIntensity=Math.max(0,1-d/200)*2.5;else shakeIntensity*=0.92;
  shakeX=(Math.sin(time*23)*Math.cos(time*17))*shakeIntensity;
  shakeY=(Math.cos(time*19)*Math.sin(time*31))*shakeIntensity*0.6;
  lightningTimer-=0.016;
  if(lightningTimer<=0){lightningTimer=4+Math.random()*8;lightningFlash=1;lightningBolts=[];
    const bx=W*0.2+Math.random()*W*0.6;genBolt(bx,0,bx+(Math.random()-0.5)*80,rockEdgeY*0.7,4,lightningBolts);}
  lightningFlash*=0.88;
  if(trainZ<300&&trainZ>MIN_Z)trainRumble=Math.min(1,(300-trainZ)/400);else trainRumble*=0.95;
}
function genBolt(x1,y1,x2,y2,dep,arr){
  if(dep<=0){arr.push({x1,y1,x2,y2});return;}
  const mx=(x1+x2)/2+(Math.random()-0.5)*40*dep,my=(y1+y2)/2+(Math.random()-0.5)*20;
  genBolt(x1,y1,mx,my,dep-1,arr);genBolt(mx,my,x2,y2,dep-1,arr);
  if(Math.random()>0.6)genBolt(mx,my,mx+(Math.random()-0.5)*60*dep,my+20+Math.random()*40,dep-2,arr);
}

function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,rockEdgeY);const fl=lightningFlash*0.3;
  g.addColorStop(0,`rgb(${28+fl*120},${32+fl*120},${42+fl*130})`);
  g.addColorStop(0.4,`rgb(${35+fl*100},${40+fl*100},${50+fl*110})`);
  g.addColorStop(1,`rgb(${45+fl*80},${50+fl*80},${58+fl*90})`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,rockEdgeY+20);
  if(lightningFlash>0.05){ctx.save();
    lightningBolts.forEach(b=>{ctx.strokeStyle=`rgba(200,210,255,${lightningFlash*0.8})`;
      ctx.lineWidth=1+lightningFlash*2;ctx.shadowColor='rgba(150,170,255,0.8)';ctx.shadowBlur=15*lightningFlash;
      ctx.beginPath();ctx.moveTo(b.x1,b.y1);ctx.lineTo(b.x2,b.y2);ctx.stroke();});ctx.restore();}
}
function drawClouds(){
  const rC=SR(1234);
  for(let L=0;L<3;L++)for(let i=0;i<8;i++){
    const cx=(rC()*1.4-0.2)*W+Math.sin(time*(0.15+L*0.05)+i*0.7)*20,cy=120-30*L-rC()*60+Math.sin(time*0.2+i)*5;
    const cw=100+rC()*180+L*30,ch=25+rC()*35+L*8,ba=0.25+L*0.1,cl=ba+lightningFlash*0.5;
    const br=120+L*25+~~(lightningFlash*130),bg=125+L*25+~~(lightningFlash*130),bb=140+L*20+~~(lightningFlash*130);
    const cg=ctx.createRadialGradient(cx,cy,cw*0.1,cx,cy,cw);
    cg.addColorStop(0,`rgba(${br},${bg},${bb},${cl})`);cg.addColorStop(0.4,`rgba(${br-20},${bg-20},${bb-15},${cl*0.7})`);
    cg.addColorStop(0.7,`rgba(${br-40},${bg-40},${bb-30},${cl*0.3})`);cg.addColorStop(1,'rgba(60,65,75,0)');
    ctx.fillStyle=cg;ctx.beginPath();ctx.ellipse(cx,cy,cw,ch,0,0,Math.PI*2);ctx.fill();}
}
function drawGround(){
  const g=ctx.createLinearGradient(0,rockEdgeY+10,0,H);const fl=lightningFlash*0.15;
  g.addColorStop(0,`rgb(${42+~~(fl*80)},${74+~~(fl*80)},${40+~~(fl*60)})`);
  g.addColorStop(0.15,`rgb(${30+~~(fl*60)},${58+~~(fl*60)},${28+~~(fl*40)})`);
  g.addColorStop(0.5,`rgb(${24+~~(fl*40)},${41+~~(fl*40)},${22+~~(fl*30)})`);
  g.addColorStop(1,`rgb(${18+~~(fl*20)},${31+~~(fl*20)},${16+~~(fl*15)})`);
  ctx.fillStyle=g;ctx.fillRect(0,rockEdgeY+10,W,H-rockEdgeY-10);
  const rF=SR(888);
  for(let i=0;i<40;i++){const fx=rF()*W,fy=rockEdgeY+20+rF()*(H-rockEdgeY-40),fs=2+rF()*3;
    ctx.strokeStyle='rgba(60,80,50,0.6)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(fx,fy);ctx.lineTo(fx+(rF()-0.5)*2,fy-fs*3);ctx.stroke();
    const pet=5,flY=fy-fs*3,cols=[[180,180,200],[150,150,170],[140,140,160],[160,160,180],[170,170,190]],co=cols[~~(rF()*cols.length)];
    for(let p=0;p<pet;p++){const a=p*Math.PI*2/pet,px=fx+Math.cos(a)*fs*0.7,py=flY+Math.sin(a)*fs*0.7;
      ctx.fillStyle=`rgba(${co[0]},${co[1]},${co[2]},${0.4+rF()*0.2})`;ctx.beginPath();ctx.arc(px,py,fs*0.5,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle=`rgba(${120+~~(rF()*20)},${120+~~(rF()*20)},${100+~~(rF()*20)},0.5)`;ctx.beginPath();ctx.arc(fx,flY,fs*0.4,0,Math.PI*2);ctx.fill();}
}
function drawRockWall(){
  const r2=SR(444),r3=SR(555),r4=SR(666),r5=SR(777),rE=SR(111),rV=SR(222);
  const rB=rockEdgeY+10,eP=[];
  for(let x=0;x<=W;x+=4)eP.push({x,y:rockEdgeY+(rE()-0.4)*18});
  const fl=lightningFlash*0.12;
  const g=ctx.createLinearGradient(0,0,0,rB);
  g.addColorStop(0,`rgb(${74+~~(fl*150)},${74+~~(fl*150)},${66+~~(fl*130)})`);
  g.addColorStop(0.15,`rgb(${85+~~(fl*130)},${82+~~(fl*130)},${72+~~(fl*110)})`);
  g.addColorStop(0.3,`rgb(${74+~~(fl*110)},${72+~~(fl*110)},${64+~~(fl*90)})`);
  g.addColorStop(0.5,`rgb(${62+~~(fl*90)},${60+~~(fl*90)},${53+~~(fl*70)})`);
  g.addColorStop(0.7,`rgb(${53+~~(fl*70)},${51+~~(fl*70)},${44+~~(fl*55)})`);
  g.addColorStop(1,`rgb(${40+~~(fl*50)},${38+~~(fl*50)},${31+~~(fl*40)})`);
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,0);ctx.lineTo(W,rockEdgeY);
  eP.slice().reverse().forEach(p=>ctx.lineTo(p.x,p.y));ctx.closePath();ctx.fill();
  for(let y=20;y<rB;y+=15+r2()*25){ctx.strokeStyle=`rgba(0,0,0,${0.05+r2()*0.1})`;ctx.lineWidth=0.5+r2()*1.5;
    ctx.beginPath();ctx.moveTo(0,y);let cx=0;while(cx<W){cx+=20+r2()*40;ctx.lineTo(cx,y+(r2()-0.5)*8);}ctx.stroke();}
  for(let i=0;i<15;i++){const cx=r3()*W,cy=r3()*rB*0.6,len=40+r3()*100;
    ctx.strokeStyle=`rgba(0,0,0,${0.08+r3()*0.12})`;ctx.lineWidth=0.5+r3();ctx.beginPath();ctx.moveTo(cx,cy);let py=cy;
    for(let j=0;j<6;j++){py+=len/6;ctx.lineTo(cx+(r3()-0.5)*15,py);}ctx.stroke();}
  for(let i=0;i<40;i++){const px=r4()*W,py=r4()*rB,pw=30+r4()*80,ph=15+r4()*40;
    ctx.fillStyle=r4()>0.5?`rgba(255,255,255,${0.02+r4()*0.04})`:`rgba(0,0,0,${0.03+r4()*0.06})`;ctx.fillRect(px,py,pw,ph);}
  for(let i=0;i<20;i++){const mx=r5()*W,my=rockEdgeY*0.4+r5()*rockEdgeY*0.55,ms=8+r5()*25;
    ctx.fillStyle=`rgba(${40+~~(r5()*30)},${60+~~(r5()*40)},${30+~~(r5()*20)},${0.15+r5()*0.2})`;
    ctx.beginPath();ctx.ellipse(mx,my,ms,ms*0.5,r5()*Math.PI,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='rgba(0,0,0,0.15)';ctx.fillRect(0,0,W,5);
  for(let i=0;i<50;i++){const x=rV()*W,bEY=eP[Math.min(~~(x/4),eP.length-1)].y,bs=4+rV()*10;
    ctx.fillStyle=`rgba(${35+~~(rV()*30)},${70+~~(rV()*40)},${25+~~(rV()*15)},${0.6+rV()*0.4})`;
    ctx.beginPath();ctx.ellipse(x,bEY,bs,bs*0.6,0,0,Math.PI*2);ctx.fill();}
  if(lightningFlash>0.1){ctx.save();ctx.globalAlpha=lightningFlash*0.3;
    for(let i=0;i<20;i++){const rx=rV()*W,ry=rV()*rB,rl=15+rV()*30;
      ctx.strokeStyle='rgba(200,210,230,0.4)';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx-1,ry+rl);ctx.stroke();}ctx.restore();}
  const rG=SR(999);
  for(let i=0;i<150;i++){const gx=rG()*W,gy=rockEdgeY+5+rG()*25,gh=12+rG()*28,gw=1.5+rG()*2.5,sw=Math.sin(time*2+gx*0.01)*3;
    ctx.strokeStyle=`rgba(${25+~~(rG()*25)},${55+~~(rG()*30)},${20+~~(rG()*15)},${0.6+rG()*0.4})`;ctx.lineWidth=gw;
    ctx.beginPath();ctx.moveTo(gx,gy);ctx.quadraticCurveTo(gx+(rG()-0.5)*10+sw,gy-gh*0.6,gx+(rG()-0.5)*15+sw*1.5,gy-gh);ctx.stroke();}
}
function drawRails(zS,zE){
  const steps=100,bY=H*1.15,rg=60,sw=95,rG=SR(321),rS=SR(654);
  for(let i=0;i<steps;i++){const z=zS+(zE-zS)*(i/steps),zN=zS+(zE-zS)*((i+1)/steps);
    const bL=P(vpX-sw-25,bY,z),bR=P(vpX+sw+25,bY,z),bLN=P(vpX-sw-25,bY,zN),bRN=P(vpX+sw+25,bY,zN);
    const sh=85+~~(rG()*15);ctx.fillStyle=`rgb(${sh},${sh-10},${sh-20})`;
    ctx.beginPath();ctx.moveTo(bL.x,bL.y);ctx.lineTo(bR.x,bR.y);ctx.lineTo(bRN.x,bRN.y);ctx.lineTo(bLN.x,bLN.y);ctx.fill();
    if(i%3===0)for(let cc=0;cc<8;cc++){const cx=bL.x+(bR.x-bL.x)*(0.2+rG()*0.6),cy=bL.y+(rG()-0.5)*4,cs=Math.max(1,2+rG()*3)*bL.s,csh=70+~~(rG()*30);
      ctx.fillStyle=`rgb(${csh},${csh-8},${csh-15})`;ctx.beginPath();ctx.arc(cx,cy,cs,0,Math.PI*2);ctx.fill();}}
  for(let i=0;i<steps;i++){const z=zS+(zE-zS)*(i/steps),rL=P(vpX-rg,bY,z);
    if(i%2===0){const sL=P(vpX-sw,bY-1,z),sR=P(vpX+sw,bY-1,z),slH=Math.max(1,3*rL.s),ws=65+~~(rS()*20);
      ctx.fillStyle=`rgb(${ws+10},${ws-10},${ws-30})`;ctx.fillRect(sL.x,sL.y-slH,sR.x-sL.x,slH*2);
      ctx.fillStyle=`rgba(${ws+40},${ws+10},${ws-15},0.5)`;ctx.fillRect(sL.x,sL.y-slH,sR.x-sL.x,slH*0.6);
      [-rg,rg].forEach(o=>{const cp=P(vpX+o,bY-1,z),cs=Math.max(1,2.5*rL.s);ctx.fillStyle='#2a2a2a';ctx.fillRect(cp.x-cs,cp.y-cs*0.8,cs*2,cs*1.6);});}}
  for(let i=0;i<steps-1;i++){const z=zS+(zE-zS)*(i/steps),zN=zS+(zE-zS)*((i+1)/steps);
    [-rg,rg].forEach(o=>{const r=P(vpX+o,bY,z),rN=P(vpX+o,bY,zN),rw=Math.max(1,5*r.s);
      ctx.strokeStyle='#454545';ctx.lineWidth=rw;ctx.beginPath();ctx.moveTo(r.x,r.y+0.5);ctx.lineTo(rN.x,rN.y+0.5);ctx.stroke();
      ctx.strokeStyle='#888';ctx.lineWidth=rw*0.7;ctx.beginPath();ctx.moveTo(r.x,r.y-1);ctx.lineTo(rN.x,rN.y-1);ctx.stroke();
      ctx.strokeStyle=`rgba(200,210,230,${0.4+lightningFlash*0.4})`;ctx.lineWidth=Math.max(0.3,rw*0.25);
      ctx.beginPath();ctx.moveTo(r.x-rw*0.1,r.y-1.5);ctx.lineTo(rN.x-rw*0.1,rN.y-1.5);ctx.stroke();});}
  const rP=SR(4321);
  for(let i=0;i<8;i++){const pz=200+rP()*1500,px=vpX+(rP()-0.5)*120,pp=P(px,bY+5,pz),ps=Math.max(3,18*pp.s);
    const pg=ctx.createRadialGradient(pp.x,pp.y,0,pp.x,pp.y,ps);
    pg.addColorStop(0,`rgba(140,160,180,${0.08+lightningFlash*0.15})`);pg.addColorStop(1,'rgba(100,120,140,0)');
    ctx.fillStyle=pg;ctx.beginPath();ctx.ellipse(pp.x,pp.y,ps,ps*0.3,0,0,Math.PI*2);ctx.fill();}
}

const CAT_BY=H*0.95,CAT_SP=400,CAT_PX=vpX+240,CAT_PH=350,CAT_WY=CAT_BY-CAT_PH+30;

function drawCatenary(zS,zE){
  for(let z=zE;z>=zS;z-=CAT_SP){
    if(z>=tunnelZ)continue;
    const pB=P(CAT_PX,CAT_BY,z),pT=P(CAT_PX,CAT_BY-CAT_PH,z),s=pB.s;if(s<0.02)continue;
    const pBW=14*s;
    // Steampunk base plate
    const bpW=24*s;
    ctx.fillStyle='#3a3530';ctx.fillRect(pB.x-bpW,pB.y-8*s,bpW*2,16*s);
    ctx.strokeStyle='#2a2520';ctx.lineWidth=1;ctx.strokeRect(pB.x-bpW,pB.y-8*s,bpW*2,16*s);
    for(let r=-1;r<=1;r+=2){
      ctx.fillStyle='#8a7a60';ctx.beginPath();ctx.arc(pB.x+r*bpW*0.7,pB.y,2*s,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#a89870';ctx.beginPath();ctx.arc(pB.x+r*bpW*0.7-0.5*s,pB.y-0.5*s,1*s,0,Math.PI*2);ctx.fill();}
    // Lattice pole
    const segs=8;
    for(let i=0;i<segs;i++){
      const t0=i/segs,t1=(i+1)/segs;
      const y0=pB.y+(pT.y-pB.y)*t0,y1=pB.y+(pT.y-pB.y)*t1;
      const w0=pBW*(1-t0*0.4),w1=pBW*(1-t1*0.4);
      const x0=pB.x+(pT.x-pB.x)*t0,x1=pB.x+(pT.x-pB.x)*t1;
      ctx.strokeStyle='#5a5248';ctx.lineWidth=Math.max(1.5,3*s);
      ctx.beginPath();ctx.moveTo(x0-w0,y0);ctx.lineTo(x1-w1,y1);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x0+w0,y0);ctx.lineTo(x1+w1,y1);ctx.stroke();
      ctx.strokeStyle='#4a4238';ctx.lineWidth=Math.max(0.8,1.5*s);
      ctx.beginPath();ctx.moveTo(x0-w0,y0);ctx.lineTo(x1+w1,y1);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x0+w0,y0);ctx.lineTo(x1-w1,y1);ctx.stroke();
      ctx.strokeStyle='#5a5248';ctx.lineWidth=Math.max(0.8,1.5*s);
      ctx.beginPath();ctx.moveTo(x0-w0,y0);ctx.lineTo(x0+w0,y0);ctx.stroke();
      if(i%2===0)for(let r=-1;r<=1;r+=2){
        ctx.fillStyle='#9a8a68';ctx.beginPath();ctx.arc(x0+r*w0,y0,1.2*s,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#b8a878';ctx.beginPath();ctx.arc(x0+r*w0-0.3*s,y0-0.3*s,0.6*s,0,Math.PI*2);ctx.fill();}
    }
    ctx.strokeStyle='rgba(180,170,140,0.2)';ctx.lineWidth=Math.max(0.5,1*s);
    for(let i=0;i<segs;i++){const t0=i/segs,t1=(i+1)/segs;
      const y0=pB.y+(pT.y-pB.y)*t0,y1=pB.y+(pT.y-pB.y)*t1,w0=pBW*(1-t0*0.4),w1=pBW*(1-t1*0.4);
      const x0=pB.x+(pT.x-pB.x)*t0,x1=pB.x+(pT.x-pB.x)*t1;
      ctx.beginPath();ctx.moveTo(x0-w0,y0);ctx.lineTo(x1-w1,y1);ctx.stroke();}
  }
}

function drawCatenaryTop(zS,zE){
  const wireY=CAT_BY-180-18-25;
  const maxZ=Math.min(zE,tunnelZ),minZ=Math.max(zS,-300),wSt=60;
  ctx.strokeStyle='#666';ctx.lineWidth=1.5;ctx.beginPath();let f=true;
  for(let i=0;i<=wSt;i++){const z=minZ+(maxZ-minZ)*(i/wSt);if((z+600)<30)continue;
    const p=P(vpX,wireY-15,z);if(f){ctx.moveTo(p.x,p.y);f=false;}else ctx.lineTo(p.x,p.y);}ctx.stroke();
  ctx.strokeStyle='#555';ctx.lineWidth=1.2;ctx.beginPath();f=true;
  for(let i=0;i<=wSt;i++){const z=minZ+(maxZ-minZ)*(i/wSt);if((z+600)<30)continue;
    const sag=Math.sin(((z-zS)%CAT_SP)/CAT_SP*Math.PI)*10;
    const p=P(vpX,wireY+sag,z);if(f){ctx.moveTo(p.x,p.y);f=false;}else ctx.lineTo(p.x,p.y);}ctx.stroke();
  for(let z=zE;z>=zS;z-=CAT_SP){
    if(z>=tunnelZ)continue;
    const pB=P(CAT_PX,CAT_BY,z),pT=P(CAT_PX,CAT_BY-CAT_PH,z),s=pB.s;if(s<0.02)continue;
    const pTW=8*s;
    const armEnd=P(vpX,CAT_BY-CAT_PH+5,z);
    // Steampunk arm with cross braces
    ctx.strokeStyle='#5a5248';ctx.lineWidth=Math.max(2.5,7*s);
    ctx.beginPath();ctx.moveTo(pT.x,pT.y);ctx.lineTo(armEnd.x,armEnd.y);ctx.stroke();
    const armEnd2=P(vpX,CAT_BY-CAT_PH+15,z);
    ctx.strokeStyle='#4a4238';ctx.lineWidth=Math.max(1.5,4*s);
    ctx.beginPath();ctx.moveTo(pT.x,pT.y+8*s);ctx.lineTo(armEnd2.x,armEnd2.y);ctx.stroke();
    const armLen=armEnd.x-pT.x;
    for(let b=0;b<5;b++){const bt=b/5,x0=pT.x+armLen*bt,x1=pT.x+armLen*(bt+0.2),yt=pT.y,yb=pT.y+8*s;
      ctx.strokeStyle='#4a4238';ctx.lineWidth=Math.max(0.6,1.2*s);
      ctx.beginPath();ctx.moveTo(x0,yt);ctx.lineTo(x1,yb);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x1,yt);ctx.lineTo(x0,yb);ctx.stroke();
      ctx.fillStyle='#9a8a68';ctx.beginPath();ctx.arc(x0,yt,1*s,0,Math.PI*2);ctx.fill();}
    // Finial
    ctx.fillStyle='#8a7a60';ctx.beginPath();ctx.arc(pT.x,pT.y-3*s,3*s,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#a89870';ctx.beginPath();ctx.arc(pT.x-0.8*s,pT.y-4*s,1.5*s,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#5a5248';ctx.fillRect(pT.x-pTW*0.8,pT.y-1*s,pTW*1.6,2*s);
    // Diagonal brace + gusset
    const bS=P(CAT_PX,CAT_BY-CAT_PH+140,z);
    ctx.strokeStyle='#5a5248';ctx.lineWidth=Math.max(2,5*s);
    ctx.beginPath();ctx.moveTo(bS.x,bS.y);ctx.lineTo(armEnd.x,armEnd.y);ctx.stroke();
    ctx.fillStyle='#4a4238';ctx.beginPath();
    ctx.moveTo(armEnd.x-4*s,armEnd.y-4*s);ctx.lineTo(armEnd.x+6*s,armEnd.y);ctx.lineTo(armEnd.x-4*s,armEnd.y+6*s);ctx.closePath();ctx.fill();
    ctx.fillStyle='#9a8a68';ctx.beginPath();ctx.arc(armEnd.x-1*s,armEnd.y+1*s,1.2*s,0,Math.PI*2);ctx.fill();
    // Dropper to wire + insulator
    const armBot=P(vpX,wireY-15,z);

  if(trainZ>tunnelZ)drawTrain(trainZ,0);
  drawTunnelHole();
  if(trainZ<=tunnelZ){const pr=Math.min(1,(tunnelZ-trainZ)/400);drawTrain(trainZ,0.85*(1-pr));}
  if(trainZ<=tunnelZ&&trainZ>tunnelZ-500){
    const pr=(tunnelZ-trainZ)/500,tT2=P(vpX,vpY+40,tunnelZ),tBL2=P(vpX-130,H*0.95,tunnelZ);
    const aT2=tT2.y+10*tT2.s,tcx=vpX,tcy=(aT2+tBL2.y)/2,ra=(1-pr)*0.35;
    if(ra>0.01){ctx.save();ctx.globalCompositeOperation='screen';
      for(let i=0;i<14;i++){const a=-Math.PI*0.45+(i/13)*Math.PI*0.9,rl=200+Math.sin(time*2+i)*40,rw=12+Math.sin(time*1.5+i*0.7)*4;
        const rx=tcx+Math.cos(a)*15,ry=tcy+Math.sin(a)*8,ex=tcx+Math.cos(a)*rl*pr,ey=tcy+Math.sin(a)*rl*0.6*pr;
        const rg=ctx.createLinearGradient(rx,ry,ex,ey);
        rg.addColorStop(0,`rgba(255,240,180,${ra})`);rg.addColorStop(0.4,`rgba(255,230,150,${ra*0.5})`);rg.addColorStop(1,'rgba(255,220,130,0)');
        ctx.fillStyle=rg;ctx.beginPath();ctx.moveTo(rx-rw*0.3,ry);ctx.lineTo(ex-rw*pr*2,ey);ctx.lineTo(ex+rw*pr*2,ey);ctx.lineTo(rx+rw*0.3,ry);ctx.closePath();ctx.fill();}
      const glR=80*(1-pr);if(glR>2){const gl=ctx.createRadialGradient(tcx,tcy,0,tcx,tcy,glR);
        gl.addColorStop(0,`rgba(255,245,200,${(1-pr)*0.6})`);gl.addColorStop(0.4,`rgba(255,235,170,${(1-pr)*0.3})`);gl.addColorStop(1,'rgba(255,220,130,0)');
        ctx.fillStyle=gl;ctx.beginPath();ctx.arc(tcx,tcy,glR,0,Math.PI*2);ctx.fill();}ctx.restore();}}
  drawCatenaryTop(0,2500);drawRain();drawFog();drawCinematic();
  requestAnimationFrame(animate);
}
animate();
</script>
