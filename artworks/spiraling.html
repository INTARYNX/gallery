<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiraling</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #000;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 1;
            position: relative;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="bgCanvas"></canvas>
        <canvas id="canvas"></canvas>
    </div>
    <script>
        const bgCanvas = document.getElementById('bgCanvas');
        const canvas = document.getElementById('canvas');
        const gl = bgCanvas.getContext('webgl');
        const ctx = canvas.getContext('2d');
        
        function resize() {
            const container = canvas.parentElement;
            const size = container.offsetWidth;
            bgCanvas.width = size;
            bgCanvas.height = size;
            canvas.width = size;
            canvas.height = size;
            gl.viewport(0, 0, size, size);
        }
        
        resize();
        window.addEventListener('resize', resize);
        
        const vertShader = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vertShader, `
            attribute vec2 pos;
            void main() {
                gl_Position = vec4(pos, 0.0, 1.0);
            }
        `);
        gl.compileShader(vertShader);
        
        const fragShader = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fragShader, `
            precision mediump float;
            uniform vec2 res;
            uniform float time;
            
            void main() {
                vec2 uv = gl_FragCoord.xy / res;
                vec2 p = (gl_FragCoord.xy - res * 0.5) / res.y;
                
                float dist = length(p);
                float angle = atan(p.y, p.x);
                
                float plasma = sin(dist * 10.0 + time * 0.5) * 
                               sin(angle * 3.0 + time * 2.0) * 
                               cos(uv.x * 15.0 + uv.y * 15.0 + time);
                
                vec3 col = vec3(0.08, 0.04, 0.12) + plasma * vec3(0.02, 0.015, 0.025);
                gl_FragColor = vec4(col, 1.0);
            }
        `);
        gl.compileShader(fragShader);
        
        const prog = gl.createProgram();
        gl.attachShader(prog, vertShader);
        gl.attachShader(prog, fragShader);
        gl.linkProgram(prog);
        gl.useProgram(prog);
        
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
        
        const posLoc = gl.getAttribLocation(prog, 'pos');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);
        
        const resLoc = gl.getUniformLocation(prog, 'res');
        const timeLoc = gl.getUniformLocation(prog, 'time');
        
        const numCircles = 1000;
        let rotationX = 0;
        let rotationY = 0;
        let rotationZ = 0;
        let hueOffset = 0;
        let time = 0;
        const trail = [];
        const maxTrailLength = 300;
        
        const copperColors = [
            [0, 0, 68],
            [0, 34, 136],
            [0, 102, 204],
            [68, 170, 255],
            [136, 204, 255],
            [204, 238, 255],
            [255, 255, 255],
            [255, 221, 204],
            [255, 153, 136],
            [238, 85, 68],
            [170, 34, 34],
            [102, 0, 0]
        ];
        
        function draw() {
            gl.uniform2f(resLoc, bgCanvas.width, bgCanvas.height);
            gl.uniform1f(timeLoc, time);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const maxRadius = canvas.width * 0.375;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < trail.length; i++) {
                const alpha = i / trail.length;
                ctx.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.3})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(trail[i].x, trail[i].y, trail[i].size, 0, Math.PI * 2);
                ctx.stroke();
            }
            
            const positions = [];
            
            for (let i = 0; i < numCircles; i++) {
                const angle = i * 0.2 + rotationZ;
                const t = i / numCircles;
                const radius = t * maxRadius;
                const zHeight = Math.sin(time + t * Math.PI * 2) * maxRadius * 0.5;
                
                let x3d = Math.cos(angle) * radius;
                let y3d = Math.sin(angle) * radius;
                let z3d = zHeight;
                
                const cosX = Math.cos(rotationX);
                const sinX = Math.sin(rotationX);
                let y3dTemp = y3d * cosX - z3d * sinX;
                let z3dTemp = y3d * sinX + z3d * cosX;
                y3d = y3dTemp;
                z3d = z3dTemp;
                
                const cosY = Math.cos(rotationY);
                const sinY = Math.sin(rotationY);
                let x3dTemp = x3d * cosY + z3d * sinY;
                z3dTemp = -x3d * sinY + z3d * cosY;
                x3d = x3dTemp;
                z3d = z3dTemp;
                
                const x = centerX + x3d;
                const y = centerY + y3d;
                const depth = z3d / maxRadius;
                
                const colorIndex = Math.floor(((i + hueOffset) % copperColors.length));
                const color = copperColors[colorIndex];
                const depthBrightness = 0.7 + depth * 0.3;
                ctx.fillStyle = `rgb(${color[0] * depthBrightness}, ${color[1] * depthBrightness}, ${color[2] * depthBrightness})`;
                
                const size = (1.5 + Math.sin(i * 0.1) * 1) * (1 + depth * 0.3);
                
                positions.push({x, y, size, depth});
                
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
            
            trail.push(...positions);
            if (trail.length > maxTrailLength) {
                trail.splice(0, trail.length - maxTrailLength);
            }
            
            rotationX += 0.005 + Math.sin(time * 0.3) * 0.008;
            rotationY += 0.008 + Math.cos(time * 0.2) * 0.01;
            rotationZ += 0.015 + Math.sin(time * 0.25) * 0.012;
            hueOffset = (hueOffset + 0.3 + Math.sin(time * 0.1) * 0.4) % copperColors.length;
            time += 0.01;
            requestAnimationFrame(draw);
        }
        
        draw();
    </script>
</body>
</html>
