<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wireframe</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        canvas {
            border: 1px solid #333;
            max-width: 100%;
            max-height: 100%;
            width: min(90vmin, 600px);
            height: min(90vmin, 600px);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 600;
        canvas.height = 600;

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        let angleX = 0;
        let angleY = 0;
        let angleZ = 0;
        let hue = 0;
        
        let currentPattern = null;
        let nextPattern = null;
        let transitionStart = Date.now();
        let currentSeed = Math.random() * 1000;
        const TRANSITION_DURATION = 5000;

        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function seededRandom(seed) {
            const x = Math.sin(seed) * 10000;
            return x - Math.floor(x);
        }

        function generatePattern(seed) {
            const pattern = {
                offsetX: (seededRandom(seed * 0.5) - 0.5) * canvas.width * 0.4,
                offsetY: (seededRandom(seed * 0.6) - 0.5) * canvas.height * 0.4,
                scale: 0.5 + seededRandom(seed * 0.7) * 0.8,
                rotation: seededRandom(seed * 0.8) * Math.PI * 2,
                blobs: []
            };

            const numBlobs = 12;
            
            for (let i = 0; i < numBlobs; i++) {
                const blobSeed = seed + i * 100;
                const points = 6;
                
                const blob = {
                    y: -200 + (i / numBlobs) * 400,
                    x: -120 + seededRandom(blobSeed * 2) * 240,
                    size: 15 + seededRandom(blobSeed * 3) * 50,
                    rotation: seededRandom(blobSeed * 11) * Math.PI * 2,
                    points: points,
                    radii: [],
                    stretch: 0.5 + seededRandom(blobSeed * 6) * 1.5,
                    satellites: []
                };

                for (let a = 0; a < points; a++) {
                    blob.radii.push(blob.size * (0.4 + seededRandom(blobSeed * 5 + a) * 1.2));
                }

                const numSats = 3;
                for (let j = 0; j < numSats; j++) {
                    blob.satellites.push({
                        x: blob.x + (seededRandom(blobSeed * 7 + j) - 0.5) * 100,
                        y: blob.y + (seededRandom(blobSeed * 8 + j) - 0.5) * 80,
                        size: 5 + seededRandom(blobSeed * 9 + j) * 20,
                        rotation: seededRandom(blobSeed * 12 + j) * Math.PI * 2
                    });
                }

                pattern.blobs.push(blob);
            }

            return pattern;
        }

        function lerpPattern(p1, p2, t) {
            let rot1 = p1.rotation;
            let rot2 = p2.rotation;
            
            let diff = rot2 - rot1;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            rot2 = rot1 + diff;
            
            const result = {
                offsetX: lerp(p1.offsetX, p2.offsetX, t),
                offsetY: lerp(p1.offsetY, p2.offsetY, t),
                scale: lerp(p1.scale, p2.scale, t),
                rotation: lerp(rot1, rot2, t),
                blobs: []
            };

            for (let i = 0; i < p1.blobs.length; i++) {
                const b1 = p1.blobs[i];
                const b2 = p2.blobs[i];
                
                let brot1 = b1.rotation;
                let brot2 = b2.rotation;
                let bdiff = brot2 - brot1;
                while (bdiff > Math.PI) bdiff -= Math.PI * 2;
                while (bdiff < -Math.PI) bdiff += Math.PI * 2;
                brot2 = brot1 + bdiff;
                
                const blob = {
                    y: lerp(b1.y, b2.y, t),
                    x: lerp(b1.x, b2.x, t),
                    size: lerp(b1.size, b2.size, t),
                    rotation: lerp(brot1, brot2, t),
                    points: b1.points,
                    radii: [],
                    stretch: lerp(b1.stretch, b2.stretch, t),
                    satellites: []
                };

                for (let a = 0; a < b1.points; a++) {
                    blob.radii.push(lerp(b1.radii[a], b2.radii[a], t));
                }

                for (let j = 0; j < b1.satellites.length; j++) {
                    const s1 = b1.satellites[j];
                    const s2 = b2.satellites[j];
                    
                    let srot1 = s1.rotation;
                    let srot2 = s2.rotation;
                    let sdiff = srot2 - srot1;
                    while (sdiff > Math.PI) sdiff -= Math.PI * 2;
                    while (sdiff < -Math.PI) sdiff += Math.PI * 2;
                    srot2 = srot1 + sdiff;
                    
                    blob.satellites.push({
                        x: lerp(s1.x, s2.x, t),
                        y: lerp(s1.y, s2.y, t),
                        size: lerp(s1.size, s2.size, t),
                        rotation: lerp(srot1, srot2, t)
                    });
                }

                result.blobs.push(blob);
            }

            return result;
        }

        function drawPattern(pattern) {
            const complementaryHue = (hue + 180) % 360;
            ctx.fillStyle = `hsl(${complementaryHue}, 50%, 20%)`;
            ctx.globalAlpha = 0.08;

            ctx.save();
            ctx.translate(canvas.width / 2 + pattern.offsetX, canvas.height / 2 + pattern.offsetY);
            ctx.rotate(pattern.rotation);
            ctx.scale(pattern.scale, pattern.scale);

            for (const blob of pattern.blobs) {
                ctx.save();
                ctx.translate(blob.x, blob.y);
                ctx.rotate(blob.rotation);

                ctx.beginPath();
                for (let a = 0; a < blob.points; a++) {
                    const angle = (a / blob.points) * Math.PI * 2;
                    const r = blob.radii[a];
                    const px = Math.cos(angle) * r;
                    const py = Math.sin(angle) * r * blob.stretch;
                    if (a === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();
                ctx.restore();

                ctx.save();
                ctx.translate(-blob.x, blob.y);
                ctx.rotate(-blob.rotation);

                ctx.beginPath();
                for (let a = 0; a < blob.points; a++) {
                    const angle = (a / blob.points) * Math.PI * 2;
                    const r = blob.radii[a];
                    const px = Math.cos(angle) * r;
                    const py = Math.sin(angle) * r * blob.stretch;
                    if (a === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();
                ctx.restore();

                for (const sat of blob.satellites) {
                    ctx.save();
                    ctx.translate(sat.x, sat.y);
                    ctx.rotate(sat.rotation);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, sat.size, sat.size * 1.3, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    ctx.save();
                    ctx.translate(-sat.x, sat.y);
                    ctx.rotate(-sat.rotation);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, sat.size, sat.size * 1.3, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            ctx.restore();
        }

        function createTorus(R, r, segments, tubes, time) {
            const points = [];
            for (let i = 0; i <= segments; i++) {
                const u = (i / segments) * Math.PI * 2;
                for (let j = 0; j <= tubes; j++) {
                    const v = (j / tubes) * Math.PI * 2;
                    const wave = Math.sin(u * 3 + time) * 5 + Math.cos(v * 2 + time) * 3;
                    const x = (R + r * Math.cos(v) + wave) * Math.cos(u);
                    const y = (R + r * Math.cos(v) + wave) * Math.sin(u);
                    const z = r * Math.sin(v) + Math.sin(time + u * 2) * 8;
                    points.push({ x, y, z });
                }
            }
            return points;
        }

        function rotateX(point, angle) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            return {
                x: point.x,
                y: point.y * cos - point.z * sin,
                z: point.y * sin + point.z * cos
            };
        }

        function rotateY(point, angle) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            return {
                x: point.x * cos + point.z * sin,
                y: point.y,
                z: -point.x * sin + point.z * cos
            };
        }

        function rotateZ(point, angle) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            return {
                x: point.x * cos - point.y * sin,
                y: point.x * sin + point.y * cos,
                z: point.z
            };
        }

        function project(point, distance = 400) {
            const scale = distance / (distance + point.z);
            return {
                x: point.x * scale + centerX,
                y: point.y * scale + centerY,
                z: point.z
            };
        }

        const tori = [
            { R: 120, r: 50, segments: 12, tubes: 8, lightness: 45, speed: 0.01 },
            { R: 180, r: 35, segments: 15, tubes: 10, lightness: 30, speed: -0.008 },
            { R: 90, r: 60, segments: 10, tubes: 6, lightness: 55, speed: 0.012 },
            { R: 150, r: 40, segments: 13, tubes: 8, lightness: 25, speed: -0.015 }
        ];

        currentPattern = generatePattern(currentSeed);
        nextPattern = generatePattern(currentSeed + 10);

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            angleX += 0.005;
            angleY += 0.007;
            angleZ += 0.003;
            hue = (hue + 0.5) % 360;

            const elapsed = Date.now() - transitionStart;
            let progress = elapsed / TRANSITION_DURATION;
            
            if (progress >= 1) {
                progress = 0;
                currentSeed = currentSeed + 10;
                currentPattern = nextPattern;
                nextPattern = generatePattern(currentSeed + 10);
                transitionStart = Date.now();
            }

            const t = easeInOutCubic(progress);
            const interpolatedPattern = lerpPattern(currentPattern, nextPattern, t);
            drawPattern(interpolatedPattern);

            tori.forEach((torusConfig, idx) => {
                const points = createTorus(torusConfig.R, torusConfig.r, torusConfig.segments, torusConfig.tubes, angleX * 2 + idx);
                const rotatedPoints = points.map(p => {
                    let point = rotateX(p, angleX + idx * 0.5);
                    point = rotateY(point, angleY + idx * 0.3);
                    point = rotateZ(point, angleZ + idx * 0.7);
                    return point;
                });

                const projectedPoints = rotatedPoints.map(p => project(p));
                projectedPoints.sort((a, b) => a.z - b.z);

                const color = `hsl(${hue}, 40%, ${torusConfig.lightness}%)`;
                ctx.strokeStyle = color;
                ctx.lineWidth = 0.5;
                ctx.globalAlpha = 0.6;

                for (let i = 0; i < projectedPoints.length - 1; i++) {
                    const p1 = projectedPoints[i];
                    const p2 = projectedPoints[i + 1];
                    
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();
                }

                ctx.fillStyle = color;
                projectedPoints.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 1, 0, Math.PI * 2);
                    ctx.fill();
                });
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
