<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hell Train - Nightmare</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
  canvas { border-radius: 8px; width: min(100vw, 100vh); height: min(100vw, 100vh); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
c.width=800;c.height=800;
const W=c.width,H=c.height,vpX=W/2,vpY=H*0.38;
let time=0,trainZ=800;
const MIN_Z=-550,tunnelZ=800,rockEdgeY=H*0.60;
const raindrops=[];
for(let i=0;i<250;i++)raindrops.push({x:Math.random()*W,y:Math.random()*H,speed:4+Math.random()*6,len:10+Math.random()*20,w:0.5+Math.random()*1.2});
let shakeX=0,shakeY=0,shakeIntensity=0,lightningTimer=0,lightningFlash=0,lightningBolts=[],trainRumble=0;
const letterboxH=0;
const embers=[];
for(let i=0;i<120;i++)embers.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-0.5)*2,vy:-1-Math.random()*3,size:1+Math.random()*3,life:Math.random(),decay:0.002+Math.random()*0.005,color:Math.random()});
const souls=[];
for(let i=0;i<15;i++)souls.push({x:Math.random()*W,y:rockEdgeY+Math.random()*(H-rockEdgeY),phase:Math.random()*Math.PI*2,speed:0.3+Math.random()*0.7,size:20+Math.random()*40,opacity:0});
const fogLayers=[];
for(let i=0;i<8;i++)fogLayers.push({x:Math.random()*W*2-W*0.5,y:rockEdgeY-50+Math.random()*200,w:200+Math.random()*300,h:60+Math.random()*100,speed:0.3+Math.random()*0.8,phase:Math.random()*Math.PI*2});

function P(x,y,z){const s=600/(z+600);return{x:vpX+shakeX+(x-vpX)*s,y:vpY+shakeY+(y-vpY)*s,s};}
function SR(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280;};}

function updateCinematics(){
  const d=Math.abs(trainZ);
  if(trainZ<200&&trainZ>-200)shakeIntensity=Math.max(0,1-d/200)*4.5;else shakeIntensity*=0.92;
  shakeX=(Math.sin(time*23)*Math.cos(time*17))*shakeIntensity;
  shakeY=(Math.cos(time*19)*Math.sin(time*31))*shakeIntensity*0.6;
  lightningTimer-=0.016;
  if(lightningTimer<=0){lightningTimer=2+Math.random()*5;lightningFlash=1;lightningBolts=[];
    const bx=W*0.2+Math.random()*W*0.6;genBolt(bx,0,bx+(Math.random()-0.5)*80,rockEdgeY*0.7,4,lightningBolts);}
  lightningFlash*=0.85;
  if(trainZ<300&&trainZ>MIN_Z)trainRumble=Math.min(1,(300-trainZ)/400);else trainRumble*=0.95;
  embers.forEach(e=>{e.x+=e.vx+Math.sin(time*2+e.life*10)*0.5;e.y+=e.vy;e.life-=e.decay;
    if(e.life<=0||e.y<-20){e.x=Math.random()*W;e.y=H+10;e.life=0.5+Math.random()*0.5;e.vx=(Math.random()-0.5)*2;e.vy=-1-Math.random()*3;}});
  souls.forEach(s=>{s.phase+=0.02*s.speed;s.opacity=0.15+Math.sin(time*0.5+s.phase)*0.1;
    s.x+=Math.sin(s.phase)*0.8;s.y+=Math.cos(s.phase*0.7)*0.4;
    if(s.x<-50)s.x=W+50;if(s.x>W+50)s.x=-50;});
}
function genBolt(x1,y1,x2,y2,dep,arr){
  if(dep<=0){arr.push({x1,y1,x2,y2});return;}
  const mx=(x1+x2)/2+(Math.random()-0.5)*40*dep,my=(y1+y2)/2+(Math.random()-0.5)*20;
  genBolt(x1,y1,mx,my,dep-1,arr);genBolt(mx,my,x2,y2,dep-1,arr);
  if(Math.random()>0.6)genBolt(mx,my,mx+(Math.random()-0.5)*60*dep,my+20+Math.random()*40,dep-2,arr);
}

function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,rockEdgeY);const fl=lightningFlash*0.25;
  g.addColorStop(0,`rgb(${40+fl*100+~~(Math.sin(time*0.3)*8)},${14+fl*35},${18+fl*25})`);
  g.addColorStop(0.3,`rgb(${70+fl*80+~~(Math.sin(time*0.2)*10)},${22+fl*30},${12+fl*18})`);
  g.addColorStop(0.6,`rgb(${90+fl*55},${30+fl*25},${15+fl*15})`);
  g.addColorStop(1,`rgb(${60+fl*45},${25+fl*20},${12+fl*12})`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,rockEdgeY+20);
  const hg=ctx.createRadialGradient(vpX,rockEdgeY,0,vpX,rockEdgeY,W*0.6);
  hg.addColorStop(0,`rgba(240,70,0,${0.28+Math.sin(time*0.5)*0.1})`);
  hg.addColorStop(0.5,`rgba(180,40,0,${0.18})`);
  hg.addColorStop(1,'rgba(90,15,0,0)');
  ctx.fillStyle=hg;ctx.fillRect(0,0,W,rockEdgeY+20);
  if(lightningFlash>0.05){ctx.save();
    lightningBolts.forEach(b=>{ctx.strokeStyle=`rgba(255,140,60,${lightningFlash*0.8})`;
      ctx.lineWidth=1+lightningFlash*2;ctx.shadowColor='rgba(255,100,30,0.8)';ctx.shadowBlur=15*lightningFlash;
      ctx.beginPath();ctx.moveTo(b.x1,b.y1);ctx.lineTo(b.x2,b.y2);ctx.stroke();});ctx.restore();}
}
function drawClouds(){}
function drawGround(){
  const g=ctx.createLinearGradient(0,rockEdgeY+10,0,H);const fl=lightningFlash*0.12;
  g.addColorStop(0,`rgb(${60+~~(fl*55)},${25+~~(fl*22)},${16+~~(fl*16)})`);
  g.addColorStop(0.15,`rgb(${50+~~(fl*45)},${20+~~(fl*18)},${12+~~(fl*14)})`);
  g.addColorStop(0.5,`rgb(${38+~~(fl*32)},${15+~~(fl*14)},${10+~~(fl*10)})`);
  g.addColorStop(1,`rgb(${25+~~(fl*20)},${10+~~(fl*10)},${7+~~(fl*7)})`);
  ctx.fillStyle=g;ctx.fillRect(0,rockEdgeY+10,W,H-rockEdgeY-10);
  const rF=SR(888);
  for(let i=0;i<25;i++){
    const fx=rF()*W,fy=rockEdgeY+20+rF()*(H-rockEdgeY-40);
    const pulse=0.5+Math.sin(time*1.5+fx*0.01+fy*0.01)*0.5;
    ctx.strokeStyle=`rgba(${200+~~(pulse*55)},${50+~~(pulse*40)},0,${0.35+pulse*0.45})`;
    ctx.lineWidth=0.5+rF()*2;ctx.beginPath();ctx.moveTo(fx,fy);
    let cx2=fx,cy2=fy;
    for(let j=0;j<4;j++){cx2+=rF()*30-15;cy2+=rF()*10;ctx.lineTo(cx2,cy2);}
    ctx.stroke();
    const cg2=ctx.createRadialGradient(fx,fy,0,fx,fy,18+pulse*12);
    cg2.addColorStop(0,`rgba(255,100,0,${0.12*pulse})`);cg2.addColorStop(1,'rgba(255,50,0,0)');
    ctx.fillStyle=cg2;ctx.beginPath();ctx.arc(fx,fy,18+pulse*12,0,Math.PI*2);ctx.fill();
  }
  for(let i=0;i<20;i++){const fx=rF()*W,fy=rockEdgeY+20+rF()*(H-rockEdgeY-40),fs=2+rF()*4;
    ctx.strokeStyle=`rgba(${40+~~(rF()*25)},${15+~~(rF()*12)},${8+~~(rF()*8)},0.7)`;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(fx,fy);
    const twist=Math.sin(time+fx)*5;
    ctx.quadraticCurveTo(fx+twist+(rF()-0.5)*10,fy-fs*2,fx+(rF()-0.5)*15+twist*2,fy-fs*4);ctx.stroke();
    for(let t=0;t<3;t++){
      const ty=fy-fs*t*1.2,tx=fx+Math.sin(time+t)*3;
      ctx.strokeStyle='rgba(60,20,8,0.6)';ctx.lineWidth=0.8;
      ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(tx+(rF()-0.5)*8,ty-4);ctx.stroke();}
  }
}
function drawRockWall(){
  const r2=SR(444),r3=SR(555),r4=SR(666),r5=SR(777),rE=SR(111),rV=SR(222);
  const rB=rockEdgeY+10,eP=[];
  for(let x=0;x<=W;x+=4)eP.push({x,y:rockEdgeY+(rE()-0.4)*18});
  const fl=lightningFlash*0.12;
  const g=ctx.createLinearGradient(0,0,0,rB);
  g.addColorStop(0,`rgb(${62+~~(fl*95)},${32+~~(fl*45)},${25+~~(fl*32)})`);
  g.addColorStop(0.15,`rgb(${72+~~(fl*75)},${38+~~(fl*38)},${28+~~(fl*28)})`);
  g.addColorStop(0.3,`rgb(${60+~~(fl*65)},${30+~~(fl*32)},${22+~~(fl*22)})`);
  g.addColorStop(0.5,`rgb(${50+~~(fl*55)},${24+~~(fl*25)},${18+~~(fl*18)})`);
  g.addColorStop(0.7,`rgb(${42+~~(fl*45)},${20+~~(fl*20)},${14+~~(fl*15)})`);
  g.addColorStop(1,`rgb(${32+~~(fl*35)},${15+~~(fl*16)},${10+~~(fl*12)})`);
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,0);ctx.lineTo(W,rockEdgeY);
  eP.slice().reverse().forEach(p=>ctx.lineTo(p.x,p.y));ctx.closePath();ctx.fill();
  // Esoteric continuous line engravings on rock wall
  const rEso=SR(3141);
  // Generate node points
  const esoNodes=[];
  for(let i=0;i<60;i++){
    esoNodes.push({x:20+rEso()*760,y:30+rEso()*400});
  }
  // Draw continuous interconnected lines between nearby nodes
  const eAlpha=0.08+Math.sin(time*0.3)*0.03;
  ctx.strokeStyle=`rgba(200,80,20,${eAlpha})`;ctx.lineWidth=0.8;
  for(let i=0;i<esoNodes.length;i++){
    const n=esoNodes[i];
    for(let j=i+1;j<esoNodes.length;j++){
      const m=esoNodes[j];
      const dist=Math.hypot(n.x-m.x,n.y-m.y);
      if(dist<120){
        const lineA=eAlpha*(1-dist/120)*0.8;
        ctx.strokeStyle=`rgba(200,80,20,${lineA})`;
        ctx.beginPath();ctx.moveTo(n.x,n.y);ctx.lineTo(m.x,m.y);ctx.stroke();
      }
    }
    // Small geometric marks at nodes
    const glowA=0.03+Math.sin(time*0.4+i*0.9)*0.02;
    const sg=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,12);
    sg.addColorStop(0,`rgba(255,60,0,${glowA})`);sg.addColorStop(1,'rgba(200,30,0,0)');
    ctx.fillStyle=sg;ctx.beginPath();ctx.arc(n.x,n.y,12,0,Math.PI*2);ctx.fill();
    // Node circles
    ctx.strokeStyle=`rgba(200,80,20,${eAlpha*0.7})`;
    ctx.beginPath();ctx.arc(n.x,n.y,3+rEso()*4,0,Math.PI*2);ctx.stroke();
  }
  // Overlay geometric patterns along the lines - larger connected shapes
  const rEso2=SR(2718);
  for(let i=0;i<15;i++){
    const cx2=50+rEso2()*700,cy2=60+rEso2()*350,cr=20+rEso2()*35;
    const sides=3+~~(rEso2()*6);
    const glA2=0.04+Math.sin(time*0.35+i*1.4)*0.03;
    // Connected polygon
    ctx.strokeStyle=`rgba(200,80,20,${glA2})`;ctx.lineWidth=0.7;
    ctx.beginPath();
    for(let j=0;j<=sides;j++){
      const a=j*Math.PI*2/sides-Math.PI/2;
      const px2=cx2+Math.cos(a)*cr,py2=cy2+Math.sin(a)*cr;
      if(j===0)ctx.moveTo(px2,py2);else ctx.lineTo(px2,py2);
    }
    ctx.closePath();ctx.stroke();
    // Inner connecting lines to center
    for(let j=0;j<sides;j++){
      const a=j*Math.PI*2/sides-Math.PI/2;
      ctx.beginPath();ctx.moveTo(cx2,cy2);ctx.lineTo(cx2+Math.cos(a)*cr,cy2+Math.sin(a)*cr);ctx.stroke();
    }
    // Connect to nearest other polygon center
    // Glow
    const pg=ctx.createRadialGradient(cx2,cy2,0,cx2,cy2,cr*1.3);
    pg.addColorStop(0,`rgba(255,60,0,${glA2*0.5})`);pg.addColorStop(1,'rgba(200,30,0,0)');
    ctx.fillStyle=pg;ctx.beginPath();ctx.arc(cx2,cy2,cr*1.3,0,Math.PI*2);ctx.fill();
  }

  if(lightningFlash>0.1){ctx.save();ctx.globalAlpha=lightningFlash*0.2;
    for(let i=0;i<20;i++){const rx=rV()*W,ry=rV()*rB,rl=15+rV()*30;
      ctx.strokeStyle='rgba(255,100,30,0.4)';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx-1,ry+rl);ctx.stroke();}ctx.restore();}
  const rG=SR(999);
  for(let i=0;i<100;i++){const gx=rG()*W,gy=rockEdgeY+5+rG()*25,gh=12+rG()*28,gw=1.5+rG()*2.5,sw=Math.sin(time*2+gx*0.01)*3;
    ctx.strokeStyle=`rgba(${28+~~(rG()*18)},${12+~~(rG()*10)},${7+~~(rG()*6)},${0.5+rG()*0.4})`;ctx.lineWidth=gw;
    ctx.beginPath();ctx.moveTo(gx,gy);ctx.quadraticCurveTo(gx+(rG()-0.5)*10+sw,gy-gh*0.6,gx+(rG()-0.5)*15+sw*1.5,gy-gh);ctx.stroke();}
}
function drawRails(zS,zE){
  const steps=100,bY=H*1.15,rg=60,sw=95,rG=SR(321),rS=SR(654);
  for(let i=0;i<steps;i++){const z=zS+(zE-zS)*(i/steps),zN=zS+(zE-zS)*((i+1)/steps);
    const bL=P(vpX-sw-25,bY,z),bR=P(vpX+sw+25,bY,z),bLN=P(vpX-sw-25,bY,zN),bRN=P(vpX+sw+25,bY,zN);
    const sh=45+~~(rG()*15);ctx.fillStyle=`rgb(${sh+12},${sh-3},${sh-12})`;
    ctx.beginPath();ctx.moveTo(bL.x,bL.y);ctx.lineTo(bR.x,bR.y);ctx.lineTo(bRN.x,bRN.y);ctx.lineTo(bLN.x,bLN.y);ctx.fill();
    if(i%3===0)for(let cc=0;cc<8;cc++){const cx=bL.x+(bR.x-bL.x)*(0.2+rG()*0.6),cy=bL.y+(rG()-0.5)*4,cs=Math.max(1,2+rG()*3)*bL.s,csh=38+~~(rG()*22);
      ctx.fillStyle=`rgb(${csh+8},${csh-3},${csh-8})`;ctx.beginPath();ctx.arc(cx,cy,cs,0,Math.PI*2);ctx.fill();}}
  for(let i=0;i<steps;i++){const z=zS+(zE-zS)*(i/steps),rL=P(vpX-rg,bY,z);
    if(i%2===0){const sL=P(vpX-sw,bY-1,z),sR=P(vpX+sw,bY-1,z),slH=Math.max(1,3*rL.s),ws=42+~~(rS()*18);
      ctx.fillStyle=`rgb(${ws+12},${ws-3},${ws-12})`;ctx.fillRect(sL.x,sL.y-slH,sR.x-sL.x,slH*2);
      ctx.fillStyle=`rgba(${ws+25},${ws+5},${ws-8},0.5)`;ctx.fillRect(sL.x,sL.y-slH,sR.x-sL.x,slH*0.6);
      [-rg,rg].forEach(o=>{const cp=P(vpX+o,bY-1,z),cs=Math.max(1,2.5*rL.s);ctx.fillStyle='#1e1a1a';ctx.fillRect(cp.x-cs,cp.y-cs*0.8,cs*2,cs*1.6);});}}
  for(let i=0;i<steps-1;i++){const z=zS+(zE-zS)*(i/steps),zN=zS+(zE-zS)*((i+1)/steps);
    // Fire intensity: max near tunnel, fades with distance
    const distFromTunnel=Math.max(0,tunnelZ-z);
    const fireT=Math.max(0,1-distFromTunnel/600);
    const firePulse=fireT*(0.7+Math.sin(time*0.6+z*0.008)*0.3);
    [-rg,rg].forEach(o=>{const r=P(vpX+o,bY,z),rN=P(vpX+o,bY,zN),rw=Math.max(1,5*r.s);
      ctx.strokeStyle='#302020';ctx.lineWidth=rw;ctx.beginPath();ctx.moveTo(r.x,r.y+0.5);ctx.lineTo(rN.x,rN.y+0.5);ctx.stroke();
      // Rail color: from grey to hot orange/white near tunnel
      const rR=~~(102+firePulse*153),rG2=~~(102*( 1-fireT*0.6)),rB2=~~(102*(1-fireT*0.8));
      ctx.strokeStyle=`rgb(${rR},${rG2},${rB2})`;ctx.lineWidth=rw*0.7;ctx.beginPath();ctx.moveTo(r.x,r.y-1);ctx.lineTo(rN.x,rN.y-1);ctx.stroke();
      // Glow around rails near tunnel
      if(firePulse>0.05){
        ctx.strokeStyle=`rgba(255,${60+~~(firePulse*120)},0,${firePulse*0.5})`;ctx.lineWidth=Math.max(0.5,rw*0.8);
        ctx.beginPath();ctx.moveTo(r.x,r.y-1);ctx.lineTo(rN.x,rN.y-1);ctx.stroke();
        // Heat shimmer glow below rails
        const hg2=ctx.createRadialGradient((r.x+rN.x)/2,(r.y+rN.y)/2-2,0,(r.x+rN.x)/2,(r.y+rN.y)/2-2,rw*3);
        hg2.addColorStop(0,`rgba(255,${80+~~(firePulse*80)},0,${firePulse*0.12})`);
        hg2.addColorStop(1,'rgba(200,30,0,0)');
        ctx.fillStyle=hg2;ctx.beginPath();ctx.arc((r.x+rN.x)/2,(r.y+rN.y)/2-2,rw*3,0,Math.PI*2);ctx.fill();
      }});}
}

const CAT_BY=H*0.95,CAT_SP=400,CAT_PX=vpX+240,CAT_PH=350;

function drawCatenary(zS,zE){
  for(let z=zE;z>=zS;z-=CAT_SP){
    if(z>=tunnelZ)continue;
    const pB=P(CAT_PX,CAT_BY,z),pT=P(CAT_PX,CAT_BY-CAT_PH,z),s=pB.s;if(s<0.02)continue;
    const pBW=14*s;
    const bpW=24*s;
    ctx.fillStyle='#2a1e15';ctx.fillRect(pB.x-bpW,pB.y-8*s,bpW*2,16*s);
    ctx.strokeStyle='#150e08';ctx.lineWidth=1;ctx.strokeRect(pB.x-bpW,pB.y-8*s,bpW*2,16*s);
    for(let r=-1;r<=1;r+=2){
      ctx.fillStyle='#5a3e28';ctx.beginPath();ctx.arc(pB.x+r*bpW*0.7,pB.y,2*s,0,Math.PI*2);ctx.fill();}
    const segs=8;
    for(let i=0;i<segs;i++){
      const t0=i/segs,t1=(i+1)/segs;
      const y0=pB.y+(pT.y-pB.y)*t0,y1=pB.y+(pT.y-pB.y)*t1;
      const w0=pBW*(1-t0*0.4),w1=pBW*(1-t1*0.4);
      const x0=pB.x+(pT.x-pB.x)*t0,x1=pB.x+(pT.x-pB.x)*t1;
      ctx.strokeStyle='#3a2518';ctx.lineWidth=Math.max(1.5,3*s);
      ctx.beginPath();ctx.moveTo(x0-w0,y0);ctx.lineTo(x1-w1,y1);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x0+w0,y0);ctx.lineTo(x1+w1,y1);ctx.stroke();
      ctx.strokeStyle='#2a1810';ctx.lineWidth=Math.max(0.8,1.5*s);
      ctx.beginPath();ctx.moveTo(x0-w0,y0);ctx.lineTo(x1+w1,y1);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x0+w0,y0);ctx.lineTo(x1-w1,y1);ctx.stroke();
      ctx.strokeStyle='#3a2518';ctx.lineWidth=Math.max(0.8,1.5*s);
      ctx.beginPath();ctx.moveTo(x0-w0,y0);ctx.lineTo(x0+w0,y0);ctx.stroke();
    }
  }
}

function drawCatenaryTop(zS,zE){
  const wireY=CAT_BY-180-18-25;
  const maxZ=Math.min(zE,tunnelZ),minZ=Math.max(zS,-300),wSt=60;
  ctx.strokeStyle='#444';ctx.lineWidth=1.5;ctx.beginPath();let f=true;
  for(let i=0;i<=wSt;i++){const z=minZ+(maxZ-minZ)*(i/wSt);if((z+600)<30)continue;
    const p=P(vpX,wireY-15,z);if(f){ctx.moveTo(p.x,p.y);f=false;}else ctx.lineTo(p.x,p.y);}ctx.stroke();
  ctx.strokeStyle='#333';ctx.lineWidth=1.2;ctx.beginPath();f=true;
  for(let i=0;i<=wSt;i++){const z=minZ+(maxZ-minZ)*(i/wSt);if((z+600)<30)continue;
    const sag=Math.sin(((z-zS)%CAT_SP)/CAT_SP*Math.PI)*10;
    const p=P(vpX,wireY+sag,z);if(f){ctx.moveTo(p.x,p.y);f=false;}else ctx.lineTo(p.x,p.y);}ctx.stroke();
  for(let z=zE;z>=zS;z-=CAT_SP){
    if(z>=tunnelZ)continue;
    const pB=P(CAT_PX,CAT_BY,z),pT=P(CAT_PX,CAT_BY-CAT_PH,z),s=pB.s;if(s<0.02)continue;
    const armEnd=P(vpX,CAT_BY-CAT_PH+5,z);
    ctx.strokeStyle='#3a2518';ctx.lineWidth=Math.max(2.5,7*s);
    ctx.beginPath();ctx.moveTo(pT.x,pT.y);ctx.lineTo(armEnd.x,armEnd.y);ctx.stroke();
    const armEnd2=P(vpX,CAT_BY-CAT_PH+15,z);
    ctx.strokeStyle='#2a1810';ctx.lineWidth=Math.max(1.5,4*s);
    ctx.beginPath();ctx.moveTo(pT.x,pT.y+8*s);ctx.lineTo(armEnd2.x,armEnd2.y);ctx.stroke();
    if(Math.random()>0.7&&s>0.04){

const LL=120,WL=360,WG=10,NW=4,MZ=3500,TL=LL+WG+NW*(WL+WG);

    if(wF>MIN_Z&&(wF+600)>50){

      if(isFinite(ftL.x)&&isFinite(fbL.y)){
        const dk2=(r,g,b)=>`rgb(${~~(r*f)},${~~(g*f)},${~~(b*f)})`;
        const fG=ctx.createLinearGradient(ftL.x,ftL.y,fbL.x,fbL.y);
        fG.addColorStop(0,dk2(55,12,5));fG.addColorStop(0.5,dk2(38,8,3));fG.addColorStop(1,dk2(22,4,2));
        ctx.fillStyle=fG;ctx.beginPath();

          const p=P(rx,ay,wF);if(t===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);}
        ctx.lineTo(fbR.x,fbR.y);ctx.lineTo(fbL.x,fbL.y);ctx.closePath();ctx.fill();
        const icS=ftL.s||0.1,icW=30*icS,icH=50*icS,icX=(ftL.x+ftR.x)/2,icY=ftL.y+(fbL.y-ftL.y)*0.35;
        ctx.fillStyle=`rgba(${~~(20*f)},${~~(8*f)},${~~(3*f)},0.9)`;ctx.fillRect(icX-icW,icY,icW*2,icH);
        const wGlow=0.35+Math.sin(time*3+i*2)*0.25;
        const wg2=ctx.createRadialGradient(icX,icY+icH/2,0,icX,icY+icH/2,icW);
        wg2.addColorStop(0,`rgba(${~~(220*wGlow*f)},${~~(50*wGlow*f)},0,0.35)`);wg2.addColorStop(1,'rgba(120,12,0,0)');

          ctx.strokeStyle=`rgba(${~~(40*f)},${~~(20*f)},${~~(10*f)},0.8)`;ctx.lineWidth=Math.max(0.5,1.5*icS);
          ctx.beginPath();ctx.moveTo(icX+b*icW*0.4,icY);ctx.lineTo(icX+b*icW*0.4,icY+icH);ctx.stroke();}
      }}

    const ftL=P(vpX-tw,bY-tt,fWF),ftR=P(vpX+tw,bY-tt,fWF),fbL=P(vpX-tw,bY,fWF),fbR=P(vpX+tw,bY,fWF);

      ctx.fillStyle=fG;ctx.beginPath();

function drawRain(){
  raindrops.forEach(r=>{const w=1.5+Math.sin(time*0.7)*0.5,a=0.18+r.speed*0.03+lightningFlash*0.2;
    ctx.strokeStyle=`rgba(${160+~~(Math.random()*50)},${25+~~(Math.random()*22)},${12+~~(Math.random()*12)},${a})`;ctx.lineWidth=r.w;

function drawEmbers(){
  embers.forEach(e=>{
    if(e.life<=0)return;
    const r=e.color>0.5?255:210+~~(Math.random()*45);
    const g=e.color>0.7?110+~~(e.life*110):35+~~(e.life*55);
    const sz=e.size*e.life;
    const eg=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,sz*3);
    eg.addColorStop(0,`rgba(${r},${g},0,${e.life*0.85})`);

    ctx.fillStyle=eg;ctx.beginPath();ctx.arc(e.x,e.y,sz*3,0,Math.PI*2);ctx.fill();

}

function drawSouls(){
  souls.forEach(s=>{
    if(s.opacity<=0.01)return;
    const sg=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.size);
    const wobble=Math.sin(time*2+s.phase)*0.5;
    sg.addColorStop(0,`rgba(${110+~~(wobble*35)},${195+~~(wobble*35)},${110+~~(wobble*25)},${s.opacity*0.35})`);
    sg.addColorStop(0.4,`rgba(70,135,70,${s.opacity*0.18})`);

    ctx.fillStyle=sg;ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,Math.PI*2);ctx.fill();

      const fa=s.opacity*0.25;

      ctx.beginPath();ctx.arc(s.x-s.size*0.15,s.y-s.size*0.05,s.size*0.06,0,Math.PI*2);ctx.fill();

  ctx.globalCompositeOperation='overlay';ctx.fillStyle='rgba(45,8,0,0.08)';ctx.fillRect(0,0,W,H);

function animate(){
  time+=0.016;updateCinematics();ctx.clearRect(0,0,W,H);
  drawSky();drawRockWall();drawClouds();drawGround();drawRails(0,2500);drawCatenary(0,2500);
  trainZ-=6;if(trainZ+TL<MIN_Z)trainZ=3000;
  // Tunnel exit flash
  const flashZone=trainZ-tunnelZ;
  let exitFlash=0;
  if(flashZone>-30&&flashZone<80){
    if(flashZone<0)exitFlash=1+flashZone/30;
    else exitFlash=1-flashZone/80;
    exitFlash=Math.max(0,exitFlash);
  }
  if(trainZ>tunnelZ)drawTrain(trainZ,0);
  drawTunnelHole();
  if(trainZ<=tunnelZ){const pr=Math.min(1,(tunnelZ-trainZ)/400);drawTrain(trainZ,0.85*(1-pr));}
  if(trainZ<=tunnelZ&&trainZ>tunnelZ-500){
    const pr=(tunnelZ-trainZ)/500,tT2=P(vpX,vpY+40,tunnelZ),tBL2=P(vpX-130,H*0.95,tunnelZ);
    const aT2=tT2.y+10*tT2.s,tcx=vpX,tcy=(aT2+tBL2.y)/2,ra=(1-pr)*0.55;
    if(ra>0.01){ctx.save();ctx.globalCompositeOperation='screen';
      for(let i=0;i<14;i++){const a=-Math.PI*0.45+(i/13)*Math.PI*0.9,rl=200+Math.sin(time*2+i)*40,rw=12+Math.sin(time*1.5+i*0.7)*4;
        const rx=tcx+Math.cos(a)*15,ry=tcy+Math.sin(a)*8,ex=tcx+Math.cos(a)*rl*pr,ey=tcy+Math.sin(a)*rl*0.6*pr;
        const rg=ctx.createLinearGradient(rx,ry,ex,ey);
        rg.addColorStop(0,`rgba(255,90,0,${ra})`);rg.addColorStop(0.4,`rgba(255,40,0,${ra*0.5})`);rg.addColorStop(1,'rgba(220,15,0,0)');
        ctx.fillStyle=rg;ctx.beginPath();ctx.moveTo(rx-rw*0.3,ry);ctx.lineTo(ex-rw*pr*2,ey);ctx.lineTo(ex+rw*pr*2,ey);ctx.lineTo(rx+rw*0.3,ry);ctx.closePath();ctx.fill();}
      const glR=80*(1-pr);if(glR>2){const gl=ctx.createRadialGradient(tcx,tcy,0,tcx,tcy,glR);
        gl.addColorStop(0,`rgba(255,110,25,${(1-pr)*0.75})`);gl.addColorStop(0.4,`rgba(255,55,0,${(1-pr)*0.45})`);gl.addColorStop(1,'rgba(220,25,0,0)');
        ctx.fillStyle=gl;ctx.beginPath();ctx.arc(tcx,tcy,glR,0,Math.PI*2);ctx.fill();}ctx.restore();}}
  drawCatenaryTop(0,2500);drawEmbers();drawSouls();drawRain();drawNightmareFog();
  // Exit flash overlay
  if(exitFlash>0.01){
    ctx.save();
    ctx.globalCompositeOperation='screen';
    const tT3=P(vpX,vpY+40,tunnelZ),tBL3=P(vpX-130,H*0.95,tunnelZ);
    const fcx=vpX,fcy=(tT3.y+tBL3.y)/2;
    const fRadius=W*0.6*exitFlash;
    const fg2=ctx.createRadialGradient(fcx,fcy,0,fcx,fcy,fRadius);
    fg2.addColorStop(0,`rgba(255,200,100,${exitFlash*0.7})`);
    fg2.addColorStop(0.2,`rgba(255,150,50,${exitFlash*0.5})`);
    fg2.addColorStop(0.5,`rgba(255,80,10,${exitFlash*0.25})`);
    fg2.addColorStop(1,'rgba(200,30,0,0)');
    ctx.fillStyle=fg2;ctx.beginPath();ctx.arc(fcx,fcy,fRadius,0,Math.PI*2);ctx.fill();
    // White hot center
    const fg3=ctx.createRadialGradient(fcx,fcy,0,fcx,fcy,fRadius*0.3);
    fg3.addColorStop(0,`rgba(255,255,240,${exitFlash*0.5})`);
    fg3.addColorStop(1,'rgba(255,200,100,0)');
    ctx.fillStyle=fg3;ctx.beginPath();ctx.arc(fcx,fcy,fRadius*0.3,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  drawCinematic();
  requestAnimationFrame(animate);
}
animate();
</script>
