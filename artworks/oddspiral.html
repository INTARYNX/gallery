<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odd Spiral</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0a;
            overflow: hidden;
        }
        canvas {
            border-radius: 50%;
            border: 2px solid #333;
            box-shadow: 0 0 30px rgba(255,255,255,0.1);
            max-width: 100%;
            max-height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            const size = Math.min(window.innerWidth, window.innerHeight) - 20;
            canvas.width = size;
            canvas.height = size;
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 0.8 + 0.3;
                this.speedX = Math.random() * 3 - 1.5;
                this.speedY = Math.random() * 3 - 1.5;
                this.hue = Math.random() * 360;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.size > 0.2) this.size -= 0.01;
            }

            draw() {
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        const particles = [];
        let hue = 0;
        const spiralOffsets = Array.from({ length: 400 }, () => ({
            waveOffset: Math.random() * Math.PI * 2,
            speedMult: 0.8 + Math.random() * 0.4,
            sizeMult: 0.7 + Math.random() * 0.6
        }));

        function createParticles(x, y) {
            for (let i = 0; i < 5; i++) {
                particles.push(new Particle(x, y));
            }
        }

        function drawSpiral() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const time = Date.now() * 0.002;

            ctx.beginPath();
            for (let i = 0; i < 400; i++) {
                const offset = spiralOffsets[i];
                const angle = i * 0.12 + time * 0.27 * offset.speedMult;
                const radius = i * 0.75;
                const wave = Math.sin(time * 3.97 + i * 0.103 + offset.waveOffset) * 18;
                const wave2 = Math.sin(time * 2.83 + i * 0.147 + offset.waveOffset * 1.618) * 14;
                const wave3 = Math.cos(time * 4.71 + i * 0.089 + offset.waveOffset * 0.707) * 11;
                const x = centerX + Math.cos(angle) * (radius + wave + wave2);
                const y = centerY + Math.sin(angle) * (radius + wave + wave3);

                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
                
                if (Math.random() < 0.02) {
                    for (let j = 0; j < 3; j++) {
                        particles.push(new Particle(x, y));
                    }
                }
            }
            const gradient = ctx.createLinearGradient(centerX - 300, centerY - 300, centerX + 300, centerY + 300);
            gradient.addColorStop(0, `hsl(${hue}, 100%, 25%)`);
            gradient.addColorStop(0.5, `hsl(${(hue + 60) % 360}, 100%, 30%)`);
            gradient.addColorStop(1, `hsl(${(hue + 120) % 360}, 100%, 35%)`);
            ctx.strokeStyle = gradient;
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            for (let i = 0; i < 400; i++) {
                const offset = spiralOffsets[i];
                const angle = i * 0.12 + time * 3 * offset.speedMult;
                const radius = i * 0.75;
                const wave = Math.sin(time * 4 + i * 0.1 + offset.waveOffset) * 20;
                const wave2 = Math.sin(time * 3 + i * 0.15 + offset.waveOffset * 1.5) * 15;
                const wave3 = Math.cos(time * 5 + i * 0.08 + offset.waveOffset * 0.7) * 10;
                const x = centerX + Math.cos(angle) * (radius + wave + wave2);
                const y = centerY + Math.sin(angle) * (radius + wave + wave3);

                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        function animate() {
            ctx.fillStyle = 'rgba(10, 10, 10, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawSpiral();

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();

                if (particles[i].size <= 0.2) {
                    particles.splice(i, 1);
                }
            }

            // Scanlines
            for (let i = 0; i < canvas.height; i += 4) {
                const alpha = 0.12 * (1 - Math.abs(i - canvas.height / 2) / (canvas.height / 2));
                ctx.fillStyle = `rgba(0, 0, 0, ${alpha})`;
                ctx.fillRect(0, i, canvas.width, 2);
            }

            hue += 0.2;
            requestAnimationFrame(animate);
        }

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            createParticles(x, y);
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            createParticles(x, y);
        });

        animate();
    </script>
</body>
</html>
