<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recursive Corners</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1f2e 50%, #0d1520 100%);
            overflow: hidden;
        }
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
            display: block;
            filter: contrast(1.1) brightness(1.05);
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="800" height="700"></canvas>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let angle = 0;
        let extraTriangles = [];
        let baseTriangles = [];
        let intersticePositions = [];
        let frameCount = 0;
        
        const triangleVertices = [
            {x: 400, y: 50},
            {x: 50, y: 650},
            {x: 750, y: 650}
        ];
        
        function drawTriangle(x1, y1, x2, y2, x3, y3, rotation, fillStyle, strokeStyle) {
            const cx = (x1 + x2 + x3) / 3;
            const cy = (y1 + y2 + y3) / 3;
            
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(rotation);
            ctx.translate(-cx, -cy);
            
            ctx.fillStyle = fillStyle;
            ctx.strokeStyle = strokeStyle;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.lineTo(x3, y3);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            ctx.restore();
        }
        
        function collectBaseTriangles(x1, y1, x2, y2, x3, y3, depth) {
            if (depth === 0) {
                baseTriangles.push({x1, y1, x2, y2, x3, y3});
            } else {
                const mx1 = (x1 + x2) / 2;
                const my1 = (y1 + y2) / 2;
                const mx2 = (x2 + x3) / 2;
                const my2 = (y2 + y3) / 2;
                const mx3 = (x3 + x1) / 2;
                const my3 = (y3 + y1) / 2;
                
                collectBaseTriangles(x1, y1, mx1, my1, mx3, my3, depth - 1);
                collectBaseTriangles(mx1, my1, x2, y2, mx2, my2, depth - 1);
                collectBaseTriangles(mx3, my3, mx2, my2, x3, y3, depth - 1);
                
                if (depth >= 2 && Math.random() < 0.3) {
                    intersticePositions.push({
                        x1: mx1, y1: my1,
                        x2: mx2, y2: my2,
                        x3: mx3, y3: my3,
                        hueOffset: Math.random() * 360
                    });
                }
            }
        }
        
        function sierpinskiSub(x1, y1, x2, y2, x3, y3, depth, rotation, t, hueOffset) {
            if (depth === 0) {
                const cx = (x1 + x2 + x3) / 3;
                const cy = (y1 + y2 + y3) / 3;
                const pulse = Math.sin(t * 3 + cx * 0.01) * 0.5 + 0.5;
                const hue = 165 + (hueOffset % 60) + pulse * 25;
                const saturation = 60 + Math.sin(t * 2.5) * 20;
                const lightness = 40 + Math.sin(t * 5 + cy * 0.015) * 22;
                
                const centerX = (x1 + x2 + x3) / 3;
                const centerY = (y1 + y2 + y3) / 3;
                
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(rotation);
                ctx.translate(-centerX, -centerY);
                
                ctx.fillStyle = `hsla(${hue},${saturation}%,${lightness}%,0.8)`;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.lineTo(x3, y3);
                ctx.closePath();
                ctx.fill();
                
                ctx.restore();
            } else {
                const mx1 = (x1 + x2) / 2;
                const my1 = (y1 + y2) / 2;
                const mx2 = (x2 + x3) / 2;
                const my2 = (y2 + y3) / 2;
                const mx3 = (x3 + x1) / 2;
                const my3 = (y3 + y1) / 2;
                
                sierpinskiSub(x1, y1, mx1, my1, mx3, my3, depth - 1, rotation, t, hueOffset);
                sierpinskiSub(mx1, my1, x2, y2, mx2, my2, depth - 1, rotation, t, hueOffset);
                sierpinskiSub(mx3, my3, mx2, my2, x3, y3, depth - 1, rotation, t, hueOffset);
            }
        }
        
        collectBaseTriangles(400, 50, 50, 650, 750, 650, 6);
        
        const sinCache = new Float32Array(1000);
        const cosCache = new Float32Array(1000);
        for (let i = 0; i < 1000; i++) {
            sinCache[i] = Math.sin(i * 0.01);
            cosCache[i] = Math.cos(i * 0.01);
        }
        
        const rotationAngle = angle * 0.3;
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (Math.random() < 0.05 && intersticePositions.length > 0) {
                const pos = intersticePositions[Math.floor(Math.random() * intersticePositions.length)];
                extraTriangles.push({
                    x1: pos.x1, y1: pos.y1,
                    x2: pos.x2, y2: pos.y2,
                    x3: pos.x3, y3: pos.y3,
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.08,
                    life: 200,
                    subDepth: 0,
                    maxSubDepth: 3,
                    growing: true,
                    hueOffset: Math.random() * 360
                });
            }
            
            const rotAngle = angle * 0.3;
            ctx.lineWidth = 0.3;
            
            const len = baseTriangles.length;
            for (let i = 0; i < len; i++) {
                const t = baseTriangles[i];
                const cx = (t.x1 + t.x2 + t.x3) / 3;
                const cy = (t.y1 + t.y2 + t.y3) / 3;
                const dist = Math.sqrt((cx - 400) ** 2 + (cy - 350) ** 2);
                const flow = sinCache[Math.floor((angle * 200 + dist) % 1000)] * 0.5 + 0.5;
                const hue = 160 + ((dist * 0.12 + angle * 25 + flow * 20) % 70) | 0;
                const saturation = (55 + sinCache[Math.floor((angle * 300 + dist * 3) % 1000)] * 25) | 0;
                const lightness = (28 + cosCache[Math.floor((angle * 400 + cx * 2 + cy * 2) % 1000)] * 18) | 0;
                
                drawTriangle(t.x1, t.y1, t.x2, t.y2, t.x3, t.y3, rotAngle,
                    `hsla(${hue},${saturation}%,${lightness}%,0.9)`,
                    `hsla(${hue + 10},${saturation + 10}%,${lightness + 3}%,0.3)`);
            }
            
            frameCount++;
            
            if (frameCount % 10 === 0 && intersticePositions.length > 0) {
                for (let i = 0; i < 3; i++) {
                    const pos = intersticePositions[Math.floor(Math.random() * intersticePositions.length)];
                    extraTriangles.push({
                        x1: pos.x1, y1: pos.y1,
                        x2: pos.x2, y2: pos.y2,
                        x3: pos.x3, y3: pos.y3,
                        rotation: Math.random() * Math.PI * 2,
                        rotSpeed: (Math.random() - 0.5) * 0.08,
                        life: 200,
                        subDepth: 0,
                        maxSubDepth: 3,
                        growing: true,
                        hueOffset: pos.hueOffset
                    });
                }
            }
            
            let i = extraTriangles.length;
            while (i--) {
                const t = extraTriangles[i];
                t.life--;
                if (t.life <= 0) {
                    extraTriangles.splice(i, 1);
                    continue;
                }
                
                t.rotation += t.rotSpeed;
                
                if (t.growing && t.life % 30 === 0 && t.subDepth < t.maxSubDepth) {
                    t.subDepth++;
                }
                
                if (t.life < 60) {
                    t.growing = false;
                    if (t.life % 30 === 0 && t.subDepth > 0) {
                        t.subDepth--;
                    }
                }
                
                const fadeIn = Math.min(1, (200 - t.life) / 40);
                const fadeOut = t.life < 60 ? t.life / 60 : 1;
                const opacity = Math.min(fadeIn, fadeOut) * 0.75;
                
                ctx.globalAlpha = opacity;
                sierpinskiSub(t.x1, t.y1, t.x2, t.y2, t.x3, t.y3, t.subDepth, t.rotation, angle, t.hueOffset);
                ctx.globalAlpha = 1;
            }
            
            angle += 0.01;
            
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>
