<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Daredevil's Ascent</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block}
#intro{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6em;background:transparent;color:#d8c8a0;font-family:Cinzel,"Times New Roman",serif;cursor:pointer;transition:opacity 1.5s;text-align:center}
#intro h1{margin:0;font-weight:400;font-size:clamp(16px,2.2vw,32px);letter-spacing:.35em;padding-left:.35em}
#intro p{margin:0;font-size:clamp(10px,1.05vw,14px);letter-spacing:.32em;padding-left:.32em;opacity:.55;animation:pl 2.6s ease-in-out infinite}
@keyframes pl{50%{opacity:.18}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="intro"><h1>THE DAREDEVIL'S ASCENT</h1><p>CLICK TO BEGIN &middot; SOUND ON</p></div>
<script>
(function(){
'use strict';
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),intro=document.getElementById('intro');
var TAU=Math.PI*2,FL=400,FONT='"Cinzel","Trajan Pro","Times New Roman",serif',HZ=[226,212,186];
var D=4.5,T={fly:11+D,fail:25+D,touch:33+D,landed:36+D,endText:41+D,end:52+D};
var hasF=typeof ctx.filter==='string';

/* ---------- utils ---------- */
function clamp(x,a,b){return x<a?a:x>b?b:x}
function lerp(a,b,t){return a+(b-a)*t}
function sstep(a,b,x){x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)}
function bump(a,b,x){return x<=a||x>=b?0:Math.sin(Math.PI*(x-a)/(b-a))}
function nz(x,s){return Math.sin(x+s*7.1)*.5+Math.sin(x*2.17+s*3.3)*.3+Math.sin(x*4.31+s*5.9)*.2}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(i,j){var h=Math.imul(i,374761393)+Math.imul(j,668265263)|0;h=Math.imul(h^h>>>13,1274126177);return(h^h>>>16)>>>0}
function mk(w,h){var c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c}
var rnd=rng(1909);

/* ---------- state ---------- */
var CW,CH,W,H,S,FX,FY,HY,SX,SY,BWD=4;
var ft=0,rate=1,camZ=0,camY=10,camX=0,cs=0,zoom=1.1,shX=0,shY=0,tilt=0,omega=14,propA=0,flash=0,thr=.3,touched=false,phase='takeoff';
var QL=1,acc=0,nfr=0,started=false,last=0,freeze=false,muted=false;
var gust=0,TEARZ=null,debris=[],dust=[],smoke=[],flames=[],trees=[],birds=[],clouds=[],cloudSpr=[],treeSpr=[],grain=[];
var BW,BH,bs,u0,gcv,gctx,gimg,g32,backdrop,bdY,bA,bB,bAx,bBx;

/* ---------- layout & asset builders ---------- */
function resize(){
  var dpr=Math.min(window.devicePixelRatio||1,1.5),side=Math.min(innerWidth,innerHeight),px=Math.round(side*dpr*Math.min(1,1920*QL/(side*dpr)));
  cv.width=cv.height=CW=CH=px;cv.style.width=cv.style.height=side+'px';
  BWD=0;W=px-2*BWD;H=Math.round(W/2.39);FX=BWD;FY=(px-H)>>1;
  S=H/700;HY=H*.4;SX=W*.23;SY=HY-H*.27;
  buildGround();buildBackdrop();buildClouds();
  bA=mk(Math.ceil(W/4),Math.ceil(H/4));bB=mk(Math.ceil(W/12),Math.ceil(H/12));bAx=bA.getContext('2d');bBx=bB.getContext('2d');
}

function buildGround(){
  BW=560;bs=1.6*W/BW;BH=Math.ceil((H*1.3-HY)/bs);
  gcv=mk(BW,BH);gctx=gcv.getContext('2d');gimg=gctx.createImageData(BW,BH);g32=new Uint32Array(gimg.data.buffer);
  u0=new Float32Array(BW);for(var c=0;c<BW;c++)u0[c]=-.3*W+(c+.5)*bs-W/2;
}

function buildBackdrop(){
  var bw=Math.ceil(W*1.6),bh=Math.ceil(H*.36),Y=bh;bdY=HY-bh;
  backdrop=mk(bw,bh);var x=backdrop.getContext('2d'),ox=W*.3;
  function mix(c,f){return'rgb('+c.map(function(v,i){return v+(HZ[i]-v)*f|0}).join(',')+')'}
  function ridge(L){
    x.beginPath();x.moveTo(0,Y);
    for(var px=0;px<=bw;px+=5){var q=px/W;x.lineTo(px,Y-L.h*H*(.5+.28*Math.sin(q*L.a+L.s)+.15*Math.sin(q*L.a*2.3+L.s*2.1)+.07*Math.sin(q*L.a*5.1+L.s*3.7)))}
    x.lineTo(bw,Y);x.closePath();
    var g=x.createLinearGradient(0,Y-L.h*H,0,Y);g.addColorStop(0,mix(L.c,L.f));g.addColorStop(1,mix(L.c,Math.min(1,L.f+.45)));x.fillStyle=g;x.fill();
  }
  ridge({h:.13,a:6,s:1,c:[132,150,178],f:.5});ridge({h:.09,a:9,s:2.5,c:[118,142,150],f:.4});

  function building(px,w,h,f,rr){
    var top=Y-h,rh=h*.2,body=[196,186,170],g=x.createLinearGradient(px,0,px+w,0);
    g.addColorStop(0,mix(body.map(function(v){return Math.min(255,v*1.06)}),f));g.addColorStop(1,mix(body.map(function(v){return v*.8}),f));
    x.fillStyle=g;x.fillRect(px,top+rh,w,h-rh);
    x.fillStyle=mix([92,98,120],f);x.beginPath();x.moveTo(px-w*.02,top+rh);x.lineTo(px+w*.1,top);x.lineTo(px+w*.9,top);x.lineTo(px+w*1.02,top+rh);x.closePath();x.fill();
    x.fillStyle=mix([120,100,92],f);for(var i=0;i<2;i++)x.fillRect(px+w*(.2+rr()*.6),top-h*.07,w*.06,h*.09);
    x.fillStyle='rgba(50,56,74,'+(.24*(1-f))+')';
    var cols=Math.max(2,w/(H*.012)|0),rws=Math.max(2,(h-rh)/(H*.014)|0),cw=w*.84/cols,rh2=(h-rh-h*.08)/rws;
    for(var a=0;a<rws;a++)for(var b=0;b<cols;b++)x.fillRect(px+w*.08+b*cw,top+rh+h*.05+a*rh2,cw*.5,rh2*.5);
    x.fillStyle='rgba(255,240,205,'+(.22*(1-f))+')';x.fillRect(px,top+rh,w*.07,h-rh);
    
  }
  function row(hMin,hMax,f,seed,wMul){
    var rr=rng(seed),px=-20;
    while(px<bw){var w=(.04+rr()*.05)*H*wMul,h=(hMin+rr()*(hMax-hMin))*H;building(px,w,h,f,rr);px+=w*(.7+rr()*.5)}
  }
  row(.05,.085,.38,11,1);row(.03,.055,.22,12,1.1);

  /* Montmartre / basilica */
  var bx0=ox+W*.46,cream=mix([196,182,160],.12),shade=mix([140,128,120],.12),u=H*.03;
  x.fillStyle=mix([110,132,96],.3);x.beginPath();x.ellipse(bx0,Y,W*.1,H*.085,0,Math.PI,TAU);x.fill();
  var by=Y-H*.062;
  function dome(cx,base,rx,ry){
    x.fillStyle=cream;x.beginPath();x.ellipse(cx,base,rx,ry,0,Math.PI,TAU);x.closePath();x.fill();
    x.fillStyle=shade;x.beginPath();x.ellipse(cx,base,rx,ry,0,Math.PI*1.5,TAU);x.lineTo(cx,base);x.closePath();x.fill();
    x.fillStyle=cream;x.fillRect(cx-rx*.07,base-ry-u*.5,rx*.14,u*.5);
  }
  x.fillStyle=cream;x.fillRect(bx0-u*2.3,by-u*1.1,u*4.6,u*1.1);
  x.fillStyle=shade;x.fillRect(bx0+u*1.2,by-u*1.1,u*1.1,u*1.1);
  dome(bx0,by-u*1.1,u*1.15,u*1.5);dome(bx0-u*1.7,by-u*1.1,u*.6,u*.85);dome(bx0+u*1.7,by-u*1.1,u*.6,u*.85);
  x.fillStyle=cream;x.fillRect(bx0+u*2.6,by-u*2.3,u*.5,u*2.3);x.fillRect(bx0-u*3.1,by-u*1.8,u*.5,u*1.8);

  /* Eiffel Tower */
  var ex=ox+W*.2,eh=H*.24;
  function ew(y){return eh*(.24*Math.exp(-3.3*y)+.008)}
  function P(y){return Y-y*eh}
  var tc=mix([88,90,112],.35);x.fillStyle=tc;x.strokeStyle=tc;
  function poly(sd,y0,y1,k){
    x.beginPath();for(var i=0;i<=10;i++){var y=y0+(y1-y0)*i/10;x[i?'lineTo':'moveTo'](ex+sd*ew(y),P(y))}
    for(i=10;i>=0;i--){y=y0+(y1-y0)*i/10;x.lineTo(ex+sd*ew(y)*k,P(y))}x.closePath();x.fill();
  }
  [-1,1].forEach(function(sd){poly(sd,0,.17,.55);poly(sd,.17,.35,.4)});
  x.beginPath();for(var i=0;i<=20;i++){var yy=.35+.65*i/20;x[i?'lineTo':'moveTo'](ex-ew(yy),P(yy))}
  for(i=20;i>=0;i--){yy=.35+.65*i/20;x.lineTo(ex+ew(yy),P(yy))}x.closePath();x.fill();
  [[.17,1.15,.02],[.35,1.15,.02],[.84,1.3,.012]].forEach(function(p){x.fillRect(ex-ew(p[0])*p[1],P(p[0])-eh*p[2]*.5,2*ew(p[0])*p[1],eh*p[2])});
  x.lineWidth=Math.max(1,eh*.012);x.beginPath();x.ellipse(ex,Y,ew(0)*.62,eh*.085,0,Math.PI,TAU);x.stroke();
  x.fillRect(ex-eh*.003,P(1)-eh*.06,eh*.006,eh*.07);
  x.strokeStyle='rgba(235,225,205,.3)';x.lineWidth=Math.max(.8,eh*.0025);
  for(i=0;i<9;i++){var a0=.35+i*.07,a1=a0+.07;x.beginPath();x.moveTo(ex-ew(a0),P(a0));x.lineTo(ex+ew(a1),P(a1));x.moveTo(ex+ew(a0),P(a0));x.lineTo(ex-ew(a1),P(a1));x.stroke()}

  /* Arc de Triomphe */
  var ax=ox+W*.76,aw=H*.12,ah=H*.075;
  x.fillStyle=mix([204,194,176],.4);x.fillRect(ax-aw/2,Y-ah,aw,ah);x.fillStyle=mix([186,176,160],.4);x.fillRect(ax-aw/2,Y-ah,aw,ah*.1);
  x.fillStyle=mix([120,116,118],.4);x.beginPath();x.moveTo(ax-aw*.17,Y);x.lineTo(ax-aw*.17,Y-ah*.45);x.arc(ax,Y-ah*.45,aw*.17,Math.PI,0);x.lineTo(ax+aw*.17,Y);x.fill();

  ridge({h:.05,a:12,s:4,c:[96,122,92],f:.28});ridge({h:.03,a:19,s:6,c:[104,126,72],f:.18});
  var hg=x.createLinearGradient(0,Y-H*.1,0,Y);hg.addColorStop(0,'rgba('+HZ+',0)');hg.addColorStop(1,'rgba('+HZ+',.6)');x.fillStyle=hg;x.fillRect(0,Y-H*.1,bw,H*.1);
}

function buildClouds(){
  cloudSpr=[];
  for(var k=0;k<4;k++){
    var w=Math.round(H*.9),h=Math.round(w*.45),c=mk(w,h),x=c.getContext('2d'),rr=rng(50+k),pf=[],i,p,g;
    for(i=0;i<26;i++){var t=i/25,tp=Math.sin(t*Math.PI);pf.push({x:w*(.14+.72*t+(rr()-.5)*.05),y:h*(.7-.42*tp*rr()),r:h*(.1+.2*tp*(.4+rr()*.6))})}
    for(i=0;i<pf.length;i++){p=pf[i];g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);g.addColorStop(0,'rgba(168,182,206,.95)');g.addColorStop(.6,'rgba(168,182,206,.55)');g.addColorStop(1,'rgba(168,182,206,0)');x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.r,0,TAU);x.fill()}
    for(i=0;i<pf.length;i++){p=pf[i];var ox=-p.r*.22,oy=-p.r*.3;g=x.createRadialGradient(p.x+ox,p.y+oy,0,p.x+ox,p.y+oy,p.r*.85);g.addColorStop(0,'rgba(255,250,238,.95)');g.addColorStop(.55,'rgba(255,246,228,.5)');g.addColorStop(1,'rgba(255,240,215,0)');x.fillStyle=g;x.beginPath();x.arc(p.x+ox,p.y+oy,p.r*.85,0,TAU);x.fill()}
    x.globalCompositeOperation='destination-out';g=x.createLinearGradient(0,h*.62,0,h*.82);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,1)');x.fillStyle=g;x.fillRect(0,h*.62,w,h*.4);
    cloudSpr.push(c);
  }
  clouds=[];var r2=rng(33);
  for(var j=0;j<22;j++){var yr=Math.pow(r2(),.8);clouds.push({s:cloudSpr[j%4],x0:r2()*W*3,y:H*.05+yr*(HY-H*.11),k:lerp(1.25,.3,yr)*(.85+r2()*.3),a:lerp(1,.5,yr)})}
  clouds.sort(function(a,b){return b.y-a.y});
  clouds.forEach(function(c){c.v=7*c.k*S});
}

var TU=3,TSW=300,TSH=300,TOX=150,TOY=292;
var TPAL=[[[34,56,28],[78,112,48],[150,178,88]],[[52,58,26],[112,118,50],[188,186,104]],[[88,36,16],[184,96,34],[240,180,86]],[[92,64,20],[190,140,46],[246,214,116]]];
function buildTrees(){
  var rr=rng(21);
  function rgb(c,a){return'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a+')'}
  function mixc(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]}
  for(var v=0;v<8;v++){
    var c=mk(TSW,TSH),x=c.getContext('2d'),pal=TPAL[v%4],pop=v>=4,i;
    x.translate(TOX,TOY);x.scale(TU,TU);x.lineCap='round';
    var cx=0,cy=pop?-54:-50,rx=pop?12:30,ry=pop?34:28;
    /* trunk */
    var tg=x.createLinearGradient(-5,0,5,0);tg.addColorStop(0,'#2c1d12');tg.addColorStop(.35,'#6a4a2e');tg.addColorStop(1,'#24180e');
    x.fillStyle=tg;x.beginPath();x.moveTo(-5,0);x.quadraticCurveTo(-3.6,-14,-2.4,cy+ry*.4);x.lineTo(2.4,cy+ry*.4);x.quadraticCurveTo(3.6,-14,5,0);x.closePath();x.fill();
    x.strokeStyle='#3a2716';
    for(i=0;i<(pop?3:6);i++){var ba=-Math.PI/2+(rr()-.5)*(pop?.5:1.8),bl=(pop?16:18)+rr()*10,by=cy+ry*.35-rr()*8;x.lineWidth=1.4+rr();x.beginPath();x.moveTo(0,by);x.quadraticCurveTo(Math.cos(ba)*bl*.5,by+Math.sin(ba)*bl*.6,Math.cos(ba)*bl,by+Math.sin(ba)*bl);x.stroke()}
    /* canopy clusters, lit from upper-left */
    var cl=[],n=pop?60:80;
    for(i=0;i<n;i++){
      var a=rr()*TAU,rd=Math.sqrt(rr()),px=cx+Math.cos(a)*rx*rd*(.9+.2*rr()),py=cy+Math.sin(a)*ry*rd*(.9+.2*rr());
      var L=clamp(.55-(px-cx)/rx*.32-(py-cy)/ry*.42+(rr()-.5)*.25,0,1);
      cl.push({x:px,y:py,r:(pop?3.2:4.6)+rr()*(pop?3:4.4),L:L});
    }
    cl.sort(function(p,q){return p.L-q.L});
    for(i=0;i<cl.length;i++){var k=cl[i];x.fillStyle=rgb(pal[0],.55);x.beginPath();x.arc(k.x+1.2,k.y+1.6,k.r,0,TAU);x.fill()}
    for(i=0;i<cl.length;i++){
      var k2=cl[i],base=k2.L<.5?mixc(pal[0],pal[1],k2.L*2):mixc(pal[1],pal[2],(k2.L-.5)*2);
      var g=x.createRadialGradient(k2.x-k2.r*.35,k2.y-k2.r*.4,k2.r*.1,k2.x,k2.y,k2.r);
      g.addColorStop(0,rgb(mixc(base,pal[2],.35),1));g.addColorStop(.7,rgb(base,1));g.addColorStop(1,rgb(mixc(base,pal[0],.4),.95));
      x.fillStyle=g;x.beginPath();x.arc(k2.x,k2.y,k2.r,0,TAU);x.fill();
    }
    /* leaf specks */
    for(i=0;i<(pop?260:420);i++){
      var a2=rr()*TAU,rd2=Math.sqrt(rr()),sx=cx+Math.cos(a2)*rx*rd2*1.02,sy=cy+Math.sin(a2)*ry*rd2*1.02;
      var L2=clamp(.55-(sx-cx)/rx*.35-(sy-cy)/ry*.45+(rr()-.5)*.4,0,1);
      x.fillStyle=rgb(L2>.6?pal[2]:L2<.35?pal[0]:pal[1],.55);x.beginPath();x.arc(sx,sy,.45+rr()*.8,0,TAU);x.fill();
    }
    /* soft ambient occlusion at the bottom of the crown */
    var ao=x.createLinearGradient(0,cy,0,cy+ry);ao.addColorStop(0,'rgba(10,16,6,0)');ao.addColorStop(1,'rgba(10,16,6,.32)');
    x.globalCompositeOperation='source-atop';x.fillStyle=ao;x.fillRect(-60,cy,120,ry+6);x.globalCompositeOperation='source-over';
    treeSpr.push(c);
  }
}
function buildGrain(){
  for(var k=0;k<4;k++){
    var c=mk(256,256),x=c.getContext('2d'),im=x.createImageData(256,256),d=im.data;
    for(var i=0;i<d.length;i+=4){var v=128+(Math.random()+Math.random()-1)*70;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255}
    x.putImageData(im,0,0);grain.push(ctx.createPattern(c,'repeat'));
  }
}

/* ---------- world ---------- */
function newTree(x,z){
  var ap=[];for(var i=0;i<5;i++)ap.push({dx:(rnd()-.5)*.8,dy:rnd()*.6+.2,v:rnd()*3|0});
  var r=rnd(),v=r<.4?0:r<.6?1:r<.85?2:3;if(rnd()<.28)v+=4;return{x:x,z:z,sz:.7+rnd()*.5,v:v,ap:ap};
}
function initWorld(){
  for(var i=0;i<260;i++)trees.push(newTree((rnd()<.5?1:-1)*(170+rnd()*780),200+rnd()*5000));
  for(i=0;i<2;i++)birds.push({x:(Math.random()-.5)*800,y:0,z:0,w:Math.random()*6.28,vx:.2+Math.random()*.3});
}
function proj(wx,wy,wz){var dz=wz-camZ;if(dz<5)return null;var sc=FL/dz;return{sx:W/2+(wx-camX)*sc*S,sy:HY+(camY-wy)*sc*S,sc:sc,dz:dz}}
function toScr(x,y){var c=Math.cos(tilt),s=Math.sin(tilt),dx=(x+shX-W/2)*zoom,dy=(y+shY-H/2)*zoom;return[W/2+dx*c-dy*s,H/2+dx*s+dy*c]}

/* ---------- timeline ---------- */
function throttleAt(t){
  if(t<2+D)return .3+.015*Math.sin(t*9);
  if(t<7+D)return .3+.7*(t-2-D)/5;
  var el=t-T.fail;if(el<0)return 1;if(el>8.3)return 0;
  var dec=1-.8*sstep(.5,8,el),sp=el>1?clamp(.55+.45*Math.sin(el*21)*Math.sin(el*8.3),.15,1):1;
  return Math.max(.04,dec*sp);
}
function drive(t){
  var el=t-T.fail,ax=0,ay=0,at=0,fq=12,bx=0,by=0,bt=0,ib=0;
  if(t<T.fly){
    phase='takeoff';
    if(t<2+D){cs=0;camY=10;ax=.8;ay=.6;fq=18}
    else if(t<7+D){cs=(t-2-D)*7.2;camY=10;ax=cs*.2;ay=cs*.14;fq=12+cs*.6}
    else{cs=36;var p=(t-7-D)/4,e=p*p*(3-2*p);camY=10+e*190;ax=(1-e)*7+1.2;ay=(1-e)*5+1;fq=20}
  }else if(t<T.fail){phase='flying';cs=36;camY=200;ax=1.2;ay=1;fq=22}
  else{
    phase='landing';
    if(el<4){cs=36-el*2;camY=200-el*10;ax=(3+el*2)*.7+1;ay=(2+el*1.5)*.7+1;at=(.05+el*.02)*.7;fq=16}
    else if(el<8){var p2=(el-4)/4,u=Math.pow(p2,1.5);cs=28-p2*16;camY=160-p2*150;ax=u*14+2;ay=u*10+2;at=u*.14+.03;fq=18+u*10}
    else if(el<9){var p3=el-8;cs=12-p3*8;camY=10+12*Math.sin(p3*Math.PI)*(1-.3*p3);ib=Math.sin(p3*40)*38*(1-p3);ax=30;ay=14;at=.3;fq=34}
    else if(el<11){var p4=(el-9)/2;cs=4*(1-p4);camY=10+Math.sin(p4*Math.PI*3)*8*(1-p4);ax=14*(1-p4);ay=10*(1-p4);at=.14*(1-p4);fq=24}
    else{phase='landed';cs=0;camY=10;var ts=t-T.landed;ax=ts<2?7*(2-ts):0;ay=ts<2?5.6*(2-ts):0;fq=26}
  }

  ctx.restore();
}
function grade(){
  ctx.save();
  var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(40,90,150,.5)');g.addColorStop(.55,'rgba(255,210,150,.22)');g.addColorStop(1,'rgba(255,150,70,.45)');
  ctx.globalCompositeOperation='soft-light';ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='multiply';ctx.fillStyle='rgba(255,238,212,.28)';ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='saturation';ctx.fillStyle='rgba(128,128,128,.12)';ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='screen';ctx.fillStyle='rgba(14,20,34,.07)';ctx.fillRect(0,0,W,H);
  ctx.restore();
}
function vignette(){
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(W/H*.8,1);
  var g=ctx.createRadialGradient(0,0,H*.34,0,0,H*.82);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(8,5,2,.62)');
  ctx.fillStyle=g;ctx.fillRect(-W,-H,W*2,H*2);ctx.restore();
}
function filmArtifacts(k){
  var i,kk=clamp((k-.3)/.7,0,1);
  ctx.save();
  if(k>.03){ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.03+.24*k;ctx.fillStyle=grain[(Math.random()*4)|0];
  ctx.translate(-Math.random()*256,-Math.random()*256);ctx.fillRect(0,0,W+256,H+256)}
  ctx.restore();
  if(kk>0&&Math.random()<.02+.09*kk){ctx.fillStyle='rgba(255,245,225,'+(.03+.07*kk)+')';ctx.fillRect(Math.random()*W,0,Math.max(1,S*.7),H)}
  if(kk>0)for(i=0;i<2+(kk*4|0);i++)if(Math.random()<.08+.12*kk){
    var dark=Math.random()<.7;ctx.fillStyle=dark?'rgba(15,10,5,'+(.18+.14*kk)+')':'rgba(255,248,230,'+(.1+.14*kk)+')';
    ctx.beginPath();ctx.arc(Math.random()*W,Math.random()*H,(.45+Math.random()*.9*(1+kk))*S,0,TAU);ctx.fill();
  }
  if(kk>0&&Math.random()<.01+.04*kk){
    var hx=Math.random()*W,hy=Math.random()*H;ctx.strokeStyle='rgba(15,10,5,.22)';ctx.lineWidth=Math.max(1,S*.7);ctx.beginPath();
    ctx.moveTo(hx,hy);ctx.bezierCurveTo(hx+14*S,hy-8*S,hx+26*S,hy+12*S,hx+46*S,hy+3*S);ctx.stroke();
  }
  var fl=(Math.random()-.5)*.05*k;
  if(fl>0){ctx.fillStyle='rgba(0,0,0,'+fl+')';ctx.fillRect(0,0,W,H)}
  else if(k>.05){ctx.fillStyle='rgba(255,248,235,'+(-fl*.6)+')';ctx.fillRect(0,0,W,H)}
}

/* ---------- titles ---------- */
function spaced(s,x,y,sp){
  var ch=Array.from(s),ws=ch.map(function(c){return ctx.measureText(c).width}),w=-sp;ws.forEach(function(v){w+=v+sp});
  var cx=x-w/2;ctx.textAlign='left';ch.forEach(function(c,i){ctx.fillText(c,cx,y);cx+=ws[i]+sp});
}
function ornament(cx,y,flip){
  ctx.save();ctx.translate(cx,y);ctx.scale(1,flip);ctx.lineCap='round';ctx.lineJoin='round';
  var g=ctx.createLinearGradient(-250*S,0,250*S,0);
  g.addColorStop(0,'rgba(205,178,125,0)');g.addColorStop(.22,'rgba(222,198,150,.95)');g.addColorStop(.5,'rgba(255,238,192,1)');g.addColorStop(.78,'rgba(222,198,150,.95)');g.addColorStop(1,'rgba(205,178,125,0)');
  ctx.strokeStyle=g;ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(0,-8*S);ctx.lineTo(6*S,0);ctx.lineTo(0,8*S);ctx.lineTo(-6*S,0);ctx.closePath();ctx.fill();
  ctx.lineWidth=1*S;ctx.beginPath();ctx.moveTo(0,-13*S);ctx.lineTo(10*S,0);ctx.lineTo(0,13*S);ctx.lineTo(-10*S,0);ctx.closePath();ctx.stroke();
  [[-18,2],[18,2],[-27,1.3],[27,1.3]].forEach(function(d){ctx.beginPath();ctx.arc(d[0]*S,0,d[1]*S,0,TAU);ctx.fill()});
  for(var sd=-1;sd<=1;sd+=2){
    ctx.save();ctx.scale(sd,1);
    ctx.lineWidth=2.2*S;ctx.beginPath();ctx.moveTo(32*S,0);ctx.bezierCurveTo(60*S,-10*S,92*S,10*S,126*S,-2*S);ctx.stroke();
    var cxs=139*S,cys=-12*S,a0=Math.atan2(10,-13),r0=Math.hypot(13,10)*S;
    ctx.lineWidth=2*S;ctx.beginPath();
    for(var t=0;t<=1.001;t+=.02){var an=a0+t*TAU*1.55,r=r0*(1-t)+2*S;ctx[t?'lineTo':'moveTo'](cxs+Math.cos(an)*r,cys+Math.sin(an)*r)}
    ctx.stroke();ctx.beginPath();ctx.arc(cxs,cys,2.2*S,0,TAU);ctx.fill();
    ctx.lineWidth=1.6*S;ctx.beginPath();ctx.moveTo(76*S,3*S);ctx.bezierCurveTo(84*S,18*S,108*S,22*S,114*S,11*S);ctx.bezierCurveTo(117*S,5*S,109*S,3*S,108*S,8*S);ctx.stroke();
    ctx.beginPath();ctx.arc(108*S,9*S,1.8*S,0,TAU);ctx.fill();
    [[48,-5,-.5,1],[66,-1,.6,.8],[100,-1,.2,.9]].forEach(function(l){
      ctx.save();ctx.translate(l[0]*S,l[1]*S);ctx.rotate(l[2]-(l[2]>0?.2:0));ctx.scale(l[3],l[3]);
      ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(8*S,-13*S,22*S,-9*S);ctx.quadraticCurveTo(10*S,-2*S,0,0);ctx.fill();ctx.restore();
    });
    ctx.lineWidth=1.3*S;ctx.beginPath();ctx.moveTo(158*S,-1*S);ctx.bezierCurveTo(185*S,-5*S,205*S,3*S,245*S,0);ctx.stroke();
    ctx.beginPath();ctx.arc(172*S,-2*S,1.5*S,0,TAU);ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}
function drawArabesques(cy,spread){
  ornament(W/2,cy-spread*S,1);ornament(W/2,cy+spread*S,-1);
}
function drawTitles(t){
  var ov=1-sstep(2.9,4.7,t);
  if(ov>0){ctx.fillStyle='rgba(0,0,0,'+ov+')';ctx.fillRect(0,0,W,H)}
  var ta=sstep(.4,1.8,t)*(1-sstep(2.7,3.7,t));
  if(ta>0){
    ctx.save();ctx.globalAlpha=ta*.7;var S0=S,os=Math.min(1.6,W/(560*S));S=S0*os;ornament(W/2,H/2-124*S0,1);ornament(W/2,H/2+136*S0,-1);S=S0;
    ctx.globalAlpha=ta;ctx.fillStyle='rgba(224,204,164,.95)';ctx.shadowColor='rgba(255,196,120,.5)';ctx.shadowBlur=26*S;
    ctx.font=(100*S)+'px '+FONT;spaced('PARIS',W/2,H/2+8*S,34*S);
    ctx.font=(40*S)+'px '+FONT;ctx.fillStyle='rgba(200,180,140,.85)';spaced('Autumn, 1909',W/2,H/2+66*S,16*S);ctx.restore();
  }
  if(t>T.endText){
    var ef=sstep(T.endText,T.endText+2.5,t);
    ctx.fillStyle='rgba(0,0,0,'+.86*ef+')';ctx.fillRect(0,0,W,H);
    ctx.save();ctx.globalAlpha=ef*.7;var S1=S;S=S1*1.6;ornament(W/2,H/2-205*S1,1);ornament(W/2,H/2+202*S1,-1);S=S1;ctx.restore();
    var L=[['In those early days,',-118,54],['the sky belonged to dreamers',-54,54],['and daredevils.',10,54],['Many fell from the heavens',86,46],['so that others might soar.',138,46]];
    ctx.save();ctx.shadowColor='rgba(255,196,120,.4)';ctx.shadowBlur=14*S;
    L.forEach(function(l,i){
      var a=sstep(T.endText+.8+i,T.endText+2.2+i,t);if(a<=0)return;
      ctx.globalAlpha=a*.95;ctx.font=(l[2]*S)+'px '+FONT;ctx.fillStyle=i<3?'rgba(220,200,160,.95)':'rgba(200,180,140,.85)';
      spaced(l[0],W/2,H/2+l[1]*S+(1-a)*8*S,4*S);
    });
    ctx.restore();
    if(t>T.end){ctx.save();ctx.globalAlpha=.25+.2*Math.sin(t*2);ctx.fillStyle='#d8c8a0';ctx.font=(13*S)+'px '+FONT;spaced('CLICK TO REPLAY',W/2,H-24*S,6*S);ctx.restore()}
  }
}

/* ---------- render ---------- */
var scr=[],ART=1;
function barsFX(){
  var i,rects=[[0,0,CW,FY],[0,FY+H,CW,CH-FY-H]],u=Math.max(1,CW/900);
  ctx.save();ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='rgba(255,240,210,'+((.008+Math.random()*.02+(Math.random()<.008?.04:0))*ART)+')';
  rects.forEach(function(r){ctx.fillRect(r[0],r[1],r[2],r[3])});
  ctx.globalCompositeOperation='lighter';ctx.globalAlpha=(.035+Math.random()*.02)*ART;ctx.fillStyle=grain[(Math.random()*4)|0];
  rects.forEach(function(r){ctx.save();ctx.beginPath();ctx.rect(r[0],r[1],r[2],r[3]);ctx.clip();ctx.translate(-Math.random()*256,-Math.random()*256);ctx.fillRect(0,0,CW+256,CH+256);ctx.restore()});
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  for(i=0;i<8;i++)if(Math.random()<.5*ART){
    var r=rects[Math.random()<.5?0:1],x=Math.random()*r[2],y=r[1]+Math.random()*r[3];
    ctx.fillStyle='rgba(255,245,225,'+(.06+Math.random()*.2)+')';ctx.beginPath();ctx.arc(x,y,(.5+Math.random()*1.1)*u,0,TAU);ctx.fill();
  }
  if(Math.random()<.04*ART){
    var hr=rects[Math.random()<.5?0:1],hx=Math.random()*hr[2],hy=hr[1]+Math.random()*hr[3];
    ctx.strokeStyle='rgba(255,245,225,.16)';ctx.lineWidth=Math.max(1,u*.7);ctx.beginPath();ctx.moveTo(hx,hy);ctx.bezierCurveTo(hx+20*u,hy-10*u,hx+30*u,hy+14*u,hx+55*u,hy+4*u);ctx.stroke();
  }
  if(ART>.15&&Math.random()<.02+.05*ART)scr.push({x:Math.random()*CW,life:2+(Math.random()*4|0),a:.05+Math.random()*.11,w:Math.max(1,u*.8)});
  if(ART<.5){ctx.beginPath();rects.forEach(function(r){ctx.rect(r[0],r[1],r[2],r[3])});ctx.clip()}
  for(i=scr.length-1;i>=0;i--){var c=scr[i];ctx.fillStyle='rgba(255,245,225,'+c.a*(.6+Math.random()*.4)+')';ctx.fillRect(c.x+(Math.random()-.5)*1.5*u,0,c.w,CH);if(--c.life<=0)scr.splice(i,1)}
  ctx.restore();
}
function render(){
  var t=ft,bwk=Math.max(1-sstep(5.2+(D-4.5),6.8+(D-4.5),t),sstep(T.landed-1,T.endText-.5,t));
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#000';ctx.fillRect(0,0,CW,CH);
  ctx.save();ctx.beginPath();ctx.rect(FX,FY,W,H);ctx.clip();ctx.translate(FX+(Math.random()-.5)*1.1*S*bwk,FY+(Math.random()-.5)*1.4*S*bwk);
  ctx.save();ctx.translate(W/2,H/2);ctx.rotate(tilt);ctx.scale(zoom,zoom);ctx.translate(-W/2+shX,-H/2+shY);
  drawSky();drawClouds(t);
  ctx.drawImage(backdrop,-.3*W,bdY);
  drawGround(t);drawBirds();drawTrees();drawDust();
  ctx.restore();
  ctx.save();ctx.translate(nz(ft*21,8)*gust*3.5*S,nz(ft*19,9)*gust*3*S);drawCockpit(t);ctx.restore();drawEngineFX();
  bloom();
  var vis=1-sstep(2.9,4.7,t);
  drawRaysAndFlare(t,Math.max(.25,vis));
  grade();
  if(flash>.01){ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(255,236,200,'+flash*.85+')';ctx.fillRect(0,0,W,H);ctx.restore()}
  var bw=Math.max(1-sstep(5.2+(D-4.5),6.8+(D-4.5),t),sstep(T.landed-1,T.endText-.5,t));
  if(bw>.005){ctx.save();ctx.globalCompositeOperation='saturation';ctx.fillStyle='rgba(128,128,128,'+bw+')';ctx.fillRect(0,0,W,H);ctx.restore()}
  vignette();
  drawTitles(t);
  filmArtifacts(bw);
  ctx.restore();
  ART=bw;barsFX();
}

/* ---------- audio ---------- */
var AC=null,mst,noiseBuf,eng={},wind={};
function audioInit(){
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    mst=AC.createGain();mst.gain.value=0;mst.connect(AC.destination);mst.gain.linearRampToValueAtTime(.9,AC.currentTime+2.5);
    var len=AC.sampleRate*2,nb=AC.createBuffer(1,len,AC.sampleRate),d=nb.getChannelData(0);for(var i=0;i<len;i++)d[i]=Math.random()*2-1;noiseBuf=nb;
    eng.g=AC.createGain();eng.g.gain.value=0;eng.f=AC.createBiquadFilter();eng.f.type='lowpass';eng.f.Q.value=2;
    eng.o1=AC.createOscillator();eng.o1.type='sawtooth';eng.o2=AC.createOscillator();eng.o2.type='square';
    eng.trem=AC.createGain();eng.trem.gain.value=.7;eng.lfo=AC.createOscillator();eng.lfoG=AC.createGain();eng.lfoG.gain.value=.3;
    eng.lfo.connect(eng.lfoG);eng.lfoG.connect(eng.trem.gain);
    eng.o1.connect(eng.f);eng.o2.connect(eng.f);eng.f.connect(eng.trem);eng.trem.connect(eng.g);eng.g.connect(mst);
    eng.o1.start();eng.o2.start();eng.lfo.start();
    wind.src=AC.createBufferSource();wind.src.buffer=nb;wind.src.loop=true;wind.f=AC.createBiquadFilter();wind.f.type='bandpass';wind.f.Q.value=.6;
    wind.g=AC.createGain();wind.g.gain.value=0;wind.src.connect(wind.f);wind.f.connect(wind.g);wind.g.connect(mst);wind.src.start();
  }catch(e){AC=null}
}
function audioUpdate(){
  if(!AC)return;var n=AC.currentTime,th=thr;
  eng.o1.frequency.setTargetAtTime(46+th*80,n,.06);eng.o2.frequency.setTargetAtTime(23+th*40,n,.06);
  eng.lfo.frequency.setTargetAtTime(7+th*22,n,.08);eng.f.frequency.setTargetAtTime(240+th*1100,n,.08);
  eng.g.gain.setTargetAtTime(th>0?.06+.3*th:0,n,.05);
  var sp=cs/36;wind.g.gain.setTargetAtTime(.04+.3*sp*sp*(.5+camY/400)+.28*gust,n,.2);wind.f.frequency.setTargetAtTime(350+sp*900+gust*700,n,.2);
}
function noiseHit(dur,f0,f1,gain){
  var n=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf;
  var f=AC.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(f0,n);f.frequency.exponentialRampToValueAtTime(f1,n+dur);
  var g=AC.createGain();g.gain.setValueAtTime(gain,n);g.gain.exponentialRampToValueAtTime(.001,n+dur*1.2);
  s.connect(f);f.connect(g);g.connect(mst);s.start(n);s.stop(n+dur*1.3);
}
function pop(){if(AC)noiseHit(.12,1800,200,.5)}
function boom(){
  if(!AC)return;noiseHit(2.2,2500,120,1);noiseHit(.5,7000,900,.9);noiseHit(.15,10000,2500,1);
  var n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.frequency.setValueAtTime(90,n);o.frequency.exponentialRampToValueAtTime(28,n+.9);g.gain.setValueAtTime(1.2,n);g.gain.exponentialRampToValueAtTime(.001,n+1.2);
  o.connect(g);g.connect(mst);o.start(n);o.stop(n+1.3);
}

/* ---------- loop & boot ---------- */
function loop(now){
  var dt=freeze?0:Math.min(.05,(now-last)/1000||.016);last=now;
  sim(dt);render();audioUpdate();
  if(!freeze&&started&&ft>1){acc+=dt;if(++nfr>=60){if(acc/nfr>.034&&QL>.45){QL*=.8;resize();render()}acc=0;nfr=0}}
  requestAnimationFrame(loop);
}
function begin(){
  if(started)return;started=true;intro.style.opacity=0;setTimeout(function(){intro.remove()},1600);
  audioInit();last=performance.now();requestAnimationFrame(loop);
}
window.addEventListener('resize',function(){resize();if(!started)render()});
window.addEventListener('keydown',function(e){if(e.key==='m'||e.key==='M'){muted=!muted;if(mst)mst.gain.setTargetAtTime(muted?0:.9,AC.currentTime,.1)}});
cv.addEventListener('click',function(){if(ft>T.end)location.reload()});
buildTrees();buildGrain();resize();initWorld();
var seek=location.hash.match(/t=(\d+(\.\d+)?)/);
if(seek){
  freeze=/freeze/.test(location.hash);intro.remove();started=true;
  while(ft<+seek[1])sim(1/30);
  last=performance.now();requestAnimationFrame(loop);
}else{
  (function idle(){if(started)return;render();setTimeout(function(){requestAnimationFrame(idle)},40)})();
  intro.addEventListener('click',begin);
  if(document.fonts&&document.fonts.load)document.fonts.load('40px Cinzel');
}
})();
</script>
