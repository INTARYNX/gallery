<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Forest</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        #cherry-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="cherry-overlay"></canvas>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        
        // Background canvas animé style artistique
        const bgCanvas = document.createElement('canvas');
        bgCanvas.width = 1024;
        bgCanvas.height = 1024;
        const bgCtx = bgCanvas.getContext('2d');
        
        const cherryPositions = [];
        for (let i = 0; i < 8; i++) {
            cherryPositions.push({
                x: Math.random() * 1024,
                y: Math.random() * 1024,
                size: 60 + Math.random() * 80,
                speed: 0.2 + Math.random() * 0.3,
                opacity: 0.15 + Math.random() * 0.25,
                rotation: Math.random() * Math.PI * 2
            });
        }
        
        function drawArtisticBg() {
            const grad = bgCtx.createRadialGradient(512, 512, 0, 512, 512, 700);
            grad.addColorStop(0, '#1a0a0f');
            grad.addColorStop(0.6, '#0d0508');
            grad.addColorStop(1, '#000000');
            bgCtx.fillStyle = grad;
            bgCtx.fillRect(0, 0, 1024, 1024);
            
            cherryPositions.forEach(cherry => {
                cherry.y += cherry.speed;
                cherry.rotation += 0.002;
                if (cherry.y > 1100) {
                    cherry.y = -100;
                    cherry.x = Math.random() * 1024;
                }
                
                bgCtx.save();
                bgCtx.translate(cherry.x, cherry.y);
                bgCtx.rotate(cherry.rotation);
                
                bgCtx.fillStyle = `rgba(139, 0, 0, ${cherry.opacity * 0.3})`;
                bgCtx.beginPath();
                bgCtx.arc(10, 10, cherry.size, 0, Math.PI * 2);
                bgCtx.fill();
                
                const cherryGrad = bgCtx.createRadialGradient(-cherry.size/4, -cherry.size/4, 0, 0, 0, cherry.size);
                cherryGrad.addColorStop(0, `rgba(139, 0, 0, ${cherry.opacity})`);
                cherryGrad.addColorStop(0.7, `rgba(93, 14, 14, ${cherry.opacity})`);
                cherryGrad.addColorStop(1, `rgba(45, 5, 5, ${cherry.opacity * 0.5})`);
                
                bgCtx.fillStyle = cherryGrad;
                bgCtx.beginPath();
                bgCtx.arc(0, 0, cherry.size, 0, Math.PI * 2);
                bgCtx.fill();
                
                bgCtx.fillStyle = `rgba(255, 255, 255, ${cherry.opacity * 0.2})`;
                bgCtx.beginPath();
                bgCtx.arc(-cherry.size/3, -cherry.size/3, cherry.size/4, 0, Math.PI * 2);
                bgCtx.fill();
                
                bgCtx.strokeStyle = `rgba(93, 14, 14, ${cherry.opacity * 0.8})`;
                bgCtx.lineWidth = 3;
                bgCtx.lineCap = 'round';
                bgCtx.beginPath();
                bgCtx.moveTo(0, -cherry.size);
                bgCtx.quadraticCurveTo(cherry.size * 0.3, -cherry.size * 1.3, cherry.size * 0.2, -cherry.size * 1.6);
                bgCtx.stroke();
                
                bgCtx.restore();
            });
            
            bgTexture.needsUpdate = true;
        }
        
        const bgTexture = new THREE.CanvasTexture(bgCanvas);
        scene.background = bgTexture;

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        // Démarrage vue de dessus
        camera.position.set(0, 4, 0);
        camera.lookAt(0, 0.6, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Canvas overlay pour les cerises 2D
        const overlayCanvas = document.getElementById('cherry-overlay');
        const overlayCtx = overlayCanvas.getContext('2d');
        overlayCanvas.width = window.innerWidth;
        overlayCanvas.height = window.innerHeight;

        const sliceGroup = new THREE.Group();
        scene.add(sliceGroup);

        // Dimensions de la tranche triangulaire
        const sliceWidth = 1.0;
        const sliceDepth = 1.5;
        
        // Fonction helper : largeur du triangle à une profondeur Z donnée
        function triangleHalfWidth(z, width, depth) {
            const t = (z + depth / 2) / depth; // 0 à 1 (arrière vers pointe)
            return (width / 2) * (1 - t);
        }
        
        // Fonction helper : point aléatoire dans le triangle
        function randomPointInTriangle(width, depth) {
            const z = (Math.random() - 0.5) * depth;
            // Inverser le calcul : pointe à +depth/2, base à -depth/2
            const t = (depth / 2 - z) / depth; // 1 à 0 (base vers pointe)
            const halfWidth = (width / 2) * t;
            const x = (Math.random() * 2 - 1) * halfWidth;
            return { x, z };
        }

        // Textures
        function createCakeTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#2d1810';
            ctx.fillRect(0, 0, 512, 512);
            
            const imageData = ctx.getImageData(0, 0, 512, 512);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const noise = Math.random() * 60 - 30;
                data[i] = Math.max(0, Math.min(255, 45 + noise));
                data[i + 1] = Math.max(0, Math.min(255, 24 + noise));
                data[i + 2] = Math.max(0, Math.min(255, 16 + noise));
            }
            ctx.putImageData(imageData, 0, 0);
            
            return new THREE.CanvasTexture(canvas);
        }

        const cakeTexture = createCakeTexture();

        // Fonction pour créer une géométrie triangulaire
        function createTriangularLayerGeometry(width, depth, height) {
            const shape = new THREE.Shape();
            shape.moveTo(-width / 2, depth / 2);
            shape.lineTo(width / 2, depth / 2);
            shape.lineTo(0, -depth / 2);
            shape.closePath();

            const geometry = new THREE.ExtrudeGeometry(shape, {
                depth: height,
                bevelEnabled: false
            });

            geometry.rotateX(-Math.PI / 2);
            return geometry;
        }

        let currentY = 0;

        // Couches empilées
        const layers = [
            { height: 0.2, color: 0x3d2817, texture: cakeTexture, name: 'génoise' },
            { height: 0.1, color: 0xfff8e7, texture: null, name: 'crème' },
            { height: 0.2, color: 0x3d2817, texture: cakeTexture, name: 'génoise' },
            { height: 0.1, color: 0xfff8e7, texture: null, name: 'crème' },
            { height: 0.2, color: 0x3d2817, texture: cakeTexture, name: 'génoise' },
            { height: 0.15, color: 0x1a0f0a, texture: null, name: 'glaçage' }
        ];

        layers.forEach(layer => {
            const geometry = createTriangularLayerGeometry(sliceWidth, sliceDepth, layer.height);
            const material = new THREE.MeshStandardMaterial({
                map: layer.texture,
                color: layer.color,
                roughness: layer.name === 'crème' ? 0.4 : 0.85
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.y = currentY;
            sliceGroup.add(mesh);

            // Particules dans le triangle
            if (layer.name === 'génoise' || layer.name === 'crème') {
                const numParticles = layer.name === 'génoise' ? 300 : 150;
                for (let i = 0; i < numParticles; i++) {
                    const { x, z } = randomPointInTriangle(sliceWidth, sliceDepth);
                    const y = currentY + Math.random() * layer.height;

                    const size = 0.008 + Math.random() * 0.012;
                    const particleGeo = new THREE.SphereGeometry(size, 6, 6);
                    const particleMat = new THREE.MeshStandardMaterial({
                        color: layer.name === 'génoise' ? (Math.random() > 0.5 ? 0x3d2817 : 0x2d1810) : 0xfffef7,
                        roughness: 0.9
                    });
                    const particle = new THREE.Mesh(particleGeo, particleMat);
                    particle.position.set(x, y, z);
                    sliceGroup.add(particle);
                }
            }

            currentY += layer.height;
        });

        // Chantilly en torsade - positionnée au centre de la base arrière
        const baseZ = -sliceDepth * 0.35;
        const turns = 2.5;
        const segments = 50;
        
        for (let i = 0; i < segments; i++) {
            const t = i / segments;
            const angle = t * Math.PI * 2 * turns;
            const radius = 0.15 * (1 - t * 0.5); // Base plus large
            const height = t * 0.22;
            
            const x = Math.cos(angle) * radius;
            const y = currentY + 0.05 + height;
            const z = baseZ + Math.sin(angle) * radius;
            
            const segmentSize = 0.04 + (1 - t) * 0.03; // Segments plus gros à la base
            const creamSegGeo = new THREE.SphereGeometry(segmentSize, 8, 8);
            const creamSegMat = new THREE.MeshStandardMaterial({
                color: 0xfffef7,
                roughness: 0.3
            });
            const creamSeg = new THREE.Mesh(creamSegGeo, creamSegMat);
            creamSeg.position.set(x, y, z);
            sliceGroup.add(creamSeg);
        }

        // Cerise sur la chantilly (au centre de la base arrière)
        const cherryGeo = new THREE.SphereGeometry(0.08, 16, 16);
        const cherryMat = new THREE.MeshStandardMaterial({
            color: 0x5d0e0e,
            emissive: 0x1a0000,
            emissiveIntensity: 0.15,
            roughness: 0.15,
            metalness: 0.4
        });
        const cherry = new THREE.Mesh(cherryGeo, cherryMat);
        cherry.position.set(0, currentY + 0.32, baseZ);
        sliceGroup.add(cherry);

        // Paramètres pour les cerises en scrolling 2D
        const numScrollingCherries = 12;
        const scrollRadius2D = 150; // pixels

        // Copeaux de chocolat sur le dessus (dans le triangle)
        for (let i = 0; i < 500; i++) {
            const { x, z } = randomPointInTriangle(sliceWidth * 0.95, sliceDepth * 0.95);
            const y = currentY + 0.01 + Math.random() * 0.08;

            const chipGeo = new THREE.BoxGeometry(0.03, 0.01, 0.06);
            const chipMat = new THREE.MeshStandardMaterial({
                color: Math.random() > 0.5 ? 0x1a0f0a : 0x0d0705,
                roughness: 0.95
            });
            const chip = new THREE.Mesh(chipGeo, chipMat);
            chip.position.set(x, y, z);
            chip.rotation.set(Math.random() * 0.5, Math.random() * Math.PI * 2, Math.random() * 0.5);
            sliceGroup.add(chip);
        }

        // Copeaux sur les côtés (faces triangulaires)
        for (let i = 0; i < 100; i++) {
            const z = (Math.random() - 0.5) * sliceDepth;
            const t = (sliceDepth / 2 - z) / sliceDepth;
            const halfWidth = (sliceWidth / 2) * t;
            const side = Math.random() > 0.5 ? 1 : -1;
            const x = side * halfWidth;
            const y = Math.random() * currentY;

            const chipGeo = new THREE.BoxGeometry(0.02, 0.006, 0.04);
            const chipMat = new THREE.MeshStandardMaterial({
                color: Math.random() > 0.5 ? 0x1a0f0a : 0x0d0705,
                roughness: 0.95
            });
            const chip = new THREE.Mesh(chipGeo, chipMat);
            chip.position.set(x, y, z);
            chip.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
            sliceGroup.add(chip);
        }

        // Lumières
        scene.add(new THREE.AmbientLight(0x5d4037, 3));

        const light1 = new THREE.PointLight(0xffffff, 2, 100);
        light1.position.set(3, 3, 3);
        scene.add(light1);

        const light2 = new THREE.DirectionalLight(0xffddcc, 2.5);
        light2.position.set(-2, 3, 2);
        scene.add(light2);

        const light3 = new THREE.DirectionalLight(0xffffff, 1.5);
        light3.position.set(2, 2, -2);
        scene.add(light3);

        // Fonction pour dessiner le cercle de cerises
        function drawCherryCircle(rotTime) {
            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            
            // Calculer le centre de la tranche en 2D
            const centerX = overlayCanvas.width / 2;
            const centerY = overlayCanvas.height / 2;
            
            // Fade in global (première seconde)
            const globalFade = Math.min(1, rotTime * 2);
            
            // Dessiner les cerises
            for (let i = 0; i < numScrollingCherries; i++) {
                const angle = rotTime * 0.8 + (i / numScrollingCherries) * Math.PI * 2;
                const x = centerX + Math.cos(angle) * scrollRadius2D;
                const y = centerY + Math.sin(angle) * scrollRadius2D;
                
                // Apparition décalée cerise par cerise
                const cherryDelay = i * 0.08; // 0.08s de décalage entre chaque
                const cherryFade = Math.max(0, Math.min(1, (rotTime - cherryDelay) * 3));
                const opacity = globalFade * cherryFade;
                
                if (opacity <= 0) continue;
                
                // Taille variable sinusoïdale
                const sizeVariation = Math.sin(rotTime * 2 + i * 0.5) * 0.3 + 0.8; // 0.5 à 1.1
                const cherrySize = 20 * sizeVariation;
                
                // Ombre
                const gradient = overlayCtx.createRadialGradient(x, y, 0, x, y, cherrySize);
                gradient.addColorStop(0, `rgba(139, 0, 0, ${0.8 * opacity})`);
                gradient.addColorStop(0.7, `rgba(93, 14, 14, ${0.6 * opacity})`);
                gradient.addColorStop(1, 'rgba(45, 5, 5, 0)');
                
                overlayCtx.fillStyle = gradient;
                overlayCtx.beginPath();
                overlayCtx.arc(x, y, cherrySize, 0, Math.PI * 2);
                overlayCtx.fill();
                
                // Reflet
                overlayCtx.fillStyle = `rgba(255, 255, 255, ${0.3 * opacity})`;
                overlayCtx.beginPath();
                overlayCtx.arc(x - cherrySize/3, y - cherrySize/3, cherrySize/3, 0, Math.PI * 2);
                overlayCtx.fill();
            }
        }

        // Animation
        let time = 0;
        const cameraDuration = 3;
        const transitionDuration = 1.0; // Transition plus longue
        let rotationStartY = 0; // Stocke la rotation Y de départ
        
        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;
            
            drawArtisticBg();
            
            // Transition de caméra : dessus -> côté
            if (time < cameraDuration) {
                const t = time / cameraDuration;
                const smoothT = t * t * (3 - 2 * t);
                
                camera.position.x = smoothT * 3;
                camera.position.y = 4 - smoothT * 2.5;
                camera.position.z = smoothT * 3;
                camera.lookAt(0, 0.6, 0);
            }
            
            // Rotation avec transition fluide
            if (time >= cameraDuration + transitionDuration) {
                // Rotation old school pure (sens horaire)
                const rotTime = time - cameraDuration - transitionDuration;
                sliceGroup.rotation.y = rotationStartY - rotTime * 0.8;
                sliceGroup.rotation.x = Math.sin(rotTime * 0.5) * 0.3;
                sliceGroup.rotation.z = Math.cos(rotTime * 0.7) * 0.2;
                
                // Centrer la tranche à l'écran verticalement
                sliceGroup.position.set(0, -0.5, 0);
                
                // Afficher le cercle de cerises 2D
                overlayCanvas.style.display = 'block';
                drawCherryCircle(rotTime);
            } else if (time >= cameraDuration) {
                // Transition entre les deux modes
                const t = (time - cameraDuration) / transitionDuration;
                const smoothT = t * t * (3 - 2 * t);
                
                // Rotation douce initiale
                const rotSoft = {
                    y: Math.sin(time * 0.2) * 0.5 + Math.cos(time * 0.15) * 0.3,
                    x: Math.sin(time * 0.25) * 0.08,
                    z: Math.cos(time * 0.18) * 0.05
                };
                
                // Capturer la rotation de départ au début de la transition
                if (t < 0.02) {
                    rotationStartY = rotSoft.y;
                }
                
                // Rotation old school (depuis la position actuelle)
                const rotOld = {
                    y: rotationStartY,
                    x: Math.sin(0) * 0.3,
                    z: Math.cos(0) * 0.2
                };
                
                sliceGroup.rotation.y = rotSoft.y * (1 - smoothT) + rotOld.y * smoothT;
                sliceGroup.rotation.x = rotSoft.x * (1 - smoothT) + rotOld.x * smoothT;
                sliceGroup.rotation.z = rotSoft.z * (1 - smoothT) + rotOld.z * smoothT;
            } else {
                // Rotation douce pendant mouvement caméra
                sliceGroup.rotation.y = Math.sin(time * 0.2) * 0.5 + Math.cos(time * 0.15) * 0.3;
                sliceGroup.rotation.x = Math.sin(time * 0.25) * 0.08;
                sliceGroup.rotation.z = Math.cos(time * 0.18) * 0.05;
                
                // Cacher le cercle de cerises pendant la première partie
                overlayCanvas.style.display = 'none';
            }
            
            sliceGroup.position.y = Math.sin(time * 0.4) * 0.08 + Math.cos(time * 0.6) * 0.03;
            sliceGroup.position.x = Math.sin(time * 0.35) * 0.04;
            
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            overlayCanvas.width = window.innerWidth;
            overlayCanvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
