<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Alien Script</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: monospace;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  canvas {
    background: #000;
    border-radius: 4px;
    touch-action: none;
  }
  #hud {
    position: fixed;
    top: 10px; left: 12px;
    color: #9bffc4;
    font-size: 11px;
    letter-spacing: 3px;
    opacity: 0.45;
    text-transform: uppercase;
    text-shadow: 0 0 8px rgba(90,255,160,0.6);
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, CENTER = { x: 0, y: 0 };

function resize() {
  const s = Math.min(window.innerWidth, window.innerHeight) * 0.92;
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = s + 'px';
  cv.style.height = s + 'px';
  cv.width = s * dpr;
  cv.height = s * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  W = s; H = s;
  CENTER = { x: W / 2, y: H / 2 };
}
window.addEventListener('resize', resize);
resize();

// type: 'arc' = suit la circonférence, 'radial' = vers/depuis le centre
const ALIEN_ALPHABET = {
  A: [['arc',2],['radial',1],['arc',-2],['radial',-1]],
  B: [['radial',1],['arc',3],['radial',-1],['arc',-3]],
  C: [['arc',3]],
  D: [['radial',1],['arc',2],['radial',-1]],
  E: [['arc',2],['radial',1],['arc',-1],['radial',-1]],
  F: [['radial',1],['arc',1],['radial',-1],['arc',1]],
  G: [['arc',3],['radial',1],['arc',-1]],
  H: [['radial',1],['arc',2],['radial',-1],['radial',1],['arc',-2]],
  I: [['radial',1],['radial',-1]],
  J: [['radial',1],['arc',2]],
  K: [['radial',1],['arc',2],['arc',-2],['radial',-1]],
  L: [['radial',-1],['arc',2]],
  M: [['radial',1],['arc',1],['radial',-1],['radial',1],['arc',1],['radial',-1]],
  N: [['radial',1],['arc',2],['radial',-1]],
  O: [['arc',8]],
  P: [['radial',1],['arc',2],['radial',-1],['arc',-2]],
  Q: [['arc',8],['radial',1]],
  R: [['radial',1],['arc',2],['radial',-1],['arc',1]],
  S: [['arc',2],['arc',-2],['arc',2]],
  T: [['arc',2],['radial',1]],
  U: [['radial',1],['arc',2],['radial',-1]],
  V: [['radial',1],['arc',1],['radial',-1]],
  W: [['radial',1],['arc',1],['radial',-1],['arc',1],['radial',1],['arc',1],['radial',-1]],
  X: [['arc',2],['arc',-4],['arc',2]],
  Y: [['radial',1],['arc',1],['radial',1]],
  Z: [['arc',2],['radial',-1],['arc',2]]
};

const ALIEN_WORDS = [
  "XAR","VOTH","QIRA","NEX","KHOR","ZYTH","ARQEN","VEL",
  "IXOR","THAQ","ZORAN","VEXIL","KYR","ORTH","QEX"
];

const DIALECTS = ['#5fff9d','#2ad6ff','#b9ff3c','#ff5e3a','#caff66'];

function wordToGlyph(word) {
  const seq = [];
  for (const ch of word) {
    const letter = ALIEN_ALPHABET[ch];
    if (!letter) continue;
    seq.push(...letter);
    seq.push(null);
  }
  return seq;
}

const STEP_ANGLE = Math.PI / 12;
const MAX_LEN = 90;

function newWord() {
  return ALIEN_WORDS[Math.floor(Math.random() * ALIEN_WORDS.length)];
}

function makeSnake(ring) {
  const radius = 45 + ring * 32;
  return {
    angle: Math.random() * Math.PI * 2,
    radius,
    baseRadius: radius,
    stepRadius: Math.max(6, radius * 0.10),
    glyph: wordToGlyph(newWord()),
    gi: 0,
    arcLeft: undefined,
    body: [],
    color: DIALECTS[ring % DIALECTS.length],
    speed: 0.5 + Math.random() * 0.5
  };
}

const RINGS = Math.min(7, Math.floor((Math.min(W, H) / 2 - 50) / 32));
let snakes = [];
function build() {
  snakes = [];
  for (let r = 1; r <= RINGS; r++) snakes.push(makeSnake(r));
}
build();

function step(sn) {
  if (sn.gi >= sn.glyph.length) {
    sn.glyph = wordToGlyph(newWord());
    sn.gi = 0;
    sn.body.unshift(null);
  }
  const stroke = sn.glyph[sn.gi];
  if (stroke === null) {
    sn.body.unshift(null);
    sn.gi++;
    return;
  }
  const [type, val] = stroke;
  if (type === 'arc') {
    sn.angle += STEP_ANGLE * Math.sign(val);
    sn.arcLeft = (sn.arcLeft ?? Math.abs(val)) - 1;
    if (sn.arcLeft <= 0) { sn.gi++; sn.arcLeft = undefined; }
  } else {
    sn.radius += sn.stepRadius * val;
    sn.radius = Math.max(20, Math.min(sn.baseRadius + sn.stepRadius, sn.radius));
    sn.gi++;
  }
  const px = CENTER.x + Math.cos(sn.angle) * sn.radius;
  const py = CENTER.y + Math.sin(sn.angle) * sn.radius;
  sn.body.unshift({ x: px, y: py });
  if (sn.body.length > MAX_LEN) sn.body.pop();
}

function drawSnake(sn) {
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  let prev = null;
  for (let i = 0; i < sn.body.length; i++) {
    const p = sn.body[i];
    if (!p) { prev = null; continue; }
    if (prev) {
      const fade = 1 - i / sn.body.length;
      // onde sinusoïdale qui se balade le long de l'écriture
      const wave = 0.5 + 0.5 * Math.sin(i * 0.45 - tick * 0.18);
      ctx.strokeStyle = sn.color;
      ctx.globalAlpha = fade * (0.25 + wave * 0.75);
      ctx.lineWidth = 1 + fade * 2.5 + wave * 2;
      ctx.shadowColor = sn.color;
      ctx.shadowBlur = (6 + wave * 16) * fade;
      ctx.beginPath();
      ctx.moveTo(prev.x, prev.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
    prev = p;
  }
  // head
  const head = sn.body.find(b => b);
  if (head) {
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 14;
    ctx.fillStyle = sn.color;
    ctx.beginPath();
    ctx.arc(head.x, head.y, 2.8, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

let tick = 0;
let rotation = 0;        // angle actuel appliqué aux snakes
let rotTarget = 0;       // angle cible
let lastRotTime = performance.now();

function loop(now) {
  now = now || performance.now();
  // tous les 5s : nouvelle cible +45°
  if (now - lastRotTime >= 5000) {
    rotTarget += Math.PI / 4;
    lastRotTime = now;
  }
  // interpolation douce vers la cible
  rotation += (rotTarget - rotation) * 0.06;

  // fond dessiné dans le canvas : halos vert phosphore + rouge alerte
  ctx.clearRect(0, 0, W, H);

  let g = ctx.createRadialGradient(W*0.5, H*0.5, 0, W*0.5, H*0.5, W*0.55);
  g.addColorStop(0, '#06120c');
  g.addColorStop(0.7, '#030604');
  g.addColorStop(1, '#000');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';
  let g2 = ctx.createRadialGradient(W*0.25, H*0.15, 0, W*0.25, H*0.15, W*0.6);
  g2.addColorStop(0, 'rgba(40,160,90,0.18)');
  g2.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g2;
  ctx.fillRect(0, 0, W, H);

  let g3 = ctx.createRadialGradient(W*0.8, H*0.95, 0, W*0.8, H*0.95, W*0.65);
  g3.addColorStop(0, 'rgba(170,30,18,0.20)');
  g3.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g3;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';

  // oeil HAL 9000 au centre
  // blink pseudo-aléatoire : flicker rapide + extinctions occasionnelles
  let blink = 1;
  const flick = Math.sin(tick*0.7)*Math.sin(tick*0.23)*Math.sin(tick*1.3);
  blink = 0.85 + flick * 0.15;
  if ((Math.sin(tick*0.013)*43758.5453 % 1) > 0.985) blink *= 0.25; // coupure brève
  if ((Math.sin(tick*0.041+2.0)*12543.21 % 1) > 0.97) blink *= 0.55; // creux

  const pulse = (0.5 + 0.5 * Math.sin(tick * 0.04)) * blink;
  const eyeR = Math.min(W, H) * 0.045;

  // halo rouge diffus
  let halo = ctx.createRadialGradient(CENTER.x, CENTER.y, 0, CENTER.x, CENTER.y, eyeR * 6);
  halo.addColorStop(0, `rgba(255,40,20,${(0.30 + pulse*0.15) * blink})`);
  halo.addColorStop(0.4, `rgba(180,10,5,${0.10 * blink})`);
  halo.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = halo;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';

  // corps noir de l'oeil
  ctx.fillStyle = '#0a0202';
  ctx.beginPath();
  ctx.arc(CENTER.x, CENTER.y, eyeR * 1.5, 0, Math.PI * 2);
  ctx.fill();

  // lentille rouge lumineuse
  let lens = ctx.createRadialGradient(
    CENTER.x - eyeR*0.3, CENTER.y - eyeR*0.3, 0,
    CENTER.x, CENTER.y, eyeR
  );
  const k = 0.4 + blink * 0.6; // assombrit la lentille quand ça blink
  lens.addColorStop(0, `rgba(255,210,122,${k})`);
  lens.addColorStop(0.25, `rgba(255,90,42,${k})`);
  lens.addColorStop(0.7, `rgba(194,8,0,${k})`);
  lens.addColorStop(1, '#3a0200');
  ctx.shadowColor = 'rgba(255,40,20,0.9)';
  ctx.shadowBlur = (30 + pulse * 25) * blink;
  ctx.fillStyle = lens;
  ctx.beginPath();
  ctx.arc(CENTER.x, CENTER.y, eyeR, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // point chaud central
  ctx.fillStyle = `rgba(255,220,150,${(0.6 + pulse*0.4) * blink})`;
  ctx.beginPath();
  ctx.arc(CENTER.x, CENTER.y, eyeR * 0.3, 0, Math.PI * 2);
  ctx.fill();

  // faint concentric guide rings + snakes : tournent ensemble
  ctx.save();
  ctx.translate(CENTER.x, CENTER.y);
  ctx.rotate(rotation);
  ctx.translate(-CENTER.x, -CENTER.y);

  ctx.strokeStyle = 'rgba(90,255,160,0.05)';
  ctx.lineWidth = 1;
  for (const sn of snakes) {
    ctx.beginPath();
    ctx.arc(CENTER.x, CENTER.y, sn.baseRadius, 0, Math.PI * 2);
    ctx.stroke();
  }

  tick++;
  for (const sn of snakes) {
    if (tick % Math.round(2 / sn.speed) === 0) step(sn);
    drawSnake(sn);
  }

  ctx.restore();
  requestAnimationFrame(loop);
}
loop();

window.addEventListener('resize', () => { resize(); build(); });
</script>
</body>
</html>
