        function parsePath(p) {
			// Array to store points, including the new 'isStart' flag.
			const pts = []; 
			// Splits the path string into individual commands (e.g., ['M10 10', 'L20 20', 'M30 30', ...])
			const cmds = p.match(/[a-zA-Z][^a-zA-Z]*/g);
			let x = 0, y = 0; // Current position
			
			cmds.forEach(c => {
				const t = c[0]; // Command type (M, L, C, etc.)
				// Extracts and parses numeric values for the command
				const v = c.slice(1).trim().split(/[\s,]+/).map(parseFloat);
				
				if (t === 'M' || t === 'm') {
					// M (MoveTo) starts a new subpath. It sets the position but doesn't draw a line.
					x = t === 'M' ? v[0] : x + v[0];
					y = t === 'M' ? v[1] : y + v[1];
					// *** FIX 1: Add isStart: true flag for MoveTo commands ***
					pts.push({x, y, isStart: true});
					
					// Handle implicit LineTo commands after the initial MoveTo (e.g., M10 10 20 20 L30 30)
					for (let i = 2; i < v.length; i += 2) {
						x = t === 'M' ? v[i] : x + v[i]; // If absolute, coordinates are absolute
						y = t === 'M' ? v[i+1] : y + v[i+1]; // If relative, coordinates are relative
						// Implicit LineTos are drawing commands, so isStart is false.
						pts.push({x, y, isStart: false});
					}
				} else if (t === 'L' || t === 'l') {
					// L (LineTo) is a drawing command.
					for (let i = 0; i < v.length; i += 2) {
						x = t === 'L' ? v[i] : x + v[i];
						y = t === 'L' ? v[i+1] : y + v[i+1];
						// isStart is false for drawing commands.
						pts.push({x, y, isStart: false});
					}
				} else if (t === 'C' || t === 'c') {
					// C (CurveTo) is a drawing command. We only record the final point of the curve.
					for (let i = 0; i < v.length; i += 6) {
						x = t === 'C' ? v[i+4] : x + v[i+4]; // The x-coordinate of the final point (x2)
						y = t === 'C' ? v[i+5] : y + v[i+5]; // The y-coordinate of the final point (y2)
						// isStart is false for drawing commands.
						pts.push({x, y, isStart: false});
					}
				} else if (t === 'Z' || t === 'z') {
					// Z (ClosePath) is a drawing command that connects back to the start of the current subpath.
					// Find the *last* point with isStart: true (the start of the current subpath).
					const subpathStart = pts.slice().reverse().find(p => p.isStart);
					if (subpathStart) {
						// Update current position to the start point and push.
						x = subpathStart.x;
						y = subpathStart.y;
						// isStart is false because it's the result of a drawing action.
						pts.push({x, y, isStart: false});
					}
				}
			});
			return pts;
		}
        
        const svgPts = parsePath(svgPath);
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        svgPts.forEach(p => {

			// Iterate through all points, stopping one before the end
			for (let i = 0; i < svgPts.length - 1; i++) {
				const p1 = svgPts[i]; // Starting point of the segment

				if (p2.isStart) {

					y: (p1.y - minY - svgH / 2) * scale + CY + offY

					y: (p2.y - minY - svgH / 2) * scale + CY + offY
				};
				
				edges.push({s, e});
			}
			return edges;

        function calculateStaticDist(edges) {
            staticDistMap.fill(999);
            for (let y = 0; y < RH; y++) {
                for (let x = 0; x < RW; x++) {
                    const idx = y * RW + x;
                    let minDist = 999;

                        const bx = eg.e.x - eg.s.x, by = eg.e.y - eg.s.y;
                        const len = bx * bx + by * by;
                        let t = len === 0 ? 0 : Math.max(0, Math.min(1, (ax * bx + ay * by) / len));
                        const px = eg.s.x + t * bx, py = eg.s.y + t * by;
                        const dx = x - px, dy = y - py;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < minDist) minDist = dist;
                    }
                    staticDistMap[idx] = minDist;
                }
            }
        }

        function getDist(x, y, offsetX, offsetY) {
            const sx = Math.floor(x - offsetX);
            const sy = Math.floor(y - offsetY);
            if (sx < 0 || sx >= RW || sy < 0 || sy >= RH) return 999;
            return staticDistMap[sy * RW + sx];
        }

            eg.e.x += RW / 2; eg.e.y += RH / 2;
        });

            const b = Math.floor((i / 14) * 255);

        tctx.moveTo(RW / 2, RH * 0.3 - 100);
        tctx.lineTo(RW / 2, RH * 0.3 + 100);
        tctx.stroke();

        tctx.fillRect(0, RH * 0.8, RW, RH * 0.2);

        function vhsGlitch(inp) {
            const out = new Uint8ClampedArray(inp.length);
            out.set(inp);

            const hasG = Math.random() < 0.05;
            const gLine = ~~(Math.random() * RH);
            const gH = ~~(Math.random() * 15) + 5;
            const gOff = ~~((Math.random() - 0.5) * 30);
            const hasT = Math.random() < 0.03;
            const tBand = ~~(Math.random() * 5) * 40;

            for (let y = 0; y < RH; y++) {
                for (let x = 0; x < RW; x++) {
                    const idx = (y * RW + x) * 4;
                    let sx = x, sy = y;
                    
                    if (hasG && y >= gLine && y < gLine + gH) {
                        sx = Math.max(0, Math.min(RW - 1, x + gOff));
                    }
                    
                    if (hasT && y >= tBand && y < tBand + 20) {
                        sy = Math.max(0, Math.min(RH - 1, y + 15));
                    }
                    
                    const sIdx = (sy * RW + sx) * 4;
                    const cShift = ~~(Math.sin(y * 0.05) * 2);
                    const rX = Math.max(0, Math.min(RW - 1, sx + cShift));
                    const bX = Math.max(0, Math.min(RW - 1, sx - cShift));
                    
                    // Blur horizontal léger
                    const blurR = (inp[(sy * RW + Math.max(0, rX - 1)) * 4] + inp[(sy * RW + rX) * 4] + inp[(sy * RW + Math.min(RW - 1, rX + 1)) * 4]) / 3;
                    const blurG = (inp[Math.max(0, sIdx - 4) + 1] + inp[sIdx + 1] + inp[Math.min(inp.length - 4, sIdx + 4) + 1]) / 3;
                    const blurB = (inp[(sy * RW + Math.max(0, bX - 1)) * 4 + 2] + inp[(sy * RW + bX) * 4 + 2] + inp[(sy * RW + Math.min(RW - 1, bX + 1)) * 4 + 2]) / 3;
                    
                    // Grain
                    const grain = (Math.random() - 0.5) * 25;
                    
                    out[idx] = Math.max(0, Math.min(255, blurR + grain));
                    out[idx + 1] = Math.max(0, Math.min(255, blurG + grain));
                    out[idx + 2] = Math.max(0, Math.min(255, blurB + grain));
                    out[idx + 3] = 255;
                }
            }
            
            if (Math.random() < 0.03) {
                const dy = ~~(Math.random() * RH);
                const dh = ~~(Math.random() * 3) + 1;
                for (let y = dy; y < Math.min(RH, dy + dh); y++) {
                    for (let x = 0; x < RW; x++) {
                        const idx = (y * RW + x) * 4;
                        const n = Math.random() * 50;
                        out[idx] = out[idx + 1] = out[idx + 2] = n;
                    }
                }
            }
            return out;
        }

        function draw(ts) {
            const dt = (ts - lastT) / 1000;
            lastT = ts;
            time += dt * 0.5;
            rollPos += dt * 30;
            if (rollPos > DH) rollPos = 0;
            tcPhase += dt;
            
            // 1. MIRE AVEC SCROLLING (DÉBUT)
            if (transTC) {
                transPhase += dt;
                const prog = Math.min(1, transPhase / 3);
                
                const rollSpd = (1 - prog) * 200;
                const rollOff = (time * rollSpd) % RH;
                
                for (let i = 0; i < RW * RH; i++) {
                    const v = Math.random() * 200, idx = i * 4;
                    d[idx] = d[idx + 1] = d[idx + 2] = v;
                    d[idx + 3] = 255;
                }
                ctx.putImageData(img, 0, 0);
                ctx.imageSmoothingEnabled = false;
                
                // Créer version glitchée avec blur et grain
                const tmpCanvas = document.createElement('canvas');
                tmpCanvas.width = RW;
                tmpCanvas.height = RH;
                const tmpCtx = tmpCanvas.getContext('2d');
                tmpCtx.drawImage(tcCanvas, 0, 0);
                const tcData = tmpCtx.getImageData(0, 0, RW, RH);
                const glitched = vhsGlitch(tcData.data);
                const glitchedImg = new ImageData(glitched, RW, RH);
                tmpCtx.putImageData(glitchedImg, 0, 0);
                
                ctx.save();
                ctx.globalAlpha = prog;
                const scaledRollY = -(rollOff / RH) * DH;
                ctx.drawImage(tmpCanvas, 0, 0, RW, RH, 0, scaledRollY, DW, DH);
                ctx.drawImage(tmpCanvas, 0, 0, RW, RH, 0, scaledRollY + DH, DW, DH);
                ctx.restore();
                
                const g = ctx.createLinearGradient(0, rollPos - 80, 0, rollPos + 80);
                g.addColorStop(0, 'rgba(0,0,0,0)');
                g.addColorStop(0.5, 'rgba(0,0,0,0.15)');
                g.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = g;
                ctx.fillRect(0, rollPos - 80, DW, 160);
                
                // Scanlines
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                for (let y = 0; y < DH; y += 4) ctx.fillRect(0, y, DW, 2);
                
                if (transPhase >= 3) {
                    transTC = false;
                    inTC = true;
                    tcPhase = 0;
                    transPhase = 0;
                }
                requestAnimationFrame(draw);
                return;
            }
            
            // 2. MIRE → PARASITES (première fois seulement)
            if (inTC && tcPhase < 10 && !skullShown) {
                const deg = tcPhase / 10;
                const gData = vhsGlitch(origTC);
                for (let i = 0; i < RW * RH; i++) {
                    const n = Math.random() * 200, idx = i * 4;
                    d[idx] = gData[idx] * (1 - deg) + n * deg;
                    d[idx + 1] = gData[idx + 1] * (1 - deg) + n * deg;
                    d[idx + 2] = gData[idx + 2] * (1 - deg) + n * deg;
                    d[idx + 3] = 255;
                }
                ctx.putImageData(img, 0, 0);
                ctx.imageSmoothingEnabled = false;
                const g = ctx.createLinearGradient(0, rollPos - 80, 0, rollPos + 80);
                g.addColorStop(0, 'rgba(0,0,0,0)');
                g.addColorStop(0.5, 'rgba(0,0,0,0.15)');
                g.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = g;
                ctx.fillRect(0, rollPos - 80, DW, 160);
                
                // Scanlines
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                for (let y = 0; y < DH; y += 4) ctx.fillRect(0, y, DW, 2);
                
                requestAnimationFrame(draw);
                return;
            }
            
            // 6. MIRE STABLE (10 sec) après le crâne
            if (inTC && skullShown && tcPhase < 10) {
                const gData = vhsGlitch(origTC);
                for (let i = 0; i < RW * RH; i++) {
                    const idx = i * 4;
                    d[idx] = gData[idx];
                    d[idx + 1] = gData[idx + 1];
                    d[idx + 2] = gData[idx + 2];
                    d[idx + 3] = 255;
                }
                ctx.putImageData(img, 0, 0);
                ctx.imageSmoothingEnabled = false;
                const g = ctx.createLinearGradient(0, rollPos - 80, 0, rollPos + 80);
                g.addColorStop(0, 'rgba(0,0,0,0)');
                g.addColorStop(0.5, 'rgba(0,0,0,0.15)');
                g.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = g;
                ctx.fillRect(0, rollPos - 80, DW, 160);
                
                // Scanlines
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                for (let y = 0; y < DH; y += 4) ctx.fillRect(0, y, DW, 2);
                
                requestAnimationFrame(draw);
                return;
            }
            
            // Passage au crâne après première mire
            if (inTC && tcPhase >= 10 && !skullShown) {
                inTC = false;
                appPhase = 0;
                nextApp = Math.random() * 8 + 6;
            }
            
            // Passage au shutdown après deuxième mire
            if (inTC && tcPhase >= 10 && skullShown) {
                tvOff = true;
                offPhase = 0;
                inTC = false;
                finalSequence = true;
            }
            
            // 7. TV S'ÉTEINT + 8. SANG + 9. FIN
            if (tvOff) {
                offPhase += dt;
                if (offPhase < 0.5) {
                    const gData = vhsGlitch(origTC);
                    for (let i = 0; i < RW * RH; i++) {
                        const idx = i * 4;
                        d[idx] = gData[idx];
                        d[idx + 1] = gData[idx + 1];
                        d[idx + 2] = gData[idx + 2];
                        d[idx + 3] = 255;
                    }
                    ctx.putImageData(img, 0, 0);
                    ctx.imageSmoothingEnabled = false;
                    ctx.drawImage(canvas, 0, 0, RW, RH, 0, 0, DW, DH);
                } else if (offPhase < 1.2) {
                    const prog = (offPhase - 0.5) / 0.7;
                    const gData = vhsGlitch(origTC);
                    for (let i = 0; i < RW * RH; i++) {
                        const idx = i * 4;
                        d[idx] = gData[idx];
                        d[idx + 1] = gData[idx + 1];
                        d[idx + 2] = gData[idx + 2];
                        d[idx + 3] = 255;
                    }
                    ctx.fillStyle = '#000';
                    ctx.fillRect(0, 0, DW, DH);
                    const cy = DH / 2, h = DH * (1 - prog), yo = cy - h / 2;
                    ctx.putImageData(img, 0, 0);
                    ctx.imageSmoothingEnabled = false;
                    ctx.drawImage(canvas, 0, 0, RW, RH, 0, yo, DW, h);
                    ctx.fillStyle = `rgba(0,0,0,${prog * 0.5})`;
                    ctx.fillRect(0, 0, DW, DH);
                } else if (offPhase < 1.5) {
                    const prog = (offPhase - 1.2) / 0.3;
                    ctx.fillStyle = '#000';
                    ctx.fillRect(0, 0, DW, DH);
                    const cy = DH / 2, lh = 4 * (1 - prog), br = ~~(255 * (1 - prog));
                    ctx.fillStyle = `rgb(${br},${br},${br})`;
                    ctx.fillRect(0, cy - lh / 2, DW, lh);
                } else if (offPhase < 1.8) {
                    const prog = (offPhase - 1.5) / 0.3;
                    ctx.fillStyle = '#000';
                    ctx.fillRect(0, 0, DW, DH);
                    const cx = DW / 2, cy = DH / 2, br = ~~(255 * (1 - prog));
                    const sz = 3 * (1 - prog * 0.5);
                    ctx.fillStyle = `rgb(${br},${br},${br})`;
                    ctx.fillRect(cx - sz, cy - sz, sz * 2, sz * 2);
                } else {
                    ctx.fillStyle = '#000';
                    ctx.fillRect(0, 0, DW, DH);
                    const bPhase = offPhase - 1.8;
                    
                    // Délai de 3 secondes avant le sang
                    if (bPhase > 3 && bPhase < 7 && Math.random() < 0.08) {
                        const sp = {
                            x: Math.random() * DW, y: Math.random() * DH * 0.6,
                            size: Math.random() * 40 + 30, opacity: Math.random() * 0.3 + 0.6,
                            splashes: [], droplets: null
                        };
                        const ns = ~~(Math.random() * 8) + 12;
                        for (let i = 0; i < ns; i++) {
                            const ang = (i / ns) * Math.PI * 2 + Math.random() * 0.5;
                            const dist = (Math.random() * 0.5 + 0.5) * sp.size;
                            sp.splashes.push({
                                x: Math.cos(ang) * dist, y: Math.sin(ang) * dist,
                                size: Math.random() * 15 + 8
                            });
                        }
                        bloodSplat.push(sp);
                    }
                    if (bPhase > 3.5 && bPhase < 8 && Math.random() < 0.04) {
                        bloodDrip.push({
                            x: Math.random() * DW, startY: Math.random() * DH * 0.4,
                            currentY: Math.random() * DH * 0.4, length: 0,
                            maxLength: Math.random() * 200 + 100, width: Math.random() * 3 + 2,
                            speed: Math.random() * 40 + 30, opacity: Math.random() * 0.3 + 0.5
                        });
                    }
                    bloodSplat.forEach(sp => {
                        ctx.fillStyle = `rgba(85,8,8,${sp.opacity})`;
                        ctx.beginPath();
                        ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
                        ctx.fill();
                        sp.splashes.forEach(sl => {
                            ctx.beginPath();
                            ctx.arc(sp.x + sl.x, sp.y + sl.y, sl.size, 0, Math.PI * 2);
                            ctx.fill();
                        });
                        if (!sp.droplets) {
                            sp.droplets = [];
                            const nd = ~~(Math.random() * 5) + 3;
                            for (let i = 0; i < nd; i++) {
                                const ang = Math.random() * Math.PI * 2;
                                const dist = sp.size + Math.random() * 30;
                                sp.droplets.push({
                                    x: sp.x + Math.cos(ang) * dist,
                                    y: sp.y + Math.sin(ang) * dist,
                                    size: Math.random() * 4 + 2
                                });
                            }
                        }
                        sp.droplets.forEach(dr => {
                            ctx.beginPath();
                            ctx.arc(dr.x, dr.y, dr.size, 0, Math.PI * 2);
                            ctx.fill();
                        });
                    });
                    bloodDrip.forEach(dr => {
                        dr.currentY += dr.speed * dt;
                        dr.length = Math.min(dr.currentY - dr.startY, dr.maxLength);
                        if (dr.length > 0) {
                            const g = ctx.createLinearGradient(dr.x, dr.startY, dr.x, dr.currentY);
                            g.addColorStop(0, `rgba(80,8,8,${dr.opacity * 0.3})`);
                            g.addColorStop(0.7, `rgba(90,10,10,${dr.opacity})`);
                            g.addColorStop(1, `rgba(100,12,12,${dr.opacity})`);
                            ctx.strokeStyle = g;
                            ctx.lineWidth = dr.width;
                            ctx.lineCap = 'round';
                            ctx.beginPath();
                            ctx.moveTo(dr.x, dr.startY);
                            for (let i = 1; i <= 10; i++) {
                                const p = i / 10, y = dr.startY + dr.length * p;
                                const w = Math.sin(p * Math.PI * 4) * 2;
                                ctx.lineTo(dr.x + w, y);
                            }
                            ctx.stroke();
                            if (dr.currentY < DH) {
                                ctx.fillStyle = `rgba(90,10,10,${dr.opacity})`;
                                ctx.beginPath();
                                ctx.arc(dr.x, dr.currentY, dr.width * 1.5, 0, Math.PI * 2);
                                ctx.fill();
                            }
                        }
                    });
                    
                    // 9. FIN (STOP DÉFINITIF) - après 9 secondes de sang
                    if (bPhase > 9) {
                        ctx.fillStyle = '#000';
                        ctx.fillRect(0, 0, DW, DH);
                        
                        // Afficher le titre "The Death Signal"
                        const titlePhase = bPhase - 9;
                        const titleAlpha = Math.min(1, titlePhase / 2);
                        
                        ctx.globalAlpha = titleAlpha;
                        ctx.fillStyle = '#8b0000';
                        ctx.font = 'bold 48px serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('The Death Signal', DW / 2, DH / 2);
                        ctx.globalAlpha = 1;
                        
                        requestAnimationFrame(draw);
                        return;
                    }
                }
                requestAnimationFrame(draw);
                return;
            }
            
            // 3. CRÂNE APPARAÎT + 4. CRÂNE DISPARAÎT
            appPhase += dt;
            let vis = 0, sharp = 0;
            
            if (appPhase < nextApp) {
                vis = sharp = 0;
            } else if (appPhase < nextApp + 5) {
                vis = sharp = (appPhase - nextApp) / 5;
            } else if (appPhase < nextApp + 11) {
                vis = sharp = 1;
            } else if (appPhase < nextApp + 16) {
                vis = sharp = 1 - (appPhase - nextApp - 11) / 5;
            } else {
                vis = sharp = 0;
                if (appPhase > nextApp + 17) {
                    // 5. MIRE RÉAPPARAÎT AVEC SCROLLING
                    skullShown = true;
                    transTC = true;
                    transPhase = 0;
                }
            }
            
            const edges = vis > 0 ? getEdges(time) : [];
            const wobble = Math.sin(time * 2) * 2;
            const totalOffX = offX + wobble;
            const totalOffY = offY;
            const dThresh = DLIM + (1 - sharp) * 35;
            
            const step = 2;
            for (let i = 0; i < RW * RH; i += step) {
                const x = i % RW, y = ~~(i / RW);
                const dist = getDist(x, y, totalOffX, totalOffY);
                let v = Math.random() * 255;
                if (dist < dThresh && vis > 0) {
                    const n = Math.random() * 0.7 + 0.3;
                    const inf = (1 - (dist / dThresh)) * n * vis * (0.15 + sharp * 0.25);
                    v *= (1 - inf);
                }
                const idx = i * 4;
                d[idx] = d[idx + 1] = d[idx + 2] = v;
                d[idx + 3] = 255;
                if (i + 1 < RW * RH) {
                    const idx2 = (i + 1) * 4;
                    d[idx2] = d[idx2 + 1] = d[idx2 + 2] = v;
                    d[idx2 + 3] = 255;
                }
            }
            
            ctx.putImageData(img, 0, 0);
            ctx.imageSmoothingEnabled = false;
            
            const g = ctx.createLinearGradient(0, rollPos - 80, 0, rollPos + 80);
            g.addColorStop(0, 'rgba(0,0,0,0)');
            g.addColorStop(0.5, 'rgba(0,0,0,0.15)');
            g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, rollPos - 80, DW, 160);
            
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            for (let x = 0; x < DW; x += 8) ctx.fillRect(x, 0, 2, DH);
            
            const pix = imgData.data;
            const src = ctx.getImageData(0, 0, DW, DH).data;
            pix.set(src);
            
            for (let i = 0; i < DW * DH * 4; i += 4) {
                const off = ((i / 4) % DW) % 3;
                if (off === 0) {
                    pix[i] = Math.min(255, pix[i] * 1.1);
                    pix[i+1] *= 0.9;
                    pix[i+2] *= 0.9;
                } else if (off === 1) {
                    pix[i] *= 0.9;
                    pix[i+1] = Math.min(255, pix[i+1] * 1.1);
                    pix[i+2] *= 0.9;
                } else {
                    pix[i] *= 0.9;
                    pix[i+1] *= 0.9;
                    pix[i+2] = Math.min(255, pix[i+2] * 1.1);
                }
            }
            ctx.putImageData(imgData, 0, 0);
            requestAnimationFrame(draw);
        }
        requestAnimationFrame(draw);
    </script>
