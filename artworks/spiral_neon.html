<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Spiral</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #333;
            box-shadow: 0 0 50px rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <canvas id="static"></canvas>
    <script>
        const canvas = document.getElementById('static');
        const ctx = canvas.getContext('2d');
        
        canvas.width = 640;
        canvas.height = 480;
        
        let time = 0;
        const sinTable = new Float32Array(1000);
        for (let i = 0; i < 1000; i++) {
            sinTable[i] = Math.sin(i * Math.PI * 2 / 1000);
        }
        
        function drawStatic() {
            const imageData = ctx.createImageData(canvas.width, canvas.height);
            const data = imageData.data;
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const spiralSpacing = 15 + Math.sin(time * 0.13) * 4 + Math.sin(time * 0.29) * 2;
            const spiralTightness = 0.25 + Math.sin(time * 0.17) * 0.08 + Math.cos(time * 0.23) * 0.04;
            
            const t1 = time % (Math.PI * 2);
            const t2 = (time * 1.5) % (Math.PI * 2);
            const t3 = (time * 0.8) % (Math.PI * 2);
            const cs1 = Math.sin(time * 0.8) * 0.5 + 0.5;
            const cs2 = Math.sin(time * 1.2 + 2.1) * 0.5 + 0.5;
            const cs3 = Math.sin(time * 0.6 + 4.2) * 0.5 + 0.5;
            
            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    const i = (y * canvas.width + x) * 4;
                    
                    const dx = x - centerX;
                    const dy = y - centerY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const pixelAngle = Math.atan2(dy, dx);
                    
                    const spiralAngle = pixelAngle - time + dist * spiralTightness;
                    const spiralDist = (spiralAngle / (Math.PI * 2)) * spiralSpacing;
                    const distFromSpiral = Math.abs((dist - spiralDist) % spiralSpacing);
                    
                    const value = Math.random() * 255;
                    
                    const p1 = Math.sin(dist * 0.05 + t1) * 127 + 128;
                    const p2 = Math.sin(pixelAngle * 3 + t2) * 127 + 128;
                    const p3 = Math.sin(dist * 0.03 + pixelAngle * 2 + t3) * 127 + 128;
                    
                    const hue = (time + dist * 0.01 + pixelAngle) % (Math.PI * 2);
                    const satBoost = Math.sin(dist * 0.02 + time * 2) * 0.3 + 0.7;
                    const radialBands = Math.sin(dist * 0.2 + time * 0.5) * 0.4 + 0.6;
                    
                    const r = (value * cs1 * 0.3 + p1 * 0.7 + Math.sin(hue) * 50) * satBoost;
                    const g = (value * cs2 * 0.3 + p2 * 0.7 + Math.sin(hue + 2.1) * 50) * satBoost;
                    const b = (value * cs3 * 0.3 + p3 * 0.7 + Math.sin(hue + 4.2) * 50) * satBoost;
                    
                    if (distFromSpiral < 5) {
                        const influence = 1 - distFromSpiral * 0.2;
                        const factor = 1 - influence * 0.6;
                        data[i] = r * factor;
                        data[i + 1] = g * factor;
                        data[i + 2] = b * factor;
                    } else {
                        data[i] = r;
                        data[i + 1] = g;
                        data[i + 2] = b;
                    }
                    
                    if (y % 4 < 2) {
                        data[i] *= 0.7;
                        data[i + 1] *= 0.7;
                        data[i + 2] *= 0.7;
                    }
                    
                    if (x % 4 < 2) {
                        data[i] *= 0.7;
                        data[i + 1] *= 0.7;
                        data[i + 2] *= 0.7;
                    }
                    
                    data[i + 3] = 255;
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
            time += 0.25;
            requestAnimationFrame(drawStatic);
        }
        
        drawStatic();
    </script>
</body>
</html>
