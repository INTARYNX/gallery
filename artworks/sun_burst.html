<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sun burst</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: monospace;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  canvas {
    background: #000;
    border-radius: 4px;
    touch-action: none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, CENTER = { x: 0, y: 0 };

function resize() {
  const s = Math.min(window.innerWidth, window.innerHeight) * 0.92;
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = s + 'px';
  cv.style.height = s + 'px';
  cv.width = s * dpr;
  cv.height = s * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  W = s; H = s;
  CENTER = { x: W / 2, y: H / 2 };
}
window.addEventListener('resize', resize);
resize();

const ALIEN_ALPHABET = {
  A: [['arc',2],['radial',1],['arc',-2],['radial',-1]],
  B: [['radial',1],['arc',3],['radial',-1],['arc',-3]],
  C: [['arc',3]],
  D: [['radial',1],['arc',2],['radial',-1]],
  E: [['arc',2],['radial',1],['arc',-1],['radial',-1]],
  F: [['radial',1],['arc',1],['radial',-1],['arc',1]],
  G: [['arc',3],['radial',1],['arc',-1]],
  H: [['radial',1],['arc',2],['radial',-1],['radial',1],['arc',-2]],
  I: [['radial',1],['radial',-1]],
  J: [['radial',1],['arc',2]],
  K: [['radial',1],['arc',2],['arc',-2],['radial',-1]],
  L: [['radial',-1],['arc',2]],
  M: [['radial',1],['arc',1],['radial',-1],['radial',1],['arc',1],['radial',-1]],
  N: [['radial',1],['arc',2],['radial',-1]],
  O: [['arc',8]],
  P: [['radial',1],['arc',2],['radial',-1],['arc',-2]],
  Q: [['arc',8],['radial',1]],
  R: [['radial',1],['arc',2],['radial',-1],['arc',1]],
  S: [['arc',2],['arc',-2],['arc',2]],
  T: [['arc',2],['radial',1]],
  U: [['radial',1],['arc',2],['radial',-1]],
  V: [['radial',1],['arc',1],['radial',-1]],
  W: [['radial',1],['arc',1],['radial',-1],['arc',1],['radial',1],['arc',1],['radial',-1]],
  X: [['arc',2],['arc',-4],['arc',2]],
  Y: [['radial',1],['arc',1],['radial',1]],
  Z: [['arc',2],['radial',-1],['arc',2]]
};

const ALIEN_WORDS = [
  "XAR","VOTH","QIRA","NEX","KHOR","ZYTH","ARQEN","VEL",
  "IXOR","THAQ","ZORAN","VEXIL","KYR","ORTH","QEX"
];

function hsl(h, s, l, a) { return `hsla(${((h%360)+360)%360},${s}%,${l}%,${a})`; }

// surfer warm palette + white
const SURF = ['#ffffff', '#ffe34d', '#ffc20a', '#ff7a1a', '#ff3d2e'];
function surfColor(i, a) {
  const c = SURF[((i % SURF.length) + SURF.length) % SURF.length];
  if (a === undefined) return c;
  const n = parseInt(c.slice(1), 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

function wordToGlyph(word) {
  const seq = [];
  for (const ch of word) {
    const letter = ALIEN_ALPHABET[ch];
    if (!letter) continue;
    seq.push(...letter);
    seq.push(null);
  }
  return seq;
}

const STEP_ANGLE = Math.PI / 12;
const MAX_LEN = 12;

function newWord() {
  return ALIEN_WORDS[Math.floor(Math.random() * ALIEN_WORDS.length)];
}

function makeSnake(ring) {
  const radius = 38 + ring * 30;
  return {
    angle: Math.random() * Math.PI * 2,
    radius,
    baseRadius: radius,
    stepRadius: Math.max(6, radius * 0.10),
    glyph: wordToGlyph(newWord()),
    gi: 0,
    arcLeft: undefined,
    body: [],
    hue: ring * 47,
    speed: 0.5 + Math.random() * 0.7,
    spin: (Math.random() < 0.5 ? 1 : -1) * (0.0006 + Math.random() * 0.0014)
  };
}

function ringCount() {
  return Math.min(9, Math.floor((Math.min(W, H) / 2 - 40) / 30));
}
let snakes = [];
function build() {
  snakes = [];
  for (let r = 1; r <= ringCount(); r++) snakes.push(makeSnake(r));
}
build();

function step(sn) {
  if (sn.gi >= sn.glyph.length) {
    sn.glyph = wordToGlyph(newWord());
    sn.gi = 0;
    sn.body.unshift(null);
  }
  const stroke = sn.glyph[sn.gi];
  if (stroke === null) {
    sn.body.unshift(null);
    sn.gi++;
    return;
  }
  const [type, val] = stroke;
  if (type === 'arc') {
    sn.angle += STEP_ANGLE * Math.sign(val);
    sn.arcLeft = (sn.arcLeft ?? Math.abs(val)) - 1;
    if (sn.arcLeft <= 0) { sn.gi++; sn.arcLeft = undefined; }
  } else {
    sn.radius += sn.stepRadius * val;
    sn.radius = Math.max(20, Math.min(sn.baseRadius + sn.stepRadius, sn.radius));
    sn.gi++;
  }
  const px = CENTER.x + Math.cos(sn.angle) * sn.radius;
  const py = CENTER.y + Math.sin(sn.angle) * sn.radius;
  sn.body.unshift({ x: px, y: py });
  if (sn.body.length > MAX_LEN) sn.body.pop();
}

let tick = 0;
let globalSpin = 0;
let warp = 0;
let radPhase = 0;
let stepAccum = 0;

function drawSnake(sn) {
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  let prev = null;
  for (let i = 0; i < sn.body.length; i++) {
    let raw = sn.body[i];
    if (!raw) { prev = null; continue; }
    // spatial breathing: radial wobble driven by warp
    const dx = raw.x - CENTER.x, dy = raw.y - CENTER.y;
    const d = Math.hypot(dx, dy) || 1;
    const wobble = (Math.sin(d * 0.03 - warp) + 0.5 * Math.sin(d * 0.08 + warp * 1.7)) * 8;
    const p = { x: raw.x + dx / d * wobble, y: raw.y + dy / d * wobble };
    if (prev) {
      const fade = 1 - i / sn.body.length;
      const ci = Math.floor((sn.hue / 47) + i * 0.5);
      ctx.strokeStyle = surfColor(ci, fade * 0.95);
      ctx.globalAlpha = fade * 0.95;
      ctx.lineWidth = 1 + fade * 3;
      ctx.beginPath();
      ctx.moveTo(prev.x, prev.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
    prev = p;
  }
  const headRaw = sn.body.find(b => b);
  if (headRaw) {
    const dx = headRaw.x - CENTER.x, dy = headRaw.y - CENTER.y;
    const d = Math.hypot(dx, dy) || 1;
    const wobble = (Math.sin(d * 0.03 - warp) + 0.5 * Math.sin(d * 0.08 + warp * 1.7)) * 8;
    const hx = headRaw.x + dx / d * wobble;
    const hy = headRaw.y + dy / d * wobble;
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(hx, hy, 3.2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawCore() {
  const breath = Math.sin(tick * 0.025) * Math.sin(tick * 0.011 + 1.3);
  const pulse = 0.5 + 0.5 * breath;
  const maxR = Math.min(W, H) * 0.32;

  let core = ctx.createRadialGradient(CENTER.x, CENTER.y, 0, CENTER.x, CENTER.y, maxR);
  core.addColorStop(0, 'rgba(255,240,200,0.9)');
  core.addColorStop(0.15, 'rgba(255,190,60,0.7)');
  core.addColorStop(0.45, `rgba(255,110,30,${0.35 + pulse * 0.2})`);
  core.addColorStop(1, 'rgba(255,40,20,0)');
  ctx.fillStyle = core;
  ctx.beginPath();
  ctx.arc(CENTER.x, CENTER.y, maxR, 0, Math.PI * 2);
  ctx.fill();

  for (let k = 0; k < 3; k++) {
    const phase = (radPhase + k / 3) % 1;
    const rr = phase * maxR;
    ctx.strokeStyle = `rgba(255,210,120,${(1 - phase) * 0.5})`;
    ctx.lineWidth = 2 + (1 - phase) * 4;
    ctx.beginPath();
    ctx.arc(CENTER.x, CENTER.y, rr, 0, Math.PI * 2);
    ctx.stroke();
  }
}

const SLICES = 6;

function loop() {
  globalSpin += 0.03;
  warp += 0.08;

  // full clear each frame — no trails, old strokes removed
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  // shifting warm wash
  ctx.globalCompositeOperation = 'lighter';
  let g = ctx.createRadialGradient(CENTER.x, CENTER.y, 0, CENTER.x, CENTER.y, W * 0.6);
  g.addColorStop(0, 'rgba(255,180,60,0.18)');
  g.addColorStop(0.5, 'rgba(255,80,40,0.10)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';

  // organic timing
  tick += 3;
  radPhase += 0.004 + 0.004 * (0.5 + 0.5 * Math.sin(tick * 0.017));
  stepAccum += 0.7 + 0.6 * (0.5 + 0.5 * Math.sin(tick * 0.009));
  const steps = Math.floor(stepAccum);
  stepAccum -= steps;
  for (const sn of snakes) {
    for (let s = 0; s < steps; s++) step(sn);
    while (sn.body.length > MAX_LEN) sn.body.pop();
  }

  // kaleidoscope slices (snakes + radiating core, all mirrored)
  const slices = 5 + Math.floor((Math.sin(tick * 0.003) + 1) * 2);
  ctx.globalCompositeOperation = 'lighter';
  for (let s = 0; s < slices; s++) {
    ctx.save();
    ctx.translate(CENTER.x, CENTER.y);
    ctx.rotate((Math.PI * 2 / slices) * s + Math.sin(tick * 0.01 + s) * 0.2);
    if (s % 2 === 0) ctx.scale(1, -1);
    ctx.translate(-CENTER.x, -CENTER.y);
    for (const sn of snakes) drawSnake(sn);
    drawCore();
    drawFlares();
    ctx.restore();
  }
  ctx.globalCompositeOperation = 'source-over';

  requestAnimationFrame(loop);
}

function drawFlares() {
  // glitchy sun flares — random bright streaks bursting from center
  const n = 5;
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    // pseudo-random but time-quantized for a flickering glitch feel
    const seed = Math.floor(tick / 18) * 7.1 + i * 131.7;
    const ang = (Math.sin(seed) * 0.5 + 0.5) * Math.PI * 2;
    const flick = Math.sin(seed * 3.3) * 0.5 + 0.5;
    if (flick < 0.7) continue;
    const len = Math.min(W, H) * (0.2 + flick * 0.45);
    const jitter = (Math.sin(seed * 9.7) ) * 6;
    const ci = Math.floor(flick * SURF.length);
    ctx.strokeStyle = surfColor(ci, 0.12 + flick * 0.2);
    ctx.lineWidth = 1 + flick * 2;
    ctx.beginPath();
    ctx.moveTo(CENTER.x, CENTER.y);
    ctx.lineTo(
      CENTER.x + Math.cos(ang) * len + jitter,
      CENTER.y + Math.sin(ang) * len - jitter
    );
    ctx.stroke();
    // chromatic glitch offset slivers
    ctx.strokeStyle = `rgba(255,255,255,${flick * 0.15})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(CENTER.x, CENTER.y);
    ctx.lineTo(
      CENTER.x + Math.cos(ang + 0.02) * len * 0.85,
      CENTER.y + Math.sin(ang + 0.02) * len * 0.85
    );
    ctx.stroke();
  }
  // occasional full-burst bloom
  const burst = Math.sin(tick * 0.013) * Math.sin(tick * 0.041);
  if (burst > 0.93) {
    const t = (burst - 0.93) / 0.07;
    ctx.globalAlpha = t * 0.22;
    let bg = ctx.createRadialGradient(CENTER.x, CENTER.y, 0, CENTER.x, CENTER.y, Math.min(W,H)*0.5);
    bg.addColorStop(0, 'rgba(255,255,255,0.9)');
    bg.addColorStop(0.3, 'rgba(255,200,90,0.4)');
    bg.addColorStop(1, 'rgba(255,60,30,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    // cold chromatic flash slivers — electric violet / cyan / magenta
    const cold = ['rgba(150,80,255,', 'rgba(40,230,255,', 'rgba(255,60,220,'];
    for (let i = 0; i < 3; i++) {
      const ang = Math.sin(tick * 0.07 + i * 2.1) * Math.PI * 2;
      const len = Math.min(W, H) * 0.45;
      ctx.strokeStyle = cold[i] + (t * 0.6) + ')';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(CENTER.x, CENTER.y);
      ctx.lineTo(CENTER.x + Math.cos(ang) * len, CENTER.y + Math.sin(ang) * len);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  ctx.globalCompositeOperation = 'source-over';
}
loop();

window.addEventListener('resize', () => { resize(); build(); });
</script>
</body>
</html>
