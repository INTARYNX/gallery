<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genuary 2026 #17</title>
    <style>
        body {
            margin: 0;
            background: #0a0a1a;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        canvas {
            display: block;
            max-width: 100vmin;
            max-height: 100vmin;
            width: 100vmin;
            height: 100vmin;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const c = document.getElementById('canvas');
        const ctx = c.getContext('2d', { alpha: false });
        
        function resize() {
            const size = Math.min(innerWidth, innerHeight);
            c.width = size;
            c.height = size;
        }
        
        resize();

        let W = c.width, H = c.height, z = 0;
        const PI = Math.PI, cos = Math.cos, sin = Math.sin, abs = Math.abs, max = Math.max;
        
        const proj = (p) => {
            const d = p[2] + 100;
            if (d <= 0) return null;
            const s = H * 0.5 / d;
            return [p[0] * s + W / 2, p[1] * s + H / 2, d];
        };

        const colors = [];
        for (let i = 0; i < 48; i++) {
            const h = 200 + (i % 6) * 10;
            const l = 45 + (i % 8) * 4;
            colors[i] = `hsl(${h},80%,${l}%)`;
        }

        function render() {
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, W, H);
            
            // Plasma au centre
            const t = z * 0.01;
            const gradient = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, 200);
            const plasmaHue = 200 + sin(t) * 50;
            gradient.addColorStop(0, `hsla(${plasmaHue}, 80%, 50%, 0.3)`);
            gradient.addColorStop(0.5, `hsla(${220 + cos(t * 1.3) * 30}, 70%, 40%, 0.2)`);
            gradient.addColorStop(1, 'transparent');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, W, H);
            
            z += 2;
            const ang = (z / 900) * PI * 2 + sin(z * 0.02) * 0.3;
            const ca = cos(ang), sa = sin(ang);
            const mod = z % 30;
            const radiusOsc = 250 + sin(z * 0.03) * 15;
            
            const faces = [];
            
            for (let r = -10; r < 50; r++) {
                const z1 = r * 30 - mod, z2 = z1 + 30;
                if (z2 < -50) continue;
                
                const h1 = [], h2 = [];
                
                for (let i = 0; i < 6; i++) {
                    const a = PI / 3 * i;
                    const x = radiusOsc * cos(a), y = radiusOsc * sin(a);
                    h1[i] = [x * ca - y * sa, x * sa + y * ca, z1];
                    h2[i] = [x * ca - y * sa, x * sa + y * ca, z2];
                }
                
                for (let w = 0; w < 6; w++) {
                    const n = (w + 1) % 6;
                    const dx1 = (h1[n][0] - h1[w][0]) / 8;
                    const dy1 = (h1[n][1] - h1[w][1]) / 8;
                    const dx2 = (h2[n][0] - h2[w][0]) / 8;
                    const dy2 = (h2[n][1] - h2[w][1]) / 8;
                    
                    for (let t = 0; t < 8; t++) {
                        const x1 = h1[w][0] + dx1 * t, y1 = h1[w][1] + dy1 * t;
                        const x2 = h1[w][0] + dx1 * (t + 1), y2 = h1[w][1] + dy1 * (t + 1);
                        const x3 = h2[w][0] + dx2 * (t + 1), y3 = h2[w][1] + dy2 * (t + 1);
                        const x4 = h2[w][0] + dx2 * t, y4 = h2[w][1] + dy2 * t;
                        
                        const az = (z1 + z2) * 0.5;
                        
                        // Éclairage directionnel
                        const nx = (x1 + x2 + x3 + x4) * 0.25;
                        const ny = (y1 + y2 + y3 + y4) * 0.25;
                        const lightDir = [0.3, -0.5, 1];
                        const normalDot = (nx * lightDir[0] + ny * lightDir[1]) / 300;
                        const lighting = max(0.3, 0.5 + normalDot * 0.5);
                        
                        const br = max(0.2, (1 - abs(az) / 1500) * lighting);
                        const fa = az < 100 ? max(0, az / 100) : 1;
                        
                        faces.push({
                            p: [[x1, y1, z1], [x2, y2, z1], [x3, y3, z2], [x4, y4, z2]],
                            c: colors[w * 8 + t],
                            d: az,
                            a: fa,
                            b: br,
                            w: w,
                            t: t
                        });
                    }
                }
            }
            
            faces.sort((a, b) => b.d - a.d);
            
            for (let i = 0; i < faces.length; i++) {
                const f = faces[i];
                const pr = f.p.map(proj).filter(p => p);
                if (pr.length < 3) continue;
                
                ctx.globalAlpha = f.a;
                ctx.fillStyle = f.c;
                ctx.beginPath();
                ctx.moveTo(pr[0][0], pr[0][1]);
                for (let j = 1; j < pr.length; j++) ctx.lineTo(pr[j][0], pr[j][1]);
                ctx.closePath();
                ctx.fill();
                
                // Couleur de fond de l'hexagone qui matche
                const hexBgHue = 200 + f.w * 10;
                ctx.fillStyle = `hsl(${hexBgHue}, 70%, 40%)`;
                ctx.fill();
                
                const cx = (f.p[0][0] + f.p[1][0] + f.p[2][0] + f.p[3][0]) * 0.25;
                const cy = (f.p[0][1] + f.p[1][1] + f.p[2][1] + f.p[3][1]) * 0.25;
                const cz = (f.p[0][2] + f.p[1][2] + f.p[2][2] + f.p[3][2]) * 0.25;
                
                const vx0 = (f.p[1][0] - f.p[0][0]) * 0.5, vx1 = (f.p[1][1] - f.p[0][1]) * 0.5, vx2 = (f.p[1][2] - f.p[0][2]) * 0.5;
                const vy0 = (f.p[3][0] - f.p[0][0]) * 0.58, vy1 = (f.p[3][1] - f.p[0][1]) * 0.58, vy2 = (f.p[3][2] - f.p[0][2]) * 0.58;
                
                const hp = [];
                for (let j = 0; j < 6; j++) {
                    const a = PI / 3 * j;
                    const cs = cos(a), sn = sin(a);
                    hp[j] = proj([cx + vx0 * cs + vy0 * sn, cy + vx1 * cs + vy1 * sn, cz + vx2 * cs + vy2 * sn]);
                }
                
                if (hp.every(p => p)) {
                    const outlineHue = 200 + f.w * 10;
                    ctx.strokeStyle = `hsl(${outlineHue}, 80%, 20%)`;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(hp[0][0], hp[0][1]);
                    for (let j = 1; j < 6; j++) ctx.lineTo(hp[j][0], hp[j][1]);
                    ctx.closePath();
                    ctx.stroke();
                    
                    const mx = (hp[0][0] + hp[3][0]) * 0.5, my = (hp[0][1] + hp[3][1]) * 0.5;
                    for (let j = 0; j < 6; j++) {
                        ctx.beginPath();
                        ctx.moveTo(mx, my);
                        ctx.lineTo(hp[j][0], hp[j][1]);
                        ctx.stroke();
                    }
                    
                    ctx.beginPath();
                    for (let j = 0; j < 6; j++) {
                        const x = mx + (hp[j][0] - mx) * 0.5, y = my + (hp[j][1] - my) * 0.5;
                        if (j === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    ctx.stroke();
                }
            }
            
            // Scanlines
            ctx.globalAlpha = 0.25;
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            for (let i = 0; i < H; i += 3) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(W, i);
                ctx.stroke();
            }
            for (let i = 0; i < W; i += 3) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, H);
                ctx.stroke();
            }
            
            ctx.globalAlpha = 1;
            requestAnimationFrame(render);
        }

        addEventListener('resize', () => {
            resize();
            W = c.width;
            H = c.height;
        });

        render();
    </script>
</body>
</html>
