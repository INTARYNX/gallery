<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #2a1d10; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
  canvas { display: block; width: 100vmin; height: 100vmin; background: #c9b487; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const size = Math.min(window.innerWidth, window.innerHeight);
c.width = size; c.height = size;
// offscreen buffer for the leaves (so vignette doesn't accumulate)
const buf = document.createElement('canvas');
buf.width = c.width; buf.height = c.height;
const bctx = buf.getContext('2d');
bctx.fillStyle = '#c9b487';
bctx.fillRect(0, 0, buf.width, buf.height);

// pre-render a vignette overlay
const vignette = document.createElement('canvas');
vignette.width = c.width;
vignette.height = c.height;
{
  const vctx = vignette.getContext('2d');
  const g = vctx.createRadialGradient(
    c.width / 2, c.height / 2, c.width * 0.25,
    c.width / 2, c.height / 2, c.width * 0.72
  );
  g.addColorStop(0,   'rgba(60, 40, 20, 0)');
  g.addColorStop(0.6, 'rgba(50, 30, 15, 0.25)');
  g.addColorStop(1,   'rgba(30, 18, 8, 0.7)');
  vctx.fillStyle = g;
  vctx.fillRect(0, 0, c.width, c.height);
}

const leaves = [];
function rand(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(rand(a, b)); }

function envelope(t, p) {
  const base = Math.sin(Math.PI * Math.pow(t, p.peak));
  const taper = Math.pow(1 - t, p.sharp * 0.4);
  return Math.max(0, base * (0.6 + 0.4 * taper));
}

function buildLeaf(len, widthScale, lines, shape) {
  const N = 80;
  const top = [], bot = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const x = (t - 0.5) * len;
    const w = envelope(t, shape) * len * widthScale;
    const serr = Math.sin(t * shape.serrFreq * Math.PI * 2) * shape.serrAmp * w;
    const jitter = (Math.sin(t * 37.1) * 0.5 + Math.sin(t * 13.7) * 0.5) * 0.01 * len;
    const wt = w + serr + jitter;
    const wb = w * shape.asymm + serr * 0.7 + jitter;
    top.push({ x, y: -wt, t });
    bot.push({ x, y:  wb, t });
  }

  const veins = [];
  for (let i = 1; i < lines; i++) {
    const t = i / lines + rand(-0.01, 0.01);
    if (t <= 0.05 || t >= 0.95) continue;
    const x0 = (t - 0.5) * len;
    const side = i % 2 === 0 ? 1 : -1;
    const tipT = Math.min(0.98, t + 0.08);
    const edgeW = envelope(tipT, shape) * len * widthScale * (side === 1 ? shape.asymm : 1);
    const endX = (tipT - 0.5) * len;
    const endY = side * edgeW * 0.95;
    const bx = (x0 + endX) * 0.5;
    const by = side * edgeW * 0.45;
    veins.push({ x0, y0: 0, bx, by, ex: endX, ey: endY, side, t, w: edgeW });
  }

  const veinlets = [];
  for (const v of veins) {
    const n = randInt(5, 9);
    for (let k = 1; k <= n; k++) {
      const f = k / (n + 1);
      const sx = (1 - f) * (1 - f) * v.x0 + 2 * (1 - f) * f * v.bx + f * f * v.ex;
      const sy = (1 - f) * (1 - f) * v.y0 + 2 * (1 - f) * f * v.by + f * f * v.ey;
      const tanX = 2 * (1 - f) * (v.bx - v.x0) + 2 * f * (v.ex - v.bx);
      const tanY = 2 * (1 - f) * (v.by - v.y0) + 2 * f * (v.ey - v.by);
      const tanLen = Math.hypot(tanX, tanY) || 1;
      const nx = -tanY / tanLen, ny = tanX / tanLen;
      for (const dir of [1, -1]) {
        const len2 = Math.hypot(v.ex - v.x0, v.ey - v.y0) * rand(0.15, 0.32);
        const ang = rand(-0.35, 0.35);
        const cosA2 = Math.cos(ang), sinA2 = Math.sin(ang);
        const dx = (nx * cosA2 - ny * sinA2) * dir + (tanX / tanLen) * 0.3;
        const dy = (nx * sinA2 + ny * cosA2) * dir + (tanY / tanLen) * 0.3;
        const dLen = Math.hypot(dx, dy) || 1;
        const ex2 = sx + (dx / dLen) * len2;
        const ey2 = sy + (dy / dLen) * len2;
        const bx2 = sx + (ex2 - sx) * 0.5 + (nx * dir) * len2 * 0.08;
        const by2 = sy + (ey2 - sy) * 0.5 + (ny * dir) * len2 * 0.08;
        veinlets.push({ sx, sy, bx: bx2, by: by2, ex: ex2, ey: ey2, gen: 1 });

        if (Math.random() < 0.6) {
          const f2 = rand(0.4, 0.8);
          const ssx = (1 - f2) * sx + f2 * ex2;
          const ssy = (1 - f2) * sy + f2 * ey2;
          const sublen = len2 * rand(0.3, 0.6);
          const subAng = rand(-1, 1) * 0.7;
          const subDx = Math.cos(subAng) * (ex2 - sx) - Math.sin(subAng) * (ey2 - sy);
          const subDy = Math.sin(subAng) * (ex2 - sx) + Math.cos(subAng) * (ey2 - sy);
          const subDLen = Math.hypot(subDx, subDy) || 1;
          veinlets.push({
            sx: ssx, sy: ssy,
            bx: ssx + (subDx / subDLen) * sublen * 0.5,
            by: ssy + (subDy / subDLen) * sublen * 0.5,
            ex: ssx + (subDx / subDLen) * sublen,
            ey: ssy + (subDy / subDLen) * sublen,
            gen: 2,
          });
        }
      }
    }
  }

  for (let i = 0; i < veins.length - 2; i++) {
    const a = veins[i], b = veins[i + 2];
    if (a.side !== b.side) continue;
    const steps = 3;
    for (let k = 1; k <= steps; k++) {
      const f = k / (steps + 1);
      const ax = (1 - f) * a.x0 + f * a.ex;
      const ay = (1 - f) * a.y0 + f * a.ey;
      const bxp = (1 - f) * b.x0 + f * b.ex;
      const byp = (1 - f) * b.y0 + f * b.ey;
      const mx = (ax + bxp) / 2 + rand(-3, 3);
      const my = (ay + byp) / 2 + rand(-3, 3);
      veinlets.push({ sx: ax, sy: ay, bx: mx, by: my, ex: bxp, ey: byp, gen: 3 });
    }
  }

  const blemishes = [];
  if (Math.random() < 0.55) {
    const nb = randInt(2, 6);
    for (let i = 0; i < nb; i++) {
      const t = rand(0.1, 0.9);
      const halfW = envelope(t, shape) * len * widthScale;
      const side = Math.random() < 0.5 ? -1 : 1;
      const r = rand(0, 0.85);
      blemishes.push({
        x: (t - 0.5) * len + rand(-3, 3),
        y: side * halfW * r,
        r: rand(2, 6),
        kind: Math.random() < 0.55 ? 'spot' : (Math.random() < 0.5 ? 'hole' : 'necrosis'),
        seed: Math.random() * 1000,
      });
    }
  }

  return { len, top, bot, veins, veinlets, blemishes, shape };
}

function renderLeafToCanvas(leaf) {
  const { geo, baseHue, edgeHue, sat, light } = leaf;
  const pad = 12;
  const w = geo.len + pad * 2 + geo.len * 0.25;
  const h = geo.len * 0.9 + pad * 2;
  const off = document.createElement('canvas');
  off.width = Math.ceil(w);
  off.height = Math.ceil(h);
  const o = off.getContext('2d');
  const cx = pad + geo.len / 2 + geo.len * 0.18;
  const cy = h / 2;
  o.translate(cx, cy);

  const baseL = light;
  const edgeL = Math.max(5, light - 8);

  function tracePath() {
    o.beginPath();
    o.moveTo(geo.top[0].x, geo.top[0].y);
    for (let i = 1; i < geo.top.length; i++) o.lineTo(geo.top[i].x, geo.top[i].y);
    for (let i = geo.bot.length - 1; i >= 0; i--) o.lineTo(geo.bot[i].x, geo.bot[i].y);
    o.closePath();
  }

  // === everything inside the leaf shape: clip once ===
  o.save();
  tracePath();
  o.clip();

  // base fill
  const grad = o.createLinearGradient(-geo.len / 2, 0, geo.len / 2, 0);
  grad.addColorStop(0,    `hsl(${edgeHue}, ${sat}%, ${edgeL - 2}%)`);
  grad.addColorStop(0.35, `hsl(${baseHue}, ${sat + 5}%, ${baseL + 4}%)`);
  grad.addColorStop(0.7,  `hsl(${baseHue - 5}, ${sat}%, ${baseL}%)`);
  grad.addColorStop(1,    `hsl(${edgeHue + 5}, ${sat - 5}%, ${edgeL + 6}%)`);
  o.fillStyle = grad;
  o.fillRect(-geo.len, -geo.len, geo.len * 2, geo.len * 2);

  // sheen
  const sheen = o.createLinearGradient(0, -geo.len * 0.4, 0, geo.len * 0.4);
  sheen.addColorStop(0,   `hsla(${baseHue + 10}, ${sat}%, ${Math.min(80, baseL + 25)}%, 0.18)`);
  sheen.addColorStop(0.5, `hsla(${baseHue}, ${sat}%, ${baseL + 8}%, 0)`);
  sheen.addColorStop(1,   `hsla(${edgeHue - 10}, ${sat}%, ${Math.max(4, baseL - 18)}%, 0.3)`);
  o.fillStyle = sheen;
  o.fillRect(-geo.len, -geo.len, geo.len * 2, geo.len * 2);

  // mottling
  for (let i = 0; i < 14; i++) {
    const t = (i + 0.5) / 14;
    const px = (t - 0.5) * geo.len * rand(0.85, 1.0);
    const py = rand(-1, 1) * geo.len * 0.18 * geo.shape.asymm;
    const r = rand(6, 18);
    const g = o.createRadialGradient(px, py, 0, px, py, r);
    const tone = rand(-12, 12);
    g.addColorStop(0, `hsla(${baseHue + tone}, ${sat}%, ${baseL + tone * 0.6}%, 0.25)`);
    g.addColorStop(1, `hsla(${baseHue}, ${sat}%, ${baseL}%, 0)`);
    o.fillStyle = g;
    o.fillRect(px - r, py - r, r * 2, r * 2);
  }

  // blemishes (organic)
  for (const b of geo.blemishes) {
    const nPts = 14;
    const blobPts = [];
    for (let k = 0; k < nPts; k++) {
      const a = (k / nPts) * Math.PI * 2;
      const n = Math.sin(b.seed + a * 3) * 0.25 + Math.sin(b.seed * 1.7 + a * 5) * 0.15 + Math.sin(b.seed * 0.3 + a * 1.3) * 0.3;
      const rr = b.r * (1 + n);
      blobPts.push({ x: b.x + Math.cos(a) * rr, y: b.y + Math.sin(a) * rr * 0.85 });
    }
    function blobPath(scale = 1) {
      o.beginPath();
      for (let k = 0; k < blobPts.length; k++) {
        const p = blobPts[k];
        const px = b.x + (p.x - b.x) * scale;
        const py = b.y + (p.y - b.y) * scale;
        const pNext = blobPts[(k + 1) % blobPts.length];
        const pxN = b.x + (pNext.x - b.x) * scale;
        const pyN = b.y + (pNext.y - b.y) * scale;
        const mx = (px + pxN) / 2, my = (py + pyN) / 2;
        if (k === 0) o.moveTo(mx, my);
        else o.quadraticCurveTo(px, py, mx, my);
      }
      o.closePath();
    }

    if (b.kind === 'spot') {
      blobPath(1.6);
      const g = o.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 1.8);
      g.addColorStop(0,    `hsla(${(baseHue + 20) % 60}, 35%, 12%, 0.7)`);
      g.addColorStop(0.5,  `hsla(${(baseHue + 30) % 60}, 30%, 22%, 0.4)`);
      g.addColorStop(1,    `hsla(${(baseHue + 30) % 60}, 25%, 30%, 0)`);
      o.fillStyle = g;
      o.fill();
      blobPath(0.6);
      o.fillStyle = `hsla(${(baseHue + 15) % 50}, 40%, 10%, 0.55)`;
      o.fill();
    } else if (b.kind === 'necrosis') {
      blobPath(1.3);
      const g = o.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 1.5);
      g.addColorStop(0,   `hsla(28, 45%, 18%, 0.75)`);
      g.addColorStop(0.6, `hsla(40, 50%, 32%, 0.5)`);
      g.addColorStop(1,   `hsla(50, 40%, 45%, 0)`);
      o.fillStyle = g;
      o.fill();
      blobPath(0.85);
      o.fillStyle = `hsla(25, 40%, 16%, 0.5)`;
      o.fill();
    } else {
      blobPath(1.7);
      const halo = o.createRadialGradient(b.x, b.y, b.r * 0.8, b.x, b.y, b.r * 1.7);
      halo.addColorStop(0, `hsla(28, 45%, 20%, 0.6)`);
      halo.addColorStop(0.5, `hsla(38, 45%, 32%, 0.35)`);
      halo.addColorStop(1, `hsla(50, 35%, 45%, 0)`);
      o.fillStyle = halo;
      o.fill();
      o.save();
      o.globalCompositeOperation = 'destination-out';
      blobPath(1);
      o.fill();
      o.restore();
      blobPath(1.05);
      o.strokeStyle = `hsla(25, 50%, 14%, 0.7)`;
      o.lineWidth = 0.7;
      o.stroke();
    }
  }

  // veinlets
  for (const v of geo.veinlets) {
    o.beginPath();
    o.moveTo(v.sx, v.sy);
    o.quadraticCurveTo(v.bx, v.by, v.ex, v.ey);
    const lw = v.gen === 1 ? 0.45 : v.gen === 2 ? 0.3 : 0.35;
    const a = v.gen === 1 ? 0.5 : v.gen === 2 ? 0.35 : 0.4;
    o.strokeStyle = `hsla(${edgeHue}, ${sat}%, ${Math.min(75, baseL + 16)}%, ${a})`;
    o.lineWidth = lw;
    o.stroke();
  }

  // secondary veins
  for (const v of geo.veins) {
    o.beginPath();
    o.moveTo(v.x0, v.y0);
    o.quadraticCurveTo(v.bx, v.by, v.ex, v.ey);
    o.strokeStyle = `hsla(${baseHue}, ${sat}%, ${Math.min(80, baseL + 22)}%, 0.75)`;
    o.lineWidth = 0.7;
    o.stroke();
  }

  // midrib
  o.beginPath();
  o.moveTo(-geo.len / 2, 0);
  o.lineTo(geo.len / 2, 0);
  o.strokeStyle = `hsla(${baseHue}, ${sat}%, ${Math.min(78, baseL + 18)}%, 0.7)`;
  o.lineWidth = 0.9;
  o.stroke();

  o.restore(); // end clip

  // edge stroke (after clip — outline)
  tracePath();
  o.strokeStyle = `hsla(${edgeHue}, ${sat + 5}%, ${Math.max(8, baseL - 8)}%, 0.85)`;
  o.lineWidth = 0.9;
  o.stroke();

  // petiole
  o.beginPath();
  o.moveTo(-geo.len / 2, 0);
  o.lineTo(-geo.len / 2 - geo.len * 0.18, 0);
  o.strokeStyle = `hsla(${edgeHue - 10}, ${sat}%, ${Math.max(10, baseL - 6)}%, 1)`;
  o.lineWidth = 1.4;
  o.lineCap = 'round';
  o.stroke();

  return { canvas: off, ox: cx, oy: cy };
}

function createLeaf() {
  const life = Math.floor(rand(280, 720));
  const len = rand(90, 200);
  const widthScale = rand(0.35, 0.6);
  const lines = randInt(10, 22);

  const archetype = Math.random();
  let shape;
  if (archetype < 0.33) {
    shape = { peak: rand(0.7, 0.95), sharp: rand(0.8, 1.2), baseW: rand(0.05, 0.2),
              asymm: rand(0.92, 1.08), serrFreq: rand(8, 14), serrAmp: rand(0.01, 0.04) };
  } else if (archetype < 0.66) {
    shape = { peak: rand(0.9, 1.2), sharp: rand(1.2, 1.8), baseW: rand(0, 0.1),
              asymm: rand(0.95, 1.05), serrFreq: rand(10, 18), serrAmp: rand(0, 0.025) };
  } else {
    shape = { peak: rand(0.95, 1.1), sharp: rand(0.9, 1.1), baseW: rand(0, 0.15),
              asymm: rand(0.92, 1.08), serrFreq: rand(6, 12), serrAmp: rand(0, 0.03) };
  }

  const palette = Math.random();
  let baseHue, edgeHue, sat, light;
  if (palette < 0.45) {
    baseHue = rand(70, 100); edgeHue = baseHue + rand(-15, -5);
    sat = rand(22, 38); light = rand(20, 30);
  } else if (palette < 0.65) {
    baseHue = rand(55, 80); edgeHue = baseHue - rand(8, 18);
    sat = rand(28, 42); light = rand(28, 38);
  } else if (palette < 0.85) {
    baseHue = rand(25, 45); edgeHue = baseHue - rand(8, 18);
    sat = rand(40, 58); light = rand(28, 40);
  } else {
    baseHue = rand(5, 22); edgeHue = baseHue - rand(2, 8);
    sat = rand(35, 55); light = rand(22, 32);
  }

  const leaf = {
    cx: rand(80, c.width - 80),
    cy: rand(80, c.height - 80),
    spinY: rand(0, Math.PI * 2),
    spinX: rand(-0.5, 0.5),
    speedY: rand(0.006, 0.025) * (Math.random() < 0.5 ? 1 : -1),
    speedX: rand(-0.004, 0.004),
    len, widthScale, lines, baseHue, edgeHue, sat, light,
    alpha: rand(0.85, 1.0),
    geo: buildLeaf(len, widthScale, lines, shape),
    life, maxLife: life, age: 0,
    scale: rand(0.7, 1.15),
    rot: rand(0, Math.PI * 2),
  };
  const pre = renderLeafToCanvas(leaf);
  leaf.sprite = pre.canvas;
  leaf.ox = pre.ox;
  leaf.oy = pre.oy;
  return leaf;
}

function drawLeaf(leaf) {
  const fadeIn = Math.min(leaf.age / 200, 1);
  const fadeOut = Math.min((leaf.maxLife - leaf.age) / 200, 1);
  const fade = fadeIn * fadeOut;
  const alpha = leaf.alpha * fade;
  if (alpha <= 0.01) return;

  const sinA = Math.sin(leaf.spinY), cosA = Math.cos(leaf.spinY);
  const sinB = Math.sin(leaf.spinX), cosB = Math.cos(leaf.spinX);
  const fov = 900;
  const sprite = leaf.sprite;
  const sw = sprite.width, sh = sprite.height;

  bctx.save();
  bctx.globalAlpha = alpha;
  bctx.translate(leaf.cx, leaf.cy);
  bctx.rotate(leaf.rot);

  // slice the sprite into vertical strips, project each strip in 3D
  const strips = 40;
  const stripW = sw / strips;
  for (let i = 0; i < strips; i++) {
    // local x of strip center, relative to sprite center (ox)
    const lx0 = (i * stripW - leaf.ox) * leaf.scale;
    const lx1 = ((i + 1) * stripW - leaf.ox) * leaf.scale;

    // project both edges (only x rotates around Y axis; y unaffected by spinY)
    const x0p = lx0 * cosA;
    const z0  = lx0 * sinA;
    const x1p = lx1 * cosA;
    const z1  = lx1 * sinA;

    const s0 = fov / (fov + z0 + 200);
    const s1 = fov / (fov + z1 + 200);

    const sx0 = x0p * s0;
    const sx1 = x1p * s1;

    // top/bottom y for this strip (full sprite height), scaled by perspective + spinX tilt
    const topY = -leaf.oy * leaf.scale;
    const botY = (sh - leaf.oy) * leaf.scale;

    // apply spinX (rotation around horizontal axis): y' = y*cosB - z*sinB
    const ty0 = topY * cosB - z0 * sinB;
    const by0 = botY * cosB - z0 * sinB;
    const ty1 = topY * cosB - z1 * sinB;
    const by1 = botY * cosB - z1 * sinB;

    // average scale for this strip
    const sAvg = (s0 + s1) * 0.5;
    const dxL = sx0;
    const dxR = sx1;
    const dyT = (ty0 * s0 + ty1 * s1) * 0.5;
    const dyB = (by0 * s0 + by1 * s1) * 0.5;

    // draw using setTransform to map source strip to destination quad (approx, axis-aligned)
    const dx = Math.min(dxL, dxR);
    const dw = Math.abs(dxR - dxL) + 0.5;
    const dy = dyT;
    const dh = dyB - dyT;
    if (dw <= 0 || dh <= 0) continue;

    bctx.drawImage(
      sprite,
      i * stripW, 0, stripW + 0.5, sh,
      dx, dy, dw, dh
    );
  }

  bctx.restore();
}

function loop() {
  // trail: semi-transparent sepia wash on the buffer
  bctx.globalCompositeOperation = 'source-over';
  bctx.globalAlpha = 1;
  bctx.fillStyle = 'rgba(201, 180, 135, 0.08)';
  bctx.fillRect(0, 0, buf.width, buf.height);

  for (const l of leaves) {
    l.spinY += l.speedY;
    l.spinX += l.speedX;
    l.age++;
  }
  for (let i = leaves.length - 1; i >= 0; i--) {
    if (leaves[i].age > leaves[i].maxLife) {
      leaves.splice(i, 1);
      leaves.push(createLeaf());
    }
  }
  leaves.sort((a, b) => a.spinX - b.spinX);
  for (const l of leaves) drawLeaf(l);

  // composite buffer + vignette to visible canvas (no accumulation)
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(buf, 0, 0);
  ctx.drawImage(vignette, 0, 0);

  requestAnimationFrame(loop);
}

for (let i = 0; i < 22; i++) {
  const l = createLeaf();
  l.age = Math.floor(rand(0, l.maxLife * 0.8));
  leaves.push(l);
}

loop();
</script>
</body>
</html>
