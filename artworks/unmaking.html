function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}

function darken(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16) >> 1;
  const g = parseInt(hex.slice(3, 5), 16) >> 1;
  const b = parseInt(hex.slice(5, 7), 16) >> 1;
  return `rgba(${r},${g},${b},${alpha})`;
}

function rgbaFromHex(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function initParticles() {
  particles.length = 0;
  for (let i = 0; i < N; i++) {
    const col = i % SQUARE_SIDE;
    const row = Math.floor(i / SQUARE_SIDE);
    const sx = W / 2 - (SQUARE_SIDE * PX) / 2 + col * PX + PX / 2;
    const sy = H / 2 - (SQUARE_SIDE * PX) / 2 + row * PX + PX / 2;
    const [pr, pg, pb] = AVATAR[i];
    const dr = pr >> 1, dg = pg >> 1, db = pb >> 1;
    particles.push({
      x: sx,
      y: sy,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8,
      life: Math.random() * 200,
      maxLife: 200 + Math.random() * 200,
      color: `rgb(${pr},${pg},${pb})`,
      darkR: dr, darkG: dg, darkB: db,
      fullR: pr, fullG: pg, fullB: pb,
      trailLife: Math.random() * TRAIL_LIFE
    });
  }
}

  for (const p of particles) {
    p._px = Math.floor(p.x / PX) * PX;
    p._py = Math.floor(p.y / PX) * PX;
  }
  
  const spiralAmount = 0.9 + Math.sin(globalRot * 2) * 1.5;
  
  tx.clearRect(0, 0, W, H);
  
  for (const p of particles) {
    const px = p._px, py = p._py;
    const dx = px + PX/2 - cx;
    const dy = py + PX/2 - cy;
    const r0 = Math.sqrt(dx * dx + dy * dy);
    const a0 = Math.atan2(dy, dx);
    
    const STEPS = 8;
    const half = PX / 2;
    const alpha = 1 - p.trailLife / TRAIL_LIFE;
    const lum = Math.round((p.fullR * 0.299 + p.fullG * 0.587 + p.fullB * 0.114) * 0.5);
    
    tx.fillStyle = `rgba(${lum},${lum},${lum},${alpha})`;
    tx.beginPath();
    
    const pts = [];
    for (let i = 0; i <= STEPS; i++) {
      const tt = i / STEPS;
      const r = r0 * (1 - tt);
      const a = a0 - spiralAmount * tt;
      const cxp = cx + Math.cos(a) * r;
      const cyp = cy + Math.sin(a) * r;
      const tang = a + Math.PI / 2;
      const w = half * (1 - tt);
      const j = 3 * (1 - tt);
      const jx1 = (Math.random() - 0.5) * j;
      const jy1 = (Math.random() - 0.5) * j;
      const jx2 = (Math.random() - 0.5) * j;
      const jy2 = (Math.random() - 0.5) * j;
      pts.push(cxp + Math.cos(tang) * w + jx1, cyp + Math.sin(tang) * w + jy1,
               cxp - Math.cos(tang) * w + jx2, cyp - Math.sin(tang) * w + jy2);
    }
    
    tx.moveTo(pts[0], pts[1]);
    for (let i = 0; i <= STEPS; i++) tx.lineTo(pts[i*4], pts[i*4+1]);
    for (let i = STEPS; i >= 0; i--) tx.lineTo(pts[i*4+2], pts[i*4+3]);
    tx.closePath();
    tx.fill();
  }
  
  tx.globalCompositeOperation = 'destination-out';
  tx.fillStyle = '#000';
  for (let i = 0; i < W; i += 3) {
    tx.fillRect(i, 0, 1, H);
  }
  for (let i = 0; i < H; i += 3) {
    tx.fillRect(0, i, W, 1);
  }
  tx.globalCompositeOperation = 'source-over';
  
  x.drawImage(trailCanvas, 0, 0);
  
  if (mode === 'flash') {
    const flashAlpha = 1 - modeFrame / FLASH_FRAMES;
    x.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
    x.fillRect(0, 0, W, H);
  }
  
  for (const p of particles) {
    x.fillStyle = p.color;
    x.fillRect(p._px, p._py, PX, PX);
  }
  
  x.strokeStyle = 'rgba(10, 10, 10, 0.4)';
  x.lineWidth = 1;
  x.beginPath();
  for (const p of particles) {
    x.rect(p._px + 0.5, p._py + 0.5, PX - 1, PX - 1);
  }
  x.stroke();
  
  requestAnimationFrame(frame);
}
frame();
</script>
