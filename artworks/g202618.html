<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genuary 2026 #18</title>
<style>
  body { 
    margin: 0; 
    overflow: hidden; 
    background: #000;
  }
  #forex-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    color: rgba(0, 255, 0, 0.3);
    overflow: hidden;
    pointer-events: none;
  }
  .forex-symbol {
    position: absolute;
    white-space: nowrap;
  }
  #canvas-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }
  canvas { 
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: auto;
  }
  #info {
    position: absolute;
    top: 20px;
    left: 20px;
    color: #000;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: bold;
    background: #f4e8c1;
    padding: 8px 12px;
    border: 3px solid #8b7355;
    letter-spacing: 0.5px;
    line-height: 1.4;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    text-transform: uppercase;
    white-space: pre;
    z-index: 10;
  }
</style>
</head>
<body>
<div id="forex-bg"></div>
<div id="canvas-container"></div>
<div id="info"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const forexBg = document.getElementById('forex-bg');
const symbols = [
    'USD/JPY', 'EUR/USD', 'GBP/USD', 'USD/CHF', 'AUD/USD', 'USD/CAD',
    'BUY', 'SELL', 'LONG', 'SHORT', 'PIP', 'LOT',
    'FOREX', 'FX', 'RATE', 'EXCHANGE', 'TRADE', 'MARGIN',
    'ASK', 'BID', 'OPEN', 'CLOSE', 'HIGH', 'LOW', 'SPREAD', 'LEVERAGE'
];

function getRandomValue() {
    const type = Math.floor(Math.random() * 3);
    if (type === 0) {
        return (Math.random() * 200 + 0.5).toFixed(2);
    } else if (type === 1) {
        const sign = Math.random() > 0.5 ? '+' : '-';
        return sign + (Math.random() * 5).toFixed(3) + '%';
    } else {
        return symbols[Math.floor(Math.random() * symbols.length)];
    }
}

function createForexSymbol() {
    const symbol = document.createElement('div');
    symbol.className = 'forex-symbol';
    symbol.textContent = getRandomValue();
    
    const startX = Math.random() * window.innerWidth;
    const endX = startX + (Math.random() * 200 - 100);
    const duration = Math.random() * 15000 + 10000;
    
    symbol.style.left = startX + 'px';
    symbol.style.top = '-50px';
    symbol.style.opacity = '0.5';
    symbol.style.fontSize = (Math.random() * 12 + 8) + 'px';
    symbol.style.color = 'rgba(0, 255, 0, 0.8)';
    symbol.style.zIndex = '0';
    
    let startTime = null;
    function animate(time) {
        if (!startTime) startTime = time;
        const progress = (time - startTime) / duration;
        
        if (progress < 1) {
            const currentY = -50 + (window.innerHeight + 100) * progress;
            const currentX = startX + (endX - startX) * progress;
            
            symbol.style.top = currentY + 'px';
            symbol.style.left = currentX + 'px';
            
            requestAnimationFrame(animate);
        } else {
            symbol.remove();
        }
    }
    
    forexBg.appendChild(symbol);
    requestAnimationFrame(animate);
}

for (let i = 0; i < 30; i++) {
    setTimeout(() => createForexSymbol(), i * 100);
}
setInterval(createForexSymbol, 800);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
document.getElementById('canvas-container').appendChild(renderer.domElement);

const infoDiv = document.getElementById('info');

// Create planet with sand texture
const geometry = new THREE.SphereGeometry(5, 128, 128);

// Create canvas texture for sand grains
const canvas = document.createElement('canvas');
canvas.width = 2048;
canvas.height = 1024;
const ctx = canvas.getContext('2d');

// Create gradient base for depth
const gradient = ctx.createRadialGradient(1024, 512, 0, 1024, 512, 1024);
gradient.addColorStop(0, '#d4c4b0');
gradient.addColorStop(0.5, '#c8b89f');
gradient.addColorStop(1, '#b8a890');
ctx.fillStyle = gradient;
ctx.fillRect(0, 0, 2048, 1024);

// Add varied sand colors
const sandColors = ['#d8cbb8', '#c8b89f', '#baa888', '#cbb8a0'];
for (let i = 0; i < 2000; i++) {
  const x = Math.random() * 2048;
  const y = Math.random() * 1024;
  const size = Math.random() * 25 + 8;
  const opacity = Math.random() * 0.08 + 0.02;
  const color = sandColors[Math.floor(Math.random() * sandColors.length)];
  
  ctx.fillStyle = color;
  ctx.globalAlpha = opacity;
  ctx.beginPath();
  ctx.arc(x, y, size, 0, Math.PI * 2);
  ctx.fill();
}

// Add fine grain texture
ctx.globalAlpha = 1;
for (let i = 0; i < 5000; i++) {
  const x = Math.random() * 2048;
  const y = Math.random() * 1024;
  const brightness = Math.random() * 40 + 190;
  ctx.fillStyle = `rgb(${brightness}, ${brightness - 20}, ${brightness - 35})`;
  ctx.fillRect(x, y, 1, 1);
}

// Add dune-like patterns
ctx.globalAlpha = 0.1;
for (let i = 0; i < 50; i++) {
  const x = Math.random() * 2048;
  const y = Math.random() * 1024;
  const width = Math.random() * 200 + 100;
  const height = Math.random() * 50 + 20;
  
  const duneGrad = ctx.createLinearGradient(x, y - height/2, x, y + height/2);
  duneGrad.addColorStop(0, '#f5deb3');
  duneGrad.addColorStop(0.5, '#d2b48c');
  duneGrad.addColorStop(1, '#c4a574');
  
  ctx.fillStyle = duneGrad;
  ctx.beginPath();
  ctx.ellipse(x, y, width, height, Math.random() * Math.PI, 0, Math.PI * 2);
  ctx.fill();
}

const texture = new THREE.CanvasTexture(canvas);
texture.wrapS = THREE.RepeatWrapping;
texture.wrapT = THREE.RepeatWrapping;

const material = new THREE.MeshStandardMaterial({ 
  map: texture,
  roughness: 0.9,
  metalness: 0.1,
  bumpMap: texture,
  bumpScale: 0.02
});
const planet = new THREE.Mesh(geometry, material);
scene.add(planet);

// Add light
const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
scene.add(ambientLight);
const directionalLight = new THREE.DirectionalLight(0xffe8d0, 0.6);
directionalLight.position.set(5, 3, 5);
scene.add(directionalLight);
const greenLight = new THREE.DirectionalLight(0x00ff88, 0.25);
greenLight.position.set(-3, 2, -4);
scene.add(greenLight);

// Walk point and path
let pointOnSphere = randomPointOnSphere(5);
const pathPoints = [pointOnSphere.clone()];

// Movement variables
let velocity = new THREE.Vector3();
let targetDirection = null;

// Initialize velocity
velocity.copy(randomTangent(pointOnSphere));

// Forex-based direction changes
let lastExchangeRate = null;
let direction = 'same';
let useSimulation = false;

async function initializeExchangeRate() {
    try {
        const response = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
        const data = await response.json();
        lastExchangeRate = data.rates.JPY;
    } catch (error) {
        lastExchangeRate = 155.50;
    }
    
    infoDiv.textContent = `USD/JPY: ${lastExchangeRate.toFixed(2)}
CHANGE: 0.0000% →`;
    useSimulation = true;
}

async function checkExchangeRate() {
    if (!useSimulation) return;
    
    const fakeRate = lastExchangeRate + (Math.random() * 2 - 1);
    const pctChange = ((fakeRate - lastExchangeRate) / lastExchangeRate) * 100;
    
    let arrow = '→';
    if (fakeRate > lastExchangeRate) {
        direction = 'up';
        arrow = '↑';
        // Turn right
        const normal = pointOnSphere.clone().normalize();
        const right = new THREE.Vector3().crossVectors(velocity, normal).normalize();
        targetDirection = right;
    } else if (fakeRate < lastExchangeRate) {
        direction = 'down';
        arrow = '↓';
        // Turn left
        const normal = pointOnSphere.clone().normalize();
        const left = new THREE.Vector3().crossVectors(normal, velocity).normalize();
        targetDirection = left;
    }
    
    infoDiv.textContent = `USD/JPY: ${fakeRate.toFixed(2)}
CHANGE: ${pctChange.toFixed(4)}% ${arrow}`;
    
    lastExchangeRate = fakeRate;
}

initializeExchangeRate();
setInterval(checkExchangeRate, 3000);

// Line to visualize path
let pathLine;
let dashedLine;
const lineMaterial = new THREE.LineBasicMaterial({ 
  color: 0x000000, 
  linewidth: 5,
  transparent: true,
  opacity: 0.3
});
const dashedMaterial = new THREE.LineDashedMaterial({
  color: 0xffffff,
  linewidth: 1,
  dashSize: 0.1,
  gapSize: 0.1,
  transparent: true,
  opacity: 0.8
});

// Dust particles
const dustParticles = [];
const dustGeometry = new THREE.SphereGeometry(0.02, 8, 8);
const dustMaterial = new THREE.MeshBasicMaterial({ 
  color: 0xd2b48c, 
  transparent: true,
  opacity: 0.6
});

// Animation loop
function animate() {
  requestAnimationFrame(animate);

  // Smoothly interpolate to target direction if one exists
  if (targetDirection) {
    velocity.lerp(targetDirection, 0.05);
  }

  // Get surface normal
  const normal = pointOnSphere.clone().normalize();
  
  // Project velocity onto tangent plane
  const normalComponent = normal.clone().multiplyScalar(velocity.dot(normal));
  velocity.sub(normalComponent);
  velocity.normalize();

  // Move point on sphere
  pointOnSphere.add(velocity.clone().multiplyScalar(0.02));
  pointOnSphere.normalize().multiplyScalar(5);

  // Add to path
  pathPoints.push(pointOnSphere.clone());

  // Create dust particles at current position
  if (Math.random() < 0.3) {
    const dust = new THREE.Mesh(dustGeometry, dustMaterial.clone());
    dust.position.copy(pointOnSphere);
    
    // Random offset from surface
    const offset = normal.clone().multiplyScalar(Math.random() * 0.1 + 0.05);
    dust.position.add(offset);
    
    // Random tangent direction for drift
    const driftDir = new THREE.Vector3(
      (Math.random() - 0.5) * 0.02,
      (Math.random() - 0.5) * 0.02,
      (Math.random() - 0.5) * 0.02
    );
    
    dust.userData = {
      velocity: driftDir,
      life: 1.0,
      scale: Math.random() * 0.5 + 0.5
    };
    
    dust.scale.setScalar(dust.userData.scale);
    scene.add(dust);
    dustParticles.push(dust);
  }

  // Update dust particles
  for (let i = dustParticles.length - 1; i >= 0; i--) {
    const dust = dustParticles[i];
    dust.position.add(dust.userData.velocity);
    dust.userData.life -= 0.02;
    dust.material.opacity = dust.userData.life * 0.6;
    dust.scale.setScalar(dust.userData.scale * (1 + (1 - dust.userData.life) * 0.5));
    
    if (dust.userData.life <= 0) {
      scene.remove(dust);
      dust.material.dispose();
      dustParticles.splice(i, 1);
    }
  }

  // Update path mesh
  if (pathLine) {
    scene.remove(pathLine);
    pathLine.geometry.dispose();
  }
  if (dashedLine) {
    scene.remove(dashedLine);
    dashedLine.geometry.dispose();
  }
  const lineGeometry = new THREE.BufferGeometry().setFromPoints(pathPoints);
  pathLine = new THREE.Line(lineGeometry, lineMaterial);
  scene.add(pathLine);
  
  const dashedGeometry = new THREE.BufferGeometry().setFromPoints(pathPoints);
  dashedLine = new THREE.Line(dashedGeometry, dashedMaterial);
  dashedLine.computeLineDistances();
  scene.add(dashedLine);

  // Update camera so it always looks at the surface point
  camera.position.copy(pointOnSphere.clone().multiplyScalar(2.5));
  camera.lookAt(pointOnSphere);

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Random point on sphere
function randomPointOnSphere(radius) {
  const u = Math.random();
  const v = Math.random();
  const theta = 2 * Math.PI * u;
  const phi = Math.acos(2 * v - 1);
  return new THREE.Vector3(
    radius * Math.sin(phi) * Math.cos(theta),
    radius * Math.cos(phi),
    radius * Math.sin(phi) * Math.sin(theta)
  );
}

// Random tangent direction
function randomTangent(position) {
  const normal = position.clone().normalize();
  let arbitrary = new THREE.Vector3(0, 1, 0);
  if (Math.abs(normal.y) > 0.8) {
    arbitrary = new THREE.Vector3(1, 0, 0);
  }
  const t1 = new THREE.Vector3().crossVectors(normal, arbitrary).normalize();
  const t2 = new THREE.Vector3().crossVectors(normal, t1).normalize();
  const angle = Math.random() * Math.PI * 2;
  return t1.multiplyScalar(Math.cos(angle)).add(t2.multiplyScalar(Math.sin(angle)));
}
</script>
</body>
</html>
