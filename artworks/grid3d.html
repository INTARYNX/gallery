<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Runner - Three.js</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Rajdhani', sans-serif;
      color: #0ff;
      overflow: hidden;
      touch-action: none;
      background: #000;
    }
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: auto;
      z-index: 10;
    }
    #controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      pointer-events: auto;
      z-index: 100;
    }
    #welcome {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #020d26 0%, #0a1628 100%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s;
    }
    #welcome.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #welcome-canvas {
      width: 400px;
      height: 400px;
      max-width: 80vw;
      max-height: 40vh;
      position: relative;
    }
    #canvas-wrapper {
      position: relative;
      display: inline-block;
    }
    #flash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(0,255,255,0.8) 50%, transparent 100%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s ease-out;
      mix-blend-mode: screen;
    }
    #welcome h1 {
      font-size: 64px;
      font-weight: 700;
      margin: 20px 0;
      text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
      letter-spacing: 4px;
    }
    #welcome p {
      font-size: 18px;
      margin: 10px 0 30px 0;
      opacity: 0.8;
    }
    #start-btn {
      background: rgba(0, 255, 255, 0.3);
      border: 3px solid #0ff;
      color: #0ff;
      padding: 20px 50px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 24px;
      cursor: pointer;
      border-radius: 15px;
      transition: all 0.3s;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
    }
    #start-btn:hover {
      background: rgba(0, 255, 255, 0.5);
      box-shadow: 0 0 50px rgba(0, 255, 255, 0.8);
      transform: scale(1.05);
    }
    @media (max-width: 768px) {
      #welcome h1 {
        font-size: 40px;
      }
      #welcome p {
        font-size: 14px;
      }
      #start-btn {
        padding: 15px 35px;
        font-size: 18px;
      }
    }
    .btn {
      background: rgba(0, 255, 255, 0.2);
      border: 2px solid #0ff;
      color: #0ff;
      padding: 12px 20px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.3s;
      user-select: none;
      touch-action: manipulation;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
    }
    .btn:hover {
      background: rgba(0, 255, 255, 0.4);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
    }
    @media (max-width: 768px) {
      .btn {
        padding: 10px 16px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div id="welcome">
    <div id="canvas-wrapper">
      <canvas id="welcome-canvas"></canvas>
      <div id="flash-overlay"></div>
    </div>
    <h1>GRID RUNNER</h1>
    <p>Control the light cycle. Avoid the trails. Survive.</p>
    <button id="start-btn">START GAME</button>
  </div>
  <div id="canvas-container"></div>
  <canvas id="overlay"></canvas>
  <div id="controls">
    <button class="btn" id="left"><i class="fas fa-arrow-left"></i> LEFT</button>
    <button class="btn" id="right">RIGHT <i class="fas fa-arrow-right"></i></button>
    <button class="btn" id="camera"><i class="fas fa-video"></i> SWITCH</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const GRID_SIZE = 64;
    const {cos, sin, abs, max, min, floor, PI} = Math;
    
    let scene, camera, renderer, grid = [];
    const trailMeshes = [];
    const trailPool = [];
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');
    
    let welcomeScene, welcomeCamera, welcomeRenderer, welcomeCycle;
    let gameStarted = false;
    
    const horizontalGeo = new THREE.BoxGeometry(1.05, 1.5, 0.08);
    const verticalGeo = new THREE.BoxGeometry(0.08, 1.5, 1.05);
    const blueMat = new THREE.MeshBasicMaterial({ 
      color: new THREE.Color(0x0096ff),
      transparent: true,
      opacity: 0.95
    });
    const orangeMat = new THREE.MeshBasicMaterial({ 
      color: new THREE.Color(0xff7800),
      transparent: true,
      opacity: 0.95
    });
    
    function createLightCycle(color) {
      const cycle = new THREE.Group();
      
      const metalMat = new THREE.MeshStandardMaterial({ 
        color: color,
        metalness: 0.9,
        roughness: 0.2,
        emissive: color,
        emissiveIntensity: 0.3
      });
      
      const darkMetalMat = new THREE.MeshStandardMaterial({ 
        color: new THREE.Color(color).multiplyScalar(0.3),
        metalness: 0.95,
        roughness: 0.1
      });
      
      const blackMat = new THREE.MeshStandardMaterial({ 
        color: 0x000000,
        metalness: 0.5,
        roughness: 0.8
      });
      
      const wheelGeom = new THREE.CylinderGeometry(0.15, 0.15, 0.25, 16);
      const wheelCenterGeom = new THREE.CylinderGeometry(0.08, 0.08, 0.26, 16);
      
      const frontWheel = new THREE.Mesh(wheelGeom, metalMat);
      frontWheel.rotation.z = PI / 2;
      frontWheel.position.set(0, 0, 0.4);
      cycle.add(frontWheel);
      
      const frontWheelCenter = new THREE.Mesh(wheelCenterGeom, blackMat);
      frontWheelCenter.rotation.z = PI / 2;
      frontWheelCenter.position.set(0, 0, 0.4);
      cycle.add(frontWheelCenter);

      const rearWheel = new THREE.Mesh(wheelGeom, metalMat);
      rearWheel.rotation.z = PI / 2;
      rearWheel.position.set(0, 0, -0.4);
      cycle.add(rearWheel);
      
      const rearWheelCenter = new THREE.Mesh(wheelCenterGeom, blackMat);
      rearWheelCenter.rotation.z = PI / 2;
      rearWheelCenter.position.set(0, 0, -0.4);
      cycle.add(rearWheelCenter);

      const curve = new THREE.QuadraticBezierCurve3(
        new THREE.Vector3(0, 0, -0.4),
        new THREE.Vector3(0, 0.45, 0),
        new THREE.Vector3(0, 0, 0.4)
      );
      const tubeGeometry = new THREE.TubeGeometry(curve, 12, 0.08, 8, false);
      const body = new THREE.Mesh(tubeGeometry, metalMat);
      cycle.add(body);

      const bottomBarGeom = new THREE.CylinderGeometry(0.05, 0.05, 0.8, 8);
      const bottomBar = new THREE.Mesh(bottomBarGeom, metalMat);
      bottomBar.rotation.x = PI / 2;
      bottomBar.position.set(0, -0.1, 0);
      cycle.add(bottomBar);
      
      const finShape = new THREE.Shape();
      finShape.moveTo(0, -0.1);
      finShape.lineTo(-0.4, -0.1);
      finShape.lineTo(-0.1, 0.25);
      finShape.lineTo(0, -0.1);
      
      const finGeom = new THREE.ExtrudeGeometry(finShape, {
        depth: 0.12,
        bevelEnabled: false
      });
      const fin = new THREE.Mesh(finGeom, metalMat);
      fin.rotation.y = PI / 2;
      fin.position.set(-0.06, 0, 0);
      cycle.add(fin);

      const frontLight = new THREE.PointLight(color, 0.5, 2);
      frontLight.position.set(0, 0.3, 0.5);
      cycle.add(frontLight);

      const rearLight = new THREE.PointLight(color, 0.3, 1.5);
      rearLight.position.set(0, 0.3, -0.4);
      cycle.add(rearLight);

      cycle.position.y = 0.4;
      return cycle;
    }
    
    function initWelcomeScreen() {
      welcomeScene = new THREE.Scene();
      welcomeScene.background = new THREE.Color(0x020d26);
      
      welcomeCamera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
      welcomeCamera.position.set(2, 1.5, 2);
      welcomeCamera.lookAt(0, 0.5, 0);
      
      const welcomeCanvas = document.getElementById('welcome-canvas');
      welcomeRenderer = new THREE.WebGLRenderer({ canvas: welcomeCanvas, antialias: true });
      welcomeRenderer.setSize(400, 400);
      welcomeRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      
      const ambLight = new THREE.AmbientLight(0xffffff, 0.5);
      welcomeScene.add(ambLight);
      
      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(5, 5, 5);
      welcomeScene.add(dirLight);
      
      const spotLight = new THREE.SpotLight(0x00ffff, 2);
      spotLight.position.set(-3, 3, 0);
      spotLight.target.position.set(0, 0, 0);
      welcomeScene.add(spotLight);
      welcomeScene.add(spotLight.target);
      
      welcomeCycle = createLightCycle(0x00ffff);
      welcomeCycle.position.y = 0.4;
      welcomeCycle.userData.currentColor = 0x00ffff;
      welcomeCycle.userData.targetColor = 0xff7800;
      welcomeCycle.userData.colorTransition = 0;
      welcomeCycle.userData.isTransitioning = false;
      welcomeScene.add(welcomeCycle);
      
      const platformGeom = new THREE.CylinderGeometry(1, 1, 0.1, 32);
      const platformMat = new THREE.MeshStandardMaterial({ 
        color: 0x0a1628,
        metalness: 0.8,
        roughness: 0.2,
        emissive: 0x00ffff,
        emissiveIntensity: 0.1
      });
      const platform = new THREE.Mesh(platformGeom, platformMat);
      platform.position.y = -0.05;
      welcomeScene.add(platform);
      
      animateWelcome();
    }
    
    function updateCycleColor(cycle, progress) {
      const blue = new THREE.Color(0x00ffff);
      const orange = new THREE.Color(0xff7800);
      const currentColor = cycle.userData.targetColor === 0xff7800 ? 
        blue.clone().lerp(orange, progress) : 
        orange.clone().lerp(blue, progress);
      
      cycle.traverse((child) => {
        if (child.isMesh && child.material) {
          const isBlackCenter = child.material.color.equals(new THREE.Color(0x000000));
          
          if (!isBlackCenter) {
            if (child.material.emissive) {
              child.material.color.copy(currentColor);
              child.material.emissive.copy(currentColor);
            } else if (child.material.color) {
              child.material.color.copy(currentColor);
            }
          }
        }
        if (child.isLight && child.type === 'PointLight') {
          child.color.copy(currentColor);
        }
      });
    }
    
    function animateWelcome() {
      if (!gameStarted) {
        welcomeCycle.rotation.y += 0.01;
        
        if (!welcomeCycle.userData.isTransitioning) {
          if (Math.random() < 0.02) {
            welcomeCycle.userData.isTransitioning = true;
            welcomeCycle.userData.colorTransition = 0;
            
            const flash = document.getElementById('flash-overlay');
            flash.style.opacity = '1';
            setTimeout(() => {
              flash.style.opacity = '0';
            }, 100);
          }
        } else {
          welcomeCycle.userData.colorTransition += 0.08;
          
          if (welcomeCycle.userData.colorTransition <= 1) {
            updateCycleColor(welcomeCycle, welcomeCycle.userData.colorTransition);
          } else {
            welcomeCycle.userData.isTransitioning = false;
            welcomeCycle.userData.currentColor = welcomeCycle.userData.targetColor;
            welcomeCycle.userData.targetColor = welcomeCycle.userData.currentColor === 0x00ffff ? 0xff7800 : 0x00ffff;
          }
        }
        
        welcomeRenderer.render(welcomeScene, welcomeCamera);
        requestAnimationFrame(animateWelcome);
      }
    }
    
    function init3D() {
      scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0x020d26, 5, 25);
      
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
      
      renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.getElementById('canvas-container').appendChild(renderer.domElement);
      
      const gridHelper = new THREE.GridHelper(GRID_SIZE, GRID_SIZE, 0xffffff, 0xffffff);
      gridHelper.position.y = 0;
      gridHelper.material.opacity = 0.5;
      gridHelper.material.transparent = true;
      scene.add(gridHelper);
      
      const hemiLight = new THREE.HemisphereLight(0x0088ff, 0xff8800, 0.3);
      scene.add(hemiLight);
      
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
      dirLight.position.set(10, 20, 10);
      scene.add(dirLight);
      
      const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
      scene.add(ambientLight);
      
      const wallMat = new THREE.MeshBasicMaterial({ 
        color: 0x00ffff,
        transparent: true,
        opacity: 0.3,
        side: THREE.DoubleSide
      });
      const wallHeight = 3, wallThickness = 0.2;
      
      const wallN = new THREE.Mesh(new THREE.BoxGeometry(GRID_SIZE, wallHeight, wallThickness), wallMat);
      wallN.position.set(0, wallHeight/2, -GRID_SIZE/2);
      scene.add(wallN);
      
      const wallS = new THREE.Mesh(new THREE.BoxGeometry(GRID_SIZE, wallHeight, wallThickness), wallMat);
      wallS.position.set(0, wallHeight/2, GRID_SIZE/2);
      scene.add(wallS);
      
      const wallE = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, wallHeight, GRID_SIZE), wallMat);
      wallE.position.set(GRID_SIZE/2, wallHeight/2, 0);
      scene.add(wallE);
      
      const wallW = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, wallHeight, GRID_SIZE), wallMat);
      wallW.position.set(-GRID_SIZE/2, wallHeight/2, 0);
      scene.add(wallW);
      
      for (let i = 0; i < GRID_SIZE; i++) {
        grid[i] = new Array(GRID_SIZE).fill(false);
      }
      
      runners.forEach(r => {
        r.racerMesh = createLightCycle(r.color.getHex());
        scene.add(r.racerMesh);
      });
    }
    
    const DIRS = [
      {x: 0, z: -1, angle: 0},
      {x: 1, z: 0, angle: -PI/2},
      {x: 0, z: 1, angle: PI},
      {x: -1, z: 0, angle: PI/2}
    ];
    
    function runner(x, z, dir, color, isPlayer = false) {
      return {
        x, z, dir, rx: x, rz: z, tx: x, tz: z,
        ca: DIRS[dir].angle, tca: DIRS[dir].angle,
        color, trail: [], alive: true, mt: 0, md: 7,
        isPlayer, nt: 0, spd: 1.0, tspd: 1.0, ld: dir
      };
    }
    
    const runners = [
      runner(16, 32, 0, new THREE.Color(0x0096ff), true),
      runner(48, 32, 2, new THREE.Color(0xff7800), false)
    ];
    
    let ai = 0, death = 0, alive = 2, winner = null;
    let deathAnimTime = 0, deathPos = null;
    
    function valid(x, z) {
      return x >= 0 && x < GRID_SIZE && z >= 0 && z < GRID_SIZE && !grid[z][x];
    }
    
    function getTrailMesh(isHorizontal, material) {
      const mesh = trailPool.length > 0 ? trailPool.pop() : new THREE.Mesh();
      mesh.geometry = isHorizontal ? horizontalGeo : verticalGeo;
      mesh.material = material.clone();
      return mesh;
    }
    
    function move(r) {
      r.mt++;
      const t = min(1, r.mt / r.md);
      r.rx = r.x + (r.tx - r.x) * t;
      r.rz = r.z + (r.tz - r.z) * t;
      r.spd += (r.tspd - r.spd) * 0.1;
      
      r.tca = DIRS[r.dir].angle;
      let diff = r.tca - r.ca;
      while (diff > PI) diff -= 2 * PI;
      while (diff < -PI) diff += 2 * PI;
      r.ca += diff * 0.15;
      
      if (r.mt < r.md) return false;
      
      r.mt = 0;
      r.x = r.tx;
      r.z = r.tz;
      
      if (r.trail.length > 0) grid[r.z][r.x] = true;
      
      const prevPos = r.trail.length > 0 ? r.trail[r.trail.length - 1] : null;
      r.trail.push({x: r.x, z: r.z});
      
      if (prevPos) {
        const dx = r.x - prevPos.x;
        const dz = r.z - prevPos.z;
        const isHorizontal = abs(dx) > abs(dz);
        const mat = r.color.equals(new THREE.Color(0x0096ff)) ? blueMat : orangeMat;
        const mesh = getTrailMesh(isHorizontal, mat);
        
        const midX = (r.x + prevPos.x) / 2;
        const midZ = (r.z + prevPos.z) / 2;
        mesh.position.set(midX - GRID_SIZE/2 + 0.5, 0.75, midZ - GRID_SIZE/2 + 0.5);
        scene.add(mesh);
        trailMeshes.push(mesh);
        mesh.userData = { runner: r, segmentIndex: r.trail.length - 1 };
      }
      
      if (r.isPlayer) {
        const nd = (r.dir + r.nt + 4) % 4;
        const nx = r.x + DIRS[nd].x;
        const nz = r.z + DIRS[nd].z;
        
        if (valid(nx, nz)) {
          r.dir = nd;
          r.tx = nx;
          r.tz = nz;
          r.tspd = r.dir !== r.ld ? 0.7 : 1.0;
          r.ld = r.dir;
        } else return true;
        r.nt = 0;
      } else {
        const opts = [];
        for (let turn = -1; turn <= 1; turn++) {
          const nd = (r.dir + turn + 4) % 4;
          const nx = r.x + DIRS[nd].x;
          const nz = r.z + DIRS[nd].z;
          if (!valid(nx, nz)) continue;
          
          let sc = turn === 0 ? 300 : 0;
          let free = 0;
          for (let d = 1; d <= 12; d++) {
            const tx = nx + DIRS[nd].x * d;
            const tz = nz + DIRS[nd].z * d;
            if (valid(tx, tz)) free++;
            else break;
          }
          sc += free * 80;
          opts.push({dir: nd, nx, nz, sc});
        }
        
        if (opts.length === 0) return true;
        opts.sort((a, b) => b.sc - a.sc);
        const c = opts[0];
        r.dir = c.dir;
        r.tx = c.nx;
        r.tz = c.nz;
        r.tspd = r.dir !== r.ld ? 0.7 : 1.0;
        r.ld = r.dir;
      }
      return false;
    }
    
    function drawHUD(r) {
      const w = overlay.width, h = overlay.height;
      ctx.clearRect(0, 0, w, h);
      
      if (death > 0) {
        ctx.fillStyle = `rgba(255,0,0,${death * 0.5})`;
        ctx.fillRect(0, 0, w, h);
        
        if (deathPos && deathAnimTime < 1) {
          const projPos = new THREE.Vector3(
            deathPos.x - GRID_SIZE/2 + 0.5, 0.75, deathPos.z - GRID_SIZE/2 + 0.5
          );
          projPos.project(camera);
          
          const screenX = (projPos.x + 1) / 2 * w;
          const screenY = (-projPos.y + 1) / 2 * h;
          const numRays = 24;
          const maxRadius = Math.max(w, h) * 1.5;
          const currentRadius = maxRadius * deathAnimTime;
          
          ctx.save();
          ctx.translate(screenX, screenY);
          
          for (let i = 0; i < numRays; i++) {
            const angle = (i / numRays) * PI * 2;
            const rayWidth = 4 + sin(deathAnimTime * PI) * 6;
            
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(cos(angle) * currentRadius, sin(angle) * currentRadius);
            
            const gradient = ctx.createLinearGradient(
              0, 0, cos(angle) * currentRadius, sin(angle) * currentRadius
            );
            gradient.addColorStop(0, `rgba(255, 255, 255, ${(1 - deathAnimTime) * 0.9})`);
            gradient.addColorStop(0.3, `rgba(0, 200, 255, ${(1 - deathAnimTime) * 0.7})`);
            gradient.addColorStop(1, 'rgba(0, 150, 255, 0)');
            
            ctx.strokeStyle = gradient;
            ctx.lineWidth = rayWidth;
            ctx.stroke();
          }
          ctx.restore();
          deathAnimTime += 0.02;
        }
      }
      
      if (winner !== null) {
        const wt = winner === 0 ? 'BLUE WINS!' : 'ORANGE WINS!';
        const wc = winner === 0 ? 'rgba(100,180,255,1)' : 'rgba(255,150,50,1)';
        ctx.font = `bold ${Math.min(48, w/15)}px Rajdhani`;
        ctx.textAlign = 'center';
        ctx.fillStyle = wc;
        ctx.shadowColor = wc;
        ctx.shadowBlur = 30;
        ctx.fillText(wt, w / 2, h / 2);
        ctx.shadowBlur = 0;
      }
      
      const hc = r.color.equals(new THREE.Color(0x0096ff)) ? 
        {r: 0, g: 150, b: 255} : {r: 255, g: 120, b: 0};
      const rn = r.color.equals(new THREE.Color(0x0096ff)) ? 'BLUE RUNNER' : 'ORANGE RUNNER';
      
      ctx.font = `bold ${Math.min(20, w/30)}px Rajdhani`;
      ctx.textAlign = 'left';
      ctx.fillStyle = `rgba(${hc.r},${hc.g},${hc.b},0.9)`;
      ctx.fillText(rn, 20, 30);
      
      const sz = min(200, w * 0.35, h * 0.35), cell = sz / GRID_SIZE;
      const mx = w - sz - 10, my = 10;
      ctx.fillStyle = 'rgba(0,50,50,0.8)';
      ctx.fillRect(mx, my, sz, sz);
      
      for (const rr of runners) {
        const c = rr.color.equals(new THREE.Color(0x0096ff)) ? 
          {r: 0, g: 150, b: 255} : {r: 255, g: 120, b: 0};
        
        for (const p of rr.trail) {
          ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.8)`;
          ctx.fillRect(mx + p.x * cell, my + p.z * cell, cell, cell);
        }
        
        ctx.fillStyle = `rgba(${c.r * 2},${c.g * 2},${c.b * 2},1)`;
        ctx.fillRect(mx + rr.x * cell, my + rr.z * cell, cell * 1.5, cell * 1.5);
      }
    }
    
    function reset() {
      for (let i = 0; i < GRID_SIZE; i++) grid[i].fill(false);
      trailMeshes.forEach(m => {
        scene.remove(m);
        trailPool.push(m);
      });
      trailMeshes.length = 0;
      winner = null;
      runners.forEach((r, i) => {
        r.x = r.tx = r.rx = i === 0 ? 16 : 48;
        r.z = r.tz = r.rz = 32;
        r.dir = i === 0 ? 0 : 2;
        r.ca = r.tca = DIRS[r.dir].angle;
        r.ld = r.dir;
        r.trail = [];
        r.alive = true;
        r.mt = 0;
        r.nt = 0;
        r.spd = 1.0;
        r.tspd = 1.0;
      });
      ai = 0;
      alive = 2;
      death = 0;
      deathAnimTime = 0;
      deathPos = null;
    }
    
    function animate() {
      death = max(0, death - 0.03);
      
      for (const r of runners) {
        if (!r.alive) continue;
        
        if (move(r)) {
          r.alive = false;
          alive--;
          death = 1;
          deathAnimTime = 0;
          deathPos = {x: r.x, z: r.z};
          
          if (r === runners[ai]) {
            ai = runners.findIndex(rr => rr.alive);
          }
          
          if (alive <= 1) {
            winner = runners.findIndex(rr => rr.alive);
            setTimeout(reset, 3000);
          }
        }
      }
      
      const camRunner = runners[ai];
      const x = camRunner.rx - GRID_SIZE/2 + 0.5;
      const z = camRunner.rz - GRID_SIZE/2 + 0.5;
      camera.position.set(x, 1.5, z);
      camera.rotation.set(0, camRunner.ca, 0);
      
      for (const r of runners) {
        const rx = r.rx - GRID_SIZE/2 + 0.5;
        const rz = r.rz - GRID_SIZE/2 + 0.5;
        r.racerMesh.position.set(rx, 0.4, rz);
        r.racerMesh.rotation.y = r.ca;
        r.racerMesh.visible = r.alive;
      }
      
      for (const mesh of trailMeshes) {
        if (mesh.userData.runner && mesh.userData.segmentIndex !== undefined) {
          const r = mesh.userData.runner;
          const segmentsFromHead = r.trail.length - 1 - mesh.userData.segmentIndex;
          
          if (segmentsFromHead === 0) {
            mesh.material.color.setHex(0xffffff);
          } else if (segmentsFromHead === 1) {
            const white = new THREE.Color(0xffffff);
            mesh.material.color.copy(white.lerp(r.color.clone(), 0.5));
          } else if (segmentsFromHead === 2) {
            mesh.material.color.copy(r.color);
          }
        }
      }
      
      renderer.render(scene, camera);
      drawHUD(runners[ai]);
      requestAnimationFrame(animate);
    }
    
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      overlay.width = window.innerWidth;
      overlay.height = window.innerHeight;
    });
    
    overlay.width = window.innerWidth;
    overlay.height = window.innerHeight;
    
    const btn = (id, fn) => {
      const el = document.getElementById(id);
      el.addEventListener('click', fn);
      el.addEventListener('touchstart', (e) => {
        e.preventDefault();
        fn();
      });
    };
    
    btn('left', () => {
      if (runners[0].alive) runners[0].nt = -1;
    });
    
    btn('right', () => {
      if (runners[0].alive) runners[0].nt = 1;
    });
    
    btn('camera', () => {
      ai = (ai + 1) % runners.length;
    });
    
    document.addEventListener('keydown', (e) => {
      if (!runners[0].alive) return;
      if (e.key === 'ArrowLeft' || e.key === 'a') runners[0].nt = -1;
      if (e.key === 'ArrowRight' || e.key === 'd') runners[0].nt = 1;
      if (e.key === 'c') ai = (ai + 1) % runners.length;
    });
    
    overlay.addEventListener('click', (e) => {
      if (!runners[0].alive) return;
      runners[0].nt = e.clientX < window.innerWidth / 2 ? -1 : 1;
    });
    
    overlay.addEventListener('touchstart', (e) => {
      if (!runners[0].alive) return;
      e.preventDefault();
      runners[0].nt = e.touches[0].clientX < window.innerWidth / 2 ? -1 : 1;
    });
    
    document.getElementById('start-btn').addEventListener('click', () => {
      gameStarted = true;
      document.getElementById('welcome').classList.add('hidden');
      init3D();
      reset();
      animate();
    });
    
    initWelcomeScreen();
  </script>
</body>
</html>
