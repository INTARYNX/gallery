<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; }
  body { background: #0a0a0a; overflow: hidden; cursor: none; display: flex; justify-content: center; align-items: center; height: 100vh; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, r;
let t = 0;

function resize() {
  const s = Math.min(window.innerWidth, window.innerHeight);
  W = canvas.width = s;
  H = canvas.height = s;
  r = s * 0.32 | 0;
}
resize();
window.addEventListener('resize', resize);

const PI = Math.PI;
const HALF_PI = PI / 2;
const TAU = PI * 2;

function fbm(x, y, z) {
  let v = 0, a = 0.5, f = 1;
  for (let i = 0; i < 5; i++) {
    v += a * Math.sin(x * f + Math.cos(y * f * 0.7 + z)) *
             Math.cos(y * f + Math.sin(x * f * 0.6 - z * 0.8));
    f *= 2.12;
    a *= 0.48;
  }
  return v;
}

function draw() {
  ctx.fillStyle = 'rgba(6,4,12,0.11)';
  ctx.fillRect(0, 0, W, H);

  const cx0 = W / 2;
  const cy0 = H / 2;

  const morph = t * 0.08;
  const shape = Math.sin(morph) * 0.5 + 0.5;
  const twist = Math.sin(morph * 0.7) * 3;
  const fold = Math.sin(morph * 0.4) * 2;
  const pinch = Math.sin(morph * 1.3) * 0.6;

  const steps = PI / 500;
  const lstep0 = 0.08;

  let prevX = null, prevY = null, prevColor = null, prevZ = null;

  for (let lambda = 0, phi = -HALF_PI; phi < HALF_PI; lambda += lstep0 + Math.sin(phi * 3 + t) * 0.02, phi += steps) {

    const n = fbm(phi * 2, lambda * 1.5, t * 1.3);

    const u = phi;
    const v = lambda - t;

    const torusFactor = 1 + shape * 0.5 * Math.cos(u * 2);
    const twistAngle = twist * u;
    const tv = v + twistAngle;
    const foldedR = r * (torusFactor + pinch * Math.sin(u * 3 + fold * Math.cos(v * 2)));
    const spiralGrowth = 1 + 0.15 * Math.exp(u * 0.3) * Math.sin(v * 3 + t * 2) * shape;
    const rFinal = foldedR * spiralGrowth + n * r * 0.12;

    const cp = Math.cos(u);
    const sp = Math.sin(u);
    const ct = Math.cos(tv);
    const st = Math.sin(tv);

    const x = cp * st * rFinal + cx0;

    const breathe = Math.sin(t * 0.5) * 0.3;
    const cosR = Math.cos(t * 0.3 + breathe);
    const sinR = Math.sin(t * 0.3 + breathe);

    const yr = cosR * sp - sinR * cp * ct;
    const zr = sinR * sp + cosR * cp * ct;

    const y = yr * rFinal + cy0;

    if (zr > -0.25) {
      const ridge = (Math.sin(v * 3 + t * 2) + 1) * 0.5;
      const accent = ridge > 0.7 ? 1 : 0;
      const hue = (t * 20) % 360 | 0;
      const sat = accent ? 80 : 0;
      const lum = accent ? 50 + zr * 20 : 35 + zr * 25 + ridge * 10;
      const color = `hsl(${hue}, ${sat}%, ${lum}%)`;

      // line to previous point
      if (prevX !== null && prevZ > -0.25) {
        const dx = x - prevX;
        const dy = y - prevY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < r * 0.4) {
          ctx.strokeStyle = color;
          ctx.globalAlpha = 0.3 + zr * 0.3;
          ctx.lineWidth = 0.8 + ridge * 0.7;
          ctx.shadowBlur = 8 + ridge * 12;
          ctx.shadowColor = color;
          ctx.beginPath();
          ctx.moveTo(prevX, prevY);
          ctx.lineTo(x, y);
          ctx.stroke();
        }
      }

      ctx.globalAlpha = 1;

      prevX = x;
      prevY = y;
      prevColor = color;
      prevZ = zr;
    } else {
      prevX = null;
      prevY = null;
      prevZ = null;
    }
  }

  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
  t += 0.035;
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
