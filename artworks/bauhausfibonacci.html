<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bauhaus Fibonacci</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0a;
            overflow: hidden;
        }
        canvas { max-width: 100%; max-height: 100vh; }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <script>
        const c = document.getElementById('c');
        const g = c.getContext('2d');
        const S = Math.min(window.innerWidth, window.innerHeight, 800);
        c.width = c.height = S;
        const H = S / 2;
        
        let boxes = [], zoom = 1, tZoom = 1, fc = 0, t = 0;
        
        // Bauhaus palette
        const palette = ['#d40920','#1356a2','#f7d842','#000000','#f0f0f0'];
        const arcs = [
            [-Math.PI/2, 0],
            [0, Math.PI/2],
            [Math.PI/2, Math.PI],
            [Math.PI, Math.PI*1.5]
        ];
        
        function addBox() {
            const n = boxes.length;
            const size = n < 2 ? 1 : boxes[n-1].s + boxes[n-2].s;
            let x = H, y = H, dir = 0;
            for (let i = 0; i < n; i++) {
                const b = boxes[i];
                if (b.d === 0) { x += b.s; y -= b.s; }
                else if (b.d === 1) { x += b.s; y += b.s; }
                else if (b.d === 2) { x -= b.s; y += b.s; }
                else { x -= b.s; y -= b.s; }
                dir = (b.d + 1) & 3;
            }
            boxes.push({ s: size, x, y, d: dir });
        }
        
        function normalize() {
            for (let i = 0, n = boxes.length; i < n; i++) {
                const b = boxes[i];
                b.x = H + (b.x - H) * zoom;
                b.y = H + (b.y - H) * zoom;
                b.s *= zoom;
            }
            zoom = tZoom = 1;
        }
        

        
        function draw() {
            g.fillStyle = '#0a0a0a';
            g.fillRect(0, 0, S, S);
            
            g.save();
            g.translate(H, H);
            g.scale(zoom, zoom);
            g.rotate(t * 0.8);
            g.translate(-H, -H);
            
            const lw = 2 / zoom;
            const alw = 2.5 / zoom;
            const izoom = 1 / zoom;
            const t15 = t * 1.5;
            const t8 = t * 8;
            
            for (let i = 0, n = boxes.length; i < n; i++) {
                const b = boxes[i];
                const pulse = Math.sin(t15 + i * 0.3) * 0.5 + 0.5;
                const hue = (i * 40 + t8) % 360;
                const hue2 = (hue + 30) % 360;
                
                // Rect position
                const s = b.s;
                const d = b.d;
                const rx = d === 0 || d === 1 ? b.x : b.x - s;
                const ry = d === 0 || d === 3 ? b.y - s : b.y;
                
                g.fillStyle = palette[i % palette.length];
                g.strokeStyle = '#fff';
                g.lineWidth = lw;
                g.beginPath();
                g.rect(rx, ry, s, s);
                g.fill();
                g.stroke();
                
                // Arc
                g.strokeStyle = '#fff';
                g.lineWidth = alw;
                g.beginPath();
                const a = arcs[d];
                g.arc(b.x, b.y, s, a[0], a[1]);
                g.stroke();
            }
            
            g.restore();
            
        }
        
        function loop() {
            fc++;
            t += 0.016;
            
            if (fc % 8 === 0) addBox();
            
            if (boxes.length > 2) {
                const d = (S * 0.5) / boxes[boxes.length-1].s;
                if (d < tZoom) tZoom = d;
            }
            zoom += (tZoom - zoom) * 0.04;
            if (zoom < 0.001) normalize();
            
            draw();
            requestAnimationFrame(loop);
        }
        
        loop();
    </script>
</body>
</html>
