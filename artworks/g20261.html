<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genuary 2026 #1</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0a0e27;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let centerX, centerY, maxSize;
    
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      centerX = canvas.width / 2;
      centerY = canvas.height / 2;
      maxSize = Math.min(canvas.width, canvas.height) * 0.8;
    }
    
    resize();
    
    const numCircles = 15;
    let time = 0;
    
    function drawCorridor() {
      ctx.fillStyle = '#0a0e27';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      for (let i = 0; i < numCircles; i++) {
        const scale = 1 - (i * 0.06);
        const size = maxSize * scale;
        const xOffset = Math.sin(time + i * 0.3) * (maxSize * 0.125);
        
        ctx.strokeStyle = '#6366f1';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(centerX + xOffset, centerY, size / 2, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    
    function animate() {
      time += 0.03;
      
      drawCorridor();
      requestAnimationFrame(animate);
    }
    
    animate();
    
    window.addEventListener('resize', () => {
      resize();
    });
  </script>
</body>
</html>
