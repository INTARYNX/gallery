  :root{color-scheme:light dark}
  html,body{height:100%;margin:0;background:#000;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;display:flex;align-items:center;justify-content:center;}
  #container{width:100%;height:100%;max-width:133.33vh;max-height:75vw;aspect-ratio:4/3;position:relative;background:#000;}
  canvas{display:block;width:100%;height:100%;}

</head>
<body>
<div id="container">
  <canvas id="c"></canvas>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const container = document.getElementById('container');
const mk = (w=1,h=1)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const world = mk(), wctx = world.getContext('2d');
const bloomA = mk(), bctxA = bloomA.getContext('2d');
const bloomB = mk(), bctxB = bloomB.getContext('2d');
let W=1, H=1, DPR=1, scale=1, isMobile=false;

function updateCanvasSize(){
  const rect = container.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = rect.width; H = rect.height;
  canvas.width = world.width = Math.max(1, Math.round(W*DPR));
  canvas.height = world.height = Math.max(1, Math.round(H*DPR));
  bloomA.width = Math.max(8, Math.round(W/4)); bloomA.height = Math.max(8, Math.round(H/4));
  bloomB.width = Math.max(4, Math.round(W/16)); bloomB.height = Math.max(4, Math.round(H/16));
  isMobile = W < 768;
  const referenceWidth = isMobile ? 375 : 1200;
  const referenceHeight = isMobile ? 667 : 900;
  scale = Math.min(W / referenceWidth, H / referenceHeight);
  initParticles();
}
addEventListener('resize', updateCanvasSize);

const SEG_LEN = 200;
const ROAD_W = 400;
const CAMERA_H = 1000;
const CAMERA_DEPTH = 0.84;
const DRAW_DISTANCE = 300;

let segments = [];
let seed = Math.random()*10000;
let playerZ = 0;
let speed = 300;
let lastTime = performance.now();
let time = 0;
let dayTime = 0;
let seasonTime = 0;
let endSequence = false;
let endTime = 0;
let introSequence = true;
let introTime = 0;
let bgX = 0;

let tapTimes = [];

canvas.addEventListener('click', () => {
  if(introSequence && introTime > 1) {
    introSequence = false;
    return;
  }
  const now = Date.now();
  tapTimes.push(now);
  tapTimes = tapTimes.filter(t => now - t < 500);
  if(tapTimes.length >= 3 && !endSequence) {
    seasonTime = 3;
    endSequence = true;
    endTime = 0;
    tapTimes = [];
  }
});

/* ------------------------------------------------------------------ utils */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const sstep=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x);};
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const mul=(c,k)=>[clamp(c[0]*k,0,255),clamp(c[1]*k,0,255),clamp(c[2]*k,0,255)];
const rgb=(c,a)=>a===undefined?`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`:`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const hash=(a,b=0)=>{const x=Math.sin(a*127.1+b*311.7)*43758.5453;return x-Math.floor(x);};
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const KF=o=>{const r={};for(const k in o)r[k]=o[k].map(hex);return r;};
const kf=(arr,s)=>{s=clamp(s,0,3.9999);const i=s|0;return mix(arr[i],arr[i+1],s-i);};
const kfn=(arr,s)=>{s=clamp(s,0,3.9999);const i=s|0;return arr[i]+(arr[i+1]-arr[i])*(s-i);};
const circle=(c,x,y,r)=>{c.beginPath();c.arc(x,y,r,0,6.2832);c.fill();};

function rand(min,max,seedOffset=0){
  const x = Math.sin(seed + seedOffset) * 10000;
  seed += 0.0001 + seedOffset*0.1;
  return min + (x - Math.floor(x)) * (max-min);
}
function easeIn(a,b,t){ return a + (b-a)*(t*t); }
function easeOut(a,b,t){ return a + (b-a)*(1 - Math.pow(1-t,2)); }

/* ------------------------------------------------------------------ track */
function addSegment(curve, y){
  const n = segments.length;
  const sprites = [];
  function stableRandom(seed, offset = 0) {
    const x = Math.sin(seed * 15731 + offset * 789221 + 1376312589) * 43758.5453;
    return x - Math.floor(x);
  }
  const r1 = stableRandom(n, 1);
  const r2 = stableRandom(n, 2);
  const r3 = stableRandom(n, 3);
  const r4 = stableRandom(n, 4);
  const r5 = stableRandom(n, 5);
  const r6 = stableRandom(n, 6);
  const r7 = stableRandom(n, 7);
  const look = (a,b)=>({flip: stableRandom(n,a)>0.5?1:-1, jit: 0.82+stableRandom(n,b)*0.36});
  const species = (k)=>{const u=stableRandom(n,30+k);return u<0.34?'round':u<0.62?'fractal':u<0.84?'birch':'bush';};

  if(r1 > 0.7) sprites.push({x: -2.5 - (r2 * 2), type:'tree', variant: Math.floor(r5 * 3), treeType: species(1), hasEyes: r7 > 0.95, ...look(11,12)});
  if(r2 > 0.7) sprites.push({x: 2.5 + (r3 * 2), type:'tree', variant: Math.floor(r6 * 3), treeType: species(2), hasEyes: r1 > 0.95, ...look(13,14)});
  if(r3 > 0.8) sprites.push({x: -5 - (r4 * 3), type:'tree', variant: Math.floor(r1 * 3), treeType: species(3), hasEyes: r3 > 0.95, ...look(15,16)});
  if(r4 > 0.8) sprites.push({x: 5 + (r1 * 3), type:'tree', variant: Math.floor(r2 * 3), treeType: species(4), hasEyes: r5 > 0.95, ...look(17,18)});

  segments.push({
    index: n,
    curve: curve || 0,
    y: y || 0,
    p1: {world: {z: n * SEG_LEN}},
    p2: {world: {z: (n + 1) * SEG_LEN}},
    sprites: sprites
  });
}

function addRoad(enter, hold, leave, curve, height){
  for(let i=0;i<enter;i++){
    const t = i/enter;
    addSegment(easeIn(0,curve,t), easeIn(0,height,t));
  }
  for(let i=0;i<hold;i++) addSegment(curve, height);
  for(let i=0;i<leave;i++){
    const t = i/leave;
    addSegment(easeOut(curve,0,t), easeOut(height,0,t));
  }
}

function buildTrack(){
  segments.length = 0;
  for(let i=0;i<20;i++) addSegment(0,0);
  const sections = 60 + Math.floor(rand(0,30,1));
  for(let s=0;s<sections;s++){
    const type = Math.floor(rand(0,4,s));
    if(type === 0){
      addRoad(15 + Math.floor(rand(8,20,s+1)), 25 + Math.floor(rand(15,50,s+2)), 15 + Math.floor(rand(8,20,s+3)), rand(-2.5,2.5,s+4), 0);
    } else if(type === 1){
      addRoad(15 + Math.floor(rand(8,20,s+1)), 25 + Math.floor(rand(15,50,s+2)), 15 + Math.floor(rand(8,20,s+3)), 0, rand(-1200,1200,s+4));
    } else if(type === 2){
      addRoad(18 + Math.floor(rand(10,25,s+1)), 30 + Math.floor(rand(20,60,s+2)), 18 + Math.floor(rand(10,25,s+3)), rand(-2.2,2.2,s+4), rand(-900,900,s+5));
    } else {
      addRoad(12 + Math.floor(rand(6,15,s+1)), 20 + Math.floor(rand(10,30,s+2)), 12 + Math.floor(rand(6,15,s+3)), rand(1.5,2.5,s+4), rand(-400,400,s+5));
      addRoad(12 + Math.floor(rand(6,15,s+6)), 20 + Math.floor(rand(10,30,s+7)), 12 + Math.floor(rand(6,15,s+8)), rand(-2.5,-1.5,s+9), rand(-400,400,s+10));
    }
  }
  for(let i=0;i<30;i++) addSegment(0,0);
  for(let i=0;i<segments.length;i++){
    segments[i].p1.world.y = segments[i].y || 0;
    segments[i].p2.world.y = (segments[i+1] ? segments[i+1].y : segments[i].y) || 0;
    if(!segments[i].sprites) segments[i].sprites = [];
  }
}
buildTrack();

function project(p, cameraX, cameraY, cameraZ){
  const dz = p.world.z - cameraZ;
  if(dz <= 0) return null;
  const sc = CAMERA_DEPTH / dz;
  return {
    x: (1 + (p.world.x - cameraX) * sc) * W/2,
    y: Math.round((1 - (p.world.y - cameraY) * sc) * H/2),
    w: sc * ROAD_W * W/2
  };
}

const roadEdge=(g,sd)=>0.07*Math.sin(g*0.31+sd*2.1)+0.045*Math.sin(g*0.87+sd*5.3)+0.02*Math.sin(g*2.3+sd);
function quad2(c,x1,y1,w1,x2,y2,w2,a1,b1,a2,b2,col){
  c.fillStyle=col;c.beginPath();
  c.moveTo(x1+w1*a1,y1+1);c.lineTo(x2+w2*a2,y2);c.lineTo(x2+w2*b2,y2);c.lineTo(x1+w1*b1,y1+1);
  c.closePath();c.fill();
}
function quad(c,x1,y1,w1,x2,y2,w2,a,b,color){
  c.fillStyle = color;
  c.beginPath();
  c.moveTo(x1+w1*a,y1+1);
  c.lineTo(x2+w2*a,y2);
  c.lineTo(x2+w2*b,y2);
  c.lineTo(x1+w1*b,y1+1);
  c.closePath();
  c.fill();
}

/* --------------------------------------------------------------- palettes */
const PAL = KF({
  skyTop :['#5fa6e6','#3f8fe0','#5b9fd6','#8d949b','#b8c5d0'],
  haze   :['#d0e4f2','#d8ecfa','#c3dbed','#cfc1a8','#e4edf2'],
  grassA :['#69a550','#4d9340','#3f7f33','#a38c4f','#e6ecf1'],
  grassB :['#58933f','#3e8234','#336f2b','#8f7942','#d5dee6'],
  foliage:['#8db85a','#3f7a2e','#2f6325','#c0601d','#e9eef2'],
  roadA  :['#6c5a47','#6a5845','#5c4b39','#54443a','#c9cfd4'],
  roadB  :['#78654f','#765f4b','#675542','#5d4c3f','#dde2e6'],
  mount  :['#6f8a86','#5f7f7a','#7a7468','#8a8f9a','#aab6c4']
});
const NIGHT_TOP=[3,5,24], NIGHT_BOT=[16,26,58], NIGHT_TINT=[8,14,36];
const AUTUMN=['#d9a521','#c8571a','#a3281c','#c98a1e'].map(hex);
const BARK=[78,64,52];

/* --------------------------------------------------------------- textures */
function makeGlow(c){
  const t=mk(64,64),g=t.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);
  r.addColorStop(0,rgb(c,1));r.addColorStop(0.25,rgb(c,0.45));r.addColorStop(1,rgb(c,0));
  g.fillStyle=r;g.fillRect(0,0,64,64);return t;
}
const GL_YEL=makeGlow([255,240,110]), GL_GRN=makeGlow([200,255,130]);

function makeMoon(){
  const S=512,c=mk(S,S),g=c.getContext('2d'),r=mulberry(7);
  const base=g.createRadialGradient(S*0.42,S*0.4,S*0.04,S/2,S/2,S/2);
  base.addColorStop(0,'#fdfaf0');base.addColorStop(0.72,'#e6e2d2');base.addColorStop(1,'#a9a595');
  g.fillStyle=base;circle(g,S/2,S/2,S/2);
  g.save();g.beginPath();g.arc(S/2,S/2,S/2,0,6.2832);g.clip();
  [[0.38,0.36,0.15],[0.58,0.3,0.1],[0.62,0.56,0.17],[0.4,0.62,0.11],[0.27,0.5,0.08]].forEach(m=>{
    const gr=g.createRadialGradient(m[0]*S,m[1]*S,0,m[0]*S,m[1]*S,m[2]*S);
    gr.addColorStop(0,'rgba(104,110,124,0.5)');gr.addColorStop(1,'rgba(104,110,124,0)');
    g.fillStyle=gr;circle(g,m[0]*S,m[1]*S,m[2]*S);
  });
  for(let i=0;i<90;i++){
    const a=r()*6.2832,d=Math.sqrt(r())*S*0.47,x=S/2+Math.cos(a)*d,y=S/2+Math.sin(a)*d,rad=2+Math.pow(r(),2.5)*20;
    const gr=g.createRadialGradient(x,y,0,x,y,rad);gr.addColorStop(0,'rgba(90,92,104,0.3)');gr.addColorStop(1,'rgba(90,92,104,0)');
    g.fillStyle=gr;circle(g,x,y,rad);
    g.lineWidth=1.2;g.strokeStyle='rgba(255,255,255,0.22)';g.beginPath();g.arc(x-0.8,y-0.8,rad*0.8,0,6.2832);g.stroke();
    g.strokeStyle='rgba(60,62,72,0.2)';g.beginPath();g.arc(x+0.8,y+0.8,rad*0.8,0.4,3.5);g.stroke();
  }
  g.restore();
  return c;
}
const MOON=makeMoon();

function makeCloud(k,tone,shade,hl){
  const c=mk(520,260),g=c.getContext('2d'),r=mulberry(k*31+5),puffs=[];
  for(let i=0;i<30;i++){
    const x=70+r()*380,hump=Math.pow(Math.max(0,Math.sin(Math.PI*(x-50)/420)),0.7)*84,rad=24+r()*30+hump*0.28;
    puffs.push({x,y:215-r()*hump*0.9-rad*0.3,r:rad});
  }
  const blob=(x,y,rad,col,a)=>{const gr=g.createRadialGradient(x,y,0,x,y,rad);gr.addColorStop(0,rgb(col,a));gr.addColorStop(0.55,rgb(col,a*0.55));gr.addColorStop(1,rgb(col,0));g.fillStyle=gr;g.beginPath();g.arc(x,y,rad,0,6.2832);g.fill();};
  for(const p of puffs)blob(p.x,p.y+p.r*0.28,p.r,shade,0.55);
  for(const p of puffs)blob(p.x,p.y,p.r*0.92,tone,0.8);
  for(const p of puffs)blob(p.x-p.r*0.22,p.y-p.r*0.32,p.r*0.6,hl,0.55);
  g.globalCompositeOperation='destination-out';
  const fg=g.createLinearGradient(0,212,0,248);fg.addColorStop(0,'rgba(0,0,0,0)');fg.addColorStop(1,'rgba(0,0,0,1)');
  g.fillStyle=fg;g.fillRect(0,212,520,48);
  return c;
}
const CLOUD_W=[0,1,2,3].map(k=>makeCloud(k,[250,251,255],[170,186,210],[255,255,255]));
const CLOUD_G=[0,1,2,3].map(k=>makeCloud(k,[186,192,202],[104,112,128],[226,230,238]));
const CLOUDS=Array.from({length:9},(_,i)=>({u:hash(i,1),y:0.04+hash(i,2)*0.26,s:0.7+hash(i,3)*0.9,v:4+hash(i,4)*9,a:0.65+hash(i,5)*0.35,k:i%4}));

const STARS=(()=>{const r=mulberry(1234),a=[];
  for(let i=0;i<340;i++){let x=r(),y=r()*0.5;
    if(i>=230){const t=r();x=t;y=0.1+t*0.32+(r()+r()+r()-1.5)*0.07;}
    a.push({x,y:clamp(y,0,0.5),m:Math.pow(r(),2.2),ph:r()*6.28,h:r()});}
  return a;})();

function makeGrain(){const c=mk(160,160),g=c.getContext('2d'),d=g.createImageData(160,160);
  for(let i=0;i<d.data.length;i+=4){const v=128+(Math.random()-0.5)*170;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}
  g.putImageData(d,0,0);return c;}
const grainPat=ctx.createPattern(makeGrain(),'repeat');
function makeGroundTex(kind){
  const S=512,c=mk(S,S),g=c.getContext('2d'),r=mulberry(kind==='grass'?11:23);
  const wrap=(x,y,fn)=>{fn(x,y);const wx=x>S-70,wy=y>S-70;if(wx)fn(x-S,y);if(wy)fn(x,y-S);if(wx&&wy)fn(x-S,y-S);};
  if(kind==='grass'){
    for(let i=0;i<46;i++){
      const x=r()*S,y=r()*S,rad=20+r()*60,dk=r()<0.55,col=dk?'20,50,12':'255,250,170';
      wrap(x,y,(px,py)=>{const gr=g.createRadialGradient(px,py,0,px,py,rad);gr.addColorStop(0,`rgba(${col},${dk?0.1:0.07})`);gr.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gr;g.fillRect(px-rad,py-rad,rad*2,rad*2);});
    }
    g.lineCap='round';
    for(let i=0;i<5500;i++){
      const x=r()*S,y=r()*S,len=2+r()*6,ang=-Math.PI/2+(r()-0.5)*1.2,dk=r()<0.5;
      g.strokeStyle=dk?`rgba(12,34,10,${0.12+r()*0.2})`:`rgba(${200+r()*50|0},${230+r()*25|0},120,${0.1+r()*0.2})`;
      g.lineWidth=0.7+r()*0.8;
      wrap(x,y,(px,py)=>{g.beginPath();g.moveTo(px,py);g.lineTo(px+Math.cos(ang)*len,py+Math.sin(ang)*len);g.stroke();});
    }
  }else{
    for(let i=0;i<3600;i++){
      const x=r()*S,y=r()*S,rad=0.5+r()*1.1,dk=r()<0.55;
      g.fillStyle=dk?`rgba(40,28,18,${0.14+r()*0.22})`:`rgba(215,195,165,${0.1+r()*0.18})`;
      wrap(x,y,(px,py)=>circle(g,px,py,rad));
    }
    for(let i=0;i<110;i++){
      const x=r()*S,y=r()*S,rx=1.4+r()*3.2;
      wrap(x,y,(px,py)=>{
        g.fillStyle='rgba(30,22,16,0.3)';g.beginPath();g.ellipse(px+0.8,py+1,rx,rx*0.7,0,0,6.2832);g.fill();
        g.fillStyle='rgba(150,136,120,0.6)';g.beginPath();g.ellipse(px,py,rx,rx*0.7,0,0,6.2832);g.fill();
        g.fillStyle='rgba(232,222,204,0.5)';g.beginPath();g.ellipse(px-0.5,py-0.5,rx*0.5,rx*0.3,0,0,6.2832);g.fill();
      });
    }
  }
  return c;
}
const GRASS_TEX=makeGroundTex('grass'),ROAD_TEX=makeGroundTex('road');

/* ------------------------------------------------------------------ trees */
const SPR_S=1.5, SPR_W=460, SPR_H=520, SPR_OX=230, SPR_OY=470;
const FOG_LV=[0,0.3,0.55,0.8];
const sprCache={};

function treeStyle(s){
  const winter=clamp(s-3,0,1);
  return {s, winter, aut:clamp(s-2,0,1), green:kf(PAL.foliage,Math.min(s,2)),
          snow:sstep(0.05,0.7,winter), leaf:1-sstep(0,0.4,winter), bloom:s<1?1-sstep(0.45,1,s):0};
}
function leafColor(st,r1,r2){
  let c=st.green;
  if(st.s>=2){const pal=st.pal||AUTUMN,t=clamp((st.aut-r1*0.7)/0.3,0,1);if(t>0)c=mix(c,pal[(r2*pal.length)|0],t);}
  if(st.s>=3) c=mix(c,[96,80,64],clamp(st.winter*1.6,0,0.85));
  return c;
}
const mkBlob=(rnd,x,y,r)=>({x,y,r,s:(rnd()*1e9)|0,d:rnd(),c1:rnd(),c2:rnd()});

function limb(c,x0,y0,x1,y1,w0,w1,bark,st,detail){
  const dx=x1-x0,dy=y1-y0,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;
  const g=c.createLinearGradient(x0-nx*w0/2,y0-ny*w0/2,x0+nx*w0/2,y0+ny*w0/2);
  g.addColorStop(0,rgb(mul(bark,1.35)));g.addColorStop(0.45,rgb(bark));g.addColorStop(1,rgb(mul(bark,0.5)));
  c.fillStyle=g;
  c.beginPath();
  c.moveTo(x0-nx*w0/2,y0-ny*w0/2);c.lineTo(x1-nx*w1/2,y1-ny*w1/2);
  c.lineTo(x1+nx*w1/2,y1+ny*w1/2);c.lineTo(x0+nx*w0/2,y0+ny*w0/2);
  c.closePath();c.fill();
  circle(c,x1,y1,w1/2);
  if(detail){
    c.strokeStyle=rgb(mul(bark,0.38),0.55);c.lineWidth=0.9;c.lineCap='round';
    const n=Math.max(3,(w0/2.2)|0);
    for(let i=0;i<n;i++){
      const a=0.85*((i+0.5)/n-0.5);
      c.beginPath();
      c.moveTo(x0+nx*w0*a,y0+ny*w0*a);
      c.quadraticCurveTo((x0+x1)/2+nx*(w0+w1)/2*a+Math.sin(i*3.1)*1.2,(y0+y1)/2+ny*(w0+w1)/2*a,x1+nx*w1*a,y1+ny*w1*a);
      c.stroke();
    }
  }
  if(st.snow>0.02 && Math.abs(dy)<len*0.85){

function trunkBase(c,w,bark){
  c.fillStyle=rgb(mul(bark,0.8));
  c.beginPath();c.moveTo(-w*0.5,-6);c.quadraticCurveTo(-w*0.6,-1,-w*1.15,2);c.lineTo(w*1.15,2);c.quadraticCurveTo(w*0.6,-1,w*0.5,-6);c.closePath();c.fill();
}
function leafBlob(c,b,r,col){
  const rnd=mulberry(b.s);
  for(let i=0;i<6;i++){
    const a=rnd()*6.2832,d=rnd()*r*0.45;
    c.fillStyle=rgb(mul(col,0.42+rnd()*0.1));circle(c,b.x+Math.cos(a)*d+r*0.05,b.y+Math.sin(a)*d+r*0.12,r*(0.5+rnd()*0.2));
  }
  const n=34+((b.r*1.6)|0);
  for(let i=0;i<n;i++){
    const a=rnd()*6.2832,d=Math.pow(rnd(),0.6)*r*1.02,jit=rnd()-0.5,rot=rnd()*3.1416,ls=0.09+rnd()*0.07;
    const px=b.x+Math.cos(a)*d,py=b.y+Math.sin(a)*d;
    const lit=clamp(0.62+(-(px-b.x)*0.3-(py-b.y)*0.55)/r*0.65+jit*0.34,0.38,1.55);
    c.fillStyle=rgb(mul(col,lit));c.beginPath();c.ellipse(px,py,r*ls,r*ls*0.55,rot,0,6.2832);c.fill();
  }
  for(let i=0;i<5;i++){const a=rnd()*6.2832,d=rnd()*r*0.6;c.fillStyle=rgb(mul(col,0.3),0.55);circle(c,b.x+Math.cos(a)*d+r*0.1,b.y+Math.sin(a)*d+r*0.15,0.8+rnd()*1.1);}
}
function paintLeaves(c,blobs,cy,ry,st){
  blobs.sort((a,b)=>a.y-b.y);
  for(const b of blobs){
    if(st.leaf<=0.02||(st.leaf<1 && b.d>st.leaf)) continue;
    const r=b.r*(0.45+0.55*st.leaf);
    const t=clamp((b.y-(cy-ry))/(2*ry+1),0,1);
    const col=mul(leafColor(st,b.c1,b.c2),1.12-0.42*t);
    leafBlob(c,b,r,col);
    if(st.snow>0.02){c.fillStyle=`rgba(245,249,252,${st.snow*0.85})`;c.beginPath();c.ellipse(b.x-r*0.1,b.y-r*0.62,r*0.62,r*0.28,0,0,6.2832);c.fill();}
    if(st.bloom>0.02){
      const rn=mulberry(b.s+7);
      for(let j=0;j<7;j++){
        const u=rn(),ox=rn(),oy=rn(),cc=rn(),sz=rn();
        if(u<st.bloom){c.fillStyle=cc>0.45?'rgba(255,246,248,0.95)':'rgba(246,186,206,0.95)';circle(c,b.x+(ox-0.5)*r*1.7,b.y+(oy-0.5)*r*1.7,1.4+sz*1.3);}

    }
  }
}
function roundTree(c,rnd,v,st){
  const tw=10+v*1.8+rnd()*3,th=62+rnd()*34+v*8,lean=(rnd()-0.5)*16;
  trunkBase(c,tw,BARK);
  limb(c,0,0,lean,-th,tw,tw*0.62,BARK,st,true);
  const cx=lean,cy=-th-34-rnd()*10,rx=64+rnd()*22+v*6,ry=50+rnd()*16+v*4;
  const nb=3+v;
  for(let i=0;i<nb;i++){
    const a=(-90+(i/(nb-1)-0.5)*100+(rnd()-0.5)*14)*Math.PI/180,L=ry*(0.9+rnd()*0.5),sy=-th+8+rnd()*10;
    limb(c,lean,sy,lean+Math.cos(a)*L*1.15,sy+Math.sin(a)*L,tw*0.45,tw*0.18,BARK,st,false);
  }
  const blobs=[],N=22+v*4;
  for(let i=0;i<N;i++){const a=rnd()*6.2832,d=Math.sqrt(rnd());blobs.push(mkBlob(rnd,cx+Math.cos(a)*d*rx,cy+Math.sin(a)*d*ry,19+rnd()*14));}
  paintLeaves(c,blobs,cy,ry,st);
}
function fractalTree(c,rnd,v,st){
  const depth=[4,5,5][v],L0=[46,50,56][v],spread=[24,27,31][v],blobs=[];
  trunkBase(c,12+v,BARK);
  (function rec(x,y,ang,len,w,d){
    const rad=ang*Math.PI/180,x2=x+Math.cos(rad)*len,y2=y+Math.sin(rad)*len;
    limb(c,x,y,x2,y2,w,w*0.74,BARK,st,w>5);
    if(d<=1){blobs.push(mkBlob(rnd,x2,y2,15+rnd()*9));return;}
    const k=0.72+rnd()*0.07;
    rec(x2,y2,ang-spread+(rnd()-0.5)*14,len*k,w*0.74,d-1);
    rec(x2,y2,ang+spread+(rnd()-0.5)*14,len*k,w*0.74,d-1);
    if(d>2)rec(x2,y2,ang+(rnd()-0.5)*16,len*k*0.92,w*0.7,d-1);
    if(d<=3)blobs.push(mkBlob(rnd,x2,y2,10+rnd()*7));
  })(0,0,-90+(rnd()-0.5)*6,L0*1.35,11+v,depth);
  paintLeaves(c,blobs,-130,130,st);
}
const BIRCH_BARK=[226,222,210],BIRCH_AUT=['#e8c53a','#d9a521','#c9b13a','#e0b030'].map(hex);
function birchTree(c,rnd,v,st){
  const h=105+v*20+rnd()*20,lean=(rnd()-0.5)*14,tw=6+v;
  trunkBase(c,tw*0.8,mul(BIRCH_BARK,0.55));
  limb(c,0,0,lean,-h,tw,tw*0.5,BIRCH_BARK,st,false);
  c.fillStyle='rgba(32,28,26,0.85)';
  for(let i=0;i<12;i++){const t=0.05+rnd()*0.9,x=lean*t,y=-h*t,ww=tw*(1-t*0.5)*(0.3+rnd()*0.5);c.beginPath();c.ellipse(x+(rnd()-0.5)*tw*0.3,y,ww*0.5,0.6+rnd()*0.9,0,0,6.2832);c.fill();}
  const nb=3+v;
  for(let i=0;i<nb;i++){const a=(-90+(rnd()-0.5)*90)*Math.PI/180,sy=-h*(0.5+rnd()*0.4),L=25+rnd()*20;
    limb(c,lean*(-sy/h),sy,lean*(-sy/h)+Math.cos(a)*L,sy+Math.sin(a)*L,tw*0.35,tw*0.12,mul(BIRCH_BARK,0.8),st,false);}
  const cx=lean,cy=-h-8,rx=30+v*6,ry=52+v*6,blobs=[];
  for(let i=0;i<26+v*4;i++){const a=rnd()*6.2832,d=Math.sqrt(rnd());blobs.push(mkBlob(rnd,cx+Math.cos(a)*d*rx,cy+Math.sin(a)*d*ry,9+rnd()*7));}

}
function bushTree(c,rnd,v,st){
  const rx=30+v*8,blobs=[];
  for(let i=0;i<7;i++){const a=(-90+(rnd()-0.5)*140)*Math.PI/180,L=18+rnd()*18;limb(c,(rnd()-0.5)*8,0,Math.cos(a)*L*1.4,Math.sin(a)*L,3,1,BARK,st,false);}
  for(let i=0;i<13+v*3;i++){const a=rnd()*6.2832,d=Math.sqrt(rnd());blobs.push(mkBlob(rnd,Math.cos(a)*d*rx,-22+Math.sin(a)*d*16,11+rnd()*8));}

function buildTree(e,type,variant,season,haze){
  const c=e.lv[0].getContext('2d');
  c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,SPR_W,SPR_H);
  c.setTransform(SPR_S,0,0,SPR_S,SPR_OX,SPR_OY);
  const st=treeStyle(season),rnd=mulberry(variant*977+({fractal:13,round:71,birch:47,bush:83})[type]);
  c.save();c.translate(0,3);c.scale(1,0.22);
  const g=c.createRadialGradient(0,0,0,0,0,80);g.addColorStop(0,'rgba(0,0,0,0.42)');g.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=g;circle(c,0,0,80);c.restore();
  ({fractal:fractalTree,round:roundTree,birch:birchTree,bush:bushTree})[type](c,rnd,variant,st);
  for(let k=1;k<4;k++){
    const t=e.lv[k].getContext('2d');
    t.setTransform(1,0,0,1,0,0);t.globalCompositeOperation='source-over';t.clearRect(0,0,SPR_W,SPR_H);
    t.drawImage(e.lv[0],0,0);
    t.globalCompositeOperation='source-atop';t.fillStyle=rgb(haze,FOG_LV[k]);t.fillRect(0,0,SPR_W,SPR_H);
    t.globalCompositeOperation='source-over';
  }
}
function getSprite(type,variant,season,bucket,haze,budget){
  const key=type+variant;
  let e=sprCache[key];
  if(!e)e=sprCache[key]={bucket:-1,lv:[0,1,2,3].map(()=>mk(SPR_W,SPR_H))};
  if(e.bucket!==bucket&&(e.bucket<0||budget.n<2)){budget.n++;buildTree(e,type,variant,season,haze);e.bucket=bucket;}
  return e;
}

/* -------------------------------------------------------------- particles */
let snow=[],leaves=[],petals=[],flies=[],motes=[],canopyPts=[];
function spawnPetal(p){
  const c=canopyPts.length?canopyPts[(Math.random()*canopyPts.length)|0]:null;
  if(!c){p.x=-50;p.y=-50;p.gy=-60;p.z=0.5;return;}
  p.x=c.x+(Math.random()-0.5)*110*c.sc;p.y=c.y-(90+Math.random()*80)*c.sc;p.gy=c.y;p.z=clamp(c.sc*0.7,0.3,1);
}
function initParticles(){
  const R=Math.random;
  snow=Array.from({length:230},()=>({x:R()*W,y:R()*H,z:0.25+R()*0.75,ph:R()*6.28}));
  leaves=Array.from({length:40},()=>({x:-50,y:-50,gy:-60,z:0.5,ph:R()*6.28,rot:R()*6.28,c:AUTUMN[(R()*4)|0]}));
  petals=Array.from({length:60},()=>({x:-50,y:-50,gy:-60,z:0.5,ph:R()*6.28,rot:R()*6.28}));
  flies=Array.from({length:26},()=>({x:R()*W,y:H*(0.45+R()*0.45),ph:R()*6.28,sp:0.3+R()*0.7}));
  motes=Array.from({length:50},()=>({x:R()*W,y:R()*H*0.9,z:0.3+R()*0.7,ph:R()*6.28}));
}
function updateParticles(dt){
  const wind=18+10*Math.sin(time*0.4);
  for(const p of snow){p.y+=(28+70*p.z)*dt;p.x+=(wind*0.5*p.z+Math.sin(time*0.8+p.ph)*14*p.z)*dt;
    if(p.y>H+4){p.y=-4;p.x=Math.random()*W;}if(p.x>W+4)p.x=-4;if(p.x<-4)p.x=W+4;}
  for(const p of leaves){p.y+=(30+25*p.z)*dt;p.x+=(wind*0.5+Math.sin(time*1.3+p.ph)*22)*dt;p.rot+=dt*(1.5+p.z);
    if(p.y>p.gy||p.x>W+20||p.x<-20)spawnPetal(p);}
  for(const p of petals){p.y+=(14+14*p.z)*dt;p.x+=(wind*0.4+Math.sin(time*1.1+p.ph)*16)*dt;p.rot+=dt*(1+p.z);
    if(p.y>p.gy||p.x>W+20||p.x<-20)spawnPetal(p);}
  for(const p of flies){p.x+=Math.sin(time*0.5*p.sp+p.ph)*16*dt;p.y+=Math.cos(time*0.43*p.sp+p.ph*1.7)*10*dt;
    p.x=(p.x+W)%W;p.y=clamp(p.y,H*0.4,H*0.95);}
  for(const p of motes){p.x+=(6+Math.sin(time*0.3+p.ph)*5)*dt*p.z;p.y+=Math.cos(time*0.25+p.ph)*4*dt;
    if(p.x>W+4)p.x=-4;if(p.y<0)p.y=H*0.9;if(p.y>H)p.y=0;}
}
function drawParticles(S){
  if(endSequence)return;
  const {s,dark}=S;
  const sn=sstep(3.3,3.9,s);
  if(sn>0.01){
    const n=(sn*snow.length)|0;
    for(let i=0;i<n;i++){const p=snow[i],a=(0.35+0.55*p.z)*(1-0.6*dark),r=0.8+2.4*p.z;
      if(p.z>0.85){ctx.fillStyle=`rgba(235,242,255,${a*0.25})`;circle(ctx,p.x,p.y,r*2.2);}
      ctx.fillStyle=`rgba(245,249,255,${a})`;circle(ctx,p.x,p.y,r);}
  }
  const lf=sstep(2.25,2.8,s)*(1-sstep(3,3.3,s));
  if(lf>0.01){
    const n=(lf*leaves.length)|0;
    for(let i=0;i<n;i++){const p=leaves[i];
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.scale(1,0.55+0.45*Math.abs(Math.sin(p.rot*0.7)));
      ctx.fillStyle=rgb(mul(p.c,1-0.55*dark));ctx.beginPath();ctx.ellipse(0,0,3.4*p.z+1.4,1.9*p.z+0.9,0,0,6.2832);ctx.fill();ctx.restore();}
  }
  const pt=sstep(0.25,0.55,s)*(1-sstep(0.95,1.05,s));
  if(pt>0.01){
    const n=(pt*petals.length)|0;
    for(let i=0;i<n;i++){const p=petals[i];
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.scale(1,0.5+0.5*Math.abs(Math.sin(p.rot)));
      {const k=1-0.7*dark;ctx.fillStyle=`rgba(${(k*(i%3?255:246))|0},${(k*(i%3?240:196))|0},${(k*(i%3?244:214))|0},${0.85*(1-0.9*dark)})`;}
      ctx.beginPath();ctx.ellipse(0,0,3.6*p.z+1.2,2.1*p.z+0.8,0,0,6.2832);ctx.fill();ctx.restore();}
  }
  const ff=sstep(0.4,0.85,dark)*sstep(0.7,1.1,s)*(1-sstep(2.0,2.4,s));
  if(ff>0.02){
    ctx.save();ctx.globalCompositeOperation='lighter';
    for(const p of flies){const f=0.5+0.5*Math.sin(time*2.2*p.sp+p.ph*3),a=ff*f*f;
      if(a<0.03)continue;ctx.globalAlpha=a;ctx.drawImage(GL_GRN,p.x-5,p.y-5,10,10);}
    ctx.restore();
  }
  const md=(1-dark)*(1-sstep(2.9,3.4,s));
  if(md>0.02){
    ctx.save();ctx.globalCompositeOperation='lighter';
    for(const p of motes){ctx.fillStyle=`rgba(255,246,214,${0.22*md*(0.4+0.6*Math.sin(time*0.9+p.ph)**2)})`;circle(ctx,p.x,p.y,0.6+p.z*0.9);}
    ctx.restore();
  }
}

/* ------------------------------------------------------------------- sky */
function drawStars(S,hy){
  const vis=sstep(0.4,0.85,S.dark);
  if(vis<0.01)return;
  ctx.save();ctx.globalCompositeOperation='screen';
  ctx.translate(W*0.5,H*0.2);ctx.rotate(0.38);
  const mw=ctx.createLinearGradient(0,-H*0.12,0,H*0.12);
  mw.addColorStop(0,'rgba(170,190,255,0)');mw.addColorStop(0.5,`rgba(170,190,255,${0.11*vis})`);mw.addColorStop(1,'rgba(170,190,255,0)');
  ctx.fillStyle=mw;ctx.fillRect(-W,-H*0.12,W*2,H*0.24);
  ctx.restore();
  for(const st of STARS){
    const px=((st.x*W-bgX*0.04)%W+W)%W,py=st.y*H;
    const tw=0.72+0.28*Math.sin(time*(1.5+st.h*3)+st.ph);
    const a=vis*(0.25+0.75*st.m)*tw*(1-Math.pow(py/hy,3)*0.85);
    if(a<0.02)continue;
    ctx.fillStyle=st.h<0.2?`rgba(190,210,255,${a})`:st.h>0.85?`rgba(255,226,190,${a})`:`rgba(255,255,255,${a})`;
    const sz=0.5+st.m*1.5;
    if(sz>1.2)circle(ctx,px,py,sz*0.6);else ctx.fillRect(px,py,sz,sz);
  }
  const cyc=Math.floor(time/11),lt=time-cyc*11;
  if(vis>0.5&&hash(cyc,3)>0.45&&lt<0.9){
    const k=lt/0.9,x0=W*(0.15+hash(cyc,4)*0.6),y0=H*(0.04+hash(cyc,5)*0.16),dx=W*0.22*k,dy=H*0.07*k;
    const g=ctx.createLinearGradient(x0+dx,y0+dy,x0+dx-W*0.1,y0+dy-H*0.032);
    g.addColorStop(0,`rgba(255,255,255,${0.9*(1-k)})`);g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.strokeStyle=g;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(x0+dx,y0+dy);ctx.lineTo(x0+dx-W*0.1,y0+dy-H*0.032);ctx.stroke();
  }
}
function ridge(hy,amp,freq,phase,sp,col,snow,hz){
  ctx.beginPath();ctx.moveTo(-6,hy+2);
  for(let x=-6;x<=W+6;x+=6){
    const u=(x+bgX*sp)*freq+phase;
    const r=0.5*(1-Math.abs(Math.sin(u)))+0.3*(1-Math.abs(Math.sin(u*2.3+1.7)))+0.2*(1-Math.abs(Math.sin(u*5.1+0.6)));
    ctx.lineTo(x,hy-amp*(0.16+0.84*Math.pow(r,1.3)));
  }
  ctx.lineTo(W+6,hy+2);ctx.closePath();
  ctx.fillStyle=rgb(col);ctx.fill();
  const sg=ctx.createLinearGradient(0,hy-amp,0,hy-amp*0.5);
  sg.addColorStop(0,rgb(mix(col,[250,252,255],0.9),snow));sg.addColorStop(1,rgb([250,252,255],0));
  ctx.fillStyle=sg;ctx.fill();
  const hg=ctx.createLinearGradient(0,hy-amp,0,hy);
  hg.addColorStop(0,rgb(hz,0));hg.addColorStop(1,rgb(hz,0.8));
  ctx.fillStyle=hg;ctx.fill();
}
function drawBirds(S){
  const cyc=Math.floor(time/15),bs=Math.sin(cyc*789.123)*10000,r=bs-Math.floor(bs);
  if(r<=0.6)return;
  const nb=r>0.8?2:1;
  for(let i=0;i<nb;i++){
    const s2=Math.sin((cyc+i)*123.456)*10000;
    const lt=(time%15)/15;
    const bx=lt*W*1.4-W*0.2+i*40*scale;
    const by=H*0.12+(s2-Math.floor(s2))*H*0.15;
    const fy=Math.sin(time*0.5+i)*5*scale;
    const up=Math.sin(time*7+i*2)*5*scale,sp=11*scale,b=1-S.dark*0.6;
    ctx.strokeStyle=`rgba(${(50*b)|0},${(50*b)|0},${(55*b)|0},0.6)`;
    ctx.lineWidth=1.6*scale;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(bx-sp,by+fy+up*0.6);
    ctx.quadraticCurveTo(bx-sp*0.5,by+fy-Math.abs(up)*0.3-2*scale,bx,by+fy);
    ctx.quadraticCurveTo(bx+sp*0.5,by+fy-Math.abs(up)*0.3-2*scale,bx+sp,by+fy+up*0.6);
    ctx.stroke();
  }
}
function drawSky(S){
  const {P,dark,dusk,nf,s}=S,hy=H*0.5;

  else{
    const top=mix(mix(P.skyTop,[120,96,150],dusk*0.25),NIGHT_TOP,dark);

    ctx.fillStyle=rgb(mix(P.gA,NIGHT_BOT,dark*0.9));ctx.fillRect(0,hy,W,H-hy);

  }

function drawTreeline(S){

  [{h:46,f:0.034,fog:0.8,sp:0.18,o:0.7},{h:34,f:0.052,fog:0.62,sp:0.34,o:3.1},{h:22,f:0.083,fog:0.44,sp:0.6,o:5.4}].forEach(l=>{
    w.fillStyle=rgb(mix(tl,P.hazeF,l.fog));
    w.beginPath();w.moveTo(-6,hy+3);

}
const FLOWERS=[[255,255,250],[250,224,90],[240,160,200],[170,150,230]];

function drawTerrain(S){
  const {P,s,winter}=S,w=wctx,hy=H*0.5;

  w.clearRect(0,0,W,H);
  drawTreeline(S);

  const bi=Math.floor(playerZ/SEG_LEN);

  for(let n=0;n<DRAW_DISTANCE;n++){

      if(pr)sprites.push({x:pr.x,y:pr.y,z:z1,scale:pr.w/100,sp,clip:maxY});
    }

    const y1=p1.y,y2=p2.y,w1=p1.w,w2=p2.w,fk=0.45*Math.pow(t,1.5);
    const even=Math.floor(segIndex/3)%2===0;
    const gF=mix(mul(mix(P.gA,P.gB,0.5+0.5*Math.sin(gi*0.07)),0.985+0.02*Math.sin(gi*0.29)),P.hazeF,fk);
    w.fillStyle=rgb(gF);w.fillRect(0,y2,W,y1-y2);farCol=gF;

    const cxm=(p1.x+p2.x)/2,wav=(w1+w2)/2;
    if(n<170){

        w.globalAlpha=1;
      }
    }

    const rBase=mix(P.roadA,P.roadB,0.5+0.5*Math.sin(gi*0.05));
    const rF=mix(mul(rBase,0.98+0.03*Math.sin(gi*0.23)),P.hazeF,fk*0.65);
    const eL1=roadEdge(gi,-1),eR1=roadEdge(gi,1),eL2=roadEdge(gi+1,-1),eR2=roadEdge(gi+1,1);
    const Q=(base,col)=>quad2(w,p1.x,y1,w1,p2.x,y2,w2,-(base+eL1),base+eR1,-(base+eL2),base+eR2,col);
    Q(1.24,rgb(mix(rF,gF,0.82)));
    Q(1.16,rgb(mix(rF,gF,0.62)));
    Q(1.08,rgb(mix(rF,gF,0.38)));
    Q(1.0,rgb(mix(rF,gF,0.16)));
    Q(0.93,rgb(rF));

    if(n<130){
    }
    if(n<130){
      const ra=(1-fk)*0.9*(1-0.5*winter);
      if(wav>=4){
        w.globalAlpha=ra;w.drawImage(ROAD_TEX,0,(gi*128)%512,512,128,cxm-wav,y2,2*wav,y1-y2);w.globalAlpha=1;
      }
    }
    if(wet>0.05&&n<130&&segIndex%19===7){
      const side=hash(segIndex,9)>0.5?1:-1,px=(p1.x+p2.x)/2+side*(w1+w2)/2*0.38;
      w.fillStyle=rgb(mix(P.haze,rutT,0.25),0.55*wet);
      w.beginPath();w.ellipse(px,(y1+y2)/2,(w1+w2)/2*0.2,Math.max(0.8,(y1-y2)*0.42),0,0,6.2832);w.fill();
    }
    if(n<100){
      const nb=n<40?9:5,bladeCol=bladeBase?mix(mul(gF,0.6),bladeBase,winter*0.85):mul(gF,0.58);
      w.strokeStyle=rgb(bladeCol);w.lineWidth=Math.max(0.6,w1*0.006);w.lineCap='round';
      w.beginPath();
      const dots=[];
      for(let i=0;i<nb;i++){
        const side=(i&1)?1:-1,lat=1.02+hash(segIndex,i+11)*4.6,f=hash(segIndex,i+31);
        const yy=y1-(y1-y2)*f,xc=p1.x+(p2.x-p1.x)*f,wc=w1+(w2-w1)*f,px=xc+side*wc*lat;
        if(px<-40||px>W+40)continue;
        const bh=Math.min(28,wc*(0.05+hash(segIndex,i+21)*0.05)),sw=Math.sin(time*2+segIndex*0.7+i)*bh*0.12;
        w.moveTo(px-bh*0.12,yy);w.lineTo(px-bh*0.25+sw,yy-bh);
        w.moveTo(px,yy);w.lineTo(px+sw*1.4,yy-bh*1.15);
        w.moveTo(px+bh*0.12,yy);w.lineTo(px+bh*0.3+sw,yy-bh*0.9);
        if(s<2&&hash(segIndex,i+81)>0.55)dots.push([px+bh*0.2+sw*1.4,yy-bh*1.2,wc*0.012,(hash(segIndex,i+91)*4)|0]);
      }
      w.stroke();
      for(const d of dots){w.fillStyle=rgb(FLOWERS[d[3]]);circle(w,d[0],d[1],Math.max(0.9,d[2]));}
    }
    maxY=y2;
  }

  w.globalCompositeOperation='destination-over';w.fillStyle=rgb(farCol);w.fillRect(0,hy-1,W,H-hy+1);w.globalCompositeOperation='source-over';
  w.save();w.globalCompositeOperation='source-atop';
  const hg=w.createLinearGradient(0,hy-H*0.06,0,hy+H*0.06);
  hg.addColorStop(0,rgb(P.hazeF,0));hg.addColorStop(0.3,rgb(P.hazeF,0.3));hg.addColorStop(1,rgb(P.hazeF,0));
  w.fillStyle=hg;w.fillRect(0,hy-H*0.06,W,H*0.2);
  w.restore();

  sprites.sort((a,b)=>b.z-a.z);
  const budget={n:0},bucket=Math.floor(Math.min(s,3.9999)*40),maxD=DRAW_DISTANCE*SEG_LEN;
  for(const q of sprites){
    const sp=q.sp,t=Math.min(1,(q.z-camZ)/maxD);
    const op=t>0.82?1-sstep(0.82,1,t):1;
    if(op<=0.01)continue;
    const sc=q.scale*sp.jit/SPR_S;
    if(sc*SPR_H<3)continue;
    if(q.x+(SPR_W-SPR_OX)*sc<0||q.x-SPR_OX*sc>W||q.y-SPR_OY*sc>H)continue;
    const e=getSprite(sp.treeType,sp.variant,s,bucket,P.hazeF,budget);
    const fv=Math.min(0.8,Math.min(0.85,0.95*Math.pow(t,2.2)));
    let i=0;while(i<2&&fv>FOG_LV[i+1])i++;
    const f=(fv-FOG_LV[i])/(FOG_LV[i+1]-FOG_LV[i]);
    w.save();
    if(q.y>q.clip+1){w.beginPath();w.rect(0,0,W,q.clip);w.clip();}
    w.translate(q.x,q.y);w.scale(sp.flip*sc,sc);
    w.globalAlpha=op;w.drawImage(e.lv[i],-SPR_OX,-SPR_OY);
    if(f>0.02){w.globalAlpha=op*f;w.drawImage(e.lv[i+1],-SPR_OX,-SPR_OY);}
    w.restore();
    if(sc*SPR_H>60&&q.x>-100&&q.x<W+100)cp.push({x:q.x,y:q.y,sc:q.scale*sp.jit});
    if(sp.hasEyes&&sp.treeType!=='bush')S.eyes.push({x:q.x,y:q.y,sc:q.scale*sp.jit,op});
  }

  canopyPts=cp;
  w.save();w.globalCompositeOperation='source-atop';
  if(S.dusk>0.01){w.fillStyle=`rgba(255,128,56,${S.dusk*0.16})`;w.fillRect(0,0,W,H);}
  if(S.dark>0.002){w.fillStyle=rgb(NIGHT_TINT,S.dark*0.9);w.fillRect(0,0,W,H);}
  w.restore();
}

function drawEyes(S){
  const nf=S.nf;
  if(nf<=0.5||!S.eyes.length)return;
  const I=(nf-0.5)*2;
  for(const e of S.eyes){
    const ex=e.x,ey=e.y-62*e.sc,sp=9*e.sc,a=I*e.op*sstep(0.5,1.2,e.sc);

/* ------------------------------------------------------------- character */
const charLayer=mk(),cLctx=charLayer.getContext('2d'),shSmall=mk(),shctx=shSmall.getContext('2d');
function drawCastShadows(S){
  if(endSequence)return;
  const {dark,nf}=S,k=isMobile?0.9:1.8;
  const lanI=nf>0.6?sstep(0.6,0.75,nf):0,flick=0.9+0.07*Math.sin(time*21)+0.05*Math.sin(time*34+1);
  const side=dayTime<1?-1:1;

    {sx:side*(0.35+1.2*nf),sy:0.2+0.12*nf,a:0.42*(1-dark)},
    {sx:0.95+0.28*Math.sin(time*5+0.8),sy:-0.14,a:0.42*lanI*flick},

  cLctx.setTransform(DPR,0,0,DPR,0,0);cLctx.globalCompositeOperation='source-over';cLctx.globalAlpha=1;
  cLctx.clearRect(bx,by,bw,bh);

  cLctx.globalCompositeOperation='source-over';

  shctx.drawImage(charLayer,bx*DPR,by*DPR,bw*DPR,bh*DPR,0,0,sw,shh);

    ctx.drawImage(shSmall,bx-fx,by-fy,bw,bh);ctx.restore();
  }
}
const MAIN_CTX=ctx;
function drawCharacter(S,ctx=MAIN_CTX,sil=false){
  const {dark,nf}=S;
  const walk=Math.sin(time*5);
  let oA=1,cs=1,yo=0;
  if(endSequence){
    if(endTime<2){oA=1;}
    else if(endTime<4){const p=(endTime-2)/2;cs=1+p*0.3;yo=-p*(isMobile?30:80);}
    else{const p=(endTime-4)/1;oA=Math.max(0,1-p);cs=1.3+p*0.5;yo=(isMobile?-30:-80)-p*100;}
  }
  if(oA<=0)return;
  const k=isMobile?0.9:1.8,br=1-dark*0.6;
  const showLantern=nf>0.6&&!endSequence,lanI=showLantern?sstep(0.6,0.75,nf):0;
  const flick=0.9+0.07*Math.sin(time*21)+0.05*Math.sin(time*34+1);
  const body=mul([64,68,76],br),skin=mul([176,140,116],br);
  const sw=Math.sin(time*5)*1.1+Math.sin(time*1.7)*0.4;

  ctx.save();
  ctx.globalAlpha=oA;
  ctx.translate(W/2,H*0.75+yo);
  ctx.scale(cs*k,cs*k);

  if(!sil&&endSequence&&endTime>2){
    const ai=Math.min((endTime-2)/2,1),as=isMobile?48:60;
    const ag=ctx.createRadialGradient(0,0,0,0,0,as);
    ag.addColorStop(0,`rgba(200,220,255,${ai*0.6})`);ag.addColorStop(1,'rgba(200,220,255,0)');
    ctx.fillStyle=ag;circle(ctx,0,0,as);
  }
  const shA=(endSequence?0:(1-dark)*0.35)+lanI*0.2;
  if(!sil&&shA>0.03){
    ctx.save();ctx.globalAlpha=oA*shA;ctx.translate(2,62);ctx.scale(1,0.24);
    const g=ctx.createRadialGradient(0,0,0,0,0,30);g.addColorStop(0,'rgba(0,0,0,0.9)');g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;circle(ctx,0,0,30);ctx.restore();
  }
  if(!sil&&lanI>0){
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.translate(-19,62);ctx.scale(1,0.26);
    const g=ctx.createRadialGradient(0,0,0,0,0,130);
    g.addColorStop(0,`rgba(255,170,80,${0.42*lanI*flick})`);g.addColorStop(1,'rgba(255,170,80,0)');
    ctx.fillStyle=g;circle(ctx,0,0,130);ctx.restore();
  }
  // legs
  const pants=mul([35,35,38],br),boot=mul([42,34,30],br),sole=mul([20,16,14],br);
  const leg=(x,a)=>{
    const d=Math.sin(a),lift=Math.max(0,-Math.cos(a)),fy=59+3.4*d-4.6*lift,ax=x+(x<0?0.5:-0.5)*lift;
    ctx.fillStyle=rgb(pants);ctx.beginPath();
    ctx.moveTo(x-3.1,43);ctx.lineTo(ax-2.7,fy-4.6);ctx.lineTo(ax+2.7,fy-4.6);ctx.lineTo(x+3.1,43);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(0,0,0,0.25)';ctx.beginPath();
    ctx.moveTo(x+0.8,43);ctx.lineTo(ax+0.8,fy-4.6);ctx.lineTo(ax+2.7,fy-4.6);ctx.lineTo(x+3.1,43);ctx.closePath();ctx.fill();
    if(lift>0.3){ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.lineWidth=0.6;ctx.beginPath();ctx.moveTo(ax-2.4,fy-8.5);ctx.quadraticCurveTo(ax,fy-7.4,ax+2.4,fy-8.8);ctx.stroke();}
    const bh=5.2-lift*0.8;
    ctx.fillStyle=rgb(boot);ctx.beginPath();ctx.moveTo(ax-3.3,fy-bh);ctx.lineTo(ax+3.3,fy-bh);ctx.lineTo(ax+3.8,fy);ctx.lineTo(ax-3.8,fy);ctx.closePath();ctx.fill();
    const sh=1.3+lift*2.4;
    ctx.fillStyle=rgb(mix(sole,mul([96,74,58],br),lift*0.7));ctx.beginPath();
    ctx.moveTo(ax-3.8,fy-0.4);ctx.lineTo(ax+3.8,fy-0.4);ctx.lineTo(ax+3.2,fy-0.4+sh);ctx.lineTo(ax-3.2,fy-0.4+sh);ctx.closePath();ctx.fill();
    ctx.fillStyle=`rgba(255,240,220,${0.14*br})`;ctx.fillRect(ax-3.2,fy-bh,1.1,bh);
  };
  const aL=time*5,aR=aL+Math.PI;
  if(Math.sin(aL)<Math.sin(aR)){leg(-4.6,aL);leg(4.6,aR);}else{leg(4.6,aR);leg(-4.6,aL);}

  if(!endSequence){ctx.translate(Math.sin(time*5)*0.7,-Math.abs(walk)*1.2);ctx.rotate(Math.sin(time*5)*0.018);}

  // scarf tail
  const sc0=mul([128,42,38],br);
  ctx.fillStyle=rgb(sc0);ctx.beginPath();
  ctx.moveTo(-1,-9);
  for(let i=0;i<=8;i++){const y=-9+i*3.6;ctx.lineTo(-1+Math.sin(time*5+i*0.6)*0.9*i/8+0.2*i,y);}
  for(let i=8;i>=0;i--){const y=-9+i*3.6;ctx.lineTo(3.8-i*0.15+Math.sin(time*5+i*0.6)*0.9*i/8+0.2*i,y);}
  ctx.closePath();ctx.fill();

  // cloak
  const cloak=new Path2D(),xL=-17.5+sw*0.9,xR=17.5+sw*0.9,hemY=49;
  cloak.moveTo(-6.5,-11);
  cloak.bezierCurveTo(-12.5,-10.5,-15.5,-3,-15.8+sw*0.15,6);
  cloak.bezierCurveTo(-16.8+sw*0.35,20,-19+sw*0.7,36,xL,hemY);
  for(let i=1;i<=14;i++){cloak.lineTo(xL+(xR-xL)*i/14,hemY+((i&1)?2.4:-0.4)+Math.sin(time*3+i)*0.4);}
  cloak.bezierCurveTo(19+sw*0.7,36,16.8+sw*0.35,20,15.8+sw*0.15,6);
  cloak.bezierCurveTo(15.5,-3,12.5,-10.5,6.5,-11);
  cloak.closePath();
  const cg=ctx.createLinearGradient(0,-12,0,52);
  cg.addColorStop(0,rgb(mul(body,1.18)));cg.addColorStop(0.55,rgb(mul(body,0.85)));cg.addColorStop(1,rgb(mul(body,0.5)));

/* ----------------------------------------------------------------- finale */
function drawPortal(){
  const portalProgress=Math.min((endTime-1)/2,1),portalOpacity=portalProgress;
  const portalX=W/2,portalY=H*0.45,pw=isMobile?80:100,ph=isMobile?144:180;
  const crossProgress=endTime>3?Math.min((endTime-3)/1,1):0;
  const arch=()=>{ctx.beginPath();ctx.moveTo(portalX-pw/2,portalY+ph/2);ctx.lineTo(portalX-pw/2,portalY-ph/2+pw/2);
    ctx.arc(portalX,portalY-ph/2+pw/2,pw/2,Math.PI,0,false);ctx.lineTo(portalX+pw/2,portalY+ph/2);ctx.closePath();};
  ctx.save();ctx.globalAlpha=portalOpacity;
  const halo=ctx.createRadialGradient(portalX,portalY,pw*0.3,portalX,portalY,pw*1.6);
  halo.addColorStop(0,'rgba(120,150,255,0.35)');halo.addColorStop(1,'rgba(120,150,255,0)');
  ctx.fillStyle=halo;ctx.fillRect(portalX-pw*1.6,portalY-pw*1.6,pw*3.2,pw*3.2+ph*0.4);
  arch();
  const pg=ctx.createRadialGradient(portalX,portalY,0,portalX,portalY,ph*0.6);
  pg.addColorStop(0,'#0a0a24');pg.addColorStop(1,'#000000');
  ctx.fillStyle=pg;ctx.fill();
  ctx.save();arch();ctx.clip();
  for(let i=0;i<30;i++){
    const s1=Math.sin(i*12.9898+100)*43758.5453,s2=Math.sin(i*78.233+100)*43758.5453,s3=Math.sin(i*45.164+100)*43758.5453;
    const sx=portalX-pw/2+(s1-Math.floor(s1))*pw,sy=portalY-ph/2+(s2-Math.floor(s2))*ph;
    const size=isMobile?(0.4+(s3-Math.floor(s3))*1.2):(0.5+(s3-Math.floor(s3))*1.5);
    ctx.fillStyle=`rgba(255,255,255,${Math.sin(time*3+i*0.5)*0.3+0.7})`;circle(ctx,sx,sy,size);
  }
  if(crossProgress>0){
    const gi=crossProgress,gs=pw*2*crossProgress;
    const ag=ctx.createRadialGradient(portalX,portalY,0,portalX,portalY,gs);
    ag.addColorStop(0,`rgba(100,255,150,${gi*0.8})`);ag.addColorStop(0.3,`rgba(150,255,200,${gi*0.6})`);
    ag.addColorStop(0.6,`rgba(100,200,255,${gi*0.3})`);ag.addColorStop(1,'rgba(100,255,150,0)');
    ctx.fillStyle=ag;ctx.fillRect(portalX-gs,portalY-gs,gs*2,gs*2);
    for(let i=0;i<20;i++){
      const ang=(time*2+i*0.3)*Math.PI,rad=pw*0.3+Math.sin(time*3+i)*(isMobile?12:15);
      const px=portalX+Math.cos(ang)*rad*crossProgress,py=portalY+Math.sin(ang*0.7)*rad*0.8*crossProgress;
      const psz=Math.abs((isMobile?0.8:1)+Math.sin(time*5+i)*(isMobile?1.6:2)),cp=(i/20+time*0.5)%1;
      ctx.fillStyle=cp<0.33?`rgba(100,255,150,${gi*0.9})`:cp<0.66?`rgba(150,255,200,${gi*0.9})`:`rgba(100,200,255,${gi*0.9})`;
      circle(ctx,px,py,psz);
    }
  }
  ctx.restore();
  arch();ctx.strokeStyle=`rgba(150,160,220,0.6)`;ctx.lineWidth=isMobile?1.5:2;ctx.stroke();
  ctx.restore();
}
function drawFinale(){
  const starsFadeIn=Math.min((endTime-5)/2,1);
  ctx.fillStyle='#000000';ctx.fillRect(0,0,W,H);
  for(let i=0;i<200;i++){
    const s1=Math.sin(i*12.9898)*43758.5453,s2=Math.sin(i*78.233)*43758.5453,s3=Math.sin(i*45.164)*43758.5453;
    const sx=(s1-Math.floor(s1))*W,sy=(s2-Math.floor(s2))*H,size=0.5+(s3-Math.floor(s3))*1;
    const tw=Math.sin(time*3+i*0.5)*0.3+0.7,op=starsFadeIn*tw;
    ctx.fillStyle=`rgba(255,255,255,${op})`;circle(ctx,sx,sy,size);
    if(size>1.2&&tw>0.8){
      const gl=size*2,gg=ctx.createRadialGradient(sx,sy,0,sx,sy,gl);
      gg.addColorStop(0,`rgba(255,255,255,${op*0.3})`);gg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=gg;circle(ctx,sx,sy,gl);
    }
  }
  if(endTime>7){
    const textFadeIn=Math.min((endTime-7)/2,1);
    const text="Through all seasons, one path. At the end of the path, infinity. ";
    ctx.save();ctx.globalAlpha=textFadeIn;
    const fontSize=Math.min(W*0.035,22);
    ctx.font=`bold ${fontSize}px Inter, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    const radius=H*0.42,centerX=W/2,centerY=H/2,rotationSpeed=time*0.25;
    const chars=[],spaceWidth=ctx.measureText(' ').width;
    for(let i=0;i<text.length;i++){
      const ch=text[i],cw=ctx.measureText(ch).width,arcLength=(cw+spaceWidth*2)*1.5;
      chars.push({char:ch,arcAngle:arcLength/radius});
    }
    const totalAngle=chars.reduce((sum,c)=>sum+c.arcAngle,0),normalizer=(Math.PI*2)/totalAngle;
    let currentAngle=rotationSpeed;
    for(let i=0;i<chars.length;i++){
      const {char,arcAngle}=chars[i],na=arcAngle*normalizer,angle=currentAngle+na/2;
      const x=centerX+Math.cos(angle)*radius,y=centerY+Math.sin(angle)*radius;
      const intensity=1-((i/chars.length)*0.3);
      if(char.trim()){
        ctx.save();ctx.translate(x,y);ctx.rotate(angle+Math.PI/2);
        const wave=Math.sin(time*2+i*0.3)*0.2+0.8;
        ctx.fillStyle=`rgba(255,255,255,${wave*intensity})`;ctx.shadowColor=`rgba(255,255,255,${0.6*intensity})`;ctx.shadowBlur=8;
        ctx.fillText(char,0,0);ctx.restore();
      }
      currentAngle+=na;
    }
    ctx.restore();
  }
  post(0.3,0.4);
}

/* ------------------------------------------------------- post / lighting */
function post(bloomAmt,vig){
  if(bloomAmt>0.005){
    bctxA.drawImage(canvas,0,0,bloomA.width,bloomA.height);
    bctxB.drawImage(bloomA,0,0,bloomB.width,bloomB.height);
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.imageSmoothingEnabled=true;
    ctx.globalAlpha=bloomAmt;ctx.drawImage(bloomB,0,0,W,H);
    ctx.globalAlpha=bloomAmt*0.5;ctx.drawImage(bloomA,0,0,W,H);
    ctx.restore();
  }
  const v=ctx.createRadialGradient(W/2,H*0.5,Math.min(W,H)*0.35,W/2,H*0.5,Math.max(W,H)*0.8);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,`rgba(0,0,0,${vig})`);
  ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=0.08;ctx.fillStyle=grainPat;
  ctx.translate(-Math.random()*160,-Math.random()*160);ctx.fillRect(0,0,W+160,H+160);ctx.restore();
}
function drawRays(S){
  const a=S.dusk*0.08*(1-S.winter*0.5);
  if(a<0.005||endSequence)return;
  ctx.save();ctx.globalCompositeOperation='screen';
  const mx=W*0.5,my=H*0.2;
  for(let i=0;i<6;i++){
    const ang=Math.PI/2+(i-2.5)*0.19+Math.sin(time*0.2+i)*0.03,len=H*0.9,spread=0.05+((i*37)%5)*0.012;
    const g=ctx.createLinearGradient(mx,my,mx+Math.cos(ang)*len,my+Math.sin(ang)*len);
    g.addColorStop(0,`rgba(255,244,214,${a})`);g.addColorStop(1,'rgba(255,244,214,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(mx,my);
    ctx.lineTo(mx+Math.cos(ang-spread)*len,my+Math.sin(ang-spread)*len);
    ctx.lineTo(mx+Math.cos(ang+spread)*len,my+Math.sin(ang+spread)*len);
    ctx.closePath();ctx.fill();
  }
  ctx.restore();
}
function drawMoonPath(S){
  if(S.dark<0.05||endSequence)return;
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.translate(W/2,H*0.56);ctx.scale(1,0.26);
  const g=ctx.createRadialGradient(0,0,0,0,0,W*0.4);
  g.addColorStop(0,`rgba(150,180,255,${0.2*S.dark})`);g.addColorStop(1,'rgba(150,180,255,0)');
  ctx.fillStyle=g;ctx.fillRect(-W,-W,W*2,W*2);ctx.restore();
}

/* ------------------------------------------------------------------- loop */
function frame(now){
  const dt = Math.min((now - lastTime)/1000, 0.05);
  lastTime = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

function update(dt){
  time += dt;
  if(introSequence) {
    introTime += dt;
    if(introTime > 3) introSequence = false;
    return;
  }
  dayTime += dt * 0.1;
  if (dayTime > 2) dayTime -= 2;

  if(!endSequence) {
    seasonTime += dt * 0.1 / 2;
    if(seasonTime >= 4) {
      seasonTime = 3.5;
      endSequence = true;
      endTime = 0;
    }
  }
  if(endSequence) {
    seasonTime = 3;
    endTime += dt;
  }
  playerZ += speed * dt;
  while(playerZ >= segments.length*SEG_LEN) playerZ -= segments.length*SEG_LEN;
  const bs = segments[Math.floor(playerZ/SEG_LEN) % segments.length];
  if(bs) bgX += bs.curve * dt * 25;
  updateParticles(dt);
}

function drawIntro(){
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, W, H);
  const titleFadeIn = Math.min(introTime / 1, 1);
  const titleFadeOut = introTime > 2 ? Math.min((introTime - 2) / 1, 1) : 0;
  const titleOpacity = titleFadeIn * (1 - titleFadeOut);
  if(titleOpacity <= 0) return;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.globalAlpha = titleOpacity * 0.5;
  for(let i=0;i<70;i++){
    const a=hash(i,1),b=hash(i,2),tw=0.5+0.5*Math.sin(time*2+i);
    ctx.fillStyle=`rgba(255,255,255,${0.25+0.5*tw})`;ctx.fillRect(a*W,b*H,1,1);
  }
  ctx.globalAlpha = titleOpacity;
  const titleSize = Math.min(W * 0.085, 56);
  ctx.shadowColor = 'rgba(200,215,255,0.55)';
  ctx.shadowBlur = 18;
  ctx.font = `italic 500 ${titleSize}px "Cormorant Garamond", Georgia, serif`;
  if('letterSpacing' in ctx) ctx.letterSpacing = `${(titleSize*0.04).toFixed(1)}px`;
  ctx.fillStyle = '#f4f1e8';
  ctx.fillText('The Long Walk to the Moon', W / 2, H / 2);
  if('letterSpacing' in ctx) ctx.letterSpacing = '0px';
  ctx.shadowBlur = 0;
  ctx.restore();
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.imageSmoothingQuality='high';
  if(introSequence){drawIntro();return;}

  const cycleTime = dayTime % 2;
  const nf = (cycleTime > 1) ? 2 - cycleTime : cycleTime;
  const season = endSequence ? 4 : (seasonTime % 4);
  if(endSequence && endTime > 5){drawFinale();return;}

  const dark=sstep(0.1,0.9,nf);
  const dusk=endSequence?0:Math.max(0,1-Math.abs(nf-0.4)/0.25);
  const haze=kf(PAL.haze,season);
  const P={skyTop:kf(PAL.skyTop,season),haze,hazeF:mix(haze,[255,190,140],dusk*0.3),
    gA:kf(PAL.grassA,season),gB:kf(PAL.grassB,season),fol:kf(PAL.foliage,season),
    roadA:kf(PAL.roadA,season),roadB:kf(PAL.roadB,season),mount:kf(PAL.mount,season)};
  const S={nf,dark,dusk,s:season,P,winter:clamp(season-3,0,1),eyes:[]};

  drawSky(S);
  if(!segments[Math.floor(playerZ/SEG_LEN)%segments.length])return;

  let worldOpacity=1;
  if(endSequence) worldOpacity = endTime<=1 ? Math.max(0,1-endTime) : 0;
  if(worldOpacity>0){
    drawTerrain(S);
    ctx.globalAlpha=worldOpacity;ctx.drawImage(world,0,0,W,H);ctx.globalAlpha=1;
    if(!endSequence)drawEyes(S);
  }
  drawMoonPath(S);
  drawRays(S);
  if(endSequence && endTime > 1 && endTime < 5) drawPortal();
  drawCastShadows(S);
  drawCharacter(S);
  drawParticles(S);
  post(0.04+0.14*dark,0.34+0.2*dark);
}

updateCanvasSize();
if(document.fonts)document.fonts.load('italic 500 40px "Cormorant Garamond"').catch(()=>{});
requestAnimationFrame(frame);
</script>
</body>
