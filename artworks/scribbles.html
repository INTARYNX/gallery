<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Sphere</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#000; display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden; }
        #wrap { position:relative; }
        canvas { display:block; }
        #main { border:2px solid #333; box-shadow:0 0 60px rgba(255,255,255,0.15); }
        #scr { position:absolute; top:0; left:0; pointer-events:none; }
    </style>
</head>
<body>
<div id="wrap">
    <canvas id="main"></canvas>
    <canvas id="scr"></canvas>
</div>
<script>
const main = document.getElementById('main');
const ctx  = main.getContext('2d');
const scr  = document.getElementById('scr');
const sctx = scr.getContext('2d');
const S = Math.min(window.innerWidth, window.innerHeight) - 20;
main.width = main.height = scr.width = scr.height = S;

const rnd  = (a,b) => Math.random()*(b-a)+a;
const ri   = (a,b) => Math.floor(rnd(a,b+1));
const NEON = ['#ff00ff','#00ffff','#ff0066','#00ff99','#ff6600','#66ff00','#ff00cc','#00ccff'];
const nc   = () => NEON[ri(0,NEON.length-1)];
const ease = t => t<0.5 ? 2*t*t : -1+(4-2*t)*t;

// ── Texture ───────────────────────────────────────────────────────
const TW=512, TH=256;
const texBuf = new Uint8ClampedArray(TW*TH*4);
const texCanvas = document.createElement('canvas');
texCanvas.width=TW; texCanvas.height=TH;
const tctx = texCanvas.getContext('2d');
let time=0, strobePhase=0;

function drawTexture() {
    const t1=time%(Math.PI*2), t2=(time*1.5)%(Math.PI*2), t3=(time*0.8)%(Math.PI*2);
    const cs1=Math.sin(time*0.9)*0.5+0.5, cs2=Math.sin(time*1.3+2.1)*0.5+0.5, cs3=Math.sin(time*0.7+4.2)*0.5+0.5;
    const colorSpin=time*1.2;
    const inv=1-(Math.abs(Math.sin(strobePhase*2.3))*Math.abs(Math.sin(strobePhase*1.1)))*0.75;
    const ss=13+Math.sin(time*0.13)*4+Math.sin(time*0.29)*2;
    const st=0.28+Math.sin(time*0.17)*0.09+Math.cos(time*0.23)*0.04;
    for (let py=0; py<TH; py++) {
        for (let px=0; px<TW; px++) {
            const pa=(px/TW)*Math.PI*2-Math.PI, dist=(py/TH)*300;
            const sa=pa-time+dist*st, sd=(sa/(Math.PI*2))*ss;
            const df=Math.abs((dist-sd)%ss);
            const v=Math.random()*255;
            const p1=Math.sin(dist*0.08+t1)*127+128;
            const p2=Math.sin(pa*3+t2)*127+128;
            const p3=Math.sin(dist*0.05+pa*2+t3)*127+128;
            const hue=(colorSpin+dist*0.015+pa)%(Math.PI*2);
            const sat=Math.sin(dist*0.04+time*2)*0.3+0.8;
            const rf=Math.pow(Math.abs(Math.sin(dist*0.18+time*3)),3);
            let r=(v*cs1*0.2+p1*0.8+Math.sin(hue)*80)*sat+rf*150;
            let g=(v*cs2*0.2+p2*0.8+Math.sin(hue+2.1)*80)*sat+rf*50;
            let b=(v*cs3*0.2+p3*0.8+Math.sin(hue+4.2)*80)*sat+rf*200;
            const se=df<7?1-df/7:0, eb=se*se*2.5;
            r=(r*(1-se*0.5)+eb*255*Math.abs(Math.sin(hue)))*inv;
            g=(g*(1-se*0.5)+eb*255*Math.abs(Math.sin(hue+2.1)))*inv;
            b=(b*(1-se*0.5)+eb*255)*inv;
            const i=(py*TW+px)*4;
            texBuf[i]=Math.min(255,r); texBuf[i+1]=Math.min(255,g); texBuf[i+2]=Math.min(255,b); texBuf[i+3]=255;
        }
    }
    tctx.putImageData(new ImageData(texBuf,TW,TH),0,0);
}

// ── Sphere ────────────────────────────────────────────────────────
let sphereScale=0.46, sphereScaleTarget=0.46, sphereScaleVel=0;
const sphOut = new Uint8ClampedArray(S*S*4);

function updateSphereScale() {
    if (Math.random()<0.008) sphereScaleTarget=rnd(0.38,0.48);
    sphereScaleVel+=(sphereScaleTarget-sphereScale)*0.003;
    sphereScaleVel*=0.92;
    sphereScale+=sphereScaleVel;
}

function drawSphere() {
    const cx=S/2, cy=S/2, R=S*sphereScale;
    const lx=0.4,ly=-0.4,lz=0.8,llen=Math.sqrt(lx*lx+ly*ly+lz*lz);
    for (let i=3;i<S*S*4;i+=4) sphOut[i]=0;
    for (let y=0;y<S;y++) {
        for (let x=0;x<S;x++) {
            const dx=(x-cx)/R, dy=(y-cy)/R, r2=dx*dx+dy*dy;
            if (r2>1) continue;
            const dz=Math.sqrt(1-r2);
            const theta=Math.acos(dz), phi=Math.atan2(dy,dx);
            const tx=Math.floor(((phi+Math.PI)/(Math.PI*2))*TW)%TW;
            const ty=Math.min(TH-1,Math.floor((theta/(Math.PI/2))*TH*0.5));
            const ti=(ty*TW+tx)*4;
            const diff=Math.max(0,(dx*lx+dy*ly+dz*lz)/llen);
            const lit=diff*0.75+0.25, fr=Math.pow(dz,0.5), sp=Math.pow(Math.max(0,dz),18)*0.5*255;
            const oi=(y*S+x)*4;
            sphOut[oi]  =Math.min(255,texBuf[ti]*lit*fr+sp);
            sphOut[oi+1]=Math.min(255,texBuf[ti+1]*lit*fr+sp);
            sphOut[oi+2]=Math.min(255,texBuf[ti+2]*lit*fr+sp*0.86);
            sphOut[oi+3]=255;
        }
    }
    ctx.putImageData(new ImageData(sphOut,S,S),0,0);
    const grad=ctx.createRadialGradient(cx-R*0.3,cy-R*0.3,0,cx,cy,R);
    grad.addColorStop(0,'rgba(255,255,255,0.2)');
    grad.addColorStop(0.25,'rgba(255,255,255,0.05)');
    grad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.clip();
    ctx.fillStyle=grad; ctx.fillRect(0,0,S,S); ctx.restore();
}

// ── Color helpers ─────────────────────────────────────────────────
function spiralColor() {
    const hue=(time*1.2+rnd(0,Math.PI*2))%(Math.PI*2);
    const r=Math.sin(hue)*127+128;
    const g=Math.sin(hue+2.1)*127+128;
    const b=Math.sin(hue+4.2)*127+128;
    const mn=Math.min(r,g,b);
    const boost=v=>Math.min(255,Math.floor(mn+(v-mn)*2.5));
    return `rgb(${boost(r)},${boost(g)},${boost(b)})`;
}
function pickColor() {
    return Math.random()<0.5 ? spiralColor() : nc();
}

// ── Scribbles ─────────────────────────────────────────────────────
function drawScribbles(o) {
    o.clearRect(0,0,S,S);
    const nb=ri(6,12);
    for (let s=0;s<nb;s++) {
        const color=pickColor();
        o.strokeStyle=o.fillStyle=color;
        o.lineWidth=rnd(1,6); o.globalAlpha=rnd(0.7,1);
        o.lineCap=o.lineJoin='round';
        o.shadowColor=color; o.shadowBlur=rnd(10,35);
        const type=Math.random(), sx=rnd(0,S), sy=rnd(0,S);
        if (type<0.25) {
            o.beginPath(); o.moveTo(sx,sy);
            for (let i=0;i<ri(8,22);i++) {
                o.quadraticCurveTo(
                    sx+rnd(-S*.35,S*.35), sy+rnd(-S*.35,S*.35),
                    sx+rnd(-S*.4,S*.4),   sy+rnd(-S*.4,S*.4)
                );
            }
            o.stroke();
        } else if (type<0.5) {
            const hx=rnd(0,S*.7), hy=rnd(0,S*.7), hw=rnd(S*.05,S*.35), hh=rnd(S*.05,S*.25), gap=rnd(3,10);
            o.beginPath(); let tog=false;
            for (let yl=hy;yl<hy+hh;yl+=gap) {
                o.moveTo(tog?hx+hw:hx, yl);
                o.lineTo(tog?hx:hx+hw, yl+gap*rnd(.3,.7));
                tog=!tog;
            }
            o.stroke();
        } else if (type<0.7) {
            // zigzag
            o.beginPath(); o.moveTo(sx,sy);
            const steps=ri(6,16);
            for (let i=0;i<steps;i++) o.lineTo(rnd(0,S), rnd(0,S));
            o.stroke();
        } else if (type<0.85) {
            o.beginPath(); o.moveTo(sx,sy);
            for (let i=0;i<ri(5,14);i++) o.lineTo(sx+rnd(-S*.45,S*.45), sy+rnd(-S*.45,S*.45));
            o.stroke();
        } else {
            o.beginPath();
            const bpts=ri(5,12), br=rnd(S*.015,S*.08);
            for (let i=0;i<=bpts;i++) {
                const a=(i/bpts)*Math.PI*2, r=br*rnd(.5,1.5);
                i===0 ? o.moveTo(sx+Math.cos(a)*r, sy+Math.sin(a)*r)
                      : o.lineTo(sx+Math.cos(a)*r, sy+Math.sin(a)*r);
            }
            o.closePath(); o.fill();
        }
        o.shadowBlur=rnd(20,50); o.lineWidth*=0.4; o.globalAlpha*=0.5; o.stroke();
    }
    o.globalAlpha=1; o.shadowBlur=0;
}

// ── Pixel transition ──────────────────────────────────────────────
const BLOCK=Math.max(4,Math.round(S/80));
const COLS=Math.ceil(S/BLOCK), ROWS=Math.ceil(S/BLOCK), N=COLS*ROWS;

const bufA=document.createElement('canvas'); bufA.width=bufA.height=S;
const bufB=document.createElement('canvas'); bufB.width=bufB.height=S;
const bctxA=bufA.getContext('2d'), bctxB=bufB.getContext('2d');
const blkA=document.createElement('canvas'); blkA.width=COLS; blkA.height=ROWS;
const blkB=document.createElement('canvas'); blkB.width=COLS; blkB.height=ROWS;
const blkCtxA=blkA.getContext('2d'), blkCtxB=blkB.getContext('2d');

function bake(fullCtx,blkCtx) {
    drawScribbles(fullCtx);
    blkCtx.clearRect(0,0,COLS,ROWS);
    blkCtx.drawImage(fullCtx.canvas,0,0,COLS,ROWS);
}

const pFX=new Float32Array(N), pFY=new Float32Array(N);
const pTX=new Float32Array(N), pTY=new Float32Array(N);
const pMX=new Float32Array(N), pMY=new Float32Array(N);
const pDelay=new Float32Array(N);
const pR=new Uint8Array(N),  pG=new Uint8Array(N),  pB=new Uint8Array(N),  pA=new Uint8Array(N);
const pTR=new Uint8Array(N), pTG=new Uint8Array(N), pTB=new Uint8Array(N), pTA=new Uint8Array(N);

function readColors(blkCtx,R,G,B,A) {
    const d=blkCtx.getImageData(0,0,COLS,ROWS).data;
    for (let i=0;i<N;i++) { R[i]=d[i*4]; G[i]=d[i*4+1]; B[i]=d[i*4+2]; A[i]=d[i*4+3]; }
}

function setupParticles(fromBlk,toBlk) {
    readColors(fromBlk,pR,pG,pB,pA);
    readColors(toBlk,pTR,pTG,pTB,pTA);
    for (let i=0;i<N;i++) {
        const col=i%COLS, row=Math.floor(i/COLS);
        const gx=col*BLOCK, gy=row*BLOCK;
        pFX[i]=gx; pFY[i]=gy; pTX[i]=gx; pTY[i]=gy;
        const midAngle=rnd(0,Math.PI*2), midDist=rnd(0.1,1.5)*S;
        pMX[i]=gx+Math.cos(midAngle)*midDist;
        pMY[i]=gy+Math.sin(midAngle)*midDist;
        pDelay[i]=rnd(0,0.35);
    }
}

const tmpPix=document.createElement('canvas');
function pixDraw(src,t) {
    const levels=[1,2,4,8].filter(v=>v<=BLOCK);
    const bs=levels[Math.min(levels.length-1,Math.floor(t*levels.length))];
    const dw=Math.ceil(S/bs), dh=Math.ceil(S/bs);
    tmpPix.width=dw; tmpPix.height=dh;
    const tc=tmpPix.getContext('2d');
    tc.imageSmoothingEnabled=false;
    tc.drawImage(src,0,0,dw,dh);
    sctx.imageSmoothingEnabled=false;
    sctx.clearRect(0,0,S,S);
    sctx.drawImage(tmpPix,0,0,S,S);
}

const travelImg=new ImageData(S,S);
const travelBuf=travelImg.data;
const DUR={hold:45,pixelize:12,travel:30,depixelize:12};
let state='hold', stateT=0;
let curBuf=bufA, nxtBuf=bufB;
let curCtx=bctxA, nxtCtx=bctxB;
let curBlk=blkCtxA, nxtBlk=blkCtxB;

bake(bctxA,blkCtxA);
sctx.drawImage(bufA,0,0);

function renderPixelLayer() {
    if (state==='hold') {
        stateT++;
        if (stateT>=DUR.hold) {
            stateT=0; state='pixelize';
            bake(nxtCtx,nxtBlk);
            setupParticles(curBlk,nxtBlk);
        }
        return;
    }
    if (state==='pixelize') {
        stateT++;
        pixDraw(curBuf,ease(stateT/DUR.pixelize));
        if (stateT>=DUR.pixelize) { stateT=0; state='travel'; }
        return;
    }
    if (state==='travel') {
        stateT++;
        const t=stateT/DUR.travel;
        for (let i=0;i<S*S*4;i+=4) { travelBuf[i]=0; travelBuf[i+1]=0; travelBuf[i+2]=0; travelBuf[i+3]=0; }
        for (let i=0;i<N;i++) {
            if (pA[i]<8&&pTA[i]<8) continue;
            const lt=Math.max(0,Math.min(1,(t-pDelay[i])/(1-pDelay[i])));
            const et=ease(lt);
            const bx=(1-et)*(1-et)*pFX[i]+2*(1-et)*et*pMX[i]+et*et*pTX[i];
            const by=(1-et)*(1-et)*pFY[i]+2*(1-et)*et*pMY[i]+et*et*pTY[i];
            const cr=(pR[i]+(pTR[i]-pR[i])*et)|0;
            const cg=(pG[i]+(pTG[i]-pG[i])*et)|0;
            const cb=(pB[i]+(pTB[i]-pB[i])*et)|0;
            const ca=Math.max(pA[i],pTA[i]);
            if (ca<8) continue;
            const bxi=bx|0, byi=by|0;
            for (let dy=-1;dy<=BLOCK;dy++) {
                const py=byi+dy; if (py<0||py>=S) continue;
                const edgeY=(dy<0||dy>=BLOCK);
                for (let dx=-1;dx<=BLOCK;dx++) {
                    const px=bxi+dx; if (px<0||px>=S) continue;
                    const glow=(edgeY||(dx<0||dx>=BLOCK))?0.35:1;
                    const idx=(py*S+px)*4;
                    travelBuf[idx]  =Math.min(255,Math.max(travelBuf[idx],  (cr*glow)|0));
                    travelBuf[idx+1]=Math.min(255,Math.max(travelBuf[idx+1],(cg*glow)|0));
                    travelBuf[idx+2]=Math.min(255,Math.max(travelBuf[idx+2],(cb*glow)|0));
                    travelBuf[idx+3]=Math.min(255,Math.max(travelBuf[idx+3],(ca*glow)|0));
                }
            }
        }
        sctx.putImageData(travelImg,0,0);
        if (stateT>=DUR.travel) {
            stateT=0; state='depixelize';
            const tb=curBuf; curBuf=nxtBuf; nxtBuf=tb;
            const tc=curCtx; curCtx=nxtCtx; nxtCtx=tc;
            const tk=curBlk; curBlk=nxtBlk; nxtBlk=tk;
        }
        return;
    }
    if (state==='depixelize') {
        stateT++;
        pixDraw(curBuf,ease(1-stateT/DUR.depixelize));
        if (stateT>=DUR.depixelize) {
            stateT=0; state='hold';
            sctx.imageSmoothingEnabled=true;
            sctx.clearRect(0,0,S,S);
            sctx.drawImage(curBuf,0,0);
        }
    }
}

function loop() {
    strobePhase+=0.18; time+=0.28;
    updateSphereScale();
    drawTexture();
    drawSphere();
    renderPixelLayer();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
