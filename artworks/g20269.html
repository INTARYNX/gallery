<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genuary 2026 #9</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #fff;
            overflow: hidden;
        }
        canvas {
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <script>
        const c = document.getElementById('c');
        const x = c.getContext('2d');
        const s = 4, w = 200, h = 150;
        c.width = w * s;
        c.height = h * s;
        
        let g = [], n = [], u = [], v = [];
        for (let i = 0; i < h; i++) {
            g[i] = [], n[i] = [], u[i] = [], v[i] = [];
            for (let j = 0; j < w; j++) {
                g[i][j] = Math.random() > 0.7 ? Math.floor(Math.random() * 5) : 0;
                u[i][j] = Math.random() * 360;
                n[i][j] = v[i][j] = 0;
            }
        }
        
        const nb = (r, c) => {
            let t = [0, 0, 0, 0, 0];
            for (let i = -1; i <= 1; i++)
                for (let j = -1; j <= 1; j++)
                    if (i || j) {
                        const val = g[(r + i + h) % h][(c + j + w) % w];
                        if (val) t[val]++;
                    }
            return t;
        };
        
        const up = () => {
            for (let i = 0; i < h; i++) {
                for (let j = 0; j < w; j++) {
                    const ct = nb(i, j), cur = g[i][j], tot = ct.reduce((a, b) => a + b);
                    
                    let ah = 0, hc = 0;
                    for (let di = -1; di <= 1; di++)
                        for (let dj = -1; dj <= 1; dj++) {
                            const ni = (i + di + h) % h, nj = (j + dj + w) % w;
                            if (g[ni][nj]) {
                                ah += u[ni][nj];
                                hc++;
                            }
                        }
                    v[i][j] = hc ? (ah / hc + tot * 0.5) % 360 : (u[i][j] + 0.2) % 360;
                    
                    if (!cur) {
                        if (ct[1] === 3) n[i][j] = 1;
                        else if (ct[2] === 2) n[i][j] = 2;
                        else if (ct[3] === 4) n[i][j] = 3;
                        else if (tot === 5) n[i][j] = 4;
                        else n[i][j] = 0;
                    } else {
                        if (tot < 2 || tot > 5) n[i][j] = 0;
                        else if (ct[(cur % 4) + 1] > 2) n[i][j] = (cur % 4) + 1;
                        else if (tot === 3) n[i][j] = cur;
                        else n[i][j] = (cur + 1) % 5;
                    }
                }
            }
            [g, n] = [n, g];
            [u, v] = [v, u];
        };
        
        const dr = () => {
            x.fillStyle = '#fff';
            x.fillRect(0, 0, c.width, c.height);
            
            const l = [100, 20, 40, 60, 80];
            
            for (let i = 0; i < h; i++) {
                for (let j = 0; j < w; j++) {
                    if (g[i][j]) {
                        const tot = nb(i, j).reduce((a, b) => a + b);
                        const gl = Math.min(tot * 3, 30);
                        const hue = u[i][j];
                        const sat = 85 + Math.sin(u[i][j] * 0.1) * 15;
                        const clr = `hsl(${hue},${sat}%,${l[g[i][j]]}%)`;
                        
                        x.shadowBlur = gl;
                        x.shadowColor = clr;
                        x.fillStyle = clr;
                        x.beginPath();
                        x.arc(j * s + s / 2, i * s + s / 2, s / 2, 0, Math.PI * 2);
                        x.fill();
                    }
                }
            }
            x.shadowBlur = 0;
            x.globalAlpha = 0.1;
            x.fillStyle = '#000';
            for (let y = 0; y < c.height; y += 2) x.fillRect(0, y, c.width, 1);
            x.globalAlpha = 1;
        };
        
        let lt = 0;
        const an = t => {
            if (t - lt >= 100) {
                up();
                dr();
                lt = t;
            }
            requestAnimationFrame(an);
        };
        an(0);
    </script>
</body>
</html>
