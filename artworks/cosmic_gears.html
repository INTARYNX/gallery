<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Cosmic Gears</title>
<style>
  body { margin: 0; background: #0a0a0f; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false });
let w, h, img, data;

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  img = ctx.createImageData(w, h);
  data = img.data;
}
window.addEventListener("resize", resize);
resize();

function hash(x, y) {
  return Math.sin(x * 127.1 + y * 311.7) * 43758.5453 % 1;
}

function noise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const a = hash(ix, iy), b = hash(ix + 1, iy);
  const c = hash(ix, iy + 1), d = hash(ix + 1, iy + 1);
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  return a * (1 - u) * (1 - v) + b * u * (1 - v) + c * (1 - u) * v + d * u * v;
}

function fbm(x, y) {
  let v = 0, a = 0.5;
  for (let i = 0; i < 6; i++) {
    v += a * noise(x, y);
    x *= 2; y *= 2; a *= 0.5;
  }
  return v;
}

/* ---------- Gear cache ---------- */
const gearCache = new Map();

function createGearCanvas(radius, teethCount, toothDepth, hubRatio) {
  const key = `${radius}-${teethCount}-dark`;
  if (gearCache.has(key)) return gearCache.get(key);
  
  const size = radius * 4;
  const temp = document.createElement('canvas');
  temp.width = temp.height = size;
  const tc = temp.getContext('2d');
  const cx = size / 2;
  
  // Draw gear teeth
  tc.beginPath();
  const pts = teethCount * 40;
  for (let i = 0; i <= pts; i++) {
    const a = (i / pts) * Math.PI * 2;
    const wave = Math.sin(a * teethCount) * toothDepth;
    const r = radius * (1 + wave);
    const x = cx + Math.cos(a) * r;
    const y = cx + Math.sin(a) * r;
    if (i === 0) tc.moveTo(x, y);
    else tc.lineTo(x, y);
  }
  tc.closePath();
  
  // Premium metallic gradient with less contrast
  const g = tc.createRadialGradient(cx - radius * 0.2, cx - radius * 0.2, radius * 0.1, cx, cx, radius);
  g.addColorStop(0, '#c0c0c8');
  g.addColorStop(0.25, '#a8a8b0');
  g.addColorStop(0.5, '#909098');
  g.addColorStop(0.75, '#787880');
  g.addColorStop(1, '#606068');
  tc.fillStyle = g;
  tc.fill();
  tc.strokeStyle = 'rgba(20,20,30,0.5)';
  tc.lineWidth = 1;
  tc.stroke();
  
  // Subtle texture
  tc.globalCompositeOperation = 'overlay';
  const id = tc.getImageData(0, 0, size, size);
  const d = id.data;
  for (let i = 0; i < d.length; i += 64) {
    const px = (i / 4) % size, py = (i / 4 / size) | 0;
    const dx = px - cx, dy = py - cx, dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < radius * 1.2 && dist > radius * hubRatio) {
      const n = noise(px * 0.15, py * 0.15) * 0.15 + 0.85;
      for (let j = 0; j < 64; j += 4) {
        if (i + j < d.length) {
          d[i+j] *= n; d[i+j+1] *= n; d[i+j+2] *= n;
        }
      }
    }
  }
  tc.putImageData(id, 0, 0);
  tc.globalCompositeOperation = 'source-over';
  
  // Cut main hole
  tc.globalCompositeOperation = 'destination-out';
  tc.beginPath();
  tc.arc(cx, cx, radius * hubRatio, 0, Math.PI * 2);
  tc.fill();
  tc.globalCompositeOperation = 'source-over';
  
  // Draw spokes - simple with subtle gradient
  const numSpokes = 6;
  for (let i = 0; i < numSpokes; i++) {
    const angle = (i / numSpokes) * Math.PI * 2;
    const spokeStart = radius * hubRatio * 0.38;
    const spokeEnd = radius * 0.58;
    
    const x1 = cx + Math.cos(angle) * spokeStart;
    const y1 = cx + Math.sin(angle) * spokeStart;
    const x2 = cx + Math.cos(angle) * spokeEnd;
    const y2 = cx + Math.sin(angle) * spokeEnd;
    
    // Subtle gradient - closer colors
    const spokeGrad = tc.createLinearGradient(x1, y1, x2, y2);
    spokeGrad.addColorStop(0, '#686870');
    spokeGrad.addColorStop(1, '#787880');
    
    tc.strokeStyle = spokeGrad;
    tc.lineWidth = 9;
    tc.lineCap = 'round';
    tc.beginPath();
    tc.moveTo(x1, y1);
    tc.lineTo(x2, y2);
    tc.stroke();
  }
  
  // Hub with depth - less contrast
  tc.beginPath();
  tc.arc(cx, cx, radius * hubRatio * 0.38, 0, Math.PI * 2);
  const hubGrad = tc.createRadialGradient(cx - radius * 0.05, cx - radius * 0.05, 0, cx, cx, radius * hubRatio * 0.38);
  hubGrad.addColorStop(0, '#888890');
  hubGrad.addColorStop(0.5, '#707078');
  hubGrad.addColorStop(1, '#606068');
  tc.fillStyle = hubGrad;
  tc.fill();
  tc.strokeStyle = 'rgba(30,30,40,0.7)';
  tc.lineWidth = 2;
  tc.stroke();
  
  // Center hole
  tc.globalCompositeOperation = 'destination-out';
  tc.beginPath();
  tc.arc(cx, cx, radius * hubRatio * 0.14, 0, Math.PI * 2);
  tc.fill();
  tc.globalCompositeOperation = 'source-over';
  
  // Hole inner shadow
  tc.beginPath();
  tc.arc(cx, cx, radius * hubRatio * 0.14, 0, Math.PI * 2);
  const holeGrad = tc.createRadialGradient(cx, cx, radius * hubRatio * 0.14, cx, cx, radius * hubRatio * 0.18);
  holeGrad.addColorStop(0, 'rgba(0,0,0,0.6)');
  holeGrad.addColorStop(1, 'rgba(0,0,0,0)');
  tc.strokeStyle = holeGrad;
  tc.lineWidth = 4;
  tc.stroke();
  
  gearCache.set(key, temp);
  return temp;
}

/* ---------- Render ---------- */
let t = 0;

gearCache.clear();

function draw() {
  const invH = 1 / h;
  const cs = Math.sin(t * 0.08) * 0.5 + 0.5;
  const bs = Math.cos(t * 0.06) * 0.5 + 0.5;
  
  for (let y = 0; y < h; y += 2) {
    const yNorm = (y - h / 2) * invH;
    const yy = yNorm * yNorm;
    for (let x = 0; x < w; x += 2) {
      const xNorm = (x - w / 2) * invH;
      const r = Math.sqrt(xNorm * xNorm + yy);
      const angle = r * 3 + t * 0.05;
      const zRe = xNorm * Math.cos(angle) - yNorm * Math.sin(angle);
      const zIm = xNorm * Math.sin(angle) + yNorm * Math.cos(angle);
      
      const e = Math.exp(-r * 1.5);
      const wRe = e * Math.cos(t * 0.15);
      const wIm = e * Math.sin(t * 0.15);
      
      const fRe = zRe * wRe - zIm * wIm;
      const fIm = zRe * wIm + zIm * wRe;
      
      const n = fbm(fRe * 3 + t * 0.025, fIm * 3);
      const stars = Math.pow(Math.max(0, 1 - r * 1.5), 5);
      const nebula = n * 1.8;
      
      // Deep space colors: purple, blue, pink
      const rVal = (nebula * 100 + stars * 220) * (0.5 + cs * 0.5);
      const gVal = (nebula * 40 + stars * 180) * (0.6 + cs * 0.2);
      const bVal = (nebula * 220 + stars * 255) * (0.85 + bs * 0.15);
      
      for (let dy = 0; dy < 2 && y + dy < h; dy++) {
        for (let dx = 0; dx < 2 && x + dx < w; dx++) {
          const i = ((y + dy) * w + (x + dx)) * 4;
          data[i] = rVal;
          data[i+1] = gVal;
          data[i+2] = bVal;
          data[i+3] = 255;
        }
      }
    }
  }
  
  ctx.putImageData(img, 0, 0);
  
  // Natural stars
  for (let i = 0; i < 500; i++) {
    const baseAngle = Math.abs(hash(i * 45.67, i * 89.12)) * Math.PI * 2;
    const baseDist = Math.pow(Math.abs(hash(i * 12.34, i * 56.78)), 0.8) * Math.min(w, h) * 0.5;
    
    const r = baseDist / (Math.min(w, h) * 0.5);
    const rotatedAngle = baseAngle + r * 3 + t * 0.05;
    
    const starX = w / 2 + Math.cos(rotatedAngle) * baseDist;
    const starY = h / 2 + Math.sin(rotatedAngle) * baseDist;
    
    const px = Math.floor(starX);
    const py = Math.floor(starY);
    if (px >= 0 && px < w && py >= 0 && py < h) {
      const idx = (py * w + px) * 4;
      const brightness = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
      
      if (brightness > 10) {
        const densityRatio = Math.pow(Math.max(0, brightness) / 255, 0.3);
        
        if (densityRatio > 0.15) {
          const randSize = Math.abs(hash(i * 23.45, i * 67.89));
          let size, intensity;
          
          // Natural size distribution
          if (randSize < 0.7) {
            size = 0.3 + randSize * 0.5; // Small stars
            intensity = 0.6 + randSize * 0.3;
          } else if (randSize < 0.95) {
            size = 0.8 + randSize * 0.8; // Medium stars
            intensity = 0.8 + randSize * 0.15;
          } else {
            size = 1.5 + randSize * 1.0; // Bright stars
            intensity = 0.95;
          }
          
          const twinkle = 0.75 + Math.sin(t * 0.3 + i * 0.5) * 0.25;
          const alpha = twinkle * densityRatio * intensity;
          
          // Simple point with soft glow
          ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
          ctx.beginPath();
          ctx.arc(starX, starY, size * 0.5, 0, Math.PI * 2);
          ctx.fill();
          
          // Soft glow
          const gradient = ctx.createRadialGradient(starX, starY, 0, starX, starY, size * 2);
          gradient.addColorStop(0, `rgba(255, 250, 255, ${alpha * 0.5})`);
          gradient.addColorStop(0.5, `rgba(230, 230, 255, ${alpha * 0.2})`);
          gradient.addColorStop(1, 'rgba(200, 200, 255, 0)');
          
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(starX, starY, size * 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  }
  
  const r1 = 50, r2 = 65, teeth1 = 18, teeth2 = 24;
  const centerDist = r1 + r2, ratio = teeth2 / teeth1;
  const offset = (3 * Math.PI) / (2 * teeth1);
  
  ctx.save();
  ctx.translate(w / 2, h / 2);
  ctx.rotate((25 + t * 4) * Math.PI / 180);
  
  const g1 = createGearCanvas(r1, teeth1, 0.12, 0.6);
  const g2 = createGearCanvas(r2, teeth2, 0.12, 0.6);
  
  // Shadow for gears
  ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
  ctx.shadowBlur = 15;
  ctx.shadowOffsetX = 3;
  ctx.shadowOffsetY = 3;
  
  ctx.save();
  ctx.translate(-centerDist / 2, 0);
  ctx.rotate(t * ratio);
  ctx.drawImage(g1, -g1.width / 2, -g1.height / 2);
  ctx.restore();
  
  ctx.save();
  ctx.translate(centerDist / 2, 0);
  ctx.rotate(-t + offset);
  ctx.drawImage(g2, -g2.width / 2, -g2.height / 2);
  ctx.restore();
  
  ctx.restore();
  
  t += 0.01;
  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
