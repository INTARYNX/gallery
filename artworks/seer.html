<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eye</title>
    <style>
        body {
            margin: 0;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 90vmin;
            height: 90vmin;
            max-width: 600px;
            max-height: 600px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const size = 600;
        canvas.width = size;
        canvas.height = size;
        const cx = size / 2, cy = size / 2;
        const iy = cy;

        const PHI = (1 + Math.sqrt(5)) / 2;
        const GOLDEN_ANGLE = Math.PI * 2 / (PHI * PHI);

        let time = 0;
        let mouseX = cx, mouseY = cy;
        let targetMX = cx, targetMY = cy;
        const irisR = 133;
        const eyeR = size * 0.48;

        // Twitch state
        let twitchX = 0, twitchY = 0;
        let nextTwitch = 2 + Math.random() * 4;

        canvas.addEventListener('mousemove', e => {
            const r = canvas.getBoundingClientRect();
            targetMX = (e.clientX - r.left) / r.width * size;
            targetMY = (e.clientY - r.top) / r.height * size;
        });
        canvas.addEventListener('mouseleave', () => { targetMX = cx; targetMY = cy; });

        const palettes = [
            { stops: ['#1a0808','#3a1010','#551818','#4a1212','#2a0808','#0a0404'], hueBase: 0, collarHue: 0 },
            { stops: ['#1a1008','#2a1a0a','#3a2510','#302010','#201008','#0a0804'], hueBase: 25, collarHue: 30 },
            { stops: ['#0a1a08','#1a3010','#2a4518','#223a14','#1a2a0a','#080a04'], hueBase: 100, collarHue: 80 },
            { stops: ['#1a1a20','#2a2a38','#3a3a50','#303040','#20202a','#0a0a10'], hueBase: 240, collarHue: 250 },
            { stops: ['#1a1008','#3a2008','#5a3010','#4a2808','#2a1808','#0a0804'], hueBase: 25, collarHue: 20 },
        ];
        const cycleDuration = 10;

        const crypts = Array.from({length: 55}, () => ({
            angle: Math.random() * Math.PI * 2,
            r: 45 + Math.random() * 75,
            size: 2 + Math.random() * 6,
            phase: Math.random() * Math.PI * 2
        }));

        const particles = Array.from({length: 60}, () => ({
            angle: Math.random() * Math.PI * 2,
            r: 45 + Math.random() * 78,
            speed: 0.0003 + Math.random() * 0.0008,
            size: 0.4 + Math.random() * 1.2,
            brightness: 10 + Math.random() * 25,
            phase: Math.random() * Math.PI * 2
        }));

        function lerpColor(a, b, t) {
            const pa = [parseInt(a.slice(1,3),16), parseInt(a.slice(3,5),16), parseInt(a.slice(5,7),16)];
            const pb = [parseInt(b.slice(1,3),16), parseInt(b.slice(3,5),16), parseInt(b.slice(5,7),16)];
            return `rgb(${Math.round(pa[0]+(pb[0]-pa[0])*t)},${Math.round(pa[1]+(pb[1]-pa[1])*t)},${Math.round(pa[2]+(pb[2]-pa[2])*t)})`;
        }

        function getCurrentPalette(t) {
            const total = palettes.length * cycleDuration;
            const pos = (t % total) / cycleDuration;
            const idx = Math.floor(pos);
            const frac = pos - idx;
            const smooth = frac * frac * (3 - 2 * frac);
            const a = palettes[idx % palettes.length];
            const b = palettes[(idx + 1) % palettes.length];
            return {
                stops: a.stops.map((c, i) => lerpColor(c, b.stops[i], smooth)),
                hueBase: a.hueBase + (b.hueBase - a.hueBase) * smooth,
                collarHue: a.collarHue + (b.collarHue - a.collarHue) * smooth,
            };
        }

        function drawEyeMask(openness) {
            const w = size * 0.38;
            const h = size * 0.49 * openness;
            const morphT = (time % (palettes.length * cycleDuration)) / (palettes.length * cycleDuration);
            const leftTilt = Math.sin(morphT * Math.PI * 4) * 0.06;
            const rightTilt = Math.sin(morphT * Math.PI * 4 + 1.5) * 0.04;
            const topH = h;
            const botH = h * 0.82;
            const yOff = (topH - botH) * 0.35;
            ctx.beginPath();
            ctx.moveTo(cx - w, iy + yOff);
            ctx.bezierCurveTo(cx - w * 0.45, iy + yOff - topH * (1 + leftTilt), cx + w * 0.45, iy + yOff - topH * (1 + rightTilt), cx + w, iy + yOff);
            ctx.bezierCurveTo(cx + w * 0.45, iy + yOff + botH * (1 - rightTilt), cx - w * 0.45, iy + yOff + botH * (1 - leftTilt), cx - w, iy + yOff);
            ctx.closePath();
        }

        function drawVeins() {
            const veins = [
                { a: -0.5, spread: 0.4, len: 0.95, branches: 4 },
                { a: 0.3, spread: 0.3, len: 0.93, branches: 3 },
                { a: 2.4, spread: 0.35, len: 0.9, branches: 4 },
                { a: -2.8, spread: 0.25, len: 0.88, branches: 3 },
                { a: 1.6, spread: 0.3, len: 0.92, branches: 3 },
                { a: -1.5, spread: 0.2, len: 0.89, branches: 3 },
                { a: 0.8, spread: 0.35, len: 0.91, branches: 3 },
                { a: -1.0, spread: 0.3, len: 0.87, branches: 2 },
                { a: 2.0, spread: 0.25, len: 0.93, branches: 3 },
            ];
            veins.forEach((v, vi) => {
                for (let b = 0; b < v.branches; b++) {
                    const ba = v.a + (b - v.branches/2) * v.spread * 0.3;
                    const throb = Math.sin(time * 1.5 + vi * 0.7) * 0.08;
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(200, 40, 30, ${0.22 + throb + Math.sin(vi + time * 0.3) * 0.06})`;
                    ctx.lineWidth = 1.5 - b * 0.25;
                    const startR = irisR + 8;
                    const endR = eyeR * v.len;
                    for (let r = startR; r < endR; r += 2) {
                        const t = (r - startR) / (endR - startR);
                        const wobble = Math.sin(r * 0.08 + vi * 3 + time * 0.5) * 6 * t;
                        const branch = Math.sin(r * 0.03 + b * 4) * 10 * t * t;
                        const a = ba + (wobble + branch) * 0.01;
                        const x = cx + Math.cos(a) * r;
                        const y = iy + Math.sin(a) * r;
                        r === startR ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                }
            });
        }

        const cellSize = 60;
        const geoCols = Math.ceil(size / cellSize) + 2;
        const geoRows = Math.ceil(size / cellSize) + 2;

        function drawGeoGrid(color, alphaBase) {
            const geoTime = time * 0.3;
            const scrollY = geoTime * 10;
            const baseRow = Math.floor(scrollY / cellSize);
            const fracY = scrollY - baseRow * cellSize;

            for (let row = -1; row < geoRows; row++) {
                for (let col = -1; col < geoCols; col++) {
                    const x = col * cellSize;
                    const y = row * cellSize - fracY;
                    const cxG = x + cellSize / 2;
                    const cyG = y + cellSize / 2;
                    const gc = col;
                    const gr = row + baseRow;
                    const hash = (Math.sin(gc * 127.1 + gr * 311.7) * 43758.5453) % 1;
                    const pattern = Math.abs(hash);
                    const pulse = Math.sin(geoTime * 2 + (gc + gr) * 0.5) * 0.15 + 0.85;
                    const alpha = pulse * alphaBase;
                    if (alpha < 0.01) continue;

                    const isWhite = color === 'white';
                    const strokeA = alpha;
                    const fillA = alpha * 0.45;
                    ctx.strokeStyle = isWhite ? `rgba(255,255,255,${strokeA})` : `rgba(0,0,0,${strokeA})`;
                    ctx.fillStyle = isWhite ? `rgba(255,255,255,${fillA})` : `rgba(0,0,0,${fillA})`;
                    ctx.lineWidth = 1;

                    if (pattern < 0.2) {
                        const s = cellSize * 0.35;
                        const rot = geoTime + (gc + gr) * 0.3;
                        ctx.beginPath();
                        for (let i = 0; i < 3; i++) {
                            const a = rot + (i / 3) * Math.PI * 2 - Math.PI / 2;
                            i === 0 ? ctx.moveTo(cxG + Math.cos(a) * s, cyG + Math.sin(a) * s) : ctx.lineTo(cxG + Math.cos(a) * s, cyG + Math.sin(a) * s);
                        }
                        ctx.closePath(); ctx.fill(); ctx.stroke();
                    } else if (pattern < 0.4) {
                        const r = cellSize * 0.25 * (0.7 + Math.sin(geoTime + gc + gr) * 0.3);
                        ctx.beginPath(); ctx.arc(cxG, cyG, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                    } else if (pattern < 0.6) {
                        const s = cellSize * 0.3;
                        const rot = -geoTime * 0.5;
                        ctx.beginPath();
                        for (let i = 0; i < 4; i++) {
                            const a = rot + (i / 4) * Math.PI * 2;
                            i === 0 ? ctx.moveTo(cxG + Math.cos(a) * s, cyG + Math.sin(a) * s) : ctx.lineTo(cxG + Math.cos(a) * s, cyG + Math.sin(a) * s);
                        }
                        ctx.closePath(); ctx.fill(); ctx.stroke();
                    } else if (pattern < 0.8) {
                        const s = cellSize * 0.25;
                        ctx.beginPath();
                        ctx.moveTo(cxG - s, cyG); ctx.lineTo(cxG + s, cyG);
                        ctx.moveTo(cxG, cyG - s); ctx.lineTo(cxG, cyG + s);
                        ctx.stroke();
                    } else {
                        const s = cellSize * 0.28;
                        const rot = geoTime * 0.7;
                        ctx.beginPath();
                        for (let i = 0; i < 6; i++) {
                            const a = rot + (i / 6) * Math.PI * 2;
                            i === 0 ? ctx.moveTo(cxG + Math.cos(a) * s, cyG + Math.sin(a) * s) : ctx.lineTo(cxG + Math.cos(a) * s, cyG + Math.sin(a) * s);
                        }
                        ctx.closePath(); ctx.fill(); ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            time += 0.012;
            mouseX += (targetMX - mouseX) * 0.06;
            mouseY += (targetMY - mouseY) * 0.06;

            // Random twitches
            nextTwitch -= 0.012;
            if (nextTwitch <= 0) {
                twitchX = (Math.random() - 0.5) * 12;
                twitchY = (Math.random() - 0.5) * 8;
                nextTwitch = 1.5 + Math.random() * 5;
            }
            twitchX *= 0.92;
            twitchY *= 0.92;

            const dx = mouseX - cx, dy = mouseY - iy;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const maxShift = 18;
            const shift = Math.min(dist / size * 80, maxShift);
            const ang = Math.atan2(dy, dx);
            const pupilCX = cx + Math.cos(ang) * shift + twitchX;
            const pupilCY = iy + Math.sin(ang) * shift + twitchY;

            // Erratic blink
            const blinkCycle = time % 5;
            let openness = 0.62;
            if (blinkCycle > 4.5 && blinkCycle < 4.65) {
                openness *= 1 - Math.sin(((blinkCycle - 4.5) / 0.15) * Math.PI);
            }
            // Double blink sometimes
            if (blinkCycle > 4.75 && blinkCycle < 4.85) {
                openness *= 1 - Math.sin(((blinkCycle - 4.75) / 0.1) * Math.PI) * 0.7;
            }
            // Narrow squint
            const squint = Math.sin(time * 0.4) * 0.08;
            openness *= (1 - squint);

            const pal = getCurrentPalette(time);

            // Clear
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, size, size);

            // Background geo grid
            ctx.save();
            drawGeoGrid('white', 1.0);
            ctx.restore();

            // Rotation
            const rotT = (time % (palettes.length * cycleDuration)) / (palettes.length * cycleDuration);
            const eyeRotation = Math.sin(rotT * Math.PI * 2) * 0.04 + Math.sin(rotT * Math.PI * 4) * 0.02;

            // Clip to eyelid
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(eyeRotation);
            ctx.translate(-cx, -cy);
            drawEyeMask(openness);
            ctx.clip();

            // Sclera — sickly yellowish
            const sclera = ctx.createRadialGradient(cx - 20, iy - 15, 0, cx, iy, eyeR);
            sclera.addColorStop(0, '#e8dcc0');
            sclera.addColorStop(0.3, '#ddd0b0');
            sclera.addColorStop(0.5, '#d0c0a0');
            sclera.addColorStop(0.75, '#c0a888');
            sclera.addColorStop(1, '#907060');
            ctx.beginPath();
            ctx.arc(cx, iy, eyeR, 0, Math.PI * 2);
            ctx.fillStyle = sclera;
            ctx.fill();

            // Irritation — reddish edges
            const irritation = ctx.createRadialGradient(cx, iy, eyeR * 0.5, cx, iy, eyeR);
            irritation.addColorStop(0, 'rgba(0,0,0,0)');
            irritation.addColorStop(0.6, 'rgba(120,30,20,0.08)');
            irritation.addColorStop(0.85, 'rgba(150,30,20,0.2)');
            irritation.addColorStop(1, 'rgba(100,20,15,0.35)');
            ctx.fillStyle = irritation;
            ctx.fillRect(0, 0, size, size);

            drawVeins();

            // Geo grid in sclera (black)
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, iy, eyeR, 0, Math.PI * 2);
            ctx.arc(cx, iy, irisR + 2, 0, Math.PI * 2, true);
            ctx.clip();
            drawGeoGrid('black', 1.0);
            ctx.restore();

            // Iris shadow
            const irisShadow = ctx.createLinearGradient(cx, iy - irisR, cx, iy - irisR * 0.3);
            irisShadow.addColorStop(0, 'rgba(0,0,0,0.4)');
            irisShadow.addColorStop(1, 'rgba(0,0,0,0)');

            // Iris
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, iy, irisR, 0, Math.PI * 2);
            ctx.clip();

            const ig = ctx.createRadialGradient(pupilCX, pupilCY, 5, cx, iy, irisR);
            ig.addColorStop(0, pal.stops[0]);
            ig.addColorStop(0.25, pal.stops[1]);
            ig.addColorStop(0.45, pal.stops[2]);
            ig.addColorStop(0.65, pal.stops[3]);
            ig.addColorStop(0.82, pal.stops[4]);
            ig.addColorStop(1, pal.stops[5]);
            ctx.fillStyle = ig;
            ctx.fillRect(cx - irisR, iy - irisR, irisR * 2, irisR * 2);

            // Fibers — more chaotic
            for (let i = 0; i < 400; i++) {
                const a = i * GOLDEN_ANGLE + time * 0.05;
                const rStart = 32 + Math.sin(i * 0.8) * 8;
                const rEnd = irisR * (0.72 + Math.sin(i * 0.3 + time * 0.3) * 0.22);
                const hue = pal.hueBase + Math.sin(i * 0.15 + time * 0.2) * 50;
                const sat = 50 + Math.sin(i * 0.7) * 25;
                const light = 20 + Math.sin(i * 0.4 + time * 0.5) * 15;
                const alpha = 0.15 + Math.sin(i * 0.6 + time * 0.8) * 0.08;
                ctx.strokeStyle = `hsla(${hue}, ${sat}%, ${light}%, ${alpha})`;
                ctx.lineWidth = 0.6 + Math.sin(i * 1.2) * 0.4;
                ctx.beginPath();
                for (let r = rStart; r < rEnd; r += 1.5) {
                    const wobble = Math.sin(r * 0.12 + i * 0.5 + time) * 3.5;
                    const micro = Math.sin(r * 0.4 + i * 3) * 1.2;
                    const x = cx + Math.cos(a + (wobble + micro) * 0.018) * r;
                    const y = iy + Math.sin(a + (wobble + micro) * 0.018) * r;
                    r === rStart ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            // Crypts — darker, more prominent
            crypts.forEach(c => {
                const pulse = Math.sin(time * 0.6 + c.phase) * 2;
                const x = cx + Math.cos(c.angle + time * 0.01) * c.r;
                const y = iy + Math.sin(c.angle + time * 0.01) * c.r;
                const g = ctx.createRadialGradient(x, y, 0, x, y, c.size + pulse);
                g.addColorStop(0, 'rgba(0,0,0,0.55)');
                g.addColorStop(0.5, 'rgba(10,0,0,0.25)');
                g.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.beginPath();
                ctx.arc(x, y, c.size + pulse + 3, 0, Math.PI * 2);
                ctx.fillStyle = g;
                ctx.fill();
            });

            // Particles
            particles.forEach(p => {
                p.angle += p.speed;
                const pulse = 0.6 + Math.sin(time * 2 + p.phase) * 0.4;
                const x = cx + Math.cos(p.angle) * p.r;
                const y = iy + Math.sin(p.angle) * p.r;
                ctx.fillStyle = `hsla(${pal.hueBase + 30}, 60%, ${p.brightness}%, ${0.25 * pulse})`;
                ctx.beginPath();
                ctx.arc(x, y, p.size * pulse, 0, Math.PI * 2);
                ctx.fill();
            });

            // Contraction furrows
            for (let ring = 0; ring < 3; ring++) {
                const baseR = 70 + ring * 22;
                ctx.strokeStyle = `rgba(0,0,0,${0.1 - ring * 0.02})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                for (let a = 0; a < Math.PI * 2; a += 0.02) {
                    const wobble = Math.sin(a * 20 + ring * 2 + time * 0.3) * 2 + Math.sin(a * 8 + time * 0.5) * 1.5;
                    const r = baseR + wobble;
                    a === 0 ? ctx.moveTo(cx + Math.cos(a) * r, iy + Math.sin(a) * r) : ctx.lineTo(cx + Math.cos(a) * r, iy + Math.sin(a) * r);
                }
                ctx.closePath(); ctx.stroke();
            }

            // Collarette
            const colR = 53;
            ctx.beginPath();
            for (let a = 0; a < Math.PI * 2; a += 0.015) {
                const tooth = ((Math.sin(a * 28) > 0) ? 1 : -1) * 2.5;
                const noise = Math.sin(a * 7.3 + 1.2) * 1.8 + Math.sin(a * 13.7 + 0.5) * 1.2;
                const r = colR + tooth + noise;
                a === 0 ? ctx.moveTo(cx + Math.cos(a) * r, iy + Math.sin(a) * r) : ctx.lineTo(cx + Math.cos(a) * r, iy + Math.sin(a) * r);
            }
            ctx.closePath();
            ctx.strokeStyle = `hsla(${pal.collarHue}, 35%, 50%, 0.2)`;
            ctx.lineWidth = 0.8;
            ctx.stroke();
            ctx.beginPath();
            for (let a = 0; a < Math.PI * 2; a += 0.015) {
                const tooth = ((Math.sin(a * 28 + 0.5) > 0) ? 1 : -1) * 1;
                const noise = Math.sin(a * 9.1 + 3.0) * 1 + Math.sin(a * 17.3) * 0.5;
                const r = colR - 2 + tooth + noise;
                a === 0 ? ctx.moveTo(cx + Math.cos(a) * r, iy + Math.sin(a) * r) : ctx.lineTo(cx + Math.cos(a) * r, iy + Math.sin(a) * r);
            }
            ctx.closePath();
            ctx.strokeStyle = `hsla(${pal.collarHue + 10}, 25%, 38%, 0.12)`;
            ctx.lineWidth = 0.6;
            ctx.stroke();

            // Limbal ring — thicker, darker
            const limbal = ctx.createRadialGradient(cx, iy, irisR * 0.72, cx, iy, irisR);
            limbal.addColorStop(0, 'rgba(0,0,0,0)');
            limbal.addColorStop(0.4, 'rgba(5,5,0,0.3)');
            limbal.addColorStop(0.75, 'rgba(5,5,0,0.6)');
            limbal.addColorStop(1, 'rgba(0,0,0,0.9)');
            ctx.fillStyle = limbal;
            ctx.fillRect(cx - irisR, iy - irisR, irisR * 2, irisR * 2);

            ctx.restore(); // end iris clip

            // Geo grid in iris
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, iy, irisR - 1, 0, Math.PI * 2);
            ctx.clip();
            drawGeoGrid('white', 0.4);
            ctx.restore();

            // Limbal ring stroke
            ctx.beginPath();
            ctx.arc(cx, iy, irisR, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.85)';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Pupil — irregular edges
            const pupilR = 22 + Math.sin(time * 0.6) * 4;
            ctx.beginPath();
            for (let a = 0; a < Math.PI * 2; a += 0.03) {
                const irregularity = Math.sin(a * 5 + time * 0.2) * 1.5 + Math.sin(a * 11 + 0.7) * 1;
                const r = pupilR + irregularity;
                const x = pupilCX + Math.cos(a) * r;
                const y = pupilCY + Math.sin(a) * r;
                a === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            }
            ctx.closePath();
            const pg = ctx.createRadialGradient(pupilCX, pupilCY, 0, pupilCX, pupilCY, pupilR + 5);
            pg.addColorStop(0, '#000000');
            pg.addColorStop(0.7, '#020101');
            pg.addColorStop(1, 'rgba(5,2,2,0.7)');
            ctx.fillStyle = pg;
            ctx.fill();

            // Faint red glow from pupil
            const pupilGlow = ctx.createRadialGradient(pupilCX, pupilCY, pupilR * 0.3, pupilCX, pupilCY, pupilR * 2.5);
            const glowPulse = Math.sin(time * 1.2) * 0.03 + 0.04;
            pupilGlow.addColorStop(0, `rgba(180, 20, 10, ${glowPulse})`);
            pupilGlow.addColorStop(0.5, `rgba(120, 10, 5, ${glowPulse * 0.5})`);
            pupilGlow.addColorStop(1, 'rgba(80, 5, 0, 0)');
            ctx.beginPath();
            ctx.arc(pupilCX, pupilCY, pupilR * 2.5, 0, Math.PI * 2);
            ctx.fillStyle = pupilGlow;
            ctx.fill();

            // Iris shadow
            ctx.beginPath();
            ctx.arc(cx, iy, irisR, 0, Math.PI * 2);
            ctx.fillStyle = irisShadow;
            ctx.fill();

            // Specular highlight — dimmer, colder
            const hlX = pupilCX - 25, hlY = pupilCY - 30;
            ctx.beginPath();
            ctx.ellipse(hlX, hlY, 16, 11, -0.2, 0, Math.PI * 2);
            const mainRef = ctx.createRadialGradient(hlX, hlY, 0, hlX, hlY, 16);
            mainRef.addColorStop(0, 'rgba(220,225,235,0.75)');
            mainRef.addColorStop(0.3, 'rgba(200,210,225,0.5)');
            mainRef.addColorStop(0.6, 'rgba(180,190,210,0.2)');
            mainRef.addColorStop(1, 'rgba(160,170,200,0)');
            ctx.fillStyle = mainRef;
            ctx.fill();

            const hl2X = pupilCX + 22, hl2Y = pupilCY + 25;
            ctx.beginPath();
            ctx.ellipse(hl2X, hl2Y, 5, 3, 0.5, 0, Math.PI * 2);
            const secRef = ctx.createRadialGradient(hl2X, hl2Y, 0, hl2X, hl2Y, 5);
            secRef.addColorStop(0, 'rgba(200,210,225,0.35)');
            secRef.addColorStop(1, 'rgba(180,190,210,0)');
            ctx.fillStyle = secRef;
            ctx.fill();

            ctx.restore(); // end eyelid clip

            // Dark vignette
            const vig = ctx.createRadialGradient(cx, cy, size * 0.15, cx, cy, size * 0.55);
            vig.addColorStop(0, 'rgba(0,0,0,0)');
            vig.addColorStop(1, 'rgba(0,0,0,0.6)');
            ctx.fillStyle = vig;
            ctx.fillRect(0, 0, size, size);

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
