<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tri-Angular Harmony</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Dimensions
const maxWidth = Math.min(window.innerWidth * 0.9, 1200);
const aspectRatio = 0.75;
canvas.width = Math.max(1, Math.floor(maxWidth));
canvas.height = Math.max(1, Math.floor(maxWidth * aspectRatio));

const W = canvas.width;
const H = canvas.height;
const CX = W / 2;
const CY = H / 2;

// Scale proportionnel
const scale = H / 900;

// Canvas offscreen pour le plasma
const plasmaCanvas = document.createElement("canvas");
plasmaCanvas.width = W;
plasmaCanvas.height = H;
const pCtx = plasmaCanvas.getContext("2d");
let plasmaData = pCtx.createImageData(W, H);

// pré-calc sin/cos pour un cycle
const SIN = new Float32Array(10000);
for (let i = 0; i < SIN.length; i++) SIN[i] = Math.sin(i * 0.001);

// ------------------------------------------------------------
// PLASMA OPTIMISÉ
// ------------------------------------------------------------
function drawPlasma(time) {
    const data = plasmaData.data;
    const t1 = time * 0.05;
    const t2 = time * 0.03;
    const t3 = time * 0.04;
    const t4 = time * 0.02;

    let index = 0;

    for (let y = 0; y < H; y += 6) {
        for (let x = 0; x < W; x += 6) {

            const v =
                Math.sin(x * 0.01 + t1) +
                Math.sin(y * 0.01 + t2) +
                Math.sin((x + y) * 0.008 + t3) +
                Math.sin(Math.sqrt(x * x + y * y) * 0.01 + t4);

            const n = (v + 4) / 8;
            const p = n * Math.PI * 2;

            const r = Math.sin(p) * 127 + 128;
            const g = Math.sin(p + 2.094) * 127 + 128;
            const b = Math.sin(p + 4.188) * 127 + 128;

            for (let dy = 0; dy < 6; dy++) {
                const yy = y + dy;
                if (yy >= H) continue;

                for (let dx = 0; dx < 6; dx++) {
                    const xx = x + dx;
                    if (xx >= W) continue;

                    index = (yy * W + xx) * 4;
                    data[index] = r * 0.3;
                    data[index+1] = g * 0.3;
                    data[index+2] = b * 0.3;
                    data[index+3] = 255;
                }
            }
        }
    }
    pCtx.putImageData(plasmaData, 0, 0);
    ctx.drawImage(plasmaCanvas, 0, 0);
}

// ------------------------------------------------------------
// RAYONS
// ------------------------------------------------------------
function drawRays(time) {
    const n = 24;
    for (let i = 0; i < n; i++) {
        const angle = (i / n) * Math.PI * 2;
        const offset = (time * 5 + i * 0.5) % (650 * scale);

        const x1 = CX + Math.cos(angle) * offset;
        const y1 = CY + Math.sin(angle) * offset;
        const x2 = CX + Math.cos(angle) * (offset + 156 * scale);
        const y2 = CY + Math.sin(angle) * (offset + 156 * scale);

        const alpha = 1 - offset / (650 * scale);
        const hue = (time * 50 + i * 15) % 360;

        ctx.strokeStyle = `hsla(${hue}, 80%, 60%, ${alpha * 0.5})`;
        ctx.lineWidth = 3.25 * scale;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
    }
}

// ------------------------------------------------------------
// CERCLES
// ------------------------------------------------------------
function drawCircles(time) {
    for (let i = 0; i < 8; i++) {
        const radius = (time * 3 + i * 78 * scale) % (650 * scale);
        const alpha = 1 - radius / (650 * scale);
        const hue = (time * 30 + i * 45) % 360;

        ctx.strokeStyle = `hsla(${hue}, 80%, 60%, ${alpha * 0.4})`;
        ctx.lineWidth = 2.6 * scale;
        ctx.beginPath();
        ctx.arc(CX, CY, radius, 0, Math.PI * 2);
        ctx.stroke();
    }
}

// ------------------------------------------------------------
// TEXTE
// ------------------------------------------------------------
function drawText(time) {
    const fontSize = W * 0.12;
    ctx.font = `bold ${fontSize}px monospace`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    const offset = fontSize * 0.0625;
    
    ctx.fillStyle = "rgba(0,255,255,0.6)";
    ctx.fillText("INTARYNX", CX - offset, CY - offset);

    ctx.fillStyle = "rgba(255,0,255,0.6)";
    ctx.fillText("INTARYNX", CX + offset, CY + offset);

    ctx.shadowColor = "#030";
    ctx.shadowBlur = fontSize * 0.6;
    ctx.fillStyle = "#030";
    ctx.fillText("INTARYNX", CX, CY);

    ctx.shadowBlur = 0;

    ctx.strokeStyle = "rgba(0,0,0,0.8)";
    ctx.lineWidth = fontSize * 0.0625;
    ctx.strokeText("INTARYNX", CX, CY);
}

// ------------------------------------------------------------
// SCANLINES
// ------------------------------------------------------------
function drawScanlines() {
    ctx.fillStyle = "rgba(0,0,0,0.15)";
    for (let y = 0; y < H; y += 4) {
        ctx.fillRect(0, y, W, 1);
    }
}

// ------------------------------------------------------------
// BLOOM HORIZONTAL
// ------------------------------------------------------------
function drawBloom() {
    const image = ctx.getImageData(0, 0, W, H);
    const d = image.data;
    const shift = 6;

    for (let y = 0; y < H; y++) {
        for (let x = W - 1; x >= shift; x--) {
            const i = (y * W + x) * 4;
            const prev = i - shift * 4;
            d[i]   = Math.max(d[i],   d[prev] * 0.7);
            d[i+1] = Math.max(d[i+1], d[prev+1] * 0.7);
            d[i+2] = Math.max(d[i+2], d[prev+2] * 0.7);
        }
    }
    ctx.putImageData(image, 0, 0);
}

// ------------------------------------------------------------
// PAPILLON
// ------------------------------------------------------------
// ------------------------------------------------------------
// TRIANGLES
// ------------------------------------------------------------
function drawButterfly(time) {
    drawPlasma(time);
    drawCircles(time);
    drawRays(time);

    const layers = 30;
    const size = 300 * scale;

    // Triangle 1 - Pointing up
    for (let i = 0; i < layers; i++) {
        const t = i / layers;
        const s = size * (0.5 + t * 0.5);
        const rot1 = time * 0.02;

        ctx.save();
        ctx.translate(CX, CY - 100 * scale);
        ctx.rotate(rot1);

        const alpha = 0.15 + t * 0.25;
        const hue = (time * 30 + i * 12) % 360;
        ctx.strokeStyle = `hsla(${hue}, 80%, 60%, ${alpha})`;
        ctx.lineWidth = (2.6 - t * 1.3) * scale;

        ctx.beginPath();
        ctx.moveTo(0, -s * 0.577);
        ctx.lineTo(s * 0.5, s * 0.289);
        ctx.lineTo(-s * 0.5, s * 0.289);
        ctx.closePath();
        ctx.stroke();

        ctx.restore();
    }

    // Triangle 2 - Pointing down-right
    for (let i = 0; i < layers; i++) {
        const t = i / layers;
        const s = size * (0.5 + t * 0.5);
        const rot2 = time * 0.03 + Math.PI * 2 / 3;

        ctx.save();
        ctx.translate(CX + 80 * scale, CY + 60 * scale);
        ctx.rotate(rot2);

        const alpha = 0.15 + t * 0.25;
        const hue = (time * 30 + i * 12 + 120) % 360;
        ctx.strokeStyle = `hsla(${hue}, 80%, 60%, ${alpha})`;
        ctx.lineWidth = (2.6 - t * 1.3) * scale;

        ctx.beginPath();
        ctx.moveTo(0, -s * 0.577);
        ctx.lineTo(s * 0.5, s * 0.289);
        ctx.lineTo(-s * 0.5, s * 0.289);
        ctx.closePath();
        ctx.stroke();

        ctx.restore();
    }

    // Triangle 3 - Pointing down-left
    for (let i = 0; i < layers; i++) {
        const t = i / layers;
        const s = size * (0.5 + t * 0.5);
        const rot3 = time * 0.025 + Math.PI * 4 / 3;

        ctx.save();
        ctx.translate(CX - 80 * scale, CY + 60 * scale);
        ctx.rotate(rot3);

        const alpha = 0.15 + t * 0.25;
        const hue = (time * 30 + i * 12 + 240) % 360;
        ctx.strokeStyle = `hsla(${hue}, 80%, 60%, ${alpha})`;
        ctx.lineWidth = (2.6 - t * 1.3) * scale;

        ctx.beginPath();
        ctx.moveTo(0, -s * 0.577);
        ctx.lineTo(s * 0.5, s * 0.289);
        ctx.lineTo(-s * 0.5, s * 0.289);
        ctx.closePath();
        ctx.stroke();

        ctx.restore();
    }
}

// ------------------------------------------------------------
// BOUCLE ANIMATION
// ------------------------------------------------------------
let frame = 0;
function animate() {
    const time = frame * 0.5;

    drawButterfly(time);
    drawText(time);
    drawScanlines();
    drawBloom();

    frame++;
    requestAnimationFrame(animate);
}
animate();
    </script>
</body>
</html>
