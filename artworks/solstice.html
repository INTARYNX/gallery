<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winter Solstice</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0f1f;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    width: 100vw;
  }
  canvas {
    display: block;
    max-width: 100vmin;
    max-height: 100vmin;
    width: 100vmin;
    height: 100vmin;
    border-radius: 20px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false });

const rand = (a, b) => Math.random() * (b - a) + a;

let points = [];
let ambientSnow = [];
let w, h;
let time = 0;
let falling = false;
let fallTime = 0;
let morphCount = 0;
let lastMorphState = 0;
let frameCount = 0;
let sortedPoints = [];

function resize() {
  const size = Math.min(window.innerWidth, window.innerHeight);
  canvas.width = size;
  canvas.height = size;
  init();
}

function init() {
  w = canvas.width;
  h = canvas.height;
  
  points = [];
  const cubeSize = 120;
  
  for (let i = 0; i < 1500; i++) {
    const colorType = Math.random();
    let color = "#ffffff";
    if (colorType < 0.05) color = "#e8f4ff";
    else if (colorType < 0.10) color = "#fff8e8";
    
    points.push({
      x: rand(-cubeSize, cubeSize),
      y: rand(-cubeSize, cubeSize),
      z: rand(-cubeSize, cubeSize),
      r: rand(1, 3),
      a: rand(0.5, 1),
      startX: rand(-w/2, w/2),
      startY: rand(-h, -200),
      fallSpeed: rand(1, 3),
      currentY: null,
      color
    });
  }
  
  ambientSnow = [];
  for (let i = 0; i < 100; i++) {
    const colorType = Math.random();
    let color = "#ffffff";
    if (colorType < 0.05) color = "#e8f4ff";
    else if (colorType < 0.10) color = "#fff8e8";
    
    ambientSnow.push({
      x: Math.random() * w,
      y: Math.random() * h,
      r: rand(0.8, 2),
      vy: rand(0.5, 1.5),
      vx: rand(-0.3, 0.3),
      a: rand(0.4, 0.8),
      color
    });
  }
}

function rotateX(x, y, z, angle) {
  const cos = Math.cos(angle);
  const sin = Math.sin(angle);
  return { x, y: y * cos - z * sin, z: y * sin + z * cos };
}

function rotateY(x, y, z, angle) {
  const cos = Math.cos(angle);
  const sin = Math.sin(angle);
  return { x: x * cos + z * sin, y, z: -x * sin + z * cos };
}

function rotateZ(x, y, z, angle) {
  const cos = Math.cos(angle);
  const sin = Math.sin(angle);
  return { x: x * cos - y * sin, y: x * sin + y * cos, z };
}

function project(x, y, z) {
  const scale = 600 / (600 + z);
  return {
    x: x * scale + w / 2,
    y: y * scale + h / 2 - 50,
    scale
  };
}

function animate() {
  time += 1/60;
  frameCount++;
  
  const angleX = time * 0.3;
  const angleY = time * 0.42;
  const angleZ = time * 0.18;
  
  const morphStart = Math.max(0, time - 7);
  let morphFactor = Math.sin(morphStart * 0.6) * 0.5 + 0.5;
  
  if (falling) morphFactor = 1;
  
  if (morphFactor > 0.95 && lastMorphState < 0.95) morphCount++;
  lastMorphState = morphFactor;
  
  if (!falling && morphCount >= 2) {
    falling = true;
    fallTime = 0;
  }
  
  if (falling) fallTime++;
  
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, "#0a1428");
  grad.addColorStop(0.5, "#1a2845");
  grad.addColorStop(1, "#2d4a6e");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
  
  const groundGrad = ctx.createLinearGradient(0, h * 0.85, 0, h);
  groundGrad.addColorStop(0, "#e8f0f8");
  groundGrad.addColorStop(0.3, "#f5f8fb");
  groundGrad.addColorStop(1, "#ffffff");
  ctx.fillStyle = groundGrad;
  
  ctx.beginPath();
  ctx.moveTo(0, h);
  ctx.lineTo(0, h * 0.85);
  for (let x = 0; x <= w; x += 15) {
    const wave = Math.sin(x * 0.015) * 8 + Math.sin(x * 0.04) * 3;
    ctx.lineTo(x, h * 0.85 + wave);
  }
  ctx.lineTo(w, h);
  ctx.closePath();
  ctx.fill();
  
  ctx.fillStyle = "rgba(200, 220, 240, 0.3)";
  for (let i = 0; i < 5; i++) {
    const x = (i / 5) * w + Math.sin(time * 0.1 + i) * 20;
    const y = h * 0.85 + Math.sin(x * 0.015) * 8;
    ctx.beginPath();
    ctx.ellipse(x, y + 10, 80, 15, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  
  for (const s of ambientSnow) {
    s.y += s.vy;
    s.x += s.vx;
    
    if (s.y > h) {
      s.y = -10;
      s.x = Math.random() * w;
    }
    if (s.x < 0) s.x = w;
    if (s.x > w) s.x = 0;
    
    ctx.globalAlpha = s.a;
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  
  points.forEach(p => {
    if (!falling) {
      const formProgress = Math.min(time / 5, 1);
      const formEase = 1 - Math.pow(1 - formProgress, 3);
      
      if (!p.currentY) p.currentY = p.startY;
      if (formProgress < 0.8) p.currentY += p.fallSpeed;
      
      const sphereRadius = 120;
      const theta = Math.atan2(p.y, p.x);
      const phi = Math.acos(p.z / Math.sqrt(p.x * p.x + p.y * p.y + p.z * p.z));
      
      const sphereX = sphereRadius * Math.sin(phi) * Math.cos(theta);
      const sphereY = sphereRadius * Math.sin(phi) * Math.sin(theta);
      const sphereZ = sphereRadius * Math.cos(phi);
      
      const mx = p.x + (sphereX - p.x) * morphFactor;
      const my = p.y + (sphereY - p.y) * morphFactor;
      const mz = p.z + (sphereZ - p.z) * morphFactor;
      
      let rot = rotateX(mx, my, mz, angleX);
      rot = rotateY(rot.x, rot.y, rot.z, angleY);
      rot = rotateZ(rot.x, rot.y, rot.z, angleZ);
      
      const finalX = p.startX + (rot.x - p.startX) * formEase;
      const finalY = p.currentY + (rot.y - p.currentY) * formEase;
      const finalZ = rot.z * formEase;
      
      p.posX = finalX;
      p.posY = finalY;
      p.posZ = finalZ;
    } else {
      if (!p.fallInit) {
        p.fallInit = true;
        p.swirl = rand(0, Math.PI * 2);
        p.swirlSpeed = rand(0.02, 0.05);
        p.drift = rand(-0.3, 0.3);
        p.naturalFallSpeed = rand(0.8, 1.5);
      }
      
      p.swirl += p.swirlSpeed;
      
      const windStart = Math.max(0, fallTime - 180);
      const windStrength = Math.min(windStart / 60, 1);
      const windForce = Math.pow(windStrength, 2) * 15;
      const uplift = windStrength * 2;
      
      p.posX += Math.sin(p.swirl) * 1.2 + p.drift;
      p.posY += p.naturalFallSpeed - uplift;
      p.posZ += Math.cos(p.swirl) * 0.8 - windForce;
      
      p.r *= 0.998;
    }
  });
  
  if (frameCount % 3 === 0) {
    sortedPoints = points.map(p => {
    let finalPos = { x: p.posX, y: p.posY, z: p.posZ }
    
    const projected = project(finalPos.x, finalPos.y, finalPos.z);
    
    return {
      x: projected.x,
      y: projected.y,
      r: p.r * projected.scale,
      a: p.a * projected.scale,
      z: finalPos.z,
      color: p.color
    };
  }).sort((a, b) => a.z - b.z);
  }
  
  const textProgress = Math.min((fallTime - 250) / 120, 1);
  
  for (const p of sortedPoints) {
    if (p.y > h * 0.85 + 50) continue;
    if (falling && Math.random() > 0.85) continue;
    
    if (falling && textProgress > 0.15) {
      const dx = p.x - w/2;
      const dy = p.y - h/2;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const maxRadius = 200 * textProgress;
      
      if (dist < maxRadius && Math.random() > dist / maxRadius) continue;
    }
    
    const sparkle = 1 + Math.sin(fallTime * 0.2 + p.z) * 0.3;
    ctx.globalAlpha = p.a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(0.1, p.r * sparkle), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  
  if (falling && fallTime > 250) {
    const fadeIn = Math.min((fallTime - 250) / 120, 1);
    const textEase = fadeIn < 0.5 ? 2 * fadeIn * fadeIn : 1 - Math.pow(-2 * fadeIn + 2, 2) / 2;
    
    const lightGlow = Math.min((fallTime - 400) / 180, 1);
    
    if (lightGlow > 0) {
      const glow = ctx.createRadialGradient(w / 2, h / 2 - 50, 0, w / 2, h / 2 - 50, 400);
      glow.addColorStop(0, `rgba(255, 248, 220, ${0.15 * lightGlow})`);
      glow.addColorStop(0.3, `rgba(255, 240, 200, ${0.08 * lightGlow})`);
      glow.addColorStop(1, "rgba(255, 240, 200, 0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, w, h);
    }
    
    const rg = ctx.createRadialGradient(w / 2, h / 2 - 50, 0, w / 2, h / 2 - 50, 260);
    rg.addColorStop(0, `rgba(10,15,31,${0.25 * fadeIn})`);
    rg.addColorStop(1, "rgba(10,15,31,0)");
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, w, h);
    
    ctx.globalAlpha = fadeIn * 0.9;
    ctx.font = "italic 22px serif";
    ctx.textAlign = "center";
    ctx.fillStyle = "#e8f0f8";
    
    const lines = [
      "The longest night surrenders,",
      "darkness fades to dawn.",
      "Each flake remembers spring—",
      "light begins its slow return."
    ];
    
    const offset = (1 - textEase) * 5;
    
    lines.forEach((line, i) => {
      ctx.fillText(line, w / 2, h / 2 - 50 + i * 35 + offset);
    });
    
    ctx.globalAlpha = 1;
  }

  requestAnimationFrame(animate);
}

window.addEventListener("resize", resize);
resize();
animate();
</script>
</body>
</html>
