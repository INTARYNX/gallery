<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hypnose 2026</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    display:flex;align-items:center;justify-content:center}
  canvas{display:block;
    width:min(100vw,100vh);height:min(100vw,100vh);
    filter: contrast(1.08) saturate(1.2)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W, H, cx, cy, diag;

function resize(){
  const dpr = Math.min(devicePixelRatio, 2);
  const size = Math.min(innerWidth, innerHeight);
  W = c.width = size * dpr;
  H = c.height = size * dpr;
  c.style.width = size + 'px';
  c.style.height = size + 'px';
  cx = W/2; cy = H/2;
  diag = Math.hypot(W, H);
}
resize();
addEventListener('resize', resize);

let t = 0;
let lastFrameTime = performance.now();
let fps = 0;
let fpsSmoothed = 0;

function draw(){
  const now = performance.now();
  const dt = now - lastFrameTime;
  lastFrameTime = now;
  fps = 1000 / dt;
  fpsSmoothed = fpsSmoothed * 0.9 + fps * 0.1;

  // Clamp dt pour éviter les gros sauts (tab inactif etc.)
  const dtSec = Math.min(dt / 1000, 0.1);
  t += dtSec * 0.48; // équivalent à 0.008 par frame à 60fps

  // ——— Bounce ———
  // La balle est "au sol" par défaut : position de repos = squash max, centre abaissé
  // On modélise un vrai cycle d'impact : aux extrémités (p=0, p=1) la balle est écrasée
  // au sol, au milieu (p=0.5) elle est en l'air (forme normale).
  let squashX = 1, squashY = 1, bounceY = 0, impactShake = 0;
  const bounceEndT = 2.85;
  if(t < bounceEndT){
    const bounces = [
      { start: 0.0,  dur: 0.9,  height: 0.35, squash: 0.45 },
      { start: 0.9,  dur: 0.75, height: 0.22, squash: 0.35 },
      { start: 1.65, dur: 0.65, height: 0.12, squash: 0.22 },
      { start: 2.3,  dur: 0.55, height: 0.05, squash: 0.12 },
    ];
    // Trouver le bounce actif
    let active = null;
    for(const b of bounces){
      if(t >= b.start && t < b.start + b.dur){ active = b; break; }
    }
    if(active){
      const p = (t - active.start) / active.dur;
      const airborne = 4 * p * (1 - p);                // 0 au sol → 1 en l'air
      const contactFactor = 1 - airborne;              // 1 au sol → 0 en l'air
      const squashCurve = Math.pow(contactFactor, 1.3);

      // Le "sol" est à bounceY = height*diag/2 par rapport au centre — non, garde 0 comme position au sol.
      // En l'air la balle monte (bounceY négatif), position neutre = 0 (au sol).
      bounceY = -airborne * active.height * diag;
      squashY = 1 - active.squash * squashCurve;
      squashX = 1 + active.squash * squashCurve * 0.8;

      const nearImpact = Math.min(p, 1 - p);
      impactShake = Math.max(0, 1 - nearImpact * 10) * active.squash * 1.5;
    }
  } else if(t < bounceEndT + 0.6){
    const p = (t - bounceEndT) / 0.6;
    const damp = Math.exp(-p * 5);
    const osc = Math.cos(p * Math.PI * 3) * damp;
    squashY = 1 - 0.08 * osc;
    squashX = 1 + 0.05 * osc;
  }

  // ——— Fond bleu Amiga ———
  ctx.fillStyle = '#0a1a6e';
  ctx.fillRect(0, 0, W, H);

  // ——— Paramètres damier ———
  const morphStart = 3;
  const morphDur = 2.5;
  const morphTRaw = Math.max(0, Math.min(1, (t - morphStart) / morphDur));
  const morph = morphTRaw * morphTRaw * (3 - 2 * morphTRaw);

  // Densification : avant le morph, les cases se subdivisent depuis le centre
  // dens1 : 0 à 1 entre t=1.5 et t=2.5 → apparition du 1er niveau (16x16)
  // dens2 : 0 à 1 entre t=2.5 et t=3.5 → apparition du 2e niveau (32x32 proxy via twist)
  const densRaw = Math.max(0, Math.min(1, (t - 1.5) / 1.5));
  const dens = densRaw * densRaw * (3 - 2 * densRaw);

  const baseSectors = 8;
  const baseRings   = 8;
  const sectors = baseSectors * 2; // on dessine toujours 16 secteurs
  const rings   = baseRings * 2;   // et 16 anneaux

  const twist    = 2.2 * morph;
  const rotation = t * 0.6 * morph;
  const maxR = diag * 0.75;
  const lightDir = -Math.PI * 0.75;

  // ——— Copper bars cycle ———
  const copperStart = morphStart + morphDur;
  const cycleDur = 11;
  const copperDuration = 8;
  const fadeTime = 1.2;
  let copperMix;
  if(t < copperStart){
    copperMix = 0;
  } else {
    const phase = (t - copperStart) % cycleDur;
    if(phase < fadeTime){
      copperMix = phase / fadeTime;
    } else if(phase < copperDuration){
      copperMix = 1;
    } else if(phase < copperDuration + fadeTime){
      copperMix = 1 - (phase - copperDuration) / fadeTime;
    } else {
      copperMix = 0;
    }
    copperMix = copperMix * copperMix * (3 - 2 * copperMix);
  }

  const copper = [
    [255, 40, 60],
    [255, 140, 20],
    [255, 230, 40],
    [40, 220, 180],
    [40, 120, 255],
    [180, 40, 220],
    [255, 40, 60],
  ];

  // Transformation globale (squash/bounce) — ancrée au BAS de la balle pour qu'elle ne décolle pas au squash
  ctx.save();
  const ballRadius = maxR; // la balle occupe tout le canvas
  const anchorY = cy + ballRadius; // "sol" virtuel au bas du cercle
  ctx.translate(cx, anchorY + bounceY);
  ctx.scale(squashX, squashY);
  ctx.translate(-cx, -anchorY);

  // ——— Damier avec subdivision progressive ———
  // Le motif 16x16 est défini, mais la parité détermine la couleur.
  // Pour l'effet subdivision : le motif change progressivement de 8x8 à 16x16.
  // On interpole la couleur de chaque sous-case entre la couleur "parent 8x8" et la "propre 16x16".
  for(let ri = 0; ri < rings; ri++){
    const lat0 = (ri     / rings) * (Math.PI / 2);
    const lat1 = ((ri+1) / rings) * (Math.PI / 2);
    const r0   = Math.sin(lat0) * maxR;
    const r1   = Math.sin(lat1) * maxR;
    const latMid = (lat0 + lat1) * 0.5;
    const radialLight = Math.cos(latMid);

    const spiralShift0 = Math.log(r0 + 1) * twist;
    const spiralShift1 = Math.log(r1 + 1) * twist;

    for(let si = 0; si < sectors; si++){
      // Parité niveau 16x16 (fine)
      const isOnFine = ((ri + si) & 1) === 0;
      // Parité niveau 8x8 (grosse case parent) — on divise par 2
      const riParent = ri >> 1;
      const siParent = si >> 1;
      const isOnCoarse = ((riParent + siParent) & 1) === 0;

      // Interpolation : dens=0 → motif coarse (8x8), dens=1 → motif fine (16x16)
      // chaque sous-case a sa propre couleur finale, mais commence avec la couleur parent.
      const binaryFine   = isOnFine   ? 1 : 0;
      const binaryCoarse = isOnCoarse ? 1 : 0;
      const binary = binaryCoarse * (1 - dens) + binaryFine * dens;

      const baseA0 = (si     / sectors) * Math.PI * 2 + rotation;
      const baseA1 = ((si+1) / sectors) * Math.PI * 2 + rotation;

      const aInner0 = baseA0 + spiralShift0;
      const aInner1 = baseA1 + spiralShift0;
      const aOuter0 = baseA0 + spiralShift1;
      const aOuter1 = baseA1 + spiralShift1;

      const midA = (aInner0 + aInner1 + aOuter0 + aOuter1) * 0.25;

      const lambert = (Math.cos(midA - lightDir) + 1) * 0.5;
      const edgeFactor = 1 - radialLight;
      const shade = radialLight * 0.75 + lambert * edgeFactor * 1.2 + 0.25;
      const shadeClamped = Math.max(0.2, Math.min(1.1, shade));

      let copperR = 0, copperG = 0, copperB = 0, shineBoost = 0;
      if(copperMix > 0){
        const cxRing = (ri + 0.5) / rings;
        const angle  = (si + 0.5) / sectors * Math.PI * 2;
        const scroll = t * 0.6;
        let band = (cxRing * 4 + Math.sin(angle*2 + t*0.8)*0.3 + scroll);
        band = band - Math.floor(band);

        const segs = copper.length - 1;
        const pos = band * segs;
        const i0 = Math.min(segs - 1, Math.max(0, Math.floor(pos)));
        const i1 = i0 + 1;
        const m  = pos - i0;
        copperR = copper[i0][0]*(1-m) + copper[i1][0]*m;
        copperG = copper[i0][1]*(1-m) + copper[i1][1]*m;
        copperB = copper[i0][2]*(1-m) + copper[i1][2]*m;
        shineBoost = 0.35 * Math.pow(Math.sin(band * Math.PI), 2);
      }

      // Couleur "on" et "off" calculées séparément
      const baseOnR = 228, baseOnG = 0, baseOnB = 32;
      let rOn  = baseOnR*(1-copperMix) + (copperR + 255*shineBoost)*copperMix;
      let gOn  = baseOnG*(1-copperMix) + (copperG + 255*shineBoost)*copperMix;
      let bOn  = baseOnB*(1-copperMix) + (copperB + 255*shineBoost)*copperMix;
      const lightR = 255 - (255 - copperR) * 0.4;
      const lightG = 255 - (255 - copperG) * 0.4;
      const lightB = 255 - (255 - copperB) * 0.4;
      let rOff = 255*(1-copperMix) + (lightR + 255*shineBoost*0.5)*copperMix;
      let gOff = 255*(1-copperMix) + (lightG + 255*shineBoost*0.5)*copperMix;
      let bOff = 255*(1-copperMix) + (lightB + 255*shineBoost*0.5)*copperMix;

      // Mix selon binary (0 = off, 1 = on)
      let r = rOff + (rOn - rOff) * binary;
      let g = gOff + (gOn - gOff) * binary;
      let b = bOff + (bOn - bOff) * binary;
      r = Math.min(255, r); g = Math.min(255, g); b = Math.min(255, b);

      const rs = Math.min(255, r * shadeClamped);
      const gs = Math.min(255, g * shadeClamped);
      const bs = Math.min(255, b * shadeClamped);

      // Couleur plate par case (plus rapide que createRadialGradient par case)
      // Effet volume : on assombrit légèrement le bord via le shading sphérique déjà calculé
      ctx.fillStyle = `rgb(${rs|0},${gs|0},${bs|0})`;

      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(aInner0) * r0, cy + Math.sin(aInner0) * r0);
      const steps = 6;
      for(let k = 1; k <= steps; k++){
        const a = aInner0 + (aInner1 - aInner0) * (k/steps);
        ctx.lineTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      }
      for(let k = 0; k <= steps; k++){
        const a = aOuter1 + (aOuter0 - aOuter1) * (k/steps);
        ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      }
      ctx.closePath();
      ctx.fill();
    }
  }

  ctx.restore();

  // ——— Checkmark (seulement quand copperMix > 0) ———
  if(copperMix > 0){
    const S = Math.min(W, H) * 0.22;

    const gradSmall = [
      { s: 0.00, c: '#2FB44E' },
      { s: 0.50, c: '#1E7FD4' },
      { s: 1.00, c: '#0A4A9E' },
    ];
    const gradBig = [
      { s: 0.00, c: '#1E7FD4' },
      { s: 0.08, c: '#2FB44E' },
      { s: 0.18, c: '#D8E020' },
      { s: 0.35, c: '#F5C518' },
      { s: 0.60, c: '#F28C1F' },
      { s: 0.85, c: '#D93A1A' },
      { s: 1.00, c: '#B01818' },
    ];

    ctx.save();
    ctx.globalAlpha = copperMix;
    ctx.translate(cx, cy + bounceY);

    if(impactShake > 0){
      const shakeAmp = S * 0.08 * impactShake;
      const shakeX = Math.sin(t * 180) * shakeAmp;
      const shakeY = Math.cos(t * 230) * shakeAmp * 0.7;
      ctx.translate(shakeX, shakeY);
    }

    const parallelogram = (p0, p1, p2, p3, stops) => {
      const midBotX = (p0[0] + p1[0]) / 2;
      const midBotY = (p0[1] + p1[1]) / 2;
      const midTopX = (p2[0] + p3[0]) / 2;
      const midTopY = (p2[1] + p3[1]) / 2;
      const grad = ctx.createLinearGradient(midBotX, midBotY, midTopX, midTopY);
      for(const {s, c} of stops) grad.addColorStop(s, c);
      ctx.beginPath();
      ctx.moveTo(p0[0], p0[1]);
      ctx.lineTo(p1[0], p1[1]);
      ctx.lineTo(p2[0], p2[1]);
      ctx.lineTo(p3[0], p3[1]);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.lineWidth = Math.max(1, S * 0.012);
      ctx.strokeStyle = '#000';
      ctx.stroke();
    };

    const slant = S * 0.28;
    const baseY = S * 0.30;
    const leftW = S * 0.198;
    const leftH = S * 0.42;
    const rightH = S * 1.10;

    const drawCheckmark = (offsetX, drawShadow = false) => {
      const B_left  = [offsetX - leftW/2, baseY];
      const B_right = [offsetX + leftW/2, baseY];
      const L_bl = B_left, L_br = B_right;
      const L_tr = [B_right[0] - slant,  baseY - leftH];
      const L_tl = [B_left[0]  - slant,  baseY - leftH];
      const R_bl = B_left, R_br = B_right;
      const R_tr = [B_right[0] + slant*2, baseY - rightH];
      const R_tl = [B_left[0]  + slant*2, baseY - rightH];

      if(drawShadow){
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.beginPath();
        ctx.moveTo(L_bl[0], L_bl[1]); ctx.lineTo(L_br[0], L_br[1]);
        ctx.lineTo(L_tr[0], L_tr[1]); ctx.lineTo(L_tl[0], L_tl[1]);
        ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(R_bl[0], R_bl[1]); ctx.lineTo(R_br[0], R_br[1]);
        ctx.lineTo(R_tr[0], R_tr[1]); ctx.lineTo(R_tl[0], R_tl[1]);
        ctx.closePath(); ctx.fill();
        return;
      }
      parallelogram(L_bl, L_br, L_tr, L_tl, gradSmall);
      parallelogram(R_bl, R_br, R_tr, R_tl, gradBig);
    };

    const marklW = leftW + slant*2;
    const spacing = marklW * 0.3;
    const off1 = -spacing/2, off2 = spacing/2;
    const minX = Math.min(off1, off2) - leftW/2 - slant;
    const maxX = Math.max(off1, off2) + leftW/2 + slant*2;
    const minY = baseY - rightH;
    const maxY = baseY;
    ctx.translate(-(minX + maxX) / 2, -(minY + maxY) / 2);

    ctx.save();
    ctx.filter = `blur(${S * 0.04}px)`;
    ctx.translate(S * 0.06, S * 0.07);
    drawCheckmark( spacing/2, true);
    drawCheckmark(-spacing/2, true);
    ctx.restore();

    drawCheckmark( spacing/2);
    drawCheckmark(-spacing/2);

    ctx.restore();
  }

  // ——— Scroller circulaire ———
  if(copperMix > 0){
    ctx.save();
    ctx.globalAlpha = copperMix;
    const fontSize = Math.min(W * 0.055, diag * 0.04);
    ctx.font = `bold ${fontSize}px "Courier New", monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const text = "MANY YEARS PASSED BUT THE BALL STILL ROLLS * SOMEWHERE INSIDE THE PATTERN REMEMBERS * ";
    const radius = diag * 0.32;
    const rotationSpeed = t * 0.35;

    const chars = [];
    const spaceWidth = ctx.measureText(' ').width;
    for(let i = 0; i < text.length; i++){
      const ch = text[i];
      const w = ctx.measureText(ch).width;
      const arcLength = (w + spaceWidth * 0.3) * 1.2;
      chars.push({ ch, arcAngle: arcLength / radius });
    }
    const totalAngle = chars.reduce((s, c) => s + c.arcAngle, 0);
    const normalizer = (Math.PI * 2) / totalAngle;

    let currentAngle = rotationSpeed;
    for(let i = 0; i < chars.length; i++){
      const { ch, arcAngle } = chars[i];
      const normalized = arcAngle * normalizer;
      const angle = currentAngle + normalized / 2;
      if(ch.trim()){
        const x = cx + Math.cos(angle) * radius;
        const y = cy + Math.sin(angle) * radius;
        const wave = Math.sin(t * 2 + i * 0.3) * 0.25 + 0.75;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle + Math.PI / 2);
        ctx.lineWidth = Math.max(2, fontSize * 0.18);
        ctx.strokeStyle = 'rgba(0,0,0,0.95)';
        ctx.lineJoin = 'round';
        ctx.strokeText(ch, 0, 0);
        ctx.shadowColor = 'rgba(255, 80, 80, 0.9)';
        ctx.shadowBlur = 10;
        ctx.fillStyle = `rgba(255, 255, 255, ${wave})`;
        ctx.fillText(ch, 0, 0);
        ctx.restore();
      }
      currentAngle += normalized;
    }
    ctx.restore();
  }

  // ——— Texte "INSIDE THE BOING BALL" style vaporwave bitmap (début seulement) ———
  if(t < 3){
    const titleFadeIn  = Math.min(t / 0.5, 1);
    const titleFadeOut = t > 2.4 ? Math.min((t - 2.4) / 0.6, 1) : 0;
    const titleAlpha = titleFadeIn * (1 - titleFadeOut);

    if(titleAlpha > 0.01){
      // Helper : rend une ligne sur un petit canvas off-screen puis l'affiche scalé x N avec smoothing off
      // → effet pixel authentique quelle que soit la font
      const renderPixelLine = (text, baseSize, displaySize, grad, tilt, yPos) => {
        const pad = Math.ceil(baseSize * 0.3);
        const off = document.createElement('canvas');
        const octx = off.getContext('2d');
        octx.font = `bold ${baseSize}px monospace`;
        const metrics = octx.measureText(text);
        const w = Math.ceil(metrics.width) + pad * 2;
        const h = Math.ceil(baseSize * 1.4) + pad * 2;
        off.width = w; off.height = h;

        octx.font = `bold ${baseSize}px monospace`;
        octx.textAlign = 'center';
        octx.textBaseline = 'middle';
        octx.imageSmoothingEnabled = false;

        // Contour noir (plusieurs passes 1px pour faire 2-3px de contour "pixel")
        octx.fillStyle = '#000';
        for(let dx = -2; dx <= 2; dx++){
          for(let dy = -2; dy <= 2; dy++){
            if(Math.abs(dx) + Math.abs(dy) <= 3){
              octx.fillText(text, w/2 + dx, h/2 + dy);
            }
          }
        }

        // Gradient fill
        const g = octx.createLinearGradient(0, h/2 - baseSize*0.5, 0, h/2 + baseSize*0.5);
        grad.forEach(([stop, color]) => g.addColorStop(stop, color));
        octx.fillStyle = g;
        octx.fillText(text, w/2, h/2);

        // Highlight chrome en haut
        octx.globalCompositeOperation = 'source-atop';
        const hg = octx.createLinearGradient(0, h/2 - baseSize*0.4, 0, h/2);
        hg.addColorStop(0, 'rgba(255,255,255,0.9)');
        hg.addColorStop(1, 'rgba(255,255,255,0)');
        octx.fillStyle = hg;
        octx.fillRect(0, 0, w, h);
        octx.globalCompositeOperation = 'source-over';

        // Affichage scalé avec smoothing off → pixels nets
        ctx.save();
        ctx.imageSmoothingEnabled = false;
        ctx.translate(cx, yPos);
        ctx.rotate(tilt);
        const scale = displaySize / baseSize;
        ctx.scale(scale, scale);
        ctx.drawImage(off, -w/2, -h/2);
        ctx.restore();
      };

      ctx.save();
      ctx.globalAlpha = titleAlpha;

      const fontSize = Math.min(W * 0.13, diag * 0.095);
      const wobble = Math.sin(t * 4) * fontSize * 0.03;

      // Ligne 1
      renderPixelLine(
        "INSIDE",
        32,
        fontSize * 1.3,
        [[0, '#ffde3a'], [0.5, '#ff3ac5'], [1, '#b648ff']],
        -0.06,
        cy - fontSize * 0.65 + wobble
      );

      // Ligne 2
      renderPixelLine(
        "THE BOING BALL",
        32,
        fontSize * 0.85,
        [[0, '#2de2ff'], [0.5, '#b648ff'], [1, '#ff3ac5']],
        0.04,
        cy + fontSize * 0.55 - wobble
      );

      ctx.restore();
    }
  }

  // ——— Scanlines CRT ———

  // ——— Scanlines CRT ———
  const pitch = Math.max(2, Math.round(H / 256));
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  for(let y = 0; y < H; y += pitch){
    ctx.fillRect(0, y, W, 1);
  }
  ctx.globalCompositeOperation = 'source-over';

  // ——— Vignette ———
  const vg = ctx.createRadialGradient(cx, cy, diag*0.25, cx, cy, diag*0.65);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.25)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
