<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100vw; max-height: 100vh; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Sable sur plaque vibrante (type Chladni) : les grains fuient les zones agitées
// et s'accumulent sur les lignes nodales d'un champ qui évolue lentement.
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const SIZE = Math.min(window.innerWidth, window.innerHeight, 900);
canvas.width = canvas.height = SIZE;

const BG = '#f3efe6';
const NB = 96;
// arc-en-ciel négatif : teinte complémentaire de chaque couleur du spectre
const STYLES = Array.from({ length: NB }, (_, i) =>
  `hsla(${205 + (i / NB) * 20}, ${12 + Math.random() * 23}%, ${22 + Math.random() * 28}%, ${0.5 + Math.random() * 0.4})`);
const bins = Array.from({ length: NB }, () => []);

// ---- noise ----
const G = 256;
const perm = new Float32Array(G * G).map(() => Math.random());
const sm = t => t * t * (3 - 2 * t);
function noise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = sm(x - xi), yf = sm(y - yi);
  const g = (a, b) => perm[((b & 255) * G) + (a & 255)];
  const t = g(xi, yi) + (g(xi + 1, yi) - g(xi, yi)) * xf;
  const b = g(xi, yi + 1) + (g(xi + 1, yi + 1) - g(xi, yi + 1)) * xf;
  return t + (b - t) * yf;
}
const fbm = (x, y) => 0.55 * noise(x, y) + 0.3 * noise(x * 2, y * 2) + 0.15 * noise(x * 4, y * 4);

// ---- vibration field ----
const F = 0.0045;
let T = 0;
const CX = SIZE * 0.55, CY = SIZE * 0.55, R0 = SIZE * 0.5;
function u(x, y) {
  const dx = x - CX, dy = y - CY;
  const a = 2.6 * Math.exp(-Math.hypot(dx, dy) / R0) + T * 4;
  const c = Math.cos(a), s = Math.sin(a);
  const rx = CX + dx * c - dy * s, ry = CY + dx * s + dy * c;
  return fbm(rx * F + T, ry * F - T * 0.6) - 0.5;
}

// ---- grains ----
const N = 16000;
const grains = Array.from({ length: N }, () => ({
  x: Math.random() * SIZE,
  y: Math.random() * SIZE,
  s: 1.2 + Math.random() * 1.4
}));

// ---- ombres fantomatiques ----
const GW = 56;
const ghost = document.createElement('canvas');
ghost.width = ghost.height = GW;
const gctx = ghost.getContext('2d');
const gimg = gctx.createImageData(GW, GW);
function updateGhost() {
  for (let j = 0; j < GW; j++) {
    for (let i = 0; i < GW; i++) {
      const v = fbm(i * 0.07 + T * 5, j * 0.07 - T * 3 + 100);
      const a = Math.max(0, v - 0.48) * 2.2;
      const k = (j * GW + i) * 4;
      gimg.data[k] = 70; gimg.data[k + 1] = 88; gimg.data[k + 2] = 110;
      gimg.data[k + 3] = Math.min(255, a * 150);
    }
  }
  gctx.putImageData(gimg, 0, 0);
}

let flickT = 0.98, flickC = 0.98;
const E = 2, GAIN = 2600;
function frame() {
  T += 0.0012;
  // scintillement façon vieux film
  if (Math.random() < 0.05) flickT = 0.955 + Math.random() * 0.045 - (Math.random() < 0.1 ? 0.04 : 0);
  flickC += (flickT - flickC) * 0.12;
  const f = flickC;
  ctx.fillStyle = `rgb(${255 * f | 0},${255 * f | 0},${252 * f | 0})`;
  ctx.fillRect(0, 0, SIZE, SIZE);
  updateGhost();
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(ghost, 0, 0, SIZE, SIZE);
  for (const b of bins) b.length = 0;

  for (const g of grains) {
    const v = u(g.x, g.y);
    const vx = (u(g.x + E, g.y) - u(g.x - E, g.y)) / (2 * E);
    const vy = (u(g.x, g.y + E) - u(g.x, g.y - E)) / (2 * E);
    const jit = 0.35 + 7 * Math.abs(v);

    const dx = g.x - CX, dy = g.y - CY;
    const r = Math.hypot(dx, dy) + 1;
    const w = 0.15 + 1.4 * Math.exp(-r / R0);

    g.x += -GAIN * v * vx - (dy / r) * w + (Math.random() - 0.5) * jit;
    g.y += -GAIN * v * vy + (dx / r) * w + (Math.random() - 0.5) * jit;

    if (g.x < 0 || g.y < 0 || g.x > SIZE || g.y > SIZE) {
      g.x = Math.random() * SIZE;
      g.y = Math.random() * SIZE;
    }
    const hue = (Math.atan2(dy, dx) / (2 * Math.PI) + r / (SIZE * 1.2) + T * 1.5 + (fbm(g.x * 0.012 + 50, g.y * 0.012) - 0.5) * 0.6) % 1;
    bins[Math.floor((hue + 1) % 1 * NB)].push(g);
  }
  for (let i = 0; i < NB; i++) {
    ctx.fillStyle = STYLES[i];
    for (const g of bins[i]) ctx.fillRect(g.x, g.y, g.s, g.s);
  }
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
