<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breaking Glass</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            border: 1px solid #333;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 800;
        canvas.height = 600;

        let fragments = [];
        let time = 0;
        let phase = 'intact';
        let zoomProgress = 0;
        let targetFragment = null;
        let scale = 1;
        let cameraTargetX = 0;
        let cameraTargetY = 0;
        
        let panStartX = 0;
        let panStartY = 0;
        
        const BREAK_DURATION = 40;
        const ZOOM_DURATION = 120;
        
        let dynamicMaxScale = 1;

        const MARGIN = 50;
        const GLASS_CENTER_X = canvas.width / 2;
        const GLASS_CENTER_Y = canvas.height / 2;
        
        let currentTint = { r: 200, g: 230, b: 255 };
        let nextTint = { r: 200, g: 230, b: 255 };
        let tintProgress = 0;

        class Fragment {
            constructor(points, vx = 0, vy = 0, rotation = 0, rotSpeed = 0, isTarget = false, tint = null) {
                this.points = points;
                this.vx = vx;
                this.vy = vy;
                this.rotation = rotation;
                this.rotSpeed = rotSpeed;
                this.alpha = 1;
                this.isTarget = isTarget;
                this.tint = tint || { r: 200, g: 230, b: 255 };
            }

            update() {
                this.vx *= 0.99;
                this.vy *= 0.99;
                this.vy += 0.1;

                this.points = this.points.map(p => ({ 
                    x: p.x + this.vx, 
                    y: p.y + this.vy 
                }));
                this.rotation += this.rotSpeed;
            }

            draw(ctx) {
                ctx.save();
                const center = this.getCenter();
                
                ctx.translate(center.x, center.y);
                ctx.rotate(this.rotation);
                ctx.translate(-center.x, -center.y);

                // Glassmorphism effect - subtle shadow for depth
                ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
                ctx.shadowBlur = 8 / scale;
                ctx.shadowOffsetX = 3 / scale;
                ctx.shadowOffsetY = 3 / scale;

                // Glass fill with gradient
                const gradient = ctx.createLinearGradient(
                    this.points[0].x, this.points[0].y,
                    this.points[2] ? this.points[2].x : this.points[1].x,
                    this.points[2] ? this.points[2].y : this.points[1].y
                );
                gradient.addColorStop(0, `rgba(${this.tint.r}, ${this.tint.g}, ${this.tint.b}, ${this.alpha * 0.4})`);
                gradient.addColorStop(1, `rgba(${this.tint.r - 40}, ${this.tint.g - 30}, ${this.tint.b}, ${this.alpha * 0.2})`);
                
                ctx.fillStyle = gradient;

                ctx.beginPath();
                ctx.moveTo(this.points[0].x, this.points[0].y);
                for (let i = 1; i < this.points.length; i++) {
                    ctx.lineTo(this.points[i].x, this.points[i].y);
                }
                ctx.closePath();
                ctx.fill();
                
                // Reset shadow
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;
                
                // Dark edge for depth - tinted
                const darkR = Math.max(0, this.tint.r - 100);
                const darkG = Math.max(0, this.tint.g - 80);
                const darkB = Math.max(0, this.tint.b - 55);
                ctx.strokeStyle = `rgba(${darkR}, ${darkG}, ${darkB}, ${this.alpha * 0.6})`;
                ctx.lineWidth = 3 / scale;
                ctx.stroke();

                // Bright highlight on top/left edges - tinted lighter
                for (let i = 0; i < this.points.length; i++) {
                    const p1 = this.points[i];
                    const p2 = this.points[(i + 1) % this.points.length];
                    
                    // Calculate edge angle
                    const dx = p2.x - p1.x;
                    const dy = p2.y - p1.y;
                    const angle = Math.atan2(dy, dx);
                    
                    // Only highlight edges facing top-left (light source)
                    if (angle > -Math.PI * 0.75 && angle < Math.PI * 0.25) {
                        const lightR = Math.min(255, this.tint.r + 35);
                        const lightG = Math.min(255, this.tint.g + 25);
                        const lightB = Math.min(255, this.tint.b);
                        ctx.strokeStyle = `rgba(${lightR}, ${lightG}, ${lightB}, ${this.alpha * 0.8})`;
                        ctx.lineWidth = 1.5 / scale;
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }

                ctx.restore();
            }

            getCenter() {
                const sum = this.points.reduce((acc, p) => ({ 
                    x: acc.x + p.x, 
                    y: acc.y + p.y 
                }), { x: 0, y: 0 });
                return { 
                    x: sum.x / this.points.length, 
                    y: sum.y / this.points.length 
                };
            }

            getArea() {
                let area = 0;
                for (let i = 0; i < this.points.length; i++) {
                    const j = (i + 1) % this.points.length;
                    area += this.points[i].x * this.points[j].y;
                    area -= this.points[j].x * this.points[i].y;
                }
                return Math.abs(area / 2);
            }
        }

        function getRandomGlassTint() {
            const tints = [
                { r: 200, g: 230, b: 255 }, // Blue
                { r: 200, g: 255, b: 220 }, // Green
                { r: 255, g: 230, b: 200 }, // Amber
                { r: 230, g: 200, b: 255 }, // Purple
                { r: 255, g: 220, b: 220 }, // Rose
                { r: 220, g: 255, b: 255 }, // Cyan
                { r: 240, g: 240, b: 200 }  // Yellow
            ];
            return tints[Math.floor(Math.random() * tints.length)];
        }

        function createGlassPane() {
            return new Fragment([
                { x: MARGIN, y: MARGIN },
                { x: canvas.width - MARGIN, y: MARGIN },
                { x: canvas.width - MARGIN, y: canvas.height - MARGIN },
                { x: MARGIN, y: canvas.height - MARGIN }
            ], 0, 0, 0, 0, false, currentTint);
        }
        
        function calculateMaxScale(fragment) {
            if (!fragment || fragment.points.length === 0) return 1;

            const minX = Math.min(...fragment.points.map(p => p.x));
            const maxX = Math.max(...fragment.points.map(p => p.x));
            const minY = Math.min(...fragment.points.map(p => p.y));
            const maxY = Math.max(...fragment.points.map(p => p.y));

            const fragWidth = maxX - minX;
            const fragHeight = maxY - minY;
            
            const scaleX = (canvas.width - 2 * MARGIN) / fragWidth;
            const scaleY = (canvas.height - 2 * MARGIN) / fragHeight;

            const necessaryScale = Math.min(scaleX, scaleY) * 0.95;

            return Math.max(1, necessaryScale);
        }

        function breakGlass(fragment) {
            const center = fragment.getCenter();
            const impactX = center.x;
            const impactY = center.y;
            
            const bbox = {
                minX: Math.min(...fragment.points.map(p => p.x)),
                maxX: Math.max(...fragment.points.map(p => p.x)),
                minY: Math.min(...fragment.points.map(p => p.y)),
                maxY: Math.max(...fragment.points.map(p => p.y))
            };
            
            const width = bbox.maxX - bbox.minX;
            const height = bbox.maxY - bbox.minY;
            
            const numFragments = 10 + Math.floor(Math.random() * 6);
            const rawFragments = [];

            for (let i = 0; i < numFragments; i++) {
                const points = [];
                const numPoints = 3 + Math.floor(Math.random() * 3);
                
                // Generate points in a circle and sort by angle for convex polygon
                const tempPoints = [];
                for (let j = 0; j < numPoints; j++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = Math.min(width, height) * (0.1 + Math.random() * 0.4);
                    const px = impactX + Math.cos(angle) * dist + (Math.random() - 0.5) * width * 0.2;
                    const py = impactY + Math.sin(angle) * dist + (Math.random() - 0.5) * height * 0.2;
                    
                    tempPoints.push({
                        x: Math.max(bbox.minX, Math.min(bbox.maxX, px)),
                        y: Math.max(bbox.minY, Math.min(bbox.maxY, py)),
                        angle: Math.atan2(py - impactY, px - impactX)
                    });
                }
                
                // Sort by angle to create convex polygon
                tempPoints.sort((a, b) => a.angle - b.angle);
                tempPoints.forEach(p => points.push({ x: p.x, y: p.y }));

                const fragCenter = points.reduce((acc, p) => ({ x: acc.x + p.x, y: acc.y + p.y }), { x: 0, y: 0 });
                fragCenter.x /= points.length;
                fragCenter.y /= points.length;

                const dx = fragCenter.x - impactX;
                const dy = fragCenter.y - impactY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                let speed = 0.5 + Math.random() * 1.5;
                
                rawFragments.push({
                    points,
                    vx: (dx / dist) * speed,
                    vy: (dy / dist) * speed,
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.1,
                    area: new Fragment(points).getArea()
                });
            }
            
            rawFragments.sort((a, b) => b.area - a.area);

            const newFragments = rawFragments.map((raw, index) => {
                const isTarget = index === 0;
                
                const fragment = new Fragment(
                    raw.points,
                    raw.vx,
                    raw.vy,
                    raw.rotation,
                    raw.rotSpeed,
                    isTarget,
                    currentTint
                );

                if (isTarget) {
                    fragment.vx *= 0.05;
                    fragment.vy *= 0.05;
                    fragment.rotSpeed *= 0.05;
                }
                return fragment;
            });
            
            return newFragments;
        }

        function findBiggestFragment() {
            if (fragments.length === 0) return null;
            return fragments.find(f => f.isTarget) || fragments[0];
        }

        function init() {
            currentTint = getRandomGlassTint();
            nextTint = getRandomGlassTint();
            tintProgress = 60;
            fragments = [createGlassPane()];
            phase = 'intact';
            time = 0;
            zoomProgress = 0;
            scale = 1;
            cameraTargetX = GLASS_CENTER_X;
            cameraTargetY = GLASS_CENTER_Y;
        }

        function lerp(a, b, t) {
            return a + (b - a) * t;
        }
        
        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function animate() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(scale, scale);
            ctx.translate(-cameraTargetX, -cameraTargetY);

            if (phase === 'intact') {
                // Smooth tint transition
                if (tintProgress < 60) {
                    tintProgress++;
                    const t = tintProgress / 60;
                    const eased = t * t * (3 - 2 * t);
                    
                    currentTint.r = Math.round(nextTint.r * eased + (200) * (1 - eased));
                    currentTint.g = Math.round(nextTint.g * eased + (230) * (1 - eased));
                    currentTint.b = Math.round(nextTint.b * eased + (255) * (1 - eased));
                    fragments[0].tint = { ...currentTint };
                }
                
                fragments[0].draw(ctx);
                time++;
                if (time > 90) {
                    phase = 'breaking';
                    fragments = breakGlass(fragments[0]);
                    
                    targetFragment = findBiggestFragment();
                    panStartX = GLASS_CENTER_X;
                    panStartY = GLASS_CENTER_Y;
                    
                    time = 0;
                }
            } else if (phase === 'breaking') {
                fragments.forEach(f => {
                    f.update();
                    f.draw(ctx);
                });
                
                time++;
                
                if (time >= BREAK_DURATION) {
                    phase = 'zooming';
                    dynamicMaxScale = calculateMaxScale(targetFragment);
                    zoomProgress = 0;
                }
            } else if (phase === 'zooming') {
                fragments.forEach(f => f.update());
                
                zoomProgress++;
                const t = Math.min(zoomProgress / ZOOM_DURATION, 1);
                const eased = easeInOutCubic(t);
                
                const currentCenter = targetFragment.getCenter();

                cameraTargetX = lerp(panStartX, currentCenter.x, eased);
                cameraTargetY = lerp(panStartY, currentCenter.y, eased);

                scale = 1 + eased * (dynamicMaxScale - 1);

                fragments.forEach(f => {
                    if (f !== targetFragment) {
                        f.alpha = Math.max(0, 1 - zoomProgress / (ZOOM_DURATION * 0.5));
                    }
                    f.draw(ctx);
                });

                if (zoomProgress >= ZOOM_DURATION) {
                    const oldCenter = targetFragment.getCenter();
                    
                    const angle = -targetFragment.rotation;
                    const cos = Math.cos(angle);
                    const sin = Math.sin(angle);
                    
                    const normalized = targetFragment.points.map(p => {
                        const dx = p.x - oldCenter.x;
                        const dy = p.y - oldCenter.y;
                        
                        const rx = dx * cos - dy * sin;
                        const ry = dx * sin + dy * cos;
                        
                        return {
                            x: GLASS_CENTER_X + rx * dynamicMaxScale,
                            y: GLASS_CENTER_Y + ry * dynamicMaxScale
                        };
                    });
                    
                    currentTint = { ...nextTint };
                    nextTint = getRandomGlassTint();
                    tintProgress = 0;
                    
                    const normalizedFragment = new Fragment(normalized, 0, 0, 0, 0, false, currentTint);
                    fragments = breakGlass(normalizedFragment);
                    
                    targetFragment = findBiggestFragment();
                    panStartX = GLASS_CENTER_X;
                    panStartY = GLASS_CENTER_Y;
                    
                    phase = 'breaking';
                    time = 0;
                    scale = 1;
                    cameraTargetX = GLASS_CENTER_X;
                    cameraTargetY = GLASS_CENTER_Y;
                    dynamicMaxScale = calculateMaxScale(targetFragment);
                }
            }

            ctx.restore();
            requestAnimationFrame(animate);
        }

        init();
        animate();
    </script>
</body>
</html>
