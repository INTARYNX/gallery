<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a1628; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const off  = document.createElement('canvas');
const octx = off.getContext('2d');

const SHELL = {
  maxRatio:   0.36,
  innerRatio: 0.55,
  turns:      4.2,
  growthRate: 0.12,
  rotSpeed:   0.08,
};

const waves = [
  { amp:6, freq:0.025, speed:0.6, phase:0 },
  { amp:4, freq:0.04,  speed:1.0, phase:2 },
  { amp:3, freq:0.06,  speed:0.8, phase:5 },
  { amp:2, freq:0.09,  speed:1.4, phase:1 },
];

const caustics = Array.from({ length: 18 }, () => ({
  x: Math.random(), y: Math.random(),
  r: 0.02 + Math.random()*0.06,
  speed: 0.3 + Math.random()*0.7,
  phase: Math.random()*Math.PI*2,
  alpha: 0.04 + Math.random()*0.08,
}));

let t = 0;
let srcData = null, dstData = null;

function resize() {
  const s = Math.min(window.innerWidth, window.innerHeight);
  canvas.width = s; canvas.height = s;
  off.width = s; off.height = s;
  srcData = null; dstData = null;
}
resize();
window.addEventListener('resize', resize);

// ── Nautilus ──────────────────────────────────────────────
function drawNautilus(c, w, h, time) {
  const cx = w/2, cy = h/2;
  const { maxRatio, innerRatio, turns, growthRate, rotSpeed } = SHELL;
  const maxR = Math.min(w,h) * maxRatio;
  const b    = growthRate;
  const tMax = turns * Math.PI * 2;
  const a    = maxR / Math.exp(b * tMax);
  const rot  = -Math.PI*0.5 + time * rotSpeed;
  const steps = 500;

  const R  = th => a * Math.exp(b * th);
  const px = (th, r) => cx + Math.cos(th + rot) * r;
  const py = (th, r) => cy + Math.sin(th + rot) * r;

  const outer = [];
  for (let i = 0; i <= steps; i++) {
    const th = (i/steps)*tMax;
    outer.push([px(th,R(th)), py(th,R(th))]);
  }

  const tInMin = Math.PI*2*0.9;
  const inner = [];
  for (let i = 0; i <= steps; i++) {
    const th = tInMin + (i/steps)*(tMax-tInMin);
    inner.push([px(th,R(th)*innerRatio), py(th,R(th)*innerRatio)]);
  }

  // Clip
  c.save();
  c.beginPath();
  outer.forEach(([x,y],i) => i===0 ? c.moveTo(x,y) : c.lineTo(x,y));
  c.lineTo(cx,cy);
  c.closePath();
  c.clip();

  // Base nacre
  const bg = c.createRadialGradient(cx-maxR*0.2, cy-maxR*0.2, 0, cx, cy, maxR);
  bg.addColorStop(0,    '#fffef9');
  bg.addColorStop(0.35, '#eef8f3');
  bg.addColorStop(0.65, '#d5ede6');
  bg.addColorStop(1,    '#b2d5cc');
  c.fillStyle = bg;
  c.fillRect(0,0,w,h);

  // Biologically spaced septa
  let spacing = 0.20;
  let th = tInMin + 0.2;
  const septa = [];
  while (th < tMax) {
    septa.push(th);
    spacing = Math.min(spacing*1.08, 0.9);
    th += spacing;
  }

  // Alternating chambers
  for (let s = 0; s < septa.length-1; s++) {
    const t0=septa[s], t1=septa[s+1], sub=20;
    c.beginPath();
    for (let i=0; i<=sub; i++) {
      const tt=t0+(i/sub)*(t1-t0);
      i===0 ? c.moveTo(px(tt,R(tt)),py(tt,R(tt))) : c.lineTo(px(tt,R(tt)),py(tt,R(tt)));
    }
    for (let i=sub; i>=0; i--) {
      const tt=t0+(i/sub)*(t1-t0);
      c.lineTo(px(tt,R(tt)*innerRatio), py(tt,R(tt)*innerRatio));
    }
    c.closePath();
    c.fillStyle = s%2===0 ? 'rgba(255,255,255,0.22)' : 'rgba(160,210,200,0.20)';
    c.fill();
  }

  // Curved septa
  septa.forEach(tt => {
    const rOut  = R(tt), rIn = R(tt)*innerRatio;
    const prevTh = Math.max(0, tt-Math.PI*2*0.3);
    const rCtrl  = R(prevTh)*0.75;
    c.beginPath();
    c.moveTo(px(tt,rIn), py(tt,rIn));
    c.quadraticCurveTo(px(tt-0.25,rCtrl), py(tt-0.25,rCtrl), px(tt,rOut), py(tt,rOut));
    c.strokeStyle = 'rgba(100,160,145,0.5)';
    c.lineWidth = 1;
    c.stroke();
  });

  // Growth stria
  for (let i=0; i<=steps; i+=6) {
    const tt=( i/steps)*tMax, rOut=R(tt), rIn=R(tt)*innerRatio;
    if (rIn<2) continue;
    c.beginPath();
    c.moveTo(px(tt,rOut),py(tt,rOut));
    c.lineTo(px(tt,rIn), py(tt,rIn));
    c.strokeStyle=`rgba(140,185,175,${0.05+0.08*(i/steps)})`;
    c.lineWidth=0.4;
    c.stroke();
  }

  // Siphuncle
  c.beginPath();
  for (let i=0; i<=steps; i++) {
    const tt=tInMin+(i/steps)*(tMax-tInMin), r=R(tt)*(innerRatio+0.03);
    i===0 ? c.moveTo(px(tt,r),py(tt,r)) : c.lineTo(px(tt,r),py(tt,r));
  }
  c.strokeStyle='rgba(140,90,50,0.3)'; c.lineWidth=2.5; c.stroke();

  // Brown stripes
  for (let i=0; i<=steps; i+=3) {
    const tt=(i/steps)*tMax, n=Math.sin(tt*7.3)*Math.sin(tt*13.1);
    if (n<0.4) continue;
    const tt2=((i+3)/steps)*tMax;
    c.beginPath();
    c.moveTo(px(tt, R(tt)),            py(tt, R(tt)));
    c.lineTo(px(tt2,R(tt2)),           py(tt2,R(tt2)));
    c.lineTo(px(tt2,R(tt2)*innerRatio),py(tt2,R(tt2)*innerRatio));
    c.lineTo(px(tt, R(tt)*innerRatio), py(tt, R(tt)*innerRatio));
    c.closePath();
    c.fillStyle=`rgba(110,65,25,${(n-0.4)*0.4})`; c.fill();
  }

  c.restore();

  // Outer glow stroke
  c.save();
  c.shadowBlur=18; c.shadowColor='rgba(220,255,245,0.5)';
  c.beginPath();
  outer.forEach(([x,y],i) => i===0 ? c.moveTo(x,y) : c.lineTo(x,y));
  c.strokeStyle='rgba(200,235,228,0.75)'; c.lineWidth=1.8; c.stroke();
  c.restore();

  // 3D shading
  c.save();
  c.beginPath();
  outer.forEach(([x,y],i) => i===0 ? c.moveTo(x,y) : c.lineTo(x,y));
  c.lineTo(cx,cy); c.closePath();
  const shade=c.createLinearGradient(cx-maxR,cy-maxR,cx+maxR,cy+maxR);
  shade.addColorStop(0,   'rgba(255,255,255,0.15)');
  shade.addColorStop(0.5, 'rgba(255,255,255,0)');
  shade.addColorStop(1,   'rgba(0,0,0,0.10)');
  c.fillStyle=shade; c.fill();
  c.restore();
}

// ── Background shapes ─────────────────────────────────────
function drawShapes(c, w, h) {
  c.clearRect(0,0,w,h);
  const bg=c.createLinearGradient(0,0,w,h);
  bg.addColorStop(0,   '#0d4f3c');
  bg.addColorStop(0.5, '#1a7a5e');
  bg.addColorStop(1,   '#0a3328');
  c.fillStyle=bg; c.fillRect(0,0,w,h);

  drawNautilus(c,w,h,t);

  const cx=w/2, cy=h/2;
  const circles=[
    {bx:cx-w*0.32,by:cy-h*0.28,r:0.07, sp:0.3, ph:0.0},
    {bx:cx+w*0.30,by:cy-h*0.30,r:0.055,sp:0.2, ph:1.2},
    {bx:cx-w*0.38,by:cy+h*0.10,r:0.05, sp:0.4, ph:2.5},
    {bx:cx+w*0.35,by:cy+h*0.15,r:0.045,sp:0.25,ph:0.8},
    {bx:cx-w*0.15,by:cy+h*0.38,r:0.06, sp:0.35,ph:3.1},
    {bx:cx+w*0.10,by:cy+h*0.35,r:0.05, sp:0.18,ph:4.2},
    {bx:cx-w*0.05,by:cy-h*0.42,r:0.04, sp:0.28,ph:5.0},
    {bx:cx+w*0.38,by:cy-h*0.10,r:0.04, sp:0.22,ph:1.7},
  ];
  circles.forEach(({bx,by,r,sp,ph}) => {
    const x=bx+Math.sin(t*sp+ph)*w*0.04;
    const y=by+Math.cos(t*sp*0.7+ph)*h*0.04;
    c.beginPath();
    c.arc(x,y,Math.min(w,h)*r,0,Math.PI*2);
    c.fillStyle='rgba(255,255,255,0.9)'; c.fill();
  });
}

// ── Caustics ──────────────────────────────────────────────
function drawCaustics(W,H) {
  caustics.forEach(c => {
    const x=(c.x+Math.sin(t*c.speed*0.3+c.phase)*0.05)*W;
    const y=(c.y+Math.cos(t*c.speed*0.2+c.phase)*0.04)*H;
    const r=c.r*Math.min(W,H)*(0.8+0.2*Math.sin(t*c.speed+c.phase));
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,`rgba(180,255,220,${c.alpha})`);
    g.addColorStop(1,'rgba(180,255,220,0)');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.ellipse(x,y,r,r*0.5,t*c.speed*0.1,0,Math.PI*2);
    ctx.fill();
  });
}

// ── Wave reflections ──────────────────────────────────────
function drawWaveReflections(W,H) {
  ctx.save();
  ctx.globalCompositeOperation='screen';
  const cols=10,rows=16,cw=W/cols,ch=H/rows;
  const pts=[];
  for (let r=0;r<=rows;r++) {
    pts[r]=[];
    for (let c=0;c<=cols;c++) {
      const bx=c*cw,by=r*ch;
      const dx=10*Math.sin(by*0.04+t*0.8+c*0.9)+6*Math.sin(by*0.07+t*0.5+c*1.7);
      const dy= 8*Math.sin(bx*0.035+t*0.6+r*1.1)+4*Math.sin(bx*0.065+t*0.9+r*0.7);
      pts[r][c]={x:bx+dx,y:by+dy};
    }
  }
  for (let r=0;r<rows;r++) {
    for (let c=0;c<cols;c++) {
      const tl=pts[r][c],tr=pts[r][c+1],bl=pts[r+1][c],br=pts[r+1][c+1];
      const flicker=0.4+0.6*Math.abs(Math.sin(t*0.6+r*1.3+c*0.8));
      const ccx=(tl.x+tr.x+bl.x+br.x)/4,ccy=(tl.y+tr.y+bl.y+br.y)/4;
      ctx.beginPath();
      ctx.moveTo((tl.x+tr.x)/2,(tl.y+tr.y)/2);
      ctx.quadraticCurveTo(tr.x,tr.y,(tr.x+br.x)/2,(tr.y+br.y)/2);
      ctx.quadraticCurveTo(br.x,br.y,(br.x+bl.x)/2,(br.y+bl.y)/2);
      ctx.quadraticCurveTo(bl.x,bl.y,(bl.x+tl.x)/2,(bl.y+tl.y)/2);
      ctx.quadraticCurveTo(tl.x,tl.y,(tl.x+tr.x)/2,(tl.y+tr.y)/2);
      ctx.closePath();
      const rMax=Math.max(cw,ch)*0.72;
      const g=ctx.createRadialGradient(ccx,ccy,rMax*0.18,ccx,ccy,rMax);
      g.addColorStop(0,    'rgba(30,120,80,0)');
      g.addColorStop(0.55, 'rgba(30,120,80,0)');
      g.addColorStop(0.75, `rgba(180,255,210,${0.18+0.22*flicker})`);
      g.addColorStop(0.9,  `rgba(220,255,235,${0.35+0.3*flicker})`);
      g.addColorStop(1,    `rgba(255,255,255,${0.15+0.15*flicker})`);
      ctx.fillStyle=g; ctx.fill();
    }
  }
  ctx.restore();
}

// ── Render loop ───────────────────────────────────────────
function render() {
  const W=canvas.width, H=canvas.height;

  if (!srcData || srcData.width!==W) {
    srcData = octx.createImageData(W,H);
    dstData = ctx.createImageData(W,H);
  }

  drawShapes(octx,W,H);
  srcData = octx.getImageData(0,0,W,H);
  const sd=srcData.data, dd=dstData.data;

  for (let y=0;y<H;y++) {
    for (let x=0;x<W;x++) {
      let dx=0,dy=0;
      waves.forEach(w=>{
        dx+=w.amp*Math.sin(y*w.freq+t*w.speed+w.phase);
        dy+=w.amp*Math.cos(x*w.freq*0.8+t*w.speed*0.9+w.phase+1);
      });
      const sx=Math.min(W-1,Math.max(0,Math.round(x+dx)));
      const sy=Math.min(H-1,Math.max(0,Math.round(y+dy)));
      const di=(y*W+x)*4, si=(sy*W+sx)*4;
      dd[di]=sd[si]; dd[di+1]=sd[si+1]; dd[di+2]=sd[si+2]; dd[di+3]=sd[si+3];
    }
  }
  ctx.putImageData(dstData,0,0);
  drawCaustics(W,H);
  drawWaveReflections(W,H);
  t+=0.03;
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
