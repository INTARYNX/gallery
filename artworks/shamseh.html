<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0604; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  #wrap {
    position: relative;
    width: min(95vw, 95vh);
    height: min(95vw, 95vh);
    /* carpet lying on floor shadow */
    filter: drop-shadow(0 30px 40px rgba(0,0,0,0.7)) drop-shadow(0 10px 15px rgba(0,0,0,0.5));
  }
  #c2d, #cgl { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c2d"></canvas>
  <canvas id="cgl"></canvas>
</div>
<script>
const S = 800;

// ── 2D canvas (scene) ─────────────────────────────────────
const c2d = document.getElementById('c2d');
c2d.width = c2d.height = S;
const ctx = c2d.getContext('2d');
const cx = S/2, cy = S/2;
const TAU = Math.PI * 2;

// ── WebGL canvas (post-fx) ────────────────────────────────
const cgl = document.getElementById('cgl');
cgl.width = cgl.height = S;
const gl = cgl.getContext('webgl', {premultipliedAlpha: false});

const VS = `
  attribute vec2 a_pos;
  varying vec2 v_uv;
  void main() {
    v_uv = a_pos * 0.5 + 0.5;
    gl_Position = vec4(a_pos, 0.0, 1.0);
  }
`;

const FS = `
  precision mediump float;
  uniform sampler2D u_tex;
  uniform float u_time;
  uniform vec2 u_res;
  varying vec2 v_uv;

  // Hash for fiber noise
  float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
  }

  // Rotating light beam (soft, like light sweeping across the carpet)
  float lightBeam(vec2 uv, float t) {
    vec2 d = uv - 0.5;
    float angle = atan(d.y, d.x);
    float beamAngle = mod(angle - t * 0.5, 3.14159 * 2.0);
    float beam = pow(max(0.0, cos(beamAngle * 3.0)), 14.0);
    float r = length(d);
    return beam * smoothstep(0.5, 0.05, r) * 0.15;
  }

  // Radial glow pulse from center (gentle breathing halo)
  float centerGlow(vec2 uv, float t) {
    float r = length(uv - 0.5);
    float pulse = 0.5 + 0.5 * sin(t * 1.0);
    float ring = exp(-pow((r - 0.22 - pulse * 0.03) * 20.0, 2.0));
    float core = exp(-r * r * 35.0) * (0.4 + 0.3 * pulse);
    return ring * 0.2 + core * 0.3;
  }

  // High-frequency fiber/pile texture
  float fiberNoise(vec2 uv) {
    vec2 p = uv * 800.0;
    float n = 0.0;
    // warp threads (horizontal)
    n += sin(p.y * 1.2 + hash(floor(p)) * 6.28) * 0.5;
    // weft threads (vertical)
    n += sin(p.x * 1.1 + hash(floor(p + 0.3)) * 6.28) * 0.5;
    // random pile tufts
    n += (hash(floor(p * 0.5)) - 0.5) * 0.8;
    return n;
  }

  // Wool pile shading - directional lighting on fibers
  float pileShading(vec2 uv) {
    vec2 p = uv * 400.0;
    // knots/tufts pattern
    float knots = sin(p.x * 3.0) * sin(p.y * 3.0);
    // fine fiber direction (slightly random per knot)
    vec2 cell = floor(p * 0.5);
    float dir = hash(cell) * 3.14159;
    vec2 fiberDir = vec2(cos(dir), sin(dir));
    float fiber = sin(dot(p, fiberDir) * 2.0);
    return knots * 0.15 + fiber * 0.1;
  }

  // Subtle wear/stain variation (large scale)
  float wearPattern(vec2 uv) {
    vec2 p = uv * 3.0;
    float w = sin(p.x * 1.3 + p.y * 0.7) * cos(p.y * 1.1 - p.x * 0.5);
    w += sin(p.x * 2.1) * cos(p.y * 1.9) * 0.5;
    return w * 0.08;
  }

  // Soft bloom (reduced for fabric)
  vec3 bloom(sampler2D tex, vec2 uv) {
    vec3 col = vec3(0.0);
    float s = 1.5 / 800.0;
    col += texture2D(tex, uv + vec2(-s,-s)).rgb * 0.05;
    col += texture2D(tex, uv + vec2(0.,-s)).rgb * 0.09;
    col += texture2D(tex, uv + vec2(s,-s)).rgb * 0.05;
    col += texture2D(tex, uv + vec2(-s,0.)).rgb * 0.09;
    col += texture2D(tex, uv).rgb * 0.44;
    col += texture2D(tex, uv + vec2(s,0.)).rgb * 0.09;
    col += texture2D(tex, uv + vec2(-s,s)).rgb * 0.05;
    col += texture2D(tex, uv + vec2(0.,s)).rgb * 0.09;
    col += texture2D(tex, uv + vec2(s,s)).rgb * 0.05;
    // only bright parts bloom
    float bright = max(0.0, dot(col, vec3(0.299,0.587,0.114)) - 0.65);
    return col * bright * 0.4;
  }

  void main() {
    vec2 uv = v_uv;
    uv.y = 1.0 - uv.y;

    vec4 col = texture2D(u_tex, uv);

    // Apply wool pile texture - makes it look woven
    float pile = pileShading(uv);
    col.rgb *= (1.0 + pile);

    // High-frequency fiber grain (the "fuzzy" look)
    float fiber = fiberNoise(uv) * 0.04;
    col.rgb += vec3(fiber * 0.9, fiber * 0.85, fiber * 0.75);

    // Large-scale wear/patina (makes it feel aged, real)
    float wear = wearPattern(uv);
    col.rgb *= (1.0 + wear);

    // Soft bloom on highlights only (gold threads catch light)
    vec3 b = bloom(u_tex, uv);
    col.rgb += b * 0.3;

    // Rotating light beam (warm gold tint)
    float beam = lightBeam(uv, u_time);
    col.rgb += vec3(beam * 0.8, beam * 0.55, beam * 0.15);

    // Center glow halo (breathing warm light)
    float glow = centerGlow(uv, u_time);
    col.rgb += vec3(glow * 0.2, glow * 0.13, glow * 0.04);

    // Directional lighting - soft light from upper-left (as if lit in a room)
    vec2 lightDir = normalize(vec2(-0.5, -0.7));
    float lightFalloff = dot(uv - 0.5, lightDir) * 0.1 + 1.0;
    col.rgb *= lightFalloff;

    // Soft vignette (edges slightly darker, like fabric curves)
    vec2 dv = uv - 0.5;
    float vig = 1.0 - dot(dv,dv) * 0.4;
    col.rgb *= max(vig, 0.7);

    // Overall brightness lift
    col.rgb *= 1.25;

    // Warm color grade (wool has warm undertones)
    col.r = pow(clamp(col.r, 0.0, 1.0), 0.95);
    col.g = pow(clamp(col.g, 0.0, 1.0), 1.0);
    col.b = pow(clamp(col.b, 0.0, 1.0), 1.08);

    // Slightly desaturated - real carpets are never neon
    float gray = dot(col.rgb, vec3(0.299, 0.587, 0.114));
    col.rgb = mix(vec3(gray), col.rgb, 0.88);

    // Gentle contrast
    col.rgb = (col.rgb - 0.5) * 1.02 + 0.52;

    gl_FragColor = vec4(clamp(col.rgb, 0.0, 1.0), 1.0);
  }
`;

function compileShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compileShader(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const uTex  = gl.getUniformLocation(prog, 'u_tex');
const uTime = gl.getUniformLocation(prog, 'u_time');
const uRes  = gl.getUniformLocation(prog, 'u_res');

const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

// ── Palettes (more muted, realistic carpet colors) ────────
const THEMES = [
  { bg:'#7a3222', deep:'#5a2010', gold:'#b89038', goldL:'#d8b058', teal:'#245040', tealL:'#346850', rust:'#902818', rustL:'#b04828', ivory:'#d8c8a0', blue:'#202e48', blueL:'#304868' },
  { bg:'#344050', deep:'#242e40', gold:'#a88038', goldL:'#c8a058', teal:'#405838', tealL:'#607848', rust:'#703828', rustL:'#905838', ivory:'#d0c098', blue:'#201e38', blueL:'#383048' },
  { bg:'#423020', deep:'#302010', gold:'#b08830', goldL:'#d0a848', teal:'#304028', tealL:'#486838', rust:'#682818', rustL:'#904028', ivory:'#d4c498', blue:'#28283e', blueL:'#403858' },
  { bg:'#243028', deep:'#142018', gold:'#a08030', goldL:'#c0a040', teal:'#284838', tealL:'#386848', rust:'#602418', rustL:'#883828', ivory:'#ccbc90', blue:'#202038', blueL:'#383048' },
];

function hexToRgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');}
function lerpHex(a,b,f){const ca=hexToRgb(a),cb=hexToRgb(b);return rgbToHex(ca[0]+(cb[0]-ca[0])*f,ca[1]+(cb[1]-ca[1])*f,ca[2]+(cb[2]-ca[2])*f);}
function smoothstep(t){return t*t*(3-2*t);}

let C = {...THEMES[0]};
let themeFrom=0, themeTo=1, themeProgress=0;
const THEME_HOLD=8, THEME_FADE=3;

function tickColors(dt){
  themeProgress+=dt;
  const cycle=THEME_HOLD+THEME_FADE;
  if(themeProgress>=cycle){themeProgress-=cycle;themeFrom=themeTo;themeTo=(themeTo+1)%THEMES.length;}
  const f=themeProgress<THEME_HOLD?0:smoothstep((themeProgress-THEME_HOLD)/THEME_FADE);
  const A=THEMES[themeFrom],B=THEMES[themeTo];
  Object.keys(A).forEach(k=>{C[k]=lerpHex(A[k],B[k],f);});
}

// ── Weave texture (denser, more fabric-like) ─────────────
const weaveCanvas = document.createElement('canvas');
weaveCanvas.width = weaveCanvas.height = 6;
const wctx = weaveCanvas.getContext('2d');
// horizontal warp
wctx.fillStyle='rgba(0,0,0,0.22)';
wctx.fillRect(0,0,6,1); wctx.fillRect(0,3,6,1);
// vertical weft
wctx.fillStyle='rgba(0,0,0,0.18)';
wctx.fillRect(0,0,1,6); wctx.fillRect(3,0,1,6);
// highlights
wctx.fillStyle='rgba(255,240,200,0.08)';
wctx.fillRect(1,1,1,1); wctx.fillRect(4,4,1,1);
const weavePattern = ctx.createPattern(weaveCanvas,'repeat');

// Noise texture (wool variation)
const noiseCanvas = document.createElement('canvas');
noiseCanvas.width = noiseCanvas.height = 512;
const nctx = noiseCanvas.getContext('2d');
const nimg = nctx.createImageData(512,512);
for(let i=0;i<nimg.data.length;i+=4){
  const v=Math.random()*45|0;
  nimg.data[i]=v; nimg.data[i+1]=v*0.8|0; nimg.data[i+2]=v*0.6|0;
  nimg.data[i+3]=Math.random()*255|0;
}
nctx.putImageData(nimg,0,0);

const R = { halo:S*0.36, petal:S*0.285, s12:S*0.22, s8:S*0.135, s6:S*0.062, jewel:S*0.022 };

let gradCache={}, lastGradKey='';
function buildGrads(){
  const key=C.blueL+C.blue+C.deep+C.goldL+C.gold+C.rust+C.tealL;
  if(key===lastGradKey) return;
  lastGradKey=key;
  const g12=ctx.createRadialGradient(cx,cy,0,cx,cy,R.s12);
  g12.addColorStop(0,C.blueL); g12.addColorStop(0.6,C.blue); g12.addColorStop(1,C.deep);
  const g8=ctx.createRadialGradient(cx,cy,0,cx,cy,R.s8);
  g8.addColorStop(0,C.goldL); g8.addColorStop(0.6,C.gold); g8.addColorStop(1,C.rust);
  const g6=ctx.createRadialGradient(cx,cy,0,cx,cy,R.s6);
  g6.addColorStop(0,C.goldL); g6.addColorStop(1,C.tealL);
  const gj=ctx.createRadialGradient(cx,cy,0,cx,cy,R.jewel);
  gj.addColorStop(0,C.ivory); gj.addColorStop(0.4,C.goldL); gj.addColorStop(1,C.gold);
  gradCache={g12,g8,g6,gj};
}

function poly(x,y,r,n,rot){
  ctx.beginPath();
  for(let i=0;i<n;i++){const a=(i*TAU/n)+rot;i?ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r):ctx.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}
  ctx.closePath();
}
function starPath(x,y,r,pts,inner,rot){
  ctx.beginPath();
  for(let i=0;i<pts*2;i++){const a=(i*Math.PI/pts)+rot,rad=i%2===0?r:inner;ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad);}
  ctx.closePath();
}
function spoke(r1,r2,a){ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);ctx.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);ctx.stroke();}
function chord(r1,a1,r2,a2){ctx.beginPath();ctx.moveTo(cx+Math.cos(a1)*r1,cy+Math.sin(a1)*r1);ctx.lineTo(cx+Math.cos(a2)*r2,cy+Math.sin(a2)*r2);ctx.stroke();}

function drawCarpetBg(){
  ctx.fillStyle=C.bg; ctx.fillRect(0,0,S,S);
  ctx.fillStyle=weavePattern; ctx.fillRect(0,0,S,S);
  // wool variation
  ctx.save();
  ctx.globalAlpha=0.25;
  ctx.drawImage(noiseCanvas,0,0,S,S);
  ctx.restore();
  // subtle abrash (color irregularity bands typical of hand-dyed wool)
  ctx.save();
  ctx.globalAlpha=0.08;
  for(let i=0;i<8;i++){
    ctx.fillStyle=i%2?C.deep:C.rustL;
    ctx.fillRect(0, (S/8)*i + Math.sin(i)*5, S, S/8);
  }
  ctx.restore();
}

function drawBorder(t){
  const rot=t*0.3;
  [{m:10,lw:6,col:C.rust},{m:16,lw:1.5,col:C.ivory},{m:20,lw:1,col:C.gold},
   {m:38,lw:1,col:C.gold},{m:42,lw:1.5,col:C.ivory},{m:46,lw:4,col:C.deep}]
    .forEach(({m,lw,col})=>{ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.strokeRect(m,m,S-m*2,S-m*2);});
  const bm=20,bw=18,step=bw*1.05,count=Math.floor((S-bm*2)/step);
  for(let side=0;side<4;side++){
    for(let i=0;i<count;i++){
      const pos=bm+i*step+step/2;
      const x=side<2?pos:(side===2?bm+bw/2:S-bm-bw/2);
      const y=side<2?(side===0?bm+bw/2:S-bm-bw/2):pos;
      if(i%2===0){starPath(x,y,bw*.42,8,bw*.18,Math.PI/8+rot);}
      else{starPath(x,y,bw*.35,6,bw*.15,Math.PI/6+rot);}
      ctx.fillStyle=i%2===0?C.teal:C.rust; ctx.fill();
      ctx.strokeStyle=C.ivory; ctx.lineWidth=0.8; ctx.stroke();
    }
  }
  [[bm+bw/2,bm+bw/2],[S-bm-bw/2,bm+bw/2],[S-bm-bw/2,S-bm-bw/2],[bm+bw/2,S-bm-bw/2]].forEach(([x,y])=>{
    starPath(x,y,bw*.52,8,Math.PI/8+rot);
    ctx.fillStyle=C.gold; ctx.fill();
    ctx.strokeStyle=C.ivory; ctx.lineWidth=1; ctx.stroke();
    ctx.beginPath(); ctx.arc(x,y,bw*.14,0,TAU);
    ctx.fillStyle=C.rust; ctx.fill();
  });
}

function drawMedallion(t){
  buildGrads();
  const {g12,g8,g6,gj}=gradCache;
  const br=t*0.25, rot8=-br*1.4, rot6=br*2.1;

  ctx.strokeStyle=C.ivory; ctx.lineWidth=1;
  for(let i=0;i<24;i++) spoke(R.jewel,R.halo,(i*TAU/24)+br*0.5);
  ctx.strokeStyle=C.gold; ctx.lineWidth=0.9;
  for(let i=0;i<12;i++) chord(R.petal,(i*TAU/12)+br,R.petal,((i+4)*TAU/12)+br);
  ctx.strokeStyle=C.ivory; ctx.lineWidth=1;
  for(let i=0;i<12;i++){const a=(i*TAU/12)+br; chord(R.petal,a,R.s12,a+Math.PI/6); chord(R.petal,a,R.s12,a-Math.PI/6);}
  ctx.strokeStyle=C.ivory; ctx.lineWidth=1.2;
  for(let i=0;i<12;i++) chord(R.s12*0.44,(i*TAU/12)+br,R.s12,((i+4)*TAU/12)+br);
  ctx.strokeStyle=C.gold; ctx.lineWidth=1;
  for(let i=0;i<8;i++){const a=(i*TAU/8)+Math.PI/8+rot8; chord(R.s12*0.28,a,R.s8,a);}
  ctx.strokeStyle=C.ivory; ctx.lineWidth=1.2;
  for(let i=0;i<8;i++) chord(R.s8*0.42,(i*TAU/8)+Math.PI/8+rot8,R.s8*0.9,((i+3)*TAU/8)+Math.PI/8+rot8);
  ctx.strokeStyle=C.ivory; ctx.lineWidth=1;
  for(let i=0;i<6;i++) chord(R.s8*0.28,(i*TAU/6)+rot6,R.s6,(i*TAU/6)+rot6);

  ctx.strokeStyle=C.gold; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.arc(cx,cy,R.halo,0,TAU); ctx.stroke();

  for(let i=0;i<24;i++){
    const a=(i*TAU/24)+br*0.5, pR=R.halo*0.062;
    starPath(cx+Math.cos(a)*R.halo,cy+Math.sin(a)*R.halo,pR,6,pR*0.4,a+t*0.5);
    ctx.fillStyle=i%2===0?C.teal:C.rust; ctx.fill();
    ctx.strokeStyle=C.ivory; ctx.lineWidth=0.8; ctx.stroke();
  }
  const pLen=R.petal*0.44,pW=R.petal*0.11;
  for(let i=0;i<12;i++){
    const a=(i*TAU/12)+br, ox=cx+Math.cos(a)*R.petal*0.5, oy=cy+Math.sin(a)*R.petal*0.5;
    ctx.save(); ctx.translate(ox,oy); ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(0,-pLen);
    ctx.bezierCurveTo(pW,-pLen*0.3,pW,pLen*0.3,0,pLen);
    ctx.bezierCurveTo(-pW,pLen*0.3,-pW,-pLen*0.3,0,-pLen);
    ctx.closePath();
    ctx.fillStyle=i%3===0?C.gold:i%3===1?C.teal:C.rust; ctx.fill();
    ctx.strokeStyle=C.ivory; ctx.lineWidth=1; ctx.stroke();
    ctx.restore();
  }
  starPath(cx,cy,R.s12,12,R.s12*0.44,br);
  ctx.fillStyle=g12; ctx.fill(); ctx.strokeStyle=C.goldL; ctx.lineWidth=1.5; ctx.stroke();
  starPath(cx,cy,R.s8,8,R.s8*0.42,Math.PI/8+rot8);
  ctx.fillStyle=g8; ctx.fill(); ctx.strokeStyle=C.ivory; ctx.lineWidth=1.5; ctx.stroke();
  for(let i=0;i<8;i++){
    const a=(i*TAU/8)+Math.PI/8+rot8;
    starPath(cx+Math.cos(a)*R.s8*0.82,cy+Math.sin(a)*R.s8*0.82,R.s8*0.16,4,R.s8*0.07,a);
    ctx.fillStyle=i%2===0?C.teal:C.rust; ctx.fill(); ctx.strokeStyle=C.ivory; ctx.lineWidth=1; ctx.stroke();
  }
  starPath(cx,cy,R.s6,6,R.s6*0.4,rot6);
  ctx.fillStyle=g6; ctx.fill(); ctx.strokeStyle=C.ivory; ctx.lineWidth=1; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,R.jewel,0,TAU);
  ctx.fillStyle=gj; ctx.fill(); ctx.strokeStyle=C.ivory; ctx.lineWidth=1; ctx.stroke();
}

// ── Loop ─────────────────────────────────────────────────
let last=null, T=0;
function draw(ts){
  const dt=last?Math.min((ts-last)/1000,0.05):0;
  last=ts; T=(T+dt)%10000;
  tickColors(dt);

  drawCarpetBg();
  drawBorder(T);
  drawMedallion(T);

  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c2d);

  gl.viewport(0,0,S,S);
  gl.uniform1i(uTex,0);
  gl.uniform1f(uTime,T);
  gl.uniform2f(uRes,S,S);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
