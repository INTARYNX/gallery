<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aevum</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: monospace;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  canvas {
    background: #000;
    border-radius: 4px;
    touch-action: none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, CENTER = { x: 0, y: 0 };

function resize() {
  const s = Math.min(window.innerWidth, window.innerHeight) * 0.92;
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = s + 'px';
  cv.style.height = s + 'px';
  cv.width = s * dpr;
  cv.height = s * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  W = s; H = s;
  CENTER = { x: W / 2, y: H / 2 };
}
window.addEventListener('resize', resize);
resize();

const ALIEN_ALPHABET = {
  A: [['arc',2],['radial',1],['arc',-2],['radial',-1]],
  B: [['radial',1],['arc',3],['radial',-1],['arc',-3]],
  C: [['arc',3]],
  D: [['radial',1],['arc',2],['radial',-1]],
  E: [['arc',2],['radial',1],['arc',-1],['radial',-1]],
  F: [['radial',1],['arc',1],['radial',-1],['arc',1]],
  G: [['arc',3],['radial',1],['arc',-1]],
  H: [['radial',1],['arc',2],['radial',-1],['radial',1],['arc',-2]],
  I: [['radial',1],['radial',-1]],
  J: [['radial',1],['arc',2]],
  K: [['radial',1],['arc',2],['arc',-2],['radial',-1]],
  L: [['radial',-1],['arc',2]],
  M: [['radial',1],['arc',1],['radial',-1],['radial',1],['arc',1],['radial',-1]],
  N: [['radial',1],['arc',2],['radial',-1]],
  O: [['arc',8]],
  P: [['radial',1],['arc',2],['radial',-1],['arc',-2]],
  Q: [['arc',8],['radial',1]],
  R: [['radial',1],['arc',2],['radial',-1],['arc',1]],
  S: [['arc',2],['arc',-2],['arc',2]],
  T: [['arc',2],['radial',1]],
  U: [['radial',1],['arc',2],['radial',-1]],
  V: [['radial',1],['arc',1],['radial',-1]],
  W: [['radial',1],['arc',1],['radial',-1],['arc',1],['radial',1],['arc',1],['radial',-1]],
  X: [['arc',2],['arc',-4],['arc',2]],
  Y: [['radial',1],['arc',1],['radial',1]],
  Z: [['arc',2],['radial',-1],['arc',2]]
};

const ALIEN_WORDS = [
  "XAR","VOTH","QIRA","NEX","KHOR","ZYTH","ARQEN","VEL",
  "IXOR","THAQ","ZORAN","VEXIL","KYR","ORTH","QEX"
];

const SURF = ['#ffffff', '#7df9ff', '#2ec5ff', '#4d6bff', '#9b5cff'];
function surfColor(i, a) {
  const c = SURF[((i % SURF.length) + SURF.length) % SURF.length];
  if (a === undefined) return c;
  const n = parseInt(c.slice(1), 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

function wordToGlyph(word) {
  const seq = [];
  for (const ch of word) {
    const letter = ALIEN_ALPHABET[ch];
    if (!letter) continue;
    seq.push(...letter);
    seq.push(null);
  }
  return seq;
}

const STEP_ANGLE = Math.PI / 12;
const MAX_LEN = 20;

function newWord() {
  return ALIEN_WORDS[Math.floor(Math.random() * ALIEN_WORDS.length)];
}

// Tunnel: each ring lives at a depth z. Depth shrinks every frame so rings
// fly toward the viewer; when z passes the camera it respawns at the back.
const Z_NEAR = 0.12;
const Z_FAR = 5.0;
const FOV = 0.85;

function makeRing(z) {
  return {
    z,
    baseRadius: 280 + Math.random() * 120,
    stepRadius: 26,
    angle: Math.random() * Math.PI * 2,
    radius: 280,
    glyph: wordToGlyph(newWord()),
    gi: 0,
    arcLeft: undefined,
    body: [],
    hue: Math.random() * 360,
    spin: (Math.random() < 0.5 ? 1 : -1) * (0.004 + Math.random() * 0.01),
    roll: Math.random() * Math.PI * 2
  };
}

const RING_COUNT = 20;
let rings = [];
function build() {
  rings = [];
  for (let i = 0; i < RING_COUNT; i++) {
    const z = Z_NEAR + (Z_FAR - Z_NEAR) * (i / RING_COUNT);
    rings.push(makeRing(z));
  }
}
build();

function step(sn) {
  if (sn.gi >= sn.glyph.length) {
    sn.glyph = wordToGlyph(newWord());
    sn.gi = 0;
    sn.body.unshift(null);
  }
  const stroke = sn.glyph[sn.gi];
  if (stroke === null) {
    sn.body.unshift(null);
    sn.gi++;
    return;
  }
  const [type, val] = stroke;
  if (type === 'arc') {
    sn.angle += STEP_ANGLE * Math.sign(val);
    sn.arcLeft = (sn.arcLeft ?? Math.abs(val)) - 1;
    if (sn.arcLeft <= 0) { sn.gi++; sn.arcLeft = undefined; }
  } else {
    sn.radius += sn.stepRadius * val;
    sn.radius = Math.max(40, Math.min(sn.baseRadius + sn.stepRadius, sn.radius));
    sn.gi++;
  }
  // store in ring-local polar coords (angle, radius); projection happens at draw
  sn.body.unshift({ a: sn.angle, r: sn.radius });
  if (sn.body.length > MAX_LEN) sn.body.pop();
}

let tick = 0;
let warp = 0;
let radPhase = 0;
let stepAccum = 0;

// 0 (near) -> 1 (far): how much a ring dissolves into the haze
function fogAmount(z) {
  return Math.min(1, Math.max(0, (z - Z_NEAR) / (Z_FAR - Z_NEAR)));
}
// blend a surf color toward the bluish-violet haze by fog amount
function fogColor(i, a, z) {
  const c = SURF[((i % SURF.length) + SURF.length) % SURF.length];
  const n = parseInt(c.slice(1), 16);
  let r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  const f = fogAmount(z);
  const FR = 60, FG = 40, FB = 110;
  r = r + (FR - r) * f * 0.85;
  g = g + (FG - g) * f * 0.85;
  b = b + (FB - b) * f * 0.85;
  return `rgba(${r|0},${g|0},${b|0},${a})`;
}

function project(z, a, r, roll) {
  const scale = FOV / z;
  const ang = a + roll;
  // tunnel sway so the throat drifts like a living wormhole
  const swayX = Math.sin(warp * 0.4 + z * 0.6) * 40;
  const swayY = Math.cos(warp * 0.33 + z * 0.5) * 40;
  return {
    x: CENTER.x + (Math.cos(ang) * r + swayX) * scale,
    y: CENTER.y + (Math.sin(ang) * r + swayY) * scale,
    scale
  };
}

function drawRing(sn) {
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  // depth fade: far = dim, near = bright then fade out at the very front
  const depthFade = Math.min(1, (sn.z - Z_NEAR) / 0.5) * Math.min(1, (Z_FAR - sn.z) / 1.5 + 0.3);
  let prev = null;
  for (let i = 0; i < sn.body.length; i++) {
    const raw = sn.body[i];
    if (!raw) { prev = null; continue; }
    const p = project(sn.z, raw.a, raw.r, sn.roll);
    if (prev) {
      // dim near the vanishing point so additive blending can't clip to white
      const cd = Math.hypot(p.x - CENTER.x, p.y - CENTER.y);
      const centerDim = Math.min(1, cd / (Math.min(W, H) * 0.20));
      const fade = (1 - i / sn.body.length) * depthFade * centerDim;
      const ci = Math.floor((sn.hue / 47) + i * 0.5);
      ctx.strokeStyle = fogColor(ci, fade * 0.95, sn.z);
      ctx.globalAlpha = fade * 0.95;
      ctx.lineWidth = (1 + fade * 3) * p.scale * 1.4;
      ctx.beginPath();
      ctx.moveTo(prev.x, prev.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
    prev = p;
  }
  const headRaw = sn.body.find(b => b);
  if (headRaw) {
    const p = project(sn.z, headRaw.a, headRaw.r, sn.roll);
    ctx.globalAlpha = depthFade;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3.2 * p.scale * 1.4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawCore() {
  const breath = Math.sin(tick * 0.025) * Math.sin(tick * 0.011 + 1.3);
  const pulse = 0.5 + 0.5 * breath;
  const maxR = Math.min(W, H) * 0.18;

  let core = ctx.createRadialGradient(CENTER.x, CENTER.y, 0, CENTER.x, CENTER.y, maxR);
  core.addColorStop(0, 'rgba(255,240,200,0.9)');
  core.addColorStop(0.15, 'rgba(255,190,60,0.7)');
  core.addColorStop(0.45, `rgba(255,110,30,${0.35 + pulse * 0.2})`);
  core.addColorStop(1, 'rgba(255,40,20,0)');
  ctx.fillStyle = core;
  ctx.beginPath();
  ctx.arc(CENTER.x, CENTER.y, maxR, 0, Math.PI * 2);
  ctx.fill();
}

function loop() {
  warp += 0.08;

  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(0,0,0,0.05)';
  ctx.fillRect(0, 0, W, H);

  tick += 3;
  radPhase += 0.004;
  stepAccum += 0.7 + 0.6 * (0.5 + 0.5 * Math.sin(tick * 0.009));
  const steps = Math.floor(stepAccum);
  stepAccum -= steps;

  // fly the tunnel: shrink z, respawn at the back, advance glyph snakes
  const dz = 0.012 + 0.008 * (0.5 + 0.5 * Math.sin(tick * 0.013));
  for (const sn of rings) {
    sn.z -= dz;
    sn.roll += sn.spin;
    if (sn.z <= Z_NEAR) {
      sn.z += (Z_FAR - Z_NEAR);
      sn.glyph = wordToGlyph(newWord());
      sn.gi = 0;
      sn.body = [];
      sn.hue = Math.random() * 360;
    }
    for (let s = 0; s < steps; s++) step(sn);
    while (sn.body.length > MAX_LEN) sn.body.pop();
  }

  // draw far-to-near so nearer rings overlap correctly
  rings.sort((a, b) => b.z - a.z);
  ctx.globalCompositeOperation = 'lighter';
  // longitudinal struts: connect each segment to the same-index segment of the next ring
  ctx.lineCap = 'round';
  for (let i = 0; i < rings.length - 1; i++) {
    const a = rings[i], b = rings[i + 1];
    if (Math.abs(a.z - b.z) > (Z_FAR - Z_NEAR) * 0.5) continue;
    const depthFade = Math.min(1, (b.z - Z_NEAR) / 0.5) * Math.min(1, (Z_FAR - b.z) / 1.5 + 0.3);
    const len = Math.min(a.body.length, b.body.length);
    for (let j = 0; j < len; j++) {
      const sa = a.body[j], sb = b.body[j];
      if (!sa || !sb) continue;
      const pa = project(a.z, sa.a, sa.r, a.roll);
      const pb = project(b.z, sb.a, sb.r, b.roll);
      const cd = Math.hypot((pa.x + pb.x) / 2 - CENTER.x, (pa.y + pb.y) / 2 - CENTER.y);
      const centerDim = Math.min(1, cd / (Math.min(W, H) * 0.18));
      const fade = (1 - j / len) * depthFade * centerDim;
      ctx.strokeStyle = fogColor(Math.floor(a.hue / 47) + j, fade * 0.5, b.z);
      ctx.globalAlpha = fade * 0.5;
      ctx.lineWidth = 1 + pb.scale * 1.0;
      ctx.beginPath();
      ctx.moveTo(pa.x, pa.y);
      ctx.lineTo(pb.x, pb.y);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  // volumetric haze: bluish-violet brume pooling at the vanishing point
  const hazePulse = 0.5 + 0.5 * Math.sin(tick * 0.01);
  let haze = ctx.createRadialGradient(CENTER.x, CENTER.y, 0, CENTER.x, CENTER.y, Math.min(W, H) * 0.55);
  haze.addColorStop(0, `rgba(90,70,170,${0.12 + hazePulse * 0.04})`);
  haze.addColorStop(0.4, 'rgba(50,40,110,0.07)');
  haze.addColorStop(1, 'rgba(20,15,50,0)');
  ctx.fillStyle = haze;
  ctx.fillRect(0, 0, W, H);
  for (const sn of rings) drawRing(sn);
  ctx.globalCompositeOperation = 'source-over';

  requestAnimationFrame(loop);
}

function drawFlares() {
  const n = 5;
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const seed = Math.floor(tick / 18) * 7.1 + i * 131.7;
    const ang = (Math.sin(seed) * 0.5 + 0.5) * Math.PI * 2;
    const flick = Math.sin(seed * 3.3) * 0.5 + 0.5;
    if (flick < 0.7) continue;
    const len = Math.min(W, H) * (0.2 + flick * 0.45);
    const jitter = (Math.sin(seed * 9.7)) * 6;
    const ci = Math.floor(flick * SURF.length);
    ctx.strokeStyle = surfColor(ci, 0.12 + flick * 0.2);
    ctx.lineWidth = 1 + flick * 2;
    ctx.beginPath();
    ctx.moveTo(CENTER.x, CENTER.y);
    ctx.lineTo(
      CENTER.x + Math.cos(ang) * len + jitter,
      CENTER.y + Math.sin(ang) * len - jitter
    );
    ctx.stroke();
  }
  const burst = Math.sin(tick * 0.013) * Math.sin(tick * 0.041);
  if (burst > 0.93) {
    const t = (burst - 0.93) / 0.07;
    ctx.globalAlpha = t * 0.22;
    let bg = ctx.createRadialGradient(CENTER.x, CENTER.y, 0, CENTER.x, CENTER.y, Math.min(W,H)*0.5);
    bg.addColorStop(0, 'rgba(255,255,255,0.9)');
    bg.addColorStop(0.3, 'rgba(255,200,90,0.4)');
    bg.addColorStop(1, 'rgba(255,60,30,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    const cold = ['rgba(150,80,255,', 'rgba(40,230,255,', 'rgba(255,60,220,'];
    for (let i = 0; i < 3; i++) {
      const ang = Math.sin(tick * 0.07 + i * 2.1) * Math.PI * 2;
      const len = Math.min(W, H) * 0.45;
      ctx.strokeStyle = cold[i] + (t * 0.6) + ')';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(CENTER.x, CENTER.y);
      ctx.lineTo(CENTER.x + Math.cos(ang) * len, CENTER.y + Math.sin(ang) * len);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  ctx.globalCompositeOperation = 'source-over';
}
loop();

window.addEventListener('resize', () => { resize(); build(); });
</script>
</body>
</html>
