<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bool Computer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        
        #monitor {
            position: relative;
            padding: 60px 60px 120px 60px;
            background: linear-gradient(135deg, #e6dcc8 0%, #d9cdb4 25%, #c9bda3 50%, #baac8f 75%, #aa9b7c 100%);
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 3px 8px rgba(255,255,240,0.15), inset 0 -2px 6px rgba(80,70,50,0.4);
            width: 90vw;
            max-width: 1800px;
            overflow: hidden;
        }
        
        #monitor::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 30% 40%, rgba(200,190,170,0.2) 0%, transparent 60%),
                        radial-gradient(circle at 70% 60%, rgba(160,150,130,0.15) 0%, transparent 50%);
            border-radius: 25px;
            pointer-events: none;
            z-index: 1;
        }
        
        #boolean-light {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 25px;
            pointer-events: none;
            opacity: 0.6;
            mix-blend-mode: overlay;
            z-index: 2;
        }
        
        #screen-bezel {
            position: relative;
            padding: 20px;
            background: linear-gradient(135deg, #4a3a2a 0%, #3a2a1a 50%, #2a1a0a 100%);
            border-radius: 12px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.95), inset 0 5px 10px rgba(0,0,0,0.8);
            border: 4px solid #2a1a0a;
            z-index: 3;
        }
        
        #logo {
            position: absolute;
            top: -47px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 40px;
            z-index: 10;
        }
        
        @media (max-width: 768px) {
            #logo {
                top: -32px;
                width: 60px;
                height: 30px;
            }
        }
        
        #screen-frame {
            position: relative;
            padding: 0;
            background: linear-gradient(145deg, #3a2a1a, #2a1a0a);
            border-radius: 10px;
            box-shadow: 0 0 0 3px #4a3a2a, inset 0 2px 5px rgba(0,0,0,0.6);
        }
        
        #canvas-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
        }
        
        #canvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 8px;
        }
        
        #monitor::after {
            content: 'BOOL COMPUTER';
            position: absolute;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%);
            color: #9a8a6a;
            background: linear-gradient(135deg, #3a3020 0%, #2a2010 100%);
            padding: 8px 30px;
            border-radius: 15px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            box-shadow: inset 0 1px 1px rgba(220,210,180,0.1), inset 0 -1px 2px rgba(0,0,0,0.5), 0 2px 4px rgba(0,0,0,0.4);
            border: 1px solid #1a1000;
        }
        
        #power-section {
            position: absolute;
            bottom: 35px;
            right: 45px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        #power-button {
            width: 45px;
            height: 45px;
            border-radius: 6px;
            background: radial-gradient(circle at 30% 30%, #d9cdb4, #baac8f);
            border: 3px solid #9a8a6a;
            box-shadow: 0 3px 6px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,240,0.3), inset 0 -2px 4px rgba(80,70,50,0.4);
            cursor: pointer;
            position: relative;
            transition: all 0.15s;
        }
        
        #power-button:active {
            transform: translateY(3px);
        }
        
        #power-button::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23555" stroke-width="3"><path d="M12 2v10M18.36 6.64a9 9 0 1 1-12.73 0"/></svg>') no-repeat center;
            background-size: contain;
        }
        
        #power-led {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff3300;
            box-shadow: 0 0 8px #ff3300, 0 0 16px #ff3300, 0 0 24px rgba(255,51,0,0.6);
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        @media (max-width: 768px) {
            #monitor {
                padding: 30px 30px 60px 30px;
                width: 95vw;
            }
            #monitor::after {
                font-size: 10px;
                padding: 5px 18px;
                bottom: 20px;
            }
            #power-section {
                bottom: 18px;
                right: 25px;
                gap: 8px;
            }
            #power-button {
                width: 24px;
                height: 24px;
                border: 2px solid #9a8a6a;
            }
            #power-button::before {
                width: 10px;
                height: 10px;
            }
            #power-led {
                width: 6px;
                height: 6px;
            }
            #screen-bezel {
                padding: 12px;
                border: 3px solid #2a1a0a;
            }
        }
    </style>
</head>
<body>
    <div id="monitor">
        <canvas id="boolean-light"></canvas>
        <div id="screen-bezel">
            <canvas id="logo"></canvas>
            <div id="screen-frame">
                <div id="canvas-container">
                    <canvas id="canvas"></canvas>
                </div>
            </div>
        </div>
        <div id="power-section">
            <div id="power-button"></div>
            <div id="power-led"></div>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const lightCanvas = document.getElementById('boolean-light');
        const lightCtx = lightCanvas.getContext('2d');
        const logoCanvas = document.getElementById('logo');
        const logoCtx = logoCanvas.getContext('2d');
        
        const operations = [
            { name: 'A ∧ B', op: 'and' },
            { name: 'A ∨ B', op: 'or' },
            { name: 'A ⊕ B', op: 'xor' },
            { name: '¬A', op: 'not' },
            { name: '¬(A ∧ B)', op: 'nand' },
            { name: '¬(A ∨ B)', op: 'nor' },
            { name: 'A → B', op: 'imply' },
            { name: 'A ≡ B', op: 'equiv' },
            { name: 'A ∧ ¬B', op: 'a_and_not_b' },
            { name: '¬A ∧ B', op: 'not_a_and_b' },
            { name: 'A ∨ ¬B', op: 'a_or_not_b' },
            { name: '¬A ∨ B', op: 'not_a_or_b' }
        ];
        let currentOp = 0;
        let frame = 0;
        let particles = [];
        let crtOn = false;
        let crtTransition = 0;
        let powerOn = false;
        let animationId = null;

        class Particle {
            constructor(x, y, vx, vy, hue, op) {
                this.x = x; 
                this.y = y; 
                this.vx = vx; 
                this.vy = vy; 
                this.hue = hue; 
                this.life = 1;
                this.op = op;
                this.angle = Math.atan2(vy, vx);
            }
            update() { 
                switch(this.op) {
                    case 'and':
                        this.vx *= 0.98;
                        this.vy *= 0.98;
                        break;
                    case 'or':
                        this.vx *= 1.02;
                        this.vy *= 1.02;
                        break;
                    case 'xor':
                        this.angle += 0.1;
                        const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                        this.vx = Math.cos(this.angle) * speed;
                        this.vy = Math.sin(this.angle) * speed;
                        break;
                    case 'not':
                        if (Math.random() < 0.05) {
                            this.vx *= -1;
                            this.vy *= -1;
                        }
                        break;
                    case 'nand':
                        this.vx += (Math.random() - 0.5) * 0.5;
                        this.vy += (Math.random() - 0.5) * 0.5;
                        break;
                    case 'nor':
                        this.vx *= 0.95;
                        this.vy *= 0.95;
                        break;
                    case 'imply':
                        this.vx += 0.1;
                        break;
                    case 'equiv':
                        this.vx = Math.sin(this.life * 10) * 2;
                        break;
                    case 'a_and_not_b':
                        this.vx -= 0.1;
                        break;
                    case 'not_a_and_b':
                        this.vx += 0.1;
                        break;
                    case 'a_or_not_b':
                        this.vy += Math.sin(this.x * 0.1) * 0.2;
                        break;
                    case 'not_a_or_b':
                        this.vx += 0.05;
                        this.vy += 0.05;
                        break;
                }
                this.x += this.vx; 
                this.y += this.vy; 
                this.life -= 0.01; 
            }
            draw() {
                const size = this.op === 'and' ? 2 : this.op === 'or' ? 4 : 3;
                ctx.fillStyle = `hsla(${this.hue}, 100%, 60%, ${this.life})`;
                ctx.fillRect(this.x, this.y, size, size);
            }
        }

        function plasma(x, y, t) {
            return Math.sin(x * 0.03 + t) + Math.sin(y * 0.02 + t * 1.5) + Math.sin((x + y) * 0.02 + t) + Math.sin(Math.sqrt(x * x + y * y) * 0.025 + t * 1.2);
        }

        function isInCircle(x, y, cx, cy, r) {
            return (x - cx) ** 2 + (y - cy) ** 2 <= r ** 2;
        }

        function applyBooleanOp(A, B, opName) {
            switch(opName) {
                case 'and': return A && B;
                case 'or': return A || B;
                case 'xor': return A !== B;
                case 'not': return !A;
                case 'nand': return !(A && B);
                case 'nor': return !(A || B);
                case 'imply': return !A || B;
                case 'equiv': return A === B;
                case 'a_and_not_b': return A && !B;
                case 'not_a_and_b': return !A && B;
                case 'a_or_not_b': return A || !B;
                case 'not_a_or_b': return !A || B;
                default: return false;
            }
        }

        function drawGlowCircle(x, y, r, hue) {
            for (let i = 5; i > 0; i--) {
                ctx.globalAlpha = 0.15 / i;
                ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
                ctx.beginPath();
                ctx.arc(x, y, r + i * 8, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function resize() {
            const container = document.getElementById('canvas-container');
            const rect = container.getBoundingClientRect();
            if (rect.width > 0 && rect.height > 0) {
                canvas.width = rect.width;
                canvas.height = rect.height;
            }
            const monitor = document.getElementById('monitor');
            const monitorRect = monitor.getBoundingClientRect();
            if (monitorRect.width > 0 && monitorRect.height > 0) {
                lightCanvas.width = monitorRect.width;
                lightCanvas.height = monitorRect.height;
            }
            const logoRect = logoCanvas.getBoundingClientRect();
            logoCanvas.width = logoRect.width;
            logoCanvas.height = logoRect.height;
            drawLogo();
        }
        
        function drawLogo() {
            const w = logoCanvas.width;
            const h = logoCanvas.height;
            const cx = w / 2;
            const cy = h / 2;
            const r = h * 0.35;
            const offset = r * 0.6;
            
            logoCtx.clearRect(0, 0, w, h);
            
            const stripes = ['#61BB46', '#FDB827', '#F5821F', '#E03A3E', '#963D97', '#009DDC'];
            const stripeHeight = (r * 2) / stripes.length;
            
            logoCtx.globalAlpha = 0.4;
            logoCtx.strokeStyle = '#ffffff';
            logoCtx.lineWidth = 2;
            logoCtx.beginPath();
            logoCtx.arc(cx - offset - 1, cy - 1, r, Math.PI, Math.PI * 2);
            logoCtx.stroke();
            logoCtx.beginPath();
            logoCtx.arc(cx + offset - 1, cy - 1, r, Math.PI, Math.PI * 2);
            logoCtx.stroke();
            logoCtx.globalAlpha = 1;
            
            logoCtx.save();
            logoCtx.beginPath();
            logoCtx.arc(cx - offset, cy, r, 0, Math.PI * 2);
            logoCtx.clip();
            stripes.forEach((color, i) => {
                logoCtx.fillStyle = color;
                logoCtx.fillRect(cx - offset - r, cy - r + i * stripeHeight, r * 2, stripeHeight);
            });
            logoCtx.restore();
            
            logoCtx.save();
            logoCtx.beginPath();
            logoCtx.arc(cx + offset, cy, r, 0, Math.PI * 2);
            logoCtx.clip();
            stripes.forEach((color, i) => {
                logoCtx.fillStyle = color;
                logoCtx.fillRect(cx + offset - r, cy - r + i * stripeHeight, r * 2, stripeHeight);
            });
            logoCtx.restore();
            
            logoCtx.save();
            logoCtx.globalCompositeOperation = 'difference';
            logoCtx.fillStyle = '#ffffff';
            logoCtx.beginPath();
            logoCtx.arc(cx - offset, cy, r, 0, Math.PI * 2);
            logoCtx.clip();
            logoCtx.beginPath();
            logoCtx.arc(cx + offset, cy, r, 0, Math.PI * 2);
            logoCtx.fill();
            logoCtx.restore();
            
            logoCtx.globalCompositeOperation = 'source-over';
            logoCtx.globalAlpha = 0.3;
            logoCtx.strokeStyle = 'rgba(0,0,0,0.5)';
            logoCtx.lineWidth = 2;
            logoCtx.beginPath();
            logoCtx.arc(cx - offset + 1, cy + 1, r, 0, Math.PI);
            logoCtx.stroke();
            logoCtx.beginPath();
            logoCtx.arc(cx + offset + 1, cy + 1, r, 0, Math.PI);
            logoCtx.stroke();
            logoCtx.globalAlpha = 1;
        }

        function animateBooleanLight() {
            const lw = lightCanvas.width;
            const lh = lightCanvas.height;
            lightCtx.clearRect(0, 0, lw, lh);
            const t = frame * 0.08;
            const currentOpName = operations[currentOp].op;
            const gridSize = 30;
            const cx = lw / 2;
            const cy = lh / 2;
            const r = Math.min(lw, lh) * 0.15;
            const offset = r * 0.65;
            
            for (let y = 0; y < lh; y += gridSize) {
                for (let x = 0; x < lw; x += gridSize) {
                    const A = isInCircle(x, y, cx - offset * 3, cy, r * 2);
                    const B = isInCircle(x, y, cx + offset * 3, cy, r * 2);
                    const result = applyBooleanOp(A, B, currentOpName);
                    if (result) {
                        const wave = Math.sin(t + x * 0.01 + y * 0.01) * 0.5 + 0.5;
                        const hue = (t * 20 + x + y) % 360;
                        lightCtx.fillStyle = `hsla(${hue}, 80%, 60%, ${wave * 0.3})`;
                        lightCtx.fillRect(x, y, gridSize, gridSize);
                    }
                }
            }
        }

        function animate() {
            const w = canvas.width;
            const h = canvas.height;
            
            if (!powerOn) {
                // Screen is off - show black
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, w, h);
                lightCtx.clearRect(0, 0, lightCanvas.width, lightCanvas.height);
                animationId = requestAnimationFrame(animate);
                return;
            }
            
            animateBooleanLight();
            
            if (!crtOn) {
                crtTransition += 0.03;
                if (crtTransition < 0.1) {
                    ctx.fillStyle = '#ffcc66';
                    ctx.fillRect(0, 0, w, h);
                    return requestAnimationFrame(animate);
                } else if (crtTransition < 0.5) {
                    ctx.fillStyle = '#000';
                    ctx.fillRect(0, 0, w, h);
                    const lineHeight = h * (crtTransition - 0.1) / 0.4;
                    const lineY = (h - lineHeight) / 2;
                    ctx.fillStyle = '#ffaa44';
                    ctx.fillRect(0, lineY, w, lineHeight);
                    const gradient = ctx.createLinearGradient(0, lineY, 0, lineY + lineHeight);
                    gradient.addColorStop(0, 'rgba(255, 140, 0, 0)');
                    gradient.addColorStop(0.5, 'rgba(255, 140, 0, 0.8)');
                    gradient.addColorStop(1, 'rgba(255, 140, 0, 0)');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, lineY, w, lineHeight);
                    return requestAnimationFrame(animate);
                } else if (crtTransition < 1.0) {
                    ctx.fillStyle = '#000';
                    ctx.fillRect(0, 0, w, h);
                    const progress = (crtTransition - 0.5) / 0.5;
                    const easeProgress = 1 - Math.pow(1 - progress, 3);
                    const expandH = h * easeProgress;
                    const expandW = w * easeProgress * easeProgress;
                    const expandY = (h - expandH) / 2;
                    const expandX = (w - expandW) / 2;
                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(expandX, expandY, expandW, expandH);
                    ctx.clip();
                    drawContent(w, h, 1.5 - progress * 0.5);
                    ctx.restore();
                    ctx.strokeStyle = `rgba(255, 140, 0, ${0.6 - progress * 0.6})`;
                    ctx.lineWidth = 4;
                    ctx.strokeRect(expandX, expandY, expandW, expandH);
                    return requestAnimationFrame(animate);
                } else {
                    crtOn = true;
                }
            }
            
            drawContent(w, h, 1.0);
            frame++;
            if (frame % 150 === 0) {
                currentOp = (currentOp + 1) % operations.length;
            }
            animationId = requestAnimationFrame(animate);
        }

        function drawContent(w, h, brightness) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, w, h);

            const cx = w / 2;
            const cy = h / 2 + h * 0.05;
            const r = Math.min(w, h) * 0.18;
            const offset = r * 0.65;
            const t = frame * 0.08;
            const currentOpName = operations[currentOp].op;

            const titleY = h * 0.12;
            const titleSize = Math.min(w, h) * 0.07;
            ctx.font = `bold ${titleSize}px "Courier New"`;
            ctx.textAlign = 'center';
            ctx.globalAlpha = 0.7;
            ctx.fillStyle = '#f00';
            ctx.fillText('BOOL COMPUTER BASIC 1.0', cx - 2, titleY - 2);
            ctx.fillStyle = '#0ff';
            ctx.fillText('BOOL COMPUTER BASIC 1.0', cx + 2, titleY + 2);
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#fff';
            ctx.fillText('BOOL COMPUTER BASIC 1.0', cx, titleY);

            const opSize = Math.min(w, h) * 0.06;
            ctx.font = `bold ${opSize}px "Courier New"`;
            ctx.shadowColor = '#f0f';
            ctx.shadowBlur = 30;
            ctx.fillStyle = '#f0f';
            ctx.fillText(operations[currentOp].name, cx, h * 0.22);
            ctx.shadowBlur = 0;

            const flashCycle = Math.sin(t * 3) * 0.5 + 0.5;
            const flashIntensity = flashCycle * 0.9;
            const step = 3;
            
            for (let y = cy - r - 20; y < cy + r + 20; y += step) {
                for (let x = cx - offset - r - 20; x < cx + offset + r + 20; x += step) {
                    const A = isInCircle(x, y, cx - offset, cy, r);
                    const B = isInCircle(x, y, cx + offset, cy, r);
                    
                    if (A || B) {
                        const val = plasma(x, y, t);
                        const brightness2 = (val + 4) / 8;
                        let hue;
                        if (A && !B) hue = (t * 20) % 360;
                        else if (B && !A) hue = (180 + t * 20) % 360;
                        else hue = (270 + t * 20) % 360;
                        
                        const result = applyBooleanOp(A, B, currentOpName);
                        const l = 30 + brightness2 * 50;
                        
                        if (result) {
                            ctx.fillStyle = `hsl(${hue}, 100%, ${l}%)`;
                            ctx.fillRect(x, y, step, step);
                            ctx.fillStyle = `rgba(255, 255, 255, ${flashIntensity})`;
                            ctx.fillRect(x, y, step, step);
                        } else {
                            ctx.fillStyle = `hsla(${hue}, 100%, ${l}%, 0.15)`;
                            ctx.fillRect(x, y, step, step);
                        }
                        
                        if (result && Math.random() < 0.02) {
                            const angle = Math.random() * Math.PI * 2;
                            const speed = 1 + Math.random() * 2;
                            particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, hue, currentOpName));
                        }
                    }
                }
            }

            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => { p.update(); p.draw(); });

            drawGlowCircle(cx - offset, cy, r, (t * 20) % 360);
            drawGlowCircle(cx + offset, cy, r, (180 + t * 20) % 360);

            const labelSize = Math.min(w, h) * 0.05;
            ctx.font = `bold ${labelSize}px "Courier New"`;
            ctx.shadowColor = '#fff';
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#fff';
            ctx.fillText('A', cx - offset, cy + r + labelSize);
            ctx.fillText('B', cx + offset, cy + r + labelSize);
            ctx.shadowBlur = 0;

            ctx.globalAlpha = 0.1;
            for (let i = 0; i < h; i += 3) {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, i, w, 1);
            }
            ctx.globalAlpha = 1;
            
            if (brightness !== 1.0 && w > 0 && h > 0) {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = w;
                tempCanvas.height = h;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(canvas, 0, 0);
                ctx.globalCompositeOperation = 'lighter';
                ctx.globalAlpha = brightness - 1.0;
                ctx.drawImage(tempCanvas, 0, 0);
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1;
            }
        }

        canvas.addEventListener('click', () => {
            if (powerOn) {
                currentOp = (currentOp + 1) % operations.length;
                frame = 0;
            }
        });

        // Power button functionality
        const powerButton = document.getElementById('power-button');
        const powerLed = document.getElementById('power-led');
        
        powerButton.addEventListener('click', () => {
            powerOn = !powerOn;
            
            if (powerOn) {
                // Turn on - reset CRT animation
                crtOn = false;
                crtTransition = 0;
                particles = [];
                powerLed.style.background = '#00ff00';
                powerLed.style.boxShadow = '0 0 8px #00ff00, 0 0 16px #00ff00, 0 0 24px rgba(0,255,0,0.6)';
                if (!animationId) {
                    animate();
                }
            } else {
                // Turn off - show shutdown effect
                powerLed.style.background = '#ff3300';
                powerLed.style.boxShadow = '0 0 8px #ff3300, 0 0 16px #ff3300, 0 0 24px rgba(255,51,0,0.6)';
                
                const w = canvas.width;
                const h = canvas.height;
                
                // Collapse to horizontal line
                let shutdownProgress = 0;
                const shutdownInterval = setInterval(() => {
                    shutdownProgress += 0.05;
                    
                    if (shutdownProgress < 1) {
                        const lineHeight = h * (1 - shutdownProgress);
                        const lineY = (h - lineHeight) / 2;
                        
                        ctx.fillStyle = '#000';
                        ctx.fillRect(0, 0, w, h);
                        
                        // Draw shrinking content
                        ctx.save();
                        ctx.beginPath();
                        ctx.rect(0, lineY, w, lineHeight);
                        ctx.clip();
                        drawContent(w, h, 1);
                        ctx.restore();
                        
                        // Add glow
                        ctx.strokeStyle = `rgba(255, 140, 0, ${0.5 * (1 - shutdownProgress)})`;
                        ctx.lineWidth = 3;
                        ctx.strokeRect(0, lineY, w, lineHeight);
                    } else {
                        // Final flash and off
                        ctx.fillStyle = '#ffaa44';
                        ctx.fillRect(0, 0, w, h);
                        setTimeout(() => {
                            ctx.fillStyle = '#000';
                            ctx.fillRect(0, 0, w, h);
                            lightCtx.clearRect(0, 0, lightCanvas.width, lightCanvas.height);
                        }, 50);
                        clearInterval(shutdownInterval);
                    }
                }, 16);
                
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
            }
        });

        resize();
        window.addEventListener('resize', resize);
        
        // Auto start with power on
        setTimeout(() => {
            resize();
            powerOn = true;
            powerLed.style.background = '#00ff00';
            powerLed.style.boxShadow = '0 0 8px #00ff00, 0 0 16px #00ff00, 0 0 24px rgba(0,255,0,0.6)';
            animate();
        }, 100);
    </script>
</body>
</html>
