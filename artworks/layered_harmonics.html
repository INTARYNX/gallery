<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #000;
    }
    canvas { display: block; border: 1px solid #333; border-radius: 4px; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const off = document.createElement('canvas');
    const octx = off.getContext('2d');

    let W;
    function resize() {
      W = Math.min(window.innerWidth, window.innerHeight);
      canvas.width = canvas.height = W;
      off.width = off.height = W;
      canvas.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)';
    }
    resize();
    window.addEventListener('resize', resize);

    let f = 0;
    const TAU = Math.PI * 2;
    const N = 500;
    const FADE = 0.93;

    // Randomizable params
    let P = {};
    function randomize() {
      const r = () => 0.5 + Math.random() * 1.5;
      const s = () => 0.1 + Math.random() * 0.3;
      P = {
        phi: (1 + Math.sqrt(5)) / 2 * (0.6 + Math.random() * 0.8),
        r1a: 0.4 + Math.random() * 0.3,
        r1b: 0.2 + Math.random() * 0.25,
        r1h: 2 + Math.random() * 4 | 0,
        r2a: 0.15 + Math.random() * 0.25,
        r2b: 0.1 + Math.random() * 0.2,
        r2h: 3 + Math.random() * 5 | 0,
        r3a: 0.3 + Math.random() * 0.3,
        r3b: 0.15 + Math.random() * 0.25,
        r3h: 2 + Math.random() * 6 | 0,
        sp1: s(), sp2: s(), sp3: s(), sp4: s(),
        rot1: 0.2 + Math.random() * 0.5,
        rot2: 0.15 + Math.random() * 0.4,
        rot3: 0.2 + Math.random() * 0.5,
        coup1: 1 + Math.random() * 4 | 0,
        coup2: 2 + Math.random() * 6 | 0,
        coup3: 3 + Math.random() * 8 | 0,
        colFreq: 3 + Math.random() * 6,
        colSpeed: 0.8 + Math.random() * 1.5,
        warp: 10 + Math.random() * 30,
        warpH1: 7 + Math.random() * 10 | 0,
        warpH2: 9 + Math.random() * 10 | 0,
      };
      ctx.clearRect(0, 0, W, W);
      octx.clearRect(0, 0, W, W);
      resize();
      f = 0;
    }
    randomize();
    canvas.addEventListener('click', randomize);

    function draw() {
      const w = W * 0.5;
      const sc = W / 400;

      // GPU fade
      octx.clearRect(0, 0, W, W);
      octx.drawImage(canvas, 0, 0);
      ctx.clearRect(0, 0, W, W);
      ctx.globalAlpha = FADE;
      ctx.drawImage(off, 0, 0);
      ctx.globalAlpha = 1;

      ctx.globalCompositeOperation = 'lighter';

      // Slow-moving modulators
      const m1 = Math.sin(f * P.sp1);
      const m2 = Math.cos(f * P.sp2 * P.phi);
      const m3 = Math.sin(f * P.sp3 + m1 * 2);
      const m4 = Math.cos(f * P.sp4 + m2);
      const breathe = 0.6 + 0.4 * Math.sin(f * 0.2);

      for (let i = 0; i < N; i++) {
        const a = (i / N) * TAU;

        const R1 = w * (P.r1a + P.r1b * Math.sin(a * P.r1h + m1 * 4)) * breathe;
        const R2 = w * (P.r2a + P.r2b * Math.cos(a * P.r2h + m2 * 3)) * breathe;
        const theta = a + f * P.rot1 + m3 * Math.sin(a * P.coup1);
        const phi = a * P.phi + f * P.rot2 + m4 * Math.cos(a * P.coup2);

        const x1 = Math.cos(theta) * (R1 + Math.cos(phi) * R2) + w;
        const y1 = Math.sin(theta) * (R1 + Math.sin(phi) * R2) + w;

        const R3 = w * (P.r3a + P.r3b * Math.sin(a * P.r3h + m3 * 3)) * breathe;
        const theta2 = -a + f * P.rot3 + m2 * Math.cos(a * P.coup3);
        const phi2 = a / P.phi + f * 0.35 + m1 * Math.sin(a * 7);

        const x2 = Math.sin(theta2) * (R3 + Math.cos(phi2) * R2) + w;
        const y2 = Math.cos(theta2) * (R3 + Math.sin(phi2) * R2) + w;

        // FM color
        const fmod = 1 + m1 * 0.8 + Math.sin(a * 3 + m2) * 0.5;
        const t = a * P.colFreq * fmod + f * P.colSpeed;
        const cr = Math.sin(t) * 0.5 + 0.5;
        const cg = Math.sin(t * (0.618 + m3 * 0.3) + 2.09) * 0.5 + 0.5;
        const cb = Math.sin(t * (0.381 + m4 * 0.2) + 4.18) * 0.5 + 0.5;
        const bright = 0.3 + cr * 0.7;
        const r0 = (cr * bright * 255) | 0;
        const g0 = (cg * bright * 200 + 30) | 0;
        const b0 = (cb * bright * 255) | 0;

        ctx.strokeStyle = `rgba(${r0},${g0},${b0},0.12)`;
        ctx.lineWidth = (1 + Math.sin(a * 7 + f) * 0.5) * sc;

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        const cx = (x1 + x2) * 0.5 + Math.sin(a * P.warpH1 + f * 2) * P.warp * sc * m2;
        const cy = (y1 + y2) * 0.5 + Math.cos(a * P.warpH2 + f * 1.7) * P.warp * sc * m1;
        ctx.quadraticCurveTo(cx, cy, x2, y2);
        ctx.stroke();
      }

      // Central glow
      const pulse = 0.5 + m1 * 0.3;
      const gH = (f * 40) % 360;
      const glow = ctx.createRadialGradient(w, w, 0, w, w, 60 * sc);
      glow.addColorStop(0, `hsla(${gH},100%,70%,${0.05 * pulse})`);
      glow.addColorStop(0.5, `hsla(${(gH + 60) % 360},100%,40%,${0.015 * pulse})`);
      glow.addColorStop(1, 'transparent');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, W, W);

      f += 0.008;
      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
