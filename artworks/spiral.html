<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0a;
        }
        canvas {
            border: 1px solid #333;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="600" height="600"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let time = 0;
        let zoomDepth = 2 + Math.random() * 4;
        let zoomCycle = 0;
        
        function drawSpiral() {
            ctx.fillStyle = 'rgba(10, 10, 10, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            const zoomPhase = Math.abs(Math.sin(time * 0.8));
            
            // Change zoom depth at each cycle
            if (zoomPhase < 0.05 && zoomCycle !== Math.floor(time * 0.8 / Math.PI)) {
                zoomDepth = 2 + Math.random() * 4;
                zoomCycle = Math.floor(time * 0.8 / Math.PI);
            }
            
            const zoom = 1 + zoomPhase * zoomDepth;
            const rotation = time * (1 + zoomPhase * 2);
            
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(rotation);
            ctx.scale(zoom, zoom);
            ctx.translate(-centerX, -centerY);
            
            const maxRadius = 230;
            const rotations = 5;
            const points = 2000;
            
            const colors = ['#ff3366', '#33ff99', '#3366ff'];
            const hue = (time * 30) % 360;
            colors[2] = `hsl(${hue}, 100%, 50%)`;
            const offsets = [0, Math.PI * 2 / 3, Math.PI * 4 / 3];
            const speeds = [1, 1.3, 0.7];
            const amplitudes = [10, 15, 8];
            const frequencies = [0.3, 0.4, 0.25];
            const phaseShifts = [0, 1.2, 2.5];
            
            for (let thread = 0; thread < 3; thread++) {
                ctx.beginPath();
                
                for (let i = 0; i < points; i++) {
                    const t = i / points;
                    const angle = t * rotations * Math.PI * 2;
                    const radius = t * maxRadius;
                    
                    const wave1 = Math.sin(i * frequencies[thread] + time * 5 * speeds[thread] + offsets[thread]);
                    const wave2 = Math.sin(i * frequencies[thread] * 2.3 + time * 3 * speeds[thread] + phaseShifts[thread]);
                    const pulse = Math.sin(time * 2 + offsets[thread]);
                    const wave = (wave1 + wave2 * 0.5) * amplitudes[thread] * t * pulse;
                    
                    const x = centerX + Math.cos(angle) * (radius + wave);
                    const y = centerY + Math.sin(angle) * (radius + wave);
                    
                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                
                ctx.strokeStyle = colors[thread];
                ctx.lineWidth = thread === 2 ? 1.5 : 2;
                ctx.stroke();
            }
            
            ctx.restore();
            
            // Scanlines horizontales
            ctx.globalAlpha = 0.1;
            for (let y = 0; y < canvas.height; y += 3) {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, y, canvas.width, 1);
            }
            
            // Scanlines verticales
            for (let x = 0; x < canvas.width; x += 3) {
                ctx.fillStyle = '#000';
                ctx.fillRect(x, 0, 1, canvas.height);
            }
            
            // Effet de bavage (ghosting)
            ctx.globalAlpha = 0.05;
            ctx.drawImage(canvas, 2, 0);
            ctx.globalAlpha = 1.0;
            
            time += 0.02;
            requestAnimationFrame(drawSpiral);
        }
        
        drawSpiral();
    </script>
</body>
</html>
