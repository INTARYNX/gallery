<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genuary 2026 #8</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
            margin: 0 auto;
            background: #000;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        ctx.imageSmoothingEnabled = false;
        
        function resizeCanvas() {
            const size = Math.min(window.innerWidth, window.innerHeight, 650);
            canvas.width = size;
            canvas.height = size;
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const TILE_SIZE = 40;
        const GRID_SIZE = 24;
        
        let cameraX = 0;
        let gameTime = 0;
        let lastTime = performance.now();
        
        const buildings = [];
        let tiles = null;
        let lastTileX = -999;
        const cars = [];

        function seed(s) {
            const x = Math.sin(s) * 10000;
            return x - Math.floor(x);
        }

        function toIso(x, y, z) {
            return {
                x: Math.round(x * (TILE_SIZE / 2) + y * (TILE_SIZE / 2)),
                y: Math.round(x * (TILE_SIZE / 4) - y * (TILE_SIZE / 4) - z)
            };
        }

        function bright(col, fac) {
            const r = parseInt(col.slice(1, 3), 16);
            const g = parseInt(col.slice(3, 5), 16);
            const b = parseInt(col.slice(5, 7), 16);
            return `rgb(${Math.min(255, r * fac)}, ${Math.min(255, g * fac)}, ${Math.min(255, b * fac)})`;
        }

        function genBuildings(startX, endX) {
            const result = [];
            
            // Seulement 18-22 bâtiments par chunk
            const numBuildings = 18 + Math.floor(seed(startX * 999) * 5);
            
            for (let i = 0; i < numBuildings; i++) {
                const gx = startX + Math.floor(seed(startX * 1000 + i) * (endX - startX - 2));
                const gy = Math.floor(seed(startX * 1000 + i + 500) * (GRID_SIZE - 2));
                const s = gx * 10000 + gy;
                    
                    const w = seed(s + 1) > 0.6 ? 2 : 1;
                    const d = seed(s + 2) > 0.6 ? 2 : 1;
                    const baseH = 60 + seed(s + 3) * 180;
                    const h = seed(s + 4) > 0.92 ? baseH * 2.5 : baseH;
                    
                    const r = Math.floor(seed(s + 5) * 25 + 20);
                    const g = Math.floor(seed(s + 6) * 25 + 20);
                    const b = Math.floor(seed(s + 7) * 30 + 25);
                    const color = `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
                    
                    const winW = 0.12 + seed(s + 11) * 0.12;
                    const winH = 4 + seed(s + 12) * 4;
                    
                    const windows = [];
                    const numFloors = Math.floor(h / 15);
                    const numWinsPerFloor = Math.max(1, w * 2);
                    
                    for (let floor = 1; floor < numFloors; floor++) {
                        for (let winIdx = 0; winIdx < numWinsPerFloor; winIdx++) {
                            if (seed(s + floor * 100 + winIdx) > 0.2) {
                                const temp = seed(s + floor * 100 + winIdx + 5000);
                                let wColor;
                                if (temp < 0.25) wColor = '#664f17';
                                else if (temp < 0.5) wColor = '#5c4915';
                                else if (temp < 0.75) wColor = '#534213';
                                else wColor = '#4a3b11';
                                
                                const lit = seed(s + floor * 100 + winIdx + 10000) > 0.3;
                                
                                windows.push({
                                    face: 'front',
                                    z: (floor / numFloors) * h,
                                    x: ((winIdx + 0.5) / numWinsPerFloor) * w,
                                    color: wColor,
                                    lit: lit,
                                    flickerSeed: s + floor * 100 + winIdx + 20000
                                });
                            }
                        }
                        
                        const numWinsRight = Math.max(1, d * 2);
                        for (let winIdx = 0; winIdx < numWinsRight; winIdx++) {
                            if (seed(s + floor * 200 + winIdx) > 0.2) {
                                const temp = seed(s + floor * 200 + winIdx + 5000);
                                let wColor;
                                if (temp < 0.25) wColor = '#664f17';
                                else if (temp < 0.5) wColor = '#5c4915';
                                else if (temp < 0.75) wColor = '#534213';
                                else wColor = '#4a3b11';
                                
                                const lit = seed(s + floor * 200 + winIdx + 10000) > 0.3;
                                
                                windows.push({
                                    face: 'right',
                                    z: (floor / numFloors) * h,
                                    y: ((winIdx + 0.5) / numWinsRight) * d,
                                    color: wColor,
                                    lit: lit,
                                    flickerSeed: s + floor * 200 + winIdx + 20000
                                });
                            }
                        }
                    }
                    
                    const roofRnd = seed(s + 9);
                    const roof = roofRnd > 0.7 ? 'antenna' : roofRnd > 0.4 ? 'tower' : null;
                    
                    result.push({ 
                        x: gx, y: gy, w, d, h, 
                        color, 
                        windows,
                        winW,
                        winH,
                        roof 
                    });
            }
            return result;
        }

        for (let c = 0; c < 10; c++) {
            buildings.push(...genBuildings(c * GRID_SIZE, (c + 1) * GRID_SIZE));
        }

        // Init some cars
        for (let i = 0; i < 8; i++) {
            const dirs = [
                { x: Math.random() * GRID_SIZE, y: () => Math.floor(Math.random() * GRID_SIZE), sx: 0.11 + Math.random() * 0.02, sy: 0 },
                { x: Math.random() * GRID_SIZE, y: () => Math.floor(Math.random() * GRID_SIZE), sx: -(0.11 + Math.random() * 0.02), sy: 0 }
            ];
            const d = dirs[Math.floor(Math.random() * dirs.length)];
            const colorChoice = Math.random();
            let carColor;
            if (colorChoice < 0.5) carColor = '#8b7d5c';
            else if (colorChoice < 0.8) carColor = '#9a8a60';
            else carColor = '#b0a080';
            
            cars.push({
                x: typeof d.x === 'function' ? d.x() : d.x,
                y: typeof d.y === 'function' ? d.y() : d.y,
                sx: d.sx,
                sy: d.sy,
                col: carColor
            });
        }

        function loop() {
            const now = performance.now();
            const dt = (now - lastTime) / 16.67;
            lastTime = now;

            cameraX += 0.1 * dt;
            gameTime += 0.001 * dt;

            // Generate new buildings when needed
            if (buildings.length === 0) {
                const startChunk = Math.floor(cameraX / GRID_SIZE);
                for (let c = 0; c < 10; c++) {
                    buildings.push(...genBuildings((startChunk + c) * GRID_SIZE, (startChunk + c + 1) * GRID_SIZE));
                }
            }

            const lastBuilding = buildings[buildings.length - 1];
            const maxX = lastBuilding ? lastBuilding.x + lastBuilding.w : 0;
            if (maxX < cameraX + GRID_SIZE * 2) {
                buildings.push(...genBuildings(maxX, maxX + GRID_SIZE * 2));
            }

            let removed = 0;
            while (buildings.length > 0 && buildings[0].x + buildings[0].w < cameraX - GRID_SIZE * 3 && removed < 5) {
                buildings.shift();
                removed++;
            }

            if (Math.random() > 0.95 && cars.length < 15) {
                const dirs = [
                    // Horizontal
                    { x: cameraX - GRID_SIZE * 2, y: () => Math.floor(Math.random() * GRID_SIZE), sx: 0.11 + Math.random() * 0.02, sy: 0 },
                    { x: cameraX + GRID_SIZE * 2, y: () => Math.floor(Math.random() * GRID_SIZE), sx: -(0.11 + Math.random() * 0.02), sy: 0 },
                    // Vertical
                    { x: () => cameraX + Math.floor(Math.random() * GRID_SIZE), y: -12, sx: 0.1, sy: 0.01 + Math.random() * 0.02 },
                    { x: () => cameraX + Math.floor(Math.random() * GRID_SIZE), y: GRID_SIZE + 12, sx: 0.1, sy: -(0.01 + Math.random() * 0.02) },
                    // Diagonales
                    { x: cameraX - GRID_SIZE * 2, y: () => Math.floor(Math.random() * GRID_SIZE), sx: 0.11 + Math.random() * 0.02, sy: 0.01 + Math.random() * 0.02 },
                    { x: cameraX - GRID_SIZE * 2, y: () => Math.floor(Math.random() * GRID_SIZE), sx: 0.11 + Math.random() * 0.02, sy: -(0.01 + Math.random() * 0.02) },
                    { x: cameraX + GRID_SIZE * 2, y: () => Math.floor(Math.random() * GRID_SIZE), sx: -(0.11 + Math.random() * 0.02), sy: 0.01 + Math.random() * 0.02 },
                    { x: cameraX + GRID_SIZE * 2, y: () => Math.floor(Math.random() * GRID_SIZE), sx: -(0.11 + Math.random() * 0.02), sy: -(0.01 + Math.random() * 0.02) }
                ];
                const d = dirs[Math.floor(Math.random() * dirs.length)];
                const colorChoice = Math.random();
                let carColor;
                if (colorChoice < 0.5) carColor = '#8b7d5c';
                else if (colorChoice < 0.8) carColor = '#9a8a60';
                else carColor = '#b0a080';
                
                cars.push({
                    x: typeof d.x === 'function' ? d.x() : d.x,
                    y: typeof d.y === 'function' ? d.y() : d.y,
                    sx: d.sx,
                    sy: d.sy,
                    col: carColor
                });
            }
            
            for (let i = cars.length - 1; i >= 0; i--) {
                cars[i].x += cars[i].sx * dt;
                cars[i].y += cars[i].sy * dt;
                if (cars[i].x < cameraX - GRID_SIZE * 2 || cars[i].x > cameraX + GRID_SIZE * 2 ||
                    cars[i].y < -12 || cars[i].y > GRID_SIZE + 12) {
                    cars.splice(i, 1);
                }
            }

            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#0d0d15');
            grad.addColorStop(1, '#0d0d15');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const offX = canvas.width / 2 - GRID_SIZE * TILE_SIZE / 2;
            const offY = canvas.height / 2 + GRID_SIZE * TILE_SIZE / 8;

            const objs = [];

            if (tiles === null || Math.abs(cameraX - lastTileX) > 1) {
                tiles = [];
                const tsX = Math.floor(cameraX) - GRID_SIZE;
                const teX = Math.floor(cameraX) + GRID_SIZE * 2;

                for (let y = -12; y < GRID_SIZE + 12; y++) {
                    for (let x = tsX; x < teX; x++) {
                        tiles.push({ t: 'tile', x, y, dep: x - y, lay: 0 });
                    }
                }
                lastTileX = Math.floor(cameraX);
            }
            
            objs.push(...tiles);

            const minVisX = cameraX - GRID_SIZE;
            const maxVisX = cameraX + GRID_SIZE * 2;
            
            buildings.forEach(b => {
                if (b.x + b.w >= minVisX && b.x <= maxVisX) {
                    objs.push({
                        t: 'bldg',
                        ...b,
                        dep: b.x + b.w - b.y - b.d + b.h * 0.01,
                        lay: 1
                    });
                }
            });

            cars.forEach(c => {
                objs.push({ t: 'car', ...c, dep: c.x - c.y + 0.1, lay: 1 });
            });

            objs.sort((a, b) => {
                if (a.lay !== b.lay) return a.lay - b.lay;
                return a.dep - b.dep;
            });

            const flickerCache = {};
            
            objs.forEach(o => {
                if (o.t === 'car') {
                    const p = toIso(o.x - cameraX, o.y, 0.5);
                    
                    // Motion blur trail (adaptive to speed)
                    const speed = Math.hypot(o.sx, o.sy);
                    const trailLength = Math.min(8, 4 + speed * 30);
                    for (let t = 0; t < trailLength; t++) {
                        const trailX = o.x - o.sx * t * 0.8;
                        const trailY = o.y - o.sy * t * 0.8;
                        const tp = toIso(trailX - cameraX, trailY, 0.5);
                        const alpha = (trailLength - t) / trailLength * 0.25;
                        
                        ctx.fillStyle = o.col;
                        ctx.globalAlpha = alpha;
                        ctx.shadowColor = o.col;
                        ctx.shadowBlur = 35;
                        ctx.beginPath();
                        ctx.arc(offX + tp.x, offY + tp.y, 2.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    
                    // Main light
                    ctx.globalAlpha = 1;
                    ctx.fillStyle = o.col;
                    ctx.shadowColor = o.col;
                    ctx.shadowBlur = 35;
                    ctx.beginPath();
                    ctx.arc(offX + p.x, offY + p.y, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                } else if (o.t === 'tile') {
                    const p0 = toIso(o.x - cameraX, o.y, 0);
                    const p1 = toIso(o.x + 1 - cameraX, o.y, 0);
                    const p2 = toIso(o.x + 1 - cameraX, o.y + 1, 0);
                    const p3 = toIso(o.x - cameraX, o.y + 1, 0);

                    ctx.fillStyle = '#0d0d15';
                    ctx.beginPath();
                    ctx.moveTo(offX + p0.x, offY + p0.y);
                    ctx.lineTo(offX + p1.x, offY + p1.y);
                    ctx.lineTo(offX + p2.x, offY + p2.y);
                    ctx.lineTo(offX + p3.x, offY + p3.y);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                } else if (o.t === 'bldg') {
                    const p0 = toIso(o.x - cameraX, o.y, 0);
                    const p1 = toIso(o.x + o.w - cameraX, o.y, 0);
                    const p2 = toIso(o.x + o.w - cameraX, o.y + o.d, 0);
                    const p4 = toIso(o.x - cameraX, o.y, o.h);
                    const p5 = toIso(o.x + o.w - cameraX, o.y, o.h);
                    const p6 = toIso(o.x + o.w - cameraX, o.y + o.d, o.h);
                    const p7 = toIso(o.x - cameraX, o.y + o.d, o.h);

                    ctx.fillStyle = bright(o.color, 0.85);
                    ctx.beginPath();
                    ctx.moveTo(offX + p0.x, offY + p0.y);
                    ctx.lineTo(offX + p1.x, offY + p1.y);
                    ctx.lineTo(offX + p5.x, offY + p5.y);
                    ctx.lineTo(offX + p4.x, offY + p4.y);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                    ctx.stroke();

                    ctx.fillStyle = bright(o.color, 0.7);
                    ctx.beginPath();
                    ctx.moveTo(offX + p1.x, offY + p1.y);
                    ctx.lineTo(offX + p2.x, offY + p2.y);
                    ctx.lineTo(offX + p6.x, offY + p6.y);
                    ctx.lineTo(offX + p5.x, offY + p5.y);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = bright(o.color, 1.1);
                    ctx.beginPath();
                    ctx.moveTo(offX + p4.x, offY + p4.y);
                    ctx.lineTo(offX + p5.x, offY + p5.y);
                    ctx.lineTo(offX + p6.x, offY + p6.y);
                    ctx.lineTo(offX + p7.x, offY + p7.y);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    o.windows.forEach(win => {
                        if (!flickerCache[win.flickerSeed]) {
                            flickerCache[win.flickerSeed] = Math.sin(gameTime * 1 + win.flickerSeed) * 0.5 + 0.5;
                        }
                        const flickerVal = flickerCache[win.flickerSeed];
                        const isOn = win.lit && flickerVal > 0.002;
                        
                        let w0, w1, w2, w3;
                        
                        if (win.face === 'front') {
                            w0 = toIso(o.x - cameraX + win.x - o.winW, o.y, win.z);
                            w1 = toIso(o.x - cameraX + win.x + o.winW, o.y, win.z);
                            w2 = toIso(o.x - cameraX + win.x + o.winW, o.y, win.z + o.winH);
                            w3 = toIso(o.x - cameraX + win.x - o.winW, o.y, win.z + o.winH);
                        } else {
                            w0 = toIso(o.x - cameraX + o.w, o.y + win.y - o.winW, win.z);
                            w1 = toIso(o.x - cameraX + o.w, o.y + win.y + o.winW, win.z);
                            w2 = toIso(o.x - cameraX + o.w, o.y + win.y + o.winW, win.z + o.winH);
                            w3 = toIso(o.x - cameraX + o.w, o.y + win.y - o.winW, win.z + o.winH);
                        }
                        
                        ctx.fillStyle = isOn ? win.color : '#000';
                        ctx.beginPath();
                        ctx.moveTo(offX + w0.x, offY + w0.y);
                        ctx.lineTo(offX + w1.x, offY + w1.y);
                        ctx.lineTo(offX + w2.x, offY + w2.y);
                        ctx.lineTo(offX + w3.x, offY + w3.y);
                        ctx.closePath();
                        ctx.fill();
                    });
                    
                    if (o.roof === 'antenna') {
                        const ab = toIso(o.x - cameraX + o.w/2, o.y + o.d/2, o.h);
                        const at = toIso(o.x - cameraX + o.w/2, o.y + o.d/2, o.h + 20);
                        ctx.strokeStyle = '#444';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(offX + ab.x, offY + ab.y);
                        ctx.lineTo(offX + at.x, offY + at.y);
                        ctx.stroke();
                        ctx.fillStyle = 'red';
                        ctx.beginPath();
                        ctx.arc(offX + at.x, offY + at.y, 2, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (o.roof === 'tower') {
                        const tb = toIso(o.x - cameraX + o.w/2, o.y + o.d/2, o.h);
                        const tt = toIso(o.x - cameraX + o.w/2, o.y + o.d/2, o.h + 15);
                        ctx.fillStyle = '#333';
                        ctx.beginPath();
                        ctx.arc(offX + tt.x, offY + tt.y, 6, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = '#222';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.moveTo(offX + tb.x, offY + tb.y);
                        ctx.lineTo(offX + tt.x, offY + tt.y);
                        ctx.stroke();
                    }
                }
            });

            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
