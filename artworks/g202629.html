<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genuary 2026 #29</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100vh;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>
    <canvas id="karyotype"></canvas>
    <script>
        const canvas = document.getElementById('karyotype');
        const ctx = canvas.getContext('2d');
        
        let w, h;
        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            initChromosomes();
        }
        
        let time = 0;
        let day = 1;
        let dayTimer = 0;
        let screenShake = 0;
        let globalCorruptionLevel = 0;
        let systemCollapsed = false;
        let terminationTimer = 0;
        let terminated = false;
        const heatWaves = [];
        const stains = [];
        const flashes = [];
        const glitches = [];
        const logMessages = [];
        const systemWarnings = [];
        const MAX_GLITCHES = 30;
        const MAX_HEAT_WAVES = 20;
        const MAX_STAINS = 40;
        
        const mutationTypes = [
            { text: 'DELETION AT LOCUS', glitchType: 0 },
            { text: 'FRAMESHIFT MUTATION', glitchType: 1 },
            { text: 'POINT MUTATION DETECTED', glitchType: 0 },
            { text: 'TELOMERE DEGRADATION', glitchType: 2 },
            { text: 'CHROMOSOMAL BREAK', glitchType: 2 },
            { text: 'BASE PAIR CORRUPTION', glitchType: 0 },
            { text: 'NUCLEOTIDE SUBSTITUTION', glitchType: 1 },
            { text: 'GENETIC DRIFT OBSERVED', glitchType: 0 },
            { text: 'STRAND FRAGMENTATION', glitchType: 2 },
            { text: 'CODON MISALIGNMENT', glitchType: 1 }
        ];
        
        class SystemWarning {
            constructor(text) {
                this.text = text;
                this.life = 1;
                this.age = 0;
            }
            
            update() {
                this.age++;
                if (this.age > 60) {
                    this.life -= 0.05;
                }
            }
            
            draw() {
                if (this.life > 0) {
                    ctx.globalAlpha = Math.sin(this.age * 0.3) * 0.3 + 0.5;
                    ctx.fillStyle = '#ff6b4a';
                    ctx.font = `bold ${Math.max(16, w * 0.014)}px Courier New`;
                    ctx.textAlign = 'center';
                    ctx.fillText(this.text, w / 2, h / 2);
                    ctx.globalAlpha = 1;
                }
            }
        }
        
        class LogMessage {
            constructor(text, chr) {
                this.text = text;
                this.chr = chr;
                this.life = 1;
                this.age = 0;
                this.y = h - 120;
                this.visibleChars = 0;
                
                // Corrupt text if system is failing
                if (globalCorruptionLevel > 0.6 && Math.random() < 0.4) {
                    this.text = text.replace(/[AEIOU]/g, () =>
                        String.fromCharCode(65 + Math.floor(Math.random() * 26))
                    );
                }
            }
            
            update() {
                this.age++;
                this.visibleChars = Math.min(this.text.length, Math.floor(this.age / 2));
                if (this.age > 180) {
                    this.life -= 0.02;
                }
                this.y -= 0.3;
            }
            
            draw() {
                if (this.life > 0) {
                    ctx.globalAlpha = this.life * 0.8;
                    ctx.fillStyle = '#d4a574';
                    ctx.font = `${Math.max(10, w * 0.008)}px Courier New`;
                    ctx.textAlign = 'left';
                    const displayText = `[CHR ${this.chr}] ${this.text.slice(0, this.visibleChars)}`;
                    ctx.fillText(displayText, 30, this.y);
                    
                    if (this.visibleChars < this.text.length && this.age % 6 < 3) {
                        ctx.fillText('_', 30 + ctx.measureText(displayText).width, this.y);
                    }
                    ctx.globalAlpha = 1;
                }
            }
        }
        
        class Glitch {
            constructor(x, y, w, h, intensity = 1, type = 0) {
                this.x = x;
                this.y = y;
                this.w = w;
                this.h = h;
                this.life = 1;
                this.intensity = intensity;
                this.offset = (Math.random() - 0.5) * 80 * intensity;
                this.type = type;
            }
            
            update() {
                this.life -= 0.08;
                this.offset = (Math.random() - 0.5) * 100 * this.intensity;
            }
            
            draw() {
                if (this.life > 0 && time % 3 === 0) {
                    const centerX = this.x + this.w / 2;
                    const centerY = this.y + this.h / 2;
                    const radius = Math.min(this.w, this.h) / 2;
                    
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                    ctx.clip();
                    
                    try {
                        const imgData = ctx.getImageData(this.x, this.y, this.w, this.h);
                        const data = imgData.data;
                        
                        for (let i = 0; i < data.length; i += 4) {
                            if (this.type === 0 && Math.random() < 0.2) {
                                const shift = Math.floor(Math.random() * 40) * 4;
                                data[i] = data[i + shift] || data[i];
                            } else if (this.type === 1 && Math.random() < 0.15) {
                                data[i] = data[i + (Math.floor(Math.random() * 60) * 4)];
                            } else if (this.type === 2 && Math.random() < 0.1) {
                                const swap = data[i];
                                data[i] = data[i + 2];
                                data[i + 2] = swap;
                            }
                        }
                        
                        ctx.putImageData(imgData, this.x + this.offset, this.y);
                    } catch(e) {}
                    
                    ctx.restore();
                }
            }
        }
        
        class Flash {
            constructor(x, y, w, h) {
                this.x = x;
                this.y = y;
                this.w = w;
                this.h = h;
                this.life = 1;
                this.intensity = 1;
                this.centerX = x + w / 2;
                this.centerY = y + h / 2;
                this.radius = Math.max(w, h) * 0.8;
            }
            
            update() {
                this.life -= 0.12;
                this.radius += 5;
            }
            
            draw() {
                if (this.life > 0) {
                    ctx.globalAlpha = this.life * this.intensity;
                    
                    const gradient = ctx.createRadialGradient(
                        this.centerX, 
                        this.centerY, 
                        0,
                        this.centerX, 
                        this.centerY, 
                        this.radius
                    );
                    gradient.addColorStop(0, 'rgba(200, 255, 100, 0.9)');
                    gradient.addColorStop(0.4, 'rgba(150, 200, 80, 0.5)');
                    gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
                    
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(this.centerX, this.centerY, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.strokeStyle = `rgba(180, 220, 90, ${this.life})`;
                    ctx.lineWidth = 3;
                    const numLines = 8;
                    for (let i = 0; i < numLines; i++) {
                        const angle = (i / numLines) * Math.PI * 2;
                        const len = this.radius * (1.5 - this.life);
                        ctx.beginPath();
                        ctx.moveTo(this.centerX, this.centerY);
                        ctx.lineTo(
                            this.centerX + Math.cos(angle) * len,
                            this.centerY + Math.sin(angle) * len
                        );
                        ctx.stroke();
                    }
                    
                    ctx.globalAlpha = 1;
                }
            }
        }
        
        class HeatWave {
            constructor(x, y, w, h) {
                this.x = x;
                this.y = y;
                this.w = w;
                this.h = h;
                this.life = 1;
                this.phase = Math.random() * Math.PI * 2;
                this.speed = 0.03;
            }
            
            update() {
                this.phase += this.speed;
                this.life -= 0.015;
            }
            
            draw() {
                if (this.life > 0) {
                    try {
                        const strips = 8;
                        const stripHeight = Math.ceil(this.h / strips);
                        
                        for (let i = 0; i < strips; i++) {
                            const sy = Math.floor(this.y + i * stripHeight);
                            const sh = Math.min(stripHeight, h - sy);
                            
                            if (sy < 0 || sy >= h || sh <= 0) continue;
                            
                            const imgData = ctx.getImageData(this.x, sy, this.w, sh);
                            const offset = Math.sin(this.phase + i * 0.8) * 2 * this.life;
                            
                            ctx.putImageData(imgData, this.x + offset, sy);
                        }
                    } catch(e) {}
                }
            }
        }
        
        class Stain {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 0;
                this.maxRadius = 40 + Math.random() * 60;
                this.growth = 0.8;
                this.tendrils = [];
                this.age = 0;
                
                const numTendrils = 3 + Math.floor(Math.random() * 4);
                for (let i = 0; i < numTendrils; i++) {
                    this.tendrils.push({
                        angle: (i / numTendrils) * Math.PI * 2 + Math.random() * 0.5,
                        length: 0,
                        maxLength: 20 + Math.random() * 40,
                        thickness: 1.5 + Math.random() * 2.5
                    });
                }
            }
            
            update() {
                this.age++;
                if (this.radius < this.maxRadius) {
                    this.radius += this.growth;
                    this.growth *= 0.97;
                }
                
                this.tendrils.forEach(t => {
                    if (t.length < t.maxLength) {
                        t.length += 0.4;
                    }
                    t.angle += (Math.random() - 0.5) * 0.015;
                });
            }
            
            draw() {
                const opacity = Math.min(0.5, this.age * 0.003);
                
                ctx.globalAlpha = opacity;
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
                gradient.addColorStop(0, 'rgba(100, 120, 50, 0.7)');
                gradient.addColorStop(0.6, 'rgba(80, 100, 40, 0.4)');
                gradient.addColorStop(1, 'rgba(60, 80, 30, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = `rgba(90, 110, 45, ${opacity})`;
                this.tendrils.forEach(t => {
                    ctx.lineWidth = t.thickness;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    
                    const endX = this.x + Math.cos(t.angle) * t.length;
                    const endY = this.y + Math.sin(t.angle) * t.length;
                    
                    const midX = this.x + Math.cos(t.angle) * t.length * 0.5 + Math.sin(t.angle) * 12;
                    const midY = this.y + Math.sin(t.angle) * t.length * 0.5 - Math.cos(t.angle) * 12;
                    
                    ctx.quadraticCurveTo(midX, midY, endX, endY);
                    ctx.stroke();
                });
                
                ctx.globalAlpha = 1;
            }
        }
        
        class Chromosome {
            constructor(x, y, num, bands, size) {
                this.baseX = x;
                this.baseY = y;
                this.x = x;
                this.y = y;
                this.num = num;
                this.numBands = bands;
                this.baseHeight = Math.min(180, h * 0.2);
                this.height = this.baseHeight * size;
                this.width = Math.max(25, w * 0.02);
                this.centromerePos = 0.4 + Math.random() * 0.2;
                this.pair = [];
                this.mutating = false;
                this.corruptedBands = 0;
                this.totalCorruption = 0;
                this.mutationProgress = 0;
                this.targetBand = -1;
                this.targetPair = -1;
                this.dissolvePhase = 0;
                this.heatTimer = 0;
                this.glitchShake = 0;
                this.dead = false;
                this.driftY = 0;
                this.fragments = [];
                
                for (let p = 0; p < 2; p++) {
                    const bands = [];
                    for (let i = 0; i < this.numBands; i++) {
                        const rand = Math.random();
                        let type = 'light';
                        if (rand > 0.7) type = 'dark';
                        else if (rand > 0.5) type = 'medium';
                        else if (rand > 0.35) type = 'light-med';
                        
                        bands.push({
                            type: type,
                            originalType: type,
                            mutated: false
                        });
                    }
                    this.pair.push(bands);
                }
            }
            
            startMutation() {
                if (!this.mutating) {
                    this.mutating = true;
                    this.mutationProgress = 0;
                    this.targetPair = Math.floor(Math.random() * 2);
                    this.targetBand = Math.floor(Math.random() * this.numBands);
                    this.heatTimer = 0;
                    this.glitchShake = 1;
                }
            }
            
            update() {
                if (this.dead) {
                    this.driftY += 0.5;
                    this.height *= 0.995;
                    
                    // Update fragments
                    this.fragments.forEach(f => {
                        f.x += f.vx;
                        f.y += f.vy;
                        f.vy += 0.1;
                        f.life -= 0.008;
                    });
                    return;
                }
                
                if (this.mutating) {
                    this.mutationProgress += 0.01;
                    this.heatTimer++;
                    this.glitchShake = Math.max(0, this.glitchShake - 0.03);
                    
                    if (this.heatTimer > 20 && this.heatTimer < 150 && Math.random() < 0.08) {
                        const offsetX = this.x + this.targetPair * (this.width + 10);
                        const bandY = this.y + (this.targetBand / this.numBands) * this.height;
                        const bandHeight = this.height / this.numBands;
                        
                        heatWaves.push(new HeatWave(
                            offsetX - 15,
                            bandY - 10,
                            this.width + 30,
                            bandHeight + 20
                        ));
                    }
                    
                    if (Math.random() < 0.3 && time % 3 === 0) {
                        const offsetX = this.x + this.targetPair * (this.width + 10);
                        const bandY = this.y + (this.targetBand / this.numBands) * this.height;
                        
                        glitches.push(new Glitch(
                            offsetX - 40,
                            bandY - 30,
                            this.width + 80,
                            60,
                            1.2,
                            Math.floor(Math.random() * 3)
                        ));
                    }
                    
                    if (this.mutationProgress > 0.5 && !this.pair[this.targetPair][this.targetBand].mutated) {
                        const band = this.pair[this.targetPair][this.targetBand];
                        band.mutated = true;
                        band.type = 'void';
                        this.corruptedBands++;
                        
                        const offsetX = this.x + this.targetPair * (this.width + 10);
                        const bandY = this.y + (this.targetBand / this.numBands) * this.height;
                        const bandHeight = this.height / this.numBands;
                        
                        screenShake = 15;
                        
                        const mutation = mutationTypes[Math.floor(Math.random() * mutationTypes.length)];
                        logMessages.push(new LogMessage(mutation.text, this.num));
                        
                        flashes.push(new Flash(
                            offsetX - 30,
                            bandY - 15,
                            this.width + 60,
                            bandHeight + 30
                        ));
                        
                        for (let g = 0; g < 6; g++) {
                            glitches.push(new Glitch(
                                offsetX - 60,
                                bandY - 50 + g * 20,
                                this.width + 120,
                                100,
                                2,
                                mutation.glitchType
                            ));
                        }
                        
                        stains.push(new Stain(
                            offsetX + Math.random() * 40 - 20,
                            bandY + Math.random() * 30 - 15
                        ));
                        
                        // Propagation logic - more aggressive
                        if (this.corruptedBands > 2 && Math.random() < 0.35) {
                            const neighbor = chromosomes[Math.floor(Math.random() * chromosomes.length)];
                            if (!neighbor.dead && !neighbor.mutating) {
                                setTimeout(() => neighbor.startMutation(), 50);
                            }
                        }
                    }
                    
                    if (this.mutationProgress >= 1) {
                        this.mutating = false;
                        this.mutationProgress = 0;
                        this.heatTimer = 0;
                        this.totalCorruption = this.corruptedBands / (this.numBands * 2);
                        
                        if (this.totalCorruption > 0.5) {
                            this.dead = true;
                            
                            // Create fragments
                            for (let i = 0; i < 8; i++) {
                                this.fragments.push({
                                    x: this.x + Math.random() * this.width * 2,
                                    y: this.y + Math.random() * this.height,
                                    vx: (Math.random() - 0.5) * 3,
                                    vy: Math.random() * 2 - 1,
                                    life: 1
                                });
                            }
                            
                            if (globalCorruptionLevel > 0.3 && Math.random() < 0.4) {
                                systemWarnings.push(new SystemWarning('GENOME INSTABILITY CRITICAL'));
                            }
                        }
                    }
                }
                
                if (this.corruptedBands > 0) {
                    this.dissolvePhase += 0.002;
                }
            }
            
            draw() {
                if (this.dead && this.height < 10) return;
                
                const alpha = this.totalCorruption > 0 ? Math.max(0.3, 1 - this.totalCorruption * 0.8) : 1;
                const shakeX = (Math.random() - 0.5) * this.glitchShake * 10;
                const shakeY = (Math.random() - 0.5) * this.glitchShake * 10;
                
                for (let pair = 0; pair < 2; pair++) {
                    const jitter = (Math.random() - 0.5) * 0.6;
                    const offsetX = this.x + pair * (this.width + 10) + shakeX + jitter;
                    const drawY = this.y + shakeY + this.driftY;
                    
                    ctx.globalAlpha = alpha * (this.dead ? 0.4 : 1);
                    ctx.fillStyle = this.totalCorruption > 0.2 ? '#1a1a25' : '#f5f5f5';
                    ctx.strokeStyle = this.totalCorruption > 0.2 ? '#666' : '#333';
                    ctx.lineWidth = 1.5;
                    
                    ctx.beginPath();
                    ctx.roundRect(offsetX, drawY, this.width, this.height, 6);
                    ctx.fill();
                    ctx.stroke();
                    
                    const centromereY = drawY + this.height * this.centromerePos;
                    ctx.fillStyle = this.totalCorruption > 0.2 ? '#444' : '#999';
                    ctx.fillRect(offsetX, centromereY - 6, this.width, 12);
                    
                    const bandHeight = this.height / this.numBands;
                    this.pair[pair].forEach((band, i) => {
                        const bandY = drawY + i * bandHeight;
                        
                        let shouldDraw = true;
                        if (band.type === 'void') {
                            const voidAlpha = this.mutating && pair === this.targetPair && i === this.targetBand ? 
                                Math.sin(this.mutationProgress * Math.PI * 2) * 0.4 + 0.3 : 
                                0.2 + Math.sin(time * 0.05 + i) * 0.15;
                            ctx.globalAlpha = alpha * voidAlpha;
                            
                            ctx.globalCompositeOperation = 'destination-out';
                            ctx.fillStyle = '#000';
                            ctx.fillRect(offsetX, bandY, this.width, bandHeight);
                            ctx.globalCompositeOperation = 'source-over';
                            
                            if (Math.random() < 0.08) {
                                ctx.fillStyle = `rgba(100, 120, 50, ${voidAlpha * 0.3})`;
                                ctx.fillRect(offsetX + 2, bandY, this.width - 4, bandHeight);
                            }
                        } else {
                            ctx.globalAlpha = alpha;
                            switch(band.type) {
                                case 'dark':
                                    ctx.fillStyle = '#2d2d2d';
                                    break;
                                case 'medium':
                                    ctx.fillStyle = '#8b5a8b';
                                    break;
                                case 'light-med':
                                    ctx.fillStyle = '#b494b4';
                                    break;
                                default:
                                    shouldDraw = false;
                            }
                            
                            if (shouldDraw) {
                                const microJitter = (Math.random() - 0.5) * 0.8;
                                ctx.fillRect(offsetX + 2 + microJitter, bandY, this.width - 4, bandHeight);
                            }
                        }
                    });
                    
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = this.totalCorruption > 0.2 ? '#333' : '#ccc';
                    ctx.fillRect(offsetX + 4, centromereY - 4, this.width - 8, 8);
                }
                
                ctx.globalAlpha = alpha * 0.8;
                ctx.fillStyle = this.totalCorruption > 0.2 ? '#777' : '#ddd';
                ctx.font = `${Math.max(10, w * 0.01)}px Courier New`;
                ctx.textAlign = 'center';
                ctx.fillText(this.num, this.x + this.width + 5 + shakeX, this.y + this.height + 15 + shakeY + this.driftY);
                ctx.globalAlpha = 1;
                
                // Draw fragments
                this.fragments.forEach(f => {
                    if (f.life > 0) {
                        ctx.globalAlpha = f.life * 0.6;
                        ctx.fillStyle = '#555';
                        ctx.fillRect(f.x, f.y, 4, 4);
                    }
                });
                ctx.globalAlpha = 1;
            }
        }
        
        const chromosomeData = [
            {num: 1, bands: 40, size: 1.0}, {num: 2, bands: 38, size: 0.98},
            {num: 3, bands: 32, size: 0.82}, {num: 4, bands: 30, size: 0.78},
            {num: 5, bands: 29, size: 0.75}, {num: 6, bands: 28, size: 0.72},
            {num: 7, bands: 26, size: 0.68}, {num: 8, bands: 24, size: 0.63},
            {num: 9, bands: 23, size: 0.60}, {num: 10, bands: 22, size: 0.58},
            {num: 11, bands: 22, size: 0.57}, {num: 12, bands: 21, size: 0.56},
            {num: 13, bands: 18, size: 0.48}, {num: 14, bands: 17, size: 0.45},
            {num: 15, bands: 16, size: 0.43}, {num: 16, bands: 15, size: 0.40},
            {num: 17, bands: 14, size: 0.38}, {num: 18, bands: 13, size: 0.35},
            {num: 19, bands: 11, size: 0.32}, {num: 20, bands: 11, size: 0.31},
            {num: 21, bands: 9, size: 0.26}, {num: 22, bands: 9, size: 0.25}
        ];
        
        let chromosomes = [];
        
        function initChromosomes() {
            chromosomes = [];
            const cols = w > 1200 ? 6 : w > 768 ? 4 : 3;
            const rows = Math.ceil(22 / cols);
            const spacingX = w / (cols + 1);
            const spacingY = h / (rows + 2);
            
            for (let i = 0; i < 22; i++) {
                const row = Math.floor(i / cols);
                const col = i % cols;
                const x = spacingX * (col + 1) - 25;
                const y = spacingY * (row + 1.8);
                chromosomes.push(new Chromosome(x, y, i + 1, chromosomeData[i].bands, chromosomeData[i].size));
            }
        }
        
        function animate() {
            time++;
            dayTimer++;
            
            if (terminated) {
                terminationTimer++;
                ctx.fillStyle = `rgba(0, 0, 0, ${Math.min(1, terminationTimer / 180)})`;
                ctx.fillRect(0, 0, w, h);
                
                if (terminationTimer > 60) {
                    ctx.globalAlpha = Math.min(1, (terminationTimer - 60) / 120);
                    ctx.fillStyle = '#8b0000';
                    ctx.font = `bold ${Math.max(24, w * 0.02)}px Courier New`;
                    ctx.textAlign = 'center';
                    ctx.fillText('SUBJECT TERMINATED', w / 2, h / 2 - 20);
                    ctx.font = `${Math.max(14, w * 0.012)}px Courier New`;
                    ctx.fillText('DATA CORRUPTED', w / 2, h / 2 + 20);
                    ctx.globalAlpha = 1;
                }
                
                if (terminationTimer > 180) return;
                requestAnimationFrame(animate);
                return;
            }
            
            if (dayTimer >= 120) {
                day++;
                dayTimer = 0;
            }
            
            // Performance throttle
            if (glitches.length > MAX_GLITCHES) glitches.length = MAX_GLITCHES;
            if (heatWaves.length > MAX_HEAT_WAVES) heatWaves.length = MAX_HEAT_WAVES;
            if (stains.length > MAX_STAINS) stains.length = MAX_STAINS;
            
            screenShake = Math.max(0, screenShake - 1);
            const shakeX = (Math.random() - 0.5) * screenShake;
            const shakeY = (Math.random() - 0.5) * screenShake;
            
            ctx.save();
            ctx.translate(shakeX, shakeY);
            
            // System collapse state - earlier threshold
            if (!systemCollapsed && globalCorruptionLevel > 0.6) {
                systemCollapsed = true;
                systemWarnings.push(new SystemWarning('SYSTEM FAILURE'));
            }
            
            if (systemCollapsed) {
                ctx.globalAlpha = 0.85;
                ctx.filter = 'contrast(1.3) brightness(0.8)';
            }
            
            ctx.fillStyle = '#0a0a0f';
            ctx.fillRect(-50, -50, w + 100, h + 100);
            
            // Static scanlines removed from here - now drawn after stains
            
            stains.forEach(stain => {
                stain.update();
                stain.draw();
            });
            
            // Static scanlines removed - moved to end
            
            ctx.fillStyle = 'rgba(180, 180, 180, 0.7)';
            ctx.font = `${Math.max(16, w * 0.014)}px Courier New`;
            ctx.textAlign = 'center';
            ctx.fillText('TEST SUBJECT 355', w / 2, 40);
            
            ctx.fillStyle = 'rgba(140, 140, 140, 0.5)';
            ctx.font = `${Math.max(11, w * 0.009)}px Courier New`;
            ctx.fillText('GENETIC SEQUENCE ANALYSIS', w / 2, 60);
            
            ctx.fillStyle = 'rgba(160, 160, 160, 0.6)';
            ctx.font = `${Math.max(13, w * 0.011)}px Courier New`;
            ctx.textAlign = 'left';
            ctx.fillText(`DAY ${day}`, 30, 40);
            
            // Calculate global corruption
            globalCorruptionLevel = chromosomes.reduce((sum, chr) => sum + chr.totalCorruption, 0) / chromosomes.length;
            
            // Phase-based mutation rate - accelerated
            const phase = Math.floor(day / 3);
            const mutationRate = 0.08 + phase * 0.04;
            
            if (Math.random() < mutationRate) {
                const aliveChr = chromosomes.filter(c => !c.dead);
                if (aliveChr.length > 0) {
                    const chr = aliveChr[Math.floor(Math.random() * aliveChr.length)];
                    chr.startMutation();
                }
            }
            
            // System warnings at critical points
            if (globalCorruptionLevel > 0.5 && Math.random() < 0.005) {
                systemWarnings.push(new SystemWarning('CASCADE EVENT DETECTED'));
            }
            
            // Terminal state - earlier
            if (globalCorruptionLevel > 0.75 && !terminated) {
                terminated = true;
                systemWarnings.push(new SystemWarning('TOTAL GENOME COLLAPSE'));
            }
            
            // Chromatic aberration during high corruption
            if (globalCorruptionLevel > 0.3) {
                ctx.globalCompositeOperation = 'screen';
                ctx.fillStyle = `rgba(255,0,0,${0.015 * globalCorruptionLevel})`;
                ctx.fillRect(2, 0, w, h);
                ctx.fillStyle = `rgba(0,0,255,${0.015 * globalCorruptionLevel})`;
                ctx.fillRect(-2, 0, w, h);
                ctx.globalCompositeOperation = 'source-over';
            }
            
            if (Math.random() < 0.05) {
                ctx.fillStyle = `rgba(${100 + Math.random() * 100}, ${100 + Math.random() * 50}, 0, 0.03)`;
                ctx.fillRect(0, Math.random() * h, w, 2);
            }
            
            // Scanline desynchronization
            const scanOffset = Math.sin(time * 0.02) * 30;
            ctx.fillStyle = 'rgba(120, 255, 120, 0.15)';
            ctx.fillRect(0, (time * 3 + scanOffset) % h, w, 3);
            
            if (systemCollapsed || globalCorruptionLevel > 0.5) {
                // Additional rolling scanline during corruption
                const rollingScan = (time * 5) % h;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
                ctx.fillRect(0, rollingScan, w, 2);
            }
            
            chromosomes.forEach(chr => {
                chr.update();
                chr.draw();
            });
            
            for (let i = flashes.length - 1; i >= 0; i--) {
                flashes[i].update();
                flashes[i].draw();
                if (flashes[i].life <= 0) {
                    flashes.splice(i, 1);
                }
            }
            
            for (let i = glitches.length - 1; i >= 0; i--) {
                glitches[i].update();
                glitches[i].draw();
                if (glitches[i].life <= 0) {
                    glitches.splice(i, 1);
                }
            }
            
            for (let i = heatWaves.length - 1; i >= 0; i--) {
                heatWaves[i].update();
                heatWaves[i].draw();
                if (heatWaves[i].life <= 0) {
                    heatWaves.splice(i, 1);
                }
            }
            
            // Draw log messages
            for (let i = logMessages.length - 1; i >= 0; i--) {
                logMessages[i].update();
                logMessages[i].draw();
                if (logMessages[i].life <= 0) {
                    logMessages.splice(i, 1);
                }
            }
            
            // Draw system warnings
            for (let i = systemWarnings.length - 1; i >= 0; i--) {
                systemWarnings[i].update();
                systemWarnings[i].draw();
                if (systemWarnings[i].life <= 0) {
                    systemWarnings.splice(i, 1);
                }
            }
            
            // Static scanlines - drawn on top of everything
            for (let y = 0; y < h; y += 3) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
                ctx.fillRect(0, y, w, 1);
            }
            
            ctx.filter = 'none';
            ctx.globalAlpha = 1;
            ctx.restore();
            
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>
