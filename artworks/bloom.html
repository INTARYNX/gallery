<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin:0; overflow:hidden; display:flex; justify-content:center; align-items:center; height:100vh; background:#000; }
    .box {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      background:#050a12; border:1px solid #1a2a35; border-radius:4px;
      display:flex; justify-content:center; align-items:center;
    }
    .scanlines {
      position:absolute; top:0; left:0; width:100%; height:100%; z-index:2; pointer-events:none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0,0,0,0.15) 2px,
        rgba(0,0,0,0.15) 4px
      );
    }
    canvas { display:block; position:absolute; }
    #bg { z-index:0; }
    #c  { z-index:1; }
  </style>
</head>
<body>
  <div class="box">
    <canvas id="bg"></canvas>
    <canvas id="c"></canvas>
    <div class="scanlines"></div>
  </div>
  <script>
    const c = document.getElementById('c');
    const bg = document.getElementById('bg');
    const ctx = bg.getContext('2d');
    const gl = c.getContext('webgl');
    const {cos,sin,sqrt,PI} = Math;
    const N = 30000;

    function lotusPath(cx, cy, r, ctx) {
      ctx.beginPath();
      const pts = 200;
      for (let i = 0; i <= pts; i++) {
        const a = (i / pts) * PI * 2;
        const rr = r * (1 + 0.26 * cos(8 * a) + 0.08 * sin(16 * a));
        const x = cx + rr * cos(a - PI / 2);
        const y = cy + rr * sin(a - PI / 2);
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.closePath();
    }

    const rings = 22;
    let boxSize = 0;

    function drawRings(size, time) {
      bg.width = bg.height = size;
      const cx = size / 2, cy = size / 2;
      const maxR = size * 1.0;
      const minR = size * 0.38;
      ctx.fillStyle = '#050a12';
      ctx.fillRect(0, 0, size, size);
      const colors = [
        [20, 80, 120],
        [120, 30, 40],
        [10, 50, 70],
        [80, 15, 25],
        [30, 100, 90],
        [60, 10, 35],
      ];
      for (let i = rings; i >= 0; i--) {
        const t = i / rings;
        const r = minR + (maxR - minR) * (t * t);
        const phase = (time * 0.8 - i * 0.5 + colors.length * 20) % (colors.length);
        const ci = Math.floor(phase) % colors.length;
        const ni = (ci + 1) % colors.length;
        const mix = phase - Math.floor(phase);
        const cr = colors[ci][0] + (colors[ni][0] - colors[ci][0]) * mix;
        const cg = colors[ci][1] + (colors[ni][1] - colors[ci][1]) * mix;
        const cb = colors[ci][2] + (colors[ni][2] - colors[ci][2]) * mix;
        const fade = 0.3 + 0.7 * t;
        ctx.fillStyle = `rgb(${cr*fade|0},${cg*fade|0},${cb*fade|0})`;
        // Noisy lotus path for outer rings
        ctx.beginPath();
        const pts = 200;
        const noiseAmt = t * t * 12;
        for (let j = 0; j <= pts; j++) {
          const a = (j / pts) * PI * 2;
          const n = noiseAmt * (sin(a * 17 + i * 3.7 + time * 0.6) * 0.5 + sin(a * 31 - i * 2.1 + time * 0.4) * 0.3 + sin(a * 53 + i * 5.3) * 0.2);
          const rr = (r + n) * (1 + 0.26 * cos(8 * a) + 0.08 * sin(16 * a));
          const x = cx + rr * cos(a - PI / 2);
          const y = cy + rr * sin(a - PI / 2);
          j === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
      }
    }

    let W;
    function resize() {
      W = Math.min(innerWidth, innerHeight) * 0.85;
      c.width = c.height = W;
      const box = document.querySelector('.box');
      boxSize = W * 1.08;
      box.style.width = boxSize + 'px';
      box.style.height = boxSize + 'px';
      bg.style.left = '0'; bg.style.top = '0';
      bg.style.width = boxSize + 'px'; bg.style.height = boxSize + 'px';
      c.style.left = (boxSize - W) / 2 + 'px';
      c.style.top = (boxSize - W) / 2 + 'px';
    }
    resize();
    onresize = resize;

    function buildClip() {
      const pts = 200;
      let s = 'polygon(';
      for (let i = 0; i < pts; i++) {
        const a = (i / pts) * PI * 2;
        const r = 38 + 10 * cos(8 * a) + 3 * sin(16 * a);
        const x = 50 + r * cos(a - PI / 2);
        const y = 50 + r * sin(a - PI / 2);
        s += `${x.toFixed(2)}% ${y.toFixed(2)}%`;
        if (i < pts - 1) s += ',';
      }
      c.style.clipPath = s + ')';
    }
    buildClip();

    const vs = `
    #define PI 3.14159265359
    #define N ${N}.0
    attribute float a_id;
    uniform float u_t, u_sc, u_W;
    varying vec3 v_c;

    void main(){
      float id = floor(a_id / 4.0);
      float sym = mod(a_id, 4.0);
      float i = id / N;

      // Layer system: 3 interleaved rose curves
      float layer = mod(id, 3.0);
      float li = floor(id / 3.0) / (N / 3.0);

      // Angle with golden ratio spacing for density
      float golden = 2.399963;
      float a = li * golden * 200.0 + u_t * (0.15 + layer * 0.05);

      // Rose curve: r = cos(k*theta) with different k per layer
      float k1 = 5.0 + sin(u_t * 0.2) * 0.5;
      float k2 = 7.0 + cos(u_t * 0.17) * 0.5;
      float k3 = 3.0 + sin(u_t * 0.13) * 0.3;
      float k = layer < 0.5 ? k1 : (layer < 1.5 ? k2 : k3);

      float rose = cos(k * a);

      // Morph between rose and cardioid
      float morph = sin(u_t * 0.1) * 0.5 + 0.5;
      float card = 1.0 - sin(a);
      float rr = mix(rose, card * 0.5, morph * 0.3);

      // Add turbulence
      float turb = sin(a * 13.0 + u_t) * 0.08 + sin(li * 50.0 + u_t * 0.7) * 0.05;
      rr += turb;

      float rad = abs(rr) * u_W * 0.48;
      float px = rad * cos(a);
      float py = rad * sin(a);

      // Swirl distortion
      float d = sqrt(px*px + py*py) / (u_W * 0.4);
      float swirl = d * sin(u_t * 0.15) * 1.5;
      float ca = cos(swirl), sa = sin(swirl);
      float sx = px * ca - py * sa;
      float sy = px * sa + py * ca;

      float cx = u_W / 2.0;
      vec2 p;
      if(sym < 0.5)      p = vec2(cx + sx, cx + sy);
      else if(sym < 1.5) p = vec2(cx - sx, cx - sy);
      else if(sym < 2.5) p = vec2(cx + sy, cx - sx);
      else               p = vec2(cx - sy, cx + sx);

      gl_Position = vec4(p / u_W * 2.0 - 1.0, 0.0, 1.0);
      // Rotate final position around center
      float grot = u_t * 0.08;
      float gc = cos(grot), gs = sin(grot);
      gl_Position.xy = vec2(gl_Position.x * gc - gl_Position.y * gs, gl_Position.x * gs + gl_Position.y * gc);
      gl_Position.y = -gl_Position.y;
      gl_PointSize = max(1.0, u_sc * (0.6 + 0.4 * abs(rr)));

      // Color
      float dist = sqrt(sx*sx + sy*sy) / (u_W * 0.35);
      float ang = atan(sy, sx);
      float pulse = sin(u_t * 0.3) * 0.2 + 0.8;

      float ring1 = sin(dist * 18.0 + u_t * 0.3) * 0.5 + 0.5;
      float ring2 = sin(dist * 30.0 - u_t * 0.4) * 0.5 + 0.5;
      float pet1 = sin(ang * k + dist * 6.0) * 0.5 + 0.5;
      float pet2 = cos(ang * 8.0 - u_t * 0.2) * 0.5 + 0.5;
      float zone = dist * 2.5;

      // Per-layer color tint
      float lf1 = layer < 0.5 ? 1.0 : 0.3;
      float lf2 = (layer > 0.5 && layer < 1.5) ? 1.0 : 0.3;
      float lf3 = layer > 1.5 ? 1.0 : 0.3;

      float center = exp(-zone * zone * 30.0);
      vec3 c0 = vec3(1.0, 0.93, 0.85) * center * 0.35;
      vec3 c1 = vec3(1.0, 0.7, 0.2) * max(0.0, 1.0 - zone) * 0.45 * lf1;
      vec3 c2 = vec3(0.9, 0.2, 0.15) * ring1 * pet1 * smoothstep(0.2, 0.5, zone) * smoothstep(1.3, 0.3, zone) * lf1;
      vec3 c3 = vec3(0.85, 0.35, 0.1) * ring2 * pet2 * smoothstep(0.2, 0.6, zone) * smoothstep(1.5, 0.6, zone) * lf2;
      vec3 c4 = vec3(0.05, 0.4, 0.6) * pet1 * smoothstep(0.4, 0.9, zone) * 0.8 * lf3;
      vec3 c5 = vec3(0.08, 0.55, 0.5) * sin(dist * 50.0 + ang * 12.0) * 0.15 * smoothstep(0.3, 0.7, zone);
      vec3 c6 = vec3(0.04, 0.12, 0.2) * smoothstep(0.8, 1.6, zone) * max(0.0, 2.0 - zone) * 0.5;
      vec3 c7 = vec3(0.9, 0.3, 0.05) * abs(rr) * smoothstep(0.5, 1.0, zone) * 0.2;

      vec3 col = (c0 + c1 + c2 + c3 + c4 + c5 + c6 + c7) * pulse * 2.0 + 0.03;
      v_c = clamp(col, 0.0, 1.0);
    }`;

    const fs = `
    precision mediump float;
    varying vec3 v_c;
    void main(){ gl_FragColor = vec4(v_c, 1.0); }`;

    function mk(src, type) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
      return s;
    }
    const pg = gl.createProgram();
    gl.attachShader(pg, mk(vs, gl.VERTEX_SHADER));
    gl.attachShader(pg, mk(fs, gl.FRAGMENT_SHADER));
    gl.linkProgram(pg); gl.useProgram(pg);

    const ids = new Float32Array(N * 4);
    for (let i = 0; i < N * 4; i++) ids[i] = i;
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, ids, gl.STATIC_DRAW);
    const aId = gl.getAttribLocation(pg, 'a_id');
    gl.enableVertexAttribArray(aId);
    gl.vertexAttribPointer(aId, 1, gl.FLOAT, false, 0, 0);

    const uT = gl.getUniformLocation(pg, 'u_t');
    const uSc = gl.getUniformLocation(pg, 'u_sc');
    const uW = gl.getUniformLocation(pg, 'u_W');

    let t = 0;
    function draw() {
      t += PI / 60;
      const sc = W / 280;
      drawRings(boxSize, t);
      gl.viewport(0, 0, W, W);
      gl.clearColor(5/255, 10/255, 18/255, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform1f(uT, t);
      gl.uniform1f(uSc, sc);
      gl.uniform1f(uW, W);
      gl.drawArrays(gl.POINTS, 0, N * 4);
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
