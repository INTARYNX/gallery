<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aurora</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #000;
        }
        canvas {
            max-width: 90vmin;
            max-height: 90vmin;
            width: 100%;
            height: auto;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 800;
        canvas.height = 800;

        let offset = 0;
        const scrollSpeed = 2;
        let time = 0;

        // Snowflakes
        const snowflakes = [];
        for (let i = 0; i < 200; i++) {
            const depth = Math.random();
            snowflakes.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: depth * 2 + 0.5,
                speed: depth * 1.5 + 0.4,
                opacity: depth * 0.4 + 0.15,
                angle: Math.random() * Math.PI * 2
            });
        }

        // Perlin noise
        const permutation = [];
        for (let i = 0; i < 256; i++) permutation[i] = i;
        for (let i = 255; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [permutation[i], permutation[j]] = [permutation[j], permutation[i]];
        }
        const p = [...permutation, ...permutation];

        function fade(t) {
            return t * t * t * (t * (t * 6 - 15) + 10);
        }

        function lerp(t, a, b) {
            return a + t * (b - a);
        }

        function grad(hash, x, y) {
            const h = hash & 15;
            const u = h < 8 ? x : y;
            const v = h < 4 ? y : h === 12 || h === 14 ? x : 0;
            return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
        }

        function perlin(x, y) {
            const X = Math.floor(x) & 255;
            const Y = Math.floor(y) & 255;
            x -= Math.floor(x);
            y -= Math.floor(y);
            const u = fade(x);
            const v = fade(y);
            const a = p[X] + Y;
            const aa = p[a];
            const ab = p[a + 1];
            const b = p[X + 1] + Y;
            const ba = p[b];
            const bb = p[b + 1];
            return lerp(v, lerp(u, grad(p[aa], x, y), grad(p[ba], x - 1, y)),
                           lerp(u, grad(p[ab], x, y - 1), grad(p[bb], x - 1, y - 1)));
        }

        const layers = [
            { baseY: 350, amplitude: 40, frequency: 0.006, phase: 0, color: '#0a1420', speed: 0.08 },
            { baseY: 380, amplitude: 38, frequency: 0.009, phase: 1.5, color: '#0f1928', speed: 0.12 },
            { baseY: 410, amplitude: 36, frequency: 0.012, phase: 3, color: '#1a2838', speed: 0.16 },
            { baseY: 440, amplitude: 34, frequency: 0.008, phase: 0.5, color: '#253748', speed: 0.2 },
            { baseY: 480, amplitude: 32, frequency: 0.015, phase: 2.5, color: '#405870', speed: 0.24 },
            { baseY: 520, amplitude: 30, frequency: 0.018, phase: 1, color: '#607898', speed: 0.28 },
            { baseY: 560, amplitude: 28, frequency: 0.014, phase: 4, color: '#8098b8', speed: 0.32 },
            { baseY: 600, amplitude: 26, frequency: 0.02, phase: 2, color: '#a8c0d8', speed: 0.36 },
            { baseY: 640, amplitude: 24, frequency: 0.022, phase: 0.8, color: '#d0e0f0', speed: 0.4 },
            { baseY: 680, amplitude: 22, frequency: 0.016, phase: 3.5, color: '#e8f4ff', speed: 0.44 },
            { baseY: 720, amplitude: 20, frequency: 0.024, phase: 1.2, color: '#f5f9ff', speed: 0.48 },
            { baseY: 760, amplitude: 18, frequency: 0.026, phase: 2.8, color: '#ffffff', speed: 0.52 }
        ];

        function drawAurora() {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            
            for (let i = 0; i < 4; i++) {
                const baseX = (i / 4) * canvas.width + Math.sin(time * 0.0008 + i) * 180;
                const hue = (120 + time * 0.15 + i * 50) % 360;
                
                for (let y = 0; y < canvas.height * 0.5; y += 10) {
                    const noise = perlin(baseX * 0.005, y * 0.003 + time * 0.0005);
                    const x = baseX + noise * 250 + Math.sin(y * 0.01 + time * 0.002) * 120;
                    const width = 50 + Math.sin(y * 0.008 + time * 0.002) * 35;
                    const opacity = (1 - y / (canvas.height * 0.5)) * (0.2 + Math.sin(y * 0.02 + time * 0.004) * 0.12);
                    
                    const gradient = ctx.createRadialGradient(x, y, 0, x, y, width);
                    gradient.addColorStop(0, `hsla(${hue}, 90%, 65%, ${opacity})`);
                    gradient.addColorStop(0.5, `hsla(${(hue + 35) % 360}, 80%, 60%, ${opacity * 0.6})`);
                    gradient.addColorStop(1, `hsla(${hue}, 70%, 50%, 0)`);
                    
                    ctx.fillStyle = gradient;
                    ctx.fillRect(x - width, y, width * 2, 10);
                }
            }
            
            ctx.restore();
        }

        function drawMountain(layer, scrollOffset, layerIndex) {
            const points = [];
            
            for (let x = 0; x <= canvas.width; x++) {
                const noise1 = perlin((x + scrollOffset) * 0.005, layer.baseY * 0.01);
                const noise2 = perlin((x + scrollOffset) * 0.015, layer.baseY * 0.02) * 0.5;
                const y = layer.baseY + Math.sin(((x + scrollOffset) * layer.frequency) + layer.phase) * layer.amplitude + (noise1 + noise2) * layer.amplitude;
                points.push({x, y});
            }
            
            const minY = Math.min(...points.map(p => p.y));
            
            ctx.beginPath();
            ctx.moveTo(0, canvas.height);
            points.forEach(p => ctx.lineTo(p.x, p.y));
            ctx.lineTo(canvas.width, canvas.height);
            ctx.closePath();
            
            ctx.fillStyle = layer.color;
            ctx.fill();
            
            // All layers reflect aurora with depth offset
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            
            const depthFactor = layerIndex / 12; // 0 to 1, 0 = far, 1 = near
            const reflectionStrength = 0.25 + depthFactor * 0.6; // Far = 0.25, near = 0.85
            
            // Sample aurora colors from sky with layer-specific offset
            for (let i = 0; i < 4; i++) {
                const auroraOffset = layerIndex * 40; // Each layer samples aurora from different height
                const baseX = (i / 4) * canvas.width + Math.sin(time * 0.0008 + i) * 180;
                const hue = (120 + time * 0.15 + i * 50) % 360;
                
                // Draw vertical light bands matching aurora position
                for (let x = 0; x < canvas.width; x += 8) {
                    const noise = perlin(baseX * 0.005, (x + auroraOffset) * 0.003 + time * 0.0005);
                    const waveX = baseX + noise * 250 + Math.sin(x * 0.01 + time * 0.002) * 120;
                    const distToWave = Math.abs(x - waveX);
                    
                    if (distToWave < 120) {
                        const falloff = 1 - distToWave / 120;
                        const intensity = falloff * reflectionStrength * (0.35 + Math.sin(time * 0.004 + x * 0.02) * 0.25);
                        
                        const gradient = ctx.createLinearGradient(x, minY, x, minY + 180);
                        gradient.addColorStop(0, `hsla(${hue}, 95%, 75%, ${intensity})`);
                        gradient.addColorStop(0.5, `hsla(${(hue + 35) % 360}, 90%, 70%, ${intensity * 0.7})`);
                        gradient.addColorStop(1, 'hsla(0, 0%, 0%, 0)');
                        
                        ctx.fillStyle = gradient;
                        
                        const mountainY = points[Math.min(x, points.length - 1)].y;
                        ctx.fillRect(x, mountainY, 8, canvas.height - mountainY);
                    }
                }
            }
            
            ctx.restore();
        }

        function animate() {
            // Night sky
            const skyGradient = ctx.createRadialGradient(canvas.width / 2, canvas.height * 0.3, 0, canvas.width / 2, canvas.height * 0.3, canvas.height);
            skyGradient.addColorStop(0, '#0d1520');
            skyGradient.addColorStop(0.5, '#080d18');
            skyGradient.addColorStop(1, '#040610');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Stars
            for (let i = 0; i < 80; i++) {
                const x = (i * 137.5) % canvas.width;
                const y = (i * 73.3) % (canvas.height * 0.5);
                const twinkle = Math.sin(time * 0.003 + i) * 0.4 + 0.6;
                ctx.fillStyle = `rgba(255, 255, 255, ${twinkle * 0.7})`;
                ctx.fillRect(x, y, 2, 2);
            }

            drawAurora();

            layers.forEach((layer, index) => {
                drawMountain(layer, offset * layer.speed, index);
            });

            // Snowflakes
            snowflakes.forEach(flake => {
                ctx.save();
                ctx.translate(flake.x, flake.y);
                ctx.rotate(flake.angle);
                ctx.globalAlpha = flake.opacity;
                ctx.strokeStyle = `rgba(255, 255, 255, ${flake.opacity})`;
                ctx.lineWidth = 0.7;
                
                const arms = 6;
                const armLength = flake.radius * 2;
                
                for (let i = 0; i < arms; i++) {
                    const angle = (Math.PI * 2 / arms) * i;
                    
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(Math.cos(angle) * armLength, Math.sin(angle) * armLength);
                    ctx.stroke();
                    
                    for (let b = 0.3; b < 1; b += 0.35) {
                        const bx = Math.cos(angle) * armLength * b;
                        const by = Math.sin(angle) * armLength * b;
                        const bLen = armLength * 0.3 * (1 - b * 0.4);
                        
                        ctx.beginPath();
                        ctx.moveTo(bx, by);
                        ctx.lineTo(bx + Math.cos(angle - Math.PI / 3) * bLen, by + Math.sin(angle - Math.PI / 3) * bLen);
                        ctx.stroke();
                        
                        ctx.beginPath();
                        ctx.moveTo(bx, by);
                        ctx.lineTo(bx + Math.cos(angle + Math.PI / 3) * bLen, by + Math.sin(angle + Math.PI / 3) * bLen);
                        ctx.stroke();
                    }
                }
                
                ctx.fillStyle = `rgba(255, 255, 255, ${flake.opacity * 0.5})`;
                ctx.beginPath();
                ctx.arc(0, 0, flake.radius * 0.4, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
                
                flake.y += flake.speed;
                flake.angle += 0.005;
                flake.x += Math.sin(flake.y * 0.01) * 0.3;
                
                if (flake.y > canvas.height) {
                    flake.y = -10;
                    flake.x = Math.random() * canvas.width;
                }
            });

            offset += scrollSpeed;
            time += 1;
            
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
