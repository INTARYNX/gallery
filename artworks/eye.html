<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eye</title>
    <style>
        body {
            margin: 0;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        canvas {
            display: block;
            width: 90vmin;
            height: 90vmin;
            max-width: 600px;
            max-height: 600px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const size = 600;
        canvas.width = size;
        canvas.height = size;
        const cx = size / 2, cy = size / 2;

        const PHI = (1 + Math.sqrt(5)) / 2;
        const GOLDEN_ANGLE = Math.PI * 2 / (PHI * PHI);

        let time = 0;
        const irisR = 280;

        // Eye color palettes: [inner, mid1, mid2, mid3, outer, dark]
        const palettes = [
            // Green
            { stops: ['#1a3a2a','#2a6040','#3a8855','#4a7848','#3a5530','#1a2a15'], hueBase: 130, collarHue: 45 },
            // Blue
            { stops: ['#0a2040','#1a4070','#2a6098','#3070a0','#254a78','#0a1a30'], hueBase: 210, collarHue: 200 },
            // Hazel/Brown
            { stops: ['#3a2a10','#6a4820','#8a6530','#7a5a28','#5a3a18','#2a1a08'], hueBase: 35, collarHue: 40 },
            // Dark brown/black
            { stops: ['#1a1008','#2a1a0a','#3a2510','#302010','#201008','#0a0804'], hueBase: 25, collarHue: 30 },
            // Amber
            { stops: ['#3a2800','#6a5010','#9a7820','#8a6a18','#5a4010','#2a1a05'], hueBase: 42, collarHue: 45 },
            // Grey-blue
            { stops: ['#1a2028','#3a4858','#5a6878','#4a5a6a','#3a4450','#1a1a22'], hueBase: 210, collarHue: 200 },
        ];
        const cycleDuration = 6; // seconds per color

        function lerpColor(a, b, t) {
            const pa = [parseInt(a.slice(1,3),16), parseInt(a.slice(3,5),16), parseInt(a.slice(5,7),16)];
            const pb = [parseInt(b.slice(1,3),16), parseInt(b.slice(3,5),16), parseInt(b.slice(5,7),16)];
            const r = Math.round(pa[0]+(pb[0]-pa[0])*t);
            const g = Math.round(pa[1]+(pb[1]-pa[1])*t);
            const bl = Math.round(pa[2]+(pb[2]-pa[2])*t);
            return `rgb(${r},${g},${bl})`;
        }

        function getCurrentPalette(t) {
            const total = palettes.length * cycleDuration;
            const pos = (t % total) / cycleDuration;
            const idx = Math.floor(pos);
            const frac = pos - idx;
            const smooth = frac * frac * (3 - 2 * frac); // smoothstep
            const a = palettes[idx % palettes.length];
            const b = palettes[(idx + 1) % palettes.length];
            return {
                stops: a.stops.map((c, i) => lerpColor(c, b.stops[i], smooth)),
                hueBase: a.hueBase + (b.hueBase - a.hueBase) * smooth,
                collarHue: a.collarHue + (b.collarHue - a.collarHue) * smooth,
            };
        }

        function animate() {
            time += 0.01;

            // Sclera (white of the eye)
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, size, size);
            const sclera = ctx.createRadialGradient(cx, cy, irisR * 0.8, cx, cy, size * 0.52);
            sclera.addColorStop(0, '#f5ece6');
            sclera.addColorStop(0.5, '#f0e4da');
            sclera.addColorStop(1, '#d8c4b0');
            ctx.beginPath();
            ctx.arc(cx, cy, size * 0.48, 0, Math.PI * 2);
            ctx.fillStyle = sclera;
            ctx.fill();

            const pal = getCurrentPalette(time);

            // Iris base gradient
            const ig = ctx.createRadialGradient(cx, cy, 5, cx, cy, irisR);
            ig.addColorStop(0, pal.stops[0]);
            ig.addColorStop(0.3, pal.stops[1]);
            ig.addColorStop(0.5, pal.stops[2]);
            ig.addColorStop(0.7, pal.stops[3]);
            ig.addColorStop(0.85, pal.stops[4]);
            ig.addColorStop(1, pal.stops[5]);

            ctx.beginPath();
            ctx.arc(cx, cy, irisR, 0, Math.PI * 2);
            ctx.fillStyle = ig;
            ctx.fill();

            // Iris fibrous texture — golden angle distributed fibers
            for (let i = 0; i < 200; i++) {
                const angle = i * GOLDEN_ANGLE + time * 0.1;
                const rStart = 65 + Math.sin(i * 0.8) * 15;
                const rEnd = irisR * (0.7 + Math.sin(i * 0.3 + time * 0.5) * 0.25);

                const hue = pal.hueBase + Math.sin(i * 0.15 + time * 0.3) * 40;
                const light = 35 + Math.sin(i * 0.4 + time * 0.7) * 15;
                const alpha = 0.15 + Math.sin(i * 0.6 + time) * 0.08;

                ctx.strokeStyle = `hsla(${hue}, 55%, ${light}%, ${alpha})`;
                ctx.lineWidth = 0.6 + Math.sin(i * 1.2) * 0.3;

                ctx.beginPath();
                for (let r = rStart; r < rEnd; r += 2) {
                    const wobble = Math.sin(r * 0.15 + i * 0.5 + time * 1.5) * 2.5;
                    const x = cx + Math.cos(angle + wobble * 0.02) * r;
                    const y = cy + Math.sin(angle + wobble * 0.02) * r;
                    r === rStart ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            // Collarette ring
            const colR = 100;
            ctx.strokeStyle = `hsla(${pal.collarHue}, 60%, 45%, 0.4)`;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            for (let a = 0; a < Math.PI * 2; a += 0.03) {
                const wobble = Math.sin(a * 12 + time * 2) * 4 + Math.sin(a * 7 + time) * 3;
                const r = colR + wobble;
                const x = cx + Math.cos(a) * r;
                const y = cy + Math.sin(a) * r;
                a === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.stroke();

            // Limbal ring darkening
            const limbal = ctx.createRadialGradient(cx, cy, irisR * 0.75, cx, cy, irisR);
            limbal.addColorStop(0, 'rgba(0,0,0,0)');
            limbal.addColorStop(0.7, 'rgba(10,20,10,0.3)');
            limbal.addColorStop(1, 'rgba(5,10,5,0.7)');
            ctx.beginPath();
            ctx.arc(cx, cy, irisR, 0, Math.PI * 2);
            ctx.fillStyle = limbal;
            ctx.fill();
            ctx.strokeStyle = 'rgba(10, 20, 10, 0.6)';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // Pupil
            const pupilR = 55 + Math.sin(time * 0.8) * 8;
            const pg = ctx.createRadialGradient(cx, cy, 0, cx, cy, pupilR);
            pg.addColorStop(0, '#000000');
            pg.addColorStop(0.8, '#050505');
            pg.addColorStop(1, '#0a1508');
            ctx.beginPath();
            ctx.arc(cx, cy, pupilR, 0, Math.PI * 2);
            ctx.fillStyle = pg;
            ctx.fill();

            // Specular highlights - main window reflection
            ctx.save();
            ctx.beginPath();
            ctx.ellipse(cx - 50, cy - 55, 28, 20, -0.2, 0, Math.PI * 2);
            const mainRef = ctx.createRadialGradient(cx - 50, cy - 55, 0, cx - 50, cy - 55, 28);
            mainRef.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
            mainRef.addColorStop(0.4, 'rgba(255, 255, 255, 0.7)');
            mainRef.addColorStop(0.7, 'rgba(220, 230, 255, 0.3)');
            mainRef.addColorStop(1, 'rgba(200, 220, 255, 0)');
            ctx.fillStyle = mainRef;
            ctx.fill();

            // Window frame inside main reflection
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(cx - 50, cy - 72);
            ctx.lineTo(cx - 50, cy - 38);
            ctx.moveTo(cx - 72, cy - 55);
            ctx.lineTo(cx - 28, cy - 55);
            ctx.stroke();

            // Secondary smaller reflection
            ctx.beginPath();
            ctx.ellipse(cx + 40, cy + 45, 12, 8, 0.5, 0, Math.PI * 2);
            const secRef = ctx.createRadialGradient(cx + 40, cy + 45, 0, cx + 40, cy + 45, 12);
            secRef.addColorStop(0, 'rgba(255, 255, 255, 0.5)');
            secRef.addColorStop(0.5, 'rgba(230, 240, 255, 0.25)');
            secRef.addColorStop(1, 'rgba(200, 220, 255, 0)');
            ctx.fillStyle = secRef;
            ctx.fill();

            // Faint diffuse glow on iris surface
            const glowR = irisR * 0.6;
            const glow = ctx.createRadialGradient(cx - 30, cy - 35, 0, cx - 30, cy - 35, glowR);
            glow.addColorStop(0, 'rgba(255, 255, 255, 0.06)');
            glow.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.beginPath();
            ctx.arc(cx - 30, cy - 35, glowR, 0, Math.PI * 2);
            ctx.fillStyle = glow;
            ctx.fill();

            ctx.restore();

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
