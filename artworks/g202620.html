        const gridSize = imageData.width;
        const squareSize = 1600 / gridSize;
        let zoom = 0.5;
        let zoomDirection = 1;
        let rotation = 0;
        let zoomSpeed = 0.005;
        let rotationSpeed = 0;
        let startTime = Date.now();
        
        let pathData = null;
        
        function parseImageData() {
            const data = imageData.data;
            const grid = [];
            let idx = 0;
            
            for (let row = 0; row < gridSize; row++) {
                grid[row] = [];
                for (let col = 0; col < gridSize; col++) {
                    const char = data[idx++];
                    const value = parseInt(char, 16);
                    grid[row][col] = value / 15;
                }
            }
            
            return grid;
        }
        
        const grayLevels = parseImageData();

        function generatePath() {
            let lastPoint = null;
            let path = [];

            for (let row = 0; row < gridSize; row++) {
                const rowDirection = row % 2 === 0 ? 1 : -1;
                const startCol = rowDirection === 1 ? 0 : gridSize - 1;

                for (let colStep = 0; colStep < gridSize; colStep++) {
                    const col = startCol + colStep * rowDirection;
                    const isHorizontal = (row + col) % 2 === 0;

                    const density = grayLevels[row][col];
                    const numLines = Math.floor(2 + density * 8);
                    const amplitude = squareSize * (0.1 + Math.random() * 0.2);
                    const frequency = 0.3 + Math.random() * 0.5;
                    const phaseOffset = (row * gridSize + col) * 0.5;
                    const step = density > 0.6 ? 1 : (density > 0.3 ? 2 : 3);

                    let squareLines = [];

                    if (isHorizontal) {
                        for (let n = 0; n < numLines; n++) {
                            const y = row * squareSize + (n + 1) * squareSize / (numLines + 1);
                            let line = [];

                            for (let x = col * squareSize; x <= (col + 1) * squareSize; x += step) {
                                const wave = Math.sin(x * frequency + phaseOffset) * amplitude;
                                line.push({x: x, y: y + wave});
                            }

                            squareLines.push(line);
                        }
                    } else {
                        for (let n = 0; n < numLines; n++) {
                            const x = col * squareSize + (n + 1) * squareSize / (numLines + 1);
                            let line = [];

                            for (let y = row * squareSize; y <= (row + 1) * squareSize; y += step) {
                                const wave = Math.sin(y * frequency + phaseOffset) * amplitude;
                                line.push({x: x + wave, y: y});
                            }

                            squareLines.push(line);
                        }
                    }

                    if (lastPoint && squareLines.length > 0) {
                        let bestLineIdx = 0;
                        let bestReverse = false;
                        let minDist = Infinity;

                        for (let i = 0; i < squareLines.length; i++) {
                            const line = squareLines[i];
                            const distStart = Math.hypot(lastPoint.x - line[0].x, lastPoint.y - line[0].y);
                            const distEnd = Math.hypot(lastPoint.x - line[line.length-1].x, lastPoint.y - line[line.length-1].y);

                            if (distStart < minDist) {
                                minDist = distStart;
                                bestLineIdx = i;
                                bestReverse = false;
                            }
                            if (distEnd < minDist) {
                                minDist = distEnd;
                                bestLineIdx = i;
                                bestReverse = true;
                            }
                        }

                        const firstLine = squareLines[bestLineIdx];
                        const targetPoint = bestReverse ? firstLine[firstLine.length-1] : firstLine[0];
                        
                        if (minDist > 5) {
                            const corners = [
                                {x: col * squareSize, y: row * squareSize},
                                {x: (col + 1) * squareSize, y: row * squareSize},
                                {x: (col + 1) * squareSize, y: (row + 1) * squareSize},
                                {x: col * squareSize, y: (row + 1) * squareSize}
                            ];
                            
                            let closestCorner = 0;
                            let minCornerDist = Infinity;
                            for (let i = 0; i < corners.length; i++) {
                                const d = Math.hypot(lastPoint.x - corners[i].x, lastPoint.y - corners[i].y);
                                if (d < minCornerDist) {
                                    minCornerDist = d;
                                    closestCorner = i;
                                }
                            }
                            
                            path.push(corners[closestCorner]);
                            
                            let targetCorner = 0;
                            minCornerDist = Infinity;
                            for (let i = 0; i < corners.length; i++) {
                                const d = Math.hypot(targetPoint.x - corners[i].x, targetPoint.y - corners[i].y);
                                if (d < minCornerDist) {
                                    minCornerDist = d;
                                    targetCorner = i;
                                }
                            }
                            
                            if (closestCorner !== targetCorner) {
                                path.push(corners[targetCorner]);
                            }
                            path.push(targetPoint);
                        }

                        const firstL = squareLines.splice(bestLineIdx, 1)[0];
                        if (bestReverse) firstL.reverse();
                        
                        for (let p of firstL) {
                            path.push(p);
                        }
                        lastPoint = firstL[firstL.length - 1];

                        while (squareLines.length > 0) {
                            let closestIdx = 0;
                            let closestReverse = false;
                            let minD = Infinity;

                            for (let i = 0; i < squareLines.length; i++) {
                                const line = squareLines[i];
                                const d1 = Math.hypot(lastPoint.x - line[0].x, lastPoint.y - line[0].y);
                                const d2 = Math.hypot(lastPoint.x - line[line.length-1].x, lastPoint.y - line[line.length-1].y);

                                if (d1 < minD) {
                                    minD = d1;
                                    closestIdx = i;
                                    closestReverse = false;
                                }
                                if (d2 < minD) {
                                    minD = d2;
                                    closestIdx = i;
                                    closestReverse = true;
                                }
                            }

                            const nextLine = squareLines.splice(closestIdx, 1)[0];
                            if (closestReverse) nextLine.reverse();

                            for (let p of nextLine) {
                                path.push(p);
                            }
                            lastPoint = nextLine[nextLine.length - 1];
                        }
                    } else if (squareLines.length > 0) {
                        for (let line of squareLines) {
                            for (let p of line) {
                                path.push(p);
                                lastPoint = p;
                            }
                        }
                    }
                }
            }
            
            return path;
        }

        function drawPath() {
            requestAnimationFrame(drawPath);
            
            ctx.save();
            ctx.clearRect(0, 0, 1600, 1600);
            
            ctx.translate(800, 800);
            ctx.rotate(rotation);
            ctx.scale(zoom, zoom);
            ctx.translate(-800, -800);
            
            ctx.drawImage(offscreenCanvas, 0, 0);
            
            ctx.restore();
            
            const elapsed = (Date.now() - startTime) / 1000;
            
            zoom += zoomSpeed * zoomDirection;
            
            if (zoom >= 4) {

            if (zoom <= 0.5) {

            }
            
            if (elapsed > 10) {

        }
