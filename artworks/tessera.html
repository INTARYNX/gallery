<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tessera — A Living Roman Mosaic</title>
<style>
  html,body{margin:0;height:100%;background:#000;display:flex;align-items:center;justify-content:center;}
  #wrap{position:relative;max-width:96vmin;max-height:96vmin;box-shadow:0 12px 50px rgba(0,0,0,.6);}
  #c{display:block;width:100%;height:100%;}
  /* vignettage en CSS : aucun coût JS, recalculé jamais */
  #wrap::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center,
      rgba(0,0,0,0) 42%, rgba(18,12,6,.34) 100%);}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
// résolution logique du dessin (les calculs se font dans cet espace)
const W=800,H=800;
// netteté rétina : le canvas physique = W*dpr, mais on dessine en coordonnées W
const DPR=Math.min(window.devicePixelRatio||1, 2.5);
cv.width=W*DPR; cv.height=H*DPR;
ctx.scale(DPR,DPR);

const COL={bg:'#d8c7a0',dark:'#2c2418',terra:'#9c6334',gold:'#c9a85f',cream:'#e9dcc0',red:'#7d4527',terra2:'#6f4426',ocre:'#bb8f4e',green2:'#7a7758'};

// ===== 1. MOTIF PROPRE (hors-écran) =====
const src=document.createElement('canvas');src.width=W;src.height=H;
const g=src.getContext('2d');g.lineCap='round';g.lineJoin='round';

g.fillStyle=COL.cream;g.fillRect(0,0,W,H);
g.fillStyle=COL.dark;g.fillRect(0,0,W,H);
g.fillStyle=COL.bg;g.fillRect(16,16,W-32,H-32);

// ---- GUILLOCHÉ : chaque côté est une tresse droite, et chaque coin
// reçoit un "œil d'angle" (carré encadré) qui masque proprement la jonction.
function ribbonOn(a,color,wid){
  g.strokeStyle=color;g.lineWidth=wid;
  g.beginPath();a.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.stroke();
  g.strokeStyle='rgba(255,255,255,.14)';g.lineWidth=wid*0.3;
  g.beginPath();a.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.stroke();
}

// tresse droite le long d'un segment horizontal ou vertical
// (cxL,cyL)=centre de bande au départ ; dir = {x,y} sens de parcours ;
// nrm = {x,y} normale ; len = longueur ; per,wid,amp,cols comme avant.
function straightBraid(sx,sy,dir,nrm,len,per,wid,amp,cols){
  const n=cols.length;
  function pts(phase,t0,t1){
    const a=[];
    for(let t=t0;t<=t1;t+=3){
      const off=Math.sin(t/per*Math.PI*2+phase)*amp;
      a.push({x:sx+dir.x*t+nrm.x*off, y:sy+dir.y*t+nrm.y*off});
    }
    return a;
  }
  for(let k=0;k<n;k++) ribbonOn(pts(k*2*Math.PI/n,0,len),cols[k],wid);
  for(let c=0;c<len;c+=per/2){
    let best=0,bv=-2;
    for(let k=0;k<n;k++){const v=Math.sin(c/per*Math.PI*2+k*2*Math.PI/n);if(v>bv){bv=v;best=k;}}
    ribbonOn(pts(best*2*Math.PI/n,Math.max(0,c-per*0.3),Math.min(len,c+per*0.3)),cols[best],wid);
  }
}

// œil d'angle : carré crème encadré de noir, avec un petit damier central
function cornerEye(cxc,cyc,size){
  const h=size/2;
  g.fillStyle=COL.cream;g.fillRect(cxc-h,cyc-h,size,size);
  // petit carré tourné au centre
  g.save();g.translate(cxc,cyc);g.rotate(Math.PI/4);
  g.fillStyle=COL.terra;g.fillRect(-h*0.42,-h*0.42,size*0.42,size*0.42);
  g.restore();
}

// bande complète : 4 côtés + 4 coins
function guilloche(rx0,ry0,rx1,ry1,bt,per,wid,cols){
  const axis=bt/2, amp=bt/2-wid*0.85;
  // fond crème de la bande
  g.fillStyle=COL.cream;
  g.fillRect(rx0,ry0,rx1-rx0,bt); g.fillRect(rx0,ry1-bt,rx1-rx0,bt);
  g.fillRect(rx0,ry0,bt,ry1-ry0); g.fillRect(rx1-bt,ry0,bt,ry1-ry0);

  // longueur utile d'un côté = entre les deux œils d'angle (de taille bt)
  const inX0=rx0+bt, inX1=rx1-bt, inY0=ry0+bt, inY1=ry1-bt;
  const lenH=inX1-inX0, lenV=inY1-inY0;
  // on cale un nombre entier de demi-périodes pour finir proprement aux coins
  const perH=lenH/Math.max(1,Math.round(lenH/per));
  const perV=lenV/Math.max(1,Math.round(lenV/per));

  // haut (gauche->droite)
  straightBraid(inX0,ry0+axis,{x:1,y:0},{x:0,y:1},lenH,perH,wid,amp,cols);
  // bas (gauche->droite)
  straightBraid(inX0,ry1-axis,{x:1,y:0},{x:0,y:1},lenH,perH,wid,amp,cols);
  // gauche (haut->bas)
  straightBraid(rx0+axis,inY0,{x:0,y:1},{x:1,y:0},lenV,perV,wid,amp,cols);
  // droite (haut->bas)
  straightBraid(rx1-axis,inY0,{x:0,y:1},{x:1,y:0},lenV,perV,wid,amp,cols);

  // œils d'angle par-dessus les jonctions
  cornerEye(rx0+axis,ry0+axis,bt);
  cornerEye(rx1-axis,ry0+axis,bt);
  cornerEye(rx0+axis,ry1-axis,bt);
  cornerEye(rx1-axis,ry1-axis,bt);
}

// bande externe : 2 brins
const PAD=24, BT=58;
guilloche(PAD,PAD,W-PAD,H-PAD, BT, 78, 16, [COL.terra,COL.gold]);
g.strokeStyle=COL.dark;g.lineWidth=4;
g.strokeRect(PAD,PAD,W-2*PAD,H-2*PAD);
g.strokeRect(PAD+BT,PAD+BT,W-2*(PAD+BT),H-2*(PAD+BT));

// bande interne : 4 brins (dense)
const PAD2=PAD+BT+14, BT2=60;
guilloche(PAD2,PAD2,W-PAD2,H-PAD2, BT2, 64, 14, [COL.terra,COL.gold,COL.red,COL.bg]);
g.strokeStyle=COL.dark;g.lineWidth=4;
g.strokeRect(PAD2,PAD2,W-2*PAD2,H-2*PAD2);
g.strokeRect(PAD2+BT2,PAD2+BT2,W-2*(PAD2+BT2),H-2*(PAD2+BT2));

// --- métadonnées des segments de bande, pour ANIMER les sinus analytiquement ---
const hex2rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function bandSegments(rx0,ry0,rx1,ry1,bt,per,wid,colsHex){
  const axis=bt/2, amp=bt/2-wid*0.85;
  const inX0=rx0+bt, inX1=rx1-bt, inY0=ry0+bt, inY1=ry1-bt;
  const lenH=inX1-inX0, lenV=inY1-inY0;
  const perH=lenH/Math.max(1,Math.round(lenH/per));
  const perV=lenV/Math.max(1,Math.round(lenV/per));
  const cols=colsHex.map(hex2rgb);
  return [
    {sx:inX0,sy:ry0+axis,dx:1,dy:0,nx:0,ny:1,len:lenH,per:perH,wid,amp,cols},
    {sx:inX0,sy:ry1-axis,dx:1,dy:0,nx:0,ny:1,len:lenH,per:perH,wid,amp,cols},
    {sx:rx0+axis,sy:inY0,dx:0,dy:1,nx:1,ny:0,len:lenV,per:perV,wid,amp,cols},
    {sx:rx1-axis,sy:inY0,dx:0,dy:1,nx:1,ny:0,len:lenV,per:perV,wid,amp,cols},
  ];
}
const SEGS=[
  ...bandSegments(PAD,PAD,W-PAD,H-PAD,BT,78,16,[COL.terra,COL.gold]),
  ...bandSegments(PAD2,PAD2,W-PAD2,H-PAD2,BT2,64,14,[COL.terra,COL.gold,COL.red,COL.bg]),
];

// couleur animée d'un point (px,py) s'il appartient à un brin, sinon null.
// On projette le point sur l'axe du segment (t = le long, off = en travers),
// puis on teste chaque brin sin(t/per*2π + k*2π/n + phase) : le brin le plus
// proche en "off" et assez près recouvre le point. phase fait défiler les sinus.
function braidColorAt(px,py,phase){
  for(let si=0;si<SEGS.length;si++){
    const s=SEGS[si];
    const t=(px-s.sx)*s.dx+(py-s.sy)*s.dy;
    if(t<0||t>s.len) continue;
    const off=(px-s.sx)*s.nx+(py-s.sy)*s.ny;
    if(Math.abs(off)>s.amp+s.wid) continue;
    const n=s.cols.length;
    let best=-1,bd=1e9;
    for(let k=0;k<n;k++){
      const so=Math.sin(t/s.per*Math.PI*2 + k*2*Math.PI/n + phase)*s.amp;
      const d=Math.abs(off-so);
      if(d<s.wid*0.75 && d<bd){bd=d;best=k;}
    }
    if(best>=0) return {col:s.cols[best], si, t, off};
  }
  return null;
}
// version rapide pour l'animation : segment, t, off déjà connus (mémoïsés).
function braidColorMemo(si,t,off,phase){
  const s=SEGS[si], n=s.cols.length, w2=t/s.per*Math.PI*2;
  let best=-1,bd=1e9;
  for(let k=0;k<n;k++){
    const so=Math.sin(w2 + k*2*Math.PI/n + phase)*s.amp;
    const d=Math.abs(off-so);
    if(d<s.wid*0.75 && d<bd){bd=d;best=k;}
  }
  return best>=0 ? s.cols[best] : null;
}

const cxp=W/2,cyp=H/2, R=(W/2-PAD2-BT2)-34, RW=24;
g.save();g.translate(cxp,cyp);
// fond clair du champ central
g.fillStyle=COL.cream;g.fillRect(-R-RW,-R-RW,2*(R+RW),2*(R+RW));

// deux anneaux (ellipses) entrelacés, dessinés par segments alternés
function ringSeg(rx,ry,a0,a1,color){
  const pts=[];
  for(let a=a0;a<=a1;a+=0.04)pts.push({x:Math.cos(a)*rx,y:Math.sin(a)*ry});
  g.strokeStyle=color;g.lineWidth=RW;
  g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.stroke();
}
const N=4;
for(let k=0;k<N;k++){
  const a0=k/N*Math.PI*2,a1=(k+1)/N*Math.PI*2;
  // alternance : aux quadrants pairs l'anneau horizontal passe dessus, sinon vertical
  if(k%2===0){ringSeg(R,R*0.7,a0,a1,COL.terra);ringSeg(R*0.7,R,a0,a1,COL.gold);}
  else        {ringSeg(R*0.7,R,a0,a1,COL.gold);ringSeg(R,R*0.7,a0,a1,COL.terra);}
}
// ---- canard central (fixe) ----
const DUCK_R=82;                       // rayon de la zone canard (servira à figer)
(function duck(){
  g.save();g.scale(1.7,1.7);
  // corps
  g.fillStyle=COL.terra;
  g.beginPath();g.ellipse(0,6,30,18,0.12,0,7);g.fill();
  // aile
  g.fillStyle=COL.terra2;
  g.beginPath();g.ellipse(-4,4,17,10,0.35,0,7);g.fill();
  // tête
  g.fillStyle=COL.ocre;
  g.beginPath();g.arc(24,-12,11,0,7);g.fill();
  // bec
  g.fillStyle=COL.gold;
  g.beginPath();g.moveTo(34,-12);g.lineTo(48,-9);g.lineTo(34,-6);g.closePath();g.fill();
  // œil
  g.fillStyle=COL.dark;
  g.beginPath();g.arc(27,-14,2.4,0,7);g.fill();
  // queue
  g.fillStyle=COL.green2;
  g.beginPath();g.moveTo(-28,2);g.lineTo(-47,-5);g.lineTo(-30,11);g.closePath();g.fill();
  // pattes + palmes (rapprochées, épaisses)
  g.strokeStyle=COL.gold;g.lineWidth=5;
  g.beginPath();g.moveTo(-2,22);g.lineTo(-3,34);g.moveTo(10,22);g.lineTo(11,34);g.stroke();
  g.fillStyle=COL.gold;
  // palme gauche
  g.beginPath();g.moveTo(-3,33);g.lineTo(-11,42);g.lineTo(-3,42);g.lineTo(4,42);g.closePath();g.fill();
  // palme droite
  g.beginPath();g.moveTo(11,33);g.lineTo(4,42);g.lineTo(11,42);g.lineTo(19,42);g.closePath();g.fill();
  g.restore();
})();
g.restore();

// ===== 2. FILTRE MOSAÏQUE — les tessères suivent les lignes =====
const data=g.getImageData(0,0,W,H).data;
const lum=new Float32Array(W*H);
for(let i=0,p=0;i<data.length;i+=4,p++)
  lum[p]=0.299*data[i]+0.587*data[i+1]+0.114*data[i+2];

function sample(x,y){x=Math.max(0,Math.min(W-1,x|0));y=Math.max(0,Math.min(H-1,y|0));
  const i=(y*W+x)*4;return[data[i],data[i+1],data[i+2]];}
const L=(x,y)=>lum[Math.min(H-1,Math.max(0,y|0))*W+Math.min(W-1,Math.max(0,x|0))];

// rayon du disque médaillon (rempli plus bas via setMedRadius)
let MED_RAD=0;
// échantillonne le DESSIN SOURCE en tournant le point autour du centre d'un
// angle 'a'. La forme du nœud reste exactement celle d'origine, elle pivote.
function sampleRot(x,y,a){
  const dx=x-W/2, dy=y-H/2;
  const c=Math.cos(a), s=Math.sin(a);
  return sample(W/2 + dx*c - dy*s, H/2 + dx*s + dy*c);
}

// direction locale = tangente au contour (perpendiculaire au gradient Sobel).
// Si pas de contour, on suit des cercles concentriques autour du centre
// (le fond d'un médaillon romain rayonne autour du motif).
const cxF=W/2, cyF=H/2;
// gradient brut
function gradAt(x,y){
  const gx=(L(x+1,y-1)+2*L(x+1,y)+L(x+1,y+1))-(L(x-1,y-1)+2*L(x-1,y)+L(x-1,y+1));
  const gy=(L(x-1,y+1)+2*L(x,y+1)+L(x+1,y+1))-(L(x-1,y-1)+2*L(x,y-1)+L(x+1,y-1));
  return [gx,gy];
}
// tenseur de structure lissé sur un voisinage : donne une orientation stable
// même là où deux contours perpendiculaires se croisent (les coins).
function direction(x,y){
  let Jxx=0,Jyy=0,Jxy=0;
  const RAD=3;
  for(let dy=-RAD;dy<=RAD;dy++)for(let dx=-RAD;dx<=RAD;dx++){
    const [gx,gy]=gradAt(x+dx*2,y+dy*2);
    Jxx+=gx*gx; Jyy+=gy*gy; Jxy+=gx*gy;
  }
  const mag=Math.sqrt(Jxx+Jyy);
  if(mag>120){
    // orientation dominante du tenseur (vecteur propre) -> direction du contour
    const theta=0.5*Math.atan2(2*Jxy,Jxx-Jyy);
    return theta+Math.PI/2; // tangente au contour : on aligne les tessères dessus
  }
  // fond uni : concentrique seulement dans le disque, droit ailleurs
  const d=Math.hypot(x-cxF,y-cyF);
  if(d<R){
    const wConc=Math.min(1,(R-d)/R);
    const angConc=Math.atan2(y-cyF,x-cxF)+Math.PI/2;
    const ix=wConc*Math.cos(angConc)+(1-wConc);
    const iy=wConc*Math.sin(angConc);
    return Math.atan2(iy,ix);
  }
  return 0;
}

const clamp=v=>v<0?0:v>255?255:v|0;
function vary([r,gg,b]){
  const d=(Math.random()*2-1)*16;                 // luminosité
  const hr=(Math.random()*2-1)*8, hb=(Math.random()*2-1)*8; // léger décalage chaud/froid
  return[clamp(r+d+hr),clamp(gg+d),clamp(b+d-hb)];}
const colDist=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])+Math.abs(a[2]-b[2]);

const ROW=7;

// chaque tesselle est PRÉ-CALCULÉE une fois : forme (liste de sommets locaux),
// position, angle, couleur de base.
const tiles=[];

MED_RAD=R+RW;
function addTile(x,y,ang,baseCol,verts){
  const bm = braidColorAt(x,y,0);
  const onStrand = bm!==null;
  const dc=Math.hypot(x-W/2,y-H/2);
  const rInner=R*0.7-RW, rOuter=R+RW;
  const onRing = !onStrand && dc>Math.max(DUCK_R,rInner) && dc<rOuter;
  const t={x,y,ang,col:vary(baseCol),verts,onStrand,onRing};
  if(onStrand){ t.bg=vary(hex2rgb(COL.cream)); t.si=bm.si; t.bt=bm.t; t.boff=bm.off; }
  tiles.push(t);
}

// ===== PLACEMENT VORONOÏ JITTERÉ =====
// Au lieu de poser des carrés rigides (qui se chevauchent ou laissent des
// trous quand ils tournent), on construit un diagramme de Voronoï : un centre
// par cellule de grille, légèrement déplacé (jitter). La cellule de Voronoï de
// chaque centre PAVE le plan exactement — pas de trou, pas d'overlap, par
// construction. On l'obtient en partant d'un grand carré et en le coupant par
// la bissectrice (demi-plan) de chaque voisin proche. Puis on érode la cellule
// vers son centre pour ménager le joint de mortier.
const SITE=ROW;                                  // pas de la grille de centres
const SGW=Math.ceil(W/SITE)+2, SGH=Math.ceil(H/SITE)+2;
const sites=[];                                  // {x,y} par cellule de grille
const JIT=SITE*0.34;                             // amplitude du jitter des centres
for(let gy=-1; gy<SGH-1; gy++){
  for(let gx=-1; gx<SGW-1; gx++){
    sites.push({
      x:(gx+0.5)*SITE + (Math.random()*2-1)*JIT,
      y:(gy+0.5)*SITE + (Math.random()*2-1)*JIT,
      gx,gy
    });
  }
}
const siteAt=(gx,gy)=>{
  if(gx<-1||gy<-1||gx>=SGW-1||gy>=SGH-1) return null;
  return sites[(gy+1)*SGW+(gx+1)];
};

// clip d'un polygone (liste de [x,y]) par le demi-plan { p : (p-m)·nrm <= 0 }
// (Sutherland–Hodgman pour un seul demi-plan). m = point sur la droite.
function clipHalf(poly, mx, my, nx, ny){
  const out=[];
  const side=p=>(p[0]-mx)*nx+(p[1]-my)*ny;       // <=0 : on garde
  for(let i=0;i<poly.length;i++){
    const a=poly[i], b=poly[(i+1)%poly.length];
    const sa=side(a), sb=side(b);
    if(sa<=0) out.push(a);
    if((sa<0&&sb>0)||(sa>0&&sb<0)){
      const t=sa/(sa-sb);
      out.push([a[0]+t*(b[0]-a[0]), a[1]+t*(b[1]-a[1])]);
    }
  }
  return out;
}

// cellule de Voronoï du site s : carré initial ±SITE*1.5, coupé par la
// bissectrice de chaque voisin dans un rayon de 2 cases.
function voronoiCell(s){
  const R0=SITE*1.6;
  let poly=[[s.x-R0,s.y-R0],[s.x+R0,s.y-R0],[s.x+R0,s.y+R0],[s.x-R0,s.y+R0]];
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
    if(!dx&&!dy) continue;
    const o=siteAt(s.gx+dx, s.gy+dy);
    if(!o) continue;
    // bissectrice : milieu des deux centres, normale = direction vers le voisin.
    const mx=(s.x+o.x)/2, my=(s.y+o.y)/2;
    let nx=o.x-s.x, ny=o.y-s.y;
    const L=Math.hypot(nx,ny)||1; nx/=L; ny/=L;
    poly=clipHalf(poly, mx,my, nx,ny);
    if(poly.length<3) break;
  }
  return poly;
}

// érode le polygone vers le centre (x,y) d'une fraction k -> joint de mortier.
function erode(poly, cx, cy, k){
  return poly.map(p=>[cx+(p[0]-cx)*k, cy+(p[1]-cy)*k]);
}

// ---- construction des tesselles ----
const JOINT=0.84;                                // 1 = pas de joint ; <1 érode
for(const s of sites){
  if(s.x<0||s.x>=W||s.y<0||s.y>=H) continue;
  let cell=voronoiCell(s);
  if(cell.length<3) continue;
  cell=erode(cell, s.x, s.y, JOINT);
  // sommets en repère LOCAL (la forme encode déjà l'orientation -> ang=0)
  const verts=cell.map(p=>[p[0]-s.x, p[1]-s.y]);
  addTile(s.x, s.y, 0, sample(s.x,s.y), verts);
}

// ---- helper commun : dessine UNE tesselle en PÂTE DE VERRE ----
// Modèle d'éclairage simple, lumière fixe venant du haut-gauche (dans le
// repère LOCAL de la tuile, donc les biseaux suivent l'orientation de la
// pierre). On peint : 1) la couleur de base, 2) un biseau CLAIR sur les deux
// arêtes face à la lumière, 3) un biseau SOMBRE sur les deux arêtes à l'ombre,
// 4) un point spéculaire net (petit quadrilatère blanc translucide) près du
// coin éclairé. Les arêtes sont tracées en lineJoin:'miter' pour rester nettes.
function shade(col,k){ return [clamp(col[0]+k),clamp(col[1]+k),clamp(col[2]+k)]; }
function rgb(c){ return `rgb(${c[0]},${c[1]},${c[2]})`; }
function paintTile(c2d, tl, col){
  const v=tl.verts, n=v.length;
  c2d.save();c2d.translate(tl.x,tl.y);
  if(tl.ang) c2d.rotate(tl.ang);
  // 1) corps
  c2d.lineJoin='miter';
  c2d.fillStyle=rgb(col);
  c2d.beginPath();
  v.forEach((p,i)=>i?c2d.lineTo(p[0],p[1]):c2d.moveTo(p[0],p[1]));
  c2d.closePath();c2d.fill();

  // 2+3) biseaux par arête : éclaircis l'arête dont la normale EXTÉRIEURE
  // pointe vers la lumière, assombris l'arête opposée. Lumière locale =
  // haut-gauche (-1,-1). Le signe de l'aire donne le sens d'enroulement, donc
  // la vraie normale extérieure quel que soit l'ordre des sommets Voronoï.
  let area=0;
  for(let i=0;i<n;i++){const a=v[i],b=v[(i+1)%n];area+=a[0]*b[1]-b[0]*a[1];}
  const wind=area<0?1:-1;                   // oriente la normale vers l'extérieur
  const LX=-0.7071, LY=-0.7071;
  c2d.lineWidth=Math.max(0.6, ROW*0.11);
  c2d.lineCap='butt';
  for(let i=0;i<n;i++){
    const a=v[i], b=v[(i+1)%n];
    const ex=b[0]-a[0], ey=b[1]-a[1];
    const len=Math.hypot(ex,ey)||1;
    let nx=wind*ey/len, ny=-wind*ex/len;     // normale extérieure
    const d=nx*LX+ny*LY;                     // >0 : arête éclairée
    if(Math.abs(d)<0.12) continue;           // arête rasante : pas de biseau franc
    const k=d>0 ? 90*d : 95*d;               // arête éclairée + vive, ombre marquée
    c2d.strokeStyle=rgb(shade(col,k));
    c2d.beginPath();c2d.moveTo(a[0],a[1]);c2d.lineTo(b[0],b[1]);c2d.stroke();
  }

  c2d.restore();
}

// ---- CALQUE STATIQUE : toutes les tesselles fixes, rendues UNE seule fois ----
// On le rend en SURÉCHANTILLONNAGE (SS×) : sa résolution interne couvre le zoom
// max de la caméra, donc une fois agrandi par drawImage il reste net au lieu de
// flouter (le flou venait de l'étirement bilinéaire d'un calque à résolution 1×).
const SS=4.5;                                  // ≥ zoom max des POIs (3.4), marge nette
const stat=document.createElement('canvas'); stat.width=W*SS; stat.height=H*SS;
const sctx=stat.getContext('2d'); sctx.scale(SS,SS);
// fond mortier (joints clairs, visible entre les pierres)
sctx.fillStyle='#7d7363'; sctx.fillRect(0,0,W,H);
const animated=[];
for(const tl of tiles){
  if(tl.hide) continue;
  tl.shine = Math.random()<0.18;             // ~18% des pierres ont un éclat
  paintTile(sctx, tl, tl.col);               // TOUTES peintes au statique (base)
  if(tl.onStrand || tl.onRing) animated.push(tl); // animées : redessinées dessus
}

// ===== 3. CAMÉRA — zooms sur les points d'intérêt =====
// Chaque cible = {x,y,z} : centre visé (coords mosaïque) + facteur de zoom.
// La caméra interpole de cible en cible avec un easing doux, marque une pause,
// puis enchaîne. Les transformations sont appliquées au contexte avant le rendu,
// donc tout le pipeline existant (statique + animé) est zoomé tel quel.
const half=BT/2+PAD;                          // centre approx d'un œil d'angle externe
const POIS=[
  {x:W/2, y:H/2,        z:1.0, hold:2600, name:'full'},     // vue d'ensemble
  {x:W/2, y:H/2,        z:3.1, hold:3000, name:'duck'},     // le canard
  {x:W/2, y:H/2-R*0.85, z:2.5, hold:2400, name:'ring-top'}, // croisement d'anneaux
  {x:half, y:half,      z:3.4, hold:2400, name:'corner-nw'},// œil d'angle haut-gauche
  {x:W/2, y:half,       z:3.0, hold:2200, name:'braid-top'},// tresse du bord haut
  {x:W-half, y:H-half,  z:3.4, hold:2400, name:'corner-se'},// œil d'angle bas-droite
  {x:W/2+R*0.85, y:H/2, z:2.5, hold:2400, name:'ring-right'},
];
const TRAVEL=2200;                            // durée d'un déplacement (ms)
let poiIdx=0;
let camFrom={x:W/2,y:H/2,z:1}, camTo=POIS[0];
let segStart=performance.now(), moving=true;
const easeInOut=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function camAt(now){
  const dur = moving?TRAVEL:camTo.hold;
  let p=(now-segStart)/dur;
  if(p>=1){
    if(moving){ moving=false; segStart=now; p=0; }
    else{ // fin de la pause -> prochaine cible
      moving=true; segStart=now; p=0;
      camFrom={x:camTo.x,y:camTo.y,z:camTo.z};
      poiIdx=(poiIdx+1)%POIS.length;
      camTo=POIS[poiIdx];
    }
  }
  if(!moving) return camTo;                   // immobile pendant la pause
  const e=easeInOut(Math.min(1,p));
  return {
    x:camFrom.x+(camTo.x-camFrom.x)*e,
    y:camFrom.y+(camTo.y-camFrom.y)*e,
    z:camFrom.z+(camTo.z-camFrom.z)*e,
  };
}

// ---- RENDU + ANIMATION ----
// On applique la transformation caméra (échelle z centrée sur cam.x,cam.y),
// puis on reblit le calque statique et on redessine les tesselles animées.
// Une marge (overscan) garantit qu'aucun bord vide n'apparaît au zoom.
function frame(ts){
  const cam=camAt(ts);
  // empêche la caméra de sortir de la mosaïque : on borne le centre visé pour
  // que la fenêtre visible (demi-largeur W/(2z)) reste entièrement dans [0,W].
  // Sans ça, en zoom de coin on voyait le bord du canvas source étiré (marches).
  const hx=W/(2*cam.z), hy=H/(2*cam.z);
  const cx=Math.max(hx, Math.min(W-hx, cam.x));
  const cy=Math.max(hy, Math.min(H-hy, cam.y));
  // hors-canvas / bords : tout en noir avant de dessiner la scène zoomée
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,W,H);
  ctx.save();
  // clip strict à la zone visible : rien ne déborde sur les bords
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  // recentre la cible au milieu de l'écran puis applique le zoom
  ctx.translate(W/2, H/2);
  ctx.scale(cam.z, cam.z);
  ctx.translate(-cx, -cy);

  ctx.drawImage(stat,0,0,W,H);                // décor fixe (zoomé)
  const phase=ts*0.0016;
  for(const tl of animated){
    let col;
    if(tl.onStrand){
      const c=braidColorMemo(tl.si,tl.bt,tl.boff,phase);
      col = c ? vary2(c,tl) : (tl.bg||tl.col);
    } else {
      col = vary2(sampleRot(tl.x,tl.y, phase*0.25), tl);
    }
    paintTile(ctx, tl, col);
  }
  ctx.restore();
  requestAnimationFrame(frame);
}
function vary2(c,tl){
  if(tl._d===undefined) tl._d=(Math.random()*2-1)*12;
  return [clamp(c[0]+tl._d),clamp(c[1]+tl._d),clamp(c[2]+tl._d)];
}
requestAnimationFrame(frame);

</script>
