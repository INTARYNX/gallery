<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Recurrence</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0815; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  .stage {
    width: min(90vw, 90vh);
    height: min(90vw, 90vh);
    position: relative;
    background: #000;
    box-shadow: 0 20px 80px rgba(120, 80, 255, 0.2);
    overflow: hidden;
  }
  .frame { position: absolute; inset: 0; display: flex; justify-content: center; align-items: stretch; z-index: 2; }
  .inner { position: relative; height: 100%; aspect-ratio: 5 / 9; max-width: 100%; }
  canvas { display: block; width: 100%; height: 100%; }
  .vhs {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="stage">
  <canvas class="vhs" id="vhs"></canvas>
  <div class="frame"><div class="inner"><canvas id="c"></canvas></div></div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = canvas.clientWidth;
  H = canvas.clientHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// --- Custom palette ---
// #E63946 terracotta · #F4A261 ocre · #E9C46A moutarde
// #2A9D8F émeraude · #264653 bleu nuit · #F1FAEE blanc cassé · #1D1D1D noir
const palette = {
  ceilings:  ['#264653', '#E9C46A', '#2A9D8F', '#E63946', '#F4A261', '#1D1D1D'],
  walls_L:   ['#264653', '#E9C46A', '#E63946', '#F4A261', '#2A9D8F', '#1D1D1D'],
  walls_R:   ['#2A9D8F', '#E63946', '#E9C46A', '#F1FAEE', '#264653', '#F4A261'],
};

const floorStripes = [
  '#F1FAEE', '#E9C46A', '#2A9D8F', '#F4A261', '#E63946',
  '#264653', '#F1FAEE', '#E9C46A', '#F4A261', '#2A9D8F'
];

const lightColors = [
  '#F1FAEE', '#F4A261', '#E9C46A'
];

const jambColors = [
  '#E9C46A', '#F4A261', '#E63946', '#F1FAEE', '#2A9D8F'
];

function rand(seed) {
  const x = Math.sin(seed * 9301 + 49297) * 233280;
  return x - Math.floor(x);
}
function pickStripe(seed) { return floorStripes[Math.floor(rand(seed) * floorStripes.length)]; }
function pickLight(seed)  { return lightColors[Math.floor(rand(seed) * lightColors.length)]; }
function pickJamb(seed)   { return jambColors[Math.floor(rand(seed) * jambColors.length)]; }

function shade(hex, amount) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  const t = amount < 0 ? 0 : 255;
  const p = Math.abs(amount);
  const nr = Math.round((t - r) * p) + r;
  const ng = Math.round((t - g) * p) + g;
  const nb = Math.round((t - b) * p) + b;
  return `rgb(${nr},${ng},${nb})`;
}

// --- Perspective ---
const FOCAL = 0.9;
const ROOM_HALF_W = 0.65;
const ROOM_HALF_H = 1.0;
const SEG_LEN = 0.7;
const VISIBLE_SEGMENTS = 40;
const Z_NEAR = 0.1;

function vp() {
  // Doom-style head bob: vertical bounce + slight horizontal sway
  // Tied to camera distance so bob frequency matches walking pace.
  const t = cameraZ * 5; // step frequency
  const bobY = Math.abs(Math.sin(t)) * H * 0.015;       // up-down
  const bobX = Math.sin(t * 0.5) * W * 0.008;           // side-to-side
  return { x: W * 0.5 + bobX, y: H * 0.42 + bobY };
}

function project(x, y, z) {
  const zc = Math.max(z, Z_NEAR);
  const { x: vx, y: vy } = vp();
  const k = (FOCAL / zc) * (H * 0.46);
  return { x: vx + x * k, y: vy - y * k };
}

function drawQuad(p1, p2, p3, p4, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(p1.x, p1.y);
  ctx.lineTo(p2.x, p2.y);
  ctx.lineTo(p3.x, p3.y);
  ctx.lineTo(p4.x, p4.y);
  ctx.closePath();
  ctx.fill();
}

// --- Segment rendering ---
function drawSegment(zNear, zFar, segIndex, isLast) {
  const idx = ((segIndex % palette.ceilings.length) + palette.ceilings.length) % palette.ceilings.length;

  const nTL = project(-ROOM_HALF_W,  ROOM_HALF_H, zNear);
  const nTR = project( ROOM_HALF_W,  ROOM_HALF_H, zNear);
  const nBR = project( ROOM_HALF_W, -ROOM_HALF_H, zNear);
  const nBL = project(-ROOM_HALF_W, -ROOM_HALF_H, zNear);
  const fTL = project(-ROOM_HALF_W,  ROOM_HALF_H, zFar);
  const fTR = project( ROOM_HALF_W,  ROOM_HALF_H, zFar);
  const fBR = project( ROOM_HALF_W, -ROOM_HALF_H, zFar);
  const fBL = project(-ROOM_HALF_W, -ROOM_HALF_H, zFar);

  drawQuad(nTL, nTR, fTR, fTL, palette.ceilings[idx]);
  drawQuad(nTL, fTL, fBL, nBL, palette.walls_L[idx]);
  drawQuad(nTR, fTR, fBR, nBR, palette.walls_R[idx]);

  // Floor: two stripes L/R with off-center split
  const stripeColA = pickStripe(segIndex * 13 + 7);
  const stripeColB = pickStripe(segIndex * 13 + 41);
  const splitX = (rand(segIndex * 17 + 3) - 0.5) * 1.2;
  const nBM = project(splitX, -ROOM_HALF_H, zNear);
  const fBM = project(splitX, -ROOM_HALF_H, zFar);
  drawQuad(nBL, fBL, fBM, nBM, stripeColA);
  drawQuad(nBM, fBM, fBR, nBR, stripeColB);

  drawDoor('L', zNear, zFar, segIndex);
  drawDoor('R', zNear, zFar, segIndex);

  if (isLast) {
    drawQuad(fTL, fTR, fBR, fBL, '#5a4a4a');
    const doorHalfW = ROOM_HALF_W * 0.28;
    const doorTopY = 0.45;
    const doorBotY = -ROOM_HALF_H;
    const dTL = project(-doorHalfW, doorTopY, zFar);
    const dTR = project( doorHalfW, doorTopY, zFar);
    const dBR = project( doorHalfW, doorBotY, zFar);
    const dBL = project(-doorHalfW, doorBotY, zFar);
    drawQuad(dTL, dTR, dBR, dBL, '#000');
  }
}

function drawDoor(side, zNear, zFar, segSeed) {
  const segLen = zFar - zNear;
  const doorWidth = 0.2;
  const t0 = 0.5 - doorWidth / 2;
  const t1 = 0.5 + doorWidth / 2;

  const topY = 0.5;
  const botY = -ROOM_HALF_H;
  const wallX = side === 'L' ? -ROOM_HALF_W : ROOM_HALF_W;
  const WALL_THICKNESS = 0.35;
  const innerWallX = side === 'L' ? wallX - WALL_THICKNESS : wallX + WALL_THICKNESS;

  const seed = segSeed * 31 + (side === 'L' ? 100 : 200);
  const z0 = zNear + segLen * t0;
  const z1 = zNear + segLen * t1;

  // Light spill on the floor
  const lightCol = pickLight(seed + 3);
  const spillFarX = side === 'L' ? ROOM_HALF_W * 0.85 : -ROOM_HALF_W * 0.85;
  const l1 = project(wallX,     -ROOM_HALF_H, z0);
  const l2 = project(wallX,     -ROOM_HALF_H, z1);
  const l3 = project(spillFarX, -ROOM_HALF_H, z1);
  const l4 = project(spillFarX, -ROOM_HALF_H, z0);
  drawQuad(l1, l2, l3, l4, lightCol);

  const nTop0 = project(wallX, topY, z0);
  const nTop1 = project(wallX, topY, z1);
  const nBot1 = project(wallX, botY, z1);
  const nBot0 = project(wallX, botY, z0);
  const iTop0 = project(innerWallX, topY, z0);
  const iTop1 = project(innerWallX, topY, z1);
  const iBot1 = project(innerWallX, botY, z1);
  const iBot0 = project(innerWallX, botY, z0);

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(nTop0.x, nTop0.y);
  ctx.lineTo(nTop1.x, nTop1.y);
  ctx.lineTo(nBot1.x, nBot1.y);
  ctx.lineTo(nBot0.x, nBot0.y);
  ctx.closePath();
  ctx.clip();

  // Dark back plane
  drawQuad(iTop0, iTop1, iBot1, iBot0, '#1a1820');

  // Jambs: LEFT = light colored, RIGHT = dark
  const isLeft = side === 'L';
  const jambCol = isLeft ? pickJamb(seed + 7) : '#1a1820';
  drawQuad(nTop0, iTop0, iBot0, nBot0, jambCol);
  drawQuad(nTop1, iTop1, iBot1, nBot1, jambCol);
  drawQuad(nTop0, nTop1, iTop1, iTop0, jambCol);

  ctx.restore();
}

// ✨ Modern touch: subtle atmospheric gradient overlay (vignette + cool cast)
function drawAtmosphere() {
  const g = ctx.createRadialGradient(W / 2, H * 0.42, H * 0.2, W / 2, H * 0.42, H * 0.85);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(10, 8, 30, 0.5)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// Organic paint-like noise — clustered blotches, no smooth gradients
function drawGrain(amount = 0.12) {
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    // Strong per-pixel pigment variation
    const n = (Math.random() - 0.5) * 255 * amount;
    d[i]   = Math.max(0, Math.min(255, d[i]   + n));
    d[i+1] = Math.max(0, Math.min(255, d[i+1] + n * 0.9));
    d[i+2] = Math.max(0, Math.min(255, d[i+2] + n * 0.8));
  }
  ctx.putImageData(img, 0, 0);
}

// Irregular paint blotches — scattered semi-transparent spots
function drawPaintBlotches() {
  ctx.save();
  for (let i = 0; i < 400; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H;
    const r = 0.5 + Math.random() * 2.5;
    const dark = Math.random() > 0.5;
    ctx.fillStyle = dark ? `rgba(29,29,29,${0.05 + Math.random() * 0.12})`
                         : `rgba(241,250,238,${0.04 + Math.random() * 0.1})`;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// Canvas weave — fine cross-hatched threads (still subtle, no gradient)
function drawCanvasWeave() {
  ctx.save();
  ctx.globalAlpha = 0.07;
  ctx.strokeStyle = '#1D1D1D';
  ctx.lineWidth = 0.4;
  for (let y = 0; y < H; y += 2) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  ctx.globalAlpha = 0.04;
  for (let x = 0; x < W; x += 3) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  ctx.restore();
}

// Short rough brush strokes — irregular, varied length and opacity
function drawBrushMarks() {
  ctx.save();
  for (let i = 0; i < 150; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H;
    const len = 3 + Math.random() * 14;
    const angle = (Math.random() - 0.5) * 0.4;
    const dark = Math.random() > 0.5;
    ctx.globalAlpha = 0.03 + Math.random() * 0.08;
    ctx.strokeStyle = dark ? '#1D1D1D' : '#F1FAEE';
    ctx.lineWidth = 0.4 + Math.random() * 0.9;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(angle) * len, y + Math.sin(angle) * len);
    ctx.stroke();
  }
  ctx.restore();
}

// --- VHS noise on the black side bars ---
const vhsCanvas = document.getElementById('vhs');
const vhsCtx = vhsCanvas.getContext('2d');
let VW, VH;
function resizeVhs() {
  const dpr = window.devicePixelRatio || 1;
  VW = vhsCanvas.clientWidth;
  VH = vhsCanvas.clientHeight;
  vhsCanvas.width = VW * dpr;
  vhsCanvas.height = VH * dpr;
  vhsCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeVhs);
resizeVhs();

// Track current VHS rolling-bar Y position, shared with the corridor glitch
let vhsTrackY = 0;

function drawVHS() {
  const img = vhsCtx.createImageData(vhsCanvas.width, vhsCanvas.height);
  const d = img.data;
  const w = vhsCanvas.width;
  const h = vhsCanvas.height;

  // Horizontal tracking line that drifts over time
  const trackLine = ((performance.now() * 0.12) % h) | 0;
  // Expose in CSS-pixel coordinates for the corridor glitch
  vhsTrackY = trackLine / (window.devicePixelRatio || 1);

  for (let y = 0; y < h; y++) {
    // Slight horizontal band variation (makes bands flicker)
    const bandFlicker = Math.random() > 0.995 ? 80 : 0;
    // Distance from tracking line for a brighter distortion band
    const trackDist = Math.abs(y - trackLine);
    const trackGlow = trackDist < 20 ? (20 - trackDist) * 3 : 0;

    for (let x = 0; x < w; x++) {
      // Base noise
      const n = Math.random() * 255;
      // Occasional horizontal dropouts
      const dropout = Math.random() > 0.998 ? 200 : 0;

      const val = Math.min(255, n * 0.25 + bandFlicker * 0.4 + trackGlow * 0.5 + dropout * 0.5);
      const i = (y * w + x) * 4;

      // Slight chromatic tint (cool grey-blue with warm speckle)
      d[i]     = val * 0.9;
      d[i + 1] = val;
      d[i + 2] = val * 1.1;
      d[i + 3] = 255;
    }
  }
  vhsCtx.putImageData(img, 0, 0);

  // Scanlines overlay
  vhsCtx.save();
  vhsCtx.globalAlpha = 0.25;
  vhsCtx.fillStyle = '#000';
  for (let y = 0; y < VH; y += 2) {
    vhsCtx.fillRect(0, y, VW, 1);
  }
  vhsCtx.restore();
}

// Image glitch on the corridor aligned with the VHS rolling bar.
// We copy a horizontal band from the corridor canvas and draw it back
// shifted horizontally + with a chromatic offset, mimicking tape tearing.
function drawCorridorGlitch() {
  // The inner canvas has its own CSS size; compute the tracking Y in its space.
  const innerRect = canvas.getBoundingClientRect();
  const outerRect = vhsCanvas.getBoundingClientRect();
  const yInInner = vhsTrackY - (innerRect.top - outerRect.top);
  if (yInInner < 0 || yInInner > H) return;

  const bandH = 18;
  const y = Math.max(0, yInInner - bandH / 2);

  // Snapshot the band
  const dpr = window.devicePixelRatio || 1;
  const band = ctx.getImageData(0, y * dpr, canvas.width, bandH * dpr);

  // Clear & redraw with a horizontal shift
  ctx.save();
  const shift = (Math.sin(performance.now() * 0.01) * 6 + (Math.random() - 0.5) * 3) | 0;

  // Main shifted copy
  ctx.clearRect(0, y, W, bandH);
  ctx.putImageData(band, shift * dpr, y * dpr);

  // Red channel shift (chromatic aberration)
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = 0.45;
  ctx.fillStyle = 'rgba(255, 40, 40, 0.6)';
  ctx.fillRect(shift - 3, y, W, bandH);

  // Cyan channel shift
  ctx.fillStyle = 'rgba(40, 220, 255, 0.4)';
  ctx.fillRect(shift + 3, y, W, bandH);

  ctx.restore();

  // Thin bright scanline right at the tracking line
  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = '#F1FAEE';
  ctx.fillRect(0, yInInner - 0.5, W, 1);
  ctx.restore();
}

function vhsLoop() {
  drawVHS();
  requestAnimationFrame(vhsLoop);
}
vhsLoop();

// --- Animation ---
const SPEED = 0.001;
let cameraZ = 0;
let lastT = performance.now();

function draw(t) {
  const dt = t - lastT;
  lastT = t;
  cameraZ += SPEED * dt;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0b1020';
  ctx.fillRect(0, 0, W, H);

  const currentSeg = Math.floor(cameraZ / SEG_LEN);

  for (let i = VISIBLE_SEGMENTS; i >= 0; i--) {
    const segIndex = currentSeg + i;
    const worldNear = segIndex * SEG_LEN;
    const worldFar  = (segIndex + 1) * SEG_LEN;
    const zNear = worldNear - cameraZ;
    const zFar  = worldFar  - cameraZ;
    if (zFar <= Z_NEAR) continue;
    const isLast = (i === VISIBLE_SEGMENTS);
    drawSegment(Math.max(zNear, Z_NEAR), zFar, segIndex, isLast);
  }

  drawAtmosphere();
  drawCanvasWeave();
  drawGrain(0.06);
  drawCorridorGlitch();
  requestAnimationFrame(draw);
}

requestAnimationFrame((t) => { lastT = t; draw(t); });
</script>
</body>
</html>
