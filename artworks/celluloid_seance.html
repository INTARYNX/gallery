<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
  <title>Celluloid Seance</title>

<style>
body { margin:0; background:#0a0a0a; overflow:hidden; display:flex; align-items:center; justify-content:center; min-height:100vh }
canvas { display:block }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let w,h;

function resize(){
  const size = Math.min(innerWidth, innerHeight);
  w = canvas.width = size;
  h = canvas.height = size;
}
addEventListener("resize", resize);
resize();

function createFilmReel(radius) {
  const size = radius * 3;
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  const cx = size / 2;

  // === DARK FILM COIL (background, visible through cutouts) ===
  g.save();
  g.translate(cx, cx);
  
  // Base black film coil - covers full reel area
  g.fillStyle = '#0a0a0a';
  g.beginPath();
  g.arc(0, 0, radius * 0.7, 0, Math.PI * 2);
  g.fill();
  
  // Concentric film coil rings
  const coilLayers = 50;
  for(let i = 0; i < coilLayers; i++) {
    const r = radius * 0.22 + (radius * 0.46) * (i / coilLayers);
    const alpha = 0.3 + (i % 3) * 0.15;
    g.strokeStyle = `rgba(0,0,0,${alpha})`;
    g.lineWidth = 0.8;
    g.beginPath();
    g.arc(0, 0, r, 0, Math.PI * 2);
    g.stroke();
  }
  
  g.restore();

  // === ALUMINUM REEL FRAME ===
  g.save();
  g.translate(cx, cx);
  
  // Outer rim - flat aluminum tone (no directional gradient since it'll rotate)
  g.fillStyle = '#a8a8a8';
  g.beginPath();
  g.arc(0, 0, radius, 0, Math.PI * 2);
  g.arc(0, 0, radius * 0.7, 0, Math.PI * 2, true);
  g.fill();
  
  g.strokeStyle = 'rgba(0,0,0,0.4)';
  g.lineWidth = 1;
  g.beginPath();
  g.arc(0, 0, radius, 0, Math.PI * 2);
  g.stroke();
  
  g.strokeStyle = 'rgba(0,0,0,0.5)';
  g.lineWidth = 1;
  g.beginPath();
  g.arc(0, 0, radius * 0.7, 0, Math.PI * 2);
  g.stroke();
  
  g.restore();

  // === 5 THICK ALUMINUM SPOKES (drawn as solid disc with rounded cutouts) ===
  const spokes = 5;
  g.save();
  g.translate(cx, cx);
  
  const discInner = radius * 0.22;
  const discOuter = radius * 0.7;
  
  // Flat aluminum tone for the disc
  g.fillStyle = '#b0b0b0';
  g.beginPath();
  
  g.moveTo(discOuter, 0);
  g.arc(0, 0, discOuter, 0, Math.PI * 2);
  
  g.moveTo(discInner, 0);
  g.arc(0, 0, discInner, 0, Math.PI * 2, true);
  
  for(let i = 0; i < spokes; i++) {
    const baseAngle = (Math.PI * 2 / spokes) * i - Math.PI / 2 + Math.PI / spokes;
    const openInner = radius * 0.32;
    const openOuter = radius * 0.62;
    const openHalfAngle = Math.PI / spokes * 0.7;
    
    const a1 = baseAngle - openHalfAngle;
    const a2 = baseAngle + openHalfAngle;
    
    g.moveTo(Math.cos(a1) * openInner, Math.sin(a1) * openInner);
    g.arc(0, 0, openInner, a1, a2);
    g.arc(0, 0, openOuter, a2, a1, true);
    g.closePath();
  }
  
  g.fill('evenodd');
  
  // Edge shadows around the openings
  for(let i = 0; i < spokes; i++) {
    const baseAngle = (Math.PI * 2 / spokes) * i - Math.PI / 2 + Math.PI / spokes;
    const openInner = radius * 0.32;
    const openOuter = radius * 0.62;
    const openHalfAngle = Math.PI / spokes * 0.7;
    
    const a1 = baseAngle - openHalfAngle;
    const a2 = baseAngle + openHalfAngle;
    
    g.strokeStyle = 'rgba(0,0,0,0.6)';
    g.lineWidth = 1;
    g.beginPath();
    g.arc(0, 0, openInner, a1, a2);
    g.arc(0, 0, openOuter, a2, a1, true);
    g.closePath();
    g.stroke();
  }
  
  g.restore();

  // === CENTRAL HUB ===
  g.save();
  g.translate(cx, cx);
  
  g.fillStyle = '#b8b8b8';
  g.beginPath();
  g.arc(0, 0, radius * 0.26, 0, Math.PI * 2);
  g.fill();
  
  g.strokeStyle = 'rgba(0,0,0,0.5)';
  g.lineWidth = 1;
  g.stroke();
  
  g.strokeStyle = 'rgba(0,0,0,0.25)';
  g.lineWidth = 0.8;
  g.beginPath();
  g.arc(0, 0, radius * 0.2, 0, Math.PI * 2);
  g.stroke();
  
  // Square spindle hole
  const holeSize = radius * 0.07;
  g.fillStyle = '#000';
  g.fillRect(-holeSize, -holeSize, holeSize * 2, holeSize * 2);
  
  g.strokeStyle = 'rgba(0,0,0,0.9)';
  g.lineWidth = 1.5;
  g.strokeRect(-holeSize, -holeSize, holeSize * 2, holeSize * 2);
  
  g.restore();

  return c;
}

// Static lighting overlay - drawn AFTER reel is rotated, so lighting stays fixed
function createReelLighting(radius) {
  const size = radius * 3;
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  const cx = size / 2;
  
  g.save();
  g.translate(cx, cx);
  
  // Top-left to bottom-right metallic gradient over the whole reel area
  const lightGrad = g.createRadialGradient(
    -radius * 0.5, -radius * 0.5, radius * 0.1,
    0, 0, radius * 1.4
  );
  lightGrad.addColorStop(0, 'rgba(255,255,255,0.35)');
  lightGrad.addColorStop(0.3, 'rgba(255,255,255,0.12)');
  lightGrad.addColorStop(0.6, 'rgba(0,0,0,0)');
  lightGrad.addColorStop(1, 'rgba(0,0,0,0.45)');
  
  g.fillStyle = lightGrad;
  g.beginPath();
  g.arc(0, 0, radius, 0, Math.PI * 2);
  g.fill();
  
  // Bright rim shine arc on upper-left
  g.strokeStyle = 'rgba(255,255,255,0.5)';
  g.lineWidth = 1.5;
  g.beginPath();
  g.arc(0, 0, radius * 0.97, Math.PI * 1.05, Math.PI * 1.55);
  g.stroke();
  g.strokeStyle = 'rgba(255,255,255,0.25)';
  g.lineWidth = 0.8;
  g.beginPath();
  g.arc(0, 0, radius * 0.94, Math.PI * 1.0, Math.PI * 1.6);
  g.stroke();
  
  // Subtle dark rim shadow on lower-right
  g.strokeStyle = 'rgba(0,0,0,0.4)';
  g.lineWidth = 1.5;
  g.beginPath();
  g.arc(0, 0, radius * 0.97, Math.PI * 0.05, Math.PI * 0.55);
  g.stroke();
  
  g.restore();
  
  return c;
}

function generateRandomReels() {
  const reels = [];
  let minDistance = 40;
  const margin = 80;
  const attempts = 500;
  const minReels = 3;
  const targetReels = 6 + Math.floor(Math.random() * 7); // 6 to 12 reels
  
  for(let i = 0; i < targetReels; i++) {
    let validPosition = false;
    let attempt = 0;
    let newReel;
    let currentMinDistance = minDistance;
    
    while(!validPosition && attempt < attempts) {
      newReel = {
        x: margin + Math.random() * (w - margin * 2),
        y: margin + Math.random() * (h - margin * 2),
        r: 30 + Math.random() * 18,
        baseX: 0, baseY: 0,
        floatPhase: Math.random() * Math.PI * 2,
        floatSpeed: 0.3 + Math.random() * 0.4,
        floatAmpX: 15 + Math.random() * 25,
        floatAmpY: 15 + Math.random() * 25,
        meltPhase: Math.random() * Math.PI * 2
      };
      
      validPosition = true;
      for(let j = 0; j < reels.length; j++) {
        const dx = newReel.x - reels[j].x;
        const dy = newReel.y - reels[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const minDist = newReel.r + reels[j].r + currentMinDistance;
        
        if(dist < minDist) {
          validPosition = false;
          break;
        }
      }
      
      attempt++;
      
      // Relax spacing constraint if we haven't reached minimum reels
      if(!validPosition && attempt >= attempts && reels.length < minReels) {
        currentMinDistance *= 0.7;
        attempt = 0;
        if(currentMinDistance < 10) break;
      }
    }
    
    if(validPosition) {
      newReel.baseX = newReel.x;
      newReel.baseY = newReel.y;
      reels.push(newReel);
    }
  }
  
  return reels;
}

const reels = generateRandomReels();
const canvases = reels.map(r => createFilmReel(r.r));
const lightingCanvases = reels.map(r => createReelLighting(r.r));

let t = 0;
let filmOffset = 0;

const lights = [
  { baseAngle: 0.3, lightAngle: 0.2, color: '#ff6ec7', speed: 0.3, distance: 200 },
  { baseAngle: 2.1, lightAngle: 1.2, color: '#6ec7ff', speed: 0.5, distance: 250 },
  { baseAngle: 4.5, lightAngle: 2.5, color: '#c7ff6e', speed: 0.4, distance: 220 }
];

function updateLights() {
  lights.forEach((light, idx) => {
    const angleOffset = t * light.speed + idx * Math.PI * 0.7;
    const edgeAngle = light.baseAngle + Math.sin(angleOffset) * 0.8;
    
    const centerX = w / 2;
    const centerY = h / 2;
    const maxRadius = Math.max(w, h);
    
    light.x = centerX + Math.cos(edgeAngle) * (maxRadius * 0.7 + light.distance);
    light.y = centerY + Math.sin(edgeAngle) * (maxRadius * 0.7 + light.distance);
    
    const angleToCenter = Math.atan2(centerY - light.y, centerX - light.x);
    light.angle = angleToCenter + Math.sin(t * 0.3 + idx) * 0.3;
  });
}

function updateReelPositions() {
  reels.forEach(r => {
    r.x = r.baseX + Math.sin(t * r.floatSpeed + r.floatPhase) * r.floatAmpX;
    r.y = r.baseY + Math.cos(t * r.floatSpeed * 0.7 + r.floatPhase) * r.floatAmpY;
  });
}

function drawFilm() {
  for(let i = 0; i < reels.length; i++) {
    const r1 = reels[i];
    const r2 = reels[(i + 1) % reels.length];
    
    const dx = r2.x - r1.x;
    const dy = r2.y - r1.y;
    const angle = Math.atan2(dy, dx);
    const perpAngle = angle + Math.PI / 2;
    
    const x1 = r1.x + Math.cos(perpAngle) * r1.r * 0.7;
    const y1 = r1.y + Math.sin(perpAngle) * r1.r * 0.7;
    const x2 = r2.x + Math.cos(perpAngle) * r2.r * 0.7;
    const y2 = r2.y + Math.sin(perpAngle) * r2.r * 0.7;
    
    // Curved/melting film like Dali's clocks
    const midX = (x1 + x2) / 2;
    const midY = (y1 + y2) / 2;
    const sag = Math.sin(t * 0.5 + i) * 20 + 15;
    const ctrlX = midX + Math.cos(perpAngle) * sag;
    const ctrlY = midY + Math.sin(perpAngle) * sag;
    
    // Base film strip
    ctx.lineWidth = 5;
    ctx.strokeStyle = '#1f1f1f';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.quadraticCurveTo(ctrlX, ctrlY, x2, y2);
    ctx.stroke();
    
    // Animated reflection traveling along the film
    // Each segment has its own offset so the reflection circulates around the loop
    const segmentProgress = (filmOffset * 0.5 + i * 0.15) % 1.4 - 0.2;
    
    if (segmentProgress >= 0 && segmentProgress <= 1) {
      // Quadratic bezier point at progress
      const tp = segmentProgress;
      const oneMinusT = 1 - tp;
      const px = oneMinusT * oneMinusT * x1 + 2 * oneMinusT * tp * ctrlX + tp * tp * x2;
      const py = oneMinusT * oneMinusT * y1 + 2 * oneMinusT * tp * ctrlY + tp * tp * y2;
      
      // Tangent for orientation
      const tx = 2 * oneMinusT * (ctrlX - x1) + 2 * tp * (x2 - ctrlX);
      const ty = 2 * oneMinusT * (ctrlY - y1) + 2 * tp * (y2 - ctrlY);
      const tangentAngle = Math.atan2(ty, tx);
      
      // Fade in/out at edges of segment
      const edgeFade = Math.min(1, Math.min(tp, 1 - tp) * 4);
      
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(tangentAngle);
      
      const reflectionLength = 40;
      const reflectionWidth = 5;
      
      // Bright glowing reflection along the film direction
      const reflectGrad = ctx.createLinearGradient(-reflectionLength / 2, 0, reflectionLength / 2, 0);
      reflectGrad.addColorStop(0, 'rgba(255,255,255,0)');
      reflectGrad.addColorStop(0.4, `rgba(255,255,240,${0.15 * edgeFade})`);
      reflectGrad.addColorStop(0.5, `rgba(255,255,255,${0.35 * edgeFade})`);
      reflectGrad.addColorStop(0.6, `rgba(255,255,240,${0.15 * edgeFade})`);
      reflectGrad.addColorStop(1, 'rgba(255,255,255,0)');
      
      ctx.shadowBlur = 6;
      ctx.shadowColor = `rgba(255,255,220,${0.2 * edgeFade})`;
      ctx.fillStyle = reflectGrad;
      ctx.fillRect(-reflectionLength / 2, -reflectionWidth / 2, reflectionLength, reflectionWidth);
      ctx.shadowBlur = 0;
      
      // Subtle core
      ctx.fillStyle = `rgba(255,255,255,${0.3 * edgeFade})`;
      ctx.fillRect(-2, -reflectionWidth / 2, 4, reflectionWidth);
      
      ctx.restore();
    }
  }
}

function rgbToHex(rgb) {
  const match = rgb.match(/^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/);
  if (!match) return '#ffffff';
  
  const r = parseInt(match[1]);
  const g = parseInt(match[2]);
  const b = parseInt(match[3]);
  
  return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
}

function mixColors(color1, color2, ratio) {
  if (color2.startsWith('rgb')) {
    color2 = rgbToHex(color2);
  }
  
  if (!color1 || !color2 || color1.length < 7 || color2.length < 7) {
    return color1 || '#ffffff';
  }
  
  const r1 = parseInt(color1.slice(1, 3), 16);
  const g1 = parseInt(color1.slice(3, 5), 16);
  const b1 = parseInt(color1.slice(5, 7), 16);
  
  const r2 = parseInt(color2.slice(1, 3), 16);
  const g2 = parseInt(color2.slice(3, 5), 16);
  const b2 = parseInt(color2.slice(5, 7), 16);
  
  if (isNaN(r1) || isNaN(g1) || isNaN(b1) || isNaN(r2) || isNaN(g2) || isNaN(b2)) {
    return color1;
  }
  
  const r = Math.round(r1 * (1 - ratio) + r2 * ratio);
  const g = Math.round(g1 * (1 - ratio) + g2 * ratio);
  const b = Math.round(b1 * (1 - ratio) + b2 * ratio);
  
  return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
}

function lineIntersect(x1, y1, x2, y2, x3, y3, x4, y4) {
  const denom = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);
  if (Math.abs(denom) < 0.0001) return null;
  
  const t = ((x1 - x3) * (y3 - y4) - (y1 - y3) * (x3 - x4)) / denom;
  const u = -((x1 - x2) * (y1 - y3) - (y1 - y2) * (x1 - x3)) / denom;
  
  if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
    return {
      x: x1 + t * (x2 - x1),
      y: y1 + t * (y2 - y1),
      t: t
    };
  }
  return null;
}

function getFilmSegments() {
  const segments = [];
  const baseColors = ['#ff6b6b','#4ecdc4','#45b7d1','#f9ca24','#6c5ce7','#00b894','#fdcb6e','#e17055','#74b9ff','#a29bfe','#fd79a8','#16a085'];
  
  for(let i = 0; i < reels.length; i++) {
    const r1 = reels[i];
    const r2 = reels[(i + 1) % reels.length];
    
    const dx = r2.x - r1.x;
    const dy = r2.y - r1.y;
    const angle = Math.atan2(dy, dx);
    const perpAngle = angle + Math.PI / 2;
    
    const baseColor = baseColors[i % baseColors.length];
    const colorPhase = (filmOffset + i * 0.5) % 1;
    const r_val = parseInt(baseColor.slice(1, 3), 16);
    const g_val = parseInt(baseColor.slice(3, 5), 16);
    const b_val = parseInt(baseColor.slice(5, 7), 16);
    const brightness = 0.7 + Math.sin(colorPhase * Math.PI * 4) * 0.3;
    const segmentColor = `rgb(${Math.round(r_val * brightness)}, ${Math.round(g_val * brightness)}, ${Math.round(b_val * brightness)})`;
    
    segments.push({
      x1: r1.x + Math.cos(perpAngle) * r1.r * 0.7,
      y1: r1.y + Math.sin(perpAngle) * r1.r * 0.7,
      x2: r2.x + Math.cos(perpAngle) * r2.r * 0.7,
      y2: r2.y + Math.sin(perpAngle) * r2.r * 0.7,
      reelIdx: i,
      color: segmentColor
    });
  }
  
  return segments;
}

function drawLightRays() {
  const filmSegments = getFilmSegments();
  
  lights.forEach((light, idx) => {
    ctx.save();
    ctx.globalAlpha = 0.08;
    ctx.fillStyle = light.color;
    ctx.beginPath();
    ctx.moveTo(light.x, light.y);
    ctx.arc(light.x, light.y, 1200, light.angle - 0.12, light.angle + 0.12);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    
    const numRays = 5;
    const spreadAngle = 0.15;
    const allRaySegments = [];
    
    for(let r = 0; r < numRays; r++) {
      const rayAngleOffset = (r - numRays / 2) * (spreadAngle / numRays);
      const rayAngle = light.angle + rayAngleOffset;
      
      const raySegments = [];
      let currentX = light.x;
      let currentY = light.y;
      let currentAngle = rayAngle;
      let currentColor = light.color;
      
      for(let bounce = 0; bounce < 20; bounce++) {
        const rayEndX = currentX + Math.cos(currentAngle) * 2000;
        const rayEndY = currentY + Math.sin(currentAngle) * 2000;
        
        let closestIntersect = null;
        let closestDist = Infinity;
        let closestSegment = null;
        
        filmSegments.forEach(seg => {
          const intersect = lineIntersect(
            currentX, currentY, rayEndX, rayEndY,
            seg.x1, seg.y1, seg.x2, seg.y2
          );
          
          if (intersect) {
            const dist = Math.sqrt(
              Math.pow(intersect.x - currentX, 2) + 
              Math.pow(intersect.y - currentY, 2)
            );
            
            if (dist > 1 && dist < closestDist) {
              closestDist = dist;
              closestIntersect = intersect;
              closestSegment = seg;
            }
          }
        });
        
        if (closestIntersect) {
          raySegments.push({
            x1: currentX,
            y1: currentY,
            x2: closestIntersect.x,
            y2: closestIntersect.y,
            color: currentColor,
            rayIndex: r,
            depth: bounce
          });
          
          const filmAngle = Math.atan2(
            closestSegment.y2 - closestSegment.y1,
            closestSegment.x2 - closestSegment.x1
          );
          const refraction = 0.4;
          currentAngle = filmAngle + (currentAngle - filmAngle) * (1 - refraction);
          
          currentColor = mixColors(currentColor, closestSegment.color, 0.6);
          
          currentX = closestIntersect.x;
          currentY = closestIntersect.y;
        } else {
          raySegments.push({
            x1: currentX,
            y1: currentY,
            x2: rayEndX,
            y2: rayEndY,
            color: currentColor,
            rayIndex: r,
            depth: bounce
          });
          break;
        }
        
        if (currentX < -100 || currentX > w + 100 || currentY < -100 || currentY > h + 100) break;
      }
      
      allRaySegments.push(...raySegments);
    }
    
    for(let depth = 0; depth < 20; depth++) {
      const segmentsAtDepth = allRaySegments.filter((_, i) => {
        const segIndex = Math.floor(i / numRays);
        return segIndex === depth;
      });
      
      if(segmentsAtDepth.length === 0) break;
      
      const pulsePhase = t + idx * Math.PI / 3;
      const intensity = (0.5 + Math.sin(pulsePhase) * 0.15) * (1 - depth / 20 * 0.5);
      
      ctx.save();
      ctx.globalAlpha = intensity * 0.3;
      ctx.fillStyle = segmentsAtDepth[0].color;
      ctx.shadowBlur = 25;
      ctx.shadowColor = segmentsAtDepth[0].color;
      
      ctx.beginPath();
      for(let i = 0; i < segmentsAtDepth.length; i++) {
        const seg = segmentsAtDepth[i];
        if(i === 0) ctx.moveTo(seg.x1, seg.y1);
        ctx.lineTo(seg.x2, seg.y2);
      }
      for(let i = segmentsAtDepth.length - 1; i >= 0; i--) {
        const seg = segmentsAtDepth[i];
        if(i === segmentsAtDepth.length - 1) ctx.lineTo(seg.x2, seg.y2);
        else ctx.lineTo(seg.x1, seg.y1);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      
      segmentsAtDepth.forEach(seg => {
        if(seg.rayIndex === 0 || seg.rayIndex === numRays - 1) {
          ctx.save();
          ctx.globalAlpha = intensity * 0.7;
          ctx.strokeStyle = seg.color;
          ctx.lineWidth = 2.5;
          ctx.shadowBlur = 18;
          ctx.shadowColor = seg.color;
          ctx.beginPath();
          ctx.moveTo(seg.x1, seg.y1);
          ctx.lineTo(seg.x2, seg.y2);
          ctx.stroke();
          ctx.restore();
        }
      });
    }
  });
}

function drawEye(x, y, size, rotation) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rotation);
  
  // Iris - shifts color
  const irisGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 0.45);
  irisGrad.addColorStop(0, `hsl(${(t * 30) % 360}, 70%, 60%)`);
  irisGrad.addColorStop(0.7, `hsl(${(t * 30 + 60) % 360}, 80%, 40%)`);
  irisGrad.addColorStop(1, '#1a1a2e');
  ctx.fillStyle = irisGrad;
  ctx.beginPath();
  ctx.arc(Math.sin(t) * size * 0.15, 0, size * 0.45, 0, Math.PI * 2);
  ctx.fill();
  
  // Pupil
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(Math.sin(t) * size * 0.15, 0, size * 0.2, 0, Math.PI * 2);
  ctx.fill();
  
  // Highlight
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath();
  ctx.arc(Math.sin(t) * size * 0.15 - size * 0.08, -size * 0.08, size * 0.06, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.restore();
}

function drawMeltingClock(x, y, size, rotation) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rotation);
  
  // Melting/sagging effect
  const melt = Math.sin(t * 0.5) * 0.3 + 0.7;
  ctx.scale(1, melt);
  ctx.transform(1, Math.sin(t * 0.3) * 0.2, 0, 1, 0, 0);
  
  // Clock face
  ctx.shadowBlur = 15;
  ctx.shadowColor = 'rgba(255,200,100,0.4)';
  const clockGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, size);
  clockGrad.addColorStop(0, '#f4e4bc');
  clockGrad.addColorStop(1, '#c9a875');
  ctx.fillStyle = clockGrad;
  ctx.beginPath();
  ctx.arc(0, 0, size, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  
  // Border
  ctx.strokeStyle = '#3a2818';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  // Hour marks
  for(let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    ctx.strokeStyle = '#3a2818';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * size * 0.85, Math.sin(a) * size * 0.85);
    ctx.lineTo(Math.cos(a) * size * 0.95, Math.sin(a) * size * 0.95);
    ctx.stroke();
  }
  
  // Hands - moving erratically
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  
  const hourAngle = t * 0.3 + Math.sin(t) * 0.5;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(Math.cos(hourAngle) * size * 0.5, Math.sin(hourAngle) * size * 0.5);
  ctx.stroke();
  
  const minAngle = t * 1.2 - Math.sin(t * 0.7) * 0.8;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(Math.cos(minAngle) * size * 0.7, Math.sin(minAngle) * size * 0.7);
  ctx.stroke();
  
  // Center
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(0, 0, size * 0.08, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.restore();
}

function drawButterfly(x, y, size, rotation) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rotation);
  
  const flap = Math.sin(t * 6) * 0.4 + 0.6;
  
  ctx.shadowBlur = 15;
  ctx.shadowColor = `hsla(${(t * 50) % 360}, 80%, 60%, 0.5)`;
  
  // Wings
  for(let side = 0; side < 2; side++) {
    ctx.save();
    if(side === 1) ctx.scale(-1, 1);
    ctx.scale(flap, 1);
    
    const wingGrad = ctx.createLinearGradient(0, 0, size, size * 0.5);
    wingGrad.addColorStop(0, `hsl(${(t * 50) % 360}, 80%, 65%)`);
    wingGrad.addColorStop(0.5, `hsl(${(t * 50 + 60) % 360}, 70%, 55%)`);
    wingGrad.addColorStop(1, `hsl(${(t * 50 + 120) % 360}, 80%, 45%)`);
    ctx.fillStyle = wingGrad;
    
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(size * 0.3, -size * 0.7, size * 1.2, -size * 0.5, size, 0);
    ctx.bezierCurveTo(size * 1.1, size * 0.4, size * 0.4, size * 0.6, 0, size * 0.1);
    ctx.closePath();
    ctx.fill();
    
    // Wing pattern
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.arc(size * 0.5, -size * 0.2, size * 0.1, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.restore();
  }
  
  ctx.shadowBlur = 0;
  
  // Body
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.ellipse(0, 0, size * 0.06, size * 0.4, 0, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.restore();
}

function drawMoon(x, y, size, rotation) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rotation);
  
  ctx.shadowBlur = 30;
  ctx.shadowColor = 'rgba(255,240,200,0.6)';
  
  const moonGrad = ctx.createRadialGradient(-size * 0.3, -size * 0.3, 0, 0, 0, size);
  moonGrad.addColorStop(0, '#fff8e0');
  moonGrad.addColorStop(0.7, '#e8d8a8');
  moonGrad.addColorStop(1, '#a89870');
  ctx.fillStyle = moonGrad;
  ctx.beginPath();
  ctx.arc(0, 0, size, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  
  // Craters
  ctx.fillStyle = 'rgba(100,90,70,0.3)';
  ctx.beginPath();
  ctx.arc(size * 0.2, -size * 0.1, size * 0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(-size * 0.3, size * 0.2, size * 0.1, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(size * 0.1, size * 0.4, size * 0.08, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.restore();
}

function drawFloatingElements() {
  floatingElements.forEach(el => {
    el.x += el.driftX + Math.sin(t * el.speed + el.phase) * 0.3;
    el.y += el.driftY + Math.cos(t * el.speed * 0.7 + el.phase) * 0.3;
    el.rotation += el.rotSpeed * 0.01;
    
    // Wrap around screen
    if(el.x < -50) el.x = w + 50;
    if(el.x > w + 50) el.x = -50;
    if(el.y < -50) el.y = h + 50;
    if(el.y > h + 50) el.y = -50;
    
    const breathe = 1 + Math.sin(t * 0.8 + el.phase) * 0.1;
    
    switch(el.type) {
      case 'eye': drawEye(el.x, el.y, el.size * breathe, el.rotation); break;
      case 'clock': drawMeltingClock(el.x, el.y, el.size * breathe, el.rotation); break;
      case 'butterfly': drawButterfly(el.x, el.y, el.size * breathe, el.rotation); break;
      case 'moon': drawMoon(el.x, el.y, el.size * breathe, el.rotation); break;
    }
  });
}

function rndF(a,b){return a+Math.random()*(b-a);}
function riF(a,b){return Math.floor(rndF(a,b));}
function pickF(arr){return arr[riF(0,arr.length)];}

function makeBgCanvas(){
  const oc = document.createElement('canvas');
  oc.width = oc.height = Math.max(w, h);
  return oc;
}

function renderBgText(o, W) {
  o.clearRect(0, 0, W, W);
  const sz = rndF(20, 55);
  const font = Math.random() < 0.5 ? 'monospace' : 'sans-serif';
  const angle = Math.random() < 0.25 ? Math.PI/2 : rndF(-0.06, 0.06);
  o.save();
  o.translate(W/2, W/2);
  o.rotate(angle);
  o.translate(-W/2, -W/2);
  let y = rndF(-sz*2, sz*2);
  while (y < W + sz*3) {
    let x = rndF(-sz*6, 0);
    const lineH = sz * rndF(0.9, 1.3);
    while (x < W + sz*6) {
      const word = pickF(FILM_TITLES);
      o.font = `${Math.random()<0.35?'bold ':''}${rndF(20,55)}px ${font}`;
      o.fillStyle = 'rgba(180,180,180,0.5)';
      o.fillText(word, x, y);
      x += o.measureText(word).width + sz * rndF(0.5, 2);
    }
    y += lineH;
  }
  o.restore();
}

function renderBgDenseZone(o, W) {
  const nb = riF(1, 3);
  for (let b = 0; b < nb; b++) {
    const cx = rndF(W*0.05, W*0.7);
    const cy = rndF(W*0.05, W*0.7);
    const sz = rndF(18, 35);
    const lines = riF(6, 18);
    const font = Math.random() < 0.5 ? 'monospace' : 'sans-serif';
    o.fillStyle = 'rgba(200,200,200,0.55)';
    for (let l = 0; l < lines; l++) {
      const ly = cy + l * sz * rndF(0.7, 0.9);
      const targetW = rndF(W*0.12, W*0.45);
      let line = '';
      o.font = `bold ${sz}px ${font}`;
      while (o.measureText(line).width < targetW) {
        line += pickF(FILM_TITLES).replace(/ /g,'');
      }
      const chars = line.split('');
      const spacing = targetW / chars.length;
      for (let i = 0; i < chars.length; i++) {
        o.fillText(chars[i], cx + i * spacing, ly);
      }
    }
  }
}

function renderBgBlocks(o, W) {
  o.clearRect(0, 0, W, W);
  const nb = riF(2, 5);
  for (let b = 0; b < nb; b++) {
    const bx = rndF(0, W*0.75), by = rndF(0, W*0.75);
    const bw = rndF(W*0.15, W*0.5), bh = rndF(W*0.08, W*0.25);
    const sz = rndF(22, 45);
    o.fillStyle = 'rgba(180,180,180,0.45)';
    for (let ly = by; ly < by+bh+sz; ly += sz*rndF(0.55,0.75)) {
      for (let lx = bx; lx < bx+bw+sz*2; lx += sz*rndF(0.55,0.8)) {
        o.font = `bold ${sz}px monospace`;
        o.fillText(pickF(FILM_TITLES).charAt(riF(0,6)), lx, ly);
      }
    }
  }
  renderBgDenseZone(o, W);
}

const bgState = {
  text:   { cur: makeBgCanvas(), prev: makeBgCanvas(), alpha: 0, blending: false },
  blocks: { cur: makeBgCanvas(), prev: makeBgCanvas(), alpha: 0, blending: false },
};

function bgStartBlend(key, renderFn) {
  const s = bgState[key];
  if (s.blending) return;
  const prevCtx = s.prev.getContext('2d');
  prevCtx.clearRect(0, 0, s.prev.width, s.prev.height);
  prevCtx.drawImage(s.cur, 0, 0);
  renderFn(s.cur.getContext('2d'), s.cur.width);
  s.alpha = 0;
  s.blending = true;
}

function drawTypographicBackground() {
  ctx.save();
  ctx.globalAlpha = 0.6;
  for (const key of ['text','blocks']) {
    const s = bgState[key];
    if (s.blending) {
      ctx.globalAlpha = (1 - s.alpha) * 0.6;
      ctx.drawImage(s.prev, 0, 0, w, h);
      ctx.globalAlpha = s.alpha * 0.6;
      ctx.drawImage(s.cur, 0, 0, w, h);
      s.alpha = Math.min(1, s.alpha + 0.012);
      if (s.alpha >= 1) s.blending = false;
    } else {
      ctx.globalAlpha = 0.6;
      ctx.drawImage(s.cur, 0, 0, w, h);
    }
  }
  ctx.restore();
}

let bgFrame = 0;

// Initial render
renderBgText(bgState.text.cur.getContext('2d'), bgState.text.cur.width);
renderBgBlocks(bgState.blocks.cur.getContext('2d'), bgState.blocks.cur.width);

function drawSurrealBackground() {
  // Dreamy sky-like background
  const skyHue = (t * 5) % 360;
  const bg = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.max(w, h));
  bg.addColorStop(0, `hsl(${skyHue}, 30%, 8%)`);
  bg.addColorStop(0.5, `hsl(${(skyHue + 60) % 360}, 25%, 5%)`);
  bg.addColorStop(1, '#050510');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);
  
  // Distant horizon line - Magritte-style
  const horizonY = h * 0.65;
  const horizonGrad = ctx.createLinearGradient(0, horizonY - 100, 0, horizonY + 100);
  horizonGrad.addColorStop(0, 'rgba(0,0,0,0)');
  horizonGrad.addColorStop(0.5, `hsla(${(skyHue + 30) % 360}, 40%, 15%, 0.4)`);
  horizonGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = horizonGrad;
  ctx.fillRect(0, horizonY - 100, w, 200);
}

function draw(){
  drawSurrealBackground();
  
  // Typographic background (cult film titles) - behind reels and lights
  bgFrame++;
  if (bgFrame % 20 === 0) bgStartBlend('text', renderBgText);
  if (bgFrame % 40 === 0) bgStartBlend('blocks', renderBgBlocks);
  drawTypographicBackground();

  const shakeX = Math.sin(t * 1.7) * 0.3;
  const shakeY = Math.cos(t * 1.3) * 0.3;
  ctx.save();
  ctx.translate(shakeX, shakeY);

  updateLights();
  updateReelPositions();
  
  ctx.globalCompositeOperation = 'screen';
  drawLightRays();
  ctx.globalCompositeOperation = 'source-over';

  drawFilm();

  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.3)';
  ctx.shadowBlur = 12;
  ctx.shadowOffsetY = 4;

  reels.forEach((r, i) => {
    const ratio = reels[0].r / r.r;
    const jitter = Math.sin(t * 0.3 + i) * 0.15;
    const angle = t * ratio * 4 + jitter;
    
    // Rotating reel body
    ctx.save();
    ctx.translate(r.x, r.y);
    ctx.rotate(angle);
    const breathe = 1 + Math.sin(t * 0.6 + r.meltPhase) * 0.05;
    ctx.scale(breathe, breathe);
    const g = canvases[i];
    ctx.drawImage(g, -g.width/2, -g.height/2);
    ctx.restore();
    
    // Static lighting overlay (no rotation, position only)
    ctx.save();
    ctx.translate(r.x, r.y);
    ctx.scale(breathe, breathe);
    const lg = lightingCanvases[i];
    ctx.drawImage(lg, -lg.width/2, -lg.height/2);
    ctx.restore();
  });
  ctx.restore();

  lights.forEach((light, idx) => {
    const pulsePhase = t + idx * Math.PI / 3;
    const size = 10 + Math.sin(pulsePhase) * 4;
    
    ctx.save();
    ctx.globalAlpha = 1;
    const grad = ctx.createRadialGradient(light.x, light.y, 0, light.x, light.y, size * 4);
    grad.addColorStop(0, '#fff');
    grad.addColorStop(0.2, light.color);
    grad.addColorStop(1, light.color + '00');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(light.x, light.y, size * 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  ctx.restore();

  if(Math.floor(t * 60) % 2 === 0) {
    const imageData = ctx.getImageData(0, 0, w, h);
    const d = imageData.data;
    
    for (let i = 0; i < d.length; i += 4) {
      const lum = (d[i] + d[i+1] + d[i+2]) / 3;
      const n = (Math.random() - 0.5) * (lum / 255) * 10;
      d[i] += n;
      d[i+1] += n;
      d[i+2] += n;
    }
    
    ctx.putImageData(imageData, 0, 0);
  }
  
  ctx.save();
  
  for(let i = 0; i < 5; i++) {
    if(Math.random() > 0.7) {
      const scratchX = Math.random() * w;
      const scratchAlpha = 0.12 + Math.random() * 0.18;
      const scratchWidth = 0.5 + Math.random() * 1.5;
      const wobble = Math.sin(t * 5 + i) * 3;
      
      ctx.shadowBlur = 4 + Math.random() * 6;
      ctx.shadowColor = `rgba(255,255,255,${scratchAlpha * 0.4})`;
      ctx.strokeStyle = `rgba(255,255,255,${scratchAlpha})`;
      ctx.lineWidth = scratchWidth;
      ctx.beginPath();
      ctx.moveTo(scratchX + wobble, 0);
      ctx.lineTo(scratchX + wobble + (Math.random() - 0.5) * 30, h);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }
  
  for(let i = 0; i < 3; i++) {
    if(Math.random() > 0.75) {
      const scratchX = Math.random() * w;
      const scratchAlpha = 0.15 + Math.random() * 0.2;
      
      ctx.shadowBlur = 3 + Math.random() * 5;
      ctx.shadowColor = `rgba(0,0,0,${scratchAlpha * 0.4})`;
      ctx.strokeStyle = `rgba(0,0,0,${scratchAlpha})`;
      ctx.lineWidth = 0.8 + Math.random() * 2;
      ctx.beginPath();
      ctx.moveTo(scratchX, 0);
      ctx.lineTo(scratchX + (Math.random() - 0.5) * 40, h);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }
  
  for(let i = 0; i < 12; i++) {
    if(Math.random() > 0.6) {
      const dustX = Math.random() * w;
      const dustY = Math.random() * h;
      const dustSize = 0.5 + Math.random() * 1.5;
      const dustAlpha = 0.2 + Math.random() * 0.3;
      
      ctx.shadowBlur = 2 + Math.random() * 4;
      ctx.shadowColor = `rgba(220,220,220,${dustAlpha * 0.5})`;
      ctx.fillStyle = `rgba(220,220,220,${dustAlpha})`;
      ctx.beginPath();
      ctx.arc(dustX, dustY, dustSize, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  
  for(let i = 0; i < 6; i++) {
    if(Math.random() > 0.7) {
      const spotX = Math.random() * w;
      const spotY = Math.random() * h;
      const spotSize = 15 + Math.random() * 35;
      const spotAlpha = 0.1 + Math.random() * 0.2;
      
      const grad = ctx.createRadialGradient(spotX, spotY, 0, spotX, spotY, spotSize);
      grad.addColorStop(0, `rgba(0,0,0,${spotAlpha})`);
      grad.addColorStop(0.5, `rgba(0,0,0,${spotAlpha * 0.5})`);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(spotX, spotY, spotSize, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  
  for(let i = 0; i < 4; i++) {
    if(Math.random() > 0.8) {
      const hairX = Math.random() * w;
      const hairY = Math.random() * h;
      const hairLength = 30 + Math.random() * 100;
      const hairAngle = Math.random() * Math.PI * 2;
      
      ctx.shadowBlur = 3 + Math.random() * 5;
      ctx.shadowColor = `rgba(40,40,40,0.3)`;
      ctx.strokeStyle = `rgba(40,40,40,${0.3 + Math.random() * 0.3})`;
      ctx.lineWidth = 1 + Math.random() * 2;
      ctx.beginPath();
      ctx.moveTo(hairX, hairY);
      ctx.lineTo(
        hairX + Math.cos(hairAngle) * hairLength,
        hairY + Math.sin(hairAngle) * hairLength
      );
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }
  
  if(Math.random() > 0.96) {
    const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, Math.max(w,h) * 0.8);
    grad.addColorStop(0, `rgba(255,255,240,${0.2 + Math.random() * 0.25})`);
    grad.addColorStop(1, 'rgba(255,255,240,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
  }
  
  const contrastFlicker = Math.sin(t * 23.7) * 0.05 + Math.sin(t * 47.3) * 0.03;
  ctx.globalAlpha = Math.abs(contrastFlicker) * 0.5;
  const flickerGrad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, Math.max(w,h));
  const flickerColor = contrastFlicker > 0 ? '#ffffff' : '#000000';
  flickerGrad.addColorStop(0, flickerColor);
  flickerGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = flickerGrad;
  ctx.fillRect(0, 0, w, h);
  
  if(Math.random() > 0.95) {
    const jumpY = h * Math.random() * 0.3;
    const jumpHeight = 3 + Math.random() * 10;
    
    ctx.globalAlpha = 0.25;
    ctx.shadowBlur = 5;
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, jumpY, w, jumpHeight);
    ctx.shadowBlur = 0;
  }
  
  if(Math.random() > 0.93) {
    const edge = Math.floor(Math.random() * 4);
    const edgeSize = 10 + Math.random() * 30;
    const edgeAlpha = 0.4 + Math.random() * 0.4;
    
    let grad;
    switch(edge) {
      case 0: 
        grad = ctx.createLinearGradient(0, 0, 0, edgeSize);
        grad.addColorStop(0, `rgba(0,0,0,${edgeAlpha})`);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, edgeSize);
        break;
      case 1:
        grad = ctx.createLinearGradient(0, h, 0, h - edgeSize);
        grad.addColorStop(0, `rgba(0,0,0,${edgeAlpha})`);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, h - edgeSize, w, edgeSize);
        break;
      case 2:
        grad = ctx.createLinearGradient(0, 0, edgeSize, 0);
        grad.addColorStop(0, `rgba(0,0,0,${edgeAlpha})`);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, edgeSize, h);
        break;
      case 3:
        grad = ctx.createLinearGradient(w, 0, w - edgeSize, 0);
        grad.addColorStop(0, `rgba(0,0,0,${edgeAlpha})`);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(w - edgeSize, 0, edgeSize, h);
        break;
    }
  }
  
  ctx.restore();
  
  const vignette = ctx.createRadialGradient(w / 2, h / 2, Math.max(w, h) * 0.4, w / 2, h / 2, Math.max(w, h) * 0.9);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.25)');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, w, h);

  t += 0.02;
  filmOffset += 0.02;
  requestAnimationFrame(draw);
}

draw();
</script>
