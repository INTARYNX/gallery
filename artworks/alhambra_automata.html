<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  #wrap { width: min(100vw, 100vh); height: min(100vw, 100vh); }
  canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const S = 800;
canvas.width = canvas.height = S;

const PALETTES = [
  ['#0a2a1a', '#f4a000', '#1a6ec7', '#fff5d6'],
  ['#0e1a2e', '#e8621a', '#00857a', '#fff5d6'],
  ['#1a0e2e', '#1a6ec7', '#f4a000', '#d0f0ff'],
  ['#1a1a0a', '#00857a', '#d94f1e', '#e8f5d0'],
];

const COLS = 9, ROWS = 9, STEP_INTERVAL = 2500;

function lerp(a, b, t) { return a + (b - a) * t; }
function hexToRgb(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function lerpColor(a, b, f) {
  const ca = hexToRgb(a), cb = hexToRgb(b);
  return `rgb(${Math.round(lerp(ca[0],cb[0],f))},${Math.round(lerp(ca[1],cb[1],f))},${Math.round(lerp(ca[2],cb[2],f))})`;
}

// ── Automata ──────────────────────────────────────────────
let grid = Array.from({length:ROWS}, () =>
  Array.from({length:COLS}, () => Math.floor(Math.random() * PALETTES.length))
);
let prevGrid = grid.map(r => [...r]);
let lerpT = Array.from({length:ROWS}, () => Array(COLS).fill(1));
let bgF = 1;

function nextGrid(g) {
  const global = Array(PALETTES.length).fill(0);
  g.forEach(row => row.forEach(v => global[v]++));
  const total = COLS * ROWS;
  return g.map((row, r) => row.map((_, c) => {
    const freq = Array(PALETTES.length).fill(0);
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      freq[g[(r+dr+ROWS)%ROWS][(c+dc+COLS)%COLS]]++;
    }
    freq.forEach((_, i) => { freq[i] *= Math.max(0.1, 1 - (global[i]/total) * 1.8); });
    const max = Math.max(...freq);
    const winners = freq.map((f,i) => f >= max * .85 ? i : -1).filter(i => i >= 0);
    let next = winners[Math.floor(Math.random() * winners.length)];
    if (Math.random() < 0.12) {
      const w = global.map(v => 1/(v+1)), sum = w.reduce((a,b) => a+b, 0);
      let rnd = Math.random() * sum;
      next = w.findIndex(v => (rnd -= v) <= 0);
      if (next < 0) next = Math.floor(Math.random() * PALETTES.length);
    }
    return next;
  }));
}

function getCellPal(r, c) {
  const f = Math.min(lerpT[r][c], 1), sf = f*f*(3-2*f);
  return PALETTES[0].map((_, i) => lerpColor(PALETTES[prevGrid[r][c]][i], PALETTES[grid[r][c]][i], sf));
}

// ── Background: radial gradients per cell, blended ────────
function drawBackground(g, pg, f) {
  const sw = S / COLS, sh = S / ROWS;
  const sf = f*f*(3-2*f);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, S, S);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const cx = (c + .5) * sw, cy = (r + .5) * sh;
    const colA = PALETTES[pg[r][c]][0];
    const colB = PALETTES[g[r][c]][0];
    const col = lerpColor(colA, colB, sf);
    // slightly brighten for bg
    const [rr,gg,bb] = hexToRgb(col);
    const bright = `rgb(${Math.min(255,rr*1.4|0)},${Math.min(255,gg*1.4|0)},${Math.min(255,bb*1.4|0)})`;
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(sw, sh) * 0.85);
    grad.addColorStop(0, bright);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = grad;
    ctx.fillRect(Math.max(0, cx-sw), Math.max(0, cy-sh), sw*2, sh*2);
  }
  ctx.globalCompositeOperation = 'source-over';
}

// ── Geometry ──────────────────────────────────────────────
function polygon(cx, cy, r, n, rot) {
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = (i*2*Math.PI/n)+rot;
    i===0 ? ctx.moveTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r)
          : ctx.lineTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r);
  }
  ctx.closePath();
}
function star(cx, cy, r, pts, inner, rot) {
  ctx.beginPath();
  for (let i = 0; i < pts*2; i++) {
    const a = (i*Math.PI/pts)+rot;
    ctx.lineTo(cx+Math.cos(a)*(i%2===0?r:inner), cy+Math.sin(a)*(i%2===0?r:inner));
  }
  ctx.closePath();
}

function drawRecursiveStar(cx, cy, r, depth, t, pal) {
  if (depth===0 || r<2) return;
  const rot = t*(depth%2===0?1:-1)*0.4, inner = r*0.4;
  polygon(cx,cy,r,8,Math.PI/8+rot); ctx.fillStyle=pal[0]; ctx.fill();
  star(cx,cy,r*.92,8,inner,Math.PI/8+rot); ctx.fillStyle=pal[1]; ctx.fill();
  ctx.strokeStyle=pal[3]; ctx.lineWidth=0.6; ctx.stroke();
  polygon(cx,cy,inner,8,Math.PI/8+rot); ctx.fillStyle=pal[2]; ctx.fill();
  ctx.strokeStyle=pal[3]+'66'; ctx.lineWidth=0.8;
  for (let i=0;i<8;i++) {
    const a1=(i*Math.PI/4)+Math.PI/8+rot, a2=((i+2)*Math.PI/4)+Math.PI/8+rot;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a1)*inner,cy+Math.sin(a1)*inner);
    ctx.lineTo(cx+Math.cos(a2)*r*.75,cy+Math.sin(a2)*r*.75); ctx.stroke();
  }
  drawRecursiveStar(cx,cy,inner*.9,depth-1,t,pal);
  if (depth>=2) for (let i=0;i<8;i++) {
    const a=(i*Math.PI/4)+Math.PI/8+rot;
    drawRecursiveStar(cx+Math.cos(a)*r*.78,cy+Math.sin(a)*r*.78,r*.22,depth-2,t,pal);
  }
}

function drawRosette(cx, cy, r, t, pal) {
  const rot = t*.3;
  for (let i=0;i<12;i++) {
    const a=(i*2*Math.PI/12)+rot;
    ctx.beginPath();
    ctx.ellipse(cx+Math.cos(a)*r*.35,cy+Math.sin(a)*r*.35,r*.35,r*.12,a,0,Math.PI*2);
    ctx.fillStyle=i%2===0?pal[2]:pal[1]; ctx.fill();
    ctx.strokeStyle=pal[3]; ctx.lineWidth=0.4; ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(cx,cy,r*.15,0,Math.PI*2);
  ctx.fillStyle=pal[1]; ctx.fill();
}

// ── Loop ──────────────────────────────────────────────────
let t = 0, lastStep = null;

function draw(ts) {
  if (!lastStep) lastStep = ts;
  const elapsed = ts - lastStep;

  if (elapsed > STEP_INTERVAL) {
    prevGrid = grid.map(r => [...r]);
    grid = nextGrid(grid);
    lerpT = Array.from({length:ROWS}, () => Array(COLS).fill(0));
    bgF = 0;
    lastStep = ts;
  }

  bgF = Math.min(bgF + 0.008, 1);
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++)
    lerpT[r][c] = Math.min(lerpT[r][c] + 0.012, 1);

  drawBackground(grid, prevGrid, bgF);

  const s = S * .11, pulse = 1 + 0.04 * Math.sin(t*1.3);
  const cols = Math.ceil(S/(s*2))+1, rows = Math.ceil(S/(s*2))+1;

  ctx.save();
  ctx.translate(S/2,S/2); ctx.scale(pulse,pulse); ctx.translate(-S/2,-S/2);

  for (let r=0;r<rows;r++) for (let c=0;c<cols;c++)
    drawRecursiveStar(c*s*2+(r%2)*s, r*s*2, s*.95, 3, t, getCellPal(r%ROWS, c%COLS));

  for (let r=0;r<rows;r++) for (let c=0;c<cols;c++)
    drawRosette(c*s*2+s+(r%2)*s, r*s*2+s, s*.52, t, getCellPal((r+3)%ROWS, (c+4)%COLS));

  ctx.restore();

  // Vignette
  const vg = ctx.createRadialGradient(S/2,S/2,S*.2,S/2,S/2,S*.75);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.6)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,S,S);

  [1,4,9].forEach((lw,i) => {
    const off=i*5;
    ctx.strokeStyle=i===1?'#f4a000':'rgba(255,255,255,0.2)';
    ctx.lineWidth=lw; ctx.strokeRect(off,off,S-off*2,S-off*2);
  });

  t += 0.008;
  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
