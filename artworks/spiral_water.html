<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Spiral</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #333;
            box-shadow: 0 0 50px rgba(100,150,200,0.3);
        }
    </style>
</head>
<body>
    <canvas id="static"></canvas>
    <script>
        const canvas = document.getElementById('static');
        const ctx = canvas.getContext('2d');
        
        canvas.width = 640;
        canvas.height = 480;
        
        let time = 0;
        const imageData = ctx.createImageData(canvas.width, canvas.height);
        const data = imageData.data;
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const w = canvas.width;
        
        function drawStatic() {
            const t8 = time * 0.8;
            const t2 = time * 2;
            const t4 = time * 4;
            
            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    
                    const dx = x - centerX;
                    const dy = y - centerY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const angle = Math.atan2(dy, dx);
                    
                    const spiralTightness = 0.5 / (dist * 0.01 + 1);
                    const spiral = angle + t8 - dist * spiralTightness;
                    const flow = Math.sin(spiral * 3) * 0.5 + 0.5;
                    
                    const vortex = 1 - Math.min(dist / 250, 1);
                    const turbulence = Math.sin(dist * 0.1 + t2) * Math.cos(angle * 4 - time);
                    
                    const water = flow * vortex + turbulence * 0.2 + Math.random() * 0.3;
                    const depth = Math.max(0, 1 - dist / 300);
                    const wd = water * depth;
                    
                    data[i] = wd * 100 + 80;
                    data[i + 1] = wd * 180 + 120;
                    data[i + 2] = wd * 255 + 150;
                    data[i + 3] = 255;
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
            time += 0.05;
            requestAnimationFrame(drawStatic);
        }
        
        drawStatic();
    </script>
</body>
</html>
