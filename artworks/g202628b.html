<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genuary 2026 #28b</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #6366f1;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    
    .corridor {
      position: relative;
      width: min(80vmin, 600px);
      height: min(80vmin, 600px);
    }
    
    .circle {
      position: absolute;
      top: 50%;
      left: 50%;
      border: 2px solid #93c5fd;
      border-radius: 50%;
      transform: translate(-50%, -50%) translateX(-5vmin);
      animation: wave 4s ease-in-out infinite;
    }
    
    .circle:nth-child(1) { width: 100%; height: 100%; animation-delay: 0s; }
    .circle:nth-child(2) { width: 94%; height: 94%; animation-delay: 0.3s; }
    .circle:nth-child(3) { width: 88%; height: 88%; animation-delay: 0.6s; }
    .circle:nth-child(4) { width: 82%; height: 82%; animation-delay: 0.9s; }
    .circle:nth-child(5) { width: 76%; height: 76%; animation-delay: 1.2s; }
    .circle:nth-child(6) { width: 70%; height: 70%; animation-delay: 1.5s; }
    .circle:nth-child(7) { width: 64%; height: 64%; animation-delay: 1.8s; }
    .circle:nth-child(8) { width: 58%; height: 58%; animation-delay: 2.1s; }
    .circle:nth-child(9) { width: 52%; height: 52%; animation-delay: 2.4s; }
    .circle:nth-child(10) { width: 46%; height: 46%; animation-delay: 2.7s; }
    .circle:nth-child(11) { width: 40%; height: 40%; animation-delay: 3s; }
    .circle:nth-child(12) { width: 34%; height: 34%; animation-delay: 3.3s; }
    .circle:nth-child(13) { width: 28%; height: 28%; animation-delay: 3.6s; }
    .circle:nth-child(14) { width: 22%; height: 22%; animation-delay: 3.9s; }
    .circle:nth-child(15) { width: 16%; height: 16%; animation-delay: 4.2s; }
    
    @keyframes wave {
      0%, 100% {
        transform: translate(-50%, -50%) translateX(-5vmin);
      }
      50% {
        transform: translate(-50%, -50%) translateX(5vmin);
      }
    }
  </style>
</head>
<body>
  <div class="corridor">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
  </div>
</body>
</html>
