<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(ellipse at center, #012a36 0%, #00151c 70%, #000a0e 100%);
    display: flex; justify-content: center; align-items: center; min-height: 100vh;
    overflow: hidden;
  }
  canvas { display: block; width: min(100vw, 100vh); height: min(100vw, 100vh); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const SIZE = 800;
canvas.width = SIZE;
canvas.height = SIZE;

const cx = SIZE / 2, cy = SIZE / 2;
const TWO_PI = Math.PI * 2;
let t = 0;

const LAYERS = 7, RINGS = 56;
const R = 420;

function spherePoint(lat, lon, rotY, rotX) {
  const cLat = Math.cos(lat), sLat = Math.sin(lat);
  const cLon = Math.cos(lon), sLon = Math.sin(lon);
  let x = R * cLat * cLon;
  let y = R * sLat;
  let z = R * cLat * sLon;

  const cY = Math.cos(rotY), sY = Math.sin(rotY);
  let x1 = x * cY - z * sY;
  let z1 = x * sY + z * cY;
  const cX = Math.cos(rotX), sX = Math.sin(rotX);
  let y2 = y * cX - z1 * sX;
  let z2 = y * sX + z1 * cX;

  const fov = 1120;
  const scale = fov / (fov + z2 + R);
  return { sx: cx + x1 * scale, sy: cy + y2 * scale, z: z2 };
}

function getPoints(t) {
  const pts = [];
  const rotY = t * 0.35;
  const rotX = t * 0.13;

  for (let layer = 0; layer < LAYERS; layer++) {
    const layerPhase = (layer / LAYERS) * TWO_PI;
    const lat = -Math.PI / 2 + (layer / (LAYERS - 1)) * Math.PI;
    const wobbleLat = Math.sin(t * 0.7 + layerPhase) * 0.08;

    for (let i = 0; i < RINGS; i++) {
      const lon = (i / RINGS) * TWO_PI + t * (layer % 2 === 0 ? 0.15 : -0.15);
      const wobbleLon = Math.sin(lon * 3 + t * 1.4 + layerPhase) * 0.06;
      const p = spherePoint(lat + wobbleLat, lon + wobbleLon, rotY, rotX);
      pts.push(p);
    }
  }
  return pts;
}

function draw() {
  ctx.fillStyle = 'rgba(1, 21, 28, 0.05)';
  ctx.fillRect(0, 0, SIZE, SIZE);

  const pts = getPoints(t);
  const rotY = t * 0.35, rotX = t * 0.13;

  // Cordes miroir
  ctx.lineWidth = 0.55;
  ctx.lineCap = 'round';
  for (let layer = 0; layer < Math.floor(LAYERS / 2); layer++) {
    const mirrorLayer = LAYERS - 1 - layer;
    for (let i = 0; i < RINGS; i++) {
      const a = pts[layer * RINGS + i];
      const b = pts[mirrorLayer * RINGS + (i * 7) % RINGS];

      if (a.z < -R * 0.7 && b.z < -R * 0.7) continue;

      const alpha = 0.04 + 0.55 * Math.pow(Math.abs(Math.sin(t * 1.3 + i * 0.17 + layer * 0.9)), 2.5);

      const cp1 = spherePoint(
        Math.sin(t + i * 0.1) * 0.4,
        (i / RINGS) * TWO_PI * 2 + t,
        t * 0.2, Math.sin(t * 0.13) * 0.5
      );
      const cp2 = spherePoint(
        Math.cos(t * 0.7 + layer) * 0.4,
        (i / RINGS) * TWO_PI * 3 - t * 0.7,
        t * 0.2, Math.sin(t * 0.13) * 0.5
      );

      const depth = ((a.z + b.z) / 2 + R) / (2 * R);
      const hue = (175 + Math.sin(depth * 3 + t * 0.3) * 20) | 0;
      const light = (50 + depth * 35) | 0;
      ctx.beginPath();
      ctx.moveTo(a.sx, a.sy);
      ctx.bezierCurveTo(cp1.sx, cp1.sy, cp2.sx, cp2.sy, b.sx, b.sy);
      ctx.strokeStyle = `hsla(${hue},60%,${light}%,${alpha})`;
      ctx.stroke();
    }
  }

  // Sauts Lissajous
  ctx.lineWidth = 0.38;
  for (let layer = 0; layer < LAYERS - 1; layer++) {
    for (let i = 0; i < RINGS; i += 2) {
      const a = pts[layer * RINGS + i];
      const b = pts[(layer + 1) * RINGS + (i + layer * 13) % RINGS];
      if (a.z < -R * 0.6 && b.z < -R * 0.6) continue;

      const alpha = 0.03 + 0.45 * Math.pow(Math.abs(Math.sin(t * 2 + i * 0.4 + layer * 1.3)), 2);

      const cp = spherePoint(
        Math.sin(i * 0.2 + t * 1.2 + layer) * 0.5,
        (i / RINGS) * TWO_PI + t * 1.2,
        rotY, rotX
      );

      const depth = ((a.z + b.z) / 2 + R) / (2 * R);
      const hue = (175 + Math.sin(depth * 3 + t * 0.3) * 20) | 0;
      const light = (50 + depth * 35) | 0;
      ctx.beginPath();
      ctx.moveTo(a.sx, a.sy);
      ctx.quadraticCurveTo(cp.sx, cp.sy, b.sx, b.sy);
      ctx.strokeStyle = `hsla(${hue},60%,${light}%,${alpha})`;
      ctx.stroke();
    }
  }

  t += 0.012;
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
