<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ink Drift</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #1c1917 0%, #292524 50%, #1c1917 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }
  #wrap {
    position: relative;
    width: min(92vw, 92vh);
    aspect-ratio: 1 / 1;
  }
  #wrap::before {
    content: '';
    position: absolute;
    inset: -1rem;
    background: linear-gradient(to bottom, rgba(99, 102, 241, 0.1), rgba(217, 119, 6, 0.15));
    border-radius: 1rem;
    filter: blur(1rem);
    z-index: -1;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 0.5rem;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('wrap');

let W, H, DPR;
let blots = [];
let strokes = [];
let paperCanvas = null;

const palette = [
  '#e74c3c', '#3498db', '#2ecc71', '#f39c12',
  '#9b59b6', '#1abc9c', '#e67e22', '#34495e',
  '#c0392b', '#2980b9'
];

// ---------- resize ----------
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const rect = wrap.getBoundingClientRect();
  W = rect.width;
  H = rect.height;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  paperCanvas = null;
  // ink canvases of existing strokes are sized for old W/H, drop them
  for (const s of strokes) { s.inkCanvas = null; s.drawnTo = 0; }
  drawPaper();
}

// ---------- paper texture ----------
function buildPaperTexture() {
  paperCanvas = document.createElement('canvas');
  paperCanvas.width = W * DPR;
  paperCanvas.height = H * DPR;
  const pctx = paperCanvas.getContext('2d');
  pctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // base off-white
  const grad = pctx.createRadialGradient(W/2, H/2, W*0.1, W/2, H/2, W*0.8);
  grad.addColorStop(0, '#fafaf7');
  grad.addColorStop(1, '#f0efe9');
  pctx.fillStyle = grad;
  pctx.fillRect(0, 0, W, H);

  // fine pixel noise
  const imgData = pctx.getImageData(0, 0, W * DPR, H * DPR);
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    const n = (Math.random() - 0.5) * 6;
    data[i]   = Math.max(0, Math.min(255, data[i]   + n));
    data[i+1] = Math.max(0, Math.min(255, data[i+1] + n));
    data[i+2] = Math.max(0, Math.min(255, data[i+2] + n * 0.9));
  }
  pctx.putImageData(imgData, 0, 0);

  // diagonal weave
  const spacing = 4;
  const diag = Math.sqrt(W * W + H * H);
  for (const angle of [Math.PI / 4, -Math.PI / 4]) {
    const sy = angle > 0 ? -diag : diag;
    for (let d = -diag; d < diag; d += spacing) {
      const jitter = (Math.random() - 0.5) * 1.5;
      pctx.strokeStyle = `rgba(180, 175, 160, ${0.05 + Math.random() * 0.05})`;
      pctx.lineWidth = 0.5 + Math.random() * 0.4;
      pctx.beginPath();
      pctx.moveTo(d + jitter, sy);
      pctx.lineTo(d + jitter + Math.cos(angle) * diag * 2, sy + Math.sin(angle) * diag * 2);
      pctx.stroke();
    }
  }

  // micro bumps with light/shadow
  const bumpCount = Math.floor(W * H / 8);
  for (let i = 0; i < bumpCount; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H;
    const sz = 0.4 + Math.random() * 1.0;
    pctx.fillStyle = `rgba(140, 130, 110, ${0.04 + Math.random() * 0.05})`;
    pctx.beginPath();
    pctx.arc(x + 0.3, y + 0.3, sz, 0, Math.PI * 2);
    pctx.fill();
    pctx.fillStyle = `rgba(255, 255, 250, ${0.12 + Math.random() * 0.12})`;
    pctx.beginPath();
    pctx.arc(x - 0.25, y - 0.25, sz * 0.85, 0, Math.PI * 2);
    pctx.fill();
  }

  // brown specks
  const speckCount = Math.floor(W * H / 40000);
  for (let i = 0; i < speckCount; i++) {
    pctx.fillStyle = `rgba(140, 100, 60, ${0.3 + Math.random() * 0.3})`;
    pctx.beginPath();
    pctx.arc(Math.random() * W, Math.random() * H, 0.5 + Math.random() * 0.8, 0, Math.PI * 2);
    pctx.fill();
  }

  // light patches
  const patchCount = Math.floor(W * H / 30000);
  for (let i = 0; i < patchCount; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H;
    const r = 20 + Math.random() * 40;
    const pg = pctx.createRadialGradient(x, y, 0, x, y, r);
    pg.addColorStop(0, `rgba(255, 255, 252, ${0.06 + Math.random() * 0.05})`);
    pg.addColorStop(1, 'rgba(255, 255, 252, 0)');
    pctx.fillStyle = pg;
    pctx.beginPath();
    pctx.arc(x, y, r, 0, Math.PI * 2);
    pctx.fill();
  }
}

function drawPaper() {
  if (!paperCanvas) buildPaperTexture();
  ctx.drawImage(paperCanvas, 0, 0, W, H);
}

// ---------- shape helper ----------
function makeShape(points, baseVariation = 0.3) {
  const seeds = [
    { freq: 1, amp: baseVariation, phase: Math.random() * Math.PI * 2 },
    { freq: 2, amp: baseVariation * 0.5, phase: Math.random() * Math.PI * 2 },
    { freq: 3, amp: baseVariation * 0.3, phase: Math.random() * Math.PI * 2 },
    { freq: 5, amp: baseVariation * 0.15, phase: Math.random() * Math.PI * 2 },
    { freq: 7, amp: baseVariation * 0.08, phase: Math.random() * Math.PI * 2 },
  ];
  const offsets = [];
  for (let i = 0; i < points; i++) {
    const a = (i / points) * Math.PI * 2;
    let r = 1;
    for (const s of seeds) r += Math.sin(a * s.freq + s.phase) * s.amp;
    offsets.push(Math.max(0.45, r));
  }
  return { offsets };
}

function tracePath(cx, cy, baseR, offsets, points) {
  ctx.beginPath();
  for (let i = 0; i <= points; i++) {
    const a = (i / points) * Math.PI * 2;
    const r = baseR * offsets[i % points];
    const px = cx + Math.cos(a) * r;
    const py = cy + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

// ---------- watercolor blots ----------
function createBlot() {
  const points = 80;
  const shape = makeShape(points, 0.22);
  const innerShape = makeShape(points, 0.18);

  const fiberCount = 14 + Math.floor(Math.random() * 10);
  const fibers = Array.from({length: fiberCount}, () => ({
    angle: Math.random() * Math.PI * 2,
    length: 0.4 + Math.random() * 0.8,
    curve: (Math.random() - 0.5) * 0.5,
    width: 1.5 + Math.random() * 3
  }));

  const dCount = 1 + Math.floor(Math.random() * 3);
  const droplets = Array.from({length: dCount}, () => ({
    angle: Math.random() * Math.PI * 2,
    dist: 0.85 + Math.random() * 0.8,
    size: 0.05 + Math.random() * 0.15,
    shape: makeShape(40, 0.25)
  }));

  const granules = [];
  for (let i = 0; i < 30; i++) {
    granules.push({
      angle: Math.random() * Math.PI * 2,
      dist: Math.random() * 0.85,
      size: 8 + Math.random() * 18,
      alpha: 0.1 + Math.random() * 0.18
    });
  }

  return {
    x: W * 0.15 + Math.random() * W * 0.7,
    y: H * 0.15 + Math.random() * H * 0.7,
    baseColor: palette[Math.floor(Math.random() * palette.length)],
    maxRadius: Math.min(W, H) * (0.08 + Math.random() * 0.12),
    radius: 0,
    growSpeed: 0.6 + Math.random() * 1.0,
    life: 0,
    maxLife: 900 + Math.random() * 500,
    points,
    shape,
    innerShape,
    fibers,
    droplets,
    granules,
    breathPhase: Math.random() * Math.PI * 2,
    breathSpeed: 0.008 + Math.random() * 0.006,
    breathAmp: 0.025 + Math.random() * 0.025
  };
}

function updateBlot(b) {
  if (b.radius < b.maxRadius) {
    b.radius += b.growSpeed;
    b.growSpeed *= 0.994;
  }
  b.breathPhase += b.breathSpeed;
  b.life++;
}

function drawBlot(b) {
  if (b.radius < 1) return;

  const breath = 1 + Math.sin(b.breathPhase) * b.breathAmp;
  const r = b.radius * breath;

  let alpha;
  if (b.life < 80) alpha = Math.min(1, b.life / 80) * 0.92;
  else if (b.life > b.maxLife - 280) alpha = Math.max(0, (b.maxLife - b.life) / 280) * 0.92;
  else alpha = 0.92;

  ctx.save();

  // outer bleed halo
  const bleedSize = r * 1.7;
  const outerGrad = ctx.createRadialGradient(b.x, b.y, r * 0.4, b.x, b.y, bleedSize);
  outerGrad.addColorStop(0, b.baseColor + '55');
  outerGrad.addColorStop(0.35, b.baseColor + '33');
  outerGrad.addColorStop(0.7, b.baseColor + '11');
  outerGrad.addColorStop(1, b.baseColor + '00');
  ctx.globalAlpha = alpha * 0.6;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = outerGrad;
  ctx.beginPath();
  ctx.arc(b.x, b.y, bleedSize, 0, Math.PI * 2);
  ctx.fill();

  // fiber wisps matched to gradient edge color
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = alpha * 0.35;
  for (const f of b.fibers) {
    const x1 = b.x + Math.cos(f.angle) * r * 0.85;
    const y1 = b.y + Math.sin(f.angle) * r * 0.85;
    const x2 = b.x + Math.cos(f.angle + f.curve) * r * 1.05;
    const y2 = b.y + Math.sin(f.angle + f.curve) * r * 1.05;
    const x3 = b.x + Math.cos(f.angle + f.curve * 1.3) * r * (1.15 + f.length * 0.5);
    const y3 = b.y + Math.sin(f.angle + f.curve * 1.3) * r * (1.15 + f.length * 0.5);
    const fiberGrad = ctx.createLinearGradient(x1, y1, x3, y3);
    fiberGrad.addColorStop(0, b.baseColor + '00');
    fiberGrad.addColorStop(0.3, b.baseColor + '33');
    fiberGrad.addColorStop(0.6, b.baseColor + '1a');
    fiberGrad.addColorStop(1, b.baseColor + '00');
    ctx.strokeStyle = fiberGrad;
    ctx.lineWidth = f.width * 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.quadraticCurveTo(x2, y2, x3, y3);
    ctx.stroke();
  }

  // main pool (light)
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = alpha * 0.7;
  const mainGrad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r);
  mainGrad.addColorStop(0, b.baseColor + '88');
  mainGrad.addColorStop(0.5, b.baseColor + '66');
  mainGrad.addColorStop(0.85, b.baseColor + '33');
  mainGrad.addColorStop(1, b.baseColor + '00');
  ctx.fillStyle = mainGrad;
  tracePath(b.x, b.y, r, b.shape.offsets, b.points);
  ctx.fill();

  // inner subtle pigment
  ctx.globalCompositeOperation = 'multiply';
  ctx.globalAlpha = alpha * 0.25;
  const innerGrad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r * 0.6);
  innerGrad.addColorStop(0, b.baseColor + '66');
  innerGrad.addColorStop(1, b.baseColor + '00');
  ctx.fillStyle = innerGrad;
  tracePath(b.x, b.y, r * 0.6, b.innerShape.offsets, b.points);
  ctx.fill();

  // soft granulation
  ctx.globalCompositeOperation = 'multiply';
  for (const g of b.granules) {
    const gx = b.x + Math.cos(g.angle) * r * g.dist;
    const gy = b.y + Math.sin(g.angle) * r * g.dist;
    ctx.globalAlpha = alpha * g.alpha * 0.15;
    const gGrad = ctx.createRadialGradient(gx, gy, 0, gx, gy, g.size);
    gGrad.addColorStop(0, b.baseColor + '44');
    gGrad.addColorStop(0.6, b.baseColor + '15');
    gGrad.addColorStop(1, b.baseColor + '00');
    ctx.fillStyle = gGrad;
    ctx.beginPath();
    ctx.arc(gx, gy, g.size, 0, Math.PI * 2);
    ctx.fill();
  }

  // satellite droplets
  ctx.globalCompositeOperation = 'multiply';
  ctx.globalAlpha = alpha * 0.5;
  for (const d of b.droplets) {
    const dx = b.x + Math.cos(d.angle) * r * d.dist;
    const dy = b.y + Math.sin(d.angle) * r * d.dist;
    const dr = r * d.size;
    const dropGrad = ctx.createRadialGradient(dx, dy, 0, dx, dy, dr * 1.4);
    dropGrad.addColorStop(0, b.baseColor + '99');
    dropGrad.addColorStop(0.6, b.baseColor + '55');
    dropGrad.addColorStop(1, b.baseColor + '00');
    ctx.fillStyle = dropGrad;
    tracePath(dx, dy, dr, d.shape.offsets, 40);
    ctx.fill();
  }

  // wet highlight
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = alpha * 0.1;
  const hl = ctx.createRadialGradient(b.x - r * 0.2, b.y - r * 0.2, 0, b.x - r * 0.2, b.y - r * 0.2, r * 0.6);
  hl.addColorStop(0, '#ffffff');
  hl.addColorStop(1, '#ffffff00');
  ctx.fillStyle = hl;
  ctx.beginPath();
  ctx.arc(b.x - r * 0.2, b.y - r * 0.2, r * 0.6, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// ---------- calligraphy strokes ----------
function createStroke() {
  const startX = W * (0.15 + Math.random() * 0.7);
  const startY = H * (0.15 + Math.random() * 0.7);

  const segCount = 2 + Math.floor(Math.random() * 3);
  const segments = [];
  let px = startX, py = startY;
  let prevAngle = Math.random() * Math.PI * 2;

  for (let i = 0; i < segCount; i++) {
    const len = Math.min(W, H) * (0.08 + Math.random() * 0.18);
    const angle = prevAngle + (Math.random() - 0.5) * Math.PI * 1.2;
    const ex = px + Math.cos(angle) * len;
    const ey = py + Math.sin(angle) * len;
    const cx1 = px + Math.cos(angle + (Math.random() - 0.5)) * len * 0.4;
    const cy1 = py + Math.sin(angle + (Math.random() - 0.5)) * len * 0.4;
    const cx2 = ex - Math.cos(angle + (Math.random() - 0.5)) * len * 0.4;
    const cy2 = ey - Math.sin(angle + (Math.random() - 0.5)) * len * 0.4;
    segments.push({ x1: px, y1: py, cx1, cy1, cx2, cy2, x2: ex, y2: ey });
    px = ex;
    py = ey;
    prevAngle = angle;
  }

  // sample positions in LOCAL coords (relative to start point) — so we can deform freely
  const totalSamples = 70;
  const baseSamples = [];
  for (let i = 0; i <= totalSamples; i++) {
    const t = i / totalSamples;
    const segT = t * segCount;
    const segIdx = Math.min(segCount - 1, Math.floor(segT));
    const localT = segT - segIdx;
    const s = segments[segIdx];
    const u = 1 - localT;
    const x = u*u*u*s.x1 + 3*u*u*localT*s.cx1 + 3*u*localT*localT*s.cx2 + localT*localT*localT*s.x2;
    const y = u*u*u*s.y1 + 3*u*u*localT*s.cy1 + 3*u*localT*localT*s.cy2 + localT*localT*localT*s.y2;
    const taperEnd = Math.pow(1 - t, 0.6);
    const taperStart = Math.min(1, t * 4);
    const wobble = 0.7 + Math.sin(t * 12) * 0.15 + Math.random() * 0.15;
    baseSamples.push({
      bx: x, by: y, // base (rest) position
      pressure: taperStart * taperEnd * wobble,
      // per-sample deformation seeds for organic wobble
      seedA: Math.random() * Math.PI * 2,
      seedB: Math.random() * Math.PI * 2,
      ink: [] // ink dabs along this sample, generated when first revealed
    });
  }

  // exit direction: along the stroke's principal axis (its longest direction)
  // computed via PCA-like approach on the sample positions
  let cx = 0, cy = 0;
  for (const s of baseSamples) { cx += s.bx; cy += s.by; }
  cx /= baseSamples.length;
  cy /= baseSamples.length;

  // covariance matrix
  let sxx = 0, syy = 0, sxy = 0;
  for (const s of baseSamples) {
    const dx = s.bx - cx;
    const dy = s.by - cy;
    sxx += dx * dx;
    syy += dy * dy;
    sxy += dx * dy;
  }
  // principal axis = eigenvector of covariance with largest eigenvalue
  const theta = 0.5 * Math.atan2(2 * sxy, sxx - syy);
  let dirX = Math.cos(theta);
  let dirY = Math.sin(theta);

  // pick the sign that points from tail (sample 0) toward head (last sample)
  const headSample = baseSamples[baseSamples.length - 1];
  const headDx = headSample.bx - cx;
  const headDy = headSample.by - cy;
  if (dirX * headDx + dirY * headDy < 0) {
    dirX = -dirX;
    dirY = -dirY;
  }

  return {
    baseSamples,
    maxRadius: Math.min(W, H) * (0.012 + Math.random() * 0.012),
    progress: 0,
    drawSpeed: 0.012 + Math.random() * 0.01,
    revealedTo: 0,
    life: 0,
    holdFrames: 90 + Math.random() * 60,
    headX: 0,
    headY: 0,
    dirX, dirY,
    centroidX: cx,
    centroidY: cy,
    wavePhase: 0,
    waveSpeed: 0.06 + Math.random() * 0.03,
    waveFreq: 0.18 + Math.random() * 0.08,
    waveAmp: 0,
    crawlSpeed: 0,
    crawlSpeedTarget: 1.4 + Math.random() * 0.8,
    crawlAccel: 0.005 + Math.random() * 0.003,
    fade: 1,
    crawlFrames: 0,
    unfold: 0, // 0 = curled (original shape), 1 = fully straightened along axis
    rotation: 0,
    rotationSpeed: (Math.random() - 0.5) * 0.003 // radians per frame, very gentle
  };
}

// pre-generate ink "dabs" for a sample at its current revealed position
// these dabs are stored in local offsets so they follow when the sample moves
function generateDabs(sample, maxRadius) {
  const r = Math.max(0.4, maxRadius * sample.pressure);
  const dabs = [];
  // main ink dab at center
  dabs.push({ ox: 0, oy: 0, radius: r, alpha: 0.9 });
  // dry brush split (parallel offset)
  if (Math.random() < 0.4 && r > 1) {
    const offset = (Math.random() - 0.5) * r * 1.2;
    dabs.push({ ox: 0, oy: 0, perp: offset, radius: 0.5, alpha: 0.4, thin: true });
  }
  // scatter dot near thick parts
  if (sample.pressure > 0.5 && Math.random() < 0.2) {
    const sa = Math.random() * Math.PI * 2;
    const sd = r * (0.8 + Math.random() * 0.8);
    dabs.push({
      ox: Math.cos(sa) * sd,
      oy: Math.sin(sa) * sd,
      radius: 0.4 + Math.random() * 0.7,
      alpha: 0.25,
      scatter: true
    });
  }
  sample.ink = dabs;
}

// compute live (deformed) position of a sample based on worm wave + crawl + unfolding
function samplePos(s, idx) {
  const base = s.baseSamples[idx];
  const t = idx / s.baseSamples.length;

  // unfolded position: project the base point onto the principal axis through centroid
  const dx = base.bx - s.centroidX;
  const dy = base.by - s.centroidY;
  const along = dx * s.dirX + dy * s.dirY;
  const straightX = s.centroidX + s.dirX * along;
  const straightY = s.centroidY + s.dirY * along;

  // interpolate between curled (base) and straight, based on unfold amount
  const u = s.unfold;
  let bx = base.bx + (straightX - base.bx) * u;
  let by = base.by + (straightY - base.by) * u;

  // rotate around centroid
  if (s.rotation !== 0) {
    const rx = bx - s.centroidX;
    const ry = by - s.centroidY;
    const cos = Math.cos(s.rotation);
    const sin = Math.sin(s.rotation);
    bx = s.centroidX + rx * cos - ry * sin;
    by = s.centroidY + rx * sin + ry * cos;
  }

  // body wave: traveling sine along the body, perpendicular to current direction
  const phase = s.wavePhase - t * s.waveFreq * s.baseSamples.length * 0.5;
  const wave = Math.sin(phase) * s.waveAmp;
  // perpendicular needs to follow rotation too
  const cos = Math.cos(s.rotation);
  const sin = Math.sin(s.rotation);
  const dirRX = s.dirX * cos - s.dirY * sin;
  const dirRY = s.dirX * sin + s.dirY * cos;
  const perpX = -dirRY;
  const perpY = dirRX;
  // small per-sample organic jitter
  const jitterA = Math.sin(s.wavePhase * 0.7 + base.seedA) * s.waveAmp * 0.25;
  const jitterB = Math.cos(s.wavePhase * 0.5 + base.seedB) * s.waveAmp * 0.25;

  return {
    x: bx + s.headX + perpX * wave + jitterA,
    y: by + s.headY + perpY * wave + jitterB
  };
}

function updateStroke(s) {
  s.life++;

  // reveal more samples while drawing
  if (s.progress < 1) {
    s.progress = Math.min(1, s.progress + s.drawSpeed);
    const target = Math.floor(s.progress * s.baseSamples.length);
    while (s.revealedTo < target && s.revealedTo < s.baseSamples.length) {
      generateDabs(s.baseSamples[s.revealedTo], s.maxRadius);
      s.revealedTo++;
    }
  } else {
    // start crawling after hold
    if (s.life > s.holdFrames) {
      s.crawlFrames++;
      // ease in motion
      s.crawlSpeed += (s.crawlSpeedTarget - s.crawlSpeed) * s.crawlAccel * 60;
      s.waveAmp += (5 - s.waveAmp) * 0.04;
      s.wavePhase += s.waveSpeed;
      s.headX += s.dirX * s.crawlSpeed;
      s.headY += s.dirY * s.crawlSpeed;
      // gradual unfolding: the worm straightens out as it leaves
      s.unfold = Math.min(1, s.unfold + 0.018);
      // gentle rotation drift while crawling away
      s.rotation += s.rotationSpeed;
      // fade out over ~120 frames once crawl starts
      s.fade = Math.max(0, 1 - s.crawlFrames / 120);
    }
  }
}

function drawStroke(s) {
  if (s.revealedTo === 0) return;
  if (s.fade <= 0) return;

  ctx.save();
  ctx.globalAlpha = s.fade;
  ctx.globalCompositeOperation = 'multiply';
  ctx.lineCap = 'round';

  // draw line segments between consecutive deformed positions
  for (let i = 0; i < s.revealedTo - 1; i++) {
    const a = samplePos(s, i);
    const b = samplePos(s, i + 1);
    const sample = s.baseSamples[i];
    const r = Math.max(0.4, s.maxRadius * sample.pressure);

    // main ink stroke
    ctx.strokeStyle = `rgba(20, 18, 22, 0.88)`;
    ctx.lineWidth = r * 2;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();

    // dry brush parallel line
    for (const dab of sample.ink) {
      if (dab.thin) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len;
        const ny = dx / len;
        ctx.strokeStyle = `rgba(30, 25, 30, ${dab.alpha})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(a.x + nx * dab.perp, a.y + ny * dab.perp);
        ctx.lineTo(b.x + nx * dab.perp, b.y + ny * dab.perp);
        ctx.stroke();
      } else if (dab.scatter) {
        ctx.fillStyle = `rgba(20, 18, 22, ${dab.alpha})`;
        ctx.beginPath();
        ctx.arc(a.x + dab.ox, a.y + dab.oy, dab.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  ctx.restore();
}

function strokeOffscreen(s) {
  if (s.revealedTo === 0) return false;
  // check via head extents: when head pushed enough that all base positions are out
  const pad = s.maxRadius * 4 + Math.abs(s.waveAmp) * 2;
  let allOut = true;
  for (let i = 0; i < s.revealedTo; i += 5) {
    const p = samplePos(s, i);
    if (p.x > -pad && p.x < W + pad && p.y > -pad && p.y < H + pad) {
      allOut = false;
      break;
    }
  }
  return allOut;
}

// ---------- main loop ----------
let lastBlotSpawn = 0;
let lastStrokeSpawn = 0;

function loop(t) {
  if (t - lastBlotSpawn > 500 + Math.random() * 900 && blots.length < 10) {
    blots.push(createBlot());
    lastBlotSpawn = t;
  }
  if (t - lastStrokeSpawn > 600 + Math.random() * 700 && strokes.length < 10) {
    strokes.push(createStroke());
    lastStrokeSpawn = t;
  }

  blots = blots.filter(b => b.life < b.maxLife);
  strokes = strokes.filter(s => !strokeOffscreen(s) && s.fade > 0);

  drawPaper();

  for (const b of blots) {
    updateBlot(b);
    drawBlot(b);
  }
  for (const s of strokes) {
    updateStroke(s);
    drawStroke(s);
  }

  requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
resize();
for (let i = 0; i < 4; i++) blots.push(createBlot());
requestAnimationFrame(loop);
</script>
