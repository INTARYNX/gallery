<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html,body{margin:0;padding:0;background:#000;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #wrap{position:relative;width:min(100vw,100vh);height:min(100vw,100vh)}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const S = 720;
cv.width = cv.height = S;

function mkCanvas(w,h){ const c=document.createElement('canvas'); c.width=w||S; c.height=h||w||S; return c; }
let sceneA = mkCanvas(S), sceneB = mkCanvas(S);
let sctxA = sceneA.getContext('2d'), sctxB = sceneB.getContext('2d');
const bloom1 = mkCanvas(S), bloom2 = mkCanvas(S);
const bctx1 = bloom1.getContext('2d'), bctx2 = bloom2.getContext('2d');

const SLEN = 4096, S2PI = SLEN/(Math.PI*2);
const SIN = new Float32Array(SLEN);
for(let i=0;i<SLEN;i++) SIN[i] = Math.sin(i/S2PI);
function sinL(x){ return SIN[((x*S2PI)|0) & (SLEN-1)]; }

function fatan2(y, x){
  const ax=Math.abs(x), ay=Math.abs(y);
  const a=(ax>ay?ay/ax:ax/ay)||0, s=a*a;
  let r=((-0.0464964749*s+0.15931422)*s-0.327622764)*s*a+a;
  if(ay>ax) r=1.57079637-r;
  if(x<0)   r=3.14159274-r;
  return y<0?-r:r;
}

function hex2rgb(c){ return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]; }

// Palette sanglante de base
const PAL_BASE = ['#0a0000','#3a0000','#7a0000','#cc0000','#ff2200','#ff6600','#ff0033'].map(hex2rgb);

// Palettes de rupture — toujours dans les rouges/noirs
const PAL_ALTS = [
  ['#000000','#1a0000','#550000','#990000','#dd1100','#ff4400','#ff0000'].map(hex2rgb),
  ['#050000','#200000','#600000','#a00000','#cc0000','#ff2200','#ff8800'].map(hex2rgb),
];

let palCurrent = PAL_BASE.map(c=>[...c]);
let palTarget  = PAL_BASE.map(c=>[...c]);
let palBlend = 0, palSpeed = 0;
let nextRupture = 300;

const LUT = new Uint8Array(256*3);
function buildLUT(pal){
  for(let i=0;i<256;i++){
    const f=i/256*pal.length, j=Math.floor(f), k=f-j, e=k*k*(3-2*k);
    const a=pal[j%pal.length], b=pal[(j+1)%pal.length];
    LUT[i*3]  =a[0]*(1-e)+b[0]*e;
    LUT[i*3+1]=a[1]*(1-e)+b[1]*e;
    LUT[i*3+2]=a[2]*(1-e)+b[2]*e;
  }
}
buildLUT(palCurrent);

let t=0, hueShift=0;

function updatePalette(){
  // hue shift lent
  hueShift += 0.0004;

  // rupture occasionnelle
  if(--nextRupture <= 0){
    palTarget = PAL_ALTS[(Math.random()*PAL_ALTS.length)|0].map(c=>[...c]);
    palSpeed = 0.018;
    nextRupture = 400 + (Math.random()*600)|0;
  }

  if(palSpeed > 0){
    palBlend = Math.min(1, palBlend + palSpeed);
    const e = palBlend*palBlend*(3-2*palBlend);
    const interp = palCurrent.map((a,i)=>a.map((v,j)=>v*(1-e)+palTarget[i][j]*e));
    if(palBlend >= 1){
      palCurrent = palTarget.map(c=>[...c]);
      palTarget  = PAL_BASE.map(c=>[...c]);
      palBlend   = 0;
      palSpeed   = 0.006; // retour plus lent
    }
    buildLUT(interp);
  }
}

function makeVortexLayer(RES){
  const c=mkCanvas(RES), c2d=c.getContext('2d');
  const N=RES*RES;
  const xArr=new Float32Array(N), yArr=new Float32Array(N);
  const rArr=new Float32Array(N), mask=new Uint8Array(N);
  for(let py=0;py<RES;py++) for(let px=0;px<RES;px++){
    const i=py*RES+px, x=(px/RES-0.5)*2, y=(py/RES-0.5)*2, r=Math.sqrt(x*x+y*y);
    if(r>1.25) continue;
    mask[i]=1; xArr[i]=x; yArr[i]=y; rArr[i]=r;
  }
  return {c,c2d,RES,img:c2d.createImageData(RES,RES),xArr,yArr,rArr,mask};
}

const HD = makeVortexLayer(480);

function renderVortex(L){
  const {RES,img,xArr,yArr,rArr,mask}=L;
  const d=img.data;
  const tw=t*0.04, t3=t*0.03, t7=t*0.07;
  for(let i=0,n=RES*RES;i<n;i++){
    const o=i*4;
    if(!mask[i]){d[o+3]=0;continue;}
    const rawX=xArr[i], rawY=yArr[i], rawR=rArr[i];
    const tilt=rawR*8*(20*Math.PI/180);
    const ct=Math.cos(tilt), st=Math.sin(tilt);
    const rx=ct*rawX+st*rawY, ry=-st*rawX+ct*rawY;
    const eggY=ry*(ry>0?1.5:1.0);
    const dx=rx, y=eggY, r=Math.sqrt(dx*dx+y*y);
    if(r>1){d[o+3]=0;continue;}
    const angle=fatan2(y,dx), depth=6/(r+0.18), sw=angle+depth+tw;
    const spiral1=sinL(sw*2+Math.sqrt(r)*4)*0.5+0.5;
    const spiral2=sinL(sw*2+Math.sqrt(r)*4+t*0.011)*0.5+0.5;
    let band=Math.max(spiral1,spiral2); band=band*band;
    const r2=r*r, fall=1-r2, aFall=1-r2*r2*r2;
    band*=0.85+0.15*sinL(sw*7-t7+r*20);
    const lum=band*fall*(0.45+0.2*sinL(t3+r*6));
    const ci=(((angle+depth)/(Math.PI*2))%1+1+t*0.0003+hueShift)%1;
    const li=(ci*256)|0;
    d[o]  =LUT[li*3]  *lum;
    d[o+1]=LUT[li*3+1]*lum;
    d[o+2]=LUT[li*3+2]*lum;
    d[o+3]=255*lum*aFall;
  }
  L.c2d.putImageData(img,0,0);
}

// warping du feedback via offscreen avec déformation sinusoïdale
const warpOff = mkCanvas(S);
const wctx = warpOff.getContext('2d');

function drawScene(sctx, prev){
  // warp : on dessine le prev avec une déformation par bandes
  wctx.clearRect(0,0,S,S);
  const bands=32, bh=S/bands;
  for(let i=0;i<bands;i++){
    const y=i*bh;
    const dx=sinL(t*0.031+i*0.41)*3.5;
    const dy=sinL(t*0.019+i*0.67)*2.0;
    wctx.drawImage(prev, 0,y,S,bh, dx,y+dy,S,bh);
  }

  sctx.globalAlpha=0.84;
  sctx.save();
  sctx.translate(S/2,S/2);
  sctx.rotate(Math.sin(t*0.004)*0.012);
  sctx.scale(1.011,1.011);
  sctx.drawImage(warpOff,-S/2,-S/2);
  sctx.restore();
  sctx.globalAlpha=1;
  sctx.fillStyle='rgba(0,0,0,0.2)';
  sctx.fillRect(0,0,S,S);
  // brume animée
  sctx.globalCompositeOperation='screen';
  sctx.globalAlpha=0.35+0.15*sinL(t*0.007);
  sctx.save();
  sctx.translate(sinL(t*0.003)*20, sinL(t*0.005+1)*15);
  sctx.drawImage(mist,0,0);
  sctx.restore();
  sctx.globalAlpha=1;
  sctx.globalCompositeOperation='source-over';
}

function vortex(sctx){
  renderVortex(HD);
  const breath=Math.sin(t*0.008)*0.5+0.5;
  const pulse=Math.sin(t*0.0371)*0.07+Math.sin(t*0.0193+2.3)*0.09
             +Math.sin(t*0.0517+0.7)*0.05+Math.sin(t*0.0083+4.1)*0.11
             +Math.sin(t*0.0251+1.1)*0.04;
  const ease=breath*breath*(3-2*breath);
  const size=S*(0.65+ease*0.55+pulse);
  const ox=Math.sin(t*0.011)*S*0.04*(1-ease);
  const oy=Math.cos(t*0.009)*S*0.04*(1-ease);

  sctx.globalCompositeOperation='lighter';
  sctx.imageSmoothingEnabled=true;
  sctx.imageSmoothingQuality='high';
  sctx.save();
  sctx.translate(S/2+ox,S/2+oy);
  sctx.rotate(t*0.005);
  sctx.filter='blur(18px)';
  sctx.globalAlpha=0.6;
  sctx.drawImage(HD.c,-size*1.08/2,-size*1.08/2,size*1.08,size*1.08);
  sctx.filter='none';
  sctx.globalAlpha=1;
  sctx.drawImage(HD.c,-size/2,-size/2,size,size);
  sctx.restore();
  sctx.globalCompositeOperation='source-over';
}

function applyBloom(src){
  // isoler zones lumineuses
  bctx1.clearRect(0,0,S,S);
  bctx1.drawImage(src,0,0);
  // threshold via multiply
  bctx1.globalCompositeOperation='multiply';
  bctx1.fillStyle='rgba(255,255,255,0.6)';
  bctx1.fillRect(0,0,S,S);
  bctx1.globalCompositeOperation='source-over';

  // blur fort
  bctx2.clearRect(0,0,S,S);
  bctx2.filter='blur(12px)';
  bctx2.drawImage(bloom1,0,0);
  bctx2.filter='blur(24px)';
  bctx2.globalAlpha=0.5;
  bctx2.drawImage(bloom1,0,0);
  bctx2.globalAlpha=1;
  bctx2.filter='none';

  // réinjecter en additif
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=0.45;
  ctx.drawImage(bloom2,0,0);
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
}

const scan=mkCanvas(S);
{ const sc=scan.getContext('2d'); sc.fillStyle='rgba(0,0,0,0.22)'; for(let y=0;y<S;y+=2) sc.fillRect(0,y,S,1); }
const NOISE=[];
for(let f=0;f<4;f++){
  const n=mkCanvas(S), nc=n.getContext('2d');
  nc.fillStyle='rgba(255,80,0,0.07)';
  for(let i=0;i<180;i++) nc.fillRect(Math.random()*S,Math.random()*S,2,2);
  NOISE.push(n);
}
const vig=mkCanvas(S);
{
  const vc=vig.getContext('2d');
  const vg=vc.createRadialGradient(S/2,S/2,S*0.25,S/2,S/2,S*0.75);
  vg.addColorStop(0,'transparent');
  vg.addColorStop(1,'rgba(0,0,0,0.7)');
  vc.fillStyle=vg; vc.fillRect(0,0,S,S);
}

function loop(){
  t++;
  updatePalette();
  drawScene(sctxB, sceneA);
  vortex(sctxB);

  ctx.drawImage(sceneB,0,0);
  applyBloom(sceneB);
  ctx.drawImage(scan,0,0);
  ctx.drawImage(NOISE[t&3],0,0);
  ctx.drawImage(vig,0,0);

  [sceneA,sceneB]=[sceneB,sceneA];
  [sctxA,sctxB]=[sctxB,sctxA];
  requestAnimationFrame(loop);
}

sctxA.fillStyle='#000000';
sctxA.fillRect(0,0,S,S);

// brume sombre précalculée
const mist = mkCanvas(S);
{
  const mc = mist.getContext('2d');
  for(let layer=0; layer<6; layer++){
    const cx = S*(0.2+Math.random()*0.6), cy = S*(0.2+Math.random()*0.6);
    const rx = S*(0.3+Math.random()*0.4), ry = S*(0.2+Math.random()*0.3);
    const g = mc.createRadialGradient(cx,cy,0,cx,cy,Math.max(rx,ry));
    g.addColorStop(0,`rgba(${20+layer*4},${2+layer},${2+layer},0.18)`);
    g.addColorStop(1,'transparent');
    mc.fillStyle=g;
    mc.save();
    mc.translate(cx,cy);
    mc.scale(rx/Math.max(rx,ry), ry/Math.max(rx,ry));
    mc.translate(-cx,-cy);
    mc.fillRect(0,0,S,S);
    mc.restore();
  }
}
loop();
</script>
</body>
</html>
