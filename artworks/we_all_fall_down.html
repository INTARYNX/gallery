<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>We All Fall Down</title>
  <style>
    body{margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#08070a;overflow:hidden}
    canvas{box-shadow:0 0 60px rgba(180,140,80,0.06),0 0 120px rgba(0,0,0,0.5);border-radius:4px}

<body>
<canvas id="canvas"></canvas>
<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d',{alpha:false});
const S=Math.min(window.innerWidth,window.innerHeight,600);
canvas.width=S;canvas.height=S;
const SC=S/500,CX=S/2,CY=S/2;
const TY=Math.round(S*0.12),BY=Math.round(S*0.88),NY=Math.round(S*0.50);
const allSand=[],maxP=4500,PS=Math.max(2,Math.round(2*SC));
let frame=0;

// Flip animation
let flipPhase=0; // 0=flipping, 1=settling, 2=running
let flipAngle=Math.PI; // start upside down
const FLIP_DURATION=90; // frames for flip
const SETTLE_DURATION=30; // small bounce settle
let sandInited=false;

// Zoom state
let zoomPhase=0,zoomStart=0,zoomLevel=1,zoomTargetX=0,zoomTargetY=0;
const ZOOM_DURATION=180;
const UNZOOM_DELAY=5;
const UNZOOM_DURATION=200;
let totalTop=0;
let unzoomStart=0;
let zoomCache=null,zoomCachePx=0,zoomCachePy=0;

const dust=Array.from({length:25},()=>({x:Math.random()*S,y:Math.random()*S,sz:Math.random()*1.2+.4,sx:(Math.random()-.5)*.3,sy:(Math.random()-.5)*.2-.1,op:Math.random()*.15+.03,ph:Math.random()*Math.PI*2}));

const GS=PS,GC=Math.ceil(S/GS),GR=Math.ceil(S/GS);
const grid=Array.from({length:GR},()=>Array.from({length:GC},()=>[]));
const offC=document.createElement('canvas');offC.width=S;offC.height=S;
const oc=offC.getContext('2d',{alpha:false});

/* ---- Wallpaper ---- */
const wpCanvas=document.createElement('canvas');wpCanvas.width=S;wpCanvas.height=S;
const wpCtx=wpCanvas.getContext('2d');
function buildWallpaper(){
  const c=wpCtx;
  const bg=c.createLinearGradient(0,0,0,S);
  bg.addColorStop(0,'#2a2028');bg.addColorStop(0.5,'#2e2530');bg.addColorStop(1,'#261828');
  c.fillStyle=bg;c.fillRect(0,0,S,S);
  const ps=S*0.1;
  c.globalAlpha=0.06;
  for(let py=0;py<S+ps;py+=ps){
    for(let px=0;px<S+ps;px+=ps){
      const ox=(Math.floor(py/ps)%2)*ps*0.5;
      const cx2=px+ox,cy2=py;
      c.fillStyle='#c8a070';
      c.beginPath();
      c.moveTo(cx2,cy2-ps*0.4);
      c.bezierCurveTo(cx2+ps*0.2,cy2-ps*0.2,cx2+ps*0.35,cy2-ps*0.05,cx2+ps*0.35,cy2);
      c.bezierCurveTo(cx2+ps*0.35,cy2+ps*0.05,cx2+ps*0.2,cy2+ps*0.2,cx2,cy2+ps*0.4);
      c.bezierCurveTo(cx2-ps*0.2,cy2+ps*0.2,cx2-ps*0.35,cy2+ps*0.05,cx2-ps*0.35,cy2);
      c.bezierCurveTo(cx2-ps*0.35,cy2-ps*0.05,cx2-ps*0.2,cy2-ps*0.2,cx2,cy2-ps*0.4);
      c.closePath();c.fill();
      c.beginPath();
      c.moveTo(cx2,cy2-ps*0.2);
      c.bezierCurveTo(cx2+ps*0.1,cy2-ps*0.1,cx2+ps*0.18,cy2,cx2+ps*0.18,cy2);
      c.bezierCurveTo(cx2+ps*0.18,cy2,cx2+ps*0.1,cy2+ps*0.1,cx2,cy2+ps*0.2);
      c.bezierCurveTo(cx2-ps*0.1,cy2+ps*0.1,cx2-ps*0.18,cy2,cx2-ps*0.18,cy2);
      c.bezierCurveTo(cx2-ps*0.18,cy2,cx2-ps*0.1,cy2-ps*0.1,cx2,cy2-ps*0.2);
      c.closePath();c.fill();
      c.beginPath();c.arc(cx2,cy2-ps*0.28,ps*0.04,0,Math.PI*2);c.fill();
      c.beginPath();c.arc(cx2,cy2+ps*0.28,ps*0.04,0,Math.PI*2);c.fill();
      c.beginPath();c.arc(cx2-ps*0.28,cy2,ps*0.03,0,Math.PI*2);c.fill();
      c.beginPath();c.arc(cx2+ps*0.28,cy2,ps*0.03,0,Math.PI*2);c.fill();
    }
  }
  c.globalAlpha=0.03;
  for(let x=0;x<S;x+=3){c.fillStyle=x%6<3?'#a08060':'#000';c.fillRect(x,0,1,S);}
  c.globalAlpha=1;
  const vig=c.createRadialGradient(CX,CY,S*0.15,CX,CY,S*0.7);
  vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,0.35)');
  c.fillStyle=vig;c.fillRect(0,0,S,S);
}

/* ---- Skull ---- */
function drawSkull(c,x,y,size,r,g,b,alpha,sv){
  const sz=size;
  c.globalAlpha=alpha;
  const bR=Math.min(255,r+20),bG=Math.min(255,g+10),bB=Math.min(255,b-10);
  const dR=Math.max(0,r-80),dG=Math.max(0,g-80),dB=Math.max(0,b-60);
  const hR=Math.min(255,r+60),hG=Math.min(255,g+50),hB=Math.min(255,b+30);
  c.fillStyle='rgba(0,0,0,0.5)';
  c.beginPath();c.ellipse(x+sz*0.04,y-sz*0.06,sz*0.44,sz*0.50,0,0,Math.PI*2);c.fill();
  c.beginPath();c.ellipse(x+sz*0.03,y+sz*0.28+sz*sv.jawH*0.3,sz*sv.jawW*1.1,sz*sv.jawH*1.05,0,0,Math.PI);c.fill();
  const cg=c.createRadialGradient(x-sz*0.1,y-sz*0.25,sz*0.05,x,y-sz*0.1,sz*0.55);
  cg.addColorStop(0,`rgb(${hR},${hG},${hB})`);cg.addColorStop(0.5,`rgb(${bR},${bG},${bB})`);cg.addColorStop(1,`rgb(${dR},${dG},${dB})`);
  c.fillStyle=cg;c.beginPath();c.ellipse(x,y-sz*0.1,sz*0.42,sz*0.48,0,0,Math.PI*2);c.fill();
  const jg=c.createLinearGradient(x,y+sz*0.1,x,y+sz*0.5);
  jg.addColorStop(0,`rgb(${bR},${bG},${bB})`);jg.addColorStop(1,`rgb(${dR},${dG},${dB})`);
  c.fillStyle=jg;c.beginPath();c.ellipse(x,y+sz*0.28,sz*sv.jawW,sz*sv.jawH,0,0,Math.PI);c.fill();
  c.fillStyle=`rgb(${hR},${hG},${hB})`;
  c.beginPath();c.ellipse(x,y-sz*0.22,sz*0.38,sz*sv.browHeavy,0,Math.PI,Math.PI*2);c.fill();
  c.fillStyle=`rgba(${dR},${dG},${dB},0.6)`;
  c.beginPath();c.ellipse(x,y-sz*0.22+sz*sv.browHeavy,sz*0.36,sz*0.03,0,0,Math.PI);c.fill();
  const drawEye=(ex,ey,flip,yOff)=>{
    const sw=sz*sv.eyeW,sh=sz*sv.eyeH,sq=sv.eyeSquash;
    ey+=yOff;
    c.save();c.translate(ex,ey);c.rotate(sv.eyeSlant*flip);
    c.fillStyle=`rgba(${dR},${dG},${dB},0.4)`;
    c.beginPath();c.moveTo(0,-sh*1.05);
    c.bezierCurveTo(sw*1.1*flip,-sh*sq,sw*1.15*flip,sh*(1-sq),sw*0.7*flip,sh*0.9);
    c.lineTo(-sw*0.3*flip,sh*0.95);
    c.bezierCurveTo(-sw*1.0*flip,sh*0.5,-sw*0.9*flip,-sh*0.6,0,-sh*1.05);
    c.closePath();c.fill();
    const eg=c.createRadialGradient(sw*0.1*flip,-sh*0.1,sz*0.01,0,0,Math.max(sw,sh)*1.1);
    eg.addColorStop(0,'rgb(2,1,1)');eg.addColorStop(0.5,`rgb(${dR>>3},${dG>>3},${dB>>3})`);
    eg.addColorStop(0.85,`rgb(${dR>>2},${dG>>2},${dB>>2})`);eg.addColorStop(1,`rgb(${dR>>1},${dG>>1},${dB>>1})`);
    c.fillStyle=eg;c.beginPath();c.moveTo(0,-sh*0.85);
    c.bezierCurveTo(sw*0.95*flip,-sh*sq*0.8,sw*1.0*flip,sh*(0.8-sq*0.6),sw*0.55*flip,sh*0.75);
    c.lineTo(-sw*0.2*flip,sh*0.8);
    c.bezierCurveTo(-sw*0.8*flip,sh*0.35,-sw*0.7*flip,-sh*0.5,0,-sh*0.85);
    c.closePath();c.fill();
    c.strokeStyle=`rgba(${hR},${hG},${hB},0.3)`;c.lineWidth=sz*0.02;
    c.beginPath();c.moveTo(-sw*0.6*flip,-sh*0.7);
    c.bezierCurveTo(-sw*0.1*flip,-sh*1.0,sw*0.7*flip,-sh*0.85,sw*0.95*flip,-sh*0.4);
    c.stroke();c.restore();
  };
  drawEye(x-sz*sv.eyeSpacing,y-sz*0.11,1,-sz*sv.eyeYoff);
  drawEye(x+sz*sv.eyeSpacing,y-sz*0.11,-1,sz*sv.eyeYoff);
  const nx=x+sz*sv.noseSkew,ny=y+sz*0.06;
  const nw=sz*sv.noseW,nh=sz*sv.noseH,np=sv.nosePinch;
  c.fillStyle=`rgba(${dR},${dG},${dB},0.35)`;
  c.beginPath();c.moveTo(nx,ny-nh*0.6);
  c.bezierCurveTo(nx-nw*1.3,ny-nh*np,nx-nw*1.4,ny+nh*0.5,nx-nw*0.7,ny+nh*0.8);
  c.bezierCurveTo(nx-nw*0.2,ny+nh,nx+nw*0.2,ny+nh,nx+nw*0.7,ny+nh*0.8);
  c.bezierCurveTo(nx+nw*1.4,ny+nh*0.5,nx+nw*1.3,ny-nh*np,nx,ny-nh*0.6);
  c.closePath();c.fill();
  const ng=c.createRadialGradient(nx,ny+nh*0.1,sz*0.005,nx,ny+nh*0.15,Math.max(nw,nh)*1.2);
  ng.addColorStop(0,'rgb(2,1,1)');ng.addColorStop(0.6,`rgb(${dR>>3},${dG>>3},${dB>>3})`);ng.addColorStop(1,`rgb(${dR>>1},${dG>>1},${dB>>1})`);
  c.fillStyle=ng;c.beginPath();c.moveTo(nx,ny-nh*0.4);
  c.bezierCurveTo(nx-nw*1.0,ny-nh*np*0.6,nx-nw*1.1,ny+nh*0.4,nx-nw*0.5,ny+nh*0.7);
  c.bezierCurveTo(nx-nw*0.1,ny+nh*0.85,nx+nw*0.1,ny+nh*0.85,nx+nw*0.5,ny+nh*0.7);
  c.bezierCurveTo(nx+nw*1.1,ny+nh*0.4,nx+nw*1.0,ny-nh*np*0.6,nx,ny-nh*0.4);
  c.closePath();c.fill();
  c.strokeStyle=`rgba(${bR},${bG},${bB},0.25)`;c.lineWidth=sz*0.012;
  c.beginPath();c.moveTo(nx,ny-nh*0.2);c.lineTo(nx,ny+nh*0.65);c.stroke();
  c.fillStyle=`rgba(${hR},${hG},${hB},0.2)`;
  c.beginPath();c.ellipse(x-sz*0.25,y+sz*0.02,sz*0.08,sz*0.04,-0.3,0,Math.PI*2);c.fill();
  c.beginPath();c.ellipse(x+sz*0.25,y+sz*0.02,sz*0.08,sz*0.04,0.3,0,Math.PI*2);c.fill();
  for(const tooth of sv.teeth){
    const tcx=x+sz*tooth.cx,tcy=y+sz*(0.22+tooth.off);
    const tw2=sz*tooth.w*0.5,th2=sz*tooth.h;
    c.save();c.translate(tcx,tcy);c.rotate(tooth.rot);
    const tg=c.createLinearGradient(0,-th2*0.1,0,th2);
    tg.addColorStop(0,`rgb(${Math.min(255,bR+15)},${Math.min(255,bG+10)},${Math.min(255,bB+5)})`);
    tg.addColorStop(1,`rgb(${Math.max(0,bR-15)},${Math.max(0,bG-15)},${Math.max(0,bB-10)})`);
    c.fillStyle=tg;c.beginPath();
    if(tooth.chipped){c.moveTo(-tw2,0);c.lineTo(-tw2,th2*0.85);c.lineTo(-tw2*0.3,th2*0.7);c.lineTo(tw2*0.5,th2);c.lineTo(tw2,th2*0.9);c.lineTo(tw2,0);}
    else{c.moveTo(-tw2,0);c.lineTo(-tw2,th2*0.9);c.quadraticCurveTo(-tw2*0.3,th2*1.05,0,th2);c.quadraticCurveTo(tw2*0.3,th2*0.95,tw2,th2*0.85);c.lineTo(tw2,0);}
    c.closePath();c.fill();
    c.strokeStyle=`rgba(${dR},${dG},${dB},0.6)`;c.lineWidth=sz*0.012;c.stroke();
    c.fillStyle=`rgba(${hR},${hG},${hB},0.18)`;c.fillRect(-tw2*0.6,th2*0.05,tw2*1.2,th2*0.15);
    c.restore();
  }
  const cs=sv.crackSeed;
  c.strokeStyle=`rgba(${dR},${dG},${dB},0.5)`;c.lineWidth=sz*0.015;
  c.beginPath();c.moveTo(x-sz*0.05*cs,y-sz*0.55);c.lineTo(x-sz*(0.08+cs*0.06),y-sz*0.3);c.lineTo(x-sz*(0.14+cs*0.06),y-sz*0.15);c.stroke();
  c.beginPath();c.moveTo(x-sz*(0.08+cs*0.06),y-sz*0.3);c.lineTo(x-sz*0.02,y-sz*0.22);c.stroke();
  const sg2=c.createRadialGradient(x-sz*0.05,y-sz*0.38,0,x-sz*0.05,y-sz*0.38,sz*0.18);
  sg2.addColorStop(0,'rgba(255,255,240,0.2)');sg2.addColorStop(1,'rgba(255,255,240,0)');
  c.fillStyle=sg2;c.beginPath();c.ellipse(x-sz*0.05,y-sz*0.38,sz*0.18,sz*0.12,-0.2,0,Math.PI*2);c.fill();
  c.fillStyle='rgba(0,0,0,0.12)';
  c.beginPath();c.ellipse(x+sz*0.38,y-sz*0.05,sz*0.08,sz*0.3,0.1,0,Math.PI*2);c.fill();
  c.beginPath();c.ellipse(x-sz*0.38,y-sz*0.05,sz*0.08,sz*0.3,-0.1,0,Math.PI*2);c.fill();
  c.globalAlpha=1;
}

/* ---- Sand ---- */
class Sand{
  constructor(x,y,top){
    this.x=Math.round(x/PS)*PS;this.y=Math.round(y/PS)*PS;this.top=top!==false;
    this.gx=-1;this.gy=-1;
    this.sj=Math.random()<.15?1:0;
    const p=Math.random();
    if(p<0.3){this.br=210+(Math.random()*35)|0;this.bg=180+(Math.random()*30)|0;this.bb=120+(Math.random()*40)|0;}
    else if(p<0.6){this.br=190+(Math.random()*40)|0;this.bg=160+(Math.random()*30)|0;this.bb=100+(Math.random()*30)|0;}
    else if(p<0.85){this.br=230+(Math.random()*25)|0;this.bg=200+(Math.random()*25)|0;this.bb=150+(Math.random()*30)|0;}
    else{this.br=170+(Math.random()*30)|0;this.bg=140+(Math.random()*25)|0;this.bb=90+(Math.random()*25)|0;}
    this.r=this.br;this.g=this.bg;this.b=this.bb;
    this.shimmer=Math.random()*0.06;
    this.shimPh=Math.random()*Math.PI*2;
    this.drawOx=(Math.random()-0.5)*PS*0.6;
    this.drawOy=(Math.random()-0.5)*PS*0.6;
    this.skullRot=(Math.random()-0.5)*0.4;
    this.showSkull=Math.random()<0.28;
    const seed=this.br*7+this.bg*13+this.bb*3+Math.random()*1000;
    const sr=v=>Math.sin(seed+v)*0.5+0.5;
    this.eyeW=0.11+sr(1)*0.04;this.eyeH=0.12+sr(2)*0.04;
    this.eyeSlant=(sr(3)-0.5)*0.15;this.eyeSquash=0.7+sr(4)*0.6;
    this.eyeSpacing=0.14+sr(5)*0.04;this.eyeYoff=(sr(6)-0.5)*0.03;
    this.noseW=0.05+sr(7)*0.04;this.noseH=0.10+sr(8)*0.06;
    this.noseSkew=(sr(9)-0.5)*0.02;this.nosePinch=0.3+sr(10)*0.5;
    this.browHeavy=0.03+sr(11)*0.04;this.jawW=0.26+sr(12)*0.08;
    this.jawH=0.18+sr(13)*0.06;this.crackSeed=sr(14);
    this.teeth=[];
    const sn=v=>Math.sin(seed+v);
    let tx0=-0.19;
    while(tx0<0.18){
      const tw=0.045+((sn(tx0*50)*0.5+0.5)*0.03);
      const th=0.08+((sn(tx0*30+70)*0.5+0.5)*0.025);
      const toff=(sn(tx0*80+200)-0.5)*0.008;
      const rot=(sn(tx0*60+150)-0.5)*0.08;
      const chipped=sn(tx0*90+300)>0.85;
      const gap=0.003+Math.abs(sn(tx0*70+120))*0.004;
      this.teeth.push({cx:tx0+tw/2,w:tw,h:th,off:toff,rot:rot,chipped:chipped,gap:gap});
      tx0+=tw+gap;
    }
  }
  color(t){
    const sh=Math.sin(t*2+this.shimPh)*this.shimmer;
    this.r=Math.min(255,Math.max(0,(this.br*(1+sh))|0));
    this.g=Math.min(255,Math.max(0,(this.bg*(1+sh))|0));
    this.b=Math.min(255,Math.max(0,(this.bb*(1+sh))|0));
  }
}

/* ---- Hourglass shape ---- */
const hPath=new Path2D();let gGrad;
function initHP(){
  const lx=CX-S*0.19,rx=CX+S*0.19;
  gGrad=ctx.createLinearGradient(lx,TY,rx,BY);
  gGrad.addColorStop(0,'rgba(200,220,240,0.08)');gGrad.addColorStop(.5,'rgba(200,220,240,0.015)');gGrad.addColorStop(1,'rgba(200,220,240,0.06)');
  hPath.moveTo(lx,TY);
  hPath.bezierCurveTo(lx-S*0.02,TY+(NY-TY)*0.35,CX-S*0.11,TY+(NY-TY)*0.7,CX-S*0.004,NY);
  hPath.bezierCurveTo(CX-S*0.11,NY+(BY-NY)*0.3,lx-S*0.02,NY+(BY-NY)*0.65,lx,BY);
  hPath.lineTo(rx,BY);
  hPath.bezierCurveTo(rx+S*0.02,NY+(BY-NY)*0.65,CX+S*0.11,NY+(BY-NY)*0.3,CX+S*0.004,NY);
  hPath.bezierCurveTo(CX+S*0.11,TY+(NY-TY)*0.7,rx+S*0.02,TY+(NY-TY)*0.35,rx,TY);
  hPath.closePath();
}

/* ---- Wood frame ---- */
const woodCanvas=document.createElement('canvas');woodCanvas.width=S;woodCanvas.height=S;
const wCtx=woodCanvas.getContext('2d');
function buildWood(){
  const c=wCtx,barH=S*0.065,barX=CX-S*0.28,barW=S*0.56,pillarW=S*0.028;
  const bar=(x,y,w,h,top)=>{
    const g=c.createLinearGradient(x,y,x,y+h);
    if(top){g.addColorStop(0,'#4a3010');g.addColorStop(.1,'#6b4a1a');g.addColorStop(.3,'#8B6914');g.addColorStop(.5,'#7A5C18');g.addColorStop(.7,'#6b4a1a');g.addColorStop(.9,'#5A3A0E');g.addColorStop(1,'#3a2508');}
    else{g.addColorStop(0,'#3a2508');g.addColorStop(.1,'#5A3A0E');g.addColorStop(.3,'#6b4a1a');g.addColorStop(.5,'#7A5C18');g.addColorStop(.7,'#8B6914');g.addColorStop(.9,'#6b4a1a');g.addColorStop(1,'#4a3010');}
    c.fillStyle=g;
    const r=6;c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
    c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);
    c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();c.fill();
    c.strokeStyle='rgba(30,18,5,0.7)';c.lineWidth=1.5;c.stroke();
    c.save();c.clip();
    c.strokeStyle='rgba(50,30,8,0.35)';c.lineWidth=.8;
    for(let gy=y+2;gy<y+h;gy+=2.5+Math.random()*1.5){c.beginPath();c.moveTo(x,gy);for(let gx=x;gx<x+w;gx+=8)c.lineTo(gx,gy+(Math.sin(gx*.05+gy*.1)*1.2)+(Math.random()-.5)*.8);c.stroke();}
    c.strokeStyle='rgba(180,140,70,0.12)';c.lineWidth=.5;
    for(let gy=y+3;gy<y+h;gy+=4+Math.random()*3){c.beginPath();c.moveTo(x,gy);for(let gx=x;gx<x+w;gx+=12)c.lineTo(gx,gy+(Math.sin(gx*.03+gy*.07)*1.5));c.stroke();}
    c.restore();
    c.fillStyle=top?'rgba(255,220,150,0.2)':'rgba(255,220,150,0.1)';c.fillRect(x+4,y+(top?1:h-3),w-8,2);
    c.fillStyle='rgba(0,0,0,0.35)';c.fillRect(x+4,y+(top?h-2:1),w-8,2);
    c.strokeStyle='rgba(0,0,0,0.2)';c.lineWidth=1;c.strokeRect(x+6,y+5,w-12,h-10);
    const bracket=(bx,by)=>{
      const mg=c.createLinearGradient(bx,by,bx+20,by+h);
      mg.addColorStop(0,'#D4A840');mg.addColorStop(.2,'#E8C878');mg.addColorStop(.4,'#C89838');mg.addColorStop(.6,'#B08030');mg.addColorStop(.8,'#E0B860');mg.addColorStop(1,'#A07028');
      c.fillStyle=mg;c.fillRect(bx,by+3,4,h-6);c.fillRect(bx,by+3,16,3);c.fillRect(bx,by+h-6,16,3);
      c.fillStyle='#F0D888';c.beginPath();c.arc(bx+2,by+h/2,1.5,0,Math.PI*2);c.fill();
      c.fillStyle='#C8A050';c.beginPath();c.arc(bx+10,by+6,2,0,Math.PI*2);c.fill();
      c.beginPath();c.arc(bx+10,by+h-6,2,0,Math.PI*2);c.fill();
      c.fillStyle='rgba(255,240,200,0.3)';c.fillRect(bx+1,by+4,1,h-8);
    };
    bracket(x+5,y);c.save();c.translate(x+w,0);c.scale(-1,1);c.translate(-x,0);bracket(x+5,y);c.restore();
  };
  bar(barX,TY-barH+2,barW,barH,true);bar(barX,BY+2,barW,barH,false);
  const pillar=(px,py,pw,ph)=>{
    const pg=c.createLinearGradient(px,0,px+pw,0);
    pg.addColorStop(0,'#3a2508');pg.addColorStop(.15,'#5A3A0E');pg.addColorStop(.35,'#7A5C18');pg.addColorStop(.5,'#8B6914');pg.addColorStop(.65,'#7A5C18');pg.addColorStop(.85,'#5A3A0E');pg.addColorStop(1,'#3a2508');
    c.fillStyle=pg;c.fillRect(px,py,pw,ph);
    c.strokeStyle='rgba(50,30,8,0.3)';c.lineWidth=.5;
    for(let gx=px+1;gx<px+pw;gx+=2){c.beginPath();c.moveTo(gx,py);for(let gy=py;gy<py+ph;gy+=20)c.lineTo(gx+(Math.sin(gy*.03)*.8),gy);c.stroke();}
    c.fillStyle='rgba(255,220,150,0.12)';c.fillRect(px+1,py,2,ph);
    c.fillStyle='rgba(0,0,0,0.25)';c.fillRect(px+pw-2,py,2,ph);
    c.strokeStyle='rgba(30,18,5,0.5)';c.lineWidth=1;c.strokeRect(px,py,pw,ph);
    for(let ry=py+15;ry<py+ph-15;ry+=50){c.fillStyle='rgba(0,0,0,0.15)';c.fillRect(px,ry,pw,2);c.fillStyle='rgba(200,160,80,0.1)';c.fillRect(px,ry+2,pw,1);}
  };
  const pL=barX+S*0.032,pR=barX+barW-S*0.032-pillarW;
  pillar(pL,TY+2,pillarW,BY-TY-2);pillar(pR,TY+2,pillarW,BY-TY-2);
  const foot=(fx,fy)=>{const fg=c.createRadialGradient(fx+12,fy,2,fx+12,fy+5,15);fg.addColorStop(0,'#8B6914');fg.addColorStop(1,'#3a2508');c.fillStyle=fg;c.beginPath();c.ellipse(fx+12,fy+4,14,5,0,0,Math.PI*2);c.fill();c.strokeStyle='rgba(30,18,5,0.6)';c.lineWidth=1;c.stroke();};
  foot(pL-6,BY+barH);foot(pR-6,BY+barH);
}
function drawWood(c){c.drawImage(woodCanvas,0,0);}
function drawGlass(c){
  const lx=CX-S*0.19,rx=CX+S*0.19;
  c.strokeStyle='rgba(180,200,220,0.35)';c.lineWidth=3;
  c.beginPath();
  c.moveTo(lx,TY);c.bezierCurveTo(lx-S*0.02,TY+(NY-TY)*0.35,CX-S*0.11,TY+(NY-TY)*0.7,CX-S*0.004,NY);
  c.moveTo(rx,TY);c.bezierCurveTo(rx+S*0.02,TY+(NY-TY)*0.35,CX+S*0.11,TY+(NY-TY)*0.7,CX+S*0.004,NY);
  c.moveTo(CX-S*0.004,NY);c.bezierCurveTo(CX-S*0.11,NY+(BY-NY)*0.3,lx-S*0.02,NY+(BY-NY)*0.65,lx,BY);
  c.moveTo(CX+S*0.004,NY);c.bezierCurveTo(CX+S*0.11,NY+(BY-NY)*0.3,rx+S*0.02,NY+(BY-NY)*0.65,rx,BY);
  c.stroke();
  c.fillStyle=gGrad;c.fill(hPath);
  c.strokeStyle='rgba(255,255,255,0.15)';c.lineWidth=2;
  c.beginPath();c.moveTo(lx+S*0.02,TY+S*0.04);c.bezierCurveTo(lx+S*0.005,TY+(NY-TY)*0.4,CX-S*0.08,TY+(NY-TY)*0.75,CX-S*0.004,NY-S*0.02);c.stroke();
  c.strokeStyle='rgba(255,255,255,0.08)';c.lineWidth=1.5;
  c.beginPath();c.moveTo(CX-S*0.004,NY+S*0.02);c.bezierCurveTo(CX-S*0.08,NY+(BY-NY)*0.3,lx+S*0.005,NY+(BY-NY)*0.65,lx+S*0.02,BY-S*0.04);c.stroke();
  const sg=c.createRadialGradient(CX-S*0.13,TY+S*0.08,0,CX-S*0.13,TY+S*0.08,S*0.05);
  sg.addColorStop(0,'rgba(255,255,255,0.1)');sg.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=sg;c.fillRect(CX-S*0.18,TY+S*0.03,S*0.1,S*0.1);
}

/* ---- Width / collision ---- */
const wc={};
function getW(y){
  const yr=Math.round(y);if(wc[yr]!==undefined)return wc[yr];
  if(y<TY||y>BY)return wc[yr]=0;
  const hw=S*0.19;let w;
  if(y<=NY){const t=(y-TY)/(NY-TY);w=(hw-hw*0.997*t)+Math.sin(t*Math.PI)*S*0.036;w=Math.max(w,PS*0.5);}
  else{const t=(y-NY)/(BY-NY);w=(hw*0.003+hw*0.997*t)+Math.sin(t*Math.PI)*S*0.036;w=Math.max(w,PS*0.5);}
  return wc[yr]=w;
}
function isIn(x,y){if(y<TY||y>BY)return false;return Math.abs(x-CX)<getW(y);}
function addG(s){const gx=Math.floor(s.x/GS),gy=Math.floor(s.y/GS);if(gx>=0&&gx<GC&&gy>=0&&gy<GR){grid[gy][gx].push(s);s.gx=gx;s.gy=gy;}}
function remG(s){if(s.gx>=0&&s.gy>=0){const c=grid[s.gy][s.gx];for(let i=0;i<c.length;i++)if(c[i]===s){c[i]=c[c.length-1];c.pop();break;}}}
function occ(x,y,ex){const gx=Math.floor(x/GS),gy=Math.floor(y/GS);
  for(let dy=-1;dy<=1;dy++){const cy=gy+dy;if(cy<0||cy>=GR)continue;
    for(let dx=-1;dx<=1;dx++){const cx=gx+dx;if(cx<0||cx>=GC)continue;const cell=grid[cy][cx];
      for(let i=0;i<cell.length;i++){const s=cell[i];if(s!==ex){const ddx=s.x-x;if(ddx>-PS&&ddx<PS){const ddy=s.y-y;if(ddy>-PS&&ddy<PS)return true;}}}}}return false;}

function initSand(){
  const tmp=[];
  for(let y=TY+2;y<NY-2;y+=PS){const w=getW(y);for(let x=CX-w+1;x<CX+w;x+=PS)if(isIn(x,y)&&tmp.length<maxP){tmp.push({x,y,top:true});}}
  for(let i=tmp.length-1;i>0;i--){const j=Math.random()*i|0;[tmp[i],tmp[j]]=[tmp[j],tmp[i]];}
  for(const t of tmp){const s=new Sand(t.x,t.y,t.top);allSand.push(s);addG(s);}
}

const stream=[];

// Pre-rendered sand for flip animation
const flipSandCanvas=document.createElement('canvas');flipSandCanvas.width=S;flipSandCanvas.height=S;
function buildFlipSand(){
  const c=flipSandCanvas.getContext('2d');
  for(let y=TY+2;y<NY-2;y+=PS){
    const w=getW(y);
    for(let x=CX-w+1;x<CX+w;x+=PS){
      if(!isIn(x,y))continue;
      const p=Math.random();
      let r,g,b;
      if(p<0.3){r=210+(Math.random()*35)|0;g=180+(Math.random()*30)|0;b=120+(Math.random()*40)|0;}
      else if(p<0.6){r=190+(Math.random()*40)|0;g=160+(Math.random()*30)|0;b=100+(Math.random()*30)|0;}
      else if(p<0.85){r=230+(Math.random()*25)|0;g=200+(Math.random()*25)|0;b=150+(Math.random()*30)|0;}
      else{r=170+(Math.random()*30)|0;g=140+(Math.random()*25)|0;b=90+(Math.random()*25)|0;}
      const ox=(Math.random()-0.5)*PS*0.6;
      const oy=(Math.random()-0.5)*PS*0.6;
      c.fillStyle=`rgb(${r},${g},${b})`;
      c.beginPath();
      c.arc(x+PS*0.5+ox,y+PS*0.5+oy,PS*0.5+(Math.random()<0.15?0.5:0),0,Math.PI*2);
      c.fill();
    }
  }
}
function easeInOutQuint(t){return t<0.5?16*t*t*t*t*t:1-Math.pow(-2*t+2,5)/2;}

// Flip easing: fast flip with slight overshoot and bounce
function flipEase(t){
  if(t<0.7){const t2=t/0.7;return t2*t2*(3-2*t2);}
  else{const t2=(t-0.7)/0.3;const bounce=Math.sin(t2*Math.PI)*0.04*(1-t2);return 1+bounce;}
}

// Flash state
let flashAlpha=1.0;
const FLASH_DURATION=45;

/* ---- Main loop ---- */
function animate(){
  // ---- FLASH at very start ----
  if(frame<FLASH_DURATION&&flipPhase===0){
    const t=frame/FLASH_DURATION;
    flashAlpha=1-easeInOutQuint(t);
  }

  // ---- FLIP PHASE ----
  if(flipPhase<2){
    ctx.fillStyle='#08070a';ctx.fillRect(0,0,S,S);
    ctx.drawImage(wpCanvas,0,0);

    if(flipPhase===0){
      const t=Math.min(frame/FLIP_DURATION,1);
      flipAngle=Math.PI*(1-flipEase(t));
      if(t>=1){flipPhase=1;frame=0;}
    }else if(flipPhase===1){
      const t=Math.min(frame/SETTLE_DURATION,1);
      flipAngle=Math.sin(t*Math.PI*2)*0.02*(1-t);
      if(t>=1){flipPhase=2;frame=0;initSand();totalTop=allSand.filter(s=>s.top).length;}
    }

    // Draw hourglass with rotation
    ctx.save();
    ctx.translate(CX,CY);
    ctx.rotate(flipAngle);
    ctx.translate(-CX,-CY);
    
    // Draw pre-rendered sand grains in top half
    ctx.save();ctx.clip(hPath);
    ctx.drawImage(flipSandCanvas,0,0);
    ctx.restore();
    
    drawWood(ctx);
    drawGlass(ctx);
    ctx.restore();

    // Warm flash overlay
    if(flashAlpha>0.01){
      const fg=ctx.createRadialGradient(CX,CY,0,CX,CY,S*0.7);
      fg.addColorStop(0,`rgba(255,220,150,${flashAlpha*0.9})`);
      fg.addColorStop(0.4,`rgba(220,170,80,${flashAlpha*0.6})`);
      fg.addColorStop(1,`rgba(180,120,40,${flashAlpha*0.3})`);
      ctx.fillStyle=fg;
      ctx.fillRect(0,0,S,S);
    }

    frame++;
    requestAnimationFrame(animate);
    return;
  }

  // ---- SAND PHASE ----
  let topP=0;for(let i=0;i<allSand.length;i++)if(allSand[i].y<NY)topP++;

  if(zoomPhase===0&&totalTop>0&&topP<totalTop*0.7){
    zoomPhase=1;zoomStart=frame;
    let bot=allSand.filter(s=>s.y>NY+S*0.15);
    if(bot.length>0){bot.sort((a,b)=>Math.abs(a.x-CX)+Math.abs(a.y-(BY-S*0.12))-(Math.abs(b.x-CX)+Math.abs(b.y-(BY-S*0.12))));const tg=bot[Math.min(10,bot.length-1)];zoomTargetX=tg.x;zoomTargetY=tg.y;}
    else{zoomTargetX=CX;zoomTargetY=BY-S*0.15;}
  }
  if(zoomPhase===1){const el=frame-zoomStart,t=Math.min(el/ZOOM_DURATION,1);zoomLevel=Math.exp(easeInOutQuint(t)*Math.log(19));if(t>=1){zoomPhase=2;unzoomStart=frame;}}
  if(zoomPhase===2&&frame-unzoomStart>=UNZOOM_DELAY){zoomPhase=3;unzoomStart=frame;}
  if(zoomPhase===3){
    const el=frame-unzoomStart,t=Math.min(el/UNZOOM_DURATION,1);
    zoomLevel=Math.exp((1-easeInOutQuint(t))*Math.log(19));
    if(t>=1){zoomPhase=4;zoomLevel=1;}
  }

  oc.drawImage(wpCanvas,0,0);
  for(const d of dust){d.x+=d.sx+Math.sin(frame*.01+d.ph)*.1;d.y+=d.sy;if(d.x<0)d.x=S;if(d.x>S)d.x=0;if(d.y<0)d.y=S;if(d.y>S)d.y=0;oc.globalAlpha=d.op*(Math.sin(frame*.03+d.ph)*.5+.5);oc.fillStyle='#d4b896';oc.beginPath();oc.arc(d.x,d.y,d.sz,0,Math.PI*2);oc.fill();}
  oc.globalAlpha=1;
  drawWood(oc);drawGlass(oc);

  if(topP>maxP*.02&&Math.random()<.08){const y=Math.round((NY+Math.random()*8)/PS)*PS,x=Math.round(CX/PS)*PS;if(!occ(x,y,null)&&isIn(x,y)){const p=new Sand(x,y,false);allSand.push(p);addG(p);}}
  if(topP>maxP*.02&&Math.random()<.25){const p=Math.random();let r,g,b;if(p<0.4){r=210+Math.random()*30;g=185+Math.random()*25;b=130+Math.random()*30;}else if(p<0.7){r=195+Math.random()*30;g=165+Math.random()*25;b=110+Math.random()*25;}else{r=225+Math.random()*25;g=200+Math.random()*20;b=145+Math.random()*25;}stream.push({x:CX+(Math.random()-.5)*3,y:NY-8,vy:1.5+Math.random()*2,life:18+Math.random()*12,r:r,g:g,b:b});}
  for(let i=stream.length-1;i>=0;i--){const p=stream[i];p.y+=p.vy;p.vy+=.1;p.life--;if(p.life<=0||p.y>BY){stream.splice(i,1);continue;}oc.globalAlpha=Math.min(p.life/10,1)*.7;oc.fillStyle=`rgb(${p.r|0},${p.g|0},${p.b|0})`;oc.fillRect(p.x,p.y,1.5,2);}
  oc.globalAlpha=1;

  // Physics
  for(let pass=0;pass<3;pass++){
    for(let i=allSand.length-1;i>=0;i--){
      const s=allSand[i];if(s.y>=BY)continue;const bY=s.y+PS;if(bY>BY)continue;let moved=false;
      if(!occ(s.x,bY,s)&&isIn(s.x,bY)){s.y=bY;moved=true;if(s.y>NY&&s.top)s.top=false;}
      else{
        const ly=s.y+PS;
        const goLeft=Math.random()<0.5;
        const ax=goLeft?s.x-PS:s.x+PS,bx=goLeft?s.x+PS:s.x-PS;
        const ca=ly<=BY&&!occ(ax,ly,s)&&isIn(ax,ly);
        const cb=ly<=BY&&!occ(bx,ly,s)&&isIn(bx,ly);
        if(ca){s.x=ax;s.y=ly;moved=true;}
        else if(cb){s.x=bx;s.y=ly;moved=true;}
        if(moved&&s.y>NY&&s.top)s.top=false;
      }
      if(moved){remG(s);addG(s);}
    }
  }
  // Avalanche
  if(frame%2===0){
    for(let i=allSand.length-1;i>=0;i--){
      const s=allSand[i];
      if(!s.top||s.y>=NY)continue;
      if(occ(s.x,s.y-PS,s)&&isIn(s.x,s.y-PS))continue;
      let leftDrop=-1,rightDrop=-1;
      let cx=s.x;
      for(let step=0;step<3;step++){cx-=PS;if(!isIn(cx,s.y)||occ(cx,s.y,s))break;const by2=s.y+PS;if(by2<=BY&&isIn(cx,by2)&&!occ(cx,by2,s)){leftDrop=cx;break;}}
      cx=s.x;
      for(let step=0;step<3;step++){cx+=PS;if(!isIn(cx,s.y)||occ(cx,s.y,s))break;const by2=s.y+PS;if(by2<=BY&&isIn(cx,by2)&&!occ(cx,by2,s)){rightDrop=cx;break;}}
      let target=-1;
      if(leftDrop>=0&&rightDrop>=0){const dl=Math.abs(leftDrop-s.x),dr=Math.abs(rightDrop-s.x);if(dl<dr)target=leftDrop;else if(dr<dl)target=rightDrop;else target=Math.random()<0.5?leftDrop:rightDrop;}
      else if(leftDrop>=0)target=leftDrop;
      else if(rightDrop>=0)target=rightDrop;
      if(target>=0&&Math.random()<0.5){remG(s);s.x=target;addG(s);}
    }
  }

  // Render sand
  const t=Date.now()*.001;let cR=-1,cG=-1,cB=-1;
  const half=PS*0.5;
  for(const s of allSand){s.color(t);if(s.r!==cR||s.g!==cG||s.b!==cB){cR=s.r;cG=s.g;cB=s.b;oc.fillStyle=`rgb(${cR},${cG},${cB})`;}oc.beginPath();oc.arc(s.x+half+s.drawOx,s.y+half+s.drawOy,half+s.sj*0.5,0,Math.PI*2);oc.fill();}

  oc.save();oc.clip(hPath);
  const is2=oc.createRadialGradient(CX,NY,S*0.02,CX,NY,S*0.4);is2.addColorStop(0,'rgba(0,0,0,0)');is2.addColorStop(1,'rgba(0,0,0,0.1)');oc.fillStyle=is2;oc.fillRect(0,0,S,S);oc.restore();
  oc.save();oc.globalCompositeOperation='screen';const al=oc.createRadialGradient(CX-S*0.1,CY-S*0.15,0,CX-S*0.1,CY-S*0.15,S*0.3);al.addColorStop(0,'rgba(60,50,40,0.05)');al.addColorStop(1,'rgba(0,0,0,0)');oc.fillStyle=al;oc.fillRect(0,0,S,S);oc.globalCompositeOperation='source-over';oc.restore();

  ctx.fillStyle='#08070a';ctx.fillRect(0,0,S,S);
  if(zoomLevel>1){
    const zt=Math.min((zoomLevel-1)/17,1),px=CX+(zoomTargetX-CX)*zt,py=CY+(zoomTargetY-CY)*zt;
    ctx.save();ctx.translate(S/2,S/2);ctx.scale(zoomLevel,zoomLevel);ctx.translate(-px,-py);
    ctx.drawImage(offC,0,0);
    if(zoomLevel>5){
      const sa=Math.min((zoomLevel-5)/5,1);
      const vl=px-S/(2*zoomLevel),vr=px+S/(2*zoomLevel),vt=py-S/(2*zoomLevel),vb=py+S/(2*zoomLevel);
      const margin=PS*4;
      for(const s of allSand){
        if(!s.showSkull)continue;
        if(s.x<vl-margin||s.x>vr+margin||s.y<vt-margin||s.y>vb+margin)continue;
        ctx.save();ctx.translate(s.x+PS/2,s.y+PS/2);ctx.rotate(s.skullRot);
        drawSkull(ctx,0,0,PS*3.5,s.br,s.bg,s.bb,sa,s);
        ctx.restore();
      }
    }
    ctx.restore();
    if(zoomLevel>2){const va=Math.min((zoomLevel-2)/8,0.6);const vig=ctx.createRadialGradient(S/2,S/2,S*0.2,S/2,S/2,S*0.55);vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,`rgba(0,0,0,${va})`);ctx.fillStyle=vig;ctx.fillRect(0,0,S,S);}
  }else{
    ctx.drawImage(offC,0,0);
    if(zoomPhase===4){
      const titleAge=frame-unzoomStart-UNZOOM_DURATION;
      if(titleAge>0){
        const ta=Math.min(titleAge/120,0.85);
        ctx.globalAlpha=ta;
        ctx.fillStyle='#c8a882';
        ctx.font=`italic ${S*0.055}px Georgia, serif`;
        ctx.textAlign='center';
        ctx.fillText('we all fall down',CX,S*0.52);
        ctx.globalAlpha=1;
      }
    }
  }

  frame++;requestAnimationFrame(animate);
}

initHP();buildWallpaper();buildWood();buildFlipSand();animate();
</script>
