<script>
/* ══════════════════════════════════════════════
   BACKGROUND — dubnobasswithmyheadman style
══════════════════════════════════════════════ */
(function () {
    const cv = document.getElementById('bg');
    const ctx = cv.getContext('2d');

    let WORDS = ['generative','art','code','retro','visual','loop','signal','wave','drift','pulse'];

    function rnd(a,b){return a+Math.random()*(b-a);}
    function ri(a,b){return Math.floor(rnd(a,b));}
    function pick(arr){return arr[ri(0,arr.length)];}

    let W, H;

    function resize() {
        W = cv.width  = window.innerWidth;
        H = cv.height = window.innerHeight;
    }
    resize();

    function makeOff() {
        const oc = document.createElement('canvas');
        oc.width = W; oc.height = H;
        return oc.getContext('2d');
    }

    function renderDenseZone(o) {
        const nb = ri(1,3);
        for (let b = 0; b < nb; b++) {
            const cx = rnd(W*0.05, W*0.7), cy = rnd(H*0.05, H*0.7);
            const sz = rnd(6,13), lines = ri(6,18);
            const font = Math.random()<0.5 ? 'monospace' : 'sans-serif';
            o.fillStyle = '#000'; o.globalAlpha = 1;
            for (let l = 0; l < lines; l++) {
                const y = cy + l*sz*rnd(0.7,0.9);
                const targetW = rnd(W*0.12, W*0.45);
                let line = '';
                o.font = `bold ${sz}px ${font}`;
                while (o.measureText(line).width < targetW) line += pick(WORDS).replace(/ /g,'');
                const chars = line.split('');
                const spacing = targetW / chars.length;
                for (let i = 0; i < chars.length; i++) o.fillText(chars[i], cx + i*spacing, y);
            }
        }
    }

    function renderText(o) {
        o.clearRect(0,0,W,H);
        const sz = rnd(7,22);
        const font = Math.random()<0.5 ? 'monospace' : 'sans-serif';
        const angle = Math.random()<0.25 ? Math.PI/2 : rnd(-0.06,0.06);
        o.save();
        o.translate(W/2,H/2); o.rotate(angle); o.translate(-W/2,-H/2);
        let y = rnd(-sz*2, sz*2);
        while (y < H+sz*3) {
            let x = rnd(-sz*6, 0);
            const lineH = sz*rnd(0.9,1.3);
            while (x < W+sz*6) {
                const word = pick(WORDS);
                o.font = `${Math.random()<0.35?'bold ':''}${rnd(7,22)}px ${font}`;
                o.fillStyle = '#bbb'; o.globalAlpha = 1;
                o.fillText(word, x, y);
                x += o.measureText(word).width + sz*rnd(0.5,2);
            }
            y += lineH;
        }
        o.restore();
    }

    function renderBlocks(o) {
        o.clearRect(0,0,W,H);
        const nb = ri(2,5);
        for (let b = 0; b < nb; b++) {
            const bx=rnd(0,W*0.75), by=rnd(0,H*0.75);
            const bw=rnd(W*0.15,W*0.5), bh=rnd(H*0.08,H*0.25);
            const sz=rnd(8,18);
            o.fillStyle='#080808'; o.globalAlpha=1;
            for (let ly=by; ly<by+bh+sz; ly+=sz*rnd(0.55,0.75))
                for (let lx=bx; lx<bx+bw+sz*2; lx+=sz*rnd(0.55,0.8)) {
                    o.font=`bold ${sz}px monospace`;
                    o.fillText(pick(WORDS).charAt(ri(0,6)), lx, ly);
                }
        }
        renderDenseZone(o);
    }

    let circlePhase = 0;
    function renderCircles(o) {
        o.clearRect(0,0,W,H);
        const nb=ri(3,6);
        for (let ci=0; ci<nb; ci++) {
            const cx=rnd(W*0.1,W*0.9), cy=rnd(H*0.1,H*0.9);
            const r=rnd(Math.min(W,H)*0.04, Math.min(W,H)*0.28);
            const sz=rnd(7,16);
            const word=(pick(WORDS)+' '+pick(WORDS)+' ').toUpperCase();
            const rings=ri(1,5);
            for (let ring=0; ring<rings; ring++) {
                const rr=r+ring*sz*rnd(0.9,1.6);
                const type=Math.random();
                if (type<0.35) {
                    const cc=Math.floor((2*Math.PI*rr)/(sz*0.58));
                    o.font=`${Math.random()<0.6?'bold ':''}${sz}px monospace`;
                    o.fillStyle='#080808'; o.globalAlpha=1;
                    for (let i=0;i<cc;i++) {
                        const angle=(i/cc)*Math.PI*2+circlePhase;
                        o.save(); o.translate(cx,cy); o.rotate(angle-Math.PI/2);
                        o.fillText(word[i%word.length],0,-rr); o.restore();
                    }
                } else if (type<0.55) {
                    const sA=rnd(0,Math.PI*2), eA=sA+rnd(Math.PI*0.3,Math.PI*2);
                    o.beginPath(); o.arc(cx,cy,rr,sA,eA);
                    o.strokeStyle='#080808'; o.lineWidth=rnd(0.5,3);
                    o.globalAlpha=rnd(0.5,1); o.stroke();
                } else if (type<0.72) {
                    const sA=rnd(0,Math.PI*2), span=rnd(Math.PI*0.3,Math.PI*1.5);
                    const cc=Math.floor((span*rr)/(sz*0.58));
                    o.font=`${Math.random()<0.6?'bold ':''}${sz}px monospace`;
                    o.fillStyle='#000'; o.globalAlpha=1;
                    for (let i=0;i<cc;i++) {
                        const angle=sA+(i/cc)*span+circlePhase;
                        o.save(); o.translate(cx,cy); o.rotate(angle-Math.PI/2);
                        o.fillText(word[i%word.length],0,-rr); o.restore();
                    }
                } else {
                    const sA=rnd(0,Math.PI*2), span=rnd(Math.PI*0.2,Math.PI*0.9);
                    const cc=Math.floor((span*rr)/(sz*0.3));
                    o.font=`bold ${sz}px monospace`; o.fillStyle='#000'; o.globalAlpha=1;
                    for (let i=0;i<cc;i++) {
                        const angle=sA+(i/cc)*span+circlePhase;
                        o.save(); o.translate(cx,cy); o.rotate(angle-Math.PI/2);
                        for (let d=-sz*0.5;d<sz*0.5;d+=sz*0.25) o.fillText(word[i%word.length],0,-rr+d);
                        o.restore();
                    }
                }
            }
        }
        o.globalAlpha=1;
    }

    function renderScribbles(o) {
        o.clearRect(0,0,W,H);
        const nb=ri(4,9);
        for (let s=0;s<nb;s++) {
            const isW=Math.random()<0.35;
            o.strokeStyle=isW?'#fff':'#000'; o.fillStyle=isW?'#fff':'#000';
            o.lineWidth=rnd(0.5,4); o.globalAlpha=rnd(0.5,1);
            o.lineCap='round'; o.lineJoin='round';
            const type=Math.random();
            const sx=rnd(0,W), sy=rnd(0,H);
            if (type<0.3) {
                o.beginPath(); o.moveTo(sx,sy);
                const steps=ri(6,20);
                for (let i=0;i<steps;i++) {
                    o.quadraticCurveTo(sx+rnd(-W*0.3,W*0.3),sy+rnd(-H*0.3,H*0.3),
                                       sx+rnd(-W*0.35,W*0.35),sy+rnd(-H*0.35,H*0.35));
                }
                o.stroke();
            } else if (type<0.55) {
                const hx=rnd(0,W*0.7),hy=rnd(0,H*0.7),hw=rnd(W*0.05,W*0.3),hh=rnd(H*0.05,H*0.2);
                const gap=rnd(2,8);
                o.beginPath(); let tog=false;
                for (let yl=hy;yl<hy+hh;yl+=gap) {
                    o.moveTo(tog?hx+hw:hx,yl); o.lineTo(tog?hx:hx+hw,yl+gap*rnd(0.3,0.7));
                    tog=!tog;
                }
                o.stroke();
            } else if (type<0.72) {
                const maxR=rnd(W*0.03,W*0.18), turns=rnd(1.5,5), steps=ri(60,180);
                o.beginPath();
                for (let i=0;i<=steps;i++) {
                    const t=i/steps, angle=t*turns*Math.PI*2, r=t*maxR;
                    const px=sx+Math.cos(angle)*r, py=sy+Math.sin(angle)*r;
                    i===0?o.moveTo(px,py):o.lineTo(px,py);
                }
                o.stroke();
            } else if (type<0.86) {
                o.beginPath(); o.moveTo(sx,sy);
                const pts=ri(4,12);
                for (let i=0;i<pts;i++) o.lineTo(sx+rnd(-W*0.4,W*0.4),sy+rnd(-H*0.4,H*0.4));
                o.stroke();
            } else {
                o.beginPath();
                const bpts=ri(5,10), br=rnd(W*0.01,W*0.06);
                for (let i=0;i<=bpts;i++) {
                    const angle=(i/bpts)*Math.PI*2, r=br*rnd(0.5,1.4);
                    const px=sx+Math.cos(angle)*r, py=sy+Math.sin(angle)*r;
                    i===0?o.moveTo(px,py):o.lineTo(px,py);
                }
                o.closePath(); o.stroke();
            }
        }
        o.globalAlpha=1;
    }

    let layers;
    function initLayers() {
        layers = {
            text:      {cur:makeOff(), prev:makeOff(), alpha:0, blending:false},
            blocks:    {cur:makeOff(), prev:makeOff(), alpha:0, blending:false},
            circles:   {cur:makeOff(), prev:makeOff(), alpha:0, blending:false},
            scribbles: {cur:makeOff(), prev:makeOff(), alpha:0, blending:false},
        };
    }
    initLayers();

    window.addEventListener('resize', () => { resize(); initLayers(); init(); });

    function startBlend(key, fn) {
        const s = layers[key];
        if (s.blending) return;
        s.prev.clearRect(0,0,W,H); s.prev.drawImage(s.cur.canvas,0,0);
        fn(s.cur); s.alpha=0; s.blending=true;
    }

    function composite() {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0,0,W,H);
        for (const key of ['text','blocks','circles','scribbles']) {
            const s = layers[key];
            if (!s.cur.canvas.width || !s.cur.canvas.height) continue;
            if (s.blending) {
                ctx.globalAlpha = 1-s.alpha; ctx.drawImage(s.prev.canvas,0,0);
                ctx.globalAlpha = s.alpha;   ctx.drawImage(s.cur.canvas,0,0);
                s.alpha = Math.min(1, s.alpha+0.012);
                if (s.alpha>=1) s.blending=false;
            } else {
                ctx.globalAlpha=1; ctx.drawImage(s.cur.canvas,0,0);
            }
        }
        ctx.globalAlpha=1;
    }

    function init() {
        renderText(layers.text.cur);
        renderBlocks(layers.blocks.cur);
        renderCircles(layers.circles.cur);
        renderScribbles(layers.scribbles.cur);
    }
    init();

    let frame=0;
    let paused = false;
    function loop() {
        if (!paused) {
            frame++;
            if (frame%20===0) startBlend('text', renderText);
            if (frame%40===0) startBlend('blocks', renderBlocks);
            if (frame%5===0)  { circlePhase+=0.015; startBlend('circles', renderCircles); }
            if (frame%55===0) startBlend('scribbles', renderScribbles);
            composite();
        }
        requestAnimationFrame(loop);
    }
    loop();

    window.__setBgWords = (w) => { WORDS = w; };
    window.__pauseBg = (p) => { paused = p; };
})();

let artworks = [];
let filteredArtworks = [];
let currentIndex = -1;
const cacheBuster = Date.now();

document.getElementById('year').textContent = new Date().getFullYear();

const gallery        = document.getElementById('gallery');
const searchInput    = document.getElementById('search');
const searchCounter  = document.getElementById('searchCounter');
const randomBtn      = document.getElementById('randomBtn');
const modal          = document.getElementById('modal');
const modalTitle     = document.getElementById('modalTitle');
const modalIframe    = document.getElementById('modalIframe');
const sourcePanel    = document.getElementById('sourcePanel');
const sourceCode     = document.getElementById('sourceCode');
const sourceBtn      = document.getElementById('sourceBtn');
const closeBtn       = document.getElementById('closeBtn');
const copyBtn        = document.getElementById('copyBtn');
const prevBtn        = document.getElementById('prevBtn');
const nextBtn        = document.getElementById('nextBtn');
let currentSource = '';

fetch(`artworks.json?v=${cacheBuster}`)
    .then(r => r.json())
    .then(data => {
        artworks = data;
        artworks.forEach(a => {
            a.url = `artworks/${a.id}.html`;
            a.thumb = `screenshots/${a.id}.png`;
        });
        const words = new Set();
        artworks.forEach(a => {
            words.add(a.title);
            a.title.split(/\s+/).forEach(w => { if (w.length > 1) words.add(w); });
        });
        if (window.__setBgWords) window.__setBgWords(Array.from(words));
        filteredArtworks = artworks.slice();
        document.getElementById('count').textContent = artworks.length;
        renderGallery();
        checkDirectLink();
    });

function updateCounter() {
    const total = artworks.length;
    const shown = filteredArtworks.length;
    searchCounter.textContent = shown === total ? `${total}` : `${shown} / ${total}`;
}

function renderGallery() {
    gallery.innerHTML = '';
    updateCounter();
    if (filteredArtworks.length === 0) {
        gallery.innerHTML = '<div class="no-results">No canvas found</div>';
        return;
    }
    filteredArtworks.forEach((art, idx) => {
        const total = filteredArtworks.length;
        const card = document.createElement('article');
        card.className = 'art-card';
        card.innerHTML = `
            <div class="art-thumb">
                <div class="art-thumb-placeholder"></div>
                <img src="${art.thumb}" alt="${art.title}" loading="lazy"
                     onload="this.classList.add('loaded'); this.previousElementSibling.style.display='none';"
                     onerror="this.style.display='none'; this.previousElementSibling.style.animation='none'; this.previousElementSibling.style.background='#f4f4f4'; this.previousElementSibling.textContent='No preview';">
            </div>
            <div class="art-info">
                <div class="art-title">${art.title}</div>
                <div class="art-index">#${String(total - idx).padStart(3, '0')}</div>
            </div>
        `;
        card.addEventListener('click', () => openArt(idx));
        gallery.appendChild(card);
    });
}

searchInput.addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    filteredArtworks = q
        ? artworks.filter(a => a.title.toLowerCase().includes(q) || a.id.toLowerCase().includes(q))
        : artworks.slice();
    renderGallery();
});

function openArt(idx) {
    currentIndex = idx;
    const art = filteredArtworks[idx];
    modalTitle.textContent = art.title;
    modalIframe.src = art.url;
    modalIframe.title = art.title;
    modal.classList.add('active');
    sourcePanel.classList.remove('active');
    sourceBtn.textContent = 'View Source';
    loadSource(art.url);
    history.replaceState(null, '', `?id=${art.id}`);
    document.title = `${art.title} · Intarynx's Gallery`;
    updateNavButtons();
    if (window.__pauseBg) window.__pauseBg(true);
}

function closeArt() {
    modal.classList.remove('active');
    modalIframe.src = '';
    sourcePanel.classList.remove('active');
    currentIndex = -1;
    history.replaceState(null, '', window.location.pathname);
    document.title = "Intarynx's Gallery - Generative Canvas at the Edge of Algorithms & Aesthetics";
    if (window.__pauseBg) window.__pauseBg(false);
}

function navigate(dir) {
    const newIdx = currentIndex + dir;
    if (newIdx >= 0 && newIdx < filteredArtworks.length) openArt(newIdx);
}

function updateNavButtons() {
    prevBtn.disabled = currentIndex <= 0;
    nextBtn.disabled = currentIndex >= filteredArtworks.length - 1;
}

function toggleSource() {
    sourcePanel.classList.toggle('active');
    sourceBtn.textContent = sourcePanel.classList.contains('active') ? 'Hide Source' : 'View Source';
}

async function loadSource(url) {
    try {
        const r = await fetch(url);
        currentSource = await r.text();
        sourceCode.textContent = currentSource;
    } catch { sourceCode.textContent = '// Unable to load source'; }
}

function copySource() {
    navigator.clipboard.writeText(currentSource).then(() => {
        const t = copyBtn.textContent;
        copyBtn.textContent = 'Copied!';
        setTimeout(() => { copyBtn.textContent = t; }, 2000);
    });
}

function checkDirectLink() {
    const id = new URLSearchParams(window.location.search).get('id');
    const idx = artworks.findIndex(a => a.id === id);
    if (idx !== -1) openArt(idx);
}

sourceBtn.addEventListener('click', toggleSource);
closeBtn.addEventListener('click', closeArt);
copyBtn.addEventListener('click', copySource);
prevBtn.addEventListener('click', () => navigate(-1));
nextBtn.addEventListener('click', () => navigate(1));

const mobileSourceBtn = document.getElementById('mobileSourceBtn');
const mobileCopyBtn = document.getElementById('mobileCopyBtn');
const mobileSourceLabel = document.getElementById('mobileSourceLabel');
mobileSourceBtn.addEventListener('click', () => {
    toggleSource();
    mobileSourceLabel.textContent = sourcePanel.classList.contains('active') ? 'Hide Source' : 'View Source';
});
mobileCopyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(currentSource).then(() => {
        const i = mobileCopyBtn.innerHTML;
        mobileCopyBtn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
        setTimeout(() => { mobileCopyBtn.innerHTML = i; }, 2000);
    });
});

randomBtn.addEventListener('click', () => {
    if (filteredArtworks.length === 0) return;
    const idx = Math.floor(Math.random() * filteredArtworks.length);
    openArt(idx);
});
document.addEventListener('keydown', e => {
    if (!modal.classList.contains('active')) return;
    if (e.key === 'Escape') closeArt();
    else if (e.key === 'ArrowLeft') navigate(-1);
    else if (e.key === 'ArrowRight') navigate(1);
});
</script>
</body>
</html>
